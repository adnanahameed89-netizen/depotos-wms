      for (const r of openingReport.valid) {
        let binId = null;
        if (r.binCode) {
          if (!binCache[r.binCode]) {
            let existing = Object.values(bins).find(b => b.code.toLowerCase() === r.binCode.toLowerCase());
            if (!existing) {
              const created = await sb(`/rest/v1/bins`, { method: "POST", token, prefer: "return=representation", body: { warehouse_id: profile.warehouse_id, code: r.binCode } });
              existing = created[0];
            }
            binCache[r.binCode] = existing;
          }
          binId = binCache[r.binCode].id;
        }
        await addOnHand(token, profile.warehouse_id, r.product.id, binId, r.qty);
        await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "inventory", entity_id: r.product.id, user_id: profile.id, action: "opening_stock_import", metadata: { qty: r.qty, bin: r.binCode || null } } });
        count++;
      }
      showToast(`${count} opening stock lines imported`);
      setOpeningReport(null);
      loadAll();
    } catch (e) { showToast("Import failed", "err"); }
    setImporting(false);
  };

  useEffect(() => { loadAll(); }, [loadAll]);

  const q = query.trim().toLowerCase();

  // Ledger: aggregate on_hand per product across all bins, minus reserved = net available
  const ledger = (() => {
    const byProduct = {};
    for (const r of rows) {
      if (!byProduct[r.product_id]) byProduct[r.product_id] = 0;
      byProduct[r.product_id] += r.on_hand;
    }
    return Object.entries(byProduct).map(([productId, onHand]) => {
      const res = reserved[productId] || 0;
      return { productId, onHand, reserved: res, available: onHand - res };
    }).filter(r => {
      const p = products[r.productId];
      if (!q) return true;
      return (p?.barcode || "").toLowerCase().includes(q) || (p?.name || "").toLowerCase().includes(q);
    }).sort((a, b) => (products[b.productId]?.name || "").localeCompare(products[a.productId]?.name || ""));
  })();

  const binRows = rows.filter(r => {
    const p = products[r.product_id];
    if (!q) return true;
    return (p?.barcode || "").toLowerCase().includes(q) || (p?.name || "").toLowerCase().includes(q);
  });

  return (
    <div>
      <SectionTitle title="Inventory" action={
        canImport ? (
          <label style={{ ...S.secondaryBtnSm, cursor: "pointer" }}>
            {importing ? "Importing…" : "📤 Import Opening Stock"}
            <input type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={handleOpeningStockFile} disabled={importing} />
          </label>
        ) : null
      } />
      {openingReport && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Opening Stock — validation report ({openingReport.fileName})</div>
          <div style={{ display: "flex", gap: 20, marginBottom: 12 }}>
            <div><span style={{ color: "#4CAF7D", fontWeight: 700, fontSize: 18 }}>{openingReport.valid.length}</span> <span style={{ color: "#6B6355", fontSize: 12 }}>valid</span></div>
            <div><span style={{ color: "#E5484D", fontWeight: 700, fontSize: 18 }}>{openingReport.invalid.length}</span> <span style={{ color: "#6B6355", fontSize: 12 }}>invalid (skipped)</span></div>
          </div>
          {openingReport.invalid.length > 0 && (
            <div style={{ fontSize: 11, color: "#E5484D", marginBottom: 10 }}>
              Row(s): {openingReport.invalid.slice(0, 15).map(r => `#${r.rowNum} (${r.barcode || "no barcode"})`).join(", ")}{openingReport.invalid.length > 15 ? "…" : ""}
            </div>
          )}
          <div style={{ display: "flex", gap: 10 }}>
            <button style={S.primaryBtnSm} onClick={confirmOpeningStock} disabled={importing || openingReport.valid.length === 0}>✓ Confirm & add stock ({openingReport.valid.length})</button>
            <button style={S.secondaryBtnSm} onClick={() => setOpeningReport(null)}>Cancel</button>
          </div>
        </div>
      )}
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <button onClick={() => setTab("ledger")} style={{ ...S.pill, ...(tab === "ledger" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>📒 Inventory Ledger</button>
        <button onClick={() => setTab("bins")} style={{ ...S.pill, ...(tab === "bins" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>🗺 Bin-wise Inventory</button>
      </div>
      <input style={{ ...S.input, maxWidth: 340, marginBottom: 14 }} placeholder="🔍 Search by barcode or product name…" value={query} onChange={e => setQuery(e.target.value)} />

      {tab === "ledger" && (
        <div style={S.panel}>
          <table>
            <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>On Hand</th><th style={S.th}>Reserved</th><th style={S.th}>Net Available</th></tr></thead>
            <tbody>
              {ledger.map(r => {
                const p = products[r.productId];
                return (
                  <tr key={r.productId}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                    <td style={S.td}>{p?.name || "—"}</td>
                    <td style={{ ...S.td, color: "#6B6355" }}>{r.onHand}</td>
                    <td style={{ ...S.td, color: r.reserved > 0 ? "#E5484D" : "#6B6355" }}>{r.reserved}</td>
                    <td style={{ ...S.td, color: "#4CAF7D", fontWeight: 600 }}>{r.available}</td>
                  </tr>
                );
              })}
              {ledger.length === 0 && <tr><td colSpan={5}><EmptyNote text="No inventory recorded yet." /></td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {tab === "bins" && (
        <div style={S.panel}>
          <table>
            <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Bin</th><th style={S.th}>On Hand (this bin)</th><th style={S.th}>Reserved against order?</th></tr></thead>
            <tbody>
              {binRows.map((r, i) => {
                const p = products[r.product_id];
                const bin = bins[r.bin_id];
                const productReserved = reserved[r.product_id] || 0;
                return (
                  <tr key={i}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                    <td style={S.td}>{p?.name || "—"}</td>
                    <td style={{ ...S.td, color: "#6B6355" }}>{bin?.code || "Unassigned (awaiting putaway)"}</td>
                    <td style={S.td}>{r.on_hand}</td>
                    <td style={S.td}>
                      {productReserved > 0
                        ? <span style={{ ...S.badgeSm, color: "#E5484D", borderColor: "#E5484D" }}>Yes · {productReserved} reserved (product-wide)</span>
                        : <span style={{ ...S.badgeSm, color: "#4CAF7D", borderColor: "#4CAF7D" }}>No</span>}
                    </td>
                  </tr>
                );
              })}
              {binRows.length === 0 && <tr><td colSpan={5}><EmptyNote text="No inventory recorded yet." /></td></tr>}
            </tbody>
          </table>
          <div style={{ marginTop: 10, fontSize: 11, color: "#8A8272" }}>
            ⚠ Reservation abhi product-level track hoti hai (jis bin se picking suggest hui hai wahi highlight ho sakti hai, exact bin-split system abhi nahi hai).
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= SALES ORDERS ================= */
function OrdersView({ token, profile, showToast }) {
  const [orders, setOrders] = useState([]);
  const [productCache, setProductCache] = useState({});
  const [showForm, setShowForm] = useState(false);
  const [extId, setExtId] = useState("");
  const [courier, setCourier] = useState("Postex");
  const [items, setItems] = useState([]);
  const [pendingProduct, setPendingProduct] = useState(null);
  const [lineQty, setLineQty] = useState(1);
  const [openOrder, setOpenOrder] = useState(null);
  const [openLines, setOpenLines] = useState([]);
  const [openEvents, setOpenEvents] = useState([]);
  const [openShortages, setOpenShortages] = useState([]);
  const [orderTimingSummary, setOrderTimingSummary] = useState(null);
  const [editTracking, setEditTracking] = useState("");
  const [editCourier, setEditCourier] = useState("");
  const [editQty, setEditQty] = useState({});
  const [statusFilter, setStatusFilter] = useState(null);
  const [lineStats, setLineStats] = useState({});
  const [profiles, setProfiles] = useState({});
  const [importing, setImporting] = useState(false);
  const [importSummary, setImportSummary] = useState(null);
  const [ordersReport, setOrdersReport] = useState(null);
  const [selectedOrders, setSelectedOrders] = useState({});
  const [totes, setTotes] = useState([]);
  const [pickers, setPickers] = useState([]);
  const [bulkToteId, setBulkToteId] = useState("");
  const [bulkPickerId, setBulkPickerId] = useState("");
  const [bulkBusy, setBulkBusy] = useState(false);

  const load = useCallback(async () => {
    try {
      const o = await sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=*&order=received_at.desc`, { token });
      setOrders(o || []);
      const profs = await sb(`/rest/v1/profiles?select=*`, { token }) || [];
      setProfiles(Object.fromEntries(profs.map(u => [u.id, u])));
      setPickers(profs.filter(u => ["picker", "packer"].includes(u.role) && u.warehouse_id === profile.warehouse_id));
      setTotes(await sb(`/rest/v1/totes?warehouse_id=eq.${profile.warehouse_id}&status=eq.open&select=*`, { token }) || []);
      const ids = (o || []).map(x => x.id);
      if (ids.length) {
        const allLines = await sb(`/rest/v1/sales_order_lines?order_id=in.(${ids.join(",")})&select=order_id,qty`, { token });
        const stats = {};
        for (const l of allLines || []) {
          if (!stats[l.order_id]) stats[l.order_id] = { count: 0, qty: 0 };
          stats[l.order_id].count += 1; stats[l.order_id].qty += l.qty;
        }
        setLineStats(stats);
      }
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const receivedOrders = orders.filter(o => o.status === "received");
  const [skuFilter, setSkuFilter] = useState("all");
  const orderSkuType = (orderId) => {
    const c = lineStats[orderId]?.count || 0;
    return c === 1 ? "single" : "multi";
  };
  const filteredReceived = receivedOrders.filter(o => skuFilter === "all" || orderSkuType(o.id) === skuFilter);
  const singleCount = receivedOrders.filter(o => orderSkuType(o.id) === "single").length;
  const multiCount = receivedOrders.filter(o => orderSkuType(o.id) === "multi").length;
  const selectedCount = Object.values(selectedOrders).filter(Boolean).length;
  const toggleAll = (checked) => setSelectedOrders(Object.fromEntries(filteredReceived.map(o => [o.id, checked])));

  const bulkReserveAndAssign = async () => {
    const ids = Object.keys(selectedOrders).filter(k => selectedOrders[k]);
    if (ids.length === 0 || ids.length > 15) { showToast("1 se 15 orders select karein", "err"); return; }
    if (!bulkToteId || !bulkPickerId) { showToast("Tote aur Picker select karein", "err"); return; }
    setBulkBusy(true);
    try {
      const okOrders = [];
      const shortOrders = [];
      for (const orderId of ids) {
        const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${orderId}&select=*`, { token });
        const summaries = [];
        let anyShort = false;
        for (const l of lines) {
          const summary = await getStockSummary(token, profile.warehouse_id, l.product_id);
          summaries.push({ line: l, summary });
          if (summary.available < l.qty) anyShort = true;
        }
        if (anyShort) shortOrders.push({ orderId, summaries });
        else okOrders.push({ orderId, summaries });
      }

      for (const { orderId, summaries } of shortOrders) {
        await sb(`/rest/v1/order_shortage_lines?order_id=eq.${orderId}`, { method: "DELETE", token });
        for (const { line, summary } of summaries) {
          const notAvail = Math.max(0, line.qty - summary.available);
          if (notAvail > 0) {
            await sb(`/rest/v1/order_shortage_lines`, { method: "POST", token, body: { order_id: orderId, product_id: line.product_id, qty_required: line.qty, qty_available: summary.available, not_available_qty: notAvail } });
          }
        }
        await sb(`/rest/v1/sales_orders?id=eq.${orderId}`, { method: "PATCH", token, body: { status: "incomplete" } });
        await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: orderId, user_id: profile.id, action: "marked_incomplete" } });
      }

      if (okOrders.length === 0) {
        showToast(`Sab select kiye orders 'Incomplete' hain (stock short) — koi tote assign nahi hui`, "err");
        setSelectedOrders({}); load(); setBulkBusy(false); return;
      }

      await sb(`/rest/v1/totes?id=eq.${bulkToteId}`, { method: "PATCH", token, body: { status: "picking", assigned_to: bulkPickerId } });
      let binNum = 1;
      for (const { orderId, summaries } of okOrders) {
        const lineBins = {};
        for (const { line, summary } of summaries) {
          const bestBin = [...summary.rows].sort((a, b) => b.on_hand - a.on_hand)[0];
          lineBins[line.product_id] = bestBin ? bestBin.bin_id : null;
          await adjustReserved(token, profile.warehouse_id, line.product_id, line.qty);
        }
        const pt = await sb(`/rest/v1/pick_tasks`, { method: "POST", token, prefer: "return=representation", body: { order_id: orderId, status: "assigned", tote_id: bulkToteId, assigned_to: bulkPickerId, assigned_at: new Date().toISOString(), tote_bin_number: binNum } });
        binNum++;
        for (const { line } of summaries) {
          await sb(`/rest/v1/pick_task_lines`, { method: "POST", token, body: { pick_task_id: pt[0].id, product_id: line.product_id, qty_required: line.qty, bin_id: lineBins[line.product_id] || null } });
        }
        await sb(`/rest/v1/sales_orders?id=eq.${orderId}`, { method: "PATCH", token, body: { status: "queued" } });
        await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: orderId, user_id: profile.id, action: "reserved_and_assigned_to_tote" } });
      }
      showToast(`${okOrders.length} orders assigned${shortOrders.length ? `, ${shortOrders.length} 'Incomplete' tab mein chale gaye (stock short)` : ""}`);
      setSelectedOrders({}); setBulkToteId(""); setBulkPickerId("");
      load();
    } catch (e) { showToast(`Assign failed: ${(e.message || "").slice(0, 100)}`, "err"); }
    setBulkBusy(false);
  };

  const addLine = () => {
    if (!pendingProduct) { showToast("Product select karein", "err"); return; }
    if (lineQty <= 0) return;
    setItems([...items, { product_id: pendingProduct.id, barcode: pendingProduct.barcode, name: pendingProduct.name, qty: Number(lineQty) }]);
    setPendingProduct(null); setLineQty(1);
  };

  const createOrder = async () => {
    if (!extId.trim()) { showToast("Order ID likhein", "err"); return; }
    if (items.length === 0) { showToast("Pehle '+ Add line' se product add karein", "err"); return; }
    try {
      const created = await sb(`/rest/v1/sales_orders`, {
        method: "POST", token, prefer: "return=representation",
        body: { external_order_id: extId.trim(), courier, warehouse_id: profile.warehouse_id, status: "received" }
      });
      const order = created[0];
      for (const it of items) {
        await sb(`/rest/v1/sales_order_lines`, { method: "POST", token, body: { order_id: order.id, product_id: it.product_id, qty: it.qty } });
      }
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: order.id, user_id: profile.id, action: "created" } });
      setExtId(""); setItems([]); setShowForm(false);
      showToast("Order created"); load();
    } catch (e) {
      let detail = e.message || "";
      try { const parsed = JSON.parse(detail); detail = parsed.message || parsed.hint || detail; } catch {}
      showToast(`Order create failed: ${detail.slice(0, 120)}`, "err");
    }
  };

  const handleOrdersFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImporting(true); setImportSummary(null); setOrdersReport(null);
    try {
      const rows = await parseSheet(file);
      if (rows.length === 0) { showToast("File khali hai", "err"); setImporting(false); return; }
      const map = buildColumnMap(Object.keys(rows[0]));
      if (!map.barcode || !map.orderRef) { showToast("Barcode ya Order/Tracking column nahi mila", "err"); setImporting(false); return; }

      const fileBarcodes = rows.map(r => getVal(r, map, "barcode"));
      const productMap = await fetchProductsByBarcodes(token, fileBarcodes);

      // orders already imported (whole order, not per-line) count as duplicates
      const fileRefs = [...new Set(rows.map(r => cleanCode(getVal(r, map, "orderRef"))).filter(Boolean))];
      const existing = fileRefs.length ? await sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&external_order_id=in.(${fileRefs.map(encodeURIComponent).join(",")})&select=external_order_id`, { token }) : [];
      const existingOrderSet = new Set((existing || []).map(o => o.external_order_id));
      const existingGroupLines = {};
      for (const row of rows) {
        const ref = cleanCode(getVal(row, map, "orderRef"));
        const bc = cleanCode(getVal(row, map, "barcode"));
        if (ref && existingOrderSet.has(ref)) existingGroupLines[`${ref}|${bc}`] = true;
      }

      const report = validateImportRows(rows, map, productMap, "orderRef", existingGroupLines);
      const extra = {}; // per-order courier/customer captured from first valid row of each group
      for (const r of report.validRows) {
        if (!extra[r.groupVal]) {
          const srcRow = rows.find(row => cleanCode(getVal(row, map, "orderRef")) === r.groupVal);
          extra[r.groupVal] = {
            courier: String(getVal(srcRow, map, "courier") || "Other").trim(),
            customer: getVal(srcRow, map, "customer") || null,
            customerOrderNumber: getVal(srcRow, map, "customerOrderNumber") || null,
            invoiceDate: getVal(srcRow, map, "invoiceDate") || null,
            grossAmount: getVal(srcRow, map, "grossAmount") || null
          };
        }
      }
      setOrdersReport({ report, extra });
      showToast(`Validated: ${report.validRows.length} valid, ${report.invalidRows.length} invalid`);
    } catch (err) { showToast(`Validation failed: ${(err.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  const confirmOrdersImport = async () => {
    if (!ordersReport) return;
    setImporting(true);
    try {
      const groups = {};
      for (const r of ordersReport.report.validRows) {
        if (!groups[r.groupVal]) groups[r.groupVal] = [];
        groups[r.groupVal].push(r);
      }
      let ordersCreated = 0, linesAdded = 0;
      for (const [ref, groupRows] of Object.entries(groups)) {
        const meta = ordersReport.extra[ref] || {};
        const created = await sb(`/rest/v1/sales_orders`, {
          method: "POST", token, prefer: "return=representation",
          body: { external_order_id: ref, courier: meta.courier || "Other", warehouse_id: profile.warehouse_id, status: "received", raw_data: { customer: meta.customer || null, customer_order_number: meta.customerOrderNumber || null, invoice_date: meta.invoiceDate || null, gross_amount: meta.grossAmount || null } }
        });
        const orderId = created[0].id;
        ordersCreated++;
        for (const r of groupRows) {
          await sb(`/rest/v1/sales_order_lines`, { method: "POST", token, body: { order_id: orderId, product_id: r.product.id, qty: r.qty } });
          linesAdded++;
        }
        await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: orderId, user_id: profile.id, action: "created_bulk_import" } });
      }
      setImportSummary(`${ordersCreated} order(s) created, ${linesAdded} lines added.`);
      showToast(`Import done — ${ordersCreated} orders, ${linesAdded} lines`);
      setOrdersReport(null);
      load();
    } catch (err) { showToast(`Import failed: ${(err.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  const reserveAndQueue = async (order) => {
    try {
      const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${order.id}&select=*`, { token });
      const summaries = [];
      let anyShort = false;
      for (const l of lines) {
        const summary = await getStockSummary(token, profile.warehouse_id, l.product_id);
        summaries.push({ line: l, summary });
        if (summary.available < l.qty) anyShort = true;
      }

      if (anyShort) {
        await sb(`/rest/v1/order_shortage_lines?order_id=eq.${order.id}`, { method: "DELETE", token });
        for (const { line, summary } of summaries) {
          const notAvail = Math.max(0, line.qty - summary.available);
          if (notAvail > 0) {
            await sb(`/rest/v1/order_shortage_lines`, { method: "POST", token, body: { order_id: order.id, product_id: line.product_id, qty_required: line.qty, qty_available: summary.available, not_available_qty: notAvail } });
          }
        }
        await sb(`/rest/v1/sales_orders?id=eq.${order.id}`, { method: "PATCH", token, body: { status: "incomplete" } });
        await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: order.id, user_id: profile.id, action: "marked_incomplete" } });
        showToast("Stock kam hai — order 'Incomplete' tab mein chala gaya", "err");
        load();
        return;
      }

      const lineBins = {};
      for (const { line, summary } of summaries) {
        const bestBin = [...summary.rows].sort((a, b) => b.on_hand - a.on_hand)[0];
        lineBins[line.product_id] = bestBin ? bestBin.bin_id : null;
        await adjustReserved(token, profile.warehouse_id, line.product_id, line.qty);
      }
      const pt = await sb(`/rest/v1/pick_tasks`, { method: "POST", token, prefer: "return=representation", body: { order_id: order.id, status: "queued" } });
      for (const { line } of summaries) {
        await sb(`/rest/v1/pick_task_lines`, { method: "POST", token, body: { pick_task_id: pt[0].id, product_id: line.product_id, qty_required: line.qty, bin_id: lineBins[line.product_id] || null } });
      }
      await sb(`/rest/v1/sales_orders?id=eq.${order.id}`, { method: "PATCH", token, body: { status: "queued" } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: order.id, user_id: profile.id, action: "reserved_and_queued" } });
      showToast("Reserved & queued for picking");
      load();
    } catch (e) { showToast("Reserve failed", "err"); }
  };

  const openOrderDetail = async (order) => {
    const [lines, events, shortages, pickTasks, packTasks, loadSheets, audits] = await Promise.all([
      sb(`/rest/v1/sales_order_lines?order_id=eq.${order.id}&select=*`, { token }),
      sb(`/rest/v1/event_log?entity_id=eq.${order.id}&select=*&order=created_at.asc`, { token }),
      sb(`/rest/v1/order_shortage_lines?order_id=eq.${order.id}&select=*`, { token }),
      sb(`/rest/v1/pick_tasks?order_id=eq.${order.id}&select=*`, { token }),
      sb(`/rest/v1/pack_tasks?order_id=eq.${order.id}&select=*`, { token }),
      sb(`/rest/v1/load_sheets?warehouse_id=eq.${profile.warehouse_id}&order_ids=cs.{${order.id}}&select=*`, { token }),
      sb(`/rest/v1/audit_trail?entity_id=eq.${order.id}&entity_type=eq.sales_order&select=*`, { token })
    ]);
    setOpenLines(lines || []);
    setOpenShortages(shortages || []);

    const history = (events || []).map(ev => ({
      ts: ev.created_at, label: ev.action, user: profiles[ev.user_id]?.full_name || "System"
    }));
    for (const pt of pickTasks || []) {
      if (pt.assigned_at) history.push({ ts: pt.assigned_at, label: "Assigned to picker", user: profiles[pt.assigned_to]?.full_name || "—" });
      if (pt.completed_at) history.push({ ts: pt.completed_at, label: "Picking completed", user: profiles[pt.assigned_to]?.full_name || "—" });
    }
    for (const pk of packTasks || []) {
      if (pk.completed_at) history.push({ ts: pk.completed_at, label: `Packed & labeled (${pk.label_number || "—"})`, user: profiles[pk.assigned_to]?.full_name || "—" });
    }
    for (const ls of loadSheets || []) {
      history.push({ ts: ls.created_at, label: `Dispatched — Load Sheet ${ls.load_sheet_number}`, user: profiles[ls.created_by]?.full_name || "—" });
    }
    for (const a of audits || []) {
      history.push({ ts: a.changed_at, label: `Amended: ${a.field_changed} — "${a.old_value || "—"}" → "${a.new_value || "—"}"`, user: profiles[a.changed_by]?.full_name || "—" });
    }
    history.sort((a, b) => new Date(a.ts) - new Date(b.ts));
    setOpenEvents(history);

    const fmtDur = (ms) => {
      if (ms == null || ms < 0) return null;
      const mins = Math.round(ms / 60000);
      if (mins < 60) return `${mins} min`;
      const h = Math.floor(mins / 60), m = mins % 60;
      return `${h}h ${m}m`;
    };
    const pt = (pickTasks || [])[0];
    const pk = (packTasks || [])[0];
    const ls = (loadSheets || [])[0];
    setOrderTimingSummary({
      pickerName: pt?.assigned_to ? (profiles[pt.assigned_to]?.full_name || "—") : null,
      pickAssignedAt: pt?.assigned_at || null,
      pickCompletedAt: pt?.completed_at || null,
      pickDuration: (pt?.assigned_at && pt?.completed_at) ? fmtDur(new Date(pt.completed_at) - new Date(pt.assigned_at)) : null,
      packerName: pk?.assigned_to ? (profiles[pk.assigned_to]?.full_name || "—") : null,
      packCompletedAt: pk?.completed_at || null,
      packDuration: (pt?.completed_at && pk?.completed_at) ? fmtDur(new Date(pk.completed_at) - new Date(pt.completed_at)) : null,
      dispatcherName: ls?.created_by ? (profiles[ls.created_by]?.full_name || "—") : null,
      dispatchedAt: order.dispatched_at || null,
      loadSheetNumber: ls?.load_sheet_number || null,
      totalDuration: (order.received_at && order.dispatched_at) ? fmtDur(new Date(order.dispatched_at) - new Date(order.received_at)) : null
    });

    const newProducts = await fetchProductsByIds(token, (lines || []).map(l => l.product_id));
    setProductCache(prev => ({ ...prev, ...newProducts }));
    setEditTracking(order.external_order_id);
    setEditCourier(order.courier);
    setEditQty({});
    setOpenOrder(order);
  };

  const canEditIncomplete = ["admin", "warehouse_lead"].includes(profile.role);

  const [orderSearch, setOrderSearch] = useState("");
  const searchOrderHistory = async () => {
    const code = orderSearch.trim();
    if (!code) return;
    let found = orders.find(o => o.external_order_id === code || o.external_order_id.includes(code));
    if (!found) {
      const rows = await sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&external_order_id=eq.${encodeURIComponent(code)}&select=*`, { token });
      found = rows && rows[0];
    }
    if (!found) { showToast("Order nahi mila — number check karein", "err"); return; }
    setOrderSearch("");
    openOrderDetail(found);
  };

  const saveOrderEdits = async () => {
    try {
      const changes = [];
      if (editTracking.trim() !== openOrder.external_order_id) changes.push({ field: "Tracking Number", old: openOrder.external_order_id, new: editTracking.trim() });
      if (editCourier.trim() !== openOrder.courier) changes.push({ field: "Courier", old: openOrder.courier, new: editCourier.trim() });

      await sb(`/rest/v1/sales_orders?id=eq.${openOrder.id}`, { method: "PATCH", token, body: { external_order_id: editTracking.trim(), courier: editCourier.trim() } });
      for (const l of openLines) {
        const newQty = editQty[l.id] !== undefined ? Number(editQty[l.id]) : l.qty;
        if (newQty !== l.qty && newQty > 0) {
          const p = productCache[l.product_id];
          changes.push({ field: `Qty — ${p?.barcode || p?.name || l.product_id}`, old: String(l.qty), new: String(newQty) });
          await sb(`/rest/v1/sales_order_lines?id=eq.${l.id}`, { method: "PATCH", token, body: { qty: newQty } });
        }
      }
      for (const c of changes) {
        await sb(`/rest/v1/audit_trail`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: openOrder.id, field_changed: c.field, old_value: c.old, new_value: c.new, changed_by: profile.id } });
      }
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: openOrder.id, user_id: profile.id, action: "amended", metadata: { tracking: editTracking, courier: editCourier } } });
      showToast(changes.length ? `Order amended — ${changes.length} field(s) changed` : "Koi change nahi tha");
      openOrderDetail({ ...openOrder, external_order_id: editTracking.trim(), courier: editCourier.trim() });
    } catch (e) { showToast("Save failed — tracking number already exist ho sakta hai", "err"); }
  };

  const retryReserve = async () => {
    await sb(`/rest/v1/sales_orders?id=eq.${openOrder.id}`, { method: "PATCH", token, body: { status: "received" } });
    await reserveAndQueue({ ...openOrder, status: "received" });
    setOpenOrder(null);
  };

  if (openOrder) {
    return (
      <div>
        <SectionTitle title={`Order ${openOrder.external_order_id}`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenOrder(null)}>← Back to orders</button>} />
        <div style={S.panel}>
          {openOrder.status === "incomplete" && canEditIncomplete ? (
            <div style={{ display: "flex", gap: 16, flexWrap: "wrap", alignItems: "flex-end" }}>
              <div>
                <div style={S.label}>TRACKING NUMBER</div>
                <input style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} value={editTracking} onChange={e => setEditTracking(e.target.value)} />
              </div>
              <div>
                <div style={S.label}>COURIER</div>
                <select style={S.input} value={editCourier} onChange={e => setEditCourier(e.target.value)}>
                  <option value="Postex">Postex</option>
                  <option value="M&P">M&P</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <button style={S.secondaryBtnSm} onClick={saveOrderEdits}>💾 Save changes</button>
            </div>
          ) : (
            <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
              <div><div style={S.label}>COURIER</div><div style={{ color: "#2B2620", fontSize: 14 }}>{openOrder.courier}</div></div>
              <div><div style={S.label}>STATUS</div><span style={{ ...S.badgeSm, color: STATUS_COLORS[openOrder.status] || "#5B9EE8", borderColor: STATUS_COLORS[openOrder.status] || "#5B9EE8" }}>{openOrder.status}</span></div>
              <div><div style={S.label}>RECEIVED</div><div style={{ color: "#6B6355", fontSize: 13, fontFamily: "'IBM Plex Mono', monospace" }}>{fmtTime(openOrder.received_at)}</div></div>
              {openOrder.dispatched_at && <div><div style={S.label}>DISPATCHED</div><div style={{ color: "#6B6355", fontSize: 13, fontFamily: "'IBM Plex Mono', monospace" }}>{fmtTime(openOrder.dispatched_at)}</div></div>}
            </div>
          )}
        </div>

        {(openOrder.status === "incomplete" || openShortages.length > 0) && (
          <div style={{ ...S.panel, borderColor: "#E5484D" }}>
            <div style={{ ...S.panelTitle, color: "#E5484D" }}>⚠ Shortage report — kam quantity available thi</div>
            <table>
              <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Required</th><th style={S.th}>Available</th><th style={S.th}>Not Available</th></tr></thead>
              <tbody>
                {openShortages.map(s => {
                  const p = productCache[s.product_id];
                  return (
                    <tr key={s.id}>
                      <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                      <td style={S.td}>{p?.name || "—"}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{s.qty_required}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{s.qty_available}</td>
                      <td style={{ ...S.td, color: "#E5484D", fontWeight: 600 }}>{s.not_available_qty}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {canEditIncomplete && openOrder.status === "incomplete" && (
              <button style={{ ...S.primaryBtnSm, marginTop: 14 }} onClick={retryReserve}>🔄 Retry reserve (after correction/restock)</button>
            )}
          </div>
        )}

        <div style={S.panel}>
          <div style={S.panelTitle}>Line items{openOrder.status === "incomplete" && canEditIncomplete ? " (editable)" : ""}</div>
          <table>
            <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Qty</th></tr></thead>
            <tbody>
              {openLines.map(l => {
                const p = productCache[l.product_id];
                return (
                  <tr key={l.id}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                    <td style={S.td}>{p?.name || "—"}</td>
                    <td style={S.td}>
                      {openOrder.status === "incomplete" && canEditIncomplete ? (
                        <input type="number" min={1} style={{ ...S.input, width: 80, padding: "4px 8px" }} value={editQty[l.id] !== undefined ? editQty[l.id] : l.qty} onChange={e => setEditQty({ ...editQty, [l.id]: e.target.value })} />
                      ) : l.qty}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {orderTimingSummary && (
          <div style={S.panel}>
            <div style={S.panelTitle}>Timing summary — kisne kitne time mein kya kiya</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 14 }}>
              <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
                <div style={S.label}>🚶 PICKER</div>
                <div style={{ color: "#2B2620", fontSize: 14, fontWeight: 600 }}>{orderTimingSummary.pickerName || "Not assigned yet"}</div>
                {orderTimingSummary.pickDuration && <div style={{ color: "#F5A623", fontSize: 18, fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif", marginTop: 4 }}>{orderTimingSummary.pickDuration}</div>}
                {orderTimingSummary.pickCompletedAt && <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>Completed: {fmtTime(orderTimingSummary.pickCompletedAt)}</div>}
              </div>
              <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
                <div style={S.label}>🏷 PACKER</div>
                <div style={{ color: "#2B2620", fontSize: 14, fontWeight: 600 }}>{orderTimingSummary.packerName || "Not assigned yet"}</div>
                {orderTimingSummary.packDuration && <div style={{ color: "#F5A623", fontSize: 18, fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif", marginTop: 4 }}>{orderTimingSummary.packDuration}</div>}
                {orderTimingSummary.packCompletedAt && <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>Completed: {fmtTime(orderTimingSummary.packCompletedAt)}</div>}
              </div>
              <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
                <div style={S.label}>🚚 DISPATCHER</div>
                <div style={{ color: "#2B2620", fontSize: 14, fontWeight: 600 }}>{orderTimingSummary.dispatcherName || "Not dispatched yet"}</div>
                {orderTimingSummary.dispatchedAt && <div style={{ color: "#4CAF7D", fontSize: 12, marginTop: 4 }}>{fmtTime(orderTimingSummary.dispatchedAt)}</div>}
                {orderTimingSummary.loadSheetNumber && <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>Load Sheet: {orderTimingSummary.loadSheetNumber}</div>}
              </div>
            </div>
            {orderTimingSummary.totalDuration && (
              <div style={{ marginTop: 12, color: "#6B6355", fontSize: 12 }}>Total lead time (received → dispatched): <b style={{ color: "#2B2620" }}>{orderTimingSummary.totalDuration}</b></div>
            )}
          </div>
        )}

        <div style={S.panel}>
          <div style={S.panelTitle}>Order history — kisne kya kiya, kab</div>
          {openEvents.length === 0 ? <EmptyNote text="Abhi tak koi activity nahi hui." /> : openEvents.map((ev, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #EFE8D8" }}>
              <span style={{ color: "#2B2620", fontSize: 13 }}>{ev.label} <span style={{ color: "#6B6355" }}>— {ev.user}</span></span>
              <span style={{ color: "#8A8272", fontSize: 11, fontFamily: "'IBM Plex Mono', monospace" }}>{fmtTime(ev.ts)}</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle title="Sales Orders" action={
        <div style={{ display: "flex", gap: 8 }}>
          <label style={{ ...S.secondaryBtnSm, cursor: "pointer" }}>
            {importing ? "Importing…" : "📤 Upload orders file"}
            <input type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={handleOrdersFile} disabled={importing} />
          </label>
          <button style={S.primaryBtnSm} onClick={() => setShowForm(s => !s)}>+ New order</button>
        </div>
      } />
      <div style={{ margin: "0 0 14px" }}>
        <div style={{ display: "flex", gap: 10 }}>
          <input style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="🔍 Order/Tracking number se seedha history dekhein…"
            value={orderSearch} onChange={e => setOrderSearch(e.target.value)}
            onKeyDown={e => e.key === "Enter" && searchOrderHistory()} />
          <button style={S.primaryBtnSm} onClick={searchOrderHistory}>Find</button>
        </div>
      </div>
      {importSummary && (
        <div style={{ ...S.panel, borderColor: "#4CAF7D", color: "#4CAF7D", fontSize: 12 }}>{importSummary}</div>
      )}
      {ordersReport && (
        <ImportReportPanel report={ordersReport.report} importing={importing}
          onConfirm={confirmOrdersImport} onCancel={() => setOrdersReport(null)} confirmLabel="Confirm & import orders" />
      )}
      {!ordersReport && showForm && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Create order (manual entry — courier integration comes later)</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
            <input style={{ ...S.input, flex: 1, minWidth: 160, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Order ID (from M&P/Postex)" value={extId} onChange={e => setExtId(e.target.value)} />
            <select style={{ ...S.input, minWidth: 140 }} value={courier} onChange={e => setCourier(e.target.value)}>
              <option value="Postex">Postex</option>
              <option value="M&P">M&P</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10, flexWrap: "wrap" }}>
            <ProductPicker token={token} onSelect={(p) => setPendingProduct(p)} />
            {pendingProduct && (
              <span style={{ ...S.badgeSm, color: "#F5A623", borderColor: "#F5A623" }}>{pendingProduct.barcode} — {pendingProduct.name} <span style={{ cursor: "pointer", marginLeft: 6 }} onClick={() => setPendingProduct(null)}>✕</span></span>
            )}
            <input style={{ ...S.input, width: 90 }} type="number" min={1} value={lineQty} onChange={e => setLineQty(e.target.value)} />
            <button style={S.secondaryBtnSm} onClick={addLine}>+ Add line</button>
          </div>
          {items.length > 0 && (
            <div style={{ marginBottom: 12 }}>
              {items.map((it, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", background: "#F4EFE6", border: "1px solid #E0D8C5", borderRadius: 6, padding: "8px 10px", marginBottom: 6, fontSize: 13 }}>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{it.barcode}</span>
                  <span style={{ color: "#2B2620", flex: 1, marginLeft: 8 }}>{it.name}</span>
                  <span style={{ color: "#6B6355" }}>× {it.qty}</span>
                </div>
              ))}
            </div>
          )}
          <button style={S.primaryBtnSm} onClick={createOrder}>Create order</button>
        </div>
      )}

      {(() => {
        const STAGES = [
          { key: "received", label: "New / Received", color: "#6B6355", icon: "🧾" },
          { key: "queued", label: "Queued for Pick", color: "#5B9EE8", icon: "🛒" },
          { key: "picking", label: "Picking", color: "#5B9EE8", icon: "🚶" },
          { key: "packed", label: "Packed", color: "#F5A623", icon: "🏷" },
          { key: "rtd", label: "RTD", color: "#B084F5", icon: "📦" },
          { key: "dispatched", label: "Dispatched", color: "#4CAF7D", icon: "🚚" },
          { key: "incomplete", label: "Incomplete", color: "#E5484D", icon: "⚠" }
        ];
        const counts = Object.fromEntries(STAGES.map(s => [s.key, orders.filter(o => o.status === s.key).length]));
        return (
          <div style={{ display: "grid", gridTemplateColumns: `repeat(${STAGES.length + 1}, 1fr)`, gap: 10, marginBottom: 18 }}>
            <div onClick={() => setStatusFilter(null)}
              style={{ ...S.statCard, cursor: "pointer", ...(statusFilter === null ? { borderColor: "#F5A623" } : {}) }}>
              <span style={{ fontSize: 16 }}>📋</span>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 22, fontWeight: 700, color: "#2B2620", marginTop: 8 }}>{orders.length}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>All orders</div>
            </div>
            {STAGES.map(s => (
              <div key={s.key} onClick={() => setStatusFilter(s.key)}
                style={{ ...S.statCard, cursor: "pointer", ...(statusFilter === s.key ? { borderColor: s.color } : {}) }}>
                <span style={{ fontSize: 16 }}>{s.icon}</span>
                <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 22, fontWeight: 700, color: s.color, marginTop: 8 }}>{counts[s.key] || 0}</div>
                <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>{s.label}</div>
              </div>
            ))}
          </div>
        );
      })()}

      {receivedOrders.length > 0 && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Smart Picking — order classification</div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => setSkuFilter("all")} style={{ ...S.pill, ...(skuFilter === "all" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>All ({receivedOrders.length})</button>
            <button onClick={() => setSkuFilter("single")} style={{ ...S.pill, ...(skuFilter === "single" ? { background: "#4CAF7D", color: "#1A1206", borderColor: "#4CAF7D" } : {}) }}>Single-SKU ({singleCount})</button>
            <button onClick={() => setSkuFilter("multi")} style={{ ...S.pill, ...(skuFilter === "multi" ? { background: "#5B9EE8", color: "#1A1206", borderColor: "#5B9EE8" } : {}) }}>Multi-SKU ({multiCount})</button>
          </div>
          <div style={{ color: "#8A8272", fontSize: 11, marginTop: 8 }}>Single-SKU orders ek hi product ke liye hain — inhe ek aisle-trip mein saath batch karna zyada efficient hota hai.</div>
        </div>
      )}

      {receivedOrders.length > 0 && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Bulk assign to picker ({selectedCount}/15 selected)</div>
          {totes.length === 0 && (
            <div style={{ color: "#E5484D", fontSize: 12, marginBottom: 10 }}>⚠ Koi available tote nahi hai — Admin se Tote Master check karwayein.</div>
          )}
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <select style={{ ...S.input, minWidth: 140, fontFamily: "'IBM Plex Mono', monospace" }} value={bulkToteId} onChange={e => setBulkToteId(e.target.value)}>
              <option value="">🧺 Select tote…</option>
              {totes.map(t => <option key={t.id} value={t.id}>{t.tote_number}</option>)}
            </select>
            <select style={{ ...S.input, minWidth: 180 }} value={bulkPickerId} onChange={e => setBulkPickerId(e.target.value)}>
              <option value="">Assign to…</option>
              {pickers.map(p => <option key={p.id} value={p.id}>{p.full_name} ({p.role})</option>)}
            </select>
            <button style={S.primaryBtnSm} onClick={bulkReserveAndAssign} disabled={bulkBusy || selectedCount === 0 || selectedCount > 15}>
              {bulkBusy ? "Assigning…" : `Reserve & Assign (${selectedCount})`}
            </button>
          </div>
        </div>
      )}

      <div style={S.panel}>
        <table>
          <thead>
            <tr>
              <th style={S.th}><input type="checkbox" onChange={e => toggleAll(e.target.checked)} checked={selectedCount > 0 && selectedCount === filteredReceived.length} /></th>
              <th style={S.th}>Order #</th><th style={S.th}>Courier</th><th style={S.th}>Status</th>
              <th style={S.th}>Items</th><th style={S.th}>Qty</th><th style={S.th}>Type</th><th style={S.th}>Received</th><th style={S.th}></th>
            </tr>
          </thead>
          <tbody>
            {orders.filter(o => (!statusFilter || o.status === statusFilter) && (o.status !== "received" || skuFilter === "all" || orderSkuType(o.id) === skuFilter)).map(o => {
              const stat = lineStats[o.id] || { count: 0, qty: 0 };
              const type = o.status === "received" ? orderSkuType(o.id) : null;
              return (
                <tr key={o.id} style={{ cursor: "pointer" }} onClick={() => openOrderDetail(o)}>
                  <td style={S.td} onClick={e => e.stopPropagation()}>
                    {o.status === "received" && (
                      <input type="checkbox" checked={!!selectedOrders[o.id]} onChange={e => setSelectedOrders({ ...selectedOrders, [o.id]: e.target.checked })} />
                    )}
                  </td>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{o.external_order_id}</td>
                  <td style={S.td}>{o.courier}</td>
                  <td style={S.td}><span style={{ ...S.badgeSm, color: STATUS_COLORS[o.status] || "#5B9EE8", borderColor: STATUS_COLORS[o.status] || "#5B9EE8" }}>{o.status}</span></td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{stat.count}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{stat.qty}</td>
                  <td style={S.td}>
                    {type && <span style={{ ...S.badgeSm, color: type === "single" ? "#4CAF7D" : "#5B9EE8", borderColor: type === "single" ? "#4CAF7D" : "#5B9EE8" }}>{type === "single" ? "Single-SKU" : "Multi-SKU"}</span>}
                  </td>
                  <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{fmtTime(o.received_at)}</td>
                  <td style={S.td}>
                    {o.status === "received" && (
                      <button style={S.secondaryBtnSm} onClick={(e) => { e.stopPropagation(); reserveAndQueue(o); }}>Reserve only</button>
                    )}
                  </td>
                </tr>
              );
            })}
            {orders.filter(o => (!statusFilter || o.status === statusFilter) && (o.status !== "received" || skuFilter === "all" || orderSkuType(o.id) === skuFilter)).length === 0 && (
              <tr><td colSpan={9}><EmptyNote text="Is status mein koi order nahi hai." /></td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ================= PICKING ================= */
function PickingView({ token, profile, showToast }) {
  const [tasks, setTasks] = useState([]);
  const [orders, setOrders] = useState({});
  const [products, setProducts] = useState({});
  const [pickers, setPickers] = useState([]);
  const [bins, setBins] = useState({});
  const [taskLines, setTaskLines] = useState({});
  const [totes, setTotes] = useState([]);
  const [selectedForTote, setSelectedForTote] = useState({});
  const [toteAssignPicker, setToteAssignPicker] = useState("");
  const [selectedToteId, setSelectedToteId] = useState("");
  const [openTote, setOpenTote] = useState(null);
  const [consolidated, setConsolidated] = useState([]);
  const [toteScans, setToteScans] = useState({});
  const [barcodeInput, setBarcodeInput] = useState("");
  const [lastScannedProduct, setLastScannedProduct] = useState(null);
  const [pickViewMode, setPickViewMode] = useState("location");
  const canBatch = ["admin", "supervisor", "warehouse_lead"].includes(profile.role);

  const load = useCallback(async () => {
    try {
      const [t, o, pk, b, tt] = await Promise.all([
        sb(`/rest/v1/pick_tasks?status=neq.picked&select=*&order=id.asc`, { token }),
        sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/profiles?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/totes?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token })
      ]);
      setTasks(t || []);
      setOrders(Object.fromEntries((o || []).map(x => [x.id, x])));
      setPickers((pk || []).filter(u => ["picker", "packer"].includes(u.role)));
      setBins(Object.fromEntries((b || []).map(x => [x.id, x])));
      setTotes(tt || []);
      const taskIds = (t || []).map(x => x.id);
      if (taskIds.length) {
        const lines = await sb(`/rest/v1/pick_task_lines?pick_task_id=in.(${taskIds.join(",")})&select=*`, { token });
        const newProducts = await fetchProductsByIds(token, lines.map(l => l.product_id));
        setProducts(prev => ({ ...prev, ...newProducts }));
        const grouped = {};
        for (const l of lines || []) { (grouped[l.pick_task_id] = grouped[l.pick_task_id] || []).push(l); }
        setTaskLines(grouped);
      }
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const queuedTasks = tasks.filter(t => t.status === "queued" && !t.tote_id);
  const selectedCount = Object.values(selectedForTote).filter(Boolean).length;
  const availableTotes = totes.filter(t => t.status === "open");

  const createTote = async () => {
    const ids = Object.keys(selectedForTote).filter(k => selectedForTote[k]);
    if (ids.length === 0 || ids.length > 15) { showToast("1 se 15 orders select karein", "err"); return; }
    if (!toteAssignPicker) { showToast("Picker select karein", "err"); return; }
    if (!selectedToteId) { showToast("Tote select karein — koi available nahi hai to admin se check karwayein", "err"); return; }
    try {
      await sb(`/rest/v1/totes?id=eq.${selectedToteId}`, { method: "PATCH", token, body: { status: "picking", assigned_to: toteAssignPicker } });
      let binNum = 1;
      for (const id of ids) {
        await sb(`/rest/v1/pick_tasks?id=eq.${id}`, { method: "PATCH", token, body: { tote_id: selectedToteId, assigned_to: toteAssignPicker, status: "assigned", assigned_at: new Date().toISOString(), tote_bin_number: binNum } });
        binNum++;
      }
      const toteNumber = totes.find(t => t.id === selectedToteId)?.tote_number;
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "tote", entity_id: selectedToteId, user_id: profile.id, action: "assigned", metadata: { orders: ids.length, assigned_to: toteAssignPicker } } });
      showToast(`${toteNumber} assigned with ${ids.length} orders`);
      setSelectedForTote({}); setToteAssignPicker(""); setSelectedToteId(""); load();
    } catch (e) { showToast("Tote assignment failed", "err"); }
  };

  const openToteDetail = (tote) => {
    const toteTasks = tasks.filter(t => t.tote_id === tote.id);
    const groups = {};
    for (const t of toteTasks) {
      for (const l of (taskLines[t.id] || [])) {
        const key = `${l.bin_id || "none"}|${l.product_id}`;
        if (!groups[key]) groups[key] = { bin_id: l.bin_id, product_id: l.product_id, required: 0, scanned: 0, refs: [] };
        groups[key].required += l.qty_required;
        groups[key].refs.push({ pick_task_id: t.id, order_id: t.order_id, toteBin: t.tote_bin_number, line_id: l.id, qty_required: l.qty_required, allocated: 0 });
      }
    }
    for (const g of Object.values(groups)) g.refs.sort((a, b) => (a.toteBin || 99) - (b.toteBin || 99));
    const list = Object.values(groups).sort((a, b) => (bins[a.bin_id]?.code || "zzz").localeCompare(bins[b.bin_id]?.code || "zzz"));
    setConsolidated(list);
    setLastScannedProduct(null);
    setCompletedOrderIds({});
    setOpenTote(tote);
  };

  const activeGroup = consolidated.find(g => g.scanned < g.required);

  const [completedOrderIds, setCompletedOrderIds] = useState({});

  const buildLineStatus = () => {
    const lineStatus = {};
    for (const g of consolidated) {
      for (const ref of g.refs) {
        lineStatus[ref.line_id] = { orderId: ref.order_id, allocated: ref.allocated, qty_required: ref.qty_required, resolved: g.required === g.scanned };
      }
    }
    return lineStatus;
  };

  const finalizeOrderPicking = async (orderId, lineStatus) => {
    const toteTasks = tasks.filter(t => t.tote_id === openTote.id);
    const task = toteTasks.find(t => t.order_id === orderId);
    if (!task || completedOrderIds[orderId]) return;
    try {
      const lines = taskLines[task.id] || [];
      for (const l of lines) {
        const st = lineStatus[l.id];
        await sb(`/rest/v1/pick_task_lines?id=eq.${l.id}`, { method: "PATCH", token, body: { qty_picked: st ? st.allocated : 0 } });
      }
      await sb(`/rest/v1/pick_tasks?id=eq.${task.id}`, { method: "PATCH", token, body: { status: "picked", completed_at: new Date().toISOString() } });
      await sb(`/rest/v1/pack_tasks`, { method: "POST", token, body: { order_id: orderId, status: "pending", tote_id: openTote.id } });
      await sb(`/rest/v1/sales_orders?id=eq.${orderId}`, { method: "PATCH", token, body: { status: "picking" } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "pick_task", entity_id: task.id, user_id: profile.id, action: "completed" } });
      setCompletedOrderIds(prev => ({ ...prev, [orderId]: true }));
      const order = orders[orderId];
      showToast(`✅ Order ${order?.external_order_id || ""} — picking complete, Packing ke liye chala gaya`);
    } catch (e) { showToast("Order finalize failed", "err"); }
  };

  const scanToteBarcode = (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : barcodeInput).trim();
    setBarcodeInput("");
    if (!code) return;
    const c = cleanCode(code);
    const p = Object.values(products).find(x => cleanCode(x.barcode) === c || cleanCode(x.sku) === c);
    if (!p) { showToast("Barcode/SKU match nahi hua", "err"); return; }
    if (!activeGroup) { showToast("Is tote ki saari locations complete ho chuki hain", "err"); return; }
    if (p.id !== activeGroup.product_id) {
      showToast(`❌ Pehle current location complete karein — Bin ${bins[activeGroup.bin_id]?.code || "?"}`, "err");
      return;
    }
    const ref = activeGroup.refs.find(r => r.allocated < r.qty_required);
    if (!ref) { showToast("Allocation error — dobara try karein", "err"); return; }
    ref.allocated += 1;
    activeGroup.scanned += 1;
    setConsolidated([...consolidated]);
    setLastScannedProduct(p);
    const order = orders[ref.order_id];
    showToast(`✓ ${p.barcode} → Tote Bin #${ref.toteBin || "?"} (Order ${order?.external_order_id || ""})`);

    // Check if THIS order's picking is now fully done — if so, send it to Packing right away
    const task = tasks.find(t => t.tote_id === openTote.id && t.order_id === ref.order_id);
    if (task) {
      const lines = taskLines[task.id] || [];
      const lineStatus = buildLineStatus();
      const orderDone = lines.length > 0 && lines.every(l => {
        const st = lineStatus[l.id];
        return st && (st.allocated >= st.qty_required || st.resolved);
      });
      if (orderDone) finalizeOrderPicking(ref.order_id, lineStatus);
    }
  };

  const allToteScanned = consolidated.length > 0 && consolidated.every(g => g.scanned >= g.required);

  const reportNotFound = async (group) => {
    const remaining = group.required - group.scanned;
    if (remaining <= 0) return;
    try {
      const altRows = await sb(`/rest/v1/inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${group.product_id}&bin_id=neq.${group.bin_id}&on_hand=gt.0&select=*`, { token });
      const alt = (altRows || []).sort((a, b) => b.on_hand - a.on_hand)[0];
      const openRefs = group.refs.filter(r => r.allocated < r.qty_required);

      if (alt) {
        const existingIdx = consolidated.findIndex(g2 => g2.bin_id === alt.bin_id && g2.product_id === group.product_id);
        if (existingIdx >= 0) {
          consolidated[existingIdx].required += remaining;
          consolidated[existingIdx].refs = [...consolidated[existingIdx].refs, ...openRefs];
        } else {
          consolidated.push({ bin_id: alt.bin_id, product_id: group.product_id, required: remaining, scanned: 0, refs: openRefs.map(r => ({ ...r })) });
        }
        group.required = group.scanned; // close out this location — fully relocated
        setConsolidated([...consolidated]);
        showToast(`📍 Product doosri location par mila — Bin ${bins[alt.bin_id]?.code || "?"} se pick karein`);
      } else {
        const affectedOrders = new Set();
        for (const ref of openRefs) {
          const short = ref.qty_required - ref.allocated;
          if (short > 0) {
            await sb(`/rest/v1/order_shortage_lines`, { method: "POST", token, body: { order_id: ref.order_id, product_id: group.product_id, qty_required: ref.qty_required, qty_available: ref.allocated, not_available_qty: short } });
            await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: ref.order_id, user_id: profile.id, action: "pick_shortage_reported", metadata: { product_id: group.product_id, short_qty: short } } });
            affectedOrders.add(ref.order_id);
          }
        }
        group.required = group.scanned; // let this location's shortfall resolve without blocking
        setConsolidated([...consolidated]);
        showToast("⚠ Koi aur location nahi mili — shortage record ho gaya, Admin ko Incomplete Orders mein nazar aayega", "err");
        // shortage-resolved orders may now be "done" (with a shortfall) — check and send to packing
        const lineStatus = buildLineStatus();
        for (const orderId of affectedOrders) {
          const task = tasks.find(t => t.tote_id === openTote.id && t.order_id === orderId);
          if (!task) continue;
          const lines = taskLines[task.id] || [];
          const orderDone = lines.length > 0 && lines.every(l => {
            const st = lineStatus[l.id];
            return st && (st.allocated >= st.qty_required || st.resolved);
          });
          if (orderDone) finalizeOrderPicking(orderId, lineStatus);
        }
      }
    } catch (e) { showToast("Report failed", "err"); }
  };

  const completeTotePicking = async () => {
    try {
      const lineStatus = buildLineStatus();
      const toteTasks = tasks.filter(t => t.tote_id === openTote.id);
      for (const t of toteTasks) {
        if (completedOrderIds[t.order_id]) continue; // already finalized as it completed early
        await finalizeOrderPicking(t.order_id, lineStatus);
      }
      await sb(`/rest/v1/totes?id=eq.${openTote.id}`, { method: "PATCH", token, body: { status: "picked", completed_at: new Date().toISOString() } });
      showToast("Tote fully picked — ready for packer");
      setOpenTote(null); load();
    } catch (e) { showToast("Failed to complete", "err"); }
  };

  if (openTote) {
    const toteTasks = tasks.filter(t => t.tote_id === openTote.id);
    const totalSku = consolidated.length;
    const totalQty = consolidated.reduce((s, g) => s + g.required, 0);
    const pickedQty = consolidated.reduce((s, g) => s + g.scanned, 0);
    const startTime = toteTasks.reduce((min, t) => (t.assigned_at && (!min || t.assigned_at < min)) ? t.assigned_at : min, null);
    return (
      <div>
        <SectionTitle title={`${openTote.tote_number} — Picking Job`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenTote(null)}>← Back</button>} />

        <div style={S.panel}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 12 }}>
            <div><div style={S.label}>TROLLEY/TOTE</div><div style={{ color: "#2B2620", fontFamily: "'IBM Plex Mono', monospace", fontSize: 14 }}>{openTote.tote_number}</div></div>
            <div><div style={S.label}>ORDERS</div><div style={{ color: "#2B2620", fontSize: 14, fontWeight: 700 }}>{toteTasks.length}</div></div>
            <div><div style={S.label}>TOTAL SKU</div><div style={{ color: "#2B2620", fontSize: 14, fontWeight: 700 }}>{totalSku}</div></div>
            <div><div style={S.label}>TOTAL QTY</div><div style={{ color: "#2B2620", fontSize: 14, fontWeight: 700 }}>{totalQty}</div></div>
            <div><div style={S.label}>PICKED QTY</div><div style={{ color: "#4CAF7D", fontSize: 14, fontWeight: 700 }}>{pickedQty}</div></div>
            <div><div style={S.label}>START TIME</div><div style={{ color: "#6B6355", fontSize: 12, fontFamily: "'IBM Plex Mono', monospace" }}>{startTime ? fmtTime(startTime) : "—"}</div></div>
            <div><div style={S.label}>STATUS</div><span style={{ ...S.badgeSm, color: "#5B9EE8", borderColor: "#5B9EE8" }}>{openTote.status}</span></div>
          </div>
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <button onClick={() => setPickViewMode("location")} style={{ ...S.pill, ...(pickViewMode === "location" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>📍 By Location</button>
          <button onClick={() => setPickViewMode("order")} style={{ ...S.pill, ...(pickViewMode === "order" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>🧾 By Order</button>
        </div>

        <div style={S.panel}>
          <div style={S.panelTitle}>Scan product — system aapko sequence mein guide karega</div>
          <div style={{ display: "flex", gap: 10 }}>
            <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type barcode / SKU, then Enter"
              value={barcodeInput} onChange={e => setBarcodeInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && scanToteBarcode()} />
            <CameraScanButton onScan={(text) => scanToteBarcode(text)} />
            <button style={S.primaryBtnSm} onClick={() => scanToteBarcode()}>Scan</button>
          </div>
        </div>

        {activeGroup ? (
          <div style={{ ...S.panel, borderColor: "#F5A623", borderWidth: 2 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={S.panelTitle}>📍 CURRENT STOP</div>
              <span style={{ ...S.badgeSm, color: "#5B9EE8", borderColor: "#5B9EE8" }}>Stop {consolidated.filter(g => g.scanned >= g.required).length + 1} / {consolidated.length}</span>
            </div>
            <div style={{ display: "flex", gap: 16, alignItems: "center", flexWrap: "wrap" }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 32, fontWeight: 700, color: "#F5A623" }}>{bins[activeGroup.bin_id]?.code || "no bin!"}</div>
              {products[activeGroup.product_id]?.image_url ? (
                <ZoomableImage src={products[activeGroup.product_id].image_url} alt="" style={{ width: 64, height: 64, objectFit: "cover", borderRadius: 8, border: "1px solid #E0D8C5", flexShrink: 0 }} />
              ) : (
                <div style={{ width: 64, height: 64, borderRadius: 8, border: "1px dashed #E0D8C5", display: "flex", alignItems: "center", justifyContent: "center", color: "#8A8272", fontSize: 18, flexShrink: 0 }}>📦</div>
              )}
              <div style={{ flex: 1, minWidth: 140 }}>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 13 }}>{products[activeGroup.product_id]?.barcode}</div>
                <div style={{ color: "#2B2620", fontSize: 14 }}>{products[activeGroup.product_id]?.name}</div>
              </div>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, fontWeight: 700, color: "#4CAF7D" }}>{activeGroup.scanned} / {activeGroup.required}</div>
            </div>
            <button style={{ ...S.secondaryBtnSm, color: "#E5484D", borderColor: "#E5484D", marginTop: 12 }} onClick={() => reportNotFound(activeGroup)}>❌ Not found here</button>
          </div>
        ) : consolidated.length > 0 && (
          <div style={{ ...S.panel, borderColor: "#4CAF7D" }}>
            <div style={{ color: "#4CAF7D", fontSize: 15, fontFamily: "'Space Grotesk', sans-serif" }}>✅ Saari locations complete — neeche "Complete tote picking" dabayein</div>
          </div>
        )}

        {lastScannedProduct && (
          <div style={{ ...S.panel, display: "flex", gap: 14, alignItems: "center", padding: 12 }}>
            {lastScannedProduct.image_url ? (
              <ZoomableImage src={lastScannedProduct.image_url} alt="" style={{ width: 44, height: 44, objectFit: "cover", borderRadius: 6, border: "1px solid #E0D8C5", flexShrink: 0 }} />
            ) : (
              <div style={{ width: 44, height: 44, borderRadius: 6, border: "1px dashed #E0D8C5", display: "flex", alignItems: "center", justifyContent: "center", color: "#8A8272", fontSize: 14, flexShrink: 0 }}>📦</div>
            )}
            <div style={{ color: "#6B6355", fontSize: 11 }}>Last scanned: <span style={{ color: "#2B2620" }}>{lastScannedProduct.barcode} — {lastScannedProduct.name}</span></div>
          </div>
        )}
        {pickViewMode === "order" ? (
          <div style={S.panel}>
            <div style={S.panelTitle}>Tote allocation — order-wise (Bin 01 → Bin 15)</div>
            <table>
              <thead><tr><th style={S.th}>Bin</th><th style={S.th}>Order #</th><th style={S.th}>Courier</th><th style={S.th}>SKU Qty</th><th style={S.th}>Picked Qty</th><th style={S.th}>Status</th></tr></thead>
              <tbody>
                {[...toteTasks].sort((a, b) => (a.tote_bin_number || 99) - (b.tote_bin_number || 99)).map(t => {
                  const o = orders[t.order_id];
                  const lines = taskLines[t.id] || [];
                  const required = lines.reduce((s, l) => s + l.qty_required, 0);
                  const picked = lines.reduce((s, l) => {
                    const g = consolidated.find(gr => gr.product_id === l.product_id);
                    const ref = g?.refs.find(r => r.line_id === l.id);
                    return s + (ref?.allocated || 0);
                  }, 0);
                  const status = picked >= required && required > 0 ? "Completed" : picked > 0 ? "Partial" : "Pending";
                  const statusColor = status === "Completed" ? "#4CAF7D" : status === "Partial" ? "#F5A623" : "#6B6355";
                  return (
                    <tr key={t.id}>
                      <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{String(t.tote_bin_number || "?").padStart(2, "0")}</td>
                      <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace" }}>{o?.external_order_id || "—"}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{o?.courier || "—"}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{required}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{picked}</td>
                      <td style={S.td}><span style={{ ...S.badgeSm, color: statusColor, borderColor: statusColor }}>{status}</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        ) : (
        <div style={S.panel}>
          <div style={S.panelTitle}>Pending to pick (route order)</div>
          {consolidated.filter(g => g.scanned < g.required).map((g, i) => {
            const p = products[g.product_id];
            const bin = bins[g.bin_id];
            const isActive = activeGroup === g;
            return (
              <div key={i} style={{ padding: "8px 0", borderBottom: "1px solid #EFE8D8", opacity: isActive ? 1 : 0.45 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                  <span style={{ width: 20 }}>{isActive ? "📍" : "🔒"}</span>
                  <span style={{ color: isActive ? "#F5A623" : "#5B9EE8", fontFamily: "'IBM Plex Mono', monospace", width: 90, fontWeight: isActive ? 700 : 400 }}>{bin?.code || "no bin!"}</span>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", width: 100 }}>{p?.barcode}</span>
                  <span style={{ flex: 1, color: "#2B2620", fontSize: 13 }}>{p?.name}</span>
                  <span style={{ ...S.badgeSm, color: "#6B6355", borderColor: "#E0D8C5" }}>{g.scanned} / {g.required}</span>
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 4, paddingLeft: 118 }}>
                  {g.refs.filter(r => r.allocated < r.qty_required).map((r, j) => (
                    <span key={j} style={{ fontSize: 10, color: "#8A8272", fontFamily: "'IBM Plex Mono', monospace" }}>
                      Bin#{r.toteBin || "?"}: {r.allocated}/{r.qty_required}
                    </span>
                  ))}
                </div>
              </div>
            );
          })}
          {consolidated.filter(g => g.scanned < g.required).length === 0 && <EmptyNote text="Saari locations complete ho chuki hain — 'Complete tote picking' dabayein." />}
        </div>
        )}
        {allToteScanned && consolidated.length > 0 && (
          <button style={{ ...S.primaryBtnSm, marginTop: 4, marginBottom: 16 }} onClick={completeTotePicking}>✓ Complete tote picking — send to packer</button>
        )}
      </div>
    );
  }

  const myTotes = totes.filter(t => t.assigned_to === profile.id && t.status === "picking");

  return (
    <div>
      <SectionTitle title="My totes" />
      <div style={S.cardGrid}>
        {myTotes.map(tt => {
          const toteTasks = tasks.filter(t => t.tote_id === tt.id);
          const pickedCount = toteTasks.filter(t => t.status === "picked").length;
          return (
            <div key={tt.id} style={S.card} onClick={() => openToteDetail(tt)}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span>🧺</span>
                <span style={{ ...S.badgeSm, color: "#5B9EE8", borderColor: "#5B9EE8" }}>{tt.status}</span>
              </div>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 15, marginTop: 10 }}>{tt.tote_number}</div>
              <div style={{ color: "#6B6355", fontSize: 12, marginTop: 4 }}>{pickedCount} / {toteTasks.length} orders picked</div>
            </div>
          );
        })}
        {myTotes.length === 0 && <EmptyNote text="Koi tote assign nahi hua." />}
      </div>

      {canBatch && (
        <>
          <SectionTitle title={`Create picking batch (Tote) — ${selectedCount}/15 selected`} />
          {pickers.length === 0 && (
            <div style={{ ...S.panel, borderColor: "#7A551A" }}>
              <div style={{ color: "#F5A623", fontSize: 12 }}>⚠ Is warehouse mein koi picker/packer profile nahi mila. Admin ko chahiye Users tab se account banana.</div>
            </div>
          )}
          <div style={S.panel}>
            {availableTotes.length === 0 && (
              <div style={{ color: "#E5484D", fontSize: 12, marginBottom: 10 }}>⚠ Koi available tote nahi hai — sab totes use mein hain, ya Admin ne abhi tote master seed nahi ki.</div>
            )}
            <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 12 }}>
              <select style={{ ...S.input, minWidth: 140, fontFamily: "'IBM Plex Mono', monospace" }} value={selectedToteId} onChange={e => setSelectedToteId(e.target.value)}>
                <option value="">🧺 Select tote…</option>
                {availableTotes.map(t => <option key={t.id} value={t.id}>{t.tote_number}</option>)}
              </select>
              <select style={{ ...S.input, minWidth: 180 }} value={toteAssignPicker} onChange={e => setToteAssignPicker(e.target.value)}>
                <option value="">Assign to…</option>
                {pickers.map(p => <option key={p.id} value={p.id}>{p.full_name} ({p.role})</option>)}
              </select>
              <button style={S.primaryBtnSm} onClick={createTote} disabled={selectedCount === 0 || selectedCount > 15}>Assign tote</button>
            </div>
            <table>
              <thead><tr><th style={S.th}></th><th style={S.th}>Order #</th><th style={S.th}>Courier</th><th style={S.th}>Items</th></tr></thead>
              <tbody>
                {queuedTasks.map(t => {
                  const o = orders[t.order_id];
                  return (
                    <tr key={t.id}>
                      <td style={S.td}><input type="checkbox" checked={!!selectedForTote[t.id]} onChange={e => setSelectedForTote({ ...selectedForTote, [t.id]: e.target.checked })} /></td>
                      <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{o?.external_order_id}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{o?.courier}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{(taskLines[t.id] || []).length}</td>
                    </tr>
                  );
                })}
                {queuedTasks.length === 0 && <tr><td colSpan={4}><EmptyNote text="Koi queued order nahi hai." /></td></tr>}
              </tbody>
            </table>
          </div>
        </>
      )}
    </div>
  );
}

/* ================= PACKING ================= */
function PackingView({ token, profile, showToast }) {
  const [tasks, setTasks] = useState([]);
  const [orders, setOrders] = useState({});
  const [products, setProducts] = useState({});
  const [totes, setTotes] = useState([]);
  const [openTote, setOpenTote] = useState(null);
  const [openTask, setOpenTask] = useState(null);
  const [lastScannedProduct, setLastScannedProduct] = useState(null);
  const [requiredLines, setRequiredLines] = useState([]);
  const [scans, setScans] = useState({});
  const [barcodeInput, setBarcodeInput] = useState("");
  const [orderScanInput, setOrderScanInput] = useState("");
  const [toteScanInput, setToteScanInput] = useState("");
  const [binNumMap, setBinNumMap] = useState({});

  const load = useCallback(async () => {
    try {
      const [t, o, tt] = await Promise.all([
        sb(`/rest/v1/pack_tasks?status=eq.pending&select=*&order=id.asc`, { token }),
        sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/totes?warehouse_id=eq.${profile.warehouse_id}&status=eq.picked&select=*`, { token })
      ]);
      setTasks(t || []);
      setOrders(Object.fromEntries((o || []).map(x => [x.id, x])));
      setTotes(tt || []);
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const openPack = async (task) => {
    const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${task.order_id}&select=*`, { token });
    setRequiredLines(lines || []);
    const newProducts = await fetchProductsByIds(token, (lines || []).map(l => l.product_id));
    setProducts(prev => ({ ...prev, ...newProducts }));
    setScans({});
    setLastScannedProduct(null);
    setOpenTask(task);
  };

  const openByOrderNumber = (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : orderScanInput).trim();
    setOrderScanInput("");
    if (!code) return;
    const order = Object.values(orders).find(o => o.external_order_id === code);
    if (!order) { showToast("Order number nahi mila", "err"); return; }
    const task = tasks.find(t => t.order_id === order.id);
    if (!task) { showToast("Yeh order abhi packing ke liye ready nahi hai", "err"); return; }
    openPack(task);
  };

  const scanTote = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : toteScanInput).trim();
    setToteScanInput("");
    if (!code) return;
    const tote = totes.find(t => t.tote_number === code);
    if (!tote) { showToast("Tote nahi mila ya abhi picking complete nahi hui", "err"); return; }
    try {
      const fresh = await sb(`/rest/v1/totes?id=eq.${tote.id}&select=*`, { token });
      const row = fresh && fresh[0];
      if (!row) { showToast("Tote nahi mila", "err"); return; }
      if (row.locked_by && row.locked_by !== profile.id) {
        showToast("Yeh tote pehle se kisi aur packer ke paas process ho rahi hai", "err");
        return;
      }
      if (!row.locked_by) {
        await sb(`/rest/v1/totes?id=eq.${tote.id}`, { method: "PATCH", token, body: { locked_by: profile.id } });
      }
      const pickTasks = await sb(`/rest/v1/pick_tasks?tote_id=eq.${tote.id}&select=order_id,tote_bin_number`, { token });
      setBinNumMap(Object.fromEntries((pickTasks || []).map(pt => [pt.order_id, pt.tote_bin_number])));
      setOpenTote({ ...row, locked_by: profile.id });
    } catch (e) { showToast("Tote open nahi ho saki", "err"); }
  };

  const scanBarcode = (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : barcodeInput).trim();
    setBarcodeInput("");
    if (!code) return;
    const c = cleanCode(code);
    const p = Object.values(products).find(x => cleanCode(x.barcode) === c || cleanCode(x.sku) === c);
    if (!p) { showToast("Barcode/SKU match nahi hua — is order ka nahi hai", "err"); return; }
    const line = requiredLines.find(l => l.product_id === p.id);
    if (!line) { showToast("Yeh product is order mein nahi hai — WRONG ITEM", "err"); return; }
    const current = scans[p.id] || 0;
    if (current >= line.qty) { showToast("Is product ki required qty already scan ho chuki", "err"); return; }
