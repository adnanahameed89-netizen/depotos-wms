const SUPABASE_URL = "https://bjqpisuhvawzixgrzpqd.supabase.co";

async function sb(path, { method = "GET", token, body, prefer } = {}) {
  const headers = { apikey: ANON_KEY, "Content-Type": "application/json" };
  if (token) headers.Authorization = `Bearer ${token}`;
  if (prefer) headers.Prefer = prefer;
  const res = await fetch(`${SUPABASE_URL}${path}`, {
    method, headers, body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(text || `Request failed (${res.status})`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function login(email, password) {
  return sb(`/auth/v1/token?grant_type=password`, { method: "POST", body: { email, password } });
}

async function postexProxy(action, payload, token) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/postex-proxy`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, apikey: ANON_KEY },
    body: JSON.stringify({ action, ...payload })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data?.error || `PostEx request failed (${res.status})`);
  return data;
}

async function mnpProxy(action, payload, token) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/mnp-proxy`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, apikey: ANON_KEY },
    body: JSON.stringify({ action, ...payload })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data?.error || `M&P request failed (${res.status})`);
  return data;
}

// M&P's label endpoint fetches a full PDF per tracking number inside the Edge Function —
// sending too many at once in a single invocation exceeds Supabase's per-request CPU/memory/
// time limits (HTTP 546). This chunks the request into small batches (5 at a time) so each
// invocation stays light, and merges all the resulting PDF batches back into one array.
async function fetchMnpLabelsChunked(trackingNumbers, token) {
  const CHUNK = 5;
  const allBatches = [];
  for (let i = 0; i < trackingNumbers.length; i += CHUNK) {
    const chunk = trackingNumbers.slice(i, i + CHUNK);
    const result = await mnpProxy("labels", { trackingNumbers: chunk }, token);
    if (result.pdfBase64Batches) allBatches.push(...result.pdfBase64Batches);
    else if (result.pdfBase64) allBatches.push(result.pdfBase64);
  }
  return allBatches;
}

// M&P's label API returns ONE tracking number per PDF (1 label per page) — unlike
// PostEx, which already combines multiple labels per page on its own server. This
// composes M&P's individual single-label PDFs onto shared pages, N labels per page,
// stacked vertically on a standard page size — matching PostEx's combined look.
async function composeLabelsNPerPage(base64Array, perPage = 3) {
  const { PDFDocument } = PDFLib;
  const outDoc = await PDFDocument.create();
  const pageWidth = 595.28;  // A4 width in points
  const pageHeight = 841.89; // A4 height in points
  const slotHeight = pageHeight / perPage;
  const marginX = 30, marginY = 12;

  let currentPage = null;
  let slotIndex = perPage; // forces a new page on the first label

  for (const b64 of base64Array) {
    try {
      const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const srcDoc = await PDFDocument.load(bytes);
      const [srcPage] = srcDoc.getPages();
      if (!srcPage) continue;
      // Some couriers' PDFs (M&P specifically) define a CropBox much narrower than
      // their actual MediaBox, clipping away the visible label content when embedded.
      // Overriding CropBox with the full MediaBox restores the complete content.
      const mb = srcPage.getMediaBox();
      srcPage.setCropBox(mb.x, mb.y, mb.width, mb.height);
      const embedded = await outDoc.embedPage(srcPage);
      const { width: srcW, height: srcH } = embedded;

      if (slotIndex >= perPage) {
        currentPage = outDoc.addPage([pageWidth, pageHeight]);
        slotIndex = 0;
      }

      const availW = pageWidth - marginX * 2;
      const availH = slotHeight - marginY * 2;
      // Some couriers' PDFs report an unreliable/oversized page box relative to their
      // actual visible content, which can make an aspect-ratio-preserving scale collapse
      // to near-zero. Guard against that: only preserve aspect ratio when srcW/srcH look
      // sane; otherwise stretch to fill the slot so the label is always visibly readable.
      const dimsLookSane = srcW > 20 && srcH > 20 && srcW < 3000 && srcH < 3000;
      let drawW, drawH;
      if (dimsLookSane) {
        const scale = Math.min(availW / srcW, availH / srcH);
        drawW = srcW * scale;
        drawH = srcH * scale;
        if (drawW < availW * 0.5 && drawH < availH * 0.5) {
          // Scale came out surprisingly small even though dims looked sane — still
          // fall back to filling the slot rather than risk an unreadably tiny label.
          drawW = availW; drawH = availH;
        }
      } else {
        drawW = availW; drawH = availH;
      }
      const x = (pageWidth - drawW) / 2;
      const y = pageHeight - (slotIndex + 1) * slotHeight + (slotHeight - drawH) / 2;

      currentPage.drawPage(embedded, { x, y, width: drawW, height: drawH });
      // Thin separator line between labels (except after the last slot on a page)
      if (slotIndex < perPage - 1) {
        currentPage.drawLine({
          start: { x: 20, y: pageHeight - (slotIndex + 1) * slotHeight },
          end: { x: pageWidth - 20, y: pageHeight - (slotIndex + 1) * slotHeight },
          thickness: 0.5, color: PDFLib.rgb(0.7, 0.7, 0.7), dashArray: [3, 3]
        });
      }
      slotIndex++;
    } catch (e) { /* skip a single corrupt/unreadable PDF rather than failing the whole compose */ }
  }

  const outBytes = await outDoc.save();
  const blob = new Blob([outBytes], { type: "application/pdf" });
  return URL.createObjectURL(blob);
}

// Merges multiple base64-encoded PDFs (fetched in small resilient batches to avoid server
// resource limits) into ONE combined PDF, so the Lead can open/print a single document
// instead of clicking through many small ones.
async function mergePdfsToUrl(base64Array) {
  const { PDFDocument } = PDFLib;
  const merged = await PDFDocument.create();
  for (const b64 of base64Array) {
    try {
      const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const src = await PDFDocument.load(bytes);
      const pages = await merged.copyPages(src, src.getPageIndices());
      pages.forEach(p => merged.addPage(p));
    } catch (e) { /* skip a single corrupt/unreadable PDF rather than failing the whole merge */ }
  }
  const mergedBytes = await merged.save();
  const blob = new Blob([mergedBytes], { type: "application/pdf" });
  return URL.createObjectURL(blob);
}


// Tolerant PostEx courier match — strips spaces/dots/dashes before comparing, so
// "PostEx", "Post Ex", "POSTEX", "Postex.", "Post-Ex" etc. are all recognized.
function isPostex(courierText) {
  return (courierText || "").toLowerCase().replace(/[^a-z0-9]/g, "").includes("postex");
}

// Tolerant M&P courier match — "M&P", "M & P", "MNP", "Muller Phipps" etc.
function isMnp(courierText) {
  const c = (courierText || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  return c.includes("mnp") || c.includes("mullerphipps") || c.includes("muller") || c === "mp" || c === "m";
}

const ORDER_STATUS_LABEL = { received: "New", queued: "Queued", picking: "Picked", packed: "Packed", rtd: "RTD (Packed)", scanned: "Scanned", dispatched: "Dispatched", handed_over: "Handed Over", incomplete: "Incomplete" };
const isBulkTote = (tote) => !!(tote && tote.tote_number && tote.tote_number.toLowerCase().includes("bulk"));
const NORMAL_TOTE_MAX = 15;

/* ================= APP ================= */
function App() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loadErr, setLoadErr] = useState("");
  const [view, setView] = useState("dashboard");
  const [toast, setToast] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [isOnline, setIsOnline] = useState(navigator.onLine);
  const [justReconnected, setJustReconnected] = useState(false);
  const [warehouses, setWarehouses] = useState([]);
  const [activeWarehouseId, setActiveWarehouseId] = useState(null);

  useEffect(() => {
    const goOnline = () => {
      setIsOnline(true);
      setJustReconnected(true);
      window.dispatchEvent(new Event("app-reconnect"));
      setTimeout(() => setJustReconnected(false), 3000);
    };
    const goOffline = () => setIsOnline(false);
    window.addEventListener("online", goOnline);
    window.addEventListener("offline", goOffline);
    return () => { window.removeEventListener("online", goOnline); window.removeEventListener("offline", goOffline); };
  }, []);

  // Admins (and anyone else with no fixed warehouse_id) pick which warehouse to work in;
  // staff tied to one warehouse skip straight into it — each side only ever queries its
  // own warehouse_id, so one warehouse's staff never sees the other's entities.
  const needsWarehouseSelect = !!profile && (profile.role === "admin" || !profile.warehouse_id);
  useEffect(() => {
    if (session && profile) {
      sb(`/rest/v1/warehouses?select=*`, { token: session.token }).then(setWarehouses).catch(() => {});
    }
  }, [session, profile]);
  const activeWarehouse = warehouses.find(w => w.id === (needsWarehouseSelect ? activeWarehouseId : profile?.warehouse_id));
  const warehouseType = activeWarehouse ? (/stock/i.test(activeWarehouse.name) ? "stocking" : "ecommerce") : (needsWarehouseSelect ? null : "ecommerce");
  const effectiveProfile = profile && needsWarehouseSelect ? { ...profile, warehouse_id: activeWarehouseId } : profile;

  const changeView = (v) => { setView(v); setSidebarOpen(false); };

  const showToast = (msg, kind = "ok") => {
    setToast({ msg, kind, id: uid() });
    setTimeout(() => setToast(null), 2800);
  };

  const handleLogin = async (email, password) => {
    setLoadErr("");
    try {
      const data = await login(email, password);
      const token = data.access_token;
      const userId = data.user.id;
      const profiles = await sb(`/rest/v1/profiles?id=eq.${userId}&select=*`, { token });
      if (!profiles || profiles.length === 0) {
        setLoadErr("Login ho gaya, lekin profile record nahi mila. Admin se profile setup karwayein.");
        return;
      }
      setSession({ token, userId });
      setProfile(profiles[0]);
    } catch (e) {
      let detail = e.message || "";
      try { const p = JSON.parse(detail); detail = p.error_description || p.msg || p.error || detail; } catch {}
      setLoadErr(`Login fail: ${detail || "email/password check karein."}`);
    }
  };

  if (!session || !profile) return <LoginScreen onLogin={handleLogin} error={loadErr} />;

  if (needsWarehouseSelect && !activeWarehouseId) {
    return <WarehouseSelectScreen warehouses={warehouses} profile={profile}
      onSelect={(id) => { setActiveWarehouseId(id); const wh = warehouses.find(w => w.id === id); setView(wh && /stock/i.test(wh.name) ? "stkdashboard" : "dashboard"); }}
      onLogout={() => { setSession(null); setProfile(null); }} />;
  }

  return (
    <div style={S.app}>
      {!isOnline && (
        <div style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 9999, background: "#E5484D", color: "#FFFFFF", textAlign: "center", padding: "8px 12px", fontSize: 13, fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600 }}>
          🔴 Connection lost — reconnecting… Scans/updates paused until back online.
        </div>
      )}
      {isOnline && justReconnected && (
        <div style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 9999, background: "#4CAF7D", color: "#FFFFFF", textAlign: "center", padding: "8px 12px", fontSize: 13, fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600 }}>
          🟢 Back online — syncing latest data…
        </div>
      )}
      <div className={`depotos-overlay${sidebarOpen ? " open" : ""}`} onClick={() => setSidebarOpen(false)} />
      <Sidebar view={view} setView={changeView} profile={effectiveProfile} sidebarOpen={sidebarOpen} warehouseType={warehouseType}
        activeWarehouseName={activeWarehouse?.name}
        onSwitchWarehouse={needsWarehouseSelect ? () => setActiveWarehouseId(null) : null}
        onLogout={() => { setSession(null); setProfile(null); setActiveWarehouseId(null); }} />
      <div style={S.main}>
        <TopBar profile={effectiveProfile} onMenuClick={() => setSidebarOpen(true)} activeWarehouseName={activeWarehouse?.name} />
        <div style={S.content} className="depotos-content">
          {view === "dashboard" && <DashboardView token={session.token} profile={effectiveProfile} setView={setView} showToast={showToast} />}
          {view === "dashboardv2" && <DashboardV2View token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "products" && <ProductsView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "receiving" && <ReceivingView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "putaway" && <PutawayView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "inventory" && <InventoryView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "orders" && <OrdersView token={session.token} profile={effectiveProfile} showToast={showToast} setView={setView} />}
          {view === "picking" && <PickingView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "packing" && <PackingView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "dispatch" && <DispatchView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "users" && ["admin", "warehouse_lead"].includes(profile.role) && <UsersView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "returns" && <ReturnsView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "reports" && <ReportsView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "bins" && profile.role === "admin" && <BinsView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "stkbins" && profile.role === "admin" && <BinsView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "totemaster" && profile.role === "admin" && <ToteMasterView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "damage" && ["admin", "warehouse_lead"].includes(profile.role) && <DamageView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "complaints" && ["admin", "warehouse_lead", "compliance_officer", "dispatcher"].includes(profile.role) && <ComplaintsView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "kpi" && <KPIView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "stkreceiving" && <StockingReceivingView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "stkcatalogue" && <StockingCatalogueView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "stkrtv" && <StockingRtvView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "stkoutbound" && <StockingOutboundView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "stkstr" && <StockingStrView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "stkpicking" && <StockingPickingView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "stkrepair" && <StockingRepairView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "stkpacking" && <StockingPackingView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "stklogistics" && <StockingLogisticsView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "stkinventory" && <StockingInventoryView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "stkreports" && <StockingReportsView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "stkdashboard" && <StockingDashboardView token={session.token} profile={effectiveProfile} showToast={showToast} />}
          {view === "changepassword" && <ChangePasswordView token={session.token} showToast={showToast} />}
        </div>
      </div>
      {toast && <Toast toast={toast} />}
    </div>
  );
}

  const [lampOn, setLampOn] = useState(false);
  const [launching, setLaunching] = useState(false);
  const submit = async () => { if (!email || !password) return; setBusy(true); await onLogin(email, password); setBusy(false); };
  const darkInput = { background: "#171A21", border: "1px solid #2C323F", borderRadius: 6, color: "#E8E6E1", padding: "9px 10px", fontSize: 13, outline: "none", fontFamily: "'Space Grotesk', sans-serif", width: "100%", boxSizing: "border-box" };
  const darkLabel = { color: "#6B7280", fontSize: 10, letterSpacing: 1, marginBottom: 6, marginTop: 12, fontFamily: "'IBM Plex Mono', monospace" };

  const stars = useMemo(() => Array.from({ length: 90 }, () => ({
    top: Math.random() * 100, left: Math.random() * 100, size: Math.random() * 2 + 1, delay: Math.random() * 3
  })), []);

  const pullLever = () => {
    setLaunching(true);
    setTimeout(() => setLaunching(false), 700);
    setLampOn(v => !v);
  };

  return (
    <div style={{ height: "100vh", position: "relative", overflow: "hidden", background: "radial-gradient(ellipse at 50% 0%, #1b1035 0%, #0a0a18 45%, #050509 100%)", display: "flex" }}>
      {stars.map((s, i) => (
        <div key={i} className="galaxy-star" style={{ top: `${s.top}%`, left: `${s.left}%`, width: s.size, height: s.size, animationDelay: `${s.delay}s` }} />
      ))}
      <div style={{ position: "absolute", top: "-10%", left: "-10%", width: 400, height: 400, background: "radial-gradient(circle, rgba(120,60,200,0.25), transparent 70%)", borderRadius: "50%", filter: "blur(40px)" }} />
      <div style={{ position: "absolute", bottom: "-15%", right: "-10%", width: 450, height: 450, background: "radial-gradient(circle, rgba(40,80,200,0.2), transparent 70%)", borderRadius: "50%", filter: "blur(50px)" }} />

  const [lbTo, setLbTo] = useState(new Date().toISOString().slice(0, 10));
  const [inboundOps, setInboundOps] = useState(null);

  const [fvFrom, setFvFrom] = useState(new Date().toISOString().slice(0, 10));

  const isHoliday = (date, holidayDates) => holidayDates.has(date.toDateString());

    let days = Math.floor((new Date(end.toDateString()) - new Date(start.toDateString())) / 86400000);
    const cursor = new Date(start);
    for (let i = 0; i < days; i++) {
      cursor.setDate(cursor.getDate() + 1);
      if (isHoliday(cursor, holidayDates)) days--;
    }
    return days;
  };

        ]);
        setHolidays(holidayRows || []);

        const grnPendingIds = new Set((grns || []).filter(g => g.status !== "completed").map(g => g.id));

        const grnPending = grnPendingIds.size;
        const grnComplete = grnCompleteIds.size;
        const grnPendingQty = (grnLinesAll || []).filter(l => grnPendingIds.has(l.grn_id)).reduce((s, l) => s + (l.qty_expected || 0), 0);
        const grnCompleteQty = (grnLinesAll || []).filter(l => grnCompleteIds.has(l.grn_id)).reduce((s, l) => s + (l.qty_expected || 0), 0);

        const ordersCompletedIds = new Set((orders || []).filter(o => ["dispatched", "handed_over"].includes(o.status)).map(o => o.id));
        const ordersPendingIds = new Set((orders || []).filter(o => ["received", "queued", "picking", "rtd", "scanned", "incomplete"].includes(o.status)).map(o => o.id));
        const ordersCompleted = ordersCompletedIds.size;
        const ordersPending = ordersPendingIds.size;
        const returnOrders = (returnsAll || []).length;
        const orderIdsForQty = [...ordersCompletedIds, ...ordersPendingIds];
        let ordersPendingQty = 0, ordersCompletedQty = 0;
        const QCHUNK = 60;
        for (let i = 0; i < orderIdsForQty.length; i += QCHUNK) {
          const chunk = orderIdsForQty.slice(i, i + QCHUNK);
          const lines = await sb(`/rest/v1/sales_order_lines?order_id=in.(${chunk.join(",")})&select=order_id,qty`, { token }) || [];
          for (const l of lines) {
            if (ordersPendingIds.has(l.order_id)) ordersPendingQty += l.qty;
            else if (ordersCompletedIds.has(l.order_id)) ordersCompletedQty += l.qty;
          }
        }
        setOverall({ grnPending, grnComplete, grnPendingQty, grnCompleteQty, pcsPendingPutaway, ordersCompleted, ordersPending, ordersPendingQty, ordersCompletedQty, returnOrders });

        const dispatchedWithDates = (orders || []).filter(o => o.received_at && o.dispatched_at);
        let onTime = 0, delayed = 0;
        for (const o of dispatchedWithDates) {
          const effDays = effectiveDaysBetween(new Date(o.received_at), new Date(o.dispatched_at), holidayDates);
          if (effDays <= 1) onTime++; else delayed++;
        }
        const total24 = onTime + delayed;
        setKpi24({ onTime, delayed, rate: total24 ? Math.round((onTime / total24) * 100) : null });

        // ---- Order Fulfillment KPIs (all-time): Total Orders, Avg Bucket Size, Avg Fulfillment Lead Time ----
        const avgFulfillmentHrs = dispatchedWithDates.length
          ? dispatchedWithDates.reduce((s, o) => s + (new Date(o.dispatched_at) - new Date(o.received_at)) / 3600000, 0) / dispatchedWithDates.length
          : null;
        const allOrderIds = (orders || []).map(o => o.id);
        let avgBucketAllTime = 0;
        if (allOrderIds.length) {
          let totalQtyAll = 0;
          const ABCHUNK = 150;
          for (let i = 0; i < allOrderIds.length; i += ABCHUNK) {
            const chunk = allOrderIds.slice(i, i + ABCHUNK);

          }

        }
        setFulfillmentKpis({
          totalOrders: (orders || []).length,

          pending: ordersPending,
          avgBucketSize: avgBucketAllTime,

        // ---- Daily Order Volume & Same-Day Lead Time Trend (last 30 days) ----
        const daysBack = 30;
        const dayBuckets = [];
        for (let i = daysBack - 1; i >= 0; i--) {
          const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
          dayBuckets.push({ key: d.toDateString(), label: d.toLocaleDateString(undefined, { month: "short", day: "numeric" }), count: 0, leadTimes: [] });
        }
        const bucketByKey = Object.fromEntries(dayBuckets.map(b => [b.key, b]));
        for (const o of orders || []) {
          if (!o.received_at) continue;
          const bucket = bucketByKey[new Date(o.received_at).toDateString()];
          if (!bucket) continue;
          bucket.count++;
          if (o.dispatched_at) bucket.leadTimes.push((new Date(o.dispatched_at) - new Date(o.received_at)) / 3600000);
        }
        setDailyTrend(dayBuckets.map(b => ({
          label: b.label, count: b.count,
          avgLead: b.leadTimes.length ? b.leadTimes.reduce((a, c) => a + c, 0) / b.leadTimes.length : null
        })));

        // ---- Inbound Ops Summary ----
        const [grnAllIo, grnLinesAllIo, putawayPendingIo] = await Promise.all([
          sb(`/rest/v1/grn?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
          sb(`/rest/v1/grn_lines?select=*`, { token }),
          sb(`/rest/v1/putaway_tasks?status=eq.pending&select=*`, { token })
        ]);
        const openGrnIds = new Set((grnAllIo || []).filter(g => g.status !== "completed").map(g => g.id));
        const openLines = (grnLinesAllIo || []).filter(l => openGrnIds.has(l.grn_id));
        setInboundOps({
          pendingStockOrders: openGrnIds.size,
          pendingReceivingLines: openLines.filter(l => l.qty_received < l.qty_expected).length,
          pendingReceivingUnits: openLines.reduce((s, l) => s + Math.max(0, l.qty_expected - l.qty_received), 0),
          linesPendingPutaway: (putawayPendingIo || []).length,
          unitsPendingPutaway: (putawayPendingIo || []).reduce((s, t) => s + (t.qty - (t.qty_completed || 0)), 0)
        });

      } catch (e) {}
    };
    loadDashboard();
    const interval = setInterval(loadDashboard, 30000);
    return () => clearInterval(interval);
  }, [token, profile.warehouse_id, refreshTick]);

                <span style={{ color: "#2B2620" }}>{h.name || "Holiday"} <span style={{ color: "#8A8272", fontFamily: "'IBM Plex Mono', monospace" }}>— {h.holiday_date}</span></span>
                <span style={{ color: "#E5484D", cursor: "pointer" }} onClick={() => removeHoliday(h)}>✕ Remove</span>
              </div>
            ))}
            <div style={{ color: "#8A8272", fontSize: 10, marginTop: 8 }}>⚠ Eid dates depend on moon sighting — must be added manually each year.</div>
          </div>
        )}
      </div>

      <div style={S.panel}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 10 }}>
          <div style={S.panelTitle}>Today's Snapshot (filterable)</div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <input type="date" style={{ ...S.input, maxWidth: 150 }} value={dateFrom} onChange={e => setDateFrom(e.target.value)} />
            <span style={{ color: "#8A8272" }}>to</span>
            <input type="date" style={{ ...S.input, maxWidth: 150 }} value={dateTo} onChange={e => setDateTo(e.target.value)} />
          </div>
        </div>
        {snapshot ? (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 14 }}>
            <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, fontWeight: 700, color: "#2B2620" }}>{snapshot.count}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 4 }}>Orders Received</div>
            </div>
            <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, fontWeight: 700, color: "#5B9EE8" }}>{snapshot.avgBucket}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 4 }}>Avg Bucket Size (units/order)</div>
            </div>
            <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, fontWeight: 700, color: "#4CAF7D" }}>{snapshot.avgSaleValue.toLocaleString()}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 4 }}>Avg Sale Value/Order</div>
            </div>
            <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, fontWeight: 700, color: "#F5A623" }}>{snapshot.avgLead != null ? snapshot.avgLead.toFixed(1) + "h" : "—"}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 4 }}>Average Lead Time</div>
            </div>
          </div>
        ) : <EmptyNote text="Loading…" />}
      </div>
    </div>
  );
}

/* ================= DASHBOARD V2 — Forecasting & Inventory Intelligence ================= */
function DashboardV2View({ token, profile, showToast }) {
  const [loading, setLoading] = useState(true);
  const [monthly, setMonthly] = useState([]); // [{label, count, isCurrent, isFuture}]
  const [safetyBuffer, setSafetyBuffer] = useState(10);
  const [invValue, setInvValue] = useState(0);
  const [skuCount, setSkuCount] = useState(0);
  const [totalQty, setTotalQty] = useState(0);
  const [orderComposition, setOrderComposition] = useState([]); // [{orderId, skuCount, totalQty}]
  const [monthlyHistory, setMonthlyHistory] = useState([]); // [{key, label, daysInMonth, daysCovered, orders, pieces, status, bySize:{}, ordersPerDay}]
  const [cartonTypes, setCartonTypes] = useState([]);
  const [cartonPOs, setCartonPOs] = useState([]);
  const [showCartonSetup, setShowCartonSetup] = useState(false);
  const [showCartonPOForm, setShowCartonPOForm] = useState(false);
  const [newCartonType, setNewCartonType] = useState({ name: "", min_qty: "", max_qty: "", lead_time_days: 7, safety_buffer_pct: 20 });
  const [newPO, setNewPO] = useState({ carton_type_id: "", qty: "", expected_date: "" });
  const [savingCarton, setSavingCarton] = useState(false);
  const [binUtil, setBinUtil] = useState({ used: 0, total: 0 });
  const [categoryBreakdown, setCategoryBreakdown] = useState([]);
  const [fastMoving, setFastMoving] = useState([]);
  const [slowMoving, setSlowMoving] = useState([]);
  const [ageingBuckets, setAgeingBuckets] = useState([]);
  const [recentTx, setRecentTx] = useState([]);
  const [products, setProducts] = useState({});
  const [sortMode, setSortMode] = useState("chrono");

  const categoryChartRef = useRef(null);
  const categoryChartInstance = useRef(null);
  const monthlyChartRef = useRef(null);
  const monthlyChartInstance = useRef(null);
  const ageingChartRef = useRef(null);
  const ageingChartInstance = useRef(null);

  useEffect(() => {
    (async () => {
      setLoading(true);
      try {
        const [orders, products, invRows, bins, pickLines, pickTasks, putawayTasks, grnRows, loadSheets, cTypes, cPOs] = await Promise.all([
          sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=id,received_at,status`, { token }),
          sb(`/rest/v1/products?select=*&limit=20000`, { token }),
          sb(`/rest/v1/inventory?warehouse_id=eq.${profile.warehouse_id}&select=*&limit=50000`, { token }),
          sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
          sb(`/rest/v1/pick_task_lines?select=product_id,qty_picked,pick_task_id`, { token }),
          sb(`/rest/v1/pick_tasks?status=eq.picked&select=id,completed_at`, { token }),
          sb(`/rest/v1/putaway_tasks?status=eq.completed&select=product_id,qty_completed,completed_at&order=completed_at.desc&limit=15`, { token }),
          sb(`/rest/v1/grn?warehouse_id=eq.${profile.warehouse_id}&select=grn_number,created_at&order=created_at.desc&limit=10`, { token }),
          sb(`/rest/v1/load_sheets?warehouse_id=eq.${profile.warehouse_id}&select=load_sheet_number,created_at,order_ids&order=created_at.desc&limit=10`, { token }),
          sb(`/rest/v1/carton_types?warehouse_id=eq.${profile.warehouse_id}&select=*&order=sort_order.asc`, { token }),
          sb(`/rest/v1/carton_purchase_orders?warehouse_id=eq.${profile.warehouse_id}&select=*&order=created_at.desc`, { token })
        ]);
        setCartonTypes(cTypes || []);
        setCartonPOs(cPOs || []);

        const prodMap = Object.fromEntries((products || []).map(p => [p.id, p]));
        setProducts(prodMap);
        const now = new Date();

        // ---- Monthly order volume (last 4 months incl. current) ----
        const monthBuckets = {};
        for (let i = 3; i >= 0; i--) {
          const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          const key = `${d.getFullYear()}-${d.getMonth()}`;
          monthBuckets[key] = { label: d.toLocaleString("default", { month: "short", year: "2-digit" }), count: 0, year: d.getFullYear(), month: d.getMonth(), isCurrent: i === 0 };
        }
        for (const o of orders || []) {
          if (!o.received_at) continue;
          const d = new Date(o.received_at);
          const key = `${d.getFullYear()}-${d.getMonth()}`;
          if (monthBuckets[key]) monthBuckets[key].count++;
        }
        const monthArr = Object.values(monthBuckets);
        setMonthly(monthArr);

        // ---- Order composition (last 4 calendar months) — for monthly history + carton forecasting ----
        // Wrapped in its own try/catch so a failure here never blocks the rest of the dashboard.
        try {
          const classifySize = (qty) => {
            for (const ct of (cTypes || [])) {
              if (qty >= ct.min_qty && (ct.max_qty == null || qty <= ct.max_qty)) return ct.name;
            }
            return "Unclassified";
          };
          const histStart = new Date(now.getFullYear(), now.getMonth() - 3, 1).toISOString();
          const histOrders = (orders || []).filter(o => o.received_at >= histStart);
          const histOrderIds = histOrders.map(o => o.id);
          const compLines = [];
          const CHUNK = 60;
          for (let i = 0; i < histOrderIds.length; i += CHUNK) {
            const idsChunk = histOrderIds.slice(i, i + CHUNK);
            const rows = await sb(`/rest/v1/sales_order_lines?order_id=in.(${idsChunk.join(",")})&select=order_id,product_id,qty`, { token });
            compLines.push(...(rows || []));
          }
          const byOrder = {};
          for (const l of compLines) {
            if (!byOrder[l.order_id]) byOrder[l.order_id] = { products: new Set(), totalQty: 0 };
            byOrder[l.order_id].products.add(l.product_id);
            byOrder[l.order_id].totalQty += l.qty;
          }
          const compArr = Object.entries(byOrder).map(([orderId, d]) => ({ orderId, skuCount: d.products.size, totalQty: d.totalQty }));
          setOrderComposition(compArr);

          // Build monthly history buckets (last 4 months, oldest first)
          const hist = [];
          for (let i = 3; i >= 0; i--) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            hist.push({
              key: `${d.getFullYear()}-${d.getMonth()}`, y: d.getFullYear(), mo: d.getMonth(),
              label: d.toLocaleString("default", { month: "short", year: "2-digit" }),
              daysInMonth: daysInMonthOf(d.getFullYear(), d.getMonth()),
              isCurrent: i === 0, orders: 0, pieces: 0, bySize: {}
            });
          }
          const histByKey = Object.fromEntries(hist.map(h => [h.key, h]));
          for (const o of histOrders) {
            const d = new Date(o.received_at);
            const key = `${d.getFullYear()}-${d.getMonth()}`;
            const bucket = histByKey[key];
            if (!bucket) continue;
            bucket.orders++;
            const comp = byOrder[o.id];
            if (comp) {
              bucket.pieces += comp.totalQty;
              const size = classifySize(comp.totalQty);
              bucket.bySize[size] = (bucket.bySize[size] || 0) + 1;
            } else {
              bucket.bySize["Unclassified"] = (bucket.bySize["Unclassified"] || 0) + 1;
            }
          }
          const todayDate = now.getDate();
          setMonthlyHistory(hist.map(h => ({
            ...h,
            daysCovered: h.isCurrent ? todayDate : h.daysInMonth,
            status: h.isCurrent ? "Partial" : "Complete",
            ordersPerDay: Math.round((h.orders / (h.isCurrent ? todayDate : h.daysInMonth)) * 10) / 10
          })));
        } catch (e) { /* carton forecasting is best-effort — rest of dashboard still loads */ }

        // ---- Inventory value + SKU count + total qty + department breakdown ----
        let totalValue = 0;
        let totalQty = 0;
        const deptAgg = {};
        const skuSet = new Set();
        for (const r of invRows || []) {
          if (r.on_hand <= 0) continue;
          skuSet.add(r.product_id);
          const p = prodMap[r.product_id];
          const price = p?.sales_price || 0;
          totalValue += price * r.on_hand;
          totalQty += r.on_hand;
          const dept = p?.department || "Unassigned";
          deptAgg[dept] = (deptAgg[dept] || 0) + r.on_hand;
        }
        setInvValue(totalValue);
        setSkuCount(skuSet.size);
        setTotalQty(totalQty);
        setCategoryBreakdown(Object.entries(deptAgg).sort((a, b) => b[1] - a[1]).slice(0, 8));

        // ---- Bin utilization ----
        const occupiedBinIds = new Set((invRows || []).filter(r => r.on_hand > 0 && r.bin_id).map(r => r.bin_id));
        setBinUtil({ used: occupiedBinIds.size, total: (bins || []).length });

        // ---- Fast / Slow moving (last 30 days pick velocity) ----
        const taskCompletedMap = Object.fromEntries((pickTasks || []).map(t => [t.id, t.completed_at]));
        const cutoff = new Date(now.getTime() - 30 * 86400000);
        const velocity = {};
        for (const l of pickLines || []) {
          const completedAt = taskCompletedMap[l.pick_task_id];
          if (!completedAt || new Date(completedAt) < cutoff) continue;
          velocity[l.product_id] = (velocity[l.product_id] || 0) + (l.qty_picked || 0);
        }
        const onHandByProduct = {};
        for (const r of invRows || []) onHandByProduct[r.product_id] = (onHandByProduct[r.product_id] || 0) + r.on_hand;
        const stockedProductIds = Object.keys(onHandByProduct).filter(id => onHandByProduct[id] > 0);
        const velocityRanked = stockedProductIds.map(id => ({ id, qty: velocity[id] || 0, onHand: onHandByProduct[id] }));
        setFastMoving([...velocityRanked].sort((a, b) => b.qty - a.qty).slice(0, 5));
        setSlowMoving([...velocityRanked].sort((a, b) => a.qty - b.qty).slice(0, 5));

        // ---- Stock ageing buckets (using putaway completion as received-date proxy) ----
        const lastMovementByProduct = {};
        for (const t of putawayTasks || []) {
          if (!lastMovementByProduct[t.product_id] || new Date(t.completed_at) > new Date(lastMovementByProduct[t.product_id])) {
            lastMovementByProduct[t.product_id] = t.completed_at;
          }
        }
        const allPutaway = await sb(`/rest/v1/putaway_tasks?status=eq.completed&select=product_id,completed_at&order=completed_at.asc`, { token });
        const firstMovementByProduct = {};
        for (const t of allPutaway || []) {
          if (!firstMovementByProduct[t.product_id]) firstMovementByProduct[t.product_id] = t.completed_at;
        }
        const buckets = { "0-30": 0, "31-60": 0, "61-90": 0, "90+": 0 };
        for (const id of stockedProductIds) {
          const ref = firstMovementByProduct[id];
          const days = ref ? Math.floor((now - new Date(ref)) / 86400000) : 0;
          if (days <= 30) buckets["0-30"]++;
          else if (days <= 60) buckets["31-60"]++;
          else if (days <= 90) buckets["61-90"]++;
          else buckets["90+"]++;
        }
        setAgeingBuckets(Object.entries(buckets));

        // ---- Recent transactions feed ----
        const tx = [
          ...(grnRows || []).map(g => ({ type: "GRN Received", label: g.grn_number, ts: g.created_at })),
          ...(loadSheets || []).map(l => ({ type: "Dispatched", label: `${l.load_sheet_number} (${l.order_ids?.length || 0} orders)`, ts: l.created_at }))
        ].sort((a, b) => new Date(b.ts) - new Date(a.ts)).slice(0, 10);
        setRecentTx(tx);
      } catch (e) { showToast("Load failed", "err"); }
      setLoading(false);
    })();
  }, [token, profile.warehouse_id]);

  // Forecast math
  const currentMonthData = monthly.find(m => m.isCurrent);
  const daysInMonth = currentMonthData ? new Date(currentMonthData.year, currentMonthData.month + 1, 0).getDate() : 30;
  const daysElapsed = new Date().getDate();
  const runRateForecast = currentMonthData && daysElapsed > 0 ? Math.round((currentMonthData.count / daysElapsed) * daysInMonth) : 0;
  const procurementTarget = Math.round(runRateForecast * (1 + safetyBuffer / 100));

  const loadCartonData = async () => {
    const [cTypes, cPOs] = await Promise.all([
      sb(`/rest/v1/carton_types?warehouse_id=eq.${profile.warehouse_id}&select=*&order=sort_order.asc`, { token }),
      sb(`/rest/v1/carton_purchase_orders?warehouse_id=eq.${profile.warehouse_id}&select=*&order=created_at.desc`, { token })
    ]);
    setCartonTypes(cTypes || []);
    setCartonPOs(cPOs || []);
  };

  const addCartonType = async () => {
    if (!newCartonType.name.trim() || newCartonType.min_qty === "") { showToast("Naam aur Min Qty zaroori hain", "err"); return; }
    setSavingCarton(true);
    try {
      await sb(`/rest/v1/carton_types`, {
        method: "POST", token, body: {
          warehouse_id: profile.warehouse_id, name: newCartonType.name.trim(),
          min_qty: Number(newCartonType.min_qty), max_qty: newCartonType.max_qty === "" ? null : Number(newCartonType.max_qty),
          lead_time_days: Number(newCartonType.lead_time_days) || 7, safety_buffer_pct: Number(newCartonType.safety_buffer_pct) || 20,
          sort_order: cartonTypes.length
        }
      });
      showToast(`✅ Carton type "${newCartonType.name}" add ho gayi`);
      setNewCartonType({ name: "", min_qty: "", max_qty: "", lead_time_days: 7, safety_buffer_pct: 20 });
      await loadCartonData();
    } catch (e) { showToast("Add failed — dobara try karein", "err"); }
    setSavingCarton(false);
  };

  const deleteCartonType = async (id) => {
    if (!window.confirm("Yeh carton type delete karein? Iski saari purchase order history bhi chali jayegi.")) return;
    try {
      await sb(`/rest/v1/carton_types?id=eq.${id}`, { method: "DELETE", token });
      showToast("Carton type delete ho gayi");
      await loadCartonData();
    } catch (e) { showToast("Delete failed", "err"); }
  };

  const adjustOnHand = async (id, newValue) => {
    try {
      await sb(`/rest/v1/carton_types?id=eq.${id}`, { method: "PATCH", token, body: { on_hand: Math.max(0, Number(newValue) || 0), updated_at: new Date().toISOString() } });
      await loadCartonData();
    } catch (e) { showToast("Update failed", "err"); }
  };

  const addCartonPO = async () => {
    if (!newPO.carton_type_id || !newPO.qty) { showToast("Carton type aur Qty select karein", "err"); return; }
    setSavingCarton(true);
    try {
      await sb(`/rest/v1/carton_purchase_orders`, {
        method: "POST", token, body: {
          warehouse_id: profile.warehouse_id, carton_type_id: newPO.carton_type_id, qty: Number(newPO.qty),
          expected_date: newPO.expected_date || null, status: "pending", created_by: profile.id
        }
      });
      showToast(`✅ ${newPO.qty} cartons order ki gayi`);
      setNewPO({ carton_type_id: "", qty: "", expected_date: "" });
      setShowCartonPOForm(false);
      await loadCartonData();
    } catch (e) { showToast("Order add failed", "err"); }
    setSavingCarton(false);
  };

  const markPOReceived = async (po) => {
    try {
      await sb(`/rest/v1/carton_purchase_orders?id=eq.${po.id}`, { method: "PATCH", token, body: { status: "received", received_at: new Date().toISOString() } });
      const ct = cartonTypes.find(c => c.id === po.carton_type_id);
      if (ct) await sb(`/rest/v1/carton_types?id=eq.${ct.id}`, { method: "PATCH", token, body: { on_hand: ct.on_hand + po.qty } });
      showToast(`✅ ${po.qty} cartons receive ho gayi — On Hand mein add ho gayi`);
      await loadCartonData();
    } catch (e) { showToast("Update failed", "err"); }
  };

  // Carton size classification against the configured carton_types ranges
  const classifyCartonSize = (qty) => {
    for (const ct of cartonTypes) {
      if (qty >= ct.min_qty && (ct.max_qty == null || qty <= ct.max_qty)) return ct.name;
    }
    return "Unclassified";
  };

  const daysInMonthOf = (y, m) => new Date(y, m + 1, 0).getDate();
  const thisMonthDaysInMonth = daysInMonthOf(new Date().getFullYear(), new Date().getMonth());
  const daysElapsedThisMonth = new Date().getDate();
  const thisMonthHist = monthlyHistory.find(m => m.isCurrent);
  const lastCompleteMonth = [...monthlyHistory].reverse().find(m => !m.isCurrent);

  const thisMonthMTD = thisMonthHist?.orders || 0;
  const thisMonthProjected = daysElapsedThisMonth > 0 ? Math.round((thisMonthMTD / daysElapsedThisMonth) * thisMonthDaysInMonth) : 0;
  const growthTrendPct = lastCompleteMonth && lastCompleteMonth.orders > 0
    ? ((thisMonthProjected - lastCompleteMonth.orders) / lastCompleteMonth.orders) * 100
    : 0;
  const nextMonthForecast = Math.round(thisMonthProjected * (1 + growthTrendPct / 100));
  const totalOrdersAllMonths = monthlyHistory.reduce((s, m) => s + m.orders, 0);

  const nextMonthDate = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 1);
  const nextMonthDaysInMonth = daysInMonthOf(nextMonthDate.getFullYear(), nextMonthDate.getMonth());
  const daysRemainingThisMonth = Math.max(0, thisMonthDaysInMonth - daysElapsedThisMonth);

  // Historical mix % per carton size — computed across all analyzed months combined
  const combinedSizeCounts = {};
  let combinedTotal = 0;
  for (const m of monthlyHistory) {
    for (const [size, count] of Object.entries(m.bySize)) {
      combinedSizeCounts[size] = (combinedSizeCounts[size] || 0) + count;
      combinedTotal += count;
    }
  }

  const cartonPlan = cartonTypes.map(ct => {
    const mixPct = combinedTotal > 0 ? ((combinedSizeCounts[ct.name] || 0) / combinedTotal) * 100 : 0;
    const restOfMonthOrders = Math.max(0, thisMonthProjected - thisMonthMTD);
    const restOfThisMonth = Math.round((mixPct / 100) * restOfMonthOrders);
    const nextMonthNeed = Math.round((mixPct / 100) * nextMonthForecast);
    const dailyUse = nextMonthDaysInMonth > 0 ? nextMonthNeed / nextMonthDaysInMonth : 0;
    const onOrder = cartonPOs.filter(po => po.carton_type_id === ct.id && po.status === "pending").reduce((s, po) => s + po.qty, 0);
    const coverDays = dailyUse > 0 ? (ct.on_hand + onOrder) / dailyUse : 0;
    const required = Math.round(dailyUse * ct.lead_time_days * (1 + ct.safety_buffer_pct / 100));
    const netToOrder = Math.max(0, required - ct.on_hand - onOrder);
    return {
      ...ct, mixPct, restOfThisMonth, nextMonthNeed, dailyUse: Math.round(dailyUse * 10) / 10,
      onOrder, coverDays: Math.round(coverDays * 10) / 10, required, netToOrder,
      status: netToOrder > 0 ? "Order Now" : coverDays < ct.lead_time_days ? "Watch" : "OK"
    };
  });
  const totalCartonsToOrder = cartonPlan.reduce((s, c) => s + c.netToOrder, 0);

  const sortedMonthly = sortMode === "low-high" ? [...monthly].sort((a, b) => a.count - b.count) : monthly;

  useEffect(() => {
    if (!ageingChartRef.current || ageingBuckets.length === 0) return;
    if (ageingChartInstance.current) ageingChartInstance.current.destroy();
    ageingChartInstance.current = new Chart(ageingChartRef.current.getContext("2d"), {
      type: "bar",
      data: { labels: ageingBuckets.map(b => `${b[0]} days`), datasets: [{ label: "SKUs", data: ageingBuckets.map(b => b[1]), backgroundColor: ["#4ADE80", "#F5A623", "#FB923C", "#F87171"], borderRadius: 6 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { color: "#8F8879" }, grid: { color: "rgba(255,255,255,0.06)" } }, x: { ticks: { color: "#8F8879" }, grid: { display: false } } } }
    });
    return () => { if (ageingChartInstance.current) ageingChartInstance.current.destroy(); };
  }, [ageingBuckets]);

  if (loading) return <div style={{ padding: 60, textAlign: "center", color: "#8F8879", background: "#0F0D0A", borderRadius: 12, fontFamily: "'Space Grotesk', sans-serif" }}>Loading Dashboard V2…</div>;

  const DARK_BG = "#0F0D0A", CARD_BG = "#1B160E", CARD_BORDER = "rgba(245,166,35,0.14)";
  const TXT = "#F0EDE4", MUTED = "#8F8879", AMBER = "#F5A623";
  const dPanel = { background: CARD_BG, border: `1px solid ${CARD_BORDER}`, borderRadius: 14, padding: "18px 20px" };
  const dHead = { fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 700, color: TXT, marginBottom: 4 };

/* ================= PRODUCTS ================= */
function ProductsView({ token, profile, showToast }) {
  const [products, setProducts] = useState([]);
  const [totalCount, setTotalCount] = useState(null);
  const [form, setForm] = useState({ barcode: "", name: "", category: "", department: "Default", sales_price: "", image_url: "" });
  const [loading, setLoading] = useState(false);
  const [importing, setImporting] = useState(false);
  const [importSummary, setImportSummary] = useState(null);
  const [query, setQuery] = useState("");
  const searchTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=id`, { headers: { apikey: ANON_KEY, Authorization: `Bearer ${token}`, Prefer: "count=exact", Range: "0-0" } });
        const range = res.headers.get("content-range"); // e.g. "0-0/54392"
        if (range) setTotalCount(Number(range.split("/")[1]));
      } catch (e) {}
    })();
  }, [token]);

  const runSearch = useCallback((q) => {
    if (searchTimer.current) clearTimeout(searchTimer.current);
    if (!q.trim()) { setProducts([]); return; }
    setLoading(true);
    searchTimer.current = setTimeout(async () => {
      try {
        setProducts(await searchProducts(token, q, 100));
      } catch (e) { showToast("Search failed", "err"); }
      setLoading(false);
    }, 300);
  }, [token]);

  const onQueryChange = (v) => { setQuery(v); runSearch(v); };

  const load = async () => { if (query.trim()) runSearch(query); };

  const add = async () => {
    if (!form.barcode.trim() || !form.name.trim()) { showToast("Barcode aur Product name zaroori hain", "err"); return; }
    try {
      const barcode = cleanCode(form.barcode);
      await sb(`/rest/v1/products?on_conflict=sku`, {
        method: "POST", token, prefer: "resolution=merge-duplicates,return=representation",
        body: { sku: barcode, barcode, name: form.name.trim(), category: form.category.trim() || null, department: form.department.trim() || "Default", sales_price: form.sales_price ? Number(form.sales_price) : null, image_url: form.image_url.trim() || null }
      });
      setForm({ barcode: "", name: "", category: "", department: "Default", sales_price: "", image_url: "" });
      showToast("Product saved (naya ya existing update)"); load();
    } catch (e) { showToast("Save failed", "err"); }
  };

  const handleCatalogueFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImporting(true); setImportSummary(null);
    try {
      const rows = await parseSheet(file);
      if (rows.length === 0) { showToast("File khali hai", "err"); setImporting(false); return; }
      const map = buildColumnMap(Object.keys(rows[0]));
      if (!map.barcode) { showToast("Barcode column nahi mila file mein", "err"); setImporting(false); return; }
      const items = [];
      let skipped = 0;
      for (const row of rows) {
        const barcode = cleanCode(getVal(row, map, "barcode"));
        const name = String(getVal(row, map, "productName") || "").trim();
        if (!barcode) { skipped++; continue; }
        items.push({
          sku: barcode, barcode, name: name || barcode,
          category: String(getVal(row, map, "category") || "").trim() || null,
          department: String(getVal(row, map, "department") || "Default").trim(),
          sales_price: (() => { const v = Number(getVal(row, map, "salesPrice")); return isNaN(v) ? null : v; })(),
          image_url: String(getVal(row, map, "imageUrl") || "").trim() || null
        });
      }
      const CHUNK = 200;
      let inserted = 0;
      for (let i = 0; i < items.length; i += CHUNK) {
        const chunk = items.slice(i, i + CHUNK);
        await sb(`/rest/v1/products?on_conflict=sku`, { method: "POST", token, prefer: "resolution=merge-duplicates,return=minimal", body: chunk });
        inserted += chunk.length;
      }
      setImportSummary(`${inserted} products imported/updated. ${skipped} rows skipped (no barcode).`);
      showToast(`${inserted} products imported`);
      load();
    } catch (e) { showToast(`Import failed: ${(e.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  const [fixingImages, setFixingImages] = useState(false);
  const [imageFixSummary, setImageFixSummary] = useState(null);

  const handleImageUrlFixFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setFixingImages(true); setImageFixSummary(null);
    try {
      const rows = await parseSheet(file);
      if (rows.length === 0) { showToast("File khali hai", "err"); setFixingImages(false); return; }
      const map = buildColumnMap(Object.keys(rows[0]));
      if (!map.barcode) { showToast("Barcode column nahi mila file mein", "err"); setFixingImages(false); return; }
      const rawBarcodes = [...new Set(rows.map(row => cleanCode(getVal(row, map, "barcode"))).filter(Boolean))];
      const barcodeToProduct = {};
      const LOOKUP_CHUNK = 60;
      for (let i = 0; i < rawBarcodes.length; i += LOOKUP_CHUNK) {
        const chunk = rawBarcodes.slice(i, i + LOOKUP_CHUNK);
        const found = await sb(`/rest/v1/products?barcode=in.(${chunk.join(",")})&select=id,barcode`, { token });
        for (const p of found || []) barcodeToProduct[cleanCode(p.barcode)] = p;
      }
      let updated = 0, notFound = 0, skipped = 0;
      const notFoundCodes = [];
      for (const row of rows) {
        const barcode = cleanCode(getVal(row, map, "barcode"));
        const rawImageUrl = String(getVal(row, map, "imageUrl") || "").trim();
        if (!barcode || !rawImageUrl) { skipped++; continue; }
        const clearIt = rawImageUrl.toUpperCase() === "CLEAR";
        const imageUrl = clearIt ? null : rawImageUrl;
        const p = barcodeToProduct[barcode];
        if (!p) { notFound++; notFoundCodes.push(barcode); continue; }
        try {
          await sb(`/rest/v1/products?id=eq.${p.id}`, { method: "PATCH", token, body: { image_url: imageUrl } });
          updated++;
        } catch (e) { notFound++; notFoundCodes.push(`${barcode} (save failed)`); }
      }
      setImageFixSummary(`✅ ${updated} product(s) ki image URL update ho gayi (sirf image, baaki kuch nahi chheda). ${notFound} barcode nahi mile. ${skipped} rows skip hui (barcode/URL missing).${notFoundCodes.length ? " Not found: " + notFoundCodes.slice(0, 10).join(", ") + (notFoundCodes.length > 10 ? "…" : "") : ""}`);
      showToast(`✅ ${updated} image URLs update ho gayin`);
      load();
    } catch (e) { showToast(`Update failed: ${(e.message || "").slice(0, 100)}`, "err"); }
    setFixingImages(false);
  };

  return (
    <div>
      <SectionTitle title="Product Master" action={
        <div style={{ display: "flex", gap: 8 }}>
          <label style={{ ...S.secondaryBtnSm, cursor: "pointer" }}>
            {fixingImages ? "Updating…" : "🖼 Update Image URLs Only"}
            <input type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={handleImageUrlFixFile} disabled={fixingImages} />
          </label>
          <label style={{ ...S.primaryBtnSm, cursor: "pointer" }}>
            {importing ? "Importing…" : "📤 Upload catalogue (CSV/Excel)"}
            <input type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={handleCatalogueFile} disabled={importing} />
          </label>
        </div>
      } />
      {imageFixSummary && (
        <div style={{ ...S.panel, borderColor: "#4CAF7D", color: "#4CAF7D", fontSize: 12 }}>{imageFixSummary}</div>
      )}
      {importSummary && (
        <div style={{ ...S.panel, borderColor: "#4CAF7D", color: "#4CAF7D", fontSize: 12 }}>{importSummary}</div>
      )}
      <div style={{ marginBottom: 10, fontSize: 11, color: "#8A8272" }}>
        🖼 <b>Update Image URLs Only</b>: file mein sirf 2 columns chahiye — <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>barcode, image_url</span>. Yeh SIRF image_url field update karta hai — naam, category, price, department sab waise hi rahenge, koi risk nahi.
        <br />⚠ Agar kisi barcode ki image URL <b>bilkul khaali cell</b> chhoड़ें, woh row <b>skip</b> ho jayegi (kuch change nahi hoga). Agar image ko <b>jaan-boojh kar hata (clear) karna hai</b>, to us cell mein literally <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>CLEAR</span> likhein.
      </div>
      <div style={{ marginBottom: 10, fontSize: 11, color: "#8A8272" }}>
        CSV columns expected: <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#6B6355" }}>department, product_category, barcode, product_name, sales_price, image_url</span>
        {totalCount !== null && <span> · Catalogue mein {totalCount.toLocaleString()} products hain</span>}
      </div>
      <div style={S.panel}>
        <div style={S.panelTitle}>Add product</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <input style={{ ...S.input, flex: 1, minWidth: 140, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Barcode" value={form.barcode} onChange={e => setForm({ ...form, barcode: e.target.value })} />
          <CameraScanButton onScan={(text) => setForm(f => ({ ...f, barcode: text }))} label="Scan" />
          <input style={{ ...S.input, flex: 2, minWidth: 160 }} placeholder="Product name" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
          <input style={{ ...S.input, flex: 1, minWidth: 130 }} placeholder="Product category" value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} />
          <input style={{ ...S.input, flex: 1, minWidth: 110 }} placeholder="Department" value={form.department} onChange={e => setForm({ ...form, department: e.target.value })} />
          <input style={{ ...S.input, width: 110 }} type="number" placeholder="Sales price" value={form.sales_price} onChange={e => setForm({ ...form, sales_price: e.target.value })} />
          <input style={{ ...S.input, flex: 1, minWidth: 160 }} placeholder="Image URL (Shopify se)" value={form.image_url} onChange={e => setForm({ ...form, image_url: e.target.value })} />
          <button style={S.primaryBtnSm} onClick={add}>+ Add</button>
        </div>
      </div>

      <div style={{ position: "relative", margin: "0 0 12px" }}>
        <input style={{ ...S.input, paddingLeft: 34 }} placeholder="🔍 Search by barcode or product name…" value={query} onChange={e => onQueryChange(e.target.value)} />
      </div>

      <div style={S.panel}>
        {!query.trim() ? (
          <EmptyNote text="Please search — the catalogue is too large to load the full list here." />
        ) : (
          <table>
            <thead>
              <tr>
                <th style={S.th}></th><th style={S.th}>Barcode</th><th style={S.th}>Product Name</th><th style={S.th}>Department</th>
                <th style={S.th}>Category</th><th style={S.th}>Sales Price</th>
              </tr>
            </thead>
            <tbody>
              {products.map(p => (
                <tr key={p.id}>
                  <td style={S.td}>
                    {p.image_url ? <img src={p.image_url} alt="" style={{ width: 32, height: 32, objectFit: "cover", borderRadius: 4 }} onError={e => { e.target.style.display = "none"; }} /> : <span style={{ color: "#8A8272" }}>—</span>}
                  </td>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p.barcode || "—"}</td>
                  <td style={S.td}>{p.name}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{p.department || "Default"}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{p.category || "—"}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{p.sales_price != null ? p.sales_price : "—"}</td>
                </tr>
              ))}
              {!loading && products.length === 0 && <tr><td colSpan={6}><EmptyNote text="No products found." /></td></tr>}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ================= RECEIVING ================= */
function ReceivingView({ token, profile, showToast }) {
  const [grns, setGrns] = useState([]);
  const [productCache, setProductCache] = useState({});
  const [openGrn, setOpenGrn] = useState(null);
  const [lines, setLines] = useState([]);
  const [linePutawayQty, setLinePutawayQty] = useState({});
  const [linesWithPutawayTask, setLinesWithPutawayTask] = useState(new Set());
  const [source, setSource] = useState("");
  const [grnNumber, setGrnNumber] = useState("");
  const [lineQty, setLineQty] = useState(1);
  const [pendingProduct, setPendingProduct] = useState(null);
  const [importing, setImporting] = useState(false);
  const [importSummary, setImportSummary] = useState(null);
  const [grnReport, setGrnReport] = useState(null);
  const [grnLineStats, setGrnLineStats] = useState({});
  const [grnStatus, setGrnStatus] = useState({}); // grn_id -> {status, totalQty, putawayQty}
  const [rpoRecords, setRpoRecords] = useState([]);
  const [selectedRpos, setSelectedRpos] = useState({});
  const [rpoBusy, setRpoBusy] = useState(false);
  const [statusTab, setStatusTab] = useState("all");
  const [rpoSubTab, setRpoSubTab] = useState("pending");
  const [selectedGrns, setSelectedGrns] = useState({});
  const [staff, setStaff] = useState([]);
  const [bulkOfficerId, setBulkOfficerId] = useState("");
  const [bulkBusy, setBulkBusy] = useState(false);
  const canManageGrn = ["admin", "warehouse_lead"].includes(profile.role);

  const load = useCallback(async () => {
    try {
      const g = await sb(`/rest/v1/grn?select=*&order=created_at.desc`, { token });
      setGrns(g || []);
      setStaff(await sb(`/rest/v1/profiles?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }) || []);
      const rpos = await sb(`/rest/v1/rtv_returns?select=*&order=created_at.desc&limit=200`, { token });
      if (rpos && rpos.length) {
        const glIds = [...new Set(rpos.map(r => r.grn_line_id).filter(Boolean))];
        const gls = glIds.length ? await sb(`/rest/v1/grn_lines?id=in.(${glIds.join(",")})&select=*`, { token }) : [];
        const glMap = Object.fromEntries((gls || []).map(l => [l.id, l]));
        const grnIds = [...new Set((gls || []).map(l => l.grn_id))];
        const rGrns = grnIds.length ? await sb(`/rest/v1/grn?id=in.(${grnIds.join(",")})&select=*`, { token }) : [];
        const grnMap2 = Object.fromEntries((rGrns || []).map(x => [x.id, x]));
        const prodMap = await fetchProductsByIds(token, rpos.map(r => r.product_id));
        const profMap = Object.fromEntries((await sb(`/rest/v1/profiles?select=*`, { token }) || []).map(p => [p.id, p]));
        setRpoRecords(rpos.map(r => ({
          ...r,
          grnNumber: glMap[r.grn_line_id] ? grnMap2[glMap[r.grn_line_id].grn_id]?.grn_number : "—",
          product: prodMap[r.product_id],
          createdByName: profMap[r.created_by]?.full_name || "—",
          shippedByName: profMap[r.shipped_by]?.full_name || "—"
        })));
      } else setRpoRecords([]);
      const ids = (g || []).map(x => x.id);
      if (ids.length) {
        const allLines = await sb(`/rest/v1/grn_lines?grn_id=in.(${ids.join(",")})&select=id,grn_id,qty_expected,qty_received`, { token });
        const stats = {};
        const lineToGrn = {};
        for (const l of allLines || []) {
          if (!stats[l.grn_id]) stats[l.grn_id] = { count: 0, qty: 0 };
          stats[l.grn_id].count += 1; stats[l.grn_id].qty += l.qty_expected;
          lineToGrn[l.id] = l.grn_id;
        }
        setGrnLineStats(stats);

        const lineIds = (allLines || []).map(l => l.id);
        const statusMap = {};
        for (const id of ids) statusMap[id] = { status: "open", totalQty: stats[id]?.qty || 0, putawayQty: 0, anyAssigned: false };
        const linesWithPutawayTask = new Set();
        if (lineIds.length) {
          const pw = await sb(`/rest/v1/putaway_tasks?grn_line_id=in.(${lineIds.join(",")})&select=*`, { token });
          for (const t of pw || []) {
            const grnId = lineToGrn[t.grn_line_id];
            if (!grnId || !statusMap[grnId]) continue;
            statusMap[grnId].putawayQty += (t.qty_completed || 0);
            if (t.assigned_to) statusMap[grnId].anyAssigned = true;
            linesWithPutawayTask.add(t.grn_line_id);
          }
          // Direct-received lines never create a putaway_task (they skip putaway entirely) —
          // count their full expected qty as completed so they don't look stuck "pending" forever.
          for (const l of allLines || []) {
            if (!linesWithPutawayTask.has(l.id) && l.qty_received >= l.qty_expected && l.qty_expected > 0) {
              statusMap[l.grn_id].putawayQty += l.qty_expected;
            }
          }
        }
        for (const id of ids) {
          const s = statusMap[id];
          if (s.totalQty === 0) s.status = "open";
          else if (s.putawayQty >= s.totalQty && s.totalQty > 0) s.status = "completed";
          else if (s.putawayQty > 0) s.status = "partial";
          else if (s.anyAssigned) s.status = "assigned";
          else s.status = "open";
        }
        setGrnStatus(statusMap);

        // auto-complete GRN status in DB when fully put away
        for (const id of ids) {
          const s = statusMap[id];
          const grnRow = (g || []).find(x => x.id === id);
          if (s.status === "completed" && grnRow && grnRow.status !== "completed") {
            sb(`/rest/v1/grn?id=eq.${id}`, { method: "PATCH", token, body: { status: "completed", completed_at: new Date().toISOString() } }).catch(() => {});
          }
        }
      }
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const shipSelectedRpos = async () => {
    const ids = Object.keys(selectedRpos).filter(k => selectedRpos[k]);
    if (ids.length === 0) { showToast("Kam se kam ek RPO select karein", "err"); return; }
    setRpoBusy(true);
    try {
      let successCount = 0;
      for (const id of ids) {
        const result = await sb(`/rest/v1/rtv_returns?id=eq.${id}`, { method: "PATCH", token, prefer: "return=representation", body: { status: "shipped", shipped_by: profile.id, shipped_at: new Date().toISOString() } });
        if (result && result.length > 0) {
          successCount++;
          await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "rtv_return", entity_id: id, user_id: profile.id, action: "shipped_to_vendor" } });
        }
      }
      if (successCount === ids.length) {
        showToast(`${successCount} RPO(s) marked shipped`);
      } else if (successCount > 0) {
        showToast(`${successCount}/${ids.length} shipped — baaki fail hue, dobara try karein`, "err");
      } else {
        showToast("Ship action failed — koi record update nahi hua (permission check karein)", "err");
      }
      setSelectedRpos({});
      load();
    } catch (e) { showToast("Ship action failed", "err"); }
    setRpoBusy(false);
  };

  const bulkAssignPutaway = async () => {
    const ids = Object.keys(selectedGrns).filter(k => selectedGrns[k]);
    if (ids.length === 0) { showToast("GRN select karein", "err"); return; }
    if (!bulkOfficerId) { showToast("Put Away Officer select karein", "err"); return; }
    setBulkBusy(true);
    try {
      let tasksCreated = 0;
      for (const grnId of ids) {
        const grnLines = await sb(`/rest/v1/grn_lines?grn_id=eq.${grnId}&select=*`, { token });
        for (const l of grnLines || []) {
          const remaining = l.qty_expected - (l.qty_received || 0);
          if (remaining <= 0) continue;
          await sb(`/rest/v1/grn_lines?id=eq.${l.id}`, { method: "PATCH", token, body: { qty_received: l.qty_expected } });
          await sb(`/rest/v1/putaway_tasks`, { method: "POST", token, body: { grn_line_id: l.id, product_id: l.product_id, qty: remaining, status: "pending", assigned_to: bulkOfficerId } });
          tasksCreated++;
        }
        await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "grn", entity_id: grnId, user_id: profile.id, action: "bulk_assigned_putaway", metadata: { assigned_to: bulkOfficerId } } });
      }
      showToast(`${ids.length} GRN(s) assigned — ${tasksCreated} lines queued`);
      setSelectedGrns({}); setBulkOfficerId("");
      load();
    } catch (e) { showToast(`Assign failed: ${(e.message || "").slice(0, 100)}`, "err"); }
    setBulkBusy(false);
  };
  const loadLines = async (grnId) => {
    const ls = await sb(`/rest/v1/grn_lines?grn_id=eq.${grnId}&select=*`, { token }) || [];
    setLines(ls);
    const cache = await fetchProductsByIds(token, ls.map(l => l.product_id));
    setProductCache(prev => ({ ...prev, ...cache }));
    const lineIds = ls.map(l => l.id);
    if (lineIds.length) {
      const pw = await sb(`/rest/v1/putaway_tasks?grn_line_id=in.(${lineIds.join(",")})&select=*`, { token }) || [];
      const putawayMap = {};
      const linesWithTask = new Set();
      for (const t of pw) {
        putawayMap[t.grn_line_id] = (putawayMap[t.grn_line_id] || 0) + (t.qty_completed || 0);
        linesWithTask.add(t.grn_line_id);
      }
      setLinePutawayQty(putawayMap);
      setLinesWithPutawayTask(linesWithTask);
    } else { setLinePutawayQty({}); setLinesWithPutawayTask(new Set()); }
  };

  const handleGrnFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImporting(true); setImportSummary(null); setGrnReport(null);
    try {
      const rows = await parseSheet(file);
      if (rows.length === 0) { showToast("File khali hai", "err"); setImporting(false); return; }
      const map = buildColumnMap(Object.keys(rows[0]));
      if (!map.barcode || !map.reference) { showToast("Barcode ya Reference column nahi mila", "err"); setImporting(false); return; }

      const fileBarcodes = rows.map(r => getVal(r, map, "barcode"));
      const productMap = await fetchProductsByBarcodes(token, fileBarcodes);

      // check for lines already imported against the same GRN reference (avoid duplicate processing)
      const fileRefs = [...new Set(rows.map(r => cleanCode(getVal(r, map, "reference"))).filter(Boolean))];
      const existingGrns = fileRefs.length ? await sb(`/rest/v1/grn?grn_number=in.(${fileRefs.map(encodeURIComponent).join(",")})&select=id,grn_number`, { token }) : [];
      const existingGroupLines = {};
      if (existingGrns && existingGrns.length) {
        const grnIds = existingGrns.map(g => g.id);
        const existLines = await sb(`/rest/v1/grn_lines?grn_id=in.(${grnIds.join(",")})&select=grn_id,product_id`, { token });
        const idToRef = Object.fromEntries(existingGrns.map(g => [g.id, g.grn_number]));
        const prodBarcode = {}; // product_id -> barcode, from productMap values
        for (const p of Object.values(productMap)) prodBarcode[p.id] = cleanCode(p.barcode || p.sku);
        for (const l of existLines || []) {
          const ref = idToRef[l.grn_id];
          const bc = prodBarcode[l.product_id];
          if (ref && bc) existingGroupLines[`${ref}|${bc}`] = true;
        }
      }

      const report = validateImportRows(rows, map, productMap, "reference", existingGroupLines);
      const meta = {};
      for (const r of report.validRows) {
        if (!meta[r.groupVal]) {
          const srcRow = rows.find(row => cleanCode(getVal(row, map, "reference")) === r.groupVal);
          meta[r.groupVal] = {
            source: String(getVal(srcRow, map, "contact") || "").trim(),
            poNumber: String(getVal(srcRow, map, "sourceDocument") || "").trim()
          };
        }
      }
      setGrnReport({ report, map, meta });
      showToast(`Validated: ${report.validRows.length} valid, ${report.invalidRows.length} invalid`);
    } catch (err) { showToast(`Validation failed: ${(err.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  const confirmGrnImport = async () => {
    if (!grnReport) return;
    setImporting(true);
    try {
      const groups = {};
      for (const r of grnReport.report.validRows) {
        if (!groups[r.groupVal]) groups[r.groupVal] = [];
        groups[r.groupVal].push(r);
      }
      const existingGrns = await sb(`/rest/v1/grn?select=id,grn_number`, { token });
      const grnMap = Object.fromEntries((existingGrns || []).map(g => [g.grn_number, g.id]));

      let grnsCreated = 0, linesAdded = 0;
      for (const [ref, groupRows] of Object.entries(groups)) {
        let grnId = grnMap[ref];
        if (!grnId) {
          const m = grnReport.meta[ref] || {};
          const created = await sb(`/rest/v1/grn`, {
            method: "POST", token, prefer: "return=representation",
            body: { grn_number: ref, warehouse_id: profile.warehouse_id, source: m.source || "", po_number: m.poNumber || null, status: "open" }
          });
          grnId = created[0].id;
          grnMap[ref] = grnId;
          grnsCreated++;
        }
        for (const r of groupRows) {
          await sb(`/rest/v1/grn_lines`, { method: "POST", token, body: { grn_id: grnId, product_id: r.product.id, qty_expected: r.qty } });
          linesAdded++;
        }
      }
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "grn", entity_id: profile.id, user_id: profile.id, action: `bulk_import_${grnsCreated}_grns` } });
      setImportSummary(`${grnsCreated} GRN(s) created, ${linesAdded} lines added.`);
      showToast(`Import done — ${grnsCreated} GRNs, ${linesAdded} lines`);
      setGrnReport(null);
      load();
    } catch (err) { showToast(`Import failed: ${(err.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  const [poNumber, setPoNumber] = useState("");
  const createGrn = async () => {
    if (!grnNumber.trim()) return;
    try {
      const created = await sb(`/rest/v1/grn`, { method: "POST", token, prefer: "return=representation", body: { grn_number: grnNumber.trim(), po_number: poNumber.trim() || null, warehouse_id: profile.warehouse_id, source: source.trim(), status: "open" } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "grn", entity_id: created[0].id, user_id: profile.id, action: "created" } });
      setGrnNumber(""); setSource(""); setPoNumber(""); showToast("GRN created"); load();
      setOpenGrn(created[0]); loadLines(created[0].id);
    } catch (e) { showToast("GRN number may already exist", "err"); }
  };
  const addLine = async (product) => {
    if (!product || lineQty <= 0 || !openGrn) return;
    await sb(`/rest/v1/grn_lines`, { method: "POST", token, body: { grn_id: openGrn.id, product_id: product.id, qty_expected: Number(lineQty) } });
    setProductCache(prev => ({ ...prev, [product.id]: product }));
    setLineQty(1); loadLines(openGrn.id);
  };
  const receiveLine = async (line) => {
    if (!bulkOfficerId) { showToast("Pehle Put Away Officer select karein", "err"); return; }
    const qty = line.qty_expected - (line.qty_received || 0);
    if (qty <= 0) return;
    await sb(`/rest/v1/grn_lines?id=eq.${line.id}`, { method: "PATCH", token, body: { qty_received: line.qty_expected } });
    await sb(`/rest/v1/putaway_tasks`, { method: "POST", token, body: { grn_line_id: line.id, product_id: line.product_id, qty, status: "pending", assigned_to: bulkOfficerId } });
    await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "grn_line", entity_id: line.id, user_id: profile.id, action: "received_to_putaway_queue", metadata: { qty, assigned_to: bulkOfficerId } } });
    showToast(`Received — ${staff.find(s => s.id === bulkOfficerId)?.full_name || "officer"} ko putaway assign ho gaya`);
    loadLines(openGrn.id);
  };
  const completeGrn = async () => {
    await sb(`/rest/v1/grn?id=eq.${openGrn.id}`, { method: "PATCH", token, body: { status: "completed", completed_at: new Date().toISOString() } });
    showToast("GRN marked completed"); setOpenGrn(null); load();
  };
  if (openGrn) {
    const allReceived = lines.length > 0 && lines.every(l => l.qty_received >= l.qty_expected);
    return (
      <div>
        <SectionTitle title={`GRN ${openGrn.grn_number}`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenGrn(null)}>← Back to GRN list</button>} />
        <div style={S.panel}>
          <div style={S.panelTitle}>Add line item</div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
            <ProductPicker token={token} onSelect={(p) => setPendingProduct(p)} />
            {pendingProduct && (
              <span style={{ ...S.badgeSm, color: "#F5A623", borderColor: "#F5A623" }}>{pendingProduct.barcode} — {pendingProduct.name} <span style={{ cursor: "pointer", marginLeft: 6 }} onClick={() => setPendingProduct(null)}>✕</span></span>
            )}
            <input style={{ ...S.input, width: 90 }} type="number" min={1} value={lineQty} onChange={e => setLineQty(e.target.value)} />
            <button style={S.primaryBtnSm} onClick={() => { addLine(pendingProduct); setPendingProduct(null); }}>+ Add line</button>
          </div>
        </div>
        <div style={S.panel}>
          <div style={S.panelTitle}>Receive Karne Se Pehle Put Away Officer Select Karein</div>
          <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 10 }}>Yeh officer har line k "Receive → Putaway" pe use hoga — is se koi bhi task unassigned nahi banega.</div>
          <select style={{ ...S.input, minWidth: 220 }} value={bulkOfficerId} onChange={e => setBulkOfficerId(e.target.value)}>
            <option value="">Put Away Officer select karein…</option>
            {staff.filter(s => s.id !== profile.id).map(s => <option key={s.id} value={s.id}>{s.full_name} ({s.role})</option>)}
          </select>
        </div>
        <div style={S.panel}>
          <div style={S.panelTitle}>Lines</div>
          <table>
            <thead><tr><th style={S.th}>SKU</th><th style={S.th}>Expected</th><th style={S.th}>Received</th><th style={S.th}>Put Away Status</th><th style={S.th}></th></tr></thead>
            <tbody>
              {lines.map(l => {
                const p = productCache[l.product_id];
                const done = l.qty_received >= l.qty_expected;
                const pwQty = linePutawayQty[l.id] || 0;
                const remaining = Math.max(0, l.qty_expected - pwQty);
                let pwStatus, pwColor;
                if (done && !linesWithPutawayTask.has(l.id)) { pwStatus = "Completed (Direct)"; pwColor = "#4CAF7D"; }
                else if (pwQty <= 0) { pwStatus = "Pending"; pwColor = "#8A8272"; }
                else if (pwQty < l.qty_expected) { pwStatus = `Partial (${remaining} pending)`; pwColor = "#F5A623"; }
                else { pwStatus = "Completed"; pwColor = "#4CAF7D"; }
                return (
                  <tr key={l.id}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                    <td style={S.td}>{l.qty_expected}</td>
                    <td style={S.td}>{l.qty_received || 0}</td>
                    <td style={S.td}><span style={{ ...S.badgeSm, color: pwColor, borderColor: pwColor }}>{pwStatus}</span></td>
                    <td style={S.td}>
                      {!done ? (
