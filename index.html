    } catch (e) { showToast("Tote already exists", "err"); }
  };

  const [releaseReasonId, setReleaseReasonId] = useState(null);
  const [releaseReason, setReleaseReason] = useState("");

  const forceRelease = async (tote) => {
    if (!releaseReason.trim()) { showToast("Reason likhna zaroori hai", "err"); return; }
    try {
      const prevPacker = tote.assigned_to ? profiles[tote.assigned_to]?.full_name : "—";
      await sb(`/rest/v1/totes?id=eq.${tote.id}`, {
        method: "PATCH", token,
        body: { status: "open", assigned_to: null, locked_by: null, last_reassign_reason: releaseReason.trim(), last_reassigned_by: profile.id, last_reassigned_at: new Date().toISOString() }
      });
      await sb(`/rest/v1/audit_trail`, { method: "POST", token, body: { entity_type: "tote", entity_id: tote.id, field_changed: "assigned_to", old_value: prevPacker, new_value: "Unassigned", reason: releaseReason.trim(), changed_by: profile.id } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "tote", entity_id: tote.id, user_id: profile.id, action: "force_released", metadata: { reason: releaseReason.trim(), previous: prevPacker } } });
      showToast(`${tote.tote_number} force-released`);
      setReleaseReasonId(null); setReleaseReason(""); load();
    } catch (e) { showToast("Release failed", "err"); }
  };

  return (
    <div>
      <SectionTitle title="Tote Master (physical trolleys)" />
      <div style={S.panel}>
        <div style={S.panelTitle}>Add tote</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input style={{ ...S.input, maxWidth: 200 }} placeholder="e.g. TOT-9" value={newCode} onChange={e => setNewCode(e.target.value)} />
          <button style={S.primaryBtnSm} onClick={addTote}>+ Add</button>
        </div>
      </div>
      <div style={S.cardGrid}>
        {totes.map(t => (
          <div key={t.id} style={S.card}>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 15 }}>{t.tote_number}</span>
              <span style={{ ...S.badgeSm, color: t.status === "open" ? "#4CAF7D" : "#5B9EE8", borderColor: t.status === "open" ? "#4CAF7D" : "#5B9EE8" }}>{t.status}</span>
            </div>
            <div style={{ color: "#6B6355", fontSize: 12, marginTop: 8 }}>
              {t.assigned_to ? `With: ${profiles[t.assigned_to]?.full_name || "—"}` : "Unassigned"}
            </div>
            {t.last_reassign_reason && (
              <div style={{ color: "#8A8272", fontSize: 10, marginTop: 6 }}>Last reassign: "{t.last_reassign_reason}" — {profiles[t.last_reassigned_by]?.full_name || "—"}, {fmtTime(t.last_reassigned_at)}</div>
            )}
            {t.status !== "open" && (
              releaseReasonId === t.id ? (
                <div style={{ marginTop: 10 }}>
                  <input style={{ ...S.input, fontSize: 12 }} placeholder="Reason for reassign/release" value={releaseReason} onChange={e => setReleaseReason(e.target.value)} />
                  <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                    <button style={{ ...S.secondaryBtnSm, flex: 1, justifyContent: "center", color: "#4CAF7D", borderColor: "#4CAF7D" }} onClick={() => forceRelease(t)}>Confirm</button>
                    <button style={{ ...S.secondaryBtnSm, flex: 1, justifyContent: "center" }} onClick={() => { setReleaseReasonId(null); setReleaseReason(""); }}>Cancel</button>
                  </div>
                </div>
              ) : (
                <button style={{ ...S.secondaryBtnSm, marginTop: 10, width: "100%", justifyContent: "center" }} onClick={() => setReleaseReasonId(t.id)}>🔓 Reassign / Release</button>
              )
            )}
          </div>
        ))}
        {totes.length === 0 && <EmptyNote text="Koi tote nahi hai — upar se add karein." />}
      </div>
    </div>
  );
}

/* ================= CHANGE PASSWORD (self-service, all roles) ================= */
function ChangePasswordView({ token, showToast }) {
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    if (newPassword.length < 6) { showToast("Password kam se kam 6 characters ka ho", "err"); return; }
    if (newPassword !== confirmPassword) { showToast("Dono password match nahi ho rahe", "err"); return; }
    setBusy(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        method: "PUT",
        headers: { apikey: ANON_KEY, Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ password: newPassword })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.msg || data.error_description || data.error || "Failed");
      showToast("Password change ho gaya ✓");
      setNewPassword(""); setConfirmPassword("");
    } catch (e) {
      showToast(`Failed: ${(e.message || "").slice(0, 100)}`, "err");
    }
    setBusy(false);
  };

  return (
    <div>
      <SectionTitle title="Change Password" />
      <div style={{ ...S.panel, maxWidth: 420 }}>
        <div style={S.label}>NEW PASSWORD</div>
        <input type="password" style={S.input} value={newPassword} onChange={e => setNewPassword(e.target.value)} placeholder="Kam se kam 6 characters" />
        <div style={S.label}>CONFIRM NEW PASSWORD</div>
        <input type="password" style={S.input} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)}
          onKeyDown={e => e.key === "Enter" && submit()} placeholder="Dobara likhein" />
        <button style={{ ...S.primaryBtnSm, marginTop: 16, width: "100%", justifyContent: "center" }} onClick={submit} disabled={busy}>
          {busy ? "Saving…" : "🔑 Update Password"}
        </button>
      </div>
    </div>
  );
}

/* ================= CAMERA BARCODE SCANNER ================= */
function CameraScanModal({ onScan, onClose }) {
  const regionId = useRef("scan-region-" + Math.random().toString(36).slice(2, 9)).current;
  useEffect(() => {
    let scanner = null;
    let stopped = false;
    let cancelled = false;
    const timer = setTimeout(() => {
      if (cancelled) return;
      scanner = new Html5Qrcode(regionId);
      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 260, height: 160 } },
        (decodedText) => {
          if (stopped) return;
          stopped = true;
          scanner.stop().then(() => scanner.clear()).catch(() => {}).finally(() => onScan(decodedText));
        },
        () => {}
      ).catch(() => { onClose(); });
    }, 50);
    return () => {
      cancelled = true;
      clearTimeout(timer);
      if (scanner && !stopped) { stopped = true; scanner.stop().then(() => scanner.clear()).catch(() => {}); }
    };
  }, []);
  return (
    <div style={S.scanOverlay}>
      <div style={S.scanModal}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <span style={{ color: "#2B2620", fontFamily: "'Space Grotesk', sans-serif", fontSize: 14 }}>📷 Scan barcode</span>
          <button style={S.iconBtnCircle} onClick={onClose}>✕</button>
        </div>
        <div id={regionId} style={{ width: "100%", borderRadius: 8, overflow: "hidden" }}></div>
        <div style={{ color: "#6B6355", fontSize: 11, marginTop: 10, textAlign: "center" }}>Camera ko barcode ke upar point karein</div>
      </div>
    </div>
  );
}

/* ---- Product search typeahead (replaces full-catalogue <select> dropdowns) ---- */
function ProductPicker({ token, onSelect, placeholder }) {
  const [q, setQ] = useState("");
  const [results, setResults] = useState([]);
  const [open, setOpen] = useState(false);
  const timerRef = useRef(null);

  const doSearch = (val) => {
    setQ(val);
    if (timerRef.current) clearTimeout(timerRef.current);
    if (!val.trim()) { setResults([]); setOpen(false); return; }
    timerRef.current = setTimeout(async () => {
      const r = await searchProducts(token, val);
      setResults(r);
      setOpen(true);
    }, 300);
  };

  const pick = (p) => {
    onSelect(p);
    setQ(""); setResults([]); setOpen(false);
  };

  return (
    <div style={{ position: "relative", flex: 2, minWidth: 220 }}>
      <input style={S.input} placeholder={placeholder || "🔍 Search barcode or product name…"} value={q}
        onChange={e => doSearch(e.target.value)} onFocus={() => q && results.length && setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 150)} />
      {open && (
        <div style={S.pickerDropdown}>
          {results.length === 0 ? (
            <div style={{ padding: "10px 12px", color: "#8A8272", fontSize: 12 }}>No matches</div>
          ) : results.map(p => (
            <div key={p.id} style={S.pickerItem} onMouseDown={() => pick(p)}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 12 }}>{p.barcode}</span>
              <span style={{ color: "#2B2620", marginLeft: 8, fontSize: 13 }}>{p.name}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function exportCSV(filename, headers, rows) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [headers.map(esc).join(","), ...rows.map(r => r.map(esc).join(","))].join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ================= helpers ================= */
// Add/subtract on-hand qty at a SPECIFIC bin (or the "unassigned" row when binId is null).
async function addOnHand(token, warehouseId, productId, binId, qtyDelta) {
  const filter = binId
    ? `warehouse_id=eq.${warehouseId}&product_id=eq.${productId}&bin_id=eq.${binId}`
    : `warehouse_id=eq.${warehouseId}&product_id=eq.${productId}&bin_id=is.null`;
  const existing = await sb(`/rest/v1/inventory?${filter}&select=*`, { token });
  if (existing && existing.length > 0) {
    const row = existing[0];
    const newQty = row.on_hand + qtyDelta;
    if (newQty <= 0) {
      await sb(`/rest/v1/inventory?id=eq.${row.id}`, { method: "PATCH", token, body: { on_hand: 0 } });
    } else {
      await sb(`/rest/v1/inventory?id=eq.${row.id}`, { method: "PATCH", token, body: { on_hand: newQty } });
    }
  } else if (qtyDelta > 0) {
    await sb(`/rest/v1/inventory`, { method: "POST", token, body: { warehouse_id: warehouseId, product_id: productId, bin_id: binId, on_hand: qtyDelta } });
  }
}
// Adjust the reservation counter for a product (independent of any specific bin).
async function adjustReserved(token, warehouseId, productId, delta) {
  const existing = await sb(`/rest/v1/inventory_reserved?warehouse_id=eq.${warehouseId}&product_id=eq.${productId}&select=*`, { token });
  if (existing && existing.length > 0) {
    const newQty = Math.max(0, existing[0].reserved + delta);
    await sb(`/rest/v1/inventory_reserved?warehouse_id=eq.${warehouseId}&product_id=eq.${productId}`, { method: "PATCH", token, body: { reserved: newQty } });
  } else if (delta > 0) {
    await sb(`/rest/v1/inventory_reserved`, { method: "POST", token, body: { warehouse_id: warehouseId, product_id: productId, reserved: delta } });
  }
}
// Total on-hand across all bins for a product, and current reservation.
async function getStockSummary(token, warehouseId, productId) {
  const [rows, res] = await Promise.all([
    sb(`/rest/v1/inventory?warehouse_id=eq.${warehouseId}&product_id=eq.${productId}&select=*`, { token }),
    sb(`/rest/v1/inventory_reserved?warehouse_id=eq.${warehouseId}&product_id=eq.${productId}&select=*`, { token })
  ]);
  const onHand = (rows || []).reduce((s, r) => s + r.on_hand, 0);
  const reserved = (res && res[0]) ? res[0].reserved : 0;
  return { rows: rows || [], onHand, reserved, available: onHand - reserved };
}
// Deducts qty from bins (largest bin first) when goods actually leave the warehouse (dispatch).
async function deductStock(token, warehouseId, productId, qty) {
  const rows = (await sb(`/rest/v1/inventory?warehouse_id=eq.${warehouseId}&product_id=eq.${productId}&select=*&order=on_hand.desc`, { token })) || [];
  let remaining = qty;
  for (const row of rows) {
    if (remaining <= 0) break;
    const take = Math.min(row.on_hand, remaining);
    if (take > 0) {
      await sb(`/rest/v1/inventory?id=eq.${row.id}`, { method: "PATCH", token, body: { on_hand: row.on_hand - take } });
      remaining -= take;
    }
  }
}
