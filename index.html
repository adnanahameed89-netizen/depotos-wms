    setScans({ ...scans, [p.id]: current + 1 });
    setLastScannedProduct(p);
    showToast(`Scanned: ${p.barcode}`);
  };

  const allScanned = requiredLines.length > 0 && requiredLines.every(l => (scans[l.product_id] || 0) >= l.qty);

  const completePacking = async () => {
    const order = orders[openTask.order_id];
    const labelNumber = `LBL-${order.external_order_id}-${Date.now().toString().slice(-5)}`;
    await sb(`/rest/v1/pack_tasks?id=eq.${openTask.id}`, {
      method: "PATCH", token,
      body: { status: "labeled", scans: JSON.stringify(scans), label_number: labelNumber, assigned_to: profile.id, completed_at: new Date().toISOString() }
    });
    await sb(`/rest/v1/sales_orders?id=eq.${openTask.order_id}`, { method: "PATCH", token, body: { status: "rtd" } });
    await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "pack_task", entity_id: openTask.id, user_id: profile.id, action: "labeled", metadata: { label_number: labelNumber } } });
    showToast(`Packed & labeled: ${labelNumber}`);

    if (openTask.tote_id) {
      const remaining = await sb(`/rest/v1/pack_tasks?tote_id=eq.${openTask.tote_id}&status=eq.pending&select=*`, { token });
      if (!remaining || remaining.length === 0) {
        await sb(`/rest/v1/totes?id=eq.${openTask.tote_id}`, { method: "PATCH", token, body: { status: "open", assigned_to: null, locked_by: null, completed_at: new Date().toISOString() } });
        showToast("Tote fully packed — all orders RTD, trolley ab dobara available hai");
        setOpenTask(null); setOpenTote(null); load();
        return;
      }
      // auto-advance to next bin in sequence
      const next = [...remaining].sort((a, b) => (binNumMap[a.order_id] || 99) - (binNumMap[b.order_id] || 99))[0];
      showToast(`Bin ${binNumMap[next.order_id] || "?"} → next order`);
      openPack(next);
      load();
      return;
    }
    setOpenTask(null); load();
  };

  if (openTask) {
    const order = orders[openTask.order_id];
    return (
      <div>
        <SectionTitle title={`Packing — ${order?.external_order_id}${binNumMap[openTask.order_id] ? ` · Bin #${binNumMap[openTask.order_id]}` : ""}`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenTask(null)}>← Back</button>} />
        <div style={S.panel}>
          <div style={S.panelTitle}>Scan each item to verify</div>
          <div style={{ display: "flex", gap: 10 }}>
            <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type barcode / SKU, then Enter"
              value={barcodeInput} onChange={e => setBarcodeInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && scanBarcode()} />
            <CameraScanButton onScan={(text) => scanBarcode(text)} />
            <button style={S.primaryBtnSm} onClick={() => scanBarcode()}>Scan</button>
          </div>
        </div>
        {lastScannedProduct && (
          <div style={{ ...S.panel, display: "flex", gap: 16, alignItems: "center" }}>
            {lastScannedProduct.image_url ? (
              <ZoomableImage src={lastScannedProduct.image_url} alt="" style={{ width: 90, height: 90, objectFit: "cover", borderRadius: 8, border: "1px solid #E0D8C5", flexShrink: 0 }} />
            ) : (
              <div style={{ width: 90, height: 90, borderRadius: 8, border: "1px dashed #E0D8C5", display: "flex", alignItems: "center", justifyContent: "center", color: "#8A8272", fontSize: 24, flexShrink: 0 }}>📦</div>
            )}
            <div>
              <div style={{ color: "#6B6355", fontSize: 10, letterSpacing: 1 }}>LAST SCANNED — VERIFY PRODUCT</div>
              <div style={{ color: "#2B2620", fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, marginTop: 4 }}>{lastScannedProduct.name}</div>
              <div style={{ color: "#F5A623", fontSize: 12, fontFamily: "'IBM Plex Mono', monospace", marginTop: 2 }}>{lastScannedProduct.barcode}</div>
            </div>
          </div>
        )}
        <div style={S.panel}>
          <div style={S.panelTitle}>Progress</div>
          {requiredLines.map(l => {
            const p = products[l.product_id];
            const got = scans[l.product_id] || 0;
            const done = got >= l.qty;
            return (
              <div key={l.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid #EFE8D8" }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", width: 110 }}>{p?.sku}</span>
                <span style={{ flex: 1, color: "#2B2620", fontSize: 13 }}>{p?.name}</span>
                <span style={{ ...S.badgeSm, color: done ? "#4CAF7D" : "#6B6355", borderColor: done ? "#4CAF7D" : "#E0D8C5" }}>{got} / {l.qty}</span>
              </div>
            );
          })}
          {allScanned && (
            <button style={{ ...S.primaryBtnSm, marginTop: 16 }} onClick={completePacking}>🏷 Complete packing & generate label</button>
          )}
        </div>
      </div>
    );
  }

  if (openTote) {
    const toteTasks = [...tasks.filter(t => t.tote_id === openTote.id)].sort((a, b) => (binNumMap[a.order_id] || 99) - (binNumMap[b.order_id] || 99));
    return (
      <div>
        <SectionTitle title={`${openTote.tote_number} — ${toteTasks.length} orders to pack`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenTote(null)}>← Back</button>} />
        <div style={S.cardGrid}>
          {toteTasks.map(t => {
            const o = orders[t.order_id];
            return (
              <div key={t.id} style={S.card} onClick={() => openPack(t)}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span style={{ ...S.badgeSm, color: "#F5A623", borderColor: "#F5A623" }}>Bin #{binNumMap[t.order_id] || "?"}</span>
                  <span style={{ ...S.badgeSm, color: "#F5A623", borderColor: "#F5A623" }}>Ready to pack</span>
                </div>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: "#6B6355", marginTop: 8 }}>{o?.external_order_id}</div>
                <div style={{ color: "#2B2620", fontSize: 14, marginTop: 4 }}>{o?.courier}</div>
              </div>
            );
          })}
          {toteTasks.length === 0 && <EmptyNote text="Is tote ke sab orders pack ho chuke hain." />}
        </div>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle title="Packing" />
      <div style={S.panel}>
        <div style={S.panelTitle}>Scan tote to begin packing</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan/type tote number, then Enter"
            value={toteScanInput} onChange={e => setToteScanInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && scanTote()} />
          <CameraScanButton onScan={(text) => scanTote(text)} />
          <button style={S.primaryBtnSm} onClick={() => scanTote()}>Open tote</button>
        </div>
      </div>
      <div style={S.panel}>
        <div style={S.panelTitle}>Or open a single order directly</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Order number, then Enter"
            value={orderScanInput} onChange={e => setOrderScanInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && openByOrderNumber()} />
          <CameraScanButton onScan={(text) => openByOrderNumber(text)} />
          <button style={S.secondaryBtnSm} onClick={() => openByOrderNumber()}>Open</button>
        </div>
      </div>
      <SectionTitle title="Totes ready for packing" />
      <div style={S.cardGrid}>
        {totes.map(tt => {
          const count = tasks.filter(t => t.tote_id === tt.id).length;
          return (
            <div key={tt.id} style={S.card} onClick={() => scanTote(tt.tote_number)}>
              <span>🧺</span>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 15, marginTop: 10 }}>{tt.tote_number}</div>
              <div style={{ color: "#6B6355", fontSize: 12, marginTop: 4 }}>{count} orders to pack</div>
            </div>
          );
        })}
        {totes.length === 0 && <EmptyNote text="Koi tote packing ke liye ready nahi hai." />}
      </div>
    </div>
  );
}

/* ================= DISPATCH / LOAD SHEET ================= */
function DispatchView({ token, profile, showToast }) {
  const [orders, setOrders] = useState([]);
  const [selected, setSelected] = useState({});
  const [loadSheets, setLoadSheets] = useState([]);
  const [profiles, setProfiles] = useState({});
  const [scanTrackingInput, setScanTrackingInput] = useState("");
  const [handoverModal, setHandoverModal] = useState(null);
  const [courierRepName, setCourierRepName] = useState("");
  const [handoverRemarks, setHandoverRemarks] = useState("");

  const confirmHandover = async () => {
    if (!handoverModal) return;
    try {
      await sb(`/rest/v1/load_sheets?id=eq.${handoverModal.id}`, {
        method: "PATCH", token,
        body: { handover_status: "handed_over", handed_over_by: profile.id, handed_over_at: new Date().toISOString(), courier_rep_name: courierRepName.trim() || null, handover_remarks: handoverRemarks.trim() || null }
      });
      const ids = handoverModal.order_ids || [];
      for (const orderId of ids) {
        await sb(`/rest/v1/sales_orders?id=eq.${orderId}`, { method: "PATCH", token, body: { status: "handed_over" } });
      }
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "load_sheet", entity_id: handoverModal.id, user_id: profile.id, action: "handed_over", metadata: { courier_rep_name: courierRepName, remarks: handoverRemarks } } });
      showToast(`${handoverModal.load_sheet_number} handed over ✓`);
      setHandoverModal(null); setCourierRepName(""); setHandoverRemarks("");
      load();
    } catch (e) { showToast("Handover confirm failed", "err"); }
  };

  const load = useCallback(async () => {
    try {
      const [o, ls, pf] = await Promise.all([
        sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&status=in.(rtd,scanned)&select=*`, { token }),
        sb(`/rest/v1/load_sheets?warehouse_id=eq.${profile.warehouse_id}&select=*&order=created_at.desc`, { token }),
        sb(`/rest/v1/profiles?select=*`, { token })
      ]);
      setOrders(o || []); setLoadSheets(ls || []);
      setProfiles(Object.fromEntries((pf || []).map(p => [p.id, p])));
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const toggle = (id) => setSelected({ ...selected, [id]: !selected[id] });

  const scanTracking = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : scanTrackingInput).trim();
    setScanTrackingInput("");
    if (!code) return;
    const order = orders.find(o => o.external_order_id === code);
    if (!order) { showToast("Tracking number is packed-orders list mein nahi mila", "err"); return; }
    if (selected[order.id]) { showToast("Already selected"); return; }
    setSelected(prev => ({ ...prev, [order.id]: true }));
    try {
      await sb(`/rest/v1/sales_orders?id=eq.${order.id}`, { method: "PATCH", token, body: { status: "scanned" } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: order.id, user_id: profile.id, action: "tracking_scanned" } });
    } catch (e) {}
    showToast(`Added: ${order.external_order_id} (${order.courier})`);
  };

  const nextLoadSheetNumber = async (courierName) => {
    const prefix = courierName.trim().slice(0, 3).toUpperCase();
    const existing = await sb(`/rest/v1/load_sheets?warehouse_id=eq.${profile.warehouse_id}&courier=eq.${encodeURIComponent(courierName)}&select=load_sheet_number`, { token });
    let maxSerial = 0;
    for (const ls of existing || []) {
      const m = String(ls.load_sheet_number).match(/(\d+)$/);
      if (m) maxSerial = Math.max(maxSerial, parseInt(m[1], 10));
    }
    return `${prefix}${String(maxSerial + 1).padStart(5, "0")}`;
  };

  const createLoadSheet = async () => {
    const ids = Object.keys(selected).filter(k => selected[k]);
    if (ids.length === 0) { showToast("Kam se kam ek order select karein", "err"); return; }
    try {
      const byCourier = {};
      for (const id of ids) {
        const o = orders.find(x => x.id === id);
        const c = o?.courier || "Other";
        if (!byCourier[c]) byCourier[c] = [];
        byCourier[c].push(id);
      }
      const generated = [];
      for (const [courierName, orderIds] of Object.entries(byCourier)) {
        const lsNumber = await nextLoadSheetNumber(courierName);
        await sb(`/rest/v1/load_sheets`, { method: "POST", token, body: { warehouse_id: profile.warehouse_id, courier: courierName, load_sheet_number: lsNumber, order_ids: orderIds, created_by: profile.id } });
        for (const orderId of orderIds) {
          const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${orderId}&select=*`, { token });
          for (const l of lines) {
            await deductStock(token, profile.warehouse_id, l.product_id, l.qty);
            await adjustReserved(token, profile.warehouse_id, l.product_id, -l.qty);
          }
          await sb(`/rest/v1/sales_orders?id=eq.${orderId}`, { method: "PATCH", token, body: { status: "dispatched", dispatched_at: new Date().toISOString() } });
          await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: orderId, user_id: profile.id, action: "dispatched", metadata: { load_sheet: lsNumber } } });
        }
        generated.push(`${lsNumber} (${courierName}, ${orderIds.length})`);
      }
      showToast(`Load sheet(s) created: ${generated.join(" · ")}`);
      setSelected({}); load();
    } catch (e) { showToast("Load sheet creation failed", "err"); }
  };

  return (
    <div>
      <SectionTitle title="Dispatch / Load Sheet — RTD orders" />
      <div style={S.panel}>
        <div style={S.panelTitle}>Scan tracking numbers to verify</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan/type tracking number, then Enter"
            value={scanTrackingInput} onChange={e => setScanTrackingInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && scanTracking()} />
          <CameraScanButton onScan={(text) => scanTracking(text)} />
          <button style={S.primaryBtnSm} onClick={() => scanTracking()}>Verify</button>
        </div>
      </div>
      <div style={S.panel}>
        <div style={S.panelTitle}>RTD orders — red = pending, green = verified</div>
        {orders.length === 0 ? <EmptyNote text="No RTD orders waiting." /> : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))", gap: 8 }}>
            {orders.map(o => {
              const ok = o.status === "scanned" || !!selected[o.id];
              return (
                <div key={o.id} onClick={() => toggle(o.id)} style={{
                  cursor: "pointer", borderRadius: 8, padding: "10px 12px",
                  background: ok ? "rgba(76,175,125,0.12)" : "rgba(229,72,77,0.08)",
                  border: `1px solid ${ok ? "#4CAF7D" : "#E5484D"}`
                }}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: ok ? "#4CAF7D" : "#E5484D", fontSize: 13 }}>{o.external_order_id}</div>
                  <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>{o.courier} · {ok ? "Verified" : "Pending"}</div>
                </div>
              );
            })}
          </div>
        )}
        <div style={{ display: "flex", gap: 10, marginTop: 14, alignItems: "center" }}>
          <button style={S.primaryBtnSm} onClick={createLoadSheet}>🚚 Create load sheet(s) — auto courier-wise</button>
          <span style={{ color: "#8A8272", fontSize: 11 }}>Verified orders alag-alag courier ke hon to system khud alag load sheets bana dega</span>
        </div>
      </div>
      <div style={S.panel}>
        <div style={S.panelTitle}>Recent load sheets</div>
        {loadSheets.map(ls => {
          const handedOver = ls.handover_status === "handed_over";
          return (
          <div key={ls.id} style={{ padding: "10px 0", borderBottom: "1px solid #EFE8D8" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#2B2620" }}>{ls.load_sheet_number}</span>
              <span style={{ color: "#6B6355", fontSize: 12 }}>{ls.courier} · {ls.order_ids?.length || 0} orders · {fmtTime(ls.created_at)}</span>
              <span style={{ ...S.badgeSm, color: handedOver ? "#4CAF7D" : "#F5A623", borderColor: handedOver ? "#4CAF7D" : "#F5A623" }}>{handedOver ? "HANDED OVER" : "READY FOR HANDOVER"}</span>
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
              <button style={S.secondaryBtnSm} onClick={async () => {
                const ids = ls.order_ids || [];
                if (ids.length === 0) return;
                const os = await sb(`/rest/v1/sales_orders?id=in.(${ids.join(",")})&select=*`, { token });
                const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
                const rows = [
                  [esc("Load Sheet Number"), esc(ls.load_sheet_number)],
                  [esc("Courier"), esc(ls.courier)],
                  [esc("Created Date"), esc(fmtTime(ls.created_at))],
                  [esc("Created By"), esc(profiles[ls.created_by]?.full_name || "—")],
                  [],
                  [esc("Customer"), esc("Tracking"), esc("Qty"), esc("Order Timestamp")]
                ];
                for (const o of os || []) {
                  const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${o.id}&select=qty`, { token });
                  const qty = (lines || []).reduce((s, l) => s + l.qty, 0);
                  rows.push([esc(o.raw_data?.customer_order_number || o.raw_data?.customer || "—"), esc(o.external_order_id), esc(qty), esc(fmtTime(o.dispatched_at))]);
                }
                const csv = rows.map(r => r.join(",")).join("\n");
                const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url; a.download = `${ls.load_sheet_number}.csv`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
              }}>⬇ Export CSV</button>
              <button style={S.secondaryBtnSm} onClick={async () => {
                const ids = ls.order_ids || [];
                const os = ids.length ? await sb(`/rest/v1/sales_orders?id=in.(${ids.join(",")})&select=*`, { token }) : [];
                let rowsHtml = "";
                for (const o of os || []) {
                  const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${o.id}&select=qty`, { token });
                  const qty = (lines || []).reduce((s, l) => s + l.qty, 0);
                  rowsHtml += `<tr><td>${o.raw_data?.customer_order_number || o.raw_data?.customer || "—"}</td><td>${o.external_order_id}</td><td>${qty}</td></tr>`;
                }
                const w = window.open("", "_blank");
                w.document.write(`<html><head><title>${ls.load_sheet_number}</title><style>
                  body{font-family:Arial;padding:24px;color:#111} h2{margin-bottom:4px} .meta{color:#555;font-size:13px;margin-bottom:16px}
                  table{width:100%;border-collapse:collapse} th,td{border:1px solid #ccc;padding:8px;text-align:left;font-size:13px}
                  th{background:#eee}
                </style></head><body>
                  <h2>Load Sheet: ${ls.load_sheet_number}</h2>
                  <div class="meta">Courier: ${ls.courier} &nbsp;|&nbsp; Date: ${fmtTime(ls.created_at)} &nbsp;|&nbsp; Created by: ${profiles[ls.created_by]?.full_name || "—"} &nbsp;|&nbsp; Orders: ${ids.length}</div>
                  <table><thead><tr><th>Customer</th><th>Tracking</th><th>Qty</th></tr></thead><tbody>${rowsHtml}</tbody></table>
                </body></html>`);
                w.document.close();
                w.print();
              }}>🖨 Print</button>
              {!handedOver && ["admin", "warehouse_lead"].includes(profile.role) && (
                <button style={{ ...S.secondaryBtnSm, color: "#4CAF7D", borderColor: "#4CAF7D" }} onClick={() => setHandoverModal(ls)}>✓ Confirm Handover</button>
              )}
              {handedOver && (
                <span style={{ color: "#6B6355", fontSize: 11, alignSelf: "center" }}>By {profiles[ls.handed_over_by]?.full_name || "—"} · {fmtTime(ls.handed_over_at)} {ls.courier_rep_name ? `· Rep: ${ls.courier_rep_name}` : ""}</span>
              )}
            </div>
          </div>
          );
        })}
        {loadSheets.length === 0 && <EmptyNote text="No load sheets yet." />}
        <div style={{ marginTop: 12, fontSize: 11, color: "#8A8272" }}>
          ⚠ Email auto-send abhi nahi hai (real backend chahiye) — load sheet yahan record ho jata hai, aap manually forward kar sakte hain jab tak hum email automation set up karein.
        </div>
      </div>

      {handoverModal && (
        <div style={S.scanOverlay}>
          <div style={S.scanModal}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
              <span style={{ color: "#2B2620", fontFamily: "'Space Grotesk', sans-serif", fontSize: 15 }}>Confirm Handover — {handoverModal.load_sheet_number}</span>
              <button style={S.iconBtnCircle} onClick={() => setHandoverModal(null)}>✕</button>
            </div>
            <div style={S.label}>COURIER REPRESENTATIVE NAME (optional)</div>
            <input style={S.input} value={courierRepName} onChange={e => setCourierRepName(e.target.value)} placeholder="e.g. Waqas" />
            <div style={S.label}>REMARKS (optional)</div>
            <input style={S.input} value={handoverRemarks} onChange={e => setHandoverRemarks(e.target.value)} placeholder="Koi note" />
            <button style={{ ...S.primaryBtnSm, marginTop: 16, width: "100%", justifyContent: "center" }} onClick={confirmHandover}>✓ Confirm — mark HANDED OVER</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= USERS ================= */
function UsersView({ token, profile, showToast }) {
  const [users, setUsers] = useState([]);
  const [warehouses, setWarehouses] = useState([]);
  const [form, setForm] = useState({ full_name: "", email: "", password: "", role: "picker", warehouse_id: profile.warehouse_id || "" });
  const [busy, setBusy] = useState(false);
  const [editAccessId, setEditAccessId] = useState(null);
  const [editOverrides, setEditOverrides] = useState({});

  const NAV_LIST = [
    ["dashboard", "Dashboard"], ["products", "Products"], ["receiving", "Receiving"], ["putaway", "Putaway"],
    ["inventory", "Inventory"], ["orders", "Sales Orders"], ["picking", "Picking"], ["packing", "Packing"],
    ["dispatch", "Dispatch"], ["returns", "Returns"], ["reports", "Reports"], ["bins", "Bin Master"],
    ["totemaster", "Tote Master"], ["users", "Users"]
  ];
  const ROLE_DEFAULT_NAV = {
    admin: ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch", "returns", "reports", "bins", "totemaster", "users"],
    warehouse_lead: ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch", "returns", "reports"],
    supervisor: ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch", "returns", "reports"],
    returns_agent: ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch", "returns", "reports"]
  };

  const openEditAccess = (u) => {
    setEditAccessId(u.id);
    setEditOverrides(u.nav_overrides || {});
  };

  const isNavVisible = (u, navId) => {
    const roleDefault = (ROLE_DEFAULT_NAV[u.role] || ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch"]).includes(navId);
    const override = (u.nav_overrides || {})[navId];
    if (override === true) return true;
    if (override === false) return false;
    return roleDefault;
  };

  const saveAccess = async (u) => {
    try {
      await sb(`/rest/v1/profiles?id=eq.${u.id}`, { method: "PATCH", token, body: { nav_overrides: editOverrides } });
      showToast(`${u.full_name} ki access update ho gayi`);
      setEditAccessId(null);
      load();
    } catch (e) { showToast("Access save failed", "err"); }
  };

  const setPutawayMode = async (u, mode) => {
    try {
      await sb(`/rest/v1/profiles?id=eq.${u.id}`, { method: "PATCH", token, body: { putaway_mode: mode } });
      showToast(`${u.full_name} → ${mode === "bulk" ? "Bulk" : "Piece-to-Piece"} mode`);
      load();
    } catch (e) { showToast("Mode change failed", "err"); }
  };

  const load = useCallback(async () => {
    try {
      const [u, w] = await Promise.all([
        sb(`/rest/v1/profiles?select=*&order=full_name.asc`, { token }),
        sb(`/rest/v1/warehouses?select=*`, { token })
      ]);
      setUsers(u || []); setWarehouses(w || []);
    } catch (e) { showToast("Load failed", "err"); }
  }, [token]);
  useEffect(() => { load(); }, [load]);

  const addUser = async () => {
    if (!form.full_name.trim() || !form.email.trim() || form.password.length < 6) {
      showToast("Name, email, aur kam se kam 6-character password chahiye", "err");
      return;
    }
    setBusy(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
        method: "POST",
        headers: { apikey: ANON_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email: form.email.trim(), password: form.password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.msg || data.error_description || data.error || "Signup failed");
      const newUserId = data.user?.id || data.id;
      if (!newUserId) throw new Error("User ID nahi mila — response check karein");

      await sb(`/rest/v1/profiles`, {
        method: "POST", token,
        body: { id: newUserId, full_name: form.full_name.trim(), role: form.role, warehouse_id: form.role === "admin" ? null : form.warehouse_id || null }
      });
      showToast(`${form.full_name} add ho gaye — email: ${form.email}`);
      setForm({ full_name: "", email: "", password: "", role: "picker", warehouse_id: profile.warehouse_id || "" });
      load();
    } catch (e) {
      showToast(`Failed: ${(e.message || "").slice(0, 100)}`, "err");
    }
    setBusy(false);
  };

  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  const deleteUser = async (u) => {
    if (u.id === profile.id) { showToast("Aap khud ko delete nahi kar sakte", "err"); return; }
    try {
      await sb(`/rest/v1/profiles?id=eq.${u.id}`, { method: "DELETE", token });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "user", entity_id: u.id, user_id: profile.id, action: "removed_from_wms", metadata: { removed_name: u.full_name } } });
      showToast(`${u.full_name} WMS se remove ho gaye`);
      setConfirmDeleteId(null);
      load();
    } catch (e) { showToast("Delete failed", "err"); }
  };

  const ROLE_LABEL = { admin: "Admin", warehouse_lead: "Warehouse Lead", supervisor: "Supervisor", picker: "Picker", packer: "Packer", putaway_officer: "Putaway Officer", dispatcher: "Dispatcher", returns_agent: "Returns Agent" };

  return (
    <div>
      <SectionTitle title="Users & roles" />
      <div style={S.panel}>
        <div style={S.panelTitle}>Add staff member</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <input style={{ ...S.input, flex: 1, minWidth: 140 }} placeholder="Full name" value={form.full_name} onChange={e => setForm({ ...form, full_name: e.target.value })} />
          <input style={{ ...S.input, flex: 1, minWidth: 160 }} placeholder="Email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} />
          <input style={{ ...S.input, flex: 1, minWidth: 140 }} type="password" placeholder="Password (min 6 chars)" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} />
          <select style={{ ...S.input, minWidth: 140 }} value={form.role} onChange={e => setForm({ ...form, role: e.target.value })}>
            <option value="picker">Picker</option>
            <option value="packer">Packer</option>
            <option value="putaway_officer">Putaway Officer</option>
            <option value="dispatcher">Dispatcher</option>
            <option value="supervisor">Supervisor</option>
            <option value="warehouse_lead">Warehouse Lead</option>
            <option value="returns_agent">Returns Agent</option>
            <option value="admin">Admin</option>
          </select>
          {form.role !== "admin" && (
            <select style={{ ...S.input, minWidth: 160 }} value={form.warehouse_id} onChange={e => setForm({ ...form, warehouse_id: e.target.value })}>
              <option value="">Select warehouse</option>
              {warehouses.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
            </select>
          )}
          <button style={S.primaryBtnSm} onClick={addUser} disabled={busy}>{busy ? "Adding…" : "+ Add staff"}</button>
        </div>
        <div style={{ marginTop: 12, fontSize: 11, color: "#8A8272" }}>
          ⚠ Naya staff member is email/password se seedha login kar sakega. Real email inbox zaroori nahi (jab tak "Confirm email" Supabase mein off hai).
        </div>
      </div>
      <div style={S.cardGrid}>
        {users.map(u => (
          <div key={u.id} style={S.card}>
            <div style={{ color: "#2B2620", fontFamily: "'Space Grotesk', sans-serif", fontSize: 15 }}>{u.full_name}</div>
            <div style={{ marginTop: 6 }}>
              <span style={{ ...S.badgeSm, color: "#F5A623", borderColor: "#F5A623" }}>{ROLE_LABEL[u.role] || u.role}</span>
              {u.nav_overrides && Object.keys(u.nav_overrides).length > 0 && (
                <span style={{ ...S.badgeSm, color: "#5B9EE8", borderColor: "#5B9EE8", marginLeft: 6 }}>Custom access</span>
              )}
            </div>
            <div style={{ color: "#6B6355", fontSize: 12, marginTop: 8 }}>
              {warehouses.find(w => w.id === u.warehouse_id)?.name || (u.role === "admin" ? "All warehouses" : "No warehouse set")}
            </div>
            <div style={{ marginTop: 10 }}>
              <div style={S.label}>PUTAWAY SCAN MODE</div>
              <select style={{ ...S.input, fontSize: 12 }} value={u.putaway_mode || "bulk"} onChange={e => setPutawayMode(u, e.target.value)}>
                <option value="bulk">📦 Bulk — scan once, type qty manually</option>
                <option value="piece">🔢 Piece-to-Piece — scan every physical unit</option>
              </select>
            </div>
            <button style={{ ...S.secondaryBtnSm, marginTop: 10, width: "100%", justifyContent: "center" }} onClick={() => editAccessId === u.id ? setEditAccessId(null) : openEditAccess(u)}>
              {editAccessId === u.id ? "✕ Close" : "🔐 Edit Access"}
            </button>
            {editAccessId === u.id && (
              <div style={{ marginTop: 10, borderTop: "1px solid #E0D8C5", paddingTop: 10 }}>
                {NAV_LIST.map(([navId, label]) => {
                  const checked = isNavVisible({ ...u, nav_overrides: editOverrides }, navId);
                  return (
                    <label key={navId} style={{ display: "flex", alignItems: "center", gap: 8, padding: "4px 0", fontSize: 12, color: "#2B2620", cursor: "pointer" }}>
                      <input type="checkbox" checked={checked} onChange={e => setEditOverrides({ ...editOverrides, [navId]: e.target.checked })} />
                      {label}
                    </label>
                  );
                })}
                <button style={{ ...S.primaryBtnSm, marginTop: 10, width: "100%", justifyContent: "center" }} onClick={() => saveAccess(u)}>💾 Save access</button>
              </div>
            )}
            {u.id !== profile.id && (
              confirmDeleteId === u.id ? (
                <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                  <button style={{ ...S.secondaryBtnSm, flex: 1, justifyContent: "center", color: "#E5484D", borderColor: "#E5484D" }} onClick={() => deleteUser(u)}>Confirm delete</button>
                  <button style={{ ...S.secondaryBtnSm, flex: 1, justifyContent: "center" }} onClick={() => setConfirmDeleteId(null)}>Cancel</button>
                </div>
              ) : (
                <button style={{ ...S.secondaryBtnSm, marginTop: 8, width: "100%", justifyContent: "center", color: "#E5484D", borderColor: "#E5484D" }} onClick={() => setConfirmDeleteId(u.id)}>🗑 Delete user</button>
              )
            )}
          </div>
        ))}
        {users.length === 0 && <EmptyNote text="No staff yet." />}
      </div>
      <div style={{ fontSize: 11, color: "#8A8272", marginTop: 4 }}>
        ⚠ "Delete user" sirf WMS profile hataata hai (access khatam ho jayega). Unka Supabase Auth account agar poori tarah delete karna ho to Supabase dashboard → Authentication → Users se manually karna hoga.
      </div>
    </div>
  );
}

/* ================= RETURNS ================= */
function ReturnsView({ token, profile, showToast }) {
  const [returns, setReturns] = useState([]);
  const [products, setProducts] = useState({});
  const [orders, setOrders] = useState([]);
  const [orderScanInput, setOrderScanInput] = useState("");
  const [openReturn, setOpenReturn] = useState(null);
  const [openLines, setOpenLines] = useState([]);
  const [matchedOrder, setMatchedOrder] = useState(null);
  const [scanInput, setScanInput] = useState("");
  const [lineQty, setLineQty] = useState(1);
  const [lineCondition, setLineCondition] = useState("good");
  const [bins, setBins] = useState([]);
  const [lineBin, setLineBin] = useState("");
  const [importing, setImporting] = useState(false);
  const [importReport, setImportReport] = useState(null);
  const canImport = ["admin", "warehouse_lead"].includes(profile.role);

  const load = useCallback(async () => {
    try {
      const [r, o] = await Promise.all([
        sb(`/rest/v1/returns?select=*&order=received_at.desc`, { token }),
        sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token })
      ]);
      setReturns(r || []); setOrders(o || []);
      setBins(await sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }) || []);
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const scanOrderTracking = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : orderScanInput).trim();
    setOrderScanInput("");
    if (!code) return;
    const order = orders.find(o => o.external_order_id === code);
    try {
      const created = await sb(`/rest/v1/returns`, {
        method: "POST", token, prefer: "return=representation",
        body: { order_id: order ? order.id : null, courier: order?.courier || "Other", status: "pending" }
      });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "return", entity_id: created[0].id, user_id: profile.id, action: "created", metadata: { tracking: code } } });
      showToast(order ? `Order mila — ${order.courier}` : "Order database mein nahi mila, phir bhi return record ban gaya");
      load();
      setMatchedOrder(order || null);
      setOpenLines([]);
      setOpenReturn(created[0]);
    } catch (e) { showToast(`Failed: ${(e.message || "").slice(0, 100)}`, "err"); }
  };

  const openReturnDetail = async (ret) => {
    const lines = await sb(`/rest/v1/return_lines?return_id=eq.${ret.id}&select=*`, { token });
    setOpenLines(lines || []);
    const newProducts = await fetchProductsByIds(token, (lines || []).map(l => l.product_id));
    setProducts(prev => ({ ...prev, ...newProducts }));
    setMatchedOrder(orders.find(o => o.id === ret.order_id) || null);
    setOpenReturn(ret);
  };

  const scanReturnItem = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : scanInput).trim();
    setScanInput("");
    if (!code) return;
    if (lineCondition === "damaged" && !lineBin) { showToast("Damaged item ke liye pehle bin location select karein", "err"); return; }
    const product = await lookupProductByCode(token, code);
    if (!product) { showToast("Barcode/SKU match nahi hua", "err"); return; }
    try {
      await sb(`/rest/v1/return_lines`, { method: "POST", token, body: { return_id: openReturn.id, product_id: product.id, qty: Number(lineQty) || 1, condition: lineCondition, bin_id: lineCondition === "damaged" ? lineBin : null } });
      setProducts(prev => ({ ...prev, [product.id]: product }));
      showToast(`✓ ${product.barcode} added (${lineCondition})`);
      setLineQty(1);
      openReturnDetail(openReturn);
    } catch (e) { showToast("Add failed", "err"); }
  };

  const submitReturn = async () => {
    try {
      let anyGood = false, anyDamaged = false;
      let strNumber = null;
      for (const l of openLines) {
        if (l.condition === "good") {
          anyGood = true;
          // Route to Putaway queue instead of direct restock — same accountable flow as GRN receiving
          await sb(`/rest/v1/putaway_tasks`, { method: "POST", token, body: { product_id: l.product_id, qty: l.qty, return_line_id: l.id, status: "pending" } });
          await sb(`/rest/v1/return_lines?id=eq.${l.id}`, { method: "PATCH", token, body: { processed_via_putaway: true } });
        } else if (l.condition === "damaged") {
          anyDamaged = true;
          const existing = await sb(`/rest/v1/damage_inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${l.product_id}&bin_id=eq.${l.bin_id}&select=*`, { token });
          if (existing && existing.length > 0) {
            await sb(`/rest/v1/damage_inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${l.product_id}&bin_id=eq.${l.bin_id}`, { method: "PATCH", token, body: { qty: existing[0].qty + l.qty } });
          } else {
            await sb(`/rest/v1/damage_inventory`, { method: "POST", token, body: { warehouse_id: profile.warehouse_id, product_id: l.product_id, bin_id: l.bin_id, qty: l.qty } });
          }
        }
      }
      if (anyDamaged) {
        strNumber = `STR-${(openReturn.courier || "GEN").replace(/\s/g, "")}-${new Date().toISOString().slice(0, 10).replace(/-/g, "")}-${Date.now().toString().slice(-4)}`;
      }
      await sb(`/rest/v1/returns?id=eq.${openReturn.id}`, { method: "PATCH", token, body: { status: "restocked", processed_by: profile.id, processed_at: new Date().toISOString(), ...(strNumber ? { str_number: strNumber } : {}) } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "return", entity_id: openReturn.id, user_id: profile.id, action: "submitted", metadata: { str_number: strNumber, good: anyGood, damaged: anyDamaged } } });
      showToast(anyGood ? "Return submitted — good items Putaway queue mein bhej diye" : strNumber ? `Processed — STR: ${strNumber}` : "Return submitted");
      setOpenReturn(null); load();
    } catch (e) { showToast("Submit failed", "err"); }
  };

  const handleReturnsImportFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImporting(true); setImportReport(null);
    try {
      const rows = await parseSheet(file);
      if (rows.length === 0) { showToast("File khali hai", "err"); setImporting(false); return; }
      const map = buildColumnMap(Object.keys(rows[0]));
      const condHeader = Object.keys(rows[0]).find(h => normHeader(h) === "condition");
      const reasonHeader = Object.keys(rows[0]).find(h => normHeader(h) === "reason");
      if (!map.barcode || !map.orderRef) { showToast("Barcode ya Tracking column nahi mila", "err"); setImporting(false); return; }
      const fileBarcodes = rows.map(r => getVal(r, map, "barcode"));
      const productMap = await fetchProductsByBarcodes(token, fileBarcodes);
      const valid = [], invalid = [];
      rows.forEach((row, i) => {
        const tracking = cleanCode(getVal(row, map, "orderRef"));
        const barcode = cleanCode(getVal(row, map, "barcode"));
        const qty = Number(getVal(row, map, "qty")) || 1;
        const product = barcode ? productMap[barcode] : null;
        const condition = (condHeader ? String(row[condHeader] || "good") : "good").trim().toLowerCase() === "damaged" ? "damaged" : "good";
        if (!tracking || !product) { invalid.push({ rowNum: i + 2, tracking, barcode }); return; }
        valid.push({ tracking, product, qty, condition, courier: String(getVal(row, map, "courier") || "Other").trim(), reason: reasonHeader ? String(row[reasonHeader] || "") : "" });
      });
      setImportReport({ valid, invalid, fileName: file.name });
      showToast(`Validated: ${valid.length} valid, ${invalid.length} invalid`);
    } catch (err) { showToast(`Validation failed: ${(err.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  const confirmReturnsImport = async () => {
    if (!importReport) return;
    setImporting(true);
    try {
      const byTracking = {};
      for (const r of importReport.valid) { (byTracking[r.tracking] = byTracking[r.tracking] || []).push(r); }
      let created = 0;
      for (const [tracking, rows] of Object.entries(byTracking)) {
        const order = orders.find(o => o.external_order_id === tracking);
        const first = rows[0];
        const ret = await sb(`/rest/v1/returns`, {
          method: "POST", token, prefer: "return=representation",
          body: { order_id: order ? order.id : null, courier: first.courier, reason: first.reason, status: "restocked", processed_by: profile.id, processed_at: new Date().toISOString() }
        });
        for (const r of rows) {
          await sb(`/rest/v1/return_lines`, { method: "POST", token, body: { return_id: ret[0].id, product_id: r.product.id, qty: r.qty, condition: r.condition } });
        }
        created++;
      }
      showToast(`${created} historical return record(s) imported`);
      setImportReport(null); load();
    } catch (e) { showToast("Import failed", "err"); }
    setImporting(false);
  };

  if (openReturn) {
    return (
      <div>
        <SectionTitle title={`Return — ${matchedOrder?.external_order_id || "Unlinked"} (${openReturn.courier || "—"})`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenReturn(null)}>← Back</button>} />
        {matchedOrder && (
          <div style={{ ...S.panel, fontSize: 12, color: "#6B6355" }}>ℹ️ Original order match mil gaya — customer/courier auto-linked. Original items reference ke liye order detail dekhein.</div>
        )}
        <div style={S.panel}>
          <div style={S.panelTitle}>Scan each returned product</div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
            <input autoFocus style={{ ...S.input, flex: 1, minWidth: 180, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type barcode/SKU, then Enter"
              value={scanInput} onChange={e => setScanInput(e.target.value)} onKeyDown={e => e.key === "Enter" && scanReturnItem()} />
            <CameraScanButton onScan={(text) => scanReturnItem(text)} />
            <input style={{ ...S.input, width: 80 }} type="number" min={1} value={lineQty} onChange={e => setLineQty(e.target.value)} />
            <div style={{ display: "flex", gap: 8 }}>
              {["good", "damaged"].map(c => (
                <button key={c} onClick={() => setLineCondition(c)} style={{ ...S.secondaryBtnSm, ...(lineCondition === c ? { background: c === "good" ? "#4CAF7D" : "#E5484D", color: "#1A1206", borderColor: c === "good" ? "#4CAF7D" : "#E5484D" } : {}) }}>
                  {c === "good" ? "✓ Good" : "✕ Damaged"}
                </button>
              ))}
            </div>
            {lineCondition === "damaged" && (
              <select style={{ ...S.input, minWidth: 160 }} value={lineBin} onChange={e => setLineBin(e.target.value)}>
                <option value="">Damage bin location</option>
                {bins.map(b => <option key={b.id} value={b.id}>{b.code}</option>)}
              </select>
            )}
            <button style={S.primaryBtnSm} onClick={() => scanReturnItem()}>Scan</button>
          </div>
        </div>
        <div style={S.panel}>
          <div style={S.panelTitle}>Items scanned</div>
          <table>
            <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Condition</th><th style={S.th}>Bin</th></tr></thead>
            <tbody>
              {openLines.map(l => {
                const p = products[l.product_id];
                const bin = bins.find(b => b.id === l.bin_id);
                return (
                  <tr key={l.id}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode}</td>
                    <td style={S.td}>{p?.name}</td>
                    <td style={S.td}>{l.qty}</td>
                    <td style={S.td}><span style={{ ...S.badgeSm, color: l.condition === "good" ? "#4CAF7D" : "#E5484D", borderColor: l.condition === "good" ? "#4CAF7D" : "#E5484D" }}>{l.condition}</span></td>
                    <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace" }}>{bin?.code || "—"}</td>
                  </tr>
                );
              })}
              {openLines.length === 0 && <tr><td colSpan={5}><EmptyNote text="Abhi tak koi item scan nahi hua." /></td></tr>}
            </tbody>
          </table>
          {openLines.length > 0 && (
            <button style={{ ...S.primaryBtnSm, marginTop: 14 }} onClick={submitReturn}>✓ Submit return — Good items Put Away queue mein jayenge</button>
          )}
        </div>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle title="Returns" action={
        canImport ? (
          <label style={{ ...S.secondaryBtnSm, cursor: "pointer" }}>
            {importing ? "Importing…" : "📤 Import historical returns"}
            <input type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={handleReturnsImportFile} disabled={importing} />
          </label>
        ) : null
      } />
      {importReport && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Historical returns — validation report ({importReport.fileName})</div>
          <div style={{ display: "flex", gap: 20, marginBottom: 12 }}>
            <div><span style={{ color: "#4CAF7D", fontWeight: 700, fontSize: 18 }}>{importReport.valid.length}</span> <span style={{ color: "#6B6355", fontSize: 12 }}>valid</span></div>
            <div><span style={{ color: "#E5484D", fontWeight: 700, fontSize: 18 }}>{importReport.invalid.length}</span> <span style={{ color: "#6B6355", fontSize: 12 }}>invalid</span></div>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <button style={S.primaryBtnSm} onClick={confirmReturnsImport} disabled={importing || importReport.valid.length === 0}>✓ Confirm import</button>
            <button style={S.secondaryBtnSm} onClick={() => setImportReport(null)}>Cancel</button>
          </div>
        </div>
      )}
      <div style={S.panel}>
        <div style={S.panelTitle}>Scan order tracking number — courier se return receive hua</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type tracking number, then Enter"
            value={orderScanInput} onChange={e => setOrderScanInput(e.target.value)} onKeyDown={e => e.key === "Enter" && scanOrderTracking()} />
          <CameraScanButton onScan={(text) => scanOrderTracking(text)} />
          <button style={S.primaryBtnSm} onClick={() => scanOrderTracking()}>Start Return</button>
        </div>
      </div>
      <div style={S.cardGrid}>
        {returns.map(r => {
          const order = orders.find(o => o.id === r.order_id);
          return (
            <div key={r.id} style={S.card} onClick={() => openReturnDetail(r)}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span>↩</span>
                <span style={{ ...S.badgeSm, color: r.status === "pending" ? "#6B6355" : r.status === "restocked" ? "#4CAF7D" : "#E5484D", borderColor: r.status === "pending" ? "#E0D8C5" : r.status === "restocked" ? "#4CAF7D" : "#E5484D" }}>{r.status}</span>
              </div>
              <div style={{ color: "#2B2620", fontSize: 14, marginTop: 10 }}>{order?.external_order_id || "No order link"}</div>
              <div style={{ color: "#6B6355", fontSize: 12, marginTop: 4 }}>{r.reason || "No reason noted"}</div>
              {r.str_number && <div style={{ color: "#F5A623", fontSize: 11, marginTop: 6, fontFamily: "'IBM Plex Mono', monospace" }}>{r.str_number}</div>}
              <div style={{ color: "#8A8272", fontSize: 11, marginTop: 8, fontFamily: "'IBM Plex Mono', monospace" }}>{fmtTime(r.received_at)}</div>
            </div>
          );
        })}
        {returns.length === 0 && <EmptyNote text="No returns logged yet." />}
      </div>
    </div>
  );
}

/* ================= REPORTS ================= */
function categorizeEvent(ev) {
  if (ev.entity_type === "putaway_task") return "Put Away";
  if (ev.entity_type === "pick_task") return "Pick";
  if (ev.entity_type === "pack_task") return "Pack";
  if (ev.entity_type === "sales_order" && ev.action === "dispatched") return "Dispatch";
  if (ev.entity_type === "return" || ev.entity_type === "return_line") return "Returns";
  if (ev.entity_type === "grn" || ev.entity_type === "grn_line") return "GRN";
  return "Other";
}
const CATEGORIES = ["GRN", "Put Away", "Pick", "Pack", "Dispatch", "Returns"];

function ReportsView({ token, profile, showToast }) {
  const [loading, setLoading] = useState(true);
  const [staffCounts, setStaffCounts] = useState([]);
  const [leadTime, setLeadTime] = useState({ avgHours: null, samples: 0 });
  const [profiles, setProfiles] = useState({});
  const [pickDurations, setPickDurations] = useState([]);
  const [rawEvents, setRawEvents] = useState([]);
  const [teamComparison, setTeamComparison] = useState([]);
  const [hourlyData, setHourlyData] = useState([]);
  const [timelineUserId, setTimelineUserId] = useState("");
  const [timelineDate, setTimelineDate] = useState(new Date().toISOString().slice(0, 10));
  const [staffHours, setStaffHours] = useState([]);
  const [execSummary, setExecSummary] = useState(null);

  useEffect(() => {
    (async () => {
      setLoading(true);
      try {
        const [events, profs, orders, pickTasks] = await Promise.all([
          sb(`/rest/v1/event_log?select=*&order=created_at.desc&limit=2000`, { token }),
          sb(`/rest/v1/profiles?select=*`, { token }),
          sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&status=eq.dispatched&select=*`, { token }),
          sb(`/rest/v1/pick_tasks?status=eq.picked&select=*`, { token })
        ]);
        const profMap = Object.fromEntries((profs || []).map(p => [p.id, p]));
        setProfiles(profMap);
        setRawEvents(events || []);
        if (!timelineUserId && profs && profs.length) setTimelineUserId(profs[0].id);

        const pickDurByUser = {};
        for (const pt of pickTasks || []) {
          if (!pt.assigned_at || !pt.completed_at || !pt.assigned_to) continue;
          const mins = (new Date(pt.completed_at) - new Date(pt.assigned_at)) / 60000;
          if (!pickDurByUser[pt.assigned_to]) pickDurByUser[pt.assigned_to] = [];
          pickDurByUser[pt.assigned_to].push(mins);
        }
        const pickAvg = Object.entries(pickDurByUser).map(([userId, arr]) => ({
          userId, name: profMap[userId]?.full_name || "Unknown",
          avgMins: arr.reduce((a, b) => a + b, 0) / arr.length, count: arr.length
        })).sort((a, b) => a.avgMins - b.avgMins);
        setPickDurations(pickAvg);

        const counts = {};
        const catCounts = {};
        for (const ev of events || []) {
          if (!ev.user_id) continue;
          if (!counts[ev.user_id]) counts[ev.user_id] = {};
          counts[ev.user_id][ev.action] = (counts[ev.user_id][ev.action] || 0) + 1;
          const cat = categorizeEvent(ev);
          if (!catCounts[ev.user_id]) catCounts[ev.user_id] = Object.fromEntries(CATEGORIES.map(c => [c, 0]));
          if (catCounts[ev.user_id][cat] !== undefined) catCounts[ev.user_id][cat] += 1;
        }
        const rows = Object.entries(counts).map(([userId, actions]) => ({
          userId, name: profMap[userId]?.full_name || "Unknown", role: profMap[userId]?.role,
          total: Object.values(actions).reduce((a, b) => a + b, 0), actions
        })).sort((a, b) => b.total - a.total);
        setStaffCounts(rows);

        const teamRows = Object.entries(catCounts).map(([userId, cats]) => ({
          userId, name: profMap[userId]?.full_name || "Unknown", role: profMap[userId]?.role, cats,
          total: Object.values(cats).reduce((a, b) => a + b, 0)
        })).sort((a, b) => b.total - a.total);
        setTeamComparison(teamRows);

        const today = new Date().toDateString();
        const hourBuckets = Array.from({ length: 24 }, (_, h) => ({ hour: h, ...Object.fromEntries(CATEGORIES.map(c => [c, 0])) }));
        for (const ev of events || []) {
          const d = new Date(ev.created_at);
          if (d.toDateString() !== today) continue;
          const cat = categorizeEvent(ev);
          if (hourBuckets[d.getHours()][cat] !== undefined) hourBuckets[d.getHours()][cat] += 1;
        }
        setHourlyData(hourBuckets.filter(h => CATEGORIES.some(c => h[c] > 0)));

        const durations = (orders || [])
          .filter(o => o.received_at && o.dispatched_at)
          .map(o => (new Date(o.dispatched_at) - new Date(o.received_at)) / 3600000);
        const avgHours = durations.length ? durations.reduce((a, b) => a + b, 0) / durations.length : null;
        setLeadTime({ avgHours, samples: durations.length });

        // ---- Staff Hours & PCS/hour (management productivity report) ----
        const [pickTasksAll, packTasksAll, putawayAll, allOrders] = await Promise.all([
          sb(`/rest/v1/pick_tasks?status=eq.picked&select=*`, { token }),
          sb(`/rest/v1/pack_tasks?status=eq.labeled&select=*`, { token }),
          sb(`/rest/v1/putaway_tasks?status=eq.completed&select=*`, { token }),
          sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token })
        ]);
        const pickTaskIds = (pickTasksAll || []).map(t => t.id);
        const pickLines = pickTaskIds.length ? await sb(`/rest/v1/pick_task_lines?pick_task_id=in.(${pickTaskIds.join(",")})&select=*`, { token }) : [];
        const pickQtyByUser = {};
        for (const t of pickTasksAll || []) {
          if (!t.assigned_to) continue;
          const qty = (pickLines || []).filter(l => l.pick_task_id === t.id).reduce((s, l) => s + (l.qty_picked || 0), 0);
          pickQtyByUser[t.assigned_to] = (pickQtyByUser[t.assigned_to] || 0) + qty;
        }
        const packQtyByUser = {};
        for (const t of packTasksAll || []) {
          if (!t.assigned_to) continue;
          let qty = 0;
          try { const scans = JSON.parse(t.scans || "{}"); qty = Object.values(scans).reduce((s, v) => s + v, 0); } catch (e) {}
          packQtyByUser[t.assigned_to] = (packQtyByUser[t.assigned_to] || 0) + qty;
        }
        const putawayQtyByUser = {};
        for (const t of putawayAll || []) {
          if (!t.assigned_to) continue;
          putawayQtyByUser[t.assigned_to] = (putawayQtyByUser[t.assigned_to] || 0) + (t.qty_completed || 0);
        }
        const byUserDate = {};
        for (const ev of events || []) {
          if (!ev.user_id) continue;
          const key = `${ev.user_id}|${new Date(ev.created_at).toDateString()}`;
          if (!byUserDate[key]) byUserDate[key] = [];
          byUserDate[key].push(new Date(ev.created_at));
        }
        const hoursByUser = {};
        for (const key in byUserDate) {
          const userId = key.split("|")[0];
          const times = byUserDate[key].sort((a, b) => a - b);
          const spanHrs = (times[times.length - 1] - times[0]) / 3600000;
          hoursByUser[userId] = (hoursByUser[userId] || 0) + spanHrs;
        }
        const hoursReport = Object.keys(profMap).map(userId => {
          const hrs = hoursByUser[userId] || 0;
          const totalPcs = (pickQtyByUser[userId] || 0) + (packQtyByUser[userId] || 0) + (putawayQtyByUser[userId] || 0);
          return {
            userId, name: profMap[userId].full_name, role: profMap[userId].role,
            hours: hrs, pcsPicked: pickQtyByUser[userId] || 0, pcsPacked: packQtyByUser[userId] || 0,
            pcsPutAway: putawayQtyByUser[userId] || 0, totalPcs, pcsPerHour: hrs > 0.05 ? Math.round(totalPcs / hrs) : 0
          };
        }).filter(r => r.hours > 0 || r.totalPcs > 0).sort((a, b) => b.totalPcs - a.totalPcs);
        setStaffHours(hoursReport);

        // ---- Executive / Customer Fulfillment summary ----
        const todayStr = new Date().toDateString();
        const dispatchedOrders = (allOrders || []).filter(o => o.status === "dispatched" || o.status === "handed_over");
        const shippedToday = dispatchedOrders.filter(o => o.dispatched_at && new Date(o.dispatched_at).toDateString() === todayStr).length;
        const sameDayCount = dispatchedOrders.filter(o => o.received_at && o.dispatched_at && new Date(o.received_at).toDateString() === new Date(o.dispatched_at).toDateString()).length;
        const onTimeRate = dispatchedOrders.length ? Math.round((sameDayCount / dispatchedOrders.length) * 100) : null;
        const incompleteCount = (allOrders || []).filter(o => o.status === "incomplete").length;
        const totalOrders = (allOrders || []).length;
        const fulfillmentRate = totalOrders ? Math.round(((totalOrders - incompleteCount) / totalOrders) * 100) : null;
        setExecSummary({
          shippedToday, totalOrders, dispatchedTotal: dispatchedOrders.length,
          onTimeRate, incompleteCount, fulfillmentRate, avgCycleHours: avgHours
        });
      } catch (e) { showToast("Load failed", "err"); }
      setLoading(false);
    })();
  }, [token, profile.warehouse_id]);

  const maxTotal = Math.max(1, ...staffCounts.map(r => r.total));

  return (
    <div>
      <SectionTitle title="Reports" />

      {execSummary && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Executive Summary — Customer Fulfillment</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 14 }}>
            <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, color: "#F5A623" }}>{execSummary.shippedToday}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 4 }}>Orders Shipped Today</div>
            </div>
            <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, color: "#4CAF7D" }}>{execSummary.fulfillmentRate != null ? `${execSummary.fulfillmentRate}%` : "—"}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 4 }}>Fulfillment Rate (non-incomplete)</div>
            </div>
            <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, color: "#5B9EE8" }}>{execSummary.onTimeRate != null ? `${execSummary.onTimeRate}%` : "—"}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 4 }}>Same-Day Dispatch Rate</div>
            </div>
            <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, color: "#2B2620" }}>{execSummary.avgCycleHours != null ? execSummary.avgCycleHours.toFixed(1) + "h" : "—"}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 4 }}>Avg Order Cycle Time</div>
            </div>
            <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, color: "#E5484D" }}>{execSummary.incompleteCount}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 4 }}>Incomplete / Short Orders</div>
            </div>
            <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, color: "#2B2620" }}>{execSummary.totalOrders}</div>

            </div>

/* ================= BULK IMPORT UTILITIES ================= */
async function parseSheet(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array", cellDates: true, raw: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { defval: "", raw: true });
}
function normHeader(h) { return String(h).toLowerCase().replace(/[^a-z0-9]/g, ""); }
// Cleans a code-like value (barcode / SKU / reference / order no). Numbers are
// converted to exact integer strings so large barcodes never turn into
// scientific notation (e.g. 7.35E+12) — a common Excel/SheetJS pitfall.
function cleanCode(v) {
  if (v === null || v === undefined || v === "") return "";
  if (typeof v === "number") return String(Math.trunc(v));
  return String(v).trim().replace(/\.0$/, "");
}
const FIELD_ALIASES = {
  barcode: ["stockmoveproductinternalbarcode", "internalbarcode", "barcode"],
  category: ["productcategory", "category"],
  department: ["department"],
  salesPrice: ["salesprice", "price"],
  sku: ["productsku", "internalreference", "sku"],
  imageUrl: ["imageurl", "image", "imagesrc", "photourl"],
  productName: ["productname", "stockmoveproduct", "product", "description"],
  qty: ["stockmovequantity", "requiredquantity", "qtyordered", "quantity", "qty"],
  reference: ["reference"],
  sourceDocument: ["sourcedocument"],
  contact: ["contact", "supplier", "vendor"],
  customerOrderNumber: ["customerno", "customerorderno", "customerordernumber"],
  orderRef: ["trackingno", "tracking", "orderno", "invoicenumber", "order"],
  courier: ["courier"],
  customer: ["customer", "customername"],
  invoiceDate: ["invoicedate"],
  grossAmount: ["grossamount"],
  unit: ["unit", "uom"],
  reorderLevel: ["reorderlevel", "reorder"]
};
function buildColumnMap(headers) {
  const used = new Set();
  const map = {};
  const fields = Object.keys(FIELD_ALIASES);
  for (const field of fields) {
    const aliases = FIELD_ALIASES[field];
    let found = null;
    for (const h of headers) { if (used.has(h)) continue; if (aliases.includes(normHeader(h))) { found = h; break; } }
    if (!found) for (const h of headers) { if (used.has(h)) continue; const nh = normHeader(h); if (aliases.some(a => nh.includes(a))) { found = h; break; } }
    if (found) { map[field] = found; used.add(found); }
  }
  return map;
}
function getVal(row, map, field) { return map[field] ? row[map[field]] : undefined; }

/* ---- Scalable product lookups (never load the full 50k+ catalogue) ---- */
// Live search for typeahead pickers — server-side, limited results.
async function searchProducts(token, query, limit = 25) {
  const q = query.trim();
  if (!q) return [];
  const enc = encodeURIComponent(q);
  return (await sb(`/rest/v1/products?or=(barcode.ilike.*${enc}*,name.ilike.*${enc}*)&select=*&limit=${limit}`, { token })) || [];
}
// Exact lookup for a single scanned barcode/SKU.
async function lookupProductByCode(token, code) {
  const c = cleanCode(code);
  if (!c) return null;
  const enc = encodeURIComponent(c);
  const rows = await sb(`/rest/v1/products?or=(barcode.eq.${enc},sku.eq.${enc})&select=*&limit=1`, { token });
  return rows && rows[0] ? rows[0] : null;
}
// Fetch only the specific products referenced by a set of ids (for displaying
// task/line cards) — never the whole catalogue.
async function fetchProductsByIds(token, ids) {
  const unique = [...new Set(ids)].filter(Boolean);
  if (unique.length === 0) return {};
  const map = {};
  const CHUNK = 150;
  for (let i = 0; i < unique.length; i += CHUNK) {
    const chunk = unique.slice(i, i + CHUNK);
    const rows = await sb(`/rest/v1/products?id=in.(${chunk.map(encodeURIComponent).join(",")})&select=*`, { token });
    for (const p of rows || []) map[p.id] = p;
  }
  return map;
}
// Fetch only products matching a set of barcodes (for bulk CSV import matching)
// — only the barcodes present in the uploaded file, not the whole catalogue.
async function fetchProductsByBarcodes(token, codes) {
  const unique = [...new Set(codes.map(cleanCode))].filter(Boolean);
  if (unique.length === 0) return {};
  const byCode = {};
  const CHUNK = 150;
  for (let i = 0; i < unique.length; i += CHUNK) {
    const chunk = unique.slice(i, i + CHUNK);
    const rows = await sb(`/rest/v1/products?or=(barcode.in.(${chunk.map(encodeURIComponent).join(",")}),sku.in.(${chunk.map(encodeURIComponent).join(",")}))&select=*`, { token });
    for (const p of rows || []) {
      if (p.barcode) byCode[cleanCode(p.barcode)] = p;
      if (p.sku) byCode[cleanCode(p.sku)] = p;
    }
  }
  return byCode;
}

// Validates every row of an uploaded file WITHOUT writing anything to the
// database. Returns a report the user must review/confirm before import.
function validateImportRows(rows, map, productLookup, groupField, existingGroupLines) {
  const results = [];
  const seenInFile = new Set();
  rows.forEach((row, i) => {
    const errors = [];
    const groupVal = cleanCode(getVal(row, map, groupField));
    const barcode = cleanCode(getVal(row, map, "barcode"));
    const qtyRaw = getVal(row, map, "qty");
    const qty = Number(qtyRaw);
    const product = barcode ? productLookup[barcode] : null;

    if (!groupVal) errors.push("Missing reference/tracking number");
    if (!barcode) errors.push("Missing barcode");
    else if (!product) errors.push("Barcode not found in Product Master");
    if (qtyRaw === undefined || qtyRaw === "" || isNaN(qty) || qty <= 0) errors.push("Invalid quantity");

    const lineKey = `${groupVal}|${barcode}`;
    if (groupVal && barcode) {
      if (seenInFile.has(lineKey)) errors.push("Duplicate line in this file");
      else seenInFile.add(lineKey);
      if (existingGroupLines && existingGroupLines[lineKey]) errors.push("Already exists (previously imported)");
    }

    results.push({
      rowNum: i + 2, // +2 = header row + 1-indexing, matches what user sees in Excel
      groupVal, barcode, qty: isNaN(qty) ? 0 : qty, product,
      errors, valid: errors.length === 0
    });
  });

  const validRows = results.filter(r => r.valid);
  const invalidRows = results.filter(r => !r.valid);
  return {
    total: results.length,
    validRows, invalidRows,
    invalidBarcodeCount: results.filter(r => r.errors.includes("Barcode not found in Product Master")).length,
    invalidQtyCount: results.filter(r => r.errors.includes("Invalid quantity")).length,
    duplicateCount: results.filter(r => r.errors.some(e => e.startsWith("Duplicate") || e.startsWith("Already exists"))).length,
    missingRefCount: results.filter(r => r.errors.includes("Missing reference/tracking number")).length
  };
}


/* ================= BIN MASTER (ADMIN ONLY) ================= */
function BinsView({ token, profile, showToast }) {
  const [bins, setBins] = useState([]);
  const [newCode, setNewCode] = useState("");
  const [importing, setImporting] = useState(false);
  const [importSummary, setImportSummary] = useState(null);

  const load = useCallback(async () => {
    setBins(await sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*&order=code.asc`, { token }) || []);
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const addBin = async () => {
    if (!newCode.trim()) return;
    try {
      await sb(`/rest/v1/bins`, { method: "POST", token, body: { warehouse_id: profile.warehouse_id, code: newCode.trim() } });
      setNewCode(""); showToast("Bin added"); load();
    } catch (e) { showToast("Bin already exists", "err"); }
  };

  const handleBinFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImporting(true); setImportSummary(null);
    try {
      const rows = await parseSheet(file);
      const headers = Object.keys(rows[0] || {});
      const codeHeader = headers.find(h => ["location", "bin", "bincode", "locationcode", "code"].includes(normHeader(h))) || headers[0];
      const items = rows.map(r => ({ warehouse_id: profile.warehouse_id, code: String(r[codeHeader] || "").trim() })).filter(x => x.code);
      const CHUNK = 300;
      let count = 0;
      for (let i = 0; i < items.length; i += CHUNK) {
        await sb(`/rest/v1/bins?on_conflict=warehouse_id,code`, { method: "POST", token, prefer: "resolution=merge-duplicates,return=minimal", body: items.slice(i, i + CHUNK) });
        count += items.slice(i, i + CHUNK).length;
      }
      setImportSummary(`${count} bin locations imported.`);
      showToast(`${count} bins imported`); load();
    } catch (err) { showToast(`Import failed: ${(err.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  return (
    <div>
      <SectionTitle title="Bin Master (locations)" action={
        <label style={{ ...S.primaryBtnSm, cursor: "pointer" }}>
          {importing ? "Importing…" : "📤 Upload bin list"}
          <input type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={handleBinFile} disabled={importing} />
        </label>
      } />
      {importSummary && <div style={{ ...S.panel, borderColor: "#4CAF7D", color: "#4CAF7D", fontSize: 12 }}>{importSummary}</div>}
      <div style={S.panel}>
        <div style={S.panelTitle}>Add single location</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input style={{ ...S.input, maxWidth: 220 }} placeholder="e.g. A-01-03" value={newCode} onChange={e => setNewCode(e.target.value)} />
          <button style={S.primaryBtnSm} onClick={addBin}>+ Add</button>
        </div>
        <div style={{ marginTop: 12, fontSize: 11, color: "#8A8272" }}>
          ⚠ Sirf yahan se bin locations bante hain — staff Putaway ya Returns screen se koi nayi location nahi khol sakte, sirf yahan uploaded list mein se select karenge.
        </div>
      </div>
      <div style={S.cardGrid}>
        {bins.map(b => (
          <div key={b.id} style={{ ...S.card, cursor: "default" }}>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 15 }}>{b.code}</span>
          </div>
        ))}
        {bins.length === 0 && <EmptyNote text="Koi bin location nahi hai — upload karein ya manually add karein." />}
      </div>
    </div>
  );
}
