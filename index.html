              <div style={{ color: "#E5484D", fontSize: 10, letterSpacing: 1, fontWeight: 700 }}>TOTAL RESERVED QTY</div>
              <div style={{ color: "#2B2620", fontSize: 26, fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif", marginTop: 4 }}>{ledger.reduce((s, r) => s + r.reserved, 0)}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>Already allocated to open orders</div>
            </div>
          </div>
          <table>
            <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>On Hand</th><th style={S.th}>Reserved</th><th style={S.th}>Net Available</th><th style={S.th}>Aging (days)</th><th style={S.th}>Oldest Batch (GRN)</th></tr></thead>
            <tbody>
              {ledger.map(r => {
                const p = products[r.productId];
                const aging = computeAgingDays(r.onHand, putawayHistory[r.productId]);
                const days = aging?.days;
                const agingColor = days == null ? "#8A8272" : days > 60 ? "#E5484D" : days > 30 ? "#F5A623" : "#4CAF7D";
                return (
                  <tr key={r.productId}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                    <td style={S.td}>{p?.name || "—"}</td>
                    <td style={{ ...S.td, color: "#6B6355" }}>{r.onHand}</td>
                    <td style={{ ...S.td, color: r.reserved > 0 ? "#E5484D" : "#6B6355" }}>{r.reserved}</td>
                    <td style={{ ...S.td, color: "#4CAF7D", fontWeight: 600 }}>{r.available}</td>
                    <td style={{ ...S.td, color: agingColor, fontWeight: 600 }}>{days != null ? `${days}d` : "—"}</td>
                    <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{aging?.grnNumber || "—"}</td>
                  </tr>
                );
              })}
              {ledger.length === 0 && <tr><td colSpan={7}><EmptyNote text="No inventory recorded yet." /></td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {tab === "bins" && (
        <div style={S.panel}>
          {transferRow && (
            <div style={{ background: "#FFF9EE", border: "1px solid #F5A623", borderRadius: 8, padding: 12, marginBottom: 14, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <span style={{ fontSize: 12, color: "#2B2620", fontWeight: 600 }}>PNA-HOLD se mila — kahan rakhein?</span>
              <input list="pnaTransferBinDatalist" style={{ ...S.input, minWidth: 180, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Destination bin code" value={transferDestBin} onChange={e => setTransferDestBin(e.target.value)} />
              <datalist id="pnaTransferBinDatalist">
                {Object.values(bins).filter(b => b.code !== "PNA-HOLD").sort((a, b) => (a.code || "").localeCompare(b.code || "")).map(b => <option key={b.id} value={b.code} />)}
              </datalist>
              <input type="number" min={1} max={transferRow.maxQty} placeholder={`Qty (max ${transferRow.maxQty})`} style={{ ...S.input, width: 140 }} value={transferQty} onChange={e => setTransferQty(e.target.value)} />
              <button style={S.primaryBtnSm} disabled={transferring} onClick={confirmTransferFromPna}>{transferring ? "Transfer ho raha…" : "✓ Confirm Transfer"}</button>
              <button style={S.secondaryBtnSm} onClick={() => { setTransferRow(null); setTransferDestBin(""); setTransferQty(""); }}>Cancel</button>
            </div>
          )}
          <table>
            <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Bin</th><th style={S.th}>On Hand (this bin)</th><th style={S.th}>Aging (days)</th><th style={S.th}>Oldest Batch (GRN)</th><th style={S.th}>Last Activity</th><th style={S.th}>Reserved against order?</th><th style={S.th}></th></tr></thead>
            <tbody>
              {binRows.map((r, i) => {
                const p = products[r.product_id];
                const bin = bins[r.bin_id];
                const productReserved = reserved[r.product_id] || 0;
                const aging = computeAgingDays(r.on_hand, putawayHistoryByBin[`${r.product_id}|${r.bin_id}`]);
                const days = aging?.days;
                const agingColor = days == null ? "#8A8272" : days > 60 ? "#E5484D" : days > 30 ? "#F5A623" : "#4CAF7D";
                const isPnaBin = bin?.code === "PNA-HOLD";
                const activityLabel = { putaway: "📥 Putaway", dispatch: "🚚 Dispatch", damage: "💔 Damage", return: "↩ Return", pna_reconcile: "🔍 PNA Reconcile", pna_transfer: "🔍 PNA Transfer", pna_resolve: "🔍 PNA Resolve", not_found_pna: "⚠ Not Found → PNA", restore: "↺ Restored" }[r.last_activity_type] || null;
                return (
                  <tr key={i}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", cursor: "pointer", textDecoration: "underline dotted" }} onClick={() => openTrail(r.product_id)} title="Click for full transaction trail">{p?.barcode || "—"}</td>
                    <td style={S.td}>{p?.name || "—"}</td>
                    <td style={{ ...S.td, color: isPnaBin ? "#E5484D" : "#6B6355", fontWeight: isPnaBin ? 600 : 400 }}>{bin?.code || "Unassigned (awaiting putaway)"}</td>
                    <td style={S.td}>{r.on_hand}</td>
                    <td style={{ ...S.td, color: agingColor, fontWeight: 600 }}>{days != null ? `${days}d` : "—"}</td>
                    <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{aging?.grnNumber || "—"}</td>
                    <td style={S.td}>
                      {activityLabel ? (
                        <div>
                          <div style={{ fontSize: 12 }}>{activityLabel}</div>
                          <div style={{ fontSize: 10.5, color: "#8A8272", marginTop: 2 }}>{staffList.find(s => s.id === r.last_activity_by)?.full_name || "—"} · {fmtTime(r.last_activity_at)}</div>
                        </div>
                      ) : <span style={{ color: "#8A8272", fontSize: 12 }}>—</span>}
                    </td>
                    <td style={S.td}>
                      {productReserved > 0
                        ? <span style={{ ...S.badgeSm, color: "#E5484D", borderColor: "#E5484D" }}>Yes · {productReserved} reserved (product-wide)</span>
                        : <span style={{ ...S.badgeSm, color: "#4CAF7D", borderColor: "#4CAF7D" }}>No</span>}
                    </td>
                    <td style={S.td}>
                      {isPnaBin && canAssignCounts && (
                        <button style={S.secondaryBtnSm} onClick={() => { setTransferRow({ product_id: r.product_id, pnaBinId: r.bin_id, maxQty: r.on_hand }); setTransferDestBin(""); setTransferQty(""); }}>📍 Found Here — Transfer</button>
                      )}
                    </td>
                  </tr>
                );
              })}
              {binRows.length === 0 && <tr><td colSpan={9}><EmptyNote text="No inventory recorded yet." /></td></tr>}
            </tbody>
          </table>
          <div style={{ marginTop: 10, fontSize: 11, color: "#8A8272" }}>
            ⚠ Reservation abhi product-level track hoti hai (jis bin se picking suggest hui hai wahi highlight ho sakti hai, exact bin-split system abhi nahi hai).
          </div>
          {trailProductId && (
            <div style={{ marginTop: 16, border: "1px solid #F5A623", borderRadius: 8, padding: 14, background: "#FFF9EE" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <div style={{ fontWeight: 600, fontSize: 13 }}>🔍 Transaction Trail — {products[trailProductId]?.barcode} ({products[trailProductId]?.name})</div>
                <button style={S.secondaryBtnSm} onClick={() => setTrailProductId(null)}>✕ Close</button>
              </div>
              {trailLoading ? <EmptyNote text="Loading..." /> : (
                <table style={{ width: "100%", borderCollapse: "collapse" }}>
                  <thead><tr><th style={S.th}>When</th><th style={S.th}>Event</th><th style={S.th}>From → To</th><th style={S.th}>By</th></tr></thead>
                  <tbody>
                    {trailData.map(t => (
                      <tr key={t.id}>
                        <td style={{ ...S.td, fontSize: 11, fontFamily: "'IBM Plex Mono', monospace" }}>{fmtTime(t.changed_at)}</td>
                        <td style={S.td}>{t.field_changed}</td>
                        <td style={{ ...S.td, color: "#6B6355" }}>{t.old_value || "—"} → {t.new_value || "—"}</td>
                        <td style={{ ...S.td, color: "#6B6355" }}>{staffList.find(s => s.id === t.changed_by)?.full_name || "—"}</td>
                      </tr>
                    ))}
                    {!trailData.length && <tr><td colSpan={4}><EmptyNote text="Is product ki koi PNA/Cycle Count trail nahi mili." /></td></tr>}
                  </tbody>
                </table>
              )}
            </div>
          )}
        </div>
      )}

      {tab === "cyclecount" && (
        <>
          {!activeCount && (
            <>
              {canAssignCounts && (
                <div style={S.panel}>
                  <div style={S.panelTitle}>Naya Cycle Count Assign Karein</div>
                  <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 12 }}>
                    <select style={{ ...S.input, minWidth: 160 }} value={newScopeType} onChange={e => { setNewScopeType(e.target.value); setNewScopeValue(""); setNewAssignee(""); }}>
                      <option value="bin">Ek Bin</option>
                      <option value="aisle">Ek Aisle</option>
                      <option value="category">Category</option>
                      <option value="all">Poori Warehouse (Full Audit)</option>
                    </select>
                    {newScopeType === "bin" && (
                      <>
                        <input list="binCodesDatalist" style={{ ...S.input, minWidth: 180 }} placeholder="Bin code type karein (jaise A-01-03)" value={newScopeValue} onChange={e => setNewScopeValue(e.target.value)} />
                        <datalist id="binCodesDatalist">
                          {Object.values(bins).sort((a, b) => (a.code || "").localeCompare(b.code || "")).map(b => <option key={b.id} value={b.code} />)}
                        </datalist>
                      </>
                    )}
                    {newScopeType === "aisle" && (
                      <>
                        <input list="aislesDatalist" style={{ ...S.input, minWidth: 100 }} maxLength={3} placeholder="jaise A" value={newScopeValue} onChange={e => setNewScopeValue(e.target.value.toUpperCase())} />
                        <datalist id="aislesDatalist">
                          {allAisles.map(a => <option key={a} value={a} />)}
                        </datalist>
                      </>
                    )}
                    {newScopeType === "category" && (
                      <select style={{ ...S.input, minWidth: 180 }} value={newScopeValue} onChange={e => setNewScopeValue(e.target.value)}>
                        <option value="">Category select karein…</option>
                        {[...new Set(Object.values(products).map(p => p.category).filter(Boolean))].sort().map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    )}
                    {newScopeType !== "all" && (
                      <select style={{ ...S.input, minWidth: 180 }} value={newAssignee} onChange={e => setNewAssignee(e.target.value)}>
                        <option value="">Staff assign karein…</option>
                        {staffList.map(s => <option key={s.id} value={s.id}>{s.full_name} ({s.role})</option>)}
                      </select>
                    )}
                    {newScopeType !== "all" && (
                      <button style={S.primaryBtnSm} onClick={startCycleCount} disabled={startingCount}>{startingCount ? "Assign ho raha…" : "▶ Assign & Shuru Karein"}</button>
                    )}
                  </div>

                  {newScopeType === "all" && (
                    <div>
                      <div style={{ color: "#E5484D", fontSize: 12, fontWeight: 600, marginBottom: 10, background: "#FDF0EE", padding: "8px 12px", borderRadius: 6 }}>

                      </div>
                      <table>
                        <thead><tr><th style={S.th}>Aisle</th><th style={S.th}>Assign To</th></tr></thead>
                        <tbody>
                          {allAisles.map(a => (
                            <tr key={a}>
                              <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace" }}>Aisle {a}</td>
                              <td style={S.td}>

                    </div>

              <div style={S.panel}>
                <div style={S.panelTitle}>Cycle Counts — History</div>

                  <thead><tr><th style={S.th}>Scope</th><th style={S.th}>Assigned To</th><th style={S.th}>Status</th><th style={S.th}>Started</th><th style={S.th}></th></tr></thead>
                  <tbody>
                    {cycleCounts.filter(cc => !cc.parent_audit_id).map(cc => (
                      <tr key={cc.id}>
                        <td style={S.td}>{cc.scope_type === "all" ? "🏭 Poori Warehouse" : cc.scope_type === "bin" ? (bins[cc.scope_value]?.code || cc.scope_value) : cc.scope_type === "aisle" ? `Aisle ${cc.scope_value}` : cc.scope_value}</td>
                        <td style={{ ...S.td, color: "#6B6355" }}>{cc.assigned_to ? (staffList.find(s => s.id === cc.assigned_to)?.full_name || "—") : (cc.scope_type === "all" ? "Multiple (aisle-wise)" : "—")}</td>
                        <td style={S.td}>
                          <span style={{ ...S.badgeSm, color: cc.status === "approved" ? "#4CAF7D" : cc.status === "pending_admin_approval" ? "#F5A623" : cc.status === "pending_verification" ? "#5B9EE8" : cc.status === "cancelled" ? "#8A8272" : "#B084F5", borderColor: cc.status === "approved" ? "#4CAF7D" : cc.status === "pending_admin_approval" ? "#F5A623" : cc.status === "pending_verification" ? "#5B9EE8" : cc.status === "cancelled" ? "#8A8272" : "#B084F5" }}>
                            {cc.status === "counting" ? "Counting" : cc.status === "pending_verification" ? "Pending Lead Verification" : cc.status === "pending_admin_approval" ? "Pending Admin Approval" : cc.status === "approved" ? "Approved" : "Cancelled"}
                          </span>
                        </td>
                        <td style={{ ...S.td, color: "#6B6355", fontSize: 11 }}>{fmtTime(cc.created_at)}</td>
                        <td style={S.td}><button style={S.secondaryBtnSm} onClick={() => openCycleCount(cc)}>Open</button></td>
                      </tr>
                    ))}
                    {cycleCounts.filter(cc => !cc.parent_audit_id).length === 0 && <tr><td colSpan={5}><EmptyNote text="Abhi tak koi cycle count nahi hui." /></td></tr>}
                  </tbody>
                </table>
              </div>
            </>
          )}

          {activeCount && (
            <div style={S.panel}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                <div style={S.panelTitle}>
                  {activeCount.scope_type === "all" ? "🏭 Complete Warehouse Audit" : activeCount.scope_type === "bin" ? `Bin — ${bins[activeCount.scope_value]?.code || activeCount.scope_value}` : activeCount.scope_type === "aisle" ? `Aisle ${activeCount.scope_value}` : activeCount.scope_value}
                  {activeCount.assigned_to && <span style={{ color: "#6B6355", fontWeight: 400, fontSize: 13 }}> — Assigned to {staffList.find(s => s.id === activeCount.assigned_to)?.full_name}</span>}
                </div>
                <button style={S.secondaryBtnSm} onClick={() => { setActiveCount(null); setCountLines([]); setChildCounts([]); }}>← Back to list</button>
              </div>

              {childCounts.length > 0 ? (
                <table>
                  <thead><tr><th style={S.th}>Aisle</th><th style={S.th}>Assigned To</th><th style={S.th}>Status</th><th style={S.th}></th></tr></thead>
                  <tbody>
                    {childCounts.map(kid => (
                      <tr key={kid.id}>
                        <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace" }}>Aisle {kid.scope_value}</td>
                        <td style={{ ...S.td, color: "#6B6355" }}>{staffList.find(s => s.id === kid.assigned_to)?.full_name || "—"}</td>
                        <td style={S.td}>
                          <span style={{ ...S.badgeSm, color: kid.status === "approved" ? "#4CAF7D" : kid.status === "pending_admin_approval" ? "#F5A623" : kid.status === "pending_verification" ? "#5B9EE8" : "#B084F5", borderColor: kid.status === "approved" ? "#4CAF7D" : kid.status === "pending_admin_approval" ? "#F5A623" : kid.status === "pending_verification" ? "#5B9EE8" : "#B084F5" }}>
                            {kid.status === "counting" ? "Counting" : kid.status === "pending_verification" ? "Pending Verification" : kid.status === "pending_admin_approval" ? "Pending Admin" : "Approved"}

                        <td style={S.td}><button style={S.secondaryBtnSm} onClick={() => openCycleCount(kid)}>Open</button></td>

                </table>
              ) : (
                <>
                  {isMyBlindCount ? (
                    <>
                      <div style={S.panel}>
                        <div style={S.panelTitle}>Scan Product — {myCountMode === "piece" ? "Piece-to-Piece (har physical unit scan karein)" : "Bulk (scan kar ke qty likhein)"}</div>
                        <div style={{ display: "flex", gap: 10 }}>
                          <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type barcode / SKU, then Enter"

                            <div style={{ color: "#2B2620", fontSize: 14, marginBottom: 8 }}>{products[ccMatchedLine.product_id]?.name}</div>
                            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                              <input type="number" min={0} autoFocus style={{ ...S.input, maxWidth: 140 }} value={ccBulkQty} onChange={e => setCcBulkQty(e.target.value)} onKeyDown={e => e.key === "Enter" && ccConfirmBulk()} placeholder="Counted qty" />

                              <button style={S.secondaryBtnSm} onClick={() => { setCcMatchedLine(null); setCcBulkQty(""); }}>Cancel</button>
                            </div>

                        {ccUnknownProduct && (
                          <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid #F5A623", background: "#FFF9EE" }}>
                            <div style={{ color: "#E5484D", fontWeight: 600, fontSize: 12, marginBottom: 6 }}>⚠ EXCESS — is bin ki expected list mein nahi thi</div>
                            <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 15 }}>{ccUnknownProduct.barcode}</div>
                            <div style={{ color: "#2B2620", fontSize: 14, marginBottom: 8 }}>{ccUnknownProduct.name}</div>
                            {activeCount.scope_type !== "bin" && (
                              <input style={{ ...S.input, maxWidth: 160, marginBottom: 8 }} placeholder="Bin code (jahan mili)" value={ccUnknownBinCode} onChange={e => setCcUnknownBinCode(e.target.value)} />

                              <button style={S.primaryBtnSm} onClick={ccAddExcessItem}>+ Excess Item Add Karein</button>
                              <button style={S.secondaryBtnSm} onClick={() => { setCcUnknownProduct(null); setCcUnknownBinCode(""); }}>Cancel</button>
                            </div>
                          </div>
                        )}
                      </div>

                      <div style={S.panel}>
                        <div style={S.panelTitle}>Progress — {countLines.filter(l => l.counted_qty !== null && l.counted_qty !== undefined).length} / {countLines.length} counted</div>
                        <div style={{ fontSize: 11, color: "#8A8272", marginBottom: 10 }}>Agar koi item bin mein physically nahi mila (scan karne ko kuch nahi hai), to "0 / Not Found" dabayein — is se line "counted" ho jayegi (qty 0 k sath) aur submit ho sakega.</div>
                        <table>
                          <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Status</th><th style={S.th}></th></tr></thead>

                            {countLines.map(l => {
                              const p = products[l.product_id];

                                <tr key={l.id}>
                                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                                  <td style={S.td}>{p?.name || "—"}{l.is_excess && <span style={{ ...S.badgeSm, color: "#E5484D", borderColor: "#E5484D", marginLeft: 6 }}>EXCESS</span>}</td>
                                  <td style={{ ...S.td, color: done ? "#4CAF7D" : "#8A8272" }}>{done ? `✓ Counted — ${l.counted_qty}` : "Pending"}</td>
                                  <td style={S.td}>{!done && <button style={{ ...S.secondaryBtnSm, color: "#E5484D", borderColor: "#E5484D" }} onClick={() => saveCountedQty(l.id, 0)}>0 / Not Found</button>}</td>
                                </tr>
                              );
                            })}
                            {countLines.length === 0 && <tr><td colSpan={4}><EmptyNote text="Is bin mein koi lines nahi" /></td></tr>}
                          </tbody>
                        </table>
                        {countLines.length > 0 && countLines.every(l => l.counted_qty !== null && l.counted_qty !== undefined) ? (
                          <button style={{ ...S.primaryBtnSm, marginTop: 14 }} onClick={submitForReview}>✓ Submit for Warehouse Lead Verification</button>
                        ) : (
                          <div style={{ color: "#8A8272", fontSize: 12, marginTop: 14 }}>Sab lines count hone k baad hi submit hoga.</div>
                        )}
                      </div>
                    </>
                  ) : (
                  <table>
                    <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Bin</th><th style={S.th}>System Qty</th><th style={S.th}>Counted Qty</th><th style={S.th}>Variance</th><th style={S.th}>Comment</th></tr></thead>
                    <tbody>
                      {countLines.map(l => {
                        const p = products[l.product_id];
                        const variance = l.counted_qty !== null && l.counted_qty !== undefined ? l.counted_qty - l.system_qty : null;
                        const canEdit = (activeCount.status === "counting" && profile.id === activeCount.assigned_to) || (canAssignCounts && ["counting", "pending_verification"].includes(activeCount.status));
                        const canComment = canAssignCounts && ["pending_verification", "pending_admin_approval"].includes(activeCount.status);
                        return (
                          <tr key={l.id}>
                            <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                            <td style={S.td}>{p?.name || "—"}{l.is_excess && <span style={{ ...S.badgeSm, color: "#E5484D", borderColor: "#E5484D", marginLeft: 6 }}>EXCESS</span>}</td>
                            <td style={{ ...S.td, color: "#6B6355" }}>{bins[l.bin_id]?.code || "—"}</td>
                            <td style={S.td}>{l.system_qty}</td>
                            <td style={S.td}>
                              {canEdit ? (
                                <input type="number" min={0} style={{ ...S.input, width: 90, padding: "4px 8px" }} defaultValue={l.counted_qty ?? ""} onBlur={e => saveCountedQty(l.id, e.target.value)} />
                              ) : (l.counted_qty ?? "—")}
                            </td>
                            <td style={{ ...S.td, color: variance === null ? "#8A8272" : variance === 0 ? "#4CAF7D" : "#E5484D", fontWeight: 600 }}>
                              {variance === null ? "—" : variance > 0 ? `+${variance}` : variance}
                            </td>
                            <td style={S.td}>
                              {variance !== null && variance !== 0 ? (
                                canComment ? (
                                  <input style={{ ...S.input, width: 180, padding: "4px 8px", fontSize: 12 }} placeholder="Wajah likhein…" defaultValue={l.variance_note || ""} onBlur={e => saveVarianceNote(l.id, e.target.value)} />
                                ) : (
                                  <span style={{ color: "#6B6355", fontSize: 12 }}>{l.variance_note || "—"}</span>
                                )
                              ) : "—"}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  )}

                  {!isMyBlindCount && activeCount.status === "counting" && (profile.id === activeCount.assigned_to || canAssignCounts) && (
                    <button style={{ ...S.primaryBtnSm, marginTop: 14 }} onClick={submitForReview}>✓ Submit for Warehouse Lead Verification</button>
                  )}

                  {activeCount.status === "pending_verification" && isWarehouseLead && (
                    <div style={{ marginTop: 14 }}>
                      {activeCount.admin_reject_reason && (
                        <div style={{ background: "#FFF3F3", border: "1px solid #E5484D", borderRadius: 8, padding: 10, marginBottom: 10, fontSize: 12, color: "#B0362E" }}>
                          ↩ Admin ne wapas bheja hai — <strong>{activeCount.admin_reject_reason}</strong>. Qty/comments check kar ke dobara forward karein.
                        </div>
                      )}
                      <div style={{ color: "#6B6355", fontSize: 12, marginBottom: 10 }}>
                        {countLines.filter(l => l.counted_qty !== null && l.counted_qty !== undefined && l.counted_qty !== l.system_qty).length} line(s) mein variance hai. Verify kar ke Admin ko adjustment approval ke liye forward karein.
                      </div>
                      <button style={S.primaryBtnSm} disabled={verifyingCount} onClick={verifyAndForward}>{verifyingCount ? "Forward ho raha…" : "✓ Verify & Forward to Admin"}</button>
                    </div>
                  )}
                  {activeCount.status === "pending_verification" && !isWarehouseLead && (
                    <div style={{ color: "#8A8272", fontSize: 12, marginTop: 14 }}>⏳ Warehouse Lead ki verification ka intezar hai.</div>
                  )}

                  {activeCount.status === "pending_admin_approval" && isAdmin && (
                    <div style={{ marginTop: 14 }}>
                      <div style={{ color: "#6B6355", fontSize: 12, marginBottom: 10 }}>
                        Warehouse Lead ne verify kar diya hai ({fmtTime(activeCount.verified_at)}). Approve karte hi inventory turant naye counted number se match ho jayegi.
                      </div>
                      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 10 }}>
                        <button style={S.primaryBtnSm} disabled={approvingCount} onClick={approveAndAdjust}>{approvingCount ? "Adjust ho raha…" : "✅ Approve & Adjust Inventory (Final)"}</button>
                      </div>
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <input style={{ ...S.input, flex: 1, minWidth: 200 }} placeholder="Reject reason (Lead ko wapas bhejne ki wajah)" value={rejectReason} onChange={e => setRejectReason(e.target.value)} />
                        <button style={{ ...S.secondaryBtnSm, color: "#E5484D", borderColor: "#E5484D" }} disabled={rejectingCount} onClick={rejectToLead}>{rejectingCount ? "Bhej raha…" : "↩ Reject to Lead"}</button>
                      </div>
                    </div>
                  )}
                  {activeCount.status === "pending_admin_approval" && !isAdmin && (
                    <div style={{ color: "#8A8272", fontSize: 12, marginTop: 14 }}>⏳ Lead ne verify kar diya hai — ab Admin ki final approval ka intezar hai.</div>
                  )}

                  {activeCount.status === "approved" && (
                    <div style={{ color: "#4CAF7D", fontSize: 12, marginTop: 14 }}>✅ Approved aur inventory adjust ho chuki hai — {fmtTime(activeCount.approved_at)}</div>
                  )}
                </>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ================= SALES ORDERS ================= */
function OrdersView({ token, profile, showToast, setView }) {
  const [orders, setOrders] = useState([]);
  const [productCache, setProductCache] = useState({});
  const [showForm, setShowForm] = useState(false);
  const [extId, setExtId] = useState("");
  const [courier, setCourier] = useState("Postex");
  const [items, setItems] = useState([]);
  const [pendingProduct, setPendingProduct] = useState(null);
  const [lineQty, setLineQty] = useState(1);
  const [openOrder, setOpenOrder] = useState(null);
  const [openLines, setOpenLines] = useState([]);
  const [openEvents, setOpenEvents] = useState([]);
  const [openShortages, setOpenShortages] = useState([]);
  const [orderTimingSummary, setOrderTimingSummary] = useState(null);
  const [editTracking, setEditTracking] = useState("");
  const [editCourier, setEditCourier] = useState("");
  const [openPickedQty, setOpenPickedQty] = useState({});
  const [editQty, setEditQty] = useState({});
  const [statusFilter, setStatusFilter] = useState(null);
  const [lineStats, setLineStats] = useState({});
  const [profiles, setProfiles] = useState({});
  const [importing, setImporting] = useState(false);
  const [importSummary, setImportSummary] = useState(null);
  const [ordersReport, setOrdersReport] = useState(null);
  const [selectedOrders, setSelectedOrders] = useState({});
  const [totes, setTotes] = useState([]);
  const [pickers, setPickers] = useState([]);
  const [returnsCount, setReturnsCount] = useState(0);
  const [bulkToteId, setBulkToteId] = useState("");
  const [bulkPickerId, setBulkPickerId] = useState("");
  const [bulkBusy, setBulkBusy] = useState(false);
  const [pickTaskInfo, setPickTaskInfo] = useState({});
  const [allTotesMap, setAllTotesMap] = useState({});
  const [userFilter, setUserFilter] = useState("");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [toteFilter, setToteFilter] = useState("");
  const [lastAssignedTote, setLastAssignedTote] = useState(null);
  const [awbPrintingBulk, setAwbPrintingBulk] = useState(false);
  const [fetchedLabelPdfs, setFetchedLabelPdfs] = useState([]);
  const [currentPage, setCurrentPage] = useState(1);
  const [returnedOrderIds, setReturnedOrderIds] = useState(new Set());

  const printAssignedAwb = async (assignedTote) => {
    setAwbPrintingBulk(true);
    setFetchedLabelPdfs([]);
    try {
      const postexOrders = assignedTote.orders.filter(o => isPostex(o.courier)).sort((a, b) => a.binNumber - b.binNumber);
      const mnpOrders = assignedTote.orders.filter(o => isMnp(o.courier)).sort((a, b) => a.binNumber - b.binNumber);
      const otherOrders = assignedTote.orders.filter(o => !isPostex(o.courier) && !isMnp(o.courier)).sort((a, b) => a.binNumber - b.binNumber);
      // Collect PDFs as clickable links instead of auto-opening windows — browsers silently
      // block the 2nd+ window.open() call after an async fetch, which was why only PostEx
      // labels ever opened when M&P was also present. A manually-clicked link is never blocked.
      if (postexOrders.length > 0) {
        const trackingNumbers = postexOrders.map(o => o.trackingNumber).filter(Boolean);
        const result = await postexProxy("labels", { trackingNumbers }, token);
        const batches = result.pdfBase64Batches || [result.pdfBase64];
        const mergedUrl = await mergePdfsToUrl(batches);
        setFetchedLabelPdfs(prev => [...prev, { label: `PostEx Labels (${postexOrders.length} orders — combined PDF)`, url: mergedUrl }]);
      }
      if (mnpOrders.length > 0) {
        const trackingNumbers = mnpOrders.map(o => o.trackingNumber).filter(Boolean);
        const batches = await fetchMnpLabelsChunked(trackingNumbers, token);
        const mergedUrl = await mergePdfsToUrl(batches);
        setFetchedLabelPdfs(prev => [...prev, { label: `M&P Labels (${mnpOrders.length} orders — combined PDF)`, url: mergedUrl }]);
      }
      if (otherOrders.length > 0) {
        let rowsHtml = "";
        for (const o of otherOrders) rowsHtml += `<div class="slip"><div class="bin">BIN #${o.binNumber}</div><div class="awb">${o.trackingNumber || "—"}</div><div class="meta">${o.courier || ""}</div></div>`;
        const w = window.open("", "_blank");
        w.document.write(`<html><head><title>AWB Sheet — ${assignedTote.toteNumber}</title><style>
          body{font-family:Arial;padding:16px;color:#111} h2{margin-bottom:4px} .meta-top{color:#555;font-size:13px;margin-bottom:16px}
          .slip{border:2px solid #111;border-radius:8px;padding:14px 16px;margin-bottom:10px;page-break-inside:avoid;display:flex;justify-content:space-between;align-items:center}
          .bin{font-size:22px;font-weight:800;background:#F5A623;color:#1A1206;padding:6px 14px;border-radius:6px}
          .awb{font-size:20px;font-weight:700;font-family:'Courier New',monospace} .meta{color:#555;font-size:12px;text-align:right}
        </style></head><body><h2>AWB Sheet — Tote ${assignedTote.toteNumber}</h2><div class="meta-top">Sorted by bin position.</div>${rowsHtml}</body></html>`);
        w.document.close(); w.print();
      }
      showToast(`✅ AWB labels ready — ${assignedTote.orders.length} orders, Tote ${assignedTote.toteNumber}. Print karke Packer ko tote ke sath handover kar dein.`);
    } catch (e) { showToast(`⚠ AWB fetch failed: ${e.message}`, "err"); }
    setAwbPrintingBulk(false);
  };

  // Fetch AWB labels for whatever is checked in the filtered orders table below —
  // works for ANY order status (picked, packed, dispatched...), not just orders still
  // sitting in an open tote. This is the main way to re-fetch/print AWBs once picking
  // has already closed the task and the order dropped out of the Picking screen.
  const fetchAwbForSelected = async () => {
    const selected = orders.filter(o => selectedOrders[o.id]);
    if (!selected.length) { showToast("Pehle table mein se orders select karein", "err"); return; }
    setAwbPrintingBulk(true);
    setFetchedLabelPdfs([]);
    try {
      const withTracking = selected.map(o => ({ ref: o.external_order_id || o.id, trackingNumber: o.awb_number || o.external_order_id, courier: o.courier }));
      const postexOrders = withTracking.filter(o => isPostex(o.courier));
      const mnpOrders = withTracking.filter(o => isMnp(o.courier));
      const otherOrders = withTracking.filter(o => !isPostex(o.courier) && !isMnp(o.courier));
      if (postexOrders.length > 0) {
        const trackingNumbers = postexOrders.map(o => o.trackingNumber).filter(Boolean);
        const result = await postexProxy("labels", { trackingNumbers }, token);
        const batches = result.pdfBase64Batches || [result.pdfBase64];
        const mergedUrl = await mergePdfsToUrl(batches);
        setFetchedLabelPdfs(prev => [...prev, { label: `PostEx Labels (${postexOrders.length} orders — combined PDF)`, url: mergedUrl }]);
      }
      if (mnpOrders.length > 0) {
        const trackingNumbers = mnpOrders.map(o => o.trackingNumber).filter(Boolean);
        const batches = await fetchMnpLabelsChunked(trackingNumbers, token);
        const mergedUrl = await mergePdfsToUrl(batches);
        setFetchedLabelPdfs(prev => [...prev, { label: `M&P Labels (${mnpOrders.length} orders — combined PDF)`, url: mergedUrl }]);
      }
      if (otherOrders.length > 0) {
        let rowsHtml = "";
        for (const o of otherOrders) rowsHtml += `<div class="slip"><div class="bin">${o.ref}</div><div class="awb">${o.trackingNumber || "—"}</div><div class="meta">${o.courier || ""}</div></div>`;
        const w = window.open("", "_blank");

    try {
      const rows = await parseSheet(file);

      const map = buildColumnMap(Object.keys(rows[0]));
      if (!map.barcode || !map.orderRef) { showToast("Barcode ya Order/Tracking column nahi mila", "err"); setImporting(false); return; }

      const fileBarcodes = rows.map(r => getVal(r, map, "barcode"));

      // orders already imported (whole order, not per-line) count as duplicates

      totalDuration: (order.received_at && order.dispatched_at) ? fmtDur(new Date(order.dispatched_at) - new Date(order.received_at)) : null
    });

    const newProducts = await fetchProductsByIds(token, (lines || []).map(l => l.product_id));
    setProductCache(prev => ({ ...prev, ...newProducts }));
    setEditTracking(order.external_order_id);
    setEditCourier(order.courier);
    setEditQty({});
    setOpenOrder(order);
  };

  const canEditIncomplete = ["admin", "warehouse_lead"].includes(profile.role);

  const [orderSearch, setOrderSearch] = useState("");
  const searchOrderHistory = async () => {
    const code = orderSearch.trim();
    if (!code) return;
    let found = orders.find(o => o.external_order_id === code || o.external_order_id.includes(code));
    if (!found) {
      const rows = await sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&external_order_id=eq.${encodeURIComponent(code)}&select=*`, { token });
      found = rows && rows[0];
    }
    if (!found) { showToast("Order nahi mila — number check karein", "err"); return; }
    setOrderSearch("");
    openOrderDetail(found);
  };

  const saveOrderEdits = async () => {
    try {
      const changes = [];
      if (editTracking.trim() !== openOrder.external_order_id) changes.push({ field: "Tracking Number", old: openOrder.external_order_id, new: editTracking.trim() });
      if (editCourier.trim() !== openOrder.courier) changes.push({ field: "Courier", old: openOrder.courier, new: editCourier.trim() });

      await sb(`/rest/v1/sales_orders?id=eq.${openOrder.id}`, { method: "PATCH", token, body: { external_order_id: editTracking.trim(), courier: editCourier.trim() } });
      for (const l of openLines) {
        const newQty = editQty[l.id] !== undefined ? Number(editQty[l.id]) : l.qty;
        if (newQty !== l.qty && newQty > 0) {
          const p = productCache[l.product_id];
          changes.push({ field: `Qty — ${p?.barcode || p?.name || l.product_id}`, old: String(l.qty), new: String(newQty) });
          await sb(`/rest/v1/sales_order_lines?id=eq.${l.id}`, { method: "PATCH", token, body: { qty: newQty } });
          if (newQty < l.qty) {
            const shortfall = l.qty - newQty;
            const existingShortage = openShortages.find(s => s.product_id === l.product_id);
            if (existingShortage) {
              await sb(`/rest/v1/order_shortage_lines?id=eq.${existingShortage.id}`, { method: "PATCH", token, body: { qty_required: l.qty, qty_available: newQty, not_available_qty: shortfall } });
            } else {
              await sb(`/rest/v1/order_shortage_lines`, { method: "POST", token, body: { order_id: openOrder.id, product_id: l.product_id, qty_required: l.qty, qty_available: newQty, not_available_qty: shortfall } });
            }
          }
        }
      }
      for (const c of changes) {
        await sb(`/rest/v1/audit_trail`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: openOrder.id, field_changed: c.field, old_value: c.old, new_value: c.new, changed_by: profile.id } });
      }
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: openOrder.id, user_id: profile.id, action: "amended", metadata: { tracking: editTracking, courier: editCourier } } });
      showToast(changes.length ? `Order amended — ${changes.length} field(s) changed` : "Koi change nahi tha");
      openOrderDetail({ ...openOrder, external_order_id: editTracking.trim(), courier: editCourier.trim() });
    } catch (e) { showToast("Save failed — tracking number already exist ho sakta hai", "err"); }
  };

  const retryReserve = async () => {
    await sb(`/rest/v1/sales_orders?id=eq.${openOrder.id}`, { method: "PATCH", token, body: { status: "received" } });
    await reserveAndQueue({ ...openOrder, status: "received" });
    setOpenOrder(null);
  };

  const hasPartialPick = Object.values(openPickedQty).some(q => q > 0);

  const markReadyForDispatch = async () => {
    const shortfallLines = openLines.filter(l => (openPickedQty[l.product_id] || 0) < l.qty);
    if (shortfallLines.length > 0) {
      const names = shortfallLines.map(l => productCache[l.product_id]?.barcode || l.product_id).join(", ");
      showToast(`⚠ Qty abhi bhi jitna pick hua usse zyada hai (${names}) — pehle qty ko picked amount ke barabar edit karein`, "err");
      return;
    }
    try {
      await sb(`/rest/v1/pack_tasks`, { method: "POST", token, body: { order_id: openOrder.id, status: "labeled", started_at: new Date().toISOString(), completed_at: new Date().toISOString(), assigned_to: profile.id } });
      await sb(`/rest/v1/sales_orders?id=eq.${openOrder.id}`, { method: "PATCH", token, body: { status: "rtd" } });
      await sb(`/rest/v1/audit_trail`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: openOrder.id, field_changed: "Status", old_value: "incomplete", new_value: "rtd (Lead override — matched to picked qty)", changed_by: profile.id } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: openOrder.id, user_id: profile.id, action: "incomplete_resolved_direct_to_dispatch" } });
      showToast(`✅ Order ${openOrder.external_order_id} — Dispatch ke liye ready, scan kar ke load sheet banayein`);
      setOpenOrder(null); load();
    } catch (e) { showToast("Failed — dobara try karein", "err"); }
  };

  if (openOrder) {
    return (
      <div>
        <SectionTitle title={`Order ${openOrder.external_order_id}`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenOrder(null)}>← Back to orders</button>} />
        <div style={S.panel}>
          {openOrder.status === "incomplete" && canEditIncomplete ? (
            <div style={{ display: "flex", gap: 16, flexWrap: "wrap", alignItems: "flex-end" }}>
              <div>
                <div style={S.label}>TRACKING NUMBER</div>
                <input style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} value={editTracking} onChange={e => setEditTracking(e.target.value)} />
              </div>
              <div>
                <div style={S.label}>COURIER</div>
                <select style={S.input} value={editCourier} onChange={e => setEditCourier(e.target.value)}>
                  <option value="Postex">Postex</option>
                  <option value="M&P">M&P</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <button style={S.secondaryBtnSm} onClick={saveOrderEdits}>💾 Save changes</button>
            </div>
          ) : (
            <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
              <div><div style={S.label}>COURIER</div><div style={{ color: "#2B2620", fontSize: 14 }}>{openOrder.courier}</div></div>
              <div><div style={S.label}>STATUS</div><span style={{ ...S.badgeSm, color: STATUS_COLORS[openOrder.status] || "#5B9EE8", borderColor: STATUS_COLORS[openOrder.status] || "#5B9EE8" }}>{ORDER_STATUS_LABEL[openOrder.status] || openOrder.status}</span></div>
              <div><div style={S.label}>RECEIVED</div><div style={{ color: "#6B6355", fontSize: 13, fontFamily: "'IBM Plex Mono', monospace" }}>{fmtTime(openOrder.received_at)}</div></div>
              {openOrder.dispatched_at && <div><div style={S.label}>DISPATCHED</div><div style={{ color: "#6B6355", fontSize: 13, fontFamily: "'IBM Plex Mono', monospace" }}>{fmtTime(openOrder.dispatched_at)}</div></div>}
            </div>
          )}
        </div>

        {(openOrder.status === "incomplete" || openShortages.length > 0) && (
          <div style={{ ...S.panel, borderColor: "#E5484D" }}>
            <div style={{ ...S.panelTitle, color: "#E5484D" }}>⚠ Shortage report — kam quantity available thi</div>
            <table>
              <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Required</th><th style={S.th}>Available</th><th style={S.th}>Not Available</th></tr></thead>
              <tbody>
                {openShortages.map(s => {
                  const p = productCache[s.product_id];
                  return (
                    <tr key={s.id}>
                      <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                      <td style={S.td}>{p?.name || "—"}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{s.qty_required}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{s.qty_available}</td>
                      <td style={{ ...S.td, color: "#E5484D", fontWeight: 600 }}>{s.not_available_qty}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {canEditIncomplete && openOrder.status === "incomplete" && (
              hasPartialPick ? (
                <div style={{ marginTop: 14 }}>
                  <div style={{ color: "#6B6355", fontSize: 12, marginBottom: 8 }}>Yeh order pehle se partially picked ja chuka hai. Agar upar qty ko us amount tak edit kar diya hai jo actually pick hua tha, to direct Dispatch ke liye bhej sakte hain — dobara pick karne ki zaroorat nahi.</div>
                  <button style={S.primaryBtnSm} onClick={markReadyForDispatch}>✅ Confirm &amp; Send to Dispatch (no re-pick)</button>
                </div>
              ) : (
                <button style={{ ...S.primaryBtnSm, marginTop: 14 }} onClick={retryReserve}>🔄 Retry reserve (after correction/restock)</button>
              )
            )}
          </div>
        )}

        <div style={S.panel}>
          <div style={S.panelTitle}>Line items{openOrder.status === "incomplete" && canEditIncomplete ? " (editable)" : ""}</div>
          <table>
            <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th>{hasPartialPick && <th style={S.th}>Picked</th>}<th style={S.th}>Qty</th></tr></thead>
            <tbody>
              {openLines.map(l => {
                const p = productCache[l.product_id];
                return (
                  <tr key={l.id}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                    <td style={S.td}>{p?.name || "—"}</td>
                    {hasPartialPick && <td style={{ ...S.td, color: (openPickedQty[l.product_id] || 0) < l.qty ? "#E5484D" : "#4CAF7D", fontWeight: 600 }}>{openPickedQty[l.product_id] || 0}</td>}
                    <td style={S.td}>
                      {openOrder.status === "incomplete" && canEditIncomplete ? (
                        <input type="number" min={1} style={{ ...S.input, width: 80, padding: "4px 8px" }} value={editQty[l.id] !== undefined ? editQty[l.id] : l.qty} onChange={e => setEditQty({ ...editQty, [l.id]: e.target.value })} />
                      ) : l.qty}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {orderTimingSummary && (
          <div style={S.panel}>
            <div style={S.panelTitle}>Timing summary — who did what, and how long it took</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 14 }}>
              <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
                <div style={S.label}>🚶 PICKER</div>
                <div style={{ color: "#2B2620", fontSize: 14, fontWeight: 600 }}>{orderTimingSummary.pickerName || "Not assigned yet"}</div>
                {orderTimingSummary.pickDuration && <div style={{ color: "#F5A623", fontSize: 18, fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif", marginTop: 4 }}>{orderTimingSummary.pickDuration}</div>}
                {orderTimingSummary.pickCompletedAt && <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>Completed: {fmtTime(orderTimingSummary.pickCompletedAt)}</div>}
              </div>
              <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
                <div style={S.label}>🏷 PACKER</div>
                <div style={{ color: "#2B2620", fontSize: 14, fontWeight: 600 }}>{orderTimingSummary.packerName || "Not assigned yet"}</div>
                {orderTimingSummary.packDuration && <div style={{ color: "#F5A623", fontSize: 18, fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif", marginTop: 4 }}>{orderTimingSummary.packDuration}</div>}
                {orderTimingSummary.packCompletedAt && <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>Completed: {fmtTime(orderTimingSummary.packCompletedAt)}</div>}
              </div>
              <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
                <div style={S.label}>🚚 DISPATCHER</div>
                <div style={{ color: "#2B2620", fontSize: 14, fontWeight: 600 }}>{orderTimingSummary.dispatcherName || "Not dispatched yet"}</div>
                {orderTimingSummary.dispatchedAt && <div style={{ color: "#4CAF7D", fontSize: 12, marginTop: 4 }}>{fmtTime(orderTimingSummary.dispatchedAt)}</div>}
                {orderTimingSummary.loadSheetNumber && <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>Load Sheet: {orderTimingSummary.loadSheetNumber}</div>}
              </div>
            </div>
            {orderTimingSummary.totalDuration && (
              <div style={{ marginTop: 12, color: "#6B6355", fontSize: 12 }}>Total lead time (received → dispatched): <b style={{ color: "#2B2620" }}>{orderTimingSummary.totalDuration}</b></div>
            )}
          </div>
        )}

        <div style={S.panel}>
          <div style={S.panelTitle}>Order history — who did what, and when</div>
          {openEvents.length === 0 ? <EmptyNote text="No activity yet." /> : openEvents.map((ev, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #EFE8D8" }}>
              <span style={{ color: "#2B2620", fontSize: 13 }}>{ev.label} <span style={{ color: "#6B6355" }}>— {ev.user}</span></span>
              <span style={{ color: "#8A8272", fontSize: 11, fontFamily: "'IBM Plex Mono', monospace" }}>{fmtTime(ev.ts)}</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle title="Sales Orders" action={
        <div style={{ display: "flex", gap: 8 }}>
          <label style={{ ...S.secondaryBtnSm, cursor: "pointer" }}>
            {importing ? "Importing…" : "📤 Upload orders file"}
            <input type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={handleOrdersFile} disabled={importing} />
          </label>
          <button style={S.primaryBtnSm} onClick={() => setShowForm(s => !s)}>+ New order</button>
        </div>
      } />
      <div style={{ margin: "0 0 14px" }}>
        <div style={{ display: "flex", gap: 10 }}>
          <input style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="🔍 Order/Tracking number se seedha history dekhein…"
            value={orderSearch} onChange={e => setOrderSearch(e.target.value)}
            onKeyDown={e => e.key === "Enter" && searchOrderHistory()} />
          <button style={S.primaryBtnSm} onClick={searchOrderHistory}>Find</button>
        </div>
      </div>
      {importSummary && (
        <div style={{ ...S.panel, borderColor: "#4CAF7D", color: "#4CAF7D", fontSize: 12 }}>{importSummary}</div>
      )}
      {ordersReport && (
        <ImportReportPanel report={ordersReport.report} importing={importing}
          onConfirm={confirmOrdersImport} onCancel={() => setOrdersReport(null)} confirmLabel="Confirm & import orders" />
      )}
      {!ordersReport && showForm && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Create order (manual entry — courier integration comes later)</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
            <input style={{ ...S.input, flex: 1, minWidth: 160, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Order ID (from M&P/Postex)" value={extId} onChange={e => setExtId(e.target.value)} />
            <select style={{ ...S.input, minWidth: 140 }} value={courier} onChange={e => setCourier(e.target.value)}>
              <option value="Postex">Postex</option>
              <option value="M&P">M&P</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10, flexWrap: "wrap" }}>
            <ProductPicker token={token} onSelect={(p) => setPendingProduct(p)} />
            {pendingProduct && (
              <span style={{ ...S.badgeSm, color: "#F5A623", borderColor: "#F5A623" }}>{pendingProduct.barcode} — {pendingProduct.name} <span style={{ cursor: "pointer", marginLeft: 6 }} onClick={() => setPendingProduct(null)}>✕</span></span>
            )}
            <input style={{ ...S.input, width: 90 }} type="number" min={1} value={lineQty} onChange={e => setLineQty(e.target.value)} />
            <button style={S.secondaryBtnSm} onClick={addLine}>+ Add line</button>
          </div>
          {items.length > 0 && (
            <div style={{ marginBottom: 12 }}>
              {items.map((it, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", background: "#F4EFE6", border: "1px solid #E0D8C5", borderRadius: 6, padding: "8px 10px", marginBottom: 6, fontSize: 13 }}>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{it.barcode}</span>
                  <span style={{ color: "#2B2620", flex: 1, marginLeft: 8 }}>{it.name}</span>
                  <span style={{ color: "#6B6355" }}>× {it.qty}</span>
                </div>
              ))}
            </div>
          )}
          <button style={S.primaryBtnSm} onClick={createOrder}>Create order</button>
        </div>
      )}

      {(() => {
        const STAGES = [
          { key: "received", label: "New / Received", color: "#6B6355", icon: "🧾" },
          { key: "queued", label: "Queued for Pick", color: "#5B9EE8", icon: "🛒" },
          { key: "picking", label: "Picked", color: "#5B9EE8", icon: "🚶" },
          { key: "rtd", label: "Packed / RTD", color: "#B084F5", icon: "📦" },
          { key: "dispatched", label: "Dispatched", color: "#4CAF7D", icon: "🚚" },
          { key: "incomplete", label: "Incomplete", color: "#E5484D", icon: "⚠" }
        ];
        const counts = Object.fromEntries(STAGES.map(s => [s.key, orders.filter(o => s.key === "dispatched" ? ["dispatched", "handed_over"].includes(o.status) : o.status === s.key).length]));
        const returnInTransitOrders = orders.filter(o => ["0002", "0006", "0007"].includes(o.courier_status_code) && !returnedOrderIds.has(o.id));
        const ritByCourier = {};
        for (const o of returnInTransitOrders) ritByCourier[o.courier || "Other"] = (ritByCourier[o.courier || "Other"] || 0) + 1;
        return (
          <div style={{ display: "grid", gridTemplateColumns: `repeat(${STAGES.length + 3}, 1fr)`, gap: 10, marginBottom: 18 }}>            <div onClick={() => setStatusFilter(null)}
              style={{ ...S.statCard, cursor: "pointer", ...(statusFilter === null ? { borderColor: "#F5A623" } : {}) }}>
              <span style={{ fontSize: 16 }}>📋</span>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 22, fontWeight: 700, color: "#2B2620", marginTop: 8 }}>{orders.length}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>All orders</div>
            </div>
            {STAGES.map(s => (
              <div key={s.key} onClick={() => setStatusFilter(s.key)}
                style={{ ...S.statCard, cursor: "pointer", ...(statusFilter === s.key ? { borderColor: s.color } : {}) }}>
                <span style={{ fontSize: 16 }}>{s.icon}</span>
                <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 22, fontWeight: 700, color: s.color, marginTop: 8 }}>{counts[s.key] || 0}</div>
                <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>{s.label}</div>
              </div>
            ))}
            <div onClick={() => setStatusFilter("return_in_transit")}
              title={Object.entries(ritByCourier).map(([c, n]) => `${c}: ${n}`).join(" · ") || "Koi nahi"}
              style={{ ...S.statCard, cursor: "pointer", ...(statusFilter === "return_in_transit" ? { borderColor: "#E5484D" } : {}) }}>
              <span style={{ fontSize: 16 }}>🔙</span>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 22, fontWeight: 700, color: "#E5484D", marginTop: 8 }}>{returnInTransitOrders.length}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>Return In-Transit</div>
            </div>
            <div onClick={() => setView && setView("returns")} style={{ ...S.statCard, cursor: "pointer" }}>
              <span style={{ fontSize: 16 }}>↩</span>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 22, fontWeight: 700, color: "#B084F5", marginTop: 8 }}>{returnsCount}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>Return Orders</div>
            </div>
          </div>
        );
      })()}

      {receivedOrders.length > 0 && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Smart Picking — order classification</div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => { setSkuFilter("all"); setSelectedOrders({}); }} style={{ ...S.pill, ...(skuFilter === "all" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>All ({receivedOrders.length})</button>
            <button onClick={() => {
              setSkuFilter("single");
              setSelectedOrders(Object.fromEntries(receivedOrders.filter(o => orderSkuType(o.id) === "single").map(o => [o.id, true])));
            }} style={{ ...S.pill, ...(skuFilter === "single" ? { background: "#4CAF7D", color: "#1A1206", borderColor: "#4CAF7D" } : {}) }}>Single-SKU ({singleCount})</button>
            <button onClick={() => {
              setSkuFilter("multi");
              setSelectedOrders(Object.fromEntries(receivedOrders.filter(o => orderSkuType(o.id) === "multi").map(o => [o.id, true])));
            }} style={{ ...S.pill, ...(skuFilter === "multi" ? { background: "#5B9EE8", color: "#1A1206", borderColor: "#5B9EE8" } : {}) }}>Multi-SKU ({multiCount})</button>
          </div>
          <div style={{ color: "#8A8272", fontSize: 11, marginTop: 8 }}>Single-SKU ya Multi-SKU pe click karte hi woh saare orders automatically select ho jate hain — neeche seedha "Assign" kar sakte hain bulk mein, alag-alag tick karne ki zaroorat nahi.</div>
        </div>
      )}

      {receivedOrders.length > 0 && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Bulk assign to picker ({selectedCount} selected)</div>
          {totes.length === 0 && (
            <div style={{ color: "#E5484D", fontSize: 12, marginBottom: 10 }}>⚠ Koi available tote nahi hai — Admin se Tote Master check karwayein.</div>
          )}
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <select style={{ ...S.input, minWidth: 140, fontFamily: "'IBM Plex Mono', monospace" }} value={bulkToteId} onChange={e => setBulkToteId(e.target.value)}>
              <option value="">🧺 Select tote…</option>
              {totes.map(t => <option key={t.id} value={t.id}>{t.tote_number}</option>)}
            </select>
            <select style={{ ...S.input, minWidth: 180 }} value={bulkPickerId} onChange={e => setBulkPickerId(e.target.value)}>
              <option value="">Assign to…</option>
              {pickers.map(p => <option key={p.id} value={p.id}>{p.full_name} ({p.role})</option>)}
            </select>
            <button style={S.primaryBtnSm} onClick={bulkReserveAndAssign} disabled={bulkBusy || selectedCount === 0}>
              {bulkBusy ? "Assigning…" : `Reserve & Assign (${selectedCount})`}
            </button>
          </div>
        </div>
      )}

      {lastAssignedTote && (
        <div style={{ ...S.panel, borderColor: "#F5A623", background: "#FFF9EE" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
            <div>
              <div style={{ fontWeight: 700, color: "#2B2620" }}>✅ Tote {lastAssignedTote.toteNumber} assign ho gayi — {lastAssignedTote.orders.length} orders</div>
              <div style={{ color: "#6B6355", fontSize: 12, marginTop: 2 }}>Ab AWB labels print karein aur Packer ko tote ke sath handover kar dein, taake woh parcels pe labeling kar sakein.</div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={S.primaryBtnSm} disabled={awbPrintingBulk} onClick={() => printAssignedAwb(lastAssignedTote)}>{awbPrintingBulk ? "Fetching…" : "🏷 Print AWB Labels"}</button>
              <button style={S.secondaryBtnSm} onClick={() => { setLastAssignedTote(null); setFetchedLabelPdfs([]); }}>Dismiss</button>
            </div>
          </div>
        </div>
      )}

      {fetchedLabelPdfs.length > 0 && (
        <div style={{ ...S.panel, borderColor: "#F5A623", background: "#FFF9EE" }}>
          <div style={{ color: "#6B6355", fontSize: 12, marginBottom: 8 }}>Labels ready — har link ek naye tab mein khulega (click karein, browser popup block nahi karega):</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {fetchedLabelPdfs.map((p, i) => (
              <a key={i} href={p.url} target="_blank" rel="noopener noreferrer" style={{ ...S.secondaryBtnSm, textDecoration: "none", display: "inline-block" }}>📄 {p.label}</a>
            ))}
          </div>
        </div>
      )}

      <div style={S.panel}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
          <span style={{ color: "#6B6355", fontSize: 12 }}>Received date:</span>
          <input type="date" style={{ ...S.input, maxWidth: 150 }} value={dateFrom} onChange={e => setDateFrom(e.target.value)} />
          <span style={{ color: "#8A8272" }}>to</span>
          <input type="date" style={{ ...S.input, maxWidth: 150 }} value={dateTo} onChange={e => setDateTo(e.target.value)} />
          <button style={S.secondaryBtnSm} onClick={() => { const t = new Date().toISOString().slice(0, 10); setDateFrom(t); setDateTo(t); }}>Today</button>

          <span style={{ color: "#6B6355", fontSize: 12, marginLeft: 14 }}>User:</span>
          <select style={{ ...S.input, minWidth: 180 }} value={userFilter} onChange={e => setUserFilter(e.target.value)}>
            <option value="">All users</option>
            {pickers.map(p => <option key={p.id} value={p.id}>{p.full_name} ({p.role})</option>)}
          </select>

          <span style={{ color: "#6B6355", fontSize: 12, marginLeft: 14 }}>Tote:</span>
          <select style={{ ...S.input, minWidth: 160, fontFamily: "'IBM Plex Mono', monospace" }} value={toteFilter} onChange={e => setToteFilter(e.target.value)}>
            <option value="">All totes</option>
            {Object.values(allTotesMap).sort((a, b) => a.tote_number.localeCompare(b.tote_number)).map(t => <option key={t.id} value={t.id}>{t.tote_number}</option>)}
          </select>

          {(dateFrom || dateTo || userFilter || toteFilter) && (
            <button style={S.secondaryBtnSm} onClick={() => { setDateFrom(""); setDateTo(""); setUserFilter(""); setToteFilter(""); }}>Clear all</button>
          )}
          {selectedCount > 0 && (
            <button style={{ ...S.primaryBtnSm, marginLeft: 10 }} disabled={awbPrintingBulk} onClick={fetchAwbForSelected}>{awbPrintingBulk ? "Fetching…" : `🏷 Fetch AWB Labels (${selectedCount} selected)`}</button>
          )}
        </div>
        {(userFilter || toteFilter) && <div style={{ color: "#8A8272", fontSize: 11, marginBottom: 10 }}>Showing filtered orders — select orders (kisi bhi status ke) aur "Fetch AWB Labels" dabayein, chahe unki picking already complete ho chuki ho.</div>}
        <table>
          <thead>
            <tr>
              <th style={S.th}><input type="checkbox" onChange={e => toggleAll(e.target.checked)} checked={selectedCount > 0 && selectedCount === displayedOrders.length} /></th>
              <th style={S.th}>Order #</th><th style={S.th}>Courier</th><th style={S.th}>Status</th>
              <th style={S.th}>Items</th><th style={S.th}>Qty</th><th style={S.th}>Type</th>
              <th style={S.th}>Assigned To</th><th style={S.th}>Tote</th>
              <th style={S.th}>Last-Mile Status</th><th style={S.th}>City</th><th style={S.th}>Courier Order Ref</th>
              <th style={S.th}>Received</th><th style={S.th}></th>
            </tr>
          </thead>
          <tbody>
            {pagedOrders.map(o => {
              const stat = lineStats[o.id] || { count: 0, qty: 0 };
              const type = o.status === "received" ? orderSkuType(o.id) : null;
              const pInfo = pickTaskInfo[o.id];
              const assignedName = pInfo?.assignedTo ? (profiles[pInfo.assignedTo]?.full_name || "—") : "—";
              const toteNumber = pInfo?.toteId ? (allTotesMap[pInfo.toteId]?.tote_number || "—") : "—";
              const lastMileColor = o.courier_status_code === "0005" ? "#4CAF7D" : ["0002", "0006", "0007"].includes(o.courier_status_code) ? "#E5484D" : o.courier_status_code ? "#5B9EE8" : "#8A8272";
              return (
                <tr key={o.id} style={{ cursor: "pointer" }} onClick={() => openOrderDetail(o)}>
                  <td style={S.td} onClick={e => e.stopPropagation()}>
                    <input type="checkbox" checked={!!selectedOrders[o.id]} onChange={e => setSelectedOrders({ ...selectedOrders, [o.id]: e.target.checked })} />
                  </td>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{o.external_order_id}</td>
                  <td style={S.td}>{o.courier}</td>
                  <td style={S.td}><span style={{ ...S.badgeSm, color: STATUS_COLORS[o.status] || "#5B9EE8", borderColor: STATUS_COLORS[o.status] || "#5B9EE8" }}>{ORDER_STATUS_LABEL[o.status] || o.status}</span></td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{stat.count}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{stat.qty}</td>
                  <td style={S.td}>
                    {type && <span style={{ ...S.badgeSm, color: type === "single" ? "#4CAF7D" : "#5B9EE8", borderColor: type === "single" ? "#4CAF7D" : "#5B9EE8" }}>{type === "single" ? "Single-SKU" : "Multi-SKU"}</span>}
                  </td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{assignedName}</td>
                  <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace" }}>{toteNumber}</td>
                  <td style={S.td}>
                    {o.courier_status ? <span style={{ ...S.badgeSm, color: lastMileColor, borderColor: lastMileColor }}>{o.courier_status}</span> : <span style={{ color: "#8A8272", fontSize: 11 }}>—</span>}
                  </td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{o.delivery_city || "—"}</td>
                  <td style={{ ...S.td, color: "#8A8272", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{o.courier_order_ref || "—"}</td>
                  <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{fmtTime(o.received_at)}</td>
                  <td style={S.td}>
                    {o.status === "received" && (
                      <button style={S.secondaryBtnSm} onClick={(e) => { e.stopPropagation(); reserveAndQueue(o); }}>Reserve only</button>
                    )}
                  </td>
                </tr>
              );
            })}
            {displayedOrders.length === 0 && (
              <tr><td colSpan={14}><EmptyNote text="No orders in this status." /></td></tr>
            )}
          </tbody>
        </table>
        {displayedOrders.length > 0 && (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 14, flexWrap: "wrap", gap: 10 }}>
            <span style={{ color: "#8A8272", fontSize: 12 }}>
              Showing {(safeCurrentPage - 1) * PAGE_SIZE + 1}–{Math.min(safeCurrentPage * PAGE_SIZE, displayedOrders.length)} of {displayedOrders.length} orders
            </span>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <button style={S.secondaryBtnSm} disabled={safeCurrentPage === 1} onClick={() => setCurrentPage(p => Math.max(1, p - 1))}>← Previous</button>
              <span style={{ color: "#6B6355", fontSize: 12 }}>Page {safeCurrentPage} of {totalPages}</span>
              <button style={S.secondaryBtnSm} disabled={safeCurrentPage === totalPages} onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}>Next →</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ================= PICKING ================= */
function PickingView({ token, profile, showToast }) {
  const [tasks, setTasks] = useState([]);
  const [orders, setOrders] = useState({});
  const [products, setProducts] = useState({});
  const [pickers, setPickers] = useState([]);
  const [bins, setBins] = useState({});
  const [taskLines, setTaskLines] = useState({});
  const [totes, setTotes] = useState([]);
  const [selectedForTote, setSelectedForTote] = useState({});
  const [toteAssignPicker, setToteAssignPicker] = useState("");
  const [selectedToteId, setSelectedToteId] = useState("");
  const [openTote, setOpenTote] = useState(null);
  const [consolidated, setConsolidated] = useState([]);
  const [toteScans, setToteScans] = useState({});
  const [barcodeInput, setBarcodeInput] = useState("");
  const [lastScannedProduct, setLastScannedProduct] = useState(null);
  const [lastScanInfo, setLastScanInfo] = useState(null);
  const [pickViewMode, setPickViewMode] = useState("location");
  const [showDamageInput, setShowDamageInput] = useState(false);
  const [damageQtyInput, setDamageQtyInput] = useState("");
  const canBatch = ["admin", "supervisor", "warehouse_lead"].includes(profile.role);

  const load = useCallback(async () => {
    try {
      const [t, o, pk, b, tt] = await Promise.all([
        sb(`/rest/v1/pick_tasks?status=neq.picked&select=*&order=id.asc`, { token }),
        sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/profiles?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/totes?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token })
      ]);
      setTasks(t || []);
      setOrders(Object.fromEntries((o || []).map(x => [x.id, x])));
      setPickers((pk || []).filter(u => ["picker", "packer"].includes(u.role)));
      setBins(Object.fromEntries((b || []).map(x => [x.id, x])));
      setTotes(tt || []);
      const taskIds = (t || []).map(x => x.id);
      if (taskIds.length) {
        const CHUNK = 60;
        const chunks = [];
        for (let i = 0; i < taskIds.length; i += CHUNK) chunks.push(taskIds.slice(i, i + CHUNK));
        const lineResults = await Promise.all(chunks.map(ch => sb(`/rest/v1/pick_task_lines?pick_task_id=in.(${ch.join(",")})&select=*`, { token })));
        const lines = lineResults.flat().filter(Boolean);
        const newProducts = await fetchProductsByIds(token, lines.map(l => l.product_id));
        setProducts(prev => ({ ...prev, ...newProducts }));
        const grouped = {};
        for (const l of lines || []) { (grouped[l.pick_task_id] = grouped[l.pick_task_id] || []).push(l); }
        setTaskLines(grouped);
      }
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    if (openTote) return; // don't poll while actively scanning inside a tote — avoid disrupting the picker
    const interval = setInterval(load, 15000);
    return () => clearInterval(interval);
  }, [load, openTote]);
  useEffect(() => {
    window.addEventListener("app-reconnect", load);
    return () => window.removeEventListener("app-reconnect", load);
  }, [load]);

  const queuedTasks = tasks.filter(t => t.status === "queued" && !t.tote_id);
  const taskSkuCount = (t) => new Set((taskLines[t.id] || []).map(l => l.product_id)).size;
  const taskSkuType = (t) => taskSkuCount(t) <= 1 ? "single" : "multi";
  const singleSkuCount = queuedTasks.filter(t => taskSkuType(t) === "single").length;
  const multiSkuCount = queuedTasks.filter(t => taskSkuType(t) === "multi").length;
  const [pickBatchSkuFilter, setPickBatchSkuFilter] = useState("all");
  const filteredQueuedTasks = queuedTasks.filter(t => pickBatchSkuFilter === "all" || taskSkuType(t) === pickBatchSkuFilter);
  const selectedCount = Object.values(selectedForTote).filter(Boolean).length;
  const availableTotes = totes.filter(t => t.status === "open");

  const createTote = async () => {
    const ids = Object.keys(selectedForTote).filter(k => selectedForTote[k]);
    if (ids.length === 0) { showToast("Kam se kam ek order select karein", "err"); return; }
    if (!toteAssignPicker) { showToast("Picker select karein", "err"); return; }
    if (!selectedToteId) { showToast("Tote select karein — koi available nahi hai to admin se check karwayein", "err"); return; }
    const selectedToteObj = totes.find(t => t.id === selectedToteId);
    if (!isBulkTote(selectedToteObj) && ids.length > NORMAL_TOTE_MAX) {
      showToast(`This TOT has a maximum capacity of ${NORMAL_TOTE_MAX} orders. Bulk Trolley select karein zyada orders ke liye.`, "err");
      return;
    }
    try {
      await sb(`/rest/v1/totes?id=eq.${selectedToteId}`, { method: "PATCH", token, body: { status: "picking", assigned_to: toteAssignPicker } });
      let binNum = 1;
      const assignedSummary = [];
      for (const id of ids) {
        const task = tasks.find(t => t.id === id);
        await sb(`/rest/v1/pick_tasks?id=eq.${id}`, { method: "PATCH", token, body: { tote_id: selectedToteId, assigned_to: toteAssignPicker, status: "assigned", assigned_at: new Date().toISOString(), tote_bin_number: binNum } });
        assignedSummary.push({ orderId: task?.order_id, binNumber: binNum, trackingNumber: orders[task?.order_id]?.awb_number || orders[task?.order_id]?.external_order_id, courier: orders[task?.order_id]?.courier });
        binNum++;
      }
      const toteNumber = totes.find(t => t.id === selectedToteId)?.tote_number;
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "tote", entity_id: selectedToteId, user_id: profile.id, action: "assigned", metadata: { orders: ids.length, assigned_to: toteAssignPicker } } });
      setLastAssignedTote({ toteId: selectedToteId, toteNumber, orders: assignedSummary });
      showToast(`${toteNumber} assigned with ${ids.length} orders`);
      setSelectedForTote({}); setToteAssignPicker(""); setSelectedToteId(""); load();
    } catch (e) { showToast("Tote assignment failed", "err"); }
  };

  const [lastAssignedTote, setLastAssignedTote] = useState(null);

  const openToteDetail = (tote) => {
    const toteTasks = tasks.filter(t => t.tote_id === tote.id);
    const groups = {};
    for (const t of toteTasks) {
      for (const l of (taskLines[t.id] || [])) {
        const key = `${l.bin_id || "none"}|${l.product_id}`;
        if (!groups[key]) groups[key] = { bin_id: l.bin_id, product_id: l.product_id, required: 0, scanned: 0, refs: [] };
        const already = l.qty_picked || 0;
        groups[key].required += l.qty_required;
        groups[key].scanned += already;
        groups[key].refs.push({ pick_task_id: t.id, order_id: t.order_id, toteBin: t.tote_bin_number, line_id: l.id, qty_required: l.qty_required, allocated: already });
      }
    }
    for (const g of Object.values(groups)) g.refs.sort((a, b) => (a.toteBin || 99) - (b.toteBin || 99));
    const list = Object.values(groups).sort((a, b) => (bins[a.bin_id]?.code || "zzz").localeCompare(bins[b.bin_id]?.code || "zzz"));
    setConsolidated(list);
    setLastScannedProduct(null);
    setLastScanInfo(null);
    setCompletedOrderIds({});
    setOpenTote(tote);
  };

  const activeGroup = consolidated.find(g => g.scanned < g.required);
  const nextRef = activeGroup ? activeGroup.refs.find(r => r.allocated < r.qty_required) : null;
  const nextOrder = nextRef ? orders[nextRef.order_id] : null;

  const [completedOrderIds, setCompletedOrderIds] = useState({});

  const buildLineStatus = () => {
    const lineStatus = {};
    for (const g of consolidated) {
      for (const ref of g.refs) {
        lineStatus[ref.line_id] = { orderId: ref.order_id, allocated: ref.allocated, qty_required: ref.qty_required, resolved: g.required === g.scanned };
      }
    }
    return lineStatus;
  };

  const finalizeOrderPicking = async (orderId, lineStatus) => {
    const toteTasks = tasks.filter(t => t.tote_id === openTote.id);
    const task = toteTasks.find(t => t.order_id === orderId);
    if (!task) return true;
    if (completedOrderIds[orderId]) return true;
    try {
      const lines = taskLines[task.id] || [];
      for (const l of lines) {
        const st = lineStatus[l.id];
        await sb(`/rest/v1/pick_task_lines?id=eq.${l.id}`, { method: "PATCH", token, body: { qty_picked: st ? st.allocated : 0 } });
      }
      await sb(`/rest/v1/pick_tasks?id=eq.${task.id}`, { method: "PATCH", token, body: { status: "picked", completed_at: new Date().toISOString() } });
      // Idempotent on retry: don't create a second pack_task if one already exists for this order
      const existingPackTask = await sb(`/rest/v1/pack_tasks?order_id=eq.${orderId}&select=id`, { token });
      if (!existingPackTask || existingPackTask.length === 0) {
        await sb(`/rest/v1/pack_tasks`, { method: "POST", token, body: { order_id: orderId, status: "pending", tote_id: openTote.id } });
      }
      await sb(`/rest/v1/sales_orders?id=eq.${orderId}`, { method: "PATCH", token, body: { status: "picking" } });
