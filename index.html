      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "pick_task", entity_id: task.id, user_id: profile.id, action: "completed" } });
      setCompletedOrderIds(prev => ({ ...prev, [orderId]: true }));
      const order = orders[orderId];
      showToast(`✅ Order ${order?.external_order_id || ""} — picking complete, Packing ke liye chala gaya`);
      return true;
    } catch (e) {
      const order = orders[orderId];
      showToast(`⚠ Order ${order?.external_order_id || ""} finalize failed`, "err");
      return false;
    }
  };

  // Used when a shortage was genuinely unresolvable (no alternate bin found anywhere) — the order
  // is pulled OUT of the normal picking→packing flow and marked Incomplete instead, so the Packer
  // never sees it. Admin/Warehouse Lead resolve it from the Incomplete Orders tab.
  const finalizeOrderAsIncomplete = async (orderId, lineStatus) => {
    const toteTasks = tasks.filter(t => t.tote_id === openTote.id);
    const task = toteTasks.find(t => t.order_id === orderId);
    if (!task) return true;
    if (completedOrderIds[orderId]) return true;
    try {
      const lines = taskLines[task.id] || [];
      for (const l of lines) {
        const st = lineStatus[l.id];
        await sb(`/rest/v1/pick_task_lines?id=eq.${l.id}`, { method: "PATCH", token, body: { qty_picked: st ? st.allocated : 0 } });
      }
      await sb(`/rest/v1/pick_tasks?id=eq.${task.id}`, { method: "PATCH", token, body: { status: "picked", completed_at: new Date().toISOString() } });
      await sb(`/rest/v1/sales_orders?id=eq.${orderId}`, { method: "PATCH", token, body: { status: "incomplete" } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "pick_task", entity_id: task.id, user_id: profile.id, action: "completed_with_shortage_incomplete" } });
      setCompletedOrderIds(prev => ({ ...prev, [orderId]: true }));
      const order = orders[orderId];
      showToast(`⚠ Order ${order?.external_order_id || ""} — item short, 'Incomplete' mein chala gaya (Packer ko nahi dikhega)`, "err");
      return true;
    } catch (e) {
      const order = orders[orderId];
      showToast(`⚠ Order ${order?.external_order_id || ""} finalize failed`, "err");
      return false;
    }
  };

  const pickBarcodeInputRef = useRef(null);
  const scanToteBarcode = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : barcodeInput).trim();
    setBarcodeInput("");
    if (!code) return;
    if (!navigator.onLine) {
      showToast("🔌 Aap OFFLINE hain — scanning rok di gayi hai. Internet wapas aane par dobara scan karein, kuch bhi miss nahi hoga.", "err");
      pickBarcodeInputRef.current?.focus();
      return;
    }
    const c = cleanCode(code);
    const p = Object.values(products).find(x => cleanCode(x.barcode) === c || cleanCode(x.sku) === c);
    if (!p) { showToast("Barcode/SKU match nahi hua", "err"); pickBarcodeInputRef.current?.focus(); return; }
    if (!activeGroup) { showToast("Is tote ki saari locations complete ho chuki hain", "err"); pickBarcodeInputRef.current?.focus(); return; }
    if (p.id !== activeGroup.product_id) {
      showToast(`❌ Pehle current location complete karein — Bin ${bins[activeGroup.bin_id]?.code || "?"}`, "err");
      pickBarcodeInputRef.current?.focus();
      return;
    }
    const ref = activeGroup.refs.find(r => r.allocated < r.qty_required);
    if (!ref) { showToast("Allocation error — dobara try karein", "err"); pickBarcodeInputRef.current?.focus(); return; }

    // Persist FIRST, and wait for confirmation, before updating the screen — this is what
    // guarantees "jahan tak scan ho chuka wahi se continue" is actually true after a reload.
    // A scan is only shown as counted once the server has genuinely confirmed it.
    const newAllocated = ref.allocated + 1;
    try {
      await sb(`/rest/v1/pick_task_lines?id=eq.${ref.line_id}`, { method: "PATCH", token, body: { qty_picked: newAllocated } });
    } catch (e) {
      showToast("⚠ Scan save nahi hui (network issue) — please dobara try karein. Kuch bhi record nahi hua, wapas se scan karein.", "err");
      pickBarcodeInputRef.current?.focus();
      return;
    }

    ref.allocated = newAllocated;
    activeGroup.scanned += 1;
    setConsolidated([...consolidated]);
    setLastScannedProduct(p);
    const order = orders[ref.order_id];
    setLastScanInfo({ product: p, toteBin: ref.toteBin, orderRef: order?.external_order_id });
    showToast(`✓ ${p.barcode} → Tote Bin #${ref.toteBin || "?"} (Order ${order?.external_order_id || ""})`);
    pickBarcodeInputRef.current?.focus();

    // Server-authoritative: only sets started_at if it's still NULL in the DB right now.
    // Best-effort — a failure here doesn't affect pick progress, only a display timestamp.
    const startTask = tasks.find(t => t.tote_id === openTote.id && t.order_id === ref.order_id);
    if (startTask) {
      sb(`/rest/v1/pick_tasks?id=eq.${startTask.id}&started_at=is.null`, { method: "PATCH", token, body: { started_at: new Date().toISOString() } }).catch(() => {});
    }

    // Check if THIS order's picking is now fully done — if so, send it to Packing right away
    const task = tasks.find(t => t.tote_id === openTote.id && t.order_id === ref.order_id);
    if (task) {
      const lines = taskLines[task.id] || [];
      const lineStatus = buildLineStatus();
      const orderDone = lines.length > 0 && lines.every(l => {
        const st = lineStatus[l.id];
        return st && (st.allocated >= st.qty_required || st.resolved);
      });
      if (orderDone) finalizeOrderPicking(ref.order_id, lineStatus);
    }
  };

  const allToteScanned = consolidated.length > 0 && consolidated.every(g => g.scanned >= g.required);

  const markDamaged = async (group, qtyRaw) => {
    const qty = Number(qtyRaw);
    const remaining = group.required - group.scanned;
    if (!qty || qty <= 0 || qty > remaining) { showToast(`Valid quantity enter karein (max ${remaining})`, "err"); return; }
    try {
      const invRows = await sb(`/rest/v1/inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${group.product_id}&bin_id=eq.${group.bin_id}&select=*`, { token });
      const invRow = invRows && invRows[0];
      if (invRow) {
        await sb(`/rest/v1/inventory?id=eq.${invRow.id}`, { method: "PATCH", token, body: { on_hand: Math.max(0, invRow.on_hand - qty), last_activity_type: "damage", last_activity_by: profile.id, last_activity_at: new Date().toISOString() } });
      }
      const firstOrderId = group.refs[0]?.order_id || null;
      await sb(`/rest/v1/damage_inventory`, { method: "POST", token, body: { warehouse_id: profile.warehouse_id, product_id: group.product_id, bin_id: group.bin_id, qty, found_at_stage: "picking", reported_by: profile.id, order_id: firstOrderId } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "inventory", entity_id: group.product_id, user_id: profile.id, action: "damage_marked_picking", metadata: { qty, bin_id: group.bin_id, tote_id: openTote.id } } });
      showToast(`⚠ ${qty} pcs damaged mark ho gaye — Bin ${bins[group.bin_id]?.code || "?"}`);
      setShowDamageInput(false); setDamageQtyInput("");
      await reportNotFound(group);
    } catch (e) { showToast(`Damage marking failed: ${(e.message || "").slice(0, 150)}`, "err"); }
  };

  const reportNotFound = async (group) => {
    const remaining = group.required - group.scanned;
    if (remaining <= 0) return;
    try {
      const openRefs = group.refs.filter(r => r.allocated < r.qty_required);

      // ALWAYS park the original (now-untrusted) location's qty into PNA-HOLD, tagged with who
      // reported it — the picker moving to a different bin doesn't make the original discrepancy
      // go away; Warehouse Lead still needs to verify/trace it separately.
      let pnaParked = false;
      const pnaBinRows = await sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&code=eq.PNA-HOLD&select=*`, { token });
      const pnaBin = pnaBinRows && pnaBinRows[0];
      if (pnaBin) {
        await addOnHand(token, profile.warehouse_id, group.product_id, group.bin_id, -remaining, { type: "not_found_pna", userId: profile.id });

        await addOnHand(token, profile.warehouse_id, group.product_id, pnaBin.id, remaining, { type: "not_found_pna", userId: profile.id });

        await sb(`/rest/v1/pna_records`, { method: "POST", token, body: { product_id: group.product_id, original_bin_id: group.bin_id, qty: remaining, order_id: openRefs[0]?.order_id || null, reported_by: profile.id, status: "pending" } });
        pnaParked = true;
      }

      const altRows = await sb(`/rest/v1/inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${group.product_id}&bin_id=neq.${group.bin_id}&on_hand=gt.0&select=*`, { token });
      const alt = (altRows || []).filter(r => r.bin_id !== pnaBin?.id).sort((a, b) => b.on_hand - a.on_hand)[0];

      if (alt) {
        const existingIdx = consolidated.findIndex(g2 => g2.bin_id === alt.bin_id && g2.product_id === group.product_id);
        if (existingIdx >= 0) {
          consolidated[existingIdx].required += remaining;
          consolidated[existingIdx].refs = [...consolidated[existingIdx].refs, ...openRefs];
        } else {
          consolidated.push({ bin_id: alt.bin_id, product_id: group.product_id, required: remaining, scanned: 0, refs: openRefs.map(r => ({ ...r })) });
        }
        group.required = group.scanned; // close out this location — job continues from the alternate bin
        setConsolidated([...consolidated]);

        // Auto-correct the same product's location for every pending pick_task_line that still
        // points to the old (empty/wrong) bin — including this group's own, so the correction is
        // also reflected in the database (not just in-memory), and every OTHER queued order needing
        // this product won't hit the same "not found" surprise later.
        let correctedCount = 0;
        try {
          const staleLines = await sb(`/rest/v1/pick_task_lines?product_id=eq.${group.product_id}&bin_id=eq.${group.bin_id}&qty_picked=eq.0&select=id`, { token });
          for (const l of staleLines || []) {
            await sb(`/rest/v1/pick_task_lines?id=eq.${l.id}`, { method: "PATCH", token, body: { bin_id: alt.bin_id } });
          }
          correctedCount = (staleLines || []).length;
        } catch (e) { /* best-effort correction — the current pick still succeeds even if this fails */ }

        showToast(pnaParked
          ? `📍 Doosri location mil gayi (Bin ${bins[alt.bin_id]?.code || "?"}) se pick karein — original location ka discrepancy PNA-HOLD mein park ho gaya, ${profile.full_name} ke naam se${correctedCount > 0 ? ` · ${correctedCount} pending line(s) ki location bhi auto-update ho gayi` : ""}`
          : `📍 Doosri location mil gayi — Bin ${bins[alt.bin_id]?.code || "?"} se pick karein${correctedCount > 0 ? ` · ${correctedCount} pending line(s) ki location bhi auto-update ho gayi` : ""}`);
      } else {
        const affectedOrders = new Set();
        for (const ref of openRefs) {
          const short = ref.qty_required - ref.allocated;
          if (short > 0) {
            await sb(`/rest/v1/order_shortage_lines`, { method: "POST", token, body: { order_id: ref.order_id, product_id: group.product_id, qty_required: ref.qty_required, qty_available: ref.allocated, not_available_qty: short } });
            await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: ref.order_id, user_id: profile.id, action: "pick_shortage_reported" } });
            affectedOrders.add(ref.order_id);
          }
        }
        group.required = group.scanned; // let this location's shortfall resolve without blocking
        setConsolidated([...consolidated]);
        showToast(pnaParked
          ? `⚠ Koi aur location nahi mili — order 'Incomplete' mein chala jayega, ${remaining} pcs PNA-HOLD mein park ho gaye ${profile.full_name} ke naam se`
          : "⚠ Koi aur location nahi mili — lekin PNA-HOLD bin set up nahi hai, Admin ko batayein", "err");
        // Shortage-affected orders are pulled OUT of the normal flow entirely — marked Incomplete,
        // never sent to Packing — as soon as every line on that order has been resolved one way or another.
        const lineStatus = buildLineStatus();
        for (const orderId of affectedOrders) {
          const task = tasks.find(t => t.tote_id === openTote.id && t.order_id === orderId);
          if (!task) continue;
          const lines = taskLines[task.id] || [];
          const orderDone = lines.length > 0 && lines.every(l => {
            const st = lineStatus[l.id];
            return st && (st.allocated >= st.qty_required || st.resolved);
          });
          if (orderDone) finalizeOrderAsIncomplete(orderId, lineStatus);
        }
      }
    } catch (e) { showToast("Report failed", "err"); }
  };

  const completeTotePicking = async () => {
    try {
      const lineStatus = buildLineStatus();
      const toteTasks = tasks.filter(t => t.tote_id === openTote.id);
      const failedOrders = [];
      for (const t of toteTasks) {
        if (completedOrderIds[t.order_id]) continue; // already finalized as it completed early
        const ok = await finalizeOrderPicking(t.order_id, lineStatus);
        if (ok === false) failedOrders.push(orders[t.order_id]?.external_order_id || t.order_id);
      }
      if (failedOrders.length > 0) {
        showToast(`⚠ ${failedOrders.length} order(s) finalize NAHI ho paye (${failedOrders.join(", ")}) — dobara "Complete tote picking" try karein, ya Admin ko batayein`, "err");
        return; // don't close out the tote — keep it actionable until these are resolved
      }
      await sb(`/rest/v1/totes?id=eq.${openTote.id}`, { method: "PATCH", token, body: { status: "picked", completed_at: new Date().toISOString() } });
      showToast("Tote fully picked — ready for packer");
      setOpenTote(null); load();
    } catch (e) { showToast("Failed to complete", "err"); }
  };

  if (openTote) {
    const toteTasks = tasks.filter(t => t.tote_id === openTote.id);
    const totalSku = consolidated.length;
    const totalQty = consolidated.reduce((s, g) => s + g.required, 0);
    const pickedQty = consolidated.reduce((s, g) => s + g.scanned, 0);
    const startTime = toteTasks.reduce((min, t) => (t.assigned_at && (!min || t.assigned_at < min)) ? t.assigned_at : min, null);
    return (
      <div>
        <SectionTitle title={`${openTote.tote_number} — Picking Job`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenTote(null)}>← Back</button>} />

        <div style={S.panel}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 12 }}>
            <div><div style={S.label}>TROLLEY/TOTE</div><div style={{ color: "#2B2620", fontFamily: "'IBM Plex Mono', monospace", fontSize: 14 }}>{openTote.tote_number}</div></div>
            <div><div style={S.label}>ORDERS</div><div style={{ color: "#2B2620", fontSize: 14, fontWeight: 700 }}>{toteTasks.length}</div></div>
            <div><div style={S.label}>TOTAL SKU</div><div style={{ color: "#2B2620", fontSize: 14, fontWeight: 700 }}>{totalSku}</div></div>
            <div><div style={S.label}>TOTAL QTY</div><div style={{ color: "#2B2620", fontSize: 14, fontWeight: 700 }}>{totalQty}</div></div>
            <div><div style={S.label}>PICKED QTY</div><div style={{ color: "#4CAF7D", fontSize: 14, fontWeight: 700 }}>{pickedQty}</div></div>
            <div><div style={S.label}>START TIME</div><div style={{ color: "#6B6355", fontSize: 12, fontFamily: "'IBM Plex Mono', monospace" }}>{startTime ? fmtTime(startTime) : "—"}</div></div>
            <div><div style={S.label}>STATUS</div><span style={{ ...S.badgeSm, color: "#5B9EE8", borderColor: "#5B9EE8" }}>{openTote.status}</span></div>
          </div>
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <button onClick={() => setPickViewMode("location")} style={{ ...S.pill, ...(pickViewMode === "location" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>📍 By Location</button>
          <button onClick={() => setPickViewMode("order")} style={{ ...S.pill, ...(pickViewMode === "order" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>🧾 By Order</button>
        </div>

        <div style={S.panel}>
          <div style={S.panelTitle}>Scan product — the system will guide you through the sequence</div>
          <div style={{ display: "flex", gap: 10 }}>
            <input autoFocus ref={pickBarcodeInputRef} style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type barcode / SKU, then Enter"
              value={barcodeInput} onChange={e => setBarcodeInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && scanToteBarcode()} />
            <CameraScanButton onScan={(text) => scanToteBarcode(text)} />
            <button style={S.primaryBtnSm} onClick={() => scanToteBarcode()}>Scan</button>
          </div>
        </div>

        {activeGroup ? (
          <div style={{ ...S.panel, borderColor: "#F5A623", borderWidth: 2 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={S.panelTitle}>📍 CURRENT STOP</div>
              <span style={{ ...S.badgeSm, color: "#5B9EE8", borderColor: "#5B9EE8" }}>Stop {consolidated.filter(g => g.scanned >= g.required).length + 1} / {consolidated.length}</span>
            </div>
            <div style={{ display: "flex", gap: 16, alignItems: "center", flexWrap: "wrap" }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 32, fontWeight: 700, color: "#F5A623" }}>{bins[activeGroup.bin_id]?.code || "no bin!"}</div>
              {products[activeGroup.product_id]?.image_url ? (
                <ZoomableImage src={products[activeGroup.product_id].image_url} alt="" style={{ width: 64, height: 64, objectFit: "cover", borderRadius: 8, border: "1px solid #E0D8C5", flexShrink: 0 }} />
              ) : (
                <div style={{ width: 64, height: 64, borderRadius: 8, border: "1px dashed #E0D8C5", display: "flex", alignItems: "center", justifyContent: "center", color: "#8A8272", fontSize: 18, flexShrink: 0 }}>📦</div>
              )}
              <div style={{ flex: 1, minWidth: 140 }}>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 13 }}>{products[activeGroup.product_id]?.barcode}</div>
                <div style={{ color: "#2B2620", fontSize: 14 }}>{products[activeGroup.product_id]?.name}</div>
              </div>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, fontWeight: 700, color: "#4CAF7D" }}>{activeGroup.scanned} / {activeGroup.required}</div>
            </div>
            {nextRef && (
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 14, padding: "10px 14px", background: "#FFF7E8", borderRadius: 8, border: "1px dashed #F5A623" }}>
                <span style={{ color: "#6B6355", fontSize: 12 }}>Scan karte hi rakhna hai → Order {nextOrder?.external_order_id}</span>
                <div style={{ textAlign: "right" }}>
                  <div style={{ color: "#8A8272", fontSize: 9, letterSpacing: 1 }}>TOTE BIN</div>
                  <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, color: "#A6472F" }}>#{nextRef.toteBin || "?"}</div>
                </div>
              </div>
            )}
            <div style={{ display: "flex", gap: 10, marginTop: 12, flexWrap: "wrap" }}>
              <button style={{ ...S.secondaryBtnSm, color: "#E5484D", borderColor: "#E5484D" }} onClick={() => reportNotFound(activeGroup)}>❌ Mark PNA (yahan nahi mila)</button>
              <button style={{ ...S.secondaryBtnSm, color: "#B084F5", borderColor: "#B084F5" }} onClick={() => setShowDamageInput(s => !s)}>⚠ Mark Damaged</button>
            </div>
            {showDamageInput && (
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <input type="number" min={1} max={activeGroup.required - activeGroup.scanned} style={{ ...S.input, width: 140 }} placeholder={`Qty (max ${activeGroup.required - activeGroup.scanned})`} value={damageQtyInput} onChange={e => setDamageQtyInput(e.target.value)} />
                <button style={{ ...S.secondaryBtnSm, color: "#B084F5", borderColor: "#B084F5" }} onClick={() => markDamaged(activeGroup, damageQtyInput)}>Confirm Damage</button>
              </div>
            )}
          </div>
        ) : consolidated.length > 0 && (
          <div style={{ ...S.panel, borderColor: "#4CAF7D" }}>
            <div style={{ color: "#4CAF7D", fontSize: 15, fontFamily: "'Space Grotesk', sans-serif" }}>✅ Saari locations complete — neeche "Complete tote picking" dabayein</div>
          </div>
        )}

        {lastScanInfo && (
          <div style={{ ...S.panel, display: "flex", gap: 16, alignItems: "center", padding: 14, borderColor: "#4CAF7D", borderWidth: 2, background: "#F0F9F4" }}>
            {lastScanInfo.product.image_url ? (
              <ZoomableImage src={lastScanInfo.product.image_url} alt="" style={{ width: 56, height: 56, objectFit: "cover", borderRadius: 8, border: "1px solid #E0D8C5", flexShrink: 0 }} />
            ) : (
              <div style={{ width: 56, height: 56, borderRadius: 8, border: "1px dashed #E0D8C5", display: "flex", alignItems: "center", justifyContent: "center", color: "#8A8272", fontSize: 18, flexShrink: 0 }}>📦</div>
            )}
            <div style={{ flex: 1, minWidth: 140 }}>
              <div style={{ color: "#6B6355", fontSize: 10, letterSpacing: 1 }}>✓ SCANNED — YAHAN RAKHEIN</div>
              <div style={{ color: "#2B2620", fontSize: 13, marginTop: 2 }}>{lastScanInfo.product.barcode} — {lastScanInfo.product.name}</div>
              <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>Order {lastScanInfo.orderRef}</div>
            </div>
            <div style={{ textAlign: "center" }}>
              <div style={{ color: "#6B6355", fontSize: 10, letterSpacing: 1 }}>TOTE BIN</div>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 34, fontWeight: 700, color: "#4CAF7D" }}>#{lastScanInfo.toteBin || "?"}</div>
            </div>
          </div>
        )}
        {pickViewMode === "order" ? (
          <div style={S.panel}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
              <div style={S.panelTitle}>Tote allocation — order-wise (Bin 01 → Bin {toteTasks.length})</div>
            </div>
            <table>
              <thead><tr><th style={S.th}>Bin</th><th style={S.th}>Order #</th><th style={S.th}>Courier</th><th style={S.th}>SKU Qty</th><th style={S.th}>Picked Qty</th><th style={S.th}>Status</th></tr></thead>
              <tbody>
                {[...toteTasks].sort((a, b) => (a.tote_bin_number || 99) - (b.tote_bin_number || 99)).map(t => {
                  const o = orders[t.order_id];
                  const lines = taskLines[t.id] || [];
                  const required = lines.reduce((s, l) => s + l.qty_required, 0);
                  const picked = lines.reduce((s, l) => {
                    const g = consolidated.find(gr => gr.product_id === l.product_id);
                    const ref = g?.refs.find(r => r.line_id === l.id);
                    return s + (ref?.allocated || 0);
                  }, 0);
                  const status = picked >= required && required > 0 ? "Completed" : picked > 0 ? "Partial" : "Pending";
                  const statusColor = status === "Completed" ? "#4CAF7D" : status === "Partial" ? "#F5A623" : "#6B6355";
                  return (
                    <tr key={t.id}>
                      <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{String(t.tote_bin_number || "?").padStart(2, "0")}</td>
                      <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace" }}>{o?.external_order_id || "—"}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{o?.courier || "—"}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{required}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{picked}</td>
                      <td style={S.td}><span style={{ ...S.badgeSm, color: statusColor, borderColor: statusColor }}>{status}</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        ) : (
        <div style={S.panel}>
          <div style={S.panelTitle}>Pending to pick (route order)</div>
          {consolidated.filter(g => g.scanned < g.required).map((g, i) => {
            const p = products[g.product_id];
            const bin = bins[g.bin_id];
            const isActive = activeGroup === g;
            return (
              <div key={i} style={{ padding: "8px 0", borderBottom: "1px solid #EFE8D8", opacity: isActive ? 1 : 0.45 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                  <span style={{ width: 20 }}>{isActive ? "📍" : "🔒"}</span>
                  <span style={{ color: isActive ? "#F5A623" : "#5B9EE8", fontFamily: "'IBM Plex Mono', monospace", width: 90, fontWeight: isActive ? 700 : 400 }}>{bin?.code || "no bin!"}</span>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", width: 100 }}>{p?.barcode}</span>
                  <span style={{ flex: 1, color: "#2B2620", fontSize: 13 }}>{p?.name}</span>
                  <span style={{ ...S.badgeSm, color: "#6B6355", borderColor: "#E0D8C5" }}>{g.scanned} / {g.required}</span>
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 4, paddingLeft: 118 }}>
                  {g.refs.filter(r => r.allocated < r.qty_required).map((r, j) => (
                    <span key={j} style={{ fontSize: 10, color: "#8A8272", fontFamily: "'IBM Plex Mono', monospace" }}>
                      Bin#{r.toteBin || "?"}: {r.allocated}/{r.qty_required}
                    </span>
                  ))}
                </div>
              </div>
            );
          })}
          {consolidated.filter(g => g.scanned < g.required).length === 0 && <EmptyNote text="All locations are complete — press 'Complete tote picking'." />}
        </div>
        )}
        {allToteScanned && consolidated.length > 0 && (
          <button style={{ ...S.primaryBtnSm, marginTop: 4, marginBottom: 16 }} onClick={completeTotePicking}>✓ Complete tote picking — send to packer</button>
        )}
      </div>
    );
  }

  const myTotes = totes.filter(t => t.assigned_to === profile.id && t.status === "picking");

  return (
    <div>
      <SectionTitle title="My totes" />
      <div style={S.cardGrid}>
        {myTotes.map(tt => {
          const toteTasks = tasks.filter(t => t.tote_id === tt.id);
          const pickedCount = toteTasks.filter(t => t.status === "picked").length;
          return (
            <div key={tt.id} style={S.card} onClick={() => openToteDetail(tt)}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span>🧺</span>
                <span style={{ ...S.badgeSm, color: "#5B9EE8", borderColor: "#5B9EE8" }}>{tt.status}</span>
              </div>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 15, marginTop: 10 }}>{tt.tote_number}</div>
              <div style={{ color: "#6B6355", fontSize: 12, marginTop: 4 }}>{pickedCount} / {toteTasks.length} orders picked</div>
            </div>
          );
        })}
        {myTotes.length === 0 && <EmptyNote text="No tote has been assigned." />}
      </div>

      {canBatch && (() => {
        const pickingTotes = totes.filter(t => t.status === "picking");
        const rows = pickingTotes.map(tt => {
          const remainingTasks = tasks.filter(t => t.tote_id === tt.id);
          const anyStarted = remainingTasks.some(t => t.started_at);
          return { tote: tt, remaining: remainingTasks.length, status: anyStarted ? "In Process" : "Queued" };
        });
        return (
          <>
            <SectionTitle title="Trolleys — Queued vs In Process" action={<span style={{ color: "#8A8272", fontSize: 10 }}>Live status — 15s auto-refresh</span>} />
            <div style={S.panel}>
              {rows.length === 0 ? <EmptyNote text="No trolley currently assigned for picking." /> : (
                <table>
                  <thead><tr><th style={S.th}>Trolley</th><th style={S.th}>Assigned Picker</th><th style={S.th}>Orders Remaining</th><th style={S.th}>Status</th><th style={S.th}></th></tr></thead>
                  <tbody>
                    {rows.map(r => (
                      <tr key={r.tote.id} style={{ cursor: "pointer" }} onClick={() => openToteDetail(r.tote)}>
                        <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{r.tote.tote_number}</td>
                        <td style={S.td}>{pickers.find(p => p.id === r.tote.assigned_to)?.full_name || "—"}</td>
                        <td style={{ ...S.td, color: "#6B6355" }}>{r.remaining}</td>
                        <td style={S.td}>
                          {r.status === "In Process"
                            ? <span style={{ ...S.badgeSm, color: "#4CAF7D", borderColor: "#4CAF7D" }}>🟢 In Process</span>
                            : <span style={{ ...S.badgeSm, color: "#8A8272", borderColor: "#8A8272" }}>⏳ Queued</span>}
                        </td>
                        <td style={S.td}><button style={S.secondaryBtnSm} onClick={(e) => { e.stopPropagation(); openToteDetail(r.tote); }}>Open</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </>
        );
      })()}

      {canBatch && (
        <>
          <SectionTitle title={`Create picking batch (Tote) — ${selectedCount}/15 selected`} />
          {pickers.length === 0 && (
            <div style={{ ...S.panel, borderColor: "#7A551A" }}>
              <div style={{ color: "#F5A623", fontSize: 12 }}>⚠ No picker/packer profile found in this warehouse. Admin needs to create an account from the Users tab.</div>
            </div>
          )}
          <div style={S.panel}>
            {availableTotes.length === 0 && (
              <div style={{ color: "#E5484D", fontSize: 12, marginBottom: 10 }}>⚠ No available tote — all totes are in use, or Admin has not seeded the tote master yet.</div>
            )}
            <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
              <button onClick={() => { setPickBatchSkuFilter("all"); setSelectedForTote({}); }} style={{ ...S.pill, ...(pickBatchSkuFilter === "all" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>All ({queuedTasks.length})</button>
              <button onClick={() => {
                setPickBatchSkuFilter("single");
                setSelectedForTote(Object.fromEntries(queuedTasks.filter(t => taskSkuType(t) === "single").map(t => [t.id, true])));
              }} style={{ ...S.pill, ...(pickBatchSkuFilter === "single" ? { background: "#4CAF7D", color: "#1A1206", borderColor: "#4CAF7D" } : {}) }}>Single-SKU ({singleSkuCount})</button>
              <button onClick={() => {
                setPickBatchSkuFilter("multi");
                setSelectedForTote(Object.fromEntries(queuedTasks.filter(t => taskSkuType(t) === "multi").map(t => [t.id, true])));
              }} style={{ ...S.pill, ...(pickBatchSkuFilter === "multi" ? { background: "#5B9EE8", color: "#1A1206", borderColor: "#5B9EE8" } : {}) }}>Multi-SKU ({multiSkuCount})</button>
            </div>
            <div style={{ color: "#8A8272", fontSize: 11, marginBottom: 12 }}>Clicking Single-SKU or Multi-SKU auto-selects all matching orders — ready to assign in one go.</div>
            <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 12 }}>
              <select style={{ ...S.input, minWidth: 140, fontFamily: "'IBM Plex Mono', monospace" }} value={selectedToteId} onChange={e => setSelectedToteId(e.target.value)}>
                <option value="">🧺 Select tote…</option>
                {availableTotes.map(t => <option key={t.id} value={t.id}>{t.tote_number}</option>)}
              </select>
              <select style={{ ...S.input, minWidth: 180 }} value={toteAssignPicker} onChange={e => setToteAssignPicker(e.target.value)}>
                <option value="">Assign to…</option>
                {pickers.map(p => <option key={p.id} value={p.id}>{p.full_name} ({p.role})</option>)}
              </select>
              <button style={S.primaryBtnSm} onClick={createTote} disabled={selectedCount === 0}>Assign tote</button>
            </div>
            {lastAssignedTote && (
              <div style={{ background: "#FFF9EE", border: "1px solid #F5A623", borderRadius: 8, padding: 12, marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
                  <div>
                    <div style={{ fontWeight: 700, color: "#2B2620" }}>✅ Tote {lastAssignedTote.toteNumber} assign ho gayi — {lastAssignedTote.orders.length} orders</div>
                    <div style={{ color: "#6B6355", fontSize: 12, marginTop: 2 }}>AWB labels Sales Orders tab se fetch/print karein.</div>
                  </div>
                  <button style={S.secondaryBtnSm} onClick={() => setLastAssignedTote(null)}>Dismiss</button>
                </div>
              </div>
            )}
            <table>
              <thead><tr><th style={S.th}></th><th style={S.th}>Order #</th><th style={S.th}>Courier</th><th style={S.th}>Items</th><th style={S.th}>Type</th></tr></thead>
              <tbody>
                {filteredQueuedTasks.map(t => {
                  const o = orders[t.order_id];
                  return (
                    <tr key={t.id}>
                      <td style={S.td}><input type="checkbox" checked={!!selectedForTote[t.id]} onChange={e => setSelectedForTote({ ...selectedForTote, [t.id]: e.target.checked })} /></td>
                      <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{o?.external_order_id}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{o?.courier}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{(taskLines[t.id] || []).length}</td>
                      <td style={S.td}>
                        {taskSkuType(t) === "single"
                          ? <span style={{ ...S.badgeSm, color: "#4CAF7D", borderColor: "#4CAF7D" }}>Single-SKU</span>
                          : <span style={{ ...S.badgeSm, color: "#5B9EE8", borderColor: "#5B9EE8" }}>Multi-SKU</span>}
                      </td>
                    </tr>
                  );
                })}
                {filteredQueuedTasks.length === 0 && <tr><td colSpan={5}><EmptyNote text="No queued orders." /></td></tr>}
              </tbody>
            </table>
          </div>
        </>
      )}
    </div>
  );
}

/* ================= PACKING ================= */
function PackingView({ token, profile, showToast }) {
  const [tasks, setTasks] = useState([]);
  const [orders, setOrders] = useState({});
  const [products, setProducts] = useState({});
  const [totes, setTotes] = useState([]);
  const [openTote, setOpenTote] = useState(null);
  const [openTask, setOpenTask] = useState(null);
  const [lastScannedProduct, setLastScannedProduct] = useState(null);
  const [requiredLines, setRequiredLines] = useState([]);
  const [scans, setScans] = useState({});
  const [barcodeInput, setBarcodeInput] = useState("");
  const [orderScanInput, setOrderScanInput] = useState("");
  const [toteScanInput, setToteScanInput] = useState("");
  const [binNumMap, setBinNumMap] = useState({});
  const [bins, setBins] = useState([]);
  const [showDamageInput, setShowDamageInput] = useState(false);
  const [damageQty, setDamageQty] = useState("");
  const [damageBinId, setDamageBinId] = useState("");
  const [replacementOffer, setReplacementOffer] = useState(null); // { productId, product, qty, binId, binCode, orderId, restoredQty }
  const [staff, setStaff] = useState([]);
  const [viewOnly, setViewOnly] = useState(false);
  const canAssign = ["admin", "warehouse_lead", "supervisor"].includes(profile.role);
  const packers = staff.filter(s => s.role === "packer");

  const assignToteToPacker = async (toteId, packerId) => {
    if (!packerId) return;
    try {
      await sb(`/rest/v1/totes?id=eq.${toteId}`, { method: "PATCH", token, body: { locked_by: packerId } });
      const tote = totes.find(t => t.id === toteId);
      const packer = staff.find(s => s.id === packerId);
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "tote", entity_id: toteId, user_id: profile.id, action: "assigned_to_packer", metadata: { packer_id: packerId } } });
      showToast(`${tote?.tote_number || "Tote"} → ${packer?.full_name || "Packer"} ko assign ho gayi`);
      load();
    } catch (e) { showToast("Assign failed", "err"); }
  };

  const load = useCallback(async () => {
    try {
      const [t, o, tt, b, s] = await Promise.all([
        sb(`/rest/v1/pack_tasks?status=eq.pending&select=*&order=id.asc`, { token }),
        sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/totes?warehouse_id=eq.${profile.warehouse_id}&status=eq.picked&select=*`, { token }),
        sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/profiles?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token })
      ]);
      setStaff(s || []);
      setTasks(t || []);
      setOrders(Object.fromEntries((o || []).map(x => [x.id, x])));
      setTotes(tt || []);
      setBins(b || []);
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    if (openTote || openTask) return; // don't poll while actively packing — avoid disrupting scan flow
    const interval = setInterval(load, 15000);
    return () => clearInterval(interval);
  }, [load, openTote, openTask]);
  useEffect(() => {
    window.addEventListener("app-reconnect", load);
    return () => window.removeEventListener("app-reconnect", load);
  }, [load]);

  const openPack = async (task) => {
    const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${task.order_id}&select=*`, { token });
    setRequiredLines(lines || []);
    const newProducts = await fetchProductsByIds(token, (lines || []).map(l => l.product_id));
    setProducts(prev => ({ ...prev, ...newProducts }));
    let restoredScans = {};
    if (task.scans) {
      try { restoredScans = JSON.parse(task.scans); } catch (e) {}
    }
    setScans(restoredScans);
    setLastScannedProduct(null);
    setOpenTask(task);
    if (Object.keys(restoredScans).length > 0) {
      showToast("Pichli progress restore ho gayi — wahin se continue karein");
    }
  };

  const openByOrderNumber = (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : orderScanInput).trim();
    setOrderScanInput("");
    if (!code) return;
    const order = Object.values(orders).find(o => o.external_order_id === code);
    if (!order) { showToast("Order number nahi mila", "err"); return; }
    const task = tasks.find(t => t.order_id === order.id);
    if (!task) { showToast("Yeh order abhi packing ke liye ready nahi hai", "err"); return; }
    openPack(task);
  };

  const scanTote = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : toteScanInput).trim();
    setToteScanInput("");
    if (!code) return;
    const tote = totes.find(t => t.tote_number === code);
    if (!tote) { showToast("Tote nahi mila ya abhi picking complete nahi hui", "err"); return; }
    try {
      const fresh = await sb(`/rest/v1/totes?id=eq.${tote.id}&select=*`, { token });
      const row = fresh && fresh[0];
      if (!row) { showToast("Tote nahi mila", "err"); return; }
      const isPacker = profile.role === "packer";

      if (!isPacker) {
        // Admin / Warehouse Lead / Supervisor: view-only monitoring — never claims or changes the lock,
        // so the actual packer's assignment is never disturbed just by someone checking progress.
        const pickTasks = await sb(`/rest/v1/pick_tasks?tote_id=eq.${tote.id}&select=order_id,tote_bin_number`, { token });
        setBinNumMap(Object.fromEntries((pickTasks || []).map(pt => [pt.order_id, pt.tote_bin_number])));
        setOpenTote(row);
        setViewOnly(true);
        return;
      }

      if (!row.locked_by) {
        showToast("Yeh tote abhi tak kisi packer ko assign nahi hui — Warehouse Lead/Admin se assign karwayein", "err");
        return;
      }
      if (row.locked_by !== profile.id) {
        showToast("Yeh tote kisi aur packer ko assign hui hai", "err");
        return;
      }
      const pickTasks = await sb(`/rest/v1/pick_tasks?tote_id=eq.${tote.id}&select=order_id,tote_bin_number`, { token });
      setBinNumMap(Object.fromEntries((pickTasks || []).map(pt => [pt.order_id, pt.tote_bin_number])));
      setOpenTote({ ...row, locked_by: profile.id });
      setViewOnly(false);
    } catch (e) { showToast("Tote open nahi ho saki", "err"); }
  };

  const markPackDamaged = async () => {
    if (!lastScannedProduct) { showToast("Pehle product scan karein jise damaged mark karna hai", "err"); return; }
    const qty = Number(damageQty);
    if (!qty || qty <= 0) { showToast("Valid quantity enter karein", "err"); return; }
    const dmgBin = bins.find(b => (b.code || "").toLowerCase() === damageBinId.trim().toLowerCase());
    if (!dmgBin) { showToast("Sahi damage bin code likhein (jo list mein maujood ho)", "err"); return; }
    const line = requiredLines.find(l => l.product_id === lastScannedProduct.id);
    if (!line) { showToast("Yeh product is order mein nahi hai", "err"); return; }
    try {
      const invRows = await sb(`/rest/v1/inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${lastScannedProduct.id}&select=*&order=on_hand.desc&limit=1`, { token });
      const invRow = invRows && invRows[0];
      if (invRow) {
        await sb(`/rest/v1/inventory?id=eq.${invRow.id}`, { method: "PATCH", token, body: { on_hand: Math.max(0, invRow.on_hand - qty), last_activity_type: "damage", last_activity_by: profile.id, last_activity_at: new Date().toISOString() } });
      }
      await sb(`/rest/v1/damage_inventory`, { method: "POST", token, body: { warehouse_id: profile.warehouse_id, product_id: lastScannedProduct.id, bin_id: dmgBin.id, qty, found_at_stage: "packing", reported_by: profile.id, order_id: openTask.order_id } });
      await adjustReserved(token, profile.warehouse_id, lastScannedProduct.id, -qty);
      await sb(`/rest/v1/order_shortage_lines`, { method: "POST", token, body: { order_id: openTask.order_id, product_id: lastScannedProduct.id, qty_required: line.qty, qty_available: Math.max(0, line.qty - qty), not_available_qty: qty } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: openTask.order_id, user_id: profile.id, action: "damage_marked_packing", metadata: { product_id: lastScannedProduct.id, qty, bin_id: dmgBin.id } } });
      const newRequired = Math.max(scans[lastScannedProduct.id] || 0, line.qty - qty);
      setRequiredLines(prev => prev.map(l => l.product_id === lastScannedProduct.id ? { ...l, qty: newRequired } : l));
      setShowDamageInput(false); setDamageQty(""); setDamageBinId("");

      // Damage-marking above already shrinks this order's requirement so it can still ship —
      // but check if a replacement unit exists anywhere else in the warehouse first, so the
      // packer can bring that instead and ship the order COMPLETE rather than short.
      const replRows = await sb(`/rest/v1/inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${lastScannedProduct.id}&bin_id=not.is.null&on_hand=gt.0&select=*&order=on_hand.desc&limit=1`, { token });
      const replRow = replRows && replRows[0] && replRows[0].bin_id !== dmgBin.id ? replRows[0] : null;
      if (replRow) {
        const replBinRows = await sb(`/rest/v1/bins?id=eq.${replRow.bin_id}&select=code`, { token });
        const replCode = replBinRows?.[0]?.code;
        if (replCode) {
          setReplacementOffer({ productId: lastScannedProduct.id, product: lastScannedProduct, qty, binId: replRow.bin_id, binCode: replCode, orderId: openTask.order_id, restoredQty: line.qty });
          showToast(`⚠ ${qty} pcs damaged — replacement Bin ${replCode} mein available hai`);
        } else {
          showToast(`⚠ ${qty} pcs damaged mark ho gaye — order ki required qty adjust ho gayi (koi replacement stock available nahi)`);
        }
      } else {
        showToast(`⚠ ${qty} pcs damaged mark ho gaye — order ki required qty adjust ho gayi (koi replacement stock available nahi)`);
      }
    } catch (e) { showToast(`Damage marking failed: ${(e.message || "").slice(0, 150)}`, "err"); }
  };

  const confirmReplacement = async () => {
    if (!replacementOffer) return;
    try {
      await addOnHand(token, profile.warehouse_id, replacementOffer.productId, replacementOffer.binId, -replacementOffer.qty, { type: "damage_replacement", userId: profile.id });
      await adjustReserved(token, profile.warehouse_id, replacementOffer.productId, replacementOffer.qty);
      setRequiredLines(prev => prev.map(l => l.product_id === replacementOffer.productId ? { ...l, qty: replacementOffer.restoredQty } : l));
      const shortRows = await sb(`/rest/v1/order_shortage_lines?order_id=eq.${replacementOffer.orderId}&product_id=eq.${replacementOffer.productId}&select=id`, { token });
      for (const s of shortRows || []) await sb(`/rest/v1/order_shortage_lines?id=eq.${s.id}`, { method: "DELETE", token });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: replacementOffer.orderId, user_id: profile.id, action: "damage_replacement_used", metadata: { product_id: replacementOffer.productId, qty: replacementOffer.qty, bin_id: replacementOffer.binId } } });
      showToast(`✓ Replacement le liya (Bin ${replacementOffer.binCode}) — order ab poora ship hoga`);
      setReplacementOffer(null);
    } catch (e) { showToast(`Replacement fail: ${(e.message || "").slice(0, 150)}`, "err"); }
  };

  const packBarcodeInputRef = useRef(null);
  const scanBarcode = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : barcodeInput).trim();
    setBarcodeInput("");
    if (!code) return;
    const c = cleanCode(code);
    const p = Object.values(products).find(x => cleanCode(x.barcode) === c || cleanCode(x.sku) === c);
    if (!p) { showToast("Barcode/SKU match nahi hua — is order ka nahi hai", "err"); packBarcodeInputRef.current?.focus(); return; }
    const line = requiredLines.find(l => l.product_id === p.id);
    if (!line) { showToast("Yeh product is order mein nahi hai — WRONG ITEM", "err"); packBarcodeInputRef.current?.focus(); return; }
    const current = scans[p.id] || 0;
    if (current >= line.qty) { showToast("Is product ki required qty already scan ho chuki", "err"); packBarcodeInputRef.current?.focus(); return; }
    const newScans = { ...scans, [p.id]: current + 1 };
    setScans(newScans);
    setLastScannedProduct(p);
    showToast(`Scanned: ${p.barcode}`);
    packBarcodeInputRef.current?.focus();
    try {
      await sb(`/rest/v1/pack_tasks?id=eq.${openTask.id}`, { method: "PATCH", token, body: { scans: JSON.stringify(newScans) } });
      // Server-authoritative: only sets started_at if it's still NULL in the DB right now —
      // avoids relying on possibly-stale local state to decide "is this the first scan".
      sb(`/rest/v1/pack_tasks?id=eq.${openTask.id}&started_at=is.null`, { method: "PATCH", token, body: { started_at: new Date().toISOString() } }).catch(() => {});
    } catch (e) { /* progress still visible locally even if this save fails */ }
  };

  const allScanned = requiredLines.length > 0 && requiredLines.every(l => (scans[l.product_id] || 0) >= l.qty);

  const completePacking = async () => {
    const order = orders[openTask.order_id];
    const labelNumber = `LBL-${order.external_order_id}-${Date.now().toString().slice(-5)}`;
    await sb(`/rest/v1/pack_tasks?id=eq.${openTask.id}`, {
      method: "PATCH", token,
      body: { status: "labeled", scans: JSON.stringify(scans), label_number: labelNumber, assigned_to: profile.id, completed_at: new Date().toISOString() }
    });
    await sb(`/rest/v1/sales_orders?id=eq.${openTask.order_id}`, { method: "PATCH", token, body: { status: "rtd" } });
    await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "pack_task", entity_id: openTask.id, user_id: profile.id, action: "labeled", metadata: { label_number: labelNumber } } });
    showToast(`Packed & labeled: ${labelNumber}`);

    if (openTask.tote_id) {
      const remaining = await sb(`/rest/v1/pack_tasks?tote_id=eq.${openTask.tote_id}&status=eq.pending&select=*`, { token });
      if (!remaining || remaining.length === 0) {
        await sb(`/rest/v1/totes?id=eq.${openTask.tote_id}`, { method: "PATCH", token, body: { status: "open", assigned_to: null, locked_by: null, completed_at: new Date().toISOString() } });
        showToast("Tote fully packed — all orders RTD, trolley ab dobara available hai");
        setOpenTask(null); setOpenTote(null); load();
        return;
      }
      // auto-advance to next bin in sequence
      const next = [...remaining].sort((a, b) => (binNumMap[a.order_id] || 99) - (binNumMap[b.order_id] || 99))[0];
      showToast(`Bin ${binNumMap[next.order_id] || "?"} → next order`);
      openPack(next);
      load();
      return;
    }
    setOpenTask(null); load();
  };

  if (openTask) {
    const order = orders[openTask.order_id];
    return (
      <div>
        <SectionTitle title={`Packing — ${order?.external_order_id}${binNumMap[openTask.order_id] ? ` · Bin #${binNumMap[openTask.order_id]}` : ""}`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenTask(null)}>← Back</button>} />
        <div style={S.panel}>
          <div style={S.panelTitle}>Scan each item to verify</div>
          <div style={{ display: "flex", gap: 10 }}>
            <input autoFocus ref={packBarcodeInputRef} style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type barcode / SKU, then Enter"
              value={barcodeInput} onChange={e => setBarcodeInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && scanBarcode()} />
            <CameraScanButton onScan={(text) => scanBarcode(text)} />
            <button style={S.primaryBtnSm} onClick={() => scanBarcode()}>Scan</button>
          </div>
        </div>
        {lastScannedProduct && (
          <div style={S.panel}>
            <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
              {lastScannedProduct.image_url ? (
                <ZoomableImage src={lastScannedProduct.image_url} alt="" style={{ width: 90, height: 90, objectFit: "cover", borderRadius: 8, border: "1px solid #E0D8C5", flexShrink: 0 }} />
              ) : (
                <div style={{ width: 90, height: 90, borderRadius: 8, border: "1px dashed #E0D8C5", display: "flex", alignItems: "center", justifyContent: "center", color: "#8A8272", fontSize: 24, flexShrink: 0 }}>📦</div>
              )}
              <div>
                <div style={{ color: "#6B6355", fontSize: 10, letterSpacing: 1 }}>LAST SCANNED — VERIFY PRODUCT</div>
                <div style={{ color: "#2B2620", fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, marginTop: 4 }}>{lastScannedProduct.name}</div>
                <div style={{ color: "#F5A623", fontSize: 12, fontFamily: "'IBM Plex Mono', monospace", marginTop: 2 }}>{lastScannedProduct.barcode}</div>
              </div>
            </div>
            <button style={{ ...S.secondaryBtnSm, color: "#B084F5", borderColor: "#B084F5", marginTop: 10 }} onClick={() => setShowDamageInput(s => !s)}>⚠ Mark Damaged</button>
            {showDamageInput && (
              <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                <input type="number" min={1} style={{ ...S.input, width: 100 }} placeholder="Qty" value={damageQty} onChange={e => setDamageQty(e.target.value)} />
                <input list="packDamageBinDatalist" style={{ ...S.input, minWidth: 150, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Damage bin code" value={damageBinId} onChange={e => setDamageBinId(e.target.value)} />
                <datalist id="packDamageBinDatalist">
                  {bins.map(b => <option key={b.id} value={b.code} />)}
                </datalist>
                <button style={{ ...S.secondaryBtnSm, color: "#B084F5", borderColor: "#B084F5" }} onClick={markPackDamaged}>Confirm Damage</button>
              </div>
            )}
            {replacementOffer && (
              <div style={{ background: "#FFF9EE", border: "1px solid #F5A623", borderRadius: 8, padding: 12, marginTop: 12 }}>
                <div style={{ fontWeight: 700, color: "#2B2620", marginBottom: 4 }}>♻ Replacement Available</div>
                <div style={{ color: "#6B6355", fontSize: 12, marginBottom: 10 }}>{replacementOffer.product?.name} — Bin <strong>{replacementOffer.binCode}</strong> mein {replacementOffer.qty} unit available hai. Warehouse floor se le aayen taake yeh order poora (bina shortage) ship ho sake.</div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button style={S.primaryBtnSm} onClick={confirmReplacement}>✓ Replacement Le Liya</button>
                  <button style={S.secondaryBtnSm} onClick={() => setReplacementOffer(null)}>Skip — Shortage Rehne Dein</button>
                </div>
              </div>
            )}
          </div>
        )}
        <div style={S.panel}>
          <div style={S.panelTitle}>Progress</div>
          {requiredLines.map(l => {
            const p = products[l.product_id];
            const got = scans[l.product_id] || 0;
            const done = got >= l.qty;
            return (
              <div key={l.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid #EFE8D8" }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", width: 110 }}>{p?.sku}</span>
                <span style={{ flex: 1, color: "#2B2620", fontSize: 13 }}>{p?.name}</span>
                <span style={{ ...S.badgeSm, color: done ? "#4CAF7D" : "#6B6355", borderColor: done ? "#4CAF7D" : "#E0D8C5" }}>{got} / {l.qty}</span>
              </div>
            );
          })}
          {allScanned && (
            <button style={{ ...S.primaryBtnSm, marginTop: 16 }} onClick={completePacking}>🏷 Complete packing & generate label</button>
          )}
        </div>
      </div>
    );
  }

  if (openTote) {
    const toteTasks = [...tasks.filter(t => t.tote_id === openTote.id)].sort((a, b) => (binNumMap[a.order_id] || 99) - (binNumMap[b.order_id] || 99));
    return (
      <div>
        <SectionTitle title={`${openTote.tote_number} — ${toteTasks.length} orders to pack`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenTote(null)}>← Back</button>} />
        {viewOnly && (
          <div style={{ ...S.panel, borderColor: "#5B9EE8", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ color: "#5B9EE8", fontWeight: 700, fontSize: 13 }}>👁 Monitoring — View Only</span>
            <span style={{ color: "#6B6355", fontSize: 12 }}>{openTote.locked_by ? "Currently being packed" : "Not yet claimed by a packer"}</span>
          </div>
        )}
        <div style={S.cardGrid}>
          {toteTasks.map(t => {
            const o = orders[t.order_id];
            return (
              <div key={t.id} style={{ ...S.card, cursor: viewOnly ? "default" : "pointer", opacity: viewOnly ? 0.85 : 1 }} onClick={() => { if (!viewOnly) openPack(t); }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span style={{ ...S.badgeSm, color: "#F5A623", borderColor: "#F5A623" }}>Bin #{binNumMap[t.order_id] || "?"}</span>
                  <span style={{ ...S.badgeSm, color: "#F5A623", borderColor: "#F5A623" }}>Ready to pack</span>
                </div>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: "#6B6355", marginTop: 8 }}>{o?.external_order_id}</div>
                <div style={{ color: "#2B2620", fontSize: 14, marginTop: 4 }}>{o?.courier}</div>
              </div>
            );
          })}
          {toteTasks.length === 0 && <EmptyNote text="All orders in this tote have been packed." />}
        </div>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle title="Packing" />
      <div style={S.panel}>
        <div style={S.panelTitle}>Scan tote to begin packing</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan/type tote number, then Enter"
            value={toteScanInput} onChange={e => setToteScanInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && scanTote()} />
          <CameraScanButton onScan={(text) => scanTote(text)} />
          <button style={S.primaryBtnSm} onClick={() => scanTote()}>Open tote</button>
        </div>
      </div>
      <div style={S.panel}>
        <div style={S.panelTitle}>Or open a single order directly</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Order number, then Enter"
            value={orderScanInput} onChange={e => setOrderScanInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && openByOrderNumber()} />
          <CameraScanButton onScan={(text) => openByOrderNumber(text)} />
          <button style={S.secondaryBtnSm} onClick={() => openByOrderNumber()}>Open</button>
        </div>
      </div>
      {canAssign && (() => {
        const unassignedTotes = totes.filter(t => !t.locked_by);
        const assignedTotes = totes.filter(t => t.locked_by);
        const workload = {};
        for (const t of assignedTotes) {
          const count = tasks.filter(x => x.tote_id === t.id).length;
          if (!workload[t.locked_by]) workload[t.locked_by] = { orders: 0, totes: 0 };
          workload[t.locked_by].orders += count;
          workload[t.locked_by].totes += 1;
        }
        return (
          <>
            <SectionTitle title="Assign totes to packers" />
            <div style={S.panel}>
              {unassignedTotes.length === 0 ? <EmptyNote text="No unassigned totes — all have been assigned to packers." /> : (
                <table>
                  <thead><tr><th style={S.th}>Tote</th><th style={S.th}>Orders</th><th style={S.th}>Assign to</th></tr></thead>
                  <tbody>
                    {unassignedTotes.map(t => {
                      const count = tasks.filter(x => x.tote_id === t.id).length;
                      return (
                        <tr key={t.id}>
                          <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{t.tote_number}</td>
                          <td style={S.td}>{count}</td>
                          <td style={S.td}>
                            <select style={{ ...S.input, fontSize: 12, maxWidth: 220 }} defaultValue="" onChange={e => e.target.value && assignToteToPacker(t.id, e.target.value)}>
                              <option value="">Packer select karein…</option>
                              {packers.map(p => <option key={p.id} value={p.id}>{p.full_name}</option>)}
                            </select>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>

            <div style={S.panel}>
              <div style={S.panelTitle}>Packer workload — orders assigned per packer</div>
              {Object.keys(workload).length === 0 ? <EmptyNote text="Nothing assigned to any packer yet." /> : (
                <table>
                  <thead><tr><th style={S.th}>Packer</th><th style={S.th}>Totes Assigned</th><th style={S.th}>Orders</th></tr></thead>
                  <tbody>
                    {Object.entries(workload).map(([pid, w]) => (
                      <tr key={pid}>
                        <td style={S.td}>{staff.find(s => s.id === pid)?.full_name || "—"}</td>
                        <td style={{ ...S.td, color: "#6B6355" }}>{w.totes}</td>
                        <td style={{ ...S.td, color: "#F5A623", fontWeight: 600 }}>{w.orders}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </>
        );
      })()}

      <SectionTitle title={canAssign ? "All totes — monitoring" : "My assigned totes"} action={<span style={{ color: "#8A8272", fontSize: 10 }}>Live status — 15s auto-refresh</span>} />
      <div style={S.cardGrid}>
        {(canAssign ? totes : totes.filter(tt => tt.locked_by === profile.id)).map(tt => {
          const count = tasks.filter(t => t.tote_id === tt.id).length;
          const lockedByProfile = tt.locked_by ? staff.find(s => s.id === tt.locked_by) : null;
          return (
            <div key={tt.id} style={S.card} onClick={() => scanTote(tt.tote_number)}>
              <span>🧺</span>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 15, marginTop: 10 }}>{tt.tote_number}</div>
              <div style={{ color: "#6B6355", fontSize: 12, marginTop: 4 }}>{count} orders to pack</div>
              {lockedByProfile ? (
                <div style={{ color: "#E5484D", fontSize: 11, marginTop: 6, fontWeight: 600 }}>🔒 Assigned — {lockedByProfile.full_name}</div>
              ) : (
                <div style={{ color: "#8A8272", fontSize: 11, marginTop: 6, fontWeight: 600 }}>⏳ Not yet assigned</div>
              )}
            </div>
          );
        })}
        {(canAssign ? totes : totes.filter(tt => tt.locked_by === profile.id)).length === 0 && (
          <EmptyNote text={canAssign ? "Koi tote packing ke liye ready nahi hai." : "Abhi aapko koi tote assign nahi hui — Warehouse Lead se check karwayein."} />
        )}
      </div>
    </div>
  );
}

/* ================= DISPATCH / LOAD SHEET ================= */
function DispatchView({ token, profile, showToast }) {
  const [orders, setOrders] = useState([]);
  const [selected, setSelected] = useState({});
  const [loadSheets, setLoadSheets] = useState([]);
  const [profiles, setProfiles] = useState({});
  const [scanTrackingInput, setScanTrackingInput] = useState("");
  const [handoverModal, setHandoverModal] = useState(null);
  const [courierRepName, setCourierRepName] = useState("");
  const [handoverRemarks, setHandoverRemarks] = useState("");

  const [cancellingId, setCancellingId] = useState(null);
  const [syncingTracking, setSyncingTracking] = useState(false);
  const [syncingMnp, setSyncingMnp] = useState(false);

  const cancelLoadSheet = async (ls) => {
    if (ls.handover_status === "handed_over") { showToast("Yeh load sheet already handover ho chuki hai — cancel nahi ho sakti", "err"); return; }
    setCancellingId(ls.id);
    try {
      const ids = ls.order_ids || [];
      for (const orderId of ids) {
        const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${orderId}&select=*`, { token });
        for (const l of lines || []) {
          await addOnHand(token, profile.warehouse_id, l.product_id, null, l.qty, { type: "restore", userId: profile.id }); // restore deducted stock
          await adjustReserved(token, profile.warehouse_id, l.product_id, l.qty); // re-reserve for this order
        }
        await sb(`/rest/v1/sales_orders?id=eq.${orderId}`, { method: "PATCH", token, body: { status: "rtd", dispatched_at: null } });
      }
      await sb(`/rest/v1/load_sheets?id=eq.${ls.id}`, { method: "PATCH", token, body: { status: "cancelled", cancelled_by: profile.id, cancelled_at: new Date().toISOString() } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "load_sheet", entity_id: ls.id, user_id: profile.id, action: "cancelled", metadata: { order_count: ids.length } } });
      showToast(`${ls.load_sheet_number} cancel ho gayi — ${ids.length} orders wapas 'RTD' mein aa gaye, dobara scan kar ke nayi load sheet banayein`);
      load();
    } catch (e) { showToast("Cancel failed", "err"); }
    setCancellingId(null);
  };

  const confirmHandover = async () => {
    if (!handoverModal) return;
    try {
      await sb(`/rest/v1/load_sheets?id=eq.${handoverModal.id}`, {
        method: "PATCH", token,
        body: { handover_status: "handed_over", handed_over_by: profile.id, handed_over_at: new Date().toISOString(), courier_rep_name: courierRepName.trim() || null, handover_remarks: handoverRemarks.trim() || null }
      });
      const ids = handoverModal.order_ids || [];
      for (const orderId of ids) {
        await sb(`/rest/v1/sales_orders?id=eq.${orderId}`, { method: "PATCH", token, body: { status: "handed_over" } });
      }
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "load_sheet", entity_id: handoverModal.id, user_id: profile.id, action: "handed_over", metadata: { courier_rep_name: courierRepName, remarks: handoverRemarks } } });
      showToast(`${handoverModal.load_sheet_number} handed over ✓`);
      setHandoverModal(null); setCourierRepName(""); setHandoverRemarks("");
      load();
    } catch (e) { showToast("Handover confirm failed", "err"); }
  };

  const load = useCallback(async () => {
    try {
      const [o, ls, pf] = await Promise.all([
        sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&status=in.(rtd,scanned)&select=*`, { token }),
        sb(`/rest/v1/load_sheets?warehouse_id=eq.${profile.warehouse_id}&select=*&order=created_at.desc`, { token }),
        sb(`/rest/v1/profiles?select=*`, { token })
      ]);
      setOrders(o || []); setLoadSheets(ls || []);
      setProfiles(Object.fromEntries((pf || []).map(p => [p.id, p])));
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const toggle = (id) => setSelected({ ...selected, [id]: !selected[id] });

  const scanTracking = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : scanTrackingInput).trim();
    setScanTrackingInput("");
    if (!code) return;
    const order = orders.find(o => o.external_order_id === code);
    if (!order) { showToast("Tracking number is packed-orders list mein nahi mila", "err"); return; }
    if (selected[order.id]) { showToast("Already selected"); return; }
    setSelected(prev => ({ ...prev, [order.id]: true }));
    try {
      await sb(`/rest/v1/sales_orders?id=eq.${order.id}`, { method: "PATCH", token, body: { status: "scanned" } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: order.id, user_id: profile.id, action: "tracking_scanned" } });
    } catch (e) {}
    showToast(`Added: ${order.external_order_id} (${order.courier})`);
  };

  const nextLoadSheetNumber = async (courierName) => {
    const prefix = courierName.trim().slice(0, 3).toUpperCase();
    const existing = await sb(`/rest/v1/load_sheets?warehouse_id=eq.${profile.warehouse_id}&courier=eq.${encodeURIComponent(courierName)}&select=load_sheet_number`, { token });
    let maxSerial = 0;
    for (const ls of existing || []) {
      const m = String(ls.load_sheet_number).match(/(\d+)$/);
      if (m) maxSerial = Math.max(maxSerial, parseInt(m[1], 10));
    }
    return `${prefix}${String(maxSerial + 1).padStart(5, "0")}`;
  };

  const [creatingLoadSheet, setCreatingLoadSheet] = useState(false);

  const createLoadSheet = async () => {
    if (creatingLoadSheet) return; // guard against double-click/double-submit
    const ids = Object.keys(selected).filter(k => selected[k]);
    if (ids.length === 0) { showToast("Kam se kam ek order select karein", "err"); return; }
    setCreatingLoadSheet(true);
    try {
      const byCourier = {};
      for (const id of ids) {
        const o = orders.find(x => x.id === id);
        // defensive re-check: skip if this order was already dispatched (e.g. stale selection)
        if (!o || ["dispatched", "handed_over"].includes(o.status)) continue;
        const c = o?.courier || "Other";
        if (!byCourier[c]) byCourier[c] = [];
        byCourier[c].push(id);
      }
      if (Object.keys(byCourier).length === 0) { showToast("Selected orders already dispatch ho chuke hain", "err"); setCreatingLoadSheet(false); return; }
      const generated = [];
      for (const [courierName, orderIds] of Object.entries(byCourier)) {
        const lsNumber = await nextLoadSheetNumber(courierName);
        await sb(`/rest/v1/load_sheets`, { method: "POST", token, body: { warehouse_id: profile.warehouse_id, courier: courierName, load_sheet_number: lsNumber, order_ids: orderIds, created_by: profile.id } });
        for (const orderId of orderIds) {
          const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${orderId}&select=*`, { token });
          for (const l of lines) {
            await deductStock(token, profile.warehouse_id, l.product_id, l.qty, { type: "dispatch", userId: profile.id });
            await adjustReserved(token, profile.warehouse_id, l.product_id, -l.qty);
          }
          await sb(`/rest/v1/sales_orders?id=eq.${orderId}`, { method: "PATCH", token, body: { status: "dispatched", dispatched_at: new Date().toISOString() } });
          await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: orderId, user_id: profile.id, action: "dispatched", metadata: { load_sheet: lsNumber } } });
        }
        generated.push(`${lsNumber} (${courierName}, ${orderIds.length})`);
      }
      showToast(`Load sheet(s) created: ${generated.join(" · ")}`);
      setSelected({}); load();
    } catch (e) { showToast("Load sheet creation failed", "err"); }
    setCreatingLoadSheet(false);
  };

  return (
    <div>
      <SectionTitle title="Dispatch / Load Sheet — RTD orders" />
      <div style={S.panel}>
        <div style={S.panelTitle}>Scan tracking numbers to verify</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan/type tracking number, then Enter"
            value={scanTrackingInput} onChange={e => setScanTrackingInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && scanTracking()} />
          <CameraScanButton onScan={(text) => scanTracking(text)} />
          <button style={S.primaryBtnSm} onClick={() => scanTracking()}>Verify</button>
        </div>
      </div>
      <div style={S.panel}>
        <div style={S.panelTitle}>RTD orders — red = pending, green = verified</div>
        {orders.length === 0 ? <EmptyNote text="No RTD orders waiting." /> : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))", gap: 8 }}>
            {orders.map(o => {
              const ok = o.status === "scanned" || !!selected[o.id];
              return (
                <div key={o.id} onClick={() => toggle(o.id)} style={{
                  cursor: "pointer", borderRadius: 8, padding: "10px 12px",
                  background: ok ? "rgba(76,175,125,0.12)" : "rgba(229,72,77,0.08)",
                  border: `1px solid ${ok ? "#4CAF7D" : "#E5484D"}`
                }}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: ok ? "#4CAF7D" : "#E5484D", fontSize: 13 }}>{o.external_order_id}</div>
                  <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>{o.courier} · {ok ? "Verified" : "Pending"}</div>
                </div>
              );
            })}
          </div>
        )}
        <div style={{ display: "flex", gap: 10, marginTop: 14, alignItems: "center" }}>
          <button style={S.primaryBtnSm} onClick={createLoadSheet} disabled={creatingLoadSheet}>{creatingLoadSheet ? "Creating…" : "🚚 Create load sheet(s) — auto courier-wise"}</button>
          <span style={{ color: "#8A8272", fontSize: 11 }}>Verified orders alag-alag courier ke hon to system khud alag load sheets bana dega</span>
        </div>
      </div>
      <div style={S.panel}>
        <div style={S.panelTitle}>📡 Courier Tracking Sync</div>
        <div style={{ color: "#8A8272", fontSize: 12, marginBottom: 12 }}>Dispatched PostEx aur M&amp;P orders ki latest status, city, aur receiver name — dono couriers se ek sath khींch kar update karta hai. Har 3 ghante mein khud-b-khud bhi hota hai.</div>
        <button style={S.primaryBtnSm} disabled={syncingTracking} onClick={async () => {
          setSyncingTracking(true);
          try {
            const [postexResult, mnpResult] = await Promise.allSettled([
              postexProxy("auto-sync", {}, token),
              mnpProxy("auto-sync", {}, token)
            ]);
            const pUpdated = postexResult.status === "fulfilled" ? postexResult.value.updated : 0;
            const pDelivered = postexResult.status === "fulfilled" ? postexResult.value.delivered : 0;
            const mUpdated = mnpResult.status === "fulfilled" ? mnpResult.value.updated : 0;
            const mDelivered = mnpResult.status === "fulfilled" ? mnpResult.value.delivered : 0;
            const errors = [];
            if (postexResult.status === "rejected") errors.push(`PostEx: ${postexResult.reason.message}`);
            if (mnpResult.status === "rejected") errors.push(`M&P: ${mnpResult.reason.message}`);
            showToast(errors.length
              ? `⚠ Partial sync — PostEx ${pUpdated}, M&P ${mUpdated} updated. Errors: ${errors.join(" · ")}`
              : `✅ Sync complete — PostEx: ${pUpdated} updated (${pDelivered} delivered) · M&P: ${mUpdated} updated (${mDelivered} delivered)`,
              errors.length ? "err" : undefined);
          } catch (e) { showToast(`Sync failed: ${e.message}`, "err"); }
          setSyncingTracking(false);
        }}>{syncingTracking ? "Syncing…" : "🔄 Sync All Tracking Now"}</button>
      </div>
      <div style={S.panel}>
        <div style={S.panelTitle}>Recent load sheets</div>
        {loadSheets.map(ls => {
          const handedOver = ls.handover_status === "handed_over";
          const cancelled = ls.status === "cancelled";
          return (
          <div key={ls.id} style={{ padding: "10px 0", borderBottom: "1px solid #EFE8D8", opacity: cancelled ? 0.6 : 1 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#2B2620" }}>{ls.load_sheet_number}</span>
              <span style={{ color: "#6B6355", fontSize: 12 }}>{ls.courier} · {ls.order_ids?.length || 0} orders · {fmtTime(ls.created_at)}</span>
              <span style={{ ...S.badgeSm, color: cancelled ? "#E5484D" : handedOver ? "#4CAF7D" : "#F5A623", borderColor: cancelled ? "#E5484D" : handedOver ? "#4CAF7D" : "#F5A623" }}>{cancelled ? "CANCELLED" : handedOver ? "HANDED OVER" : "READY FOR HANDOVER"}</span>
            </div>
            {cancelled ? (
              <div style={{ color: "#8A8272", fontSize: 11, marginTop: 6 }}>Cancelled by {profiles[ls.cancelled_by]?.full_name || "—"} · {fmtTime(ls.cancelled_at)} — orders wapas RTD mein bhej diye gaye thay.</div>
            ) : (
            <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
              <button style={S.secondaryBtnSm} onClick={async () => {
                const ids = ls.order_ids || [];
                if (ids.length === 0) return;
                const os = await sb(`/rest/v1/sales_orders?id=in.(${ids.join(",")})&select=*`, { token });
                const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
                const rows = [
                  [esc("Load Sheet Number"), esc(ls.load_sheet_number)],
                  [esc("Courier"), esc(ls.courier)],
                  [esc("Created Date"), esc(fmtTime(ls.created_at))],
                  [esc("Created By"), esc(profiles[ls.created_by]?.full_name || "—")],
                  [],
                  [esc("Customer"), esc("Tracking"), esc("Qty"), esc("Order Timestamp")]
                ];
                for (const o of os || []) {
                  const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${o.id}&select=qty`, { token });
                  const qty = (lines || []).reduce((s, l) => s + l.qty, 0);
                  rows.push([esc(o.raw_data?.customer_order_number || o.raw_data?.customer || "—"), esc(o.external_order_id), esc(qty), esc(fmtTime(o.dispatched_at))]);
                }
                const csv = rows.map(r => r.join(",")).join("\n");
                const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url; a.download = `${ls.load_sheet_number}.csv`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
              }}>⬇ Export CSV</button>
              <button style={S.secondaryBtnSm} onClick={async () => {
                const ids = ls.order_ids || [];
                const os = ids.length ? await sb(`/rest/v1/sales_orders?id=in.(${ids.join(",")})&select=*`, { token }) : [];
                let rowsHtml = "";
                for (const o of os || []) {
                  const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${o.id}&select=qty`, { token });
                  const qty = (lines || []).reduce((s, l) => s + l.qty, 0);
                  rowsHtml += `<tr><td>${o.raw_data?.customer_order_number || o.raw_data?.customer || "—"}</td><td>${o.external_order_id}</td><td>${qty}</td></tr>`;
                }
                const w = window.open("", "_blank");
                w.document.write(`<html><head><title>${ls.load_sheet_number}</title><style>
                  body{font-family:Arial;padding:24px;color:#111} h2{margin-bottom:4px} .meta{color:#555;font-size:13px;margin-bottom:16px}
                  table{width:100%;border-collapse:collapse} th,td{border:1px solid #ccc;padding:8px;text-align:left;font-size:13px}
                  th{background:#eee}
                </style></head><body>
                  <h2>Load Sheet: ${ls.load_sheet_number}</h2>
                  <div class="meta">Courier: ${ls.courier} &nbsp;|&nbsp; Date: ${fmtTime(ls.created_at)} &nbsp;|&nbsp; Created by: ${profiles[ls.created_by]?.full_name || "—"} &nbsp;|&nbsp; Orders: ${ids.length}</div>
