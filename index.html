  const seenInFile = {}; // lineKey -> qty of the first occurrence
  rows.forEach((row, i) => {
    const errors = [];
    const groupVal = cleanCode(getVal(row, map, groupField));
    const barcode = cleanCode(getVal(row, map, "barcode"));
    const qtyRaw = getVal(row, map, "qty");
    const qty = Number(qtyRaw);
    const product = barcode ? productLookup[barcode] : null;

    if (!groupVal) errors.push("Missing reference/tracking number");
    if (!barcode) errors.push("Missing barcode");
    else if (!product) errors.push("Barcode not found in Product Master");
    if (qtyRaw === undefined || qtyRaw === "" || isNaN(qty) || qty <= 0) errors.push("Invalid quantity");

    const lineKey = `${groupVal}|${barcode}`;
    if (groupVal && barcode) {
      if (lineKey in seenInFile) {
        if (seenInFile[lineKey] === qty) {
          errors.push("Duplicate — same item & qty already accepted for this tracking (rejected)");
        } else {
          errors.push("Duplicate line in this file (different qty — needs review)");
        }
      } else {
        seenInFile[lineKey] = qty;
      }
      if (existingGroupLines && existingGroupLines[lineKey]) errors.push("Already exists (previously imported)");
    }

    results.push({
      rowNum: i + 2, // +2 = header row + 1-indexing, matches what user sees in Excel
      groupVal, barcode, qty: isNaN(qty) ? 0 : qty, product,
      errors, valid: errors.length === 0
    });
  });

  const validRows = results.filter(r => r.valid);
  const invalidRows = results.filter(r => !r.valid);
  const alreadyExistsRows = results.filter(r => r.errors.includes("Already exists (previously imported)"));
  return {
    total: results.length,
    validRows, invalidRows, alreadyExistsRows,
    invalidBarcodeCount: results.filter(r => r.errors.includes("Barcode not found in Product Master")).length,
    invalidQtyCount: results.filter(r => r.errors.includes("Invalid quantity")).length,
    duplicateCount: results.filter(r => r.errors.some(e => e.startsWith("Duplicate") || e.startsWith("Already exists"))).length,
    missingRefCount: results.filter(r => r.errors.includes("Missing reference/tracking number")).length
  };
}


/* ================= BIN MASTER (ADMIN ONLY) ================= */
function BinsView({ token, profile, showToast }) {
  const [bins, setBins] = useState([]);
  const [newCode, setNewCode] = useState("");
  const [importing, setImporting] = useState(false);
  const [importSummary, setImportSummary] = useState(null);

  const load = useCallback(async () => {
    setBins(await sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*&order=code.asc`, { token }) || []);
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const addBin = async () => {
    if (!newCode.trim()) return;
    try {
      await sb(`/rest/v1/bins`, { method: "POST", token, body: { warehouse_id: profile.warehouse_id, code: newCode.trim() } });
      setNewCode(""); showToast("Bin added"); load();
    } catch (e) { showToast("Bin already exists", "err"); }
  };

  const handleBinFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImporting(true); setImportSummary(null);
    try {
      const rows = await parseSheet(file);
      const headers = Object.keys(rows[0] || {});
      const codeHeader = headers.find(h => ["location", "bin", "bincode", "locationcode", "code"].includes(normHeader(h))) || headers[0];
      const items = rows.map(r => ({ warehouse_id: profile.warehouse_id, code: String(r[codeHeader] || "").trim() })).filter(x => x.code);
      const CHUNK = 300;
      let count = 0;
      for (let i = 0; i < items.length; i += CHUNK) {
        await sb(`/rest/v1/bins?on_conflict=warehouse_id,code`, { method: "POST", token, prefer: "resolution=merge-duplicates,return=minimal", body: items.slice(i, i + CHUNK) });
        count += items.slice(i, i + CHUNK).length;
      }
      setImportSummary(`${count} bin locations imported.`);
      showToast(`${count} bins imported`); load();
    } catch (err) { showToast(`Import failed: ${(err.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  const [selectedBins, setSelectedBins] = useState({});
  const [aisleFrom, setAisleFrom] = useState("");
  const [aisleTo, setAisleTo] = useState("");
  const [bulkDeleting, setBulkDeleting] = useState(false);

  const binAisle = (code) => (code || "").split("-")[0];
  const filteredBins = bins.filter(b => {
    const aisle = binAisle(b.code);
    if (aisleFrom && aisle.toUpperCase() < aisleFrom.toUpperCase()) return false;
    if (aisleTo && aisle.toUpperCase() > aisleTo.toUpperCase()) return false;
    return true;
  });
  const selectedCount = Object.values(selectedBins).filter(Boolean).length;

  const bulkDeleteBins = async () => {
    const ids = Object.keys(selectedBins).filter(id => selectedBins[id]);
    if (ids.length === 0) return;
    if (!window.confirm(`${ids.length} bins delete karein? Jo bins stock/task se linked hain woh skip ho jayengi.`)) return;
    setBulkDeleting(true);
    let deleted = 0, blocked = 0;
    const blockedCodes = [];
    for (const id of ids) {
      const bin = bins.find(b => b.id === id);
      try {
        await sb(`/rest/v1/bins?id=eq.${id}`, { method: "DELETE", token });
        deleted++;
      } catch (e) { blocked++; blockedCodes.push(bin?.code || id); }
    }
    showToast(`✅ ${deleted} bins delete ho gayi${blocked > 0 ? ` — ${blocked} skip hui (in use): ${blockedCodes.slice(0, 8).join(", ")}${blockedCodes.length > 8 ? "…" : ""}` : ""}`, blocked > 0 ? "err" : undefined);
    setSelectedBins({});
    setBulkDeleting(false);
    load();
  };

  const [bulkLocking, setBulkLocking] = useState(false);
  const [quickBinCode, setQuickBinCode] = useState("");
  const quickBinMatch = bins.find(b => b.code.toLowerCase() === quickBinCode.trim().toLowerCase());

  const bulkSetPickable = async (isPickable) => {
    const ids = Object.keys(selectedBins).filter(id => selectedBins[id]);
    if (ids.length === 0) return;
    setBulkLocking(true);
    let updated = 0;
    for (const id of ids) {
      try {
        await sb(`/rest/v1/bins?id=eq.${id}`, { method: "PATCH", token, body: { pickable: isPickable } });
        updated++;
      } catch (e) {}
    }
    showToast(isPickable ? `✅ ${updated} bins unlock ho gayin (ab picking ke liye available)` : `🔒 ${updated} bins lock ho gayin (non-sellable, picking se exclude)`);
    setSelectedBins({});
    setBulkLocking(false);
    load();
  };

  const togglePickable = async (bin, isPickable) => {
    try {
      await sb(`/rest/v1/bins?id=eq.${bin.id}`, { method: "PATCH", token, body: { pickable: isPickable } });
      showToast(isPickable ? `✅ "${bin.code}" ab picking ke liye available hai` : `⚠ "${bin.code}" ab picking ke liye EXCLUDE ho gayi (non-sellable/quarantine)`);
      load();
    } catch (e) { showToast("Update failed", "err"); }
  };

  const deleteBin = async (bin) => {
    if (!window.confirm(`Bin "${bin.code}" delete karein? Agar isme abhi stock hai ya yeh kisi task se linked hai, delete nahi ho payegi.`)) return;
    try {
      await sb(`/rest/v1/bins?id=eq.${bin.id}`, { method: "DELETE", token });
      showToast(`✅ Bin "${bin.code}" delete ho gayi`);
      load();
    } catch (e) {
      const msg = (e.message || "").toLowerCase();
      if (msg.includes("foreign key") || msg.includes("violates")) {
        showToast(`⚠ "${bin.code}" delete nahi ho sakti — isme stock hai ya kisi task/history se linked hai`, "err");
      } else {
        showToast("Delete failed", "err");
      }
    }
  };

  return (
    <div>
      <SectionTitle title="Bin Master (locations)" action={
        <label style={{ ...S.primaryBtnSm, cursor: "pointer" }}>
          {importing ? "Importing…" : "📤 Upload bin list"}
          <input type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={handleBinFile} disabled={importing} />
        </label>
      } />
      {importSummary && <div style={{ ...S.panel, borderColor: "#4CAF7D", color: "#4CAF7D", fontSize: 12 }}>{importSummary}</div>}
      <div style={S.panel}>
        <div style={S.panelTitle}>Add single location</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input style={{ ...S.input, maxWidth: 220 }} placeholder="e.g. A-01-03" value={newCode} onChange={e => setNewCode(e.target.value)} />
          <button style={S.primaryBtnSm} onClick={addBin}>+ Add</button>
        </div>
        <div style={{ marginTop: 12, fontSize: 11, color: "#8A8272" }}>
          ⚠ Sirf yahan se bin locations bante hain — staff Putaway ya Returns screen se koi nayi location nahi khol sakte, sirf yahan uploaded list mein se select karenge.
        </div>
      </div>
      <div style={S.panel}>
        <div style={S.panelTitle}>Quick Lock/Unlock — Bin Code Type Karein</div>
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <input list="quickBinDatalist" style={{ ...S.input, minWidth: 200 }} placeholder="Bin code type karein (jaise A-01-03)" value={quickBinCode} onChange={e => setQuickBinCode(e.target.value)} />
          <datalist id="quickBinDatalist">
            {bins.map(b => <option key={b.id} value={b.code} />)}
          </datalist>
          {quickBinMatch ? (
            <>
              <span style={{ ...S.badgeSm, color: quickBinMatch.pickable === false ? "#E5484D" : "#4CAF7D", borderColor: quickBinMatch.pickable === false ? "#E5484D" : "#4CAF7D" }}>
                {quickBinMatch.pickable === false ? "Currently NON-SELLABLE" : "Currently Sellable"}
              </span>
              <button style={{ ...S.primaryBtnSm, background: "#E5484D", borderColor: "#E5484D" }} onClick={() => togglePickable(quickBinMatch, false)}>🔒 Set Non-Sellable</button>
              <button style={{ ...S.primaryBtnSm, background: "#4CAF7D", borderColor: "#4CAF7D" }} onClick={() => togglePickable(quickBinMatch, true)}>🔓 Set Sellable</button>
            </>
          ) : quickBinCode.trim() && (
            <span style={{ color: "#8A8272", fontSize: 12 }}>Yeh bin code nahi mila</span>
          )}
        </div>
      </div>
      <div style={S.panel}>
        <div style={S.panelTitle}>Bulk Select — Lock/Unlock &amp; Delete (by Aisle Range)</div>
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <span style={{ fontSize: 12, color: "#6B6355" }}>Aisle</span>
          <input style={{ ...S.input, width: 70 }} placeholder="A" value={aisleFrom} onChange={e => setAisleFrom(e.target.value.toUpperCase())} />
          <span style={{ fontSize: 12, color: "#6B6355" }}>to</span>
          <input style={{ ...S.input, width: 70 }} placeholder="F" value={aisleTo} onChange={e => setAisleTo(e.target.value.toUpperCase())} />
          <button style={S.secondaryBtnSm} onClick={() => { setAisleFrom(""); setAisleTo(""); }}>Clear filter</button>
          <span style={{ marginLeft: "auto", fontSize: 12, color: "#8A8272" }}>{filteredBins.length} bins matched</span>
          <button style={S.secondaryBtnSm} onClick={() => setSelectedBins(Object.fromEntries(filteredBins.map(b => [b.id, true])))}>Select All (filtered)</button>
          <button style={S.secondaryBtnSm} onClick={() => setSelectedBins({})}>Clear Selection</button>
        </div>
        <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
          <button style={{ ...S.primaryBtnSm, background: "#E5484D", borderColor: "#E5484D" }} disabled={selectedCount === 0 || bulkLocking} onClick={() => bulkSetPickable(false)}>
            {bulkLocking ? "Locking…" : `🔒 Lock — Mark Non-Sellable (${selectedCount})`}
          </button>
          <button style={{ ...S.primaryBtnSm, background: "#4CAF7D", borderColor: "#4CAF7D" }} disabled={selectedCount === 0 || bulkLocking} onClick={() => bulkSetPickable(true)}>
            {bulkLocking ? "Unlocking…" : `🔓 Unlock — Mark Sellable (${selectedCount})`}
          </button>
          <button style={{ ...S.primaryBtnSm, background: "#E5484D", borderColor: "#E5484D", marginLeft: "auto" }} disabled={selectedCount === 0 || bulkDeleting} onClick={bulkDeleteBins}>
            {bulkDeleting ? "Deleting…" : `🗑 Delete Selected (${selectedCount})`}
          </button>
        </div>
      </div>
      <div style={S.cardGrid}>
        {filteredBins.map(b => (
          <div key={b.id} style={{ ...S.card, cursor: "default", display: "flex", justifyContent: "space-between", alignItems: "center", ...(b.pickable === false ? { borderColor: "#E5484D", background: "#FDF0EE" } : {}) }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <input type="checkbox" checked={!!selectedBins[b.id]} onChange={e => setSelectedBins({ ...selectedBins, [b.id]: e.target.checked })} />
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 15 }}>{b.code}</span>
              {b.pickable === false && <span style={{ ...S.badgeSm, color: "#E5484D", borderColor: "#E5484D", fontSize: 9 }}>NON-SELLABLE</span>}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <label style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 10, color: "#8A8272", cursor: "pointer" }}>
                <input type="checkbox" checked={b.pickable !== false} onChange={e => togglePickable(b, e.target.checked)} />
                Pickable
              </label>
              <button onClick={() => deleteBin(b)} style={{ background: "transparent", border: "none", color: "#E5484D", cursor: "pointer", fontSize: 14 }} title="Delete bin">🗑</button>
            </div>
          </div>
        ))}
        {filteredBins.length === 0 && <EmptyNote text="No bin locations match this filter." />}
      </div>
    </div>
  );
}

/* ================= TOTE MASTER (ADMIN ONLY) ================= */
function ToteMasterView({ token, profile, showToast }) {
  const [totes, setTotes] = useState([]);
  const [profiles, setProfiles] = useState({});
  const [pickers, setPickers] = useState([]);
  const [newCode, setNewCode] = useState("");
  const [pickedCountByTote, setPickedCountByTote] = useState({});

  const load = useCallback(async () => {
    const [tt, pf] = await Promise.all([
      sb(`/rest/v1/totes?warehouse_id=eq.${profile.warehouse_id}&select=*&order=tote_number.asc`, { token }),
      sb(`/rest/v1/profiles?select=*`, { token })
    ]);
    setTotes(tt || []);
    setProfiles(Object.fromEntries((pf || []).map(p => [p.id, p])));
    setPickers((pf || []).filter(p => ["picker", "packer"].includes(p.role) && p.warehouse_id === profile.warehouse_id));

    // Flags "orphaned" totes: pick_tasks that are already fully "picked" (complete) but whose
    // tote now shows a status like "open" — exactly what a force-release leaves behind, since
    // that only ever resets the TOTE record and never touches its pick_tasks. Without this, a
    // released tote with real picked orders still sitting in it is impossible to tell apart
    // from a genuinely empty one.
    const toteIds = (tt || []).map(t => t.id);
    const counts = {};
    if (toteIds.length) {
      const CHUNK = 100;
      for (let i = 0; i < toteIds.length; i += CHUNK) {
        const chunk = toteIds.slice(i, i + CHUNK);
        const pts = await sb(`/rest/v1/pick_tasks?tote_id=in.(${chunk.join(",")})&status=eq.picked&select=tote_id`, { token });
        for (const p of pts || []) counts[p.tote_id] = (counts[p.tote_id] || 0) + 1;
      }
    }
    setPickedCountByTote(counts);
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const addTote = async () => {
    if (!newCode.trim()) return;
    try {
      await sb(`/rest/v1/totes`, { method: "POST", token, body: { tote_number: newCode.trim(), warehouse_id: profile.warehouse_id, status: "open" } });
      setNewCode(""); showToast("Tote added"); load();
    } catch (e) { showToast("Tote already exists", "err"); }
  };

  const [releaseReasonId, setReleaseReasonId] = useState(null);
  const [releaseReason, setReleaseReason] = useState("");
  const [reassignForm, setReassignForm] = useState({}); // { [toteId]: { packerId, status } }

  // Actually hands the tote to a DIFFERENT packer/picker without touching its current status —
  // this is the fix for the old "Reassign / Release" button, which force-reset status to "open"
  // no matter what, silently dropping an already-picked tote out of Packing's "picked" list with
  // no way to get it back to a packer. Also usable as a manual recovery tool: if a tote is stuck
  // "open" after that old bug, pick the packer AND the correct status (usually "picked") here.
  const reassignTote = async (tote) => {
    const f = reassignForm[tote.id] || {};
    if (!f.packerId) { showToast("Packer/Picker select karein", "err"); return; }
    try {
      const prevPacker = tote.assigned_to ? profiles[tote.assigned_to]?.full_name : "—";
      const newStatus = f.status || tote.status;
      await sb(`/rest/v1/totes?id=eq.${tote.id}`, {
        method: "PATCH", token,
        body: { assigned_to: f.packerId, status: newStatus, last_reassign_reason: f.reason || "Reassigned via Tote Master", last_reassigned_by: profile.id, last_reassigned_at: new Date().toISOString() }
      });
      await sb(`/rest/v1/audit_trail`, { method: "POST", token, body: { entity_type: "tote", entity_id: tote.id, field_changed: "assigned_to", old_value: prevPacker, new_value: profiles[f.packerId]?.full_name || f.packerId, reason: f.reason || "Reassigned via Tote Master", changed_by: profile.id } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "tote", entity_id: tote.id, user_id: profile.id, action: "reassigned", metadata: { previous: prevPacker, new: profiles[f.packerId]?.full_name, status: newStatus } } });
      showToast(`✓ ${tote.tote_number} — ${profiles[f.packerId]?.full_name} ko reassign ho gaya (status: ${newStatus})`);
      setReassignForm(rf => ({ ...rf, [tote.id]: {} }));
      load();
    } catch (e) { showToast("Reassign failed: " + e.message, "err"); }
  };

  const forceRelease = async (tote) => {
    if (!releaseReason.trim()) { showToast("Reason likhna zaroori hai", "err"); return; }
    try {
      const prevPacker = tote.assigned_to ? profiles[tote.assigned_to]?.full_name : "—";
      await sb(`/rest/v1/totes?id=eq.${tote.id}`, {
        method: "PATCH", token,
        body: { status: "open", assigned_to: null, locked_by: null, last_reassign_reason: releaseReason.trim(), last_reassigned_by: profile.id, last_reassigned_at: new Date().toISOString() }
      });
      await sb(`/rest/v1/audit_trail`, { method: "POST", token, body: { entity_type: "tote", entity_id: tote.id, field_changed: "assigned_to", old_value: prevPacker, new_value: "Unassigned", reason: releaseReason.trim(), changed_by: profile.id } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "tote", entity_id: tote.id, user_id: profile.id, action: "force_released", metadata: { reason: releaseReason.trim(), previous: prevPacker } } });
      showToast(`${tote.tote_number} force-released`);
      setReleaseReasonId(null); setReleaseReason(""); load();
    } catch (e) { showToast("Release failed", "err"); }
  };

  return (
    <div>
      <SectionTitle title="Tote Master (physical trolleys)" />
      <div style={S.panel}>
        <div style={S.panelTitle}>Add tote</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input style={{ ...S.input, maxWidth: 200 }} placeholder="e.g. TOT-9" value={newCode} onChange={e => setNewCode(e.target.value)} />
          <button style={S.primaryBtnSm} onClick={addTote}>+ Add</button>
        </div>
      </div>
      <div style={S.cardGrid}>
        {[...totes].sort((a, b) => (pickedCountByTote[b.id] || 0) - (pickedCountByTote[a.id] || 0)).map(t => {
          const orphanedCount = pickedCountByTote[t.id] || 0;
          const isOrphaned = t.status === "open" && orphanedCount > 0;
          return (
          <div key={t.id} style={{ ...S.card, ...(isOrphaned ? { border: "2px solid #E5484D" } : {}) }}>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 15 }}>{t.tote_number}</span>
              <span style={{ ...S.badgeSm, color: t.status === "open" ? "#4CAF7D" : "#5B9EE8", borderColor: t.status === "open" ? "#4CAF7D" : "#5B9EE8" }}>{t.status}</span>
            </div>
            {isOrphaned && (
              <div style={{ background: "#FFF3F3", border: "1px solid #E5484D", borderRadius: 6, padding: "6px 8px", marginTop: 8, fontSize: 11, color: "#B0362E" }}>
                ⚠ {orphanedCount} order(s) yahan "Picked" status mein atke hain lekin tote "Open" hai — yeh releasing ki wajah se orphan ho gayi thi. Neeche se packer reassign karein.
              </div>
            )}
            <div style={{ color: "#6B6355", fontSize: 12, marginTop: 8 }}>
              {t.assigned_to ? `With: ${profiles[t.assigned_to]?.full_name || "—"}` : "Unassigned"}
            </div>
            {t.last_reassign_reason && (
              <div style={{ color: "#8A8272", fontSize: 10, marginTop: 6 }}>Last reassign: "{t.last_reassign_reason}" — {profiles[t.last_reassigned_by]?.full_name || "—"}, {fmtTime(t.last_reassigned_at)}</div>
            )}

            <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px solid #EFE8D8" }}>
              <div style={{ fontSize: 10, color: "#8A8272", marginBottom: 4, fontFamily: "'IBM Plex Mono', monospace" }}>REASSIGN TO PACKER/PICKER</div>
              <select style={{ ...S.input, fontSize: 12, marginBottom: 6, width: "100%" }} value={reassignForm[t.id]?.packerId || ""} onChange={e => setReassignForm(rf => ({ ...rf, [t.id]: { ...rf[t.id], packerId: e.target.value } }))}>
                <option value="">Select packer/picker…</option>
                {pickers.map(p => <option key={p.id} value={p.id}>{p.full_name} ({p.role})</option>)}
              </select>
              <select style={{ ...S.input, fontSize: 12, marginBottom: 6, width: "100%" }} value={reassignForm[t.id]?.status || t.status} onChange={e => setReassignForm(rf => ({ ...rf, [t.id]: { ...rf[t.id], status: e.target.value } }))}>
                <option value="open">Status: Open</option>
                <option value="assigned">Status: Assigned (picking in progress)</option>
                <option value="picked">Status: Picked (ready for packing)</option>
              </select>
              <button style={{ ...S.secondaryBtnSm, width: "100%", justifyContent: "center", color: "#4CAF7D", borderColor: "#4CAF7D" }} onClick={() => reassignTote(t)}>↻ Reassign (keeps its progress)</button>
            </div>

            {t.status !== "open" && (
              releaseReasonId === t.id ? (
                <div style={{ marginTop: 10 }}>
                  <input style={{ ...S.input, fontSize: 12 }} placeholder="Reason for release" value={releaseReason} onChange={e => setReleaseReason(e.target.value)} />
                  <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                    <button style={{ ...S.secondaryBtnSm, flex: 1, justifyContent: "center", color: "#E5484D", borderColor: "#E5484D" }} onClick={() => forceRelease(t)}>Confirm</button>
                    <button style={{ ...S.secondaryBtnSm, flex: 1, justifyContent: "center" }} onClick={() => { setReleaseReasonId(null); setReleaseReason(""); }}>Cancel</button>
                  </div>
                </div>
              ) : (
                <button style={{ ...S.secondaryBtnSm, marginTop: 10, width: "100%", justifyContent: "center", color: "#E5484D", borderColor: "#E5484D" }} onClick={() => setReleaseReasonId(t.id)}>🔓 Release (abandon — resets to Open)</button>
              )
            )}
          </div>
          );
        })}
        {totes.length === 0 && <EmptyNote text="No totes — add one above." />}
      </div>
    </div>
  );
}

/* ================= COMPLAINTS (product complaint resolution — direct pick & dispatch) ================= */
// A self-contained lane for ad-hoc complaint resolutions, separate from normal Picking/Packing.
// Compliance Officer looks up the product, sees exactly which bin(s) currently hold it, picks
// straight from there, and dispatches with a manually-entered courier CN — all in one screen.
// Inventory is only deducted at the "Mark Dispatch" step (not at creation), same principle used
// elsewhere in the app: nothing leaves stock until it's actually confirmed gone.
function ComplaintsView({ token, profile, showToast }) {
  const canManage = ["admin", "warehouse_lead", "compliance_officer", "dispatcher"].includes(profile.role);
  const [complaints, setComplaints] = useState([]);
  const [bins, setBins] = useState([]);
  const [staff, setStaff] = useState([]);
  const [loading, setLoading] = useState(true);

  const [orderRef, setOrderRef] = useState("");
  const [barcodeInput, setBarcodeInput] = useState("");
  const [matchedProduct, setMatchedProduct] = useState(null);
  const [availableBins, setAvailableBins] = useState([]);
  const [selectedBinId, setSelectedBinId] = useState("");
  const [qty, setQty] = useState("");
  const [comments, setComments] = useState("");
  const [creating, setCreating] = useState(false);
  const [dispatchForm, setDispatchForm] = useState({});
  const [dispatchingId, setDispatchingId] = useState(null);

  const load = async () => {
    if (!profile.warehouse_id) return;
    setLoading(true);
    try {
      const [c, b, s] = await Promise.all([
        sb(`/rest/v1/complaints?warehouse_id=eq.${profile.warehouse_id}&select=*&order=created_at.desc`, { token }),
        sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/profiles?warehouse_id=eq.${profile.warehouse_id}&select=id,full_name`, { token })
      ]);
      setComplaints(c || []); setBins(b || []); setStaff(s || []);
    } catch (e) { showToast("Load fail: " + e.message, "err"); }
    setLoading(false);
  };
  useEffect(() => { load(); }, [profile.warehouse_id]);

  const binCode = (id) => bins.find(b => b.id === id)?.code || "—";
  const staffName = (id) => staff.find(s => s.id === id)?.full_name || "—";

  const scanComplaintProduct = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : barcodeInput).trim();
    setBarcodeInput("");
    if (!code) return;
    const product = await lookupProductByCode(token, code);
    if (!product) { showToast("Barcode/SKU match nahi hua", "err"); return; }
    setMatchedProduct(product);
    setSelectedBinId(""); setQty("");
    try {
      const inv = await sb(`/rest/v1/inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${product.id}&select=*`, { token });
      const rows = (inv || []).filter(r => r.on_hand > 0).map(r => ({ bin_id: r.bin_id, on_hand: r.on_hand }));
      setAvailableBins(rows);
      showToast(rows.length ? `✓ Matched: ${product.barcode} — bin select karein` : `⚠ ${product.barcode} kisi bin mein available nahi hai`, rows.length ? "ok" : "err");
    } catch (e) { showToast("Inventory check fail", "err"); }
  };

  const createComplaint = async () => {
    if (!orderRef.trim()) { showToast("Order reference likhein", "err"); return; }
    if (!matchedProduct) { showToast("Pehle product scan karein", "err"); return; }
    if (!selectedBinId) { showToast("Bin select karein", "err"); return; }
    const bin = availableBins.find(b => b.bin_id === selectedBinId);
    const q = Number(qty);
    if (!q || q <= 0 || q > (bin?.on_hand || 0)) { showToast(`Valid qty enter karein (max ${bin?.on_hand || 0})`, "err"); return; }
    setCreating(true);
    try {
      await sb(`/rest/v1/complaints`, { method: "POST", token, body: { warehouse_id: profile.warehouse_id, order_reference: orderRef.trim(), product_id: matchedProduct.id, product_barcode: matchedProduct.barcode, product_name: matchedProduct.name, qty: q, bin_id: selectedBinId, comments: comments.trim() || null, status: "ready", created_by: profile.id } });
      showToast(`✅ Complaint ready ho gayi — ${matchedProduct.barcode}, bin ${binCode(selectedBinId)}`);
      setOrderRef(""); setMatchedProduct(null); setAvailableBins([]); setSelectedBinId(""); setQty(""); setComments("");
      load();
    } catch (e) { showToast("Create fail: " + e.message, "err"); }
    setCreating(false);
  };

  const markDispatch = async (c) => {
    const f = dispatchForm[c.id] || {};
    if (!f.courier?.trim() || !f.cn?.trim()) { showToast("Courier aur CN/tracking number enter karein", "err"); return; }
    setDispatchingId(c.id);
    try {
      await addOnHand(token, profile.warehouse_id, c.product_id, c.bin_id, -c.qty, { type: "complaint_dispatch", userId: profile.id });
      await sb(`/rest/v1/complaints?id=eq.${c.id}`, { method: "PATCH", token, body: { status: "dispatched", courier: f.courier.trim(), tracking_number: f.cn.trim(), dispatched_by: profile.id, dispatched_at: new Date().toISOString() } });
      showToast(`✅ Dispatch ho gaya — ${f.cn} — inventory update ho gayi`);
      load();
    } catch (e) { showToast("Dispatch fail: " + e.message, "err"); }
    setDispatchingId(null);
  };

  const readyComplaints = complaints.filter(c => c.status === "ready");
  const dispatchedComplaints = complaints.filter(c => c.status === "dispatched");

  if (loading) return <EmptyNote text="Loading..." />;
  if (!canManage) return <EmptyNote text="Is tab tak aapki access nahi hai." />;

  return (
    <div>
      <SectionTitle title="Complaints — Product Resolution" />

      <div style={S.panel}>
        <div style={S.panelTitle}>Nayi Complaint Banayein</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
          <input style={{ ...S.input, flex: 1, minWidth: 160, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Order reference / #" value={orderRef} onChange={e => setOrderRef(e.target.value)} />
          <input style={{ ...S.input, flex: 1, minWidth: 160, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Product barcode/SKU scan ya type karein" value={barcodeInput} onChange={e => setBarcodeInput(e.target.value)} onKeyDown={e => e.key === "Enter" && scanComplaintProduct()} />
          <CameraScanButton onScan={(text) => scanComplaintProduct(text)} />
          <button style={S.secondaryBtnSm} onClick={() => scanComplaintProduct()}>Scan</button>
        </div>

        {matchedProduct && (
          <div style={{ background: "#FFF9EE", border: "1px solid #F5A623", borderRadius: 8, padding: 12, marginBottom: 12 }}>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 15 }}>{matchedProduct.barcode}</div>
            <div style={{ color: "#2B2620", fontSize: 14, marginBottom: 10 }}>{matchedProduct.name}</div>
            {availableBins.length > 0 ? (
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                <select style={{ ...S.input, minWidth: 160 }} value={selectedBinId} onChange={e => setSelectedBinId(e.target.value)}>
                  <option value="">Bin select karein…</option>
                  {availableBins.map(b => <option key={b.bin_id} value={b.bin_id}>{binCode(b.bin_id)} ({b.on_hand} available)</option>)}
                </select>
                <input type="number" min={1} style={{ ...S.input, width: 100 }} placeholder="Qty" value={qty} onChange={e => setQty(e.target.value)} />
              </div>
            ) : <EmptyNote text="Yeh product kisi bin mein available nahi hai" />}
          </div>
        )}

        <textarea style={{ ...S.input, width: "100%", minHeight: 60, marginBottom: 12 }} placeholder="Comments / complaint ki wajah…" value={comments} onChange={e => setComments(e.target.value)} />
        <button style={S.primaryBtnSm} onClick={createComplaint} disabled={creating}>{creating ? "Ready ho raha…" : "+ Complaint Ready Karein"}</button>
      </div>

      <div style={S.panel}>
        <div style={S.panelTitle}>Ready — Dispatch Karein</div>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead><tr><th style={S.th}>Order Ref</th><th style={S.th}>Product</th><th style={S.th}>Bin</th><th style={S.th}>Qty</th><th style={S.th}>Comments</th><th style={S.th}>Courier</th><th style={S.th}>CN / Tracking#</th><th style={S.th}></th></tr></thead>
          <tbody>
            {readyComplaints.map(c => (
              <tr key={c.id}>
                <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace" }}>{c.order_reference}</td>
                <td style={S.td}>{c.product_name} <span style={{ color: "#8A8272", fontSize: 11 }}>({c.product_barcode})</span></td>
                <td style={{ ...S.td, color: "#6B6355" }}>{binCode(c.bin_id)}</td>
                <td style={S.td}>{c.qty}</td>
                <td style={{ ...S.td, fontSize: 12, color: "#6B6355" }}>{c.comments || "—"}</td>
                <td style={S.td}><input style={{ ...S.input, width: 100 }} placeholder="Courier" value={dispatchForm[c.id]?.courier || ""} onChange={e => setDispatchForm(f => ({ ...f, [c.id]: { ...f[c.id], courier: e.target.value } }))} /></td>
                <td style={S.td}><input style={{ ...S.input, width: 120, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="CN#" value={dispatchForm[c.id]?.cn || ""} onChange={e => setDispatchForm(f => ({ ...f, [c.id]: { ...f[c.id], cn: e.target.value } }))} /></td>
                <td style={S.td}><button style={S.primaryBtnSm} onClick={() => markDispatch(c)} disabled={dispatchingId === c.id}>{dispatchingId === c.id ? "…" : "🚚 Mark Dispatch"}</button></td>
              </tr>
            ))}
            {!readyComplaints.length && <tr><td style={S.td} colSpan={8}><EmptyNote text="Koi complaint dispatch k liye ready nahi" /></td></tr>}
          </tbody>
        </table>
      </div>

      <div style={S.panel}>
        <div style={S.panelTitle}>Dispatched — History</div>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead><tr><th style={S.th}>Order Ref</th><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Courier</th><th style={S.th}>CN#</th><th style={S.th}>By</th><th style={S.th}>At</th></tr></thead>
          <tbody>
            {dispatchedComplaints.map(c => (
              <tr key={c.id}>
                <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace" }}>{c.order_reference}</td>
                <td style={S.td}>{c.product_name}</td>
                <td style={S.td}>{c.qty}</td>
                <td style={S.td}>{c.courier}</td>
                <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{c.tracking_number}</td>
                <td style={{ ...S.td, color: "#6B6355" }}>{staffName(c.dispatched_by)}</td>
                <td style={S.td}>{fmtTime(c.dispatched_at)}</td>
              </tr>
            ))}
            {!dispatchedComplaints.length && <tr><td style={S.td} colSpan={7}><EmptyNote text="Abhi tak koi dispatch nahi hui" /></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function DamageView({ token, profile, showToast }) {
  const [rows, setRows] = useState([]);
  const [products, setProducts] = useState({});
  const [bins, setBins] = useState({});
  const [staff, setStaff] = useState({});
  const [orders, setOrders] = useState({});
  const [tab, setTab] = useState("pending");
  const [selected, setSelected] = useState({});
  const [busy, setBusy] = useState(false);
  const canProcess = ["admin", "warehouse_lead"].includes(profile.role);
  const [transferCode, setTransferCode] = useState("");
  const [transferProduct, setTransferProduct] = useState(null);
  const [transferBins, setTransferBins] = useState([]); // [{binId, avail}]
  const [transferBinId, setTransferBinId] = useState("");
  const [transferQty, setTransferQty] = useState("");
  const [transferring, setTransferring] = useState(false);

  const load = useCallback(async () => {
    try {
      const d = await sb(`/rest/v1/damage_inventory?warehouse_id=eq.${profile.warehouse_id}&select=*&order=reported_at.desc`, { token });
      setRows(d || []);
      const [prods, binList, profs] = await Promise.all([
        fetchProductsByIds(token, [...new Set((d || []).map(r => r.product_id))]),
        sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/profiles?select=*`, { token })
      ]);
      setProducts(prods);
      setBins(Object.fromEntries((binList || []).map(b => [b.id, b])));
      setStaff(Object.fromEntries((profs || []).map(p => [p.id, p])));
      const orderIds = [...new Set((d || []).map(r => r.order_id).filter(Boolean))];
      if (orderIds.length) {
        const os = await sb(`/rest/v1/sales_orders?id=in.(${orderIds.join(",")})&select=*`, { token });
        setOrders(Object.fromEntries((os || []).map(o => [o.id, o])));
      }
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const pending = rows.filter(r => !r.processed);
  const processed = rows.filter(r => r.processed);
  const visible = tab === "pending" ? pending : processed;

  const generateStr = async () => {
    const ids = Object.keys(selected).filter(k => selected[k]);
    if (ids.length === 0) { showToast("Kam se kam ek row select karein", "err"); return; }
    setBusy(true);
    try {
      const strNumber = `STR-${new Date().toISOString().slice(0, 10).replace(/-/g, "")}-${Date.now().toString().slice(-4)}`;
      for (const id of ids) {
        await sb(`/rest/v1/damage_inventory?id=eq.${id}`, { method: "PATCH", token, body: { str_number: strNumber, processed: true, processed_by: profile.id, processed_at: new Date().toISOString() } });
      }
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "damage_inventory", entity_id: ids[0], user_id: profile.id, action: "str_generated", metadata: { str_number: strNumber, count: ids.length } } });
      showToast(`${strNumber} generated for ${ids.length} item(s)`);
      setSelected({}); load();
    } catch (e) { showToast("STR generation failed", "err"); }
    setBusy(false);
  };

  // Manual bin → Damage transfer — a genuinely damaged item spotted in a bin outside of
  // picking/packing (e.g. during a walk-through) can be pulled straight out of inventory here,
  // same accountable path (damage_inventory + STR) as the automatic picking/packing reports.
  const scanForDamageTransfer = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : transferCode).trim();
    setTransferCode("");
    if (!code) return;
    const product = await lookupProductByCode(token, code);
    if (!product) { showToast("Barcode/SKU match nahi hua", "err"); return; }
    try {
      const invRows = await sb(`/rest/v1/inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${product.id}&select=*`, { token });
      const avail = (invRows || []).filter(r => r.on_hand > 0).map(r => ({ binId: r.bin_id, avail: r.on_hand }));
      if (!avail.length) { showToast("Is product ki kisi bin mein stock nahi hai", "err"); return; }
      setTransferProduct(product); setTransferBins(avail); setTransferBinId(""); setTransferQty("");
    } catch (e) { showToast("Lookup fail: " + e.message, "err"); }
  };

  const submitDamageTransfer = async () => {
    const qty = Number(transferQty);
    const avail = transferBins.find(b => b.binId === transferBinId)?.avail || 0;
    if (!transferBinId) { showToast("Bin select karein", "err"); return; }
    if (!qty || qty <= 0 || qty > avail) { showToast(`Valid qty enter karein (max ${avail} is bin mein)`, "err"); return; }
    setTransferring(true);
    try {
      await addOnHand(token, profile.warehouse_id, transferProduct.id, transferBinId, -qty, { type: "damage", userId: profile.id });
      const existing = await sb(`/rest/v1/damage_inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${transferProduct.id}&bin_id=eq.${transferBinId}&processed=eq.false&select=*`, { token });
      if (existing && existing.length > 0) {
        await sb(`/rest/v1/damage_inventory?id=eq.${existing[0].id}`, { method: "PATCH", token, body: { qty: existing[0].qty + qty } });
      } else {
        await sb(`/rest/v1/damage_inventory`, { method: "POST", token, body: { warehouse_id: profile.warehouse_id, product_id: transferProduct.id, bin_id: transferBinId, qty, found_at_stage: "warehouse_transfer", reported_by: profile.id } });
      }
      showToast(`✓ ${qty} × ${transferProduct.barcode} damage mein transfer ho gaya`);
      setTransferProduct(null); setTransferBins([]); setTransferBinId(""); setTransferQty("");
      load();
    } catch (e) { showToast("Transfer fail: " + e.message, "err"); }
    setTransferring(false);
  };

  return (
    <div>
      <SectionTitle title="Damage Inventory" />

      {canProcess && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Bin Se Damage Mein Transfer Karein</div>
          <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 14 }}>Kisi bhi bin mein agar damaged item mile (picking/packing k bagair), yahan se seedha transfer karein — inventory se qty nikal jayegi aur damage_inventory mein record ban jayega, jise aap "Pending STR" tab se STR bana k release kar sakte hain.</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
            <input style={{ ...S.input, minWidth: 180, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type barcode/SKU, then Enter" value={transferCode} onChange={e => setTransferCode(e.target.value)} onKeyDown={e => e.key === "Enter" && scanForDamageTransfer()} />
            <CameraScanButton onScan={(text) => scanForDamageTransfer(text)} />
            <button style={S.secondaryBtnSm} onClick={() => scanForDamageTransfer()}>Scan</button>
          </div>
          {transferProduct && (
            <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid #EFE8D8", display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 14 }}>{transferProduct.barcode}</div>
              <div style={{ fontSize: 13 }}>{transferProduct.name}</div>
              <select style={{ ...S.input, minWidth: 140 }} value={transferBinId} onChange={e => setTransferBinId(e.target.value)}>
                <option value="">Select bin…</option>
                {transferBins.map(b => <option key={b.binId} value={b.binId}>{bins[b.binId]?.code || b.binId} ({b.avail} avail)</option>)}
              </select>
              <input type="number" style={{ ...S.input, width: 90 }} placeholder="Qty" value={transferQty} onChange={e => setTransferQty(e.target.value)} />
              <button style={S.primaryBtnSm} onClick={submitDamageTransfer} disabled={transferring}>{transferring ? "Transfer ho raha…" : "→ Transfer to Damage"}</button>
              <button style={S.secondaryBtnSm} onClick={() => { setTransferProduct(null); setTransferBins([]); }}>Cancel</button>
            </div>
          )}
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <button onClick={() => setTab("pending")} style={{ ...S.pill, ...(tab === "pending" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>Pending STR ({pending.length})</button>
        <button onClick={() => setTab("processed")} style={{ ...S.pill, ...(tab === "processed" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>Processed ({processed.length})</button>
      </div>

      {tab === "pending" && canProcess && pending.length > 0 && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Selected ({Object.values(selected).filter(Boolean).length}) — generate STR</div>
          <button style={S.primaryBtnSm} onClick={generateStr} disabled={busy}>{busy ? "Generating…" : "📋 Generate STR for selected"}</button>
        </div>
      )}

      <div style={S.panel}>
        <table>
          <thead>
            <tr>
              {tab === "pending" && canProcess && <th style={S.th}></th>}
              <th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Bin</th><th style={S.th}>Qty</th>
              <th style={S.th}>Stage</th><th style={S.th}>Reported By</th><th style={S.th}>Reported At</th>
              <th style={S.th}>Order Ref</th>{tab === "processed" && <th style={S.th}>STR #</th>}
            </tr>
          </thead>
          <tbody>
            {visible.map(r => {
              const p = products[r.product_id];
              const bin = bins[r.bin_id];
              const order = r.order_id ? orders[r.order_id] : null;
              return (
                <tr key={r.id}>
                  {tab === "pending" && canProcess && (
                    <td style={S.td}><input type="checkbox" checked={!!selected[r.id]} onChange={e => setSelected({ ...selected, [r.id]: e.target.checked })} /></td>
                  )}
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                  <td style={S.td}>{p?.name || "—"}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{bin?.code || "—"}</td>
                  <td style={{ ...S.td, color: "#E5484D", fontWeight: 600 }}>{r.qty}</td>
                  <td style={S.td}><span style={{ ...S.badgeSm, color: "#B084F5", borderColor: "#B084F5" }}>{r.found_at_stage || "returns"}</span></td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{staff[r.reported_by]?.full_name || "—"}</td>
                  <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{fmtTime(r.reported_at)}</td>
                  <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace" }}>{order?.external_order_id || "—"}</td>
                  {tab === "processed" && <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#4CAF7D" }}>{r.str_number}</td>}
                </tr>
              );
            })}
            {visible.length === 0 && <tr><td colSpan={9}><EmptyNote text="No records." /></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ================= PNA — Product Not Available reconciliation (Admin/Warehouse Lead) ================= */
function PnaView({ token, profile, showToast }) {
  const [pnaSubTab, setPnaSubTab] = useState("pending");
  const [records, setRecords] = useState([]);
  const [bins, setBins] = useState([]);
  const [resolveTarget, setResolveTarget] = useState(null); // record being resolved
  const [resolveBinCode, setResolveBinCode] = useState("");
  const [busy, setBusy] = useState(false);

  const load = useCallback(async () => {
    try {
      const [pna, b, profs, orders] = await Promise.all([
        sb(`/rest/v1/pna_records?select=*&order=reported_at.desc`, { token }),
        sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/profiles?select=*`, { token }),
        sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token })
      ]);
      setBins(b || []);
      const binMap = Object.fromEntries((b || []).map(x => [x.id, x]));
      const profMap = Object.fromEntries((profs || []).map(x => [x.id, x]));
      const orderMap = Object.fromEntries((orders || []).map(x => [x.id, x]));
      const productIds = [...new Set((pna || []).map(r => r.product_id))];
      const prodMap = productIds.length ? await fetchProductsByIds(token, productIds) : {};
      setRecords((pna || []).map(r => ({
        ...r, product: prodMap[r.product_id],
        originalBinCode: binMap[r.original_bin_id]?.code || "—",
        resolvedBinCode: binMap[r.resolved_bin_id]?.code || "—",
        reporterName: profMap[r.reported_by]?.full_name || "—",
        resolverName: profMap[r.resolved_by]?.full_name || "—",
        orderRef: orderMap[r.order_id]?.external_order_id || "—"
      })));
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const transferToSaleable = async () => {
    if (!resolveTarget) return;
    const bin = bins.find(b => b.code.toLowerCase() === resolveBinCode.trim().toLowerCase());
    if (!bin) { showToast("Bin code sahi enter karein", "err"); return; }
    setBusy(true);
    try {
      const pnaBinRows = await sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&code=eq.PNA-HOLD&select=*`, { token });
      const pnaBin = pnaBinRows && pnaBinRows[0];
      if (pnaBin) await addOnHand(token, profile.warehouse_id, resolveTarget.product_id, pnaBin.id, -resolveTarget.qty, { type: "pna_resolve", userId: profile.id });

      await addOnHand(token, profile.warehouse_id, resolveTarget.product_id, bin.id, resolveTarget.qty, { type: "pna_resolve", userId: profile.id });

      await sb(`/rest/v1/pna_records?id=eq.${resolveTarget.id}`, { method: "PATCH", token, body: { status: "transferred", resolved_bin_id: bin.id, resolved_by: profile.id, resolved_at: new Date().toISOString() } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "pna_record", entity_id: resolveTarget.id, user_id: profile.id, action: "transferred_to_saleable", metadata: { bin: bin.code, qty: resolveTarget.qty } } });
      showToast(`✓ ${resolveTarget.qty} pcs saleable stock mein transfer ho gaye — Bin ${bin.code}`);
      setResolveTarget(null); setResolveBinCode(""); load();
    } catch (e) { showToast("Transfer failed", "err"); }
    setBusy(false);
  };

  const writeOff = async (r) => {
    setBusy(true);
    try {
      const pnaBinRows = await sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&code=eq.PNA-HOLD&select=*`, { token });
      const pnaBin = pnaBinRows && pnaBinRows[0];
      if (pnaBin) await addOnHand(token, profile.warehouse_id, r.product_id, pnaBin.id, -r.qty, { type: "pna_resolve", userId: profile.id });

      const strNumber = `STR-PNA-${new Date().toISOString().slice(0, 10).replace(/-/g, "")}-${Date.now().toString().slice(-4)}`;
      await sb(`/rest/v1/pna_records?id=eq.${r.id}`, { method: "PATCH", token, body: { status: "written_off", str_number: strNumber, resolved_by: profile.id, resolved_at: new Date().toISOString() } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "pna_record", entity_id: r.id, user_id: profile.id, action: "written_off", metadata: { str_number: strNumber, qty: r.qty } } });
      showToast(`${strNumber} — written off`);
      load();
    } catch (e) { showToast("Write-off failed", "err"); }
    setBusy(false);
  };

  const pending = records.filter(r => r.status === "pending");
  const resolved = records.filter(r => r.status !== "pending");

  return (
    <div>
      <SectionTitle title="PNA — Product Not Available" />
      <div style={S.panel}>
        <div style={{ color: "#6B6355", fontSize: 12, marginBottom: 14 }}>
          Picking ke doran jo item apni system-batayi location par nahi mila, uski qty yahan <b>PNA-HOLD</b> bin mein park hoti hai —
          taake physically verify kiya ja sake. Agar item kisi doosri bin mein mil jaye, "Transfer to Saleable" se sahi bin mein bhej dein.
          Agar genuinely nahi mila, "Write Off" se STR bana kar permanently hata dein.
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <button onClick={() => setPnaSubTab("pending")} style={{ ...S.pill, ...(pnaSubTab === "pending" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>Pending ({pending.length})</button>
          <button onClick={() => setPnaSubTab("resolved")} style={{ ...S.pill, ...(pnaSubTab === "resolved" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>Resolved ({resolved.length})</button>
        </div>

        {pnaSubTab === "pending" ? (
          <table>
            <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Original Bin</th><th style={S.th}>Order</th><th style={S.th}>Reported By</th><th style={S.th}>Date</th><th style={S.th}></th></tr></thead>
            <tbody>
              {pending.map(r => (
                <tr key={r.id}>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{r.product?.barcode || "—"}</td>
                  <td style={S.td}>{r.product?.name || "—"}</td>
                  <td style={{ ...S.td, color: "#E5484D", fontWeight: 600 }}>{r.qty}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{r.originalBinCode}</td>
                  <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace" }}>{r.orderRef}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{r.reporterName}</td>
                  <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{fmtTime(r.reported_at)}</td>
                  <td style={S.td}>
                    {resolveTarget?.id === r.id ? (
                      <div style={{ display: "flex", gap: 6 }}>
                        <input style={{ ...S.input, width: 110, padding: "4px 8px" }} placeholder="Bin code" value={resolveBinCode} onChange={e => setResolveBinCode(e.target.value)} />
                        <button style={S.primaryBtnSm} disabled={busy} onClick={transferToSaleable}>✓</button>
                        <button style={S.secondaryBtnSm} onClick={() => setResolveTarget(null)}>✕</button>
                      </div>
                    ) : (
                      <div style={{ display: "flex", gap: 6 }}>
                        <button style={S.secondaryBtnSm} onClick={() => { setResolveTarget(r); setResolveBinCode(""); }}>📍 Transfer to Saleable</button>
                        <button style={{ ...S.secondaryBtnSm, color: "#E5484D", borderColor: "#E5484D" }} disabled={busy} onClick={() => writeOff(r)}>Write Off</button>
                      </div>
                    )}
                  </td>
                </tr>
              ))}
              {pending.length === 0 && <tr><td colSpan={8}><EmptyNote text="No pending PNA records." /></td></tr>}
            </tbody>
          </table>
        ) : (
          <table>
            <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Status</th><th style={S.th}>Original Bin</th><th style={S.th}>Resolved Bin</th><th style={S.th}>Resolved By</th><th style={S.th}>Resolved At</th><th style={S.th}>STR #</th></tr></thead>
            <tbody>
              {resolved.map(r => (
                <tr key={r.id}>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{r.product?.barcode || "—"}</td>
                  <td style={S.td}>{r.product?.name || "—"}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{r.qty}</td>
                  <td style={S.td}>
                    {r.status === "transferred"
                      ? <span style={{ ...S.badgeSm, color: "#4CAF7D", borderColor: "#4CAF7D" }}>Transferred</span>
                      : <span style={{ ...S.badgeSm, color: "#E5484D", borderColor: "#E5484D" }}>Written Off</span>}
                  </td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{r.originalBinCode}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{r.status === "transferred" ? r.resolvedBinCode : "—"}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{r.resolverName}</td>
                  <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{r.resolved_at ? fmtTime(r.resolved_at) : "—"}</td>
                  <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace" }}>{r.str_number || "—"}</td>
                </tr>
              ))}
              {resolved.length === 0 && <tr><td colSpan={9}><EmptyNote text="No PNA records resolved yet." /></td></tr>}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

    { min: 80, label: "Average", color: "#F5A623" },
    { min: 0, label: "Poor", color: "#E5484D" }

    const d = new Date(); const q = Math.floor(d.getMonth() / 3) + 1;

  });

  const PACKER_TIERS = [

    { min: 40, label: "Meets Expectation", tag: "Target Met", color: "#5B9EE8" },
    { min: 0, label: "Needs Improvement", tag: "Below Target", color: "#E5484D" }
  ];
  const tierFor = (ordersPerDay) => PACKER_TIERS.find(t => ordersPerDay >= t.min);

  useEffect(() => {

      setLoading(true);
      try {
        const [tg, profs, pickTasksAll, pickLinesAll, packTasksAll, putawayAll, pnaAll, shortageAll,
