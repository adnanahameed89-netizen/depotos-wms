        await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: order.id, user_id: profile.id, action: "marked_incomplete" } });
        showToast("Stock kam hai — order 'Incomplete' tab mein chala gaya", "err");
        load();
        return;
      }

      const lineBins = {};
      for (const { line, summary } of summaries) {
        const bestBin = [...summary.rows].sort((a, b) => b.on_hand - a.on_hand)[0];
        lineBins[line.product_id] = bestBin ? bestBin.bin_id : null;
        await adjustReserved(token, profile.warehouse_id, line.product_id, line.qty);
      }
      const pt = await sb(`/rest/v1/pick_tasks`, { method: "POST", token, prefer: "return=representation", body: { order_id: order.id, status: "queued" } });
      for (const { line } of summaries) {
        await sb(`/rest/v1/pick_task_lines`, { method: "POST", token, body: { pick_task_id: pt[0].id, product_id: line.product_id, qty_required: line.qty, bin_id: lineBins[line.product_id] || null } });
      }
      await sb(`/rest/v1/sales_orders?id=eq.${order.id}`, { method: "PATCH", token, body: { status: "queued" } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: order.id, user_id: profile.id, action: "reserved_and_queued" } });
      showToast("Reserved & queued for picking");
      load();
    } catch (e) { showToast("Reserve failed", "err"); }
  };

  const openOrderDetail = async (order) => {
    const [lines, events, shortages, pickTasks, packTasks, loadSheets] = await Promise.all([
      sb(`/rest/v1/sales_order_lines?order_id=eq.${order.id}&select=*`, { token }),
      sb(`/rest/v1/event_log?entity_id=eq.${order.id}&select=*&order=created_at.asc`, { token }),
      sb(`/rest/v1/order_shortage_lines?order_id=eq.${order.id}&select=*`, { token }),
      sb(`/rest/v1/pick_tasks?order_id=eq.${order.id}&select=*`, { token }),
      sb(`/rest/v1/pack_tasks?order_id=eq.${order.id}&select=*`, { token }),
      sb(`/rest/v1/load_sheets?warehouse_id=eq.${profile.warehouse_id}&order_ids=cs.{${order.id}}&select=*`, { token })
    ]);
    setOpenLines(lines || []);
    setOpenShortages(shortages || []);

    const history = (events || []).map(ev => ({
      ts: ev.created_at, label: ev.action, user: profiles[ev.user_id]?.full_name || "System"
    }));
    for (const pt of pickTasks || []) {
      if (pt.assigned_at) history.push({ ts: pt.assigned_at, label: "Assigned to picker", user: profiles[pt.assigned_to]?.full_name || "—" });
      if (pt.completed_at) history.push({ ts: pt.completed_at, label: "Picking completed", user: profiles[pt.assigned_to]?.full_name || "—" });
    }
    for (const pk of packTasks || []) {
      if (pk.completed_at) history.push({ ts: pk.completed_at, label: `Packed & labeled (${pk.label_number || "—"})`, user: profiles[pk.assigned_to]?.full_name || "—" });
    }
    for (const ls of loadSheets || []) {
      history.push({ ts: ls.created_at, label: `Dispatched — Load Sheet ${ls.load_sheet_number}`, user: profiles[ls.created_by]?.full_name || "—" });
    }
    history.sort((a, b) => new Date(a.ts) - new Date(b.ts));
    setOpenEvents(history);

    const newProducts = await fetchProductsByIds(token, (lines || []).map(l => l.product_id));
    setProductCache(prev => ({ ...prev, ...newProducts }));
    setEditTracking(order.external_order_id);
    setEditCourier(order.courier);
    setEditQty({});
    setOpenOrder(order);
  };

  const canEditIncomplete = ["admin", "warehouse_lead"].includes(profile.role);

  const [orderSearch, setOrderSearch] = useState("");
  const searchOrderHistory = async () => {
    const code = orderSearch.trim();
    if (!code) return;
    let found = orders.find(o => o.external_order_id === code || o.external_order_id.includes(code));
    if (!found) {
      const rows = await sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&external_order_id=eq.${encodeURIComponent(code)}&select=*`, { token });
      found = rows && rows[0];
    }
    if (!found) { showToast("Order nahi mila — number check karein", "err"); return; }
    setOrderSearch("");
    openOrderDetail(found);
  };

  const saveOrderEdits = async () => {
    try {
      await sb(`/rest/v1/sales_orders?id=eq.${openOrder.id}`, { method: "PATCH", token, body: { external_order_id: editTracking.trim(), courier: editCourier.trim() } });
      for (const l of openLines) {
        const newQty = editQty[l.id] !== undefined ? Number(editQty[l.id]) : l.qty;
        if (newQty !== l.qty && newQty > 0) {
          await sb(`/rest/v1/sales_order_lines?id=eq.${l.id}`, { method: "PATCH", token, body: { qty: newQty } });
        }
      }
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: openOrder.id, user_id: profile.id, action: "amended", metadata: { tracking: editTracking, courier: editCourier } } });
      showToast("Order amended");
      openOrderDetail({ ...openOrder, external_order_id: editTracking.trim(), courier: editCourier.trim() });
    } catch (e) { showToast("Save failed — tracking number already exist ho sakta hai", "err"); }
  };

  const retryReserve = async () => {
    await sb(`/rest/v1/sales_orders?id=eq.${openOrder.id}`, { method: "PATCH", token, body: { status: "received" } });
    await reserveAndQueue({ ...openOrder, status: "received" });
    setOpenOrder(null);
  };

  if (openOrder) {
    return (
      <div>
        <SectionTitle title={`Order ${openOrder.external_order_id}`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenOrder(null)}>← Back to orders</button>} />
        <div style={S.panel}>
          {openOrder.status === "incomplete" && canEditIncomplete ? (
            <div style={{ display: "flex", gap: 16, flexWrap: "wrap", alignItems: "flex-end" }}>
              <div>
                <div style={S.label}>TRACKING NUMBER</div>
                <input style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} value={editTracking} onChange={e => setEditTracking(e.target.value)} />
              </div>
              <div>
                <div style={S.label}>COURIER</div>
                <select style={S.input} value={editCourier} onChange={e => setEditCourier(e.target.value)}>
                  <option value="Postex">Postex</option>
                  <option value="M&P">M&P</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <button style={S.secondaryBtnSm} onClick={saveOrderEdits}>💾 Save changes</button>
            </div>
          ) : (
            <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
              <div><div style={S.label}>COURIER</div><div style={{ color: "#ECEAE3", fontSize: 14 }}>{openOrder.courier}</div></div>
              <div><div style={S.label}>STATUS</div><span style={{ ...S.badgeSm, color: STATUS_COLORS[openOrder.status] || "#5B9EE8", borderColor: STATUS_COLORS[openOrder.status] || "#5B9EE8" }}>{openOrder.status}</span></div>
              <div><div style={S.label}>RECEIVED</div><div style={{ color: "#8B93A3", fontSize: 13, fontFamily: "'IBM Plex Mono', monospace" }}>{fmtTime(openOrder.received_at)}</div></div>
              {openOrder.dispatched_at && <div><div style={S.label}>DISPATCHED</div><div style={{ color: "#8B93A3", fontSize: 13, fontFamily: "'IBM Plex Mono', monospace" }}>{fmtTime(openOrder.dispatched_at)}</div></div>}
            </div>
          )}
        </div>

        {openOrder.status === "incomplete" && (
          <div style={{ ...S.panel, borderColor: "#E5484D" }}>
            <div style={{ ...S.panelTitle, color: "#E5484D" }}>⚠ Shortage report — kam quantity available thi</div>
            <table>
              <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Required</th><th style={S.th}>Available</th><th style={S.th}>Not Available</th></tr></thead>
              <tbody>
                {openShortages.map(s => {
                  const p = productCache[s.product_id];
                  return (
                    <tr key={s.id}>
                      <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                      <td style={S.td}>{p?.name || "—"}</td>
                      <td style={{ ...S.td, color: "#8B93A3" }}>{s.qty_required}</td>
                      <td style={{ ...S.td, color: "#8B93A3" }}>{s.qty_available}</td>
                      <td style={{ ...S.td, color: "#E5484D", fontWeight: 600 }}>{s.not_available_qty}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {canEditIncomplete && (
              <button style={{ ...S.primaryBtnSm, marginTop: 14 }} onClick={retryReserve}>🔄 Retry reserve (after correction/restock)</button>
            )}
          </div>
        )}

        <div style={S.panel}>
          <div style={S.panelTitle}>Line items{openOrder.status === "incomplete" && canEditIncomplete ? " (editable)" : ""}</div>
          <table>
            <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Qty</th></tr></thead>
            <tbody>
              {openLines.map(l => {
                const p = productCache[l.product_id];
                return (
                  <tr key={l.id}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                    <td style={S.td}>{p?.name || "—"}</td>
                    <td style={S.td}>
                      {openOrder.status === "incomplete" && canEditIncomplete ? (
                        <input type="number" min={1} style={{ ...S.input, width: 80, padding: "4px 8px" }} value={editQty[l.id] !== undefined ? editQty[l.id] : l.qty} onChange={e => setEditQty({ ...editQty, [l.id]: e.target.value })} />
                      ) : l.qty}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div style={S.panel}>
          <div style={S.panelTitle}>Order history — kisne kya kiya, kab</div>
          {openEvents.length === 0 ? <EmptyNote text="Abhi tak koi activity nahi hui." /> : openEvents.map((ev, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #262B35" }}>
              <span style={{ color: "#ECEAE3", fontSize: 13 }}>{ev.label} <span style={{ color: "#8B93A3" }}>— {ev.user}</span></span>
              <span style={{ color: "#5A6070", fontSize: 11, fontFamily: "'IBM Plex Mono', monospace" }}>{fmtTime(ev.ts)}</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle title="Sales Orders" action={
        <div style={{ display: "flex", gap: 8 }}>
          <label style={{ ...S.secondaryBtnSm, cursor: "pointer" }}>
            {importing ? "Importing…" : "📤 Upload orders file"}
            <input type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={handleOrdersFile} disabled={importing} />
          </label>
          <button style={S.primaryBtnSm} onClick={() => setShowForm(s => !s)}>+ New order</button>
        </div>
      } />
      <div style={{ margin: "0 0 14px" }}>
        <div style={{ display: "flex", gap: 10 }}>
          <input style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="🔍 Order/Tracking number se seedha history dekhein…"
            value={orderSearch} onChange={e => setOrderSearch(e.target.value)}
            onKeyDown={e => e.key === "Enter" && searchOrderHistory()} />
          <button style={S.primaryBtnSm} onClick={searchOrderHistory}>Find</button>
        </div>
      </div>
      {importSummary && (
        <div style={{ ...S.panel, borderColor: "#4CAF7D", color: "#4CAF7D", fontSize: 12 }}>{importSummary}</div>
      )}
      {ordersReport && (
        <ImportReportPanel report={ordersReport.report} importing={importing}
          onConfirm={confirmOrdersImport} onCancel={() => setOrdersReport(null)} confirmLabel="Confirm & import orders" />
      )}
      {!ordersReport && showForm && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Create order (manual entry — courier integration comes later)</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
            <input style={{ ...S.input, flex: 1, minWidth: 160, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Order ID (from M&P/Postex)" value={extId} onChange={e => setExtId(e.target.value)} />
            <select style={{ ...S.input, minWidth: 140 }} value={courier} onChange={e => setCourier(e.target.value)}>
              <option value="Postex">Postex</option>
              <option value="M&P">M&P</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10, flexWrap: "wrap" }}>
            <ProductPicker token={token} onSelect={(p) => setPendingProduct(p)} />
            {pendingProduct && (
              <span style={{ ...S.badgeSm, color: "#F5A623", borderColor: "#F5A623" }}>{pendingProduct.barcode} — {pendingProduct.name} <span style={{ cursor: "pointer", marginLeft: 6 }} onClick={() => setPendingProduct(null)}>✕</span></span>
            )}
            <input style={{ ...S.input, width: 90 }} type="number" min={1} value={lineQty} onChange={e => setLineQty(e.target.value)} />
            <button style={S.secondaryBtnSm} onClick={addLine}>+ Add line</button>
          </div>
          {items.length > 0 && (
            <div style={{ marginBottom: 12 }}>
              {items.map((it, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", background: "#14161B", border: "1px solid #333A47", borderRadius: 6, padding: "8px 10px", marginBottom: 6, fontSize: 13 }}>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{it.barcode}</span>
                  <span style={{ color: "#ECEAE3", flex: 1, marginLeft: 8 }}>{it.name}</span>
                  <span style={{ color: "#8B93A3" }}>× {it.qty}</span>
                </div>
              ))}
            </div>
          )}
          <button style={S.primaryBtnSm} onClick={createOrder}>Create order</button>
        </div>
      )}

      {(() => {
        const STAGES = [
          { key: "received", label: "New / Received", color: "#8B93A3", icon: "🧾" },
          { key: "queued", label: "Queued for Pick", color: "#5B9EE8", icon: "🛒" },
          { key: "picking", label: "Picking", color: "#5B9EE8", icon: "🚶" },
          { key: "packed", label: "Packed", color: "#F5A623", icon: "🏷" },
          { key: "rtd", label: "RTD", color: "#B084F5", icon: "📦" },
          { key: "dispatched", label: "Dispatched", color: "#4CAF7D", icon: "🚚" },
          { key: "incomplete", label: "Incomplete", color: "#E5484D", icon: "⚠" }
        ];
        const counts = Object.fromEntries(STAGES.map(s => [s.key, orders.filter(o => o.status === s.key).length]));
        return (
          <div style={{ display: "grid", gridTemplateColumns: `repeat(${STAGES.length + 1}, 1fr)`, gap: 10, marginBottom: 18 }}>
            <div onClick={() => setStatusFilter(null)}
              style={{ ...S.statCard, cursor: "pointer", ...(statusFilter === null ? { borderColor: "#F5A623" } : {}) }}>
              <span style={{ fontSize: 16 }}>📋</span>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 22, fontWeight: 700, color: "#ECEAE3", marginTop: 8 }}>{orders.length}</div>
              <div style={{ color: "#8B93A3", fontSize: 11, marginTop: 2 }}>All orders</div>
            </div>
            {STAGES.map(s => (
              <div key={s.key} onClick={() => setStatusFilter(s.key)}
                style={{ ...S.statCard, cursor: "pointer", ...(statusFilter === s.key ? { borderColor: s.color } : {}) }}>
                <span style={{ fontSize: 16 }}>{s.icon}</span>
                <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 22, fontWeight: 700, color: s.color, marginTop: 8 }}>{counts[s.key] || 0}</div>
                <div style={{ color: "#8B93A3", fontSize: 11, marginTop: 2 }}>{s.label}</div>
              </div>
            ))}
          </div>
        );
      })()}

      {receivedOrders.length > 0 && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Smart Picking — order classification</div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => setSkuFilter("all")} style={{ ...S.pill, ...(skuFilter === "all" ? { background: "#F5A623", color: "#14161B", borderColor: "#F5A623" } : {}) }}>All ({receivedOrders.length})</button>
            <button onClick={() => setSkuFilter("single")} style={{ ...S.pill, ...(skuFilter === "single" ? { background: "#4CAF7D", color: "#14161B", borderColor: "#4CAF7D" } : {}) }}>Single-SKU ({singleCount})</button>
            <button onClick={() => setSkuFilter("multi")} style={{ ...S.pill, ...(skuFilter === "multi" ? { background: "#5B9EE8", color: "#14161B", borderColor: "#5B9EE8" } : {}) }}>Multi-SKU ({multiCount})</button>
          </div>
          <div style={{ color: "#5A6070", fontSize: 11, marginTop: 8 }}>Single-SKU orders ek hi product ke liye hain — inhe ek aisle-trip mein saath batch karna zyada efficient hota hai.</div>
        </div>
      )}

      {receivedOrders.length > 0 && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Bulk assign to picker ({selectedCount}/15 selected)</div>
          {totes.length === 0 && (
            <div style={{ color: "#E5484D", fontSize: 12, marginBottom: 10 }}>⚠ Koi available tote nahi hai — Admin se Tote Master check karwayein.</div>
          )}
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <select style={{ ...S.input, minWidth: 140, fontFamily: "'IBM Plex Mono', monospace" }} value={bulkToteId} onChange={e => setBulkToteId(e.target.value)}>
              <option value="">🧺 Select tote…</option>
              {totes.map(t => <option key={t.id} value={t.id}>{t.tote_number}</option>)}
            </select>
            <select style={{ ...S.input, minWidth: 180 }} value={bulkPickerId} onChange={e => setBulkPickerId(e.target.value)}>
              <option value="">Assign to…</option>
              {pickers.map(p => <option key={p.id} value={p.id}>{p.full_name} ({p.role})</option>)}
            </select>
            <button style={S.primaryBtnSm} onClick={bulkReserveAndAssign} disabled={bulkBusy || selectedCount === 0 || selectedCount > 15}>
              {bulkBusy ? "Assigning…" : `Reserve & Assign (${selectedCount})`}
            </button>
          </div>
        </div>
      )}

      <div style={S.panel}>
        <table>
          <thead>
            <tr>
              <th style={S.th}><input type="checkbox" onChange={e => toggleAll(e.target.checked)} checked={selectedCount > 0 && selectedCount === filteredReceived.length} /></th>
              <th style={S.th}>Order #</th><th style={S.th}>Courier</th><th style={S.th}>Status</th>
              <th style={S.th}>Items</th><th style={S.th}>Qty</th><th style={S.th}>Type</th><th style={S.th}>Received</th><th style={S.th}></th>
            </tr>
          </thead>
          <tbody>
            {orders.filter(o => (!statusFilter || o.status === statusFilter) && (o.status !== "received" || skuFilter === "all" || orderSkuType(o.id) === skuFilter)).map(o => {
              const stat = lineStats[o.id] || { count: 0, qty: 0 };
              const type = o.status === "received" ? orderSkuType(o.id) : null;
              return (
                <tr key={o.id} style={{ cursor: "pointer" }} onClick={() => openOrderDetail(o)}>
                  <td style={S.td} onClick={e => e.stopPropagation()}>
                    {o.status === "received" && (
                      <input type="checkbox" checked={!!selectedOrders[o.id]} onChange={e => setSelectedOrders({ ...selectedOrders, [o.id]: e.target.checked })} />
                    )}
                  </td>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{o.external_order_id}</td>
                  <td style={S.td}>{o.courier}</td>
                  <td style={S.td}><span style={{ ...S.badgeSm, color: STATUS_COLORS[o.status] || "#5B9EE8", borderColor: STATUS_COLORS[o.status] || "#5B9EE8" }}>{o.status}</span></td>
                  <td style={{ ...S.td, color: "#8B93A3" }}>{stat.count}</td>
                  <td style={{ ...S.td, color: "#8B93A3" }}>{stat.qty}</td>
                  <td style={S.td}>
                    {type && <span style={{ ...S.badgeSm, color: type === "single" ? "#4CAF7D" : "#5B9EE8", borderColor: type === "single" ? "#4CAF7D" : "#5B9EE8" }}>{type === "single" ? "Single-SKU" : "Multi-SKU"}</span>}
                  </td>
                  <td style={{ ...S.td, color: "#8B93A3", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{fmtTime(o.received_at)}</td>
                  <td style={S.td}>
                    {o.status === "received" && (
                      <button style={S.secondaryBtnSm} onClick={(e) => { e.stopPropagation(); reserveAndQueue(o); }}>Reserve only</button>
                    )}
                  </td>
                </tr>
              );
            })}
            {orders.filter(o => (!statusFilter || o.status === statusFilter) && (o.status !== "received" || skuFilter === "all" || orderSkuType(o.id) === skuFilter)).length === 0 && (
              <tr><td colSpan={9}><EmptyNote text="Is status mein koi order nahi hai." /></td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ================= PICKING ================= */
function PickingView({ token, profile, showToast }) {
  const [tasks, setTasks] = useState([]);
  const [orders, setOrders] = useState({});
  const [products, setProducts] = useState({});
  const [pickers, setPickers] = useState([]);
  const [bins, setBins] = useState({});
  const [taskLines, setTaskLines] = useState({});
  const [totes, setTotes] = useState([]);
  const [selectedForTote, setSelectedForTote] = useState({});
  const [toteAssignPicker, setToteAssignPicker] = useState("");
  const [selectedToteId, setSelectedToteId] = useState("");
  const [openTote, setOpenTote] = useState(null);
  const [consolidated, setConsolidated] = useState([]);
  const [toteScans, setToteScans] = useState({});
  const [barcodeInput, setBarcodeInput] = useState("");
  const canBatch = ["admin", "supervisor", "warehouse_lead"].includes(profile.role);

  const load = useCallback(async () => {
    try {
      const [t, o, pk, b, tt] = await Promise.all([
        sb(`/rest/v1/pick_tasks?status=neq.picked&select=*&order=id.asc`, { token }),
        sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/profiles?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/totes?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token })
      ]);
      setTasks(t || []);
      setOrders(Object.fromEntries((o || []).map(x => [x.id, x])));
      setPickers((pk || []).filter(u => ["picker", "packer"].includes(u.role)));
      setBins(Object.fromEntries((b || []).map(x => [x.id, x])));
      setTotes(tt || []);
      const taskIds = (t || []).map(x => x.id);
      if (taskIds.length) {
        const lines = await sb(`/rest/v1/pick_task_lines?pick_task_id=in.(${taskIds.join(",")})&select=*`, { token });
        const newProducts = await fetchProductsByIds(token, lines.map(l => l.product_id));
        setProducts(prev => ({ ...prev, ...newProducts }));
        const grouped = {};
        for (const l of lines || []) { (grouped[l.pick_task_id] = grouped[l.pick_task_id] || []).push(l); }
        setTaskLines(grouped);
      }
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const queuedTasks = tasks.filter(t => t.status === "queued" && !t.tote_id);
  const selectedCount = Object.values(selectedForTote).filter(Boolean).length;
  const availableTotes = totes.filter(t => t.status === "open");

  const createTote = async () => {
    const ids = Object.keys(selectedForTote).filter(k => selectedForTote[k]);
    if (ids.length === 0 || ids.length > 15) { showToast("1 se 15 orders select karein", "err"); return; }
    if (!toteAssignPicker) { showToast("Picker select karein", "err"); return; }
    if (!selectedToteId) { showToast("Tote select karein — koi available nahi hai to admin se check karwayein", "err"); return; }
    try {
      await sb(`/rest/v1/totes?id=eq.${selectedToteId}`, { method: "PATCH", token, body: { status: "picking", assigned_to: toteAssignPicker } });
      let binNum = 1;
      for (const id of ids) {
        await sb(`/rest/v1/pick_tasks?id=eq.${id}`, { method: "PATCH", token, body: { tote_id: selectedToteId, assigned_to: toteAssignPicker, status: "assigned", assigned_at: new Date().toISOString(), tote_bin_number: binNum } });
        binNum++;
      }
      const toteNumber = totes.find(t => t.id === selectedToteId)?.tote_number;
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "tote", entity_id: selectedToteId, user_id: profile.id, action: "assigned", metadata: { orders: ids.length, assigned_to: toteAssignPicker } } });
      showToast(`${toteNumber} assigned with ${ids.length} orders`);
      setSelectedForTote({}); setToteAssignPicker(""); setSelectedToteId(""); load();
    } catch (e) { showToast("Tote assignment failed", "err"); }
  };

  const openToteDetail = (tote) => {
    const toteTasks = tasks.filter(t => t.tote_id === tote.id);
    const groups = {};
    for (const t of toteTasks) {
      for (const l of (taskLines[t.id] || [])) {
        const key = `${l.bin_id || "none"}|${l.product_id}`;
        if (!groups[key]) groups[key] = { bin_id: l.bin_id, product_id: l.product_id, required: 0, scanned: 0, refs: [] };
        groups[key].required += l.qty_required;
        groups[key].refs.push({ pick_task_id: t.id, order_id: t.order_id, toteBin: t.tote_bin_number, line_id: l.id, qty_required: l.qty_required, allocated: 0 });
      }
    }
    for (const g of Object.values(groups)) g.refs.sort((a, b) => (a.toteBin || 99) - (b.toteBin || 99));
    const list = Object.values(groups).sort((a, b) => (bins[a.bin_id]?.code || "zzz").localeCompare(bins[b.bin_id]?.code || "zzz"));
    setConsolidated(list);
    setOpenTote(tote);
  };

  const scanToteBarcode = (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : barcodeInput).trim();
    setBarcodeInput("");
    if (!code) return;
    const c = cleanCode(code);
    const p = Object.values(products).find(x => cleanCode(x.barcode) === c || cleanCode(x.sku) === c);
    if (!p) { showToast("Barcode/SKU match nahi hua", "err"); return; }
    const group = consolidated.find(g => g.product_id === p.id && g.scanned < g.required);
    if (!group) { showToast("Yeh product is tote mein nahi hai ya already complete — WRONG ITEM", "err"); return; }
    const ref = group.refs.find(r => r.allocated < r.qty_required);
    if (!ref) { showToast("Allocation error — dobara try karein", "err"); return; }
    ref.allocated += 1;
    group.scanned += 1;
    setConsolidated([...consolidated]);
    const order = orders[ref.order_id];
    showToast(`✓ ${p.barcode} → Tote Bin #${ref.toteBin || "?"} (Order ${order?.external_order_id || ""})`);
  };

  const allToteScanned = consolidated.length > 0 && consolidated.every(g => g.scanned >= g.required);

  const completeTotePicking = async () => {
    try {
      for (const g of consolidated) {
        for (const ref of g.refs) {
          await sb(`/rest/v1/pick_task_lines?id=eq.${ref.line_id}`, { method: "PATCH", token, body: { qty_picked: ref.allocated } });
        }
      }
      const toteTasks = tasks.filter(t => t.tote_id === openTote.id);
      for (const t of toteTasks) {
        await sb(`/rest/v1/pick_tasks?id=eq.${t.id}`, { method: "PATCH", token, body: { status: "picked", completed_at: new Date().toISOString() } });
        await sb(`/rest/v1/pack_tasks`, { method: "POST", token, body: { order_id: t.order_id, status: "pending", tote_id: openTote.id } });
        await sb(`/rest/v1/sales_orders?id=eq.${t.order_id}`, { method: "PATCH", token, body: { status: "picking" } });
        await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "pick_task", entity_id: t.id, user_id: profile.id, action: "completed" } });
      }
      await sb(`/rest/v1/totes?id=eq.${openTote.id}`, { method: "PATCH", token, body: { status: "picked", completed_at: new Date().toISOString() } });
      showToast("Tote fully picked — ready for packer");
      setOpenTote(null); load();
    } catch (e) { showToast("Failed to complete", "err"); }
  };

  if (openTote) {
    return (
      <div>
        <SectionTitle title={`${openTote.tote_number} — consolidated pick list`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenTote(null)}>← Back</button>} />
        <div style={S.panel}>
          <div style={S.panelTitle}>Scan product at each location (koi bhi sequence mein)</div>
          <div style={{ display: "flex", gap: 10 }}>
            <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type barcode / SKU, then Enter"
              value={barcodeInput} onChange={e => setBarcodeInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && scanToteBarcode()} />
            <CameraScanButton onScan={(text) => scanToteBarcode(text)} />
            <button style={S.primaryBtnSm} onClick={() => scanToteBarcode()}>Scan</button>
          </div>
        </div>
        <div style={S.panel}>
          <div style={S.panelTitle}>Pick list — location-wise (ek bin ek hi baar visit karein)</div>
          {consolidated.map((g, i) => {
            const p = products[g.product_id];
            const bin = bins[g.bin_id];
            const done = g.scanned >= g.required;
            return (
              <div key={i} style={{ padding: "8px 0", borderBottom: "1px solid #262B35" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ color: "#5B9EE8", fontFamily: "'IBM Plex Mono', monospace", width: 90 }}>📍 {bin?.code || "no bin!"}</span>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", width: 100 }}>{p?.barcode}</span>
                  <span style={{ flex: 1, color: "#ECEAE3", fontSize: 13 }}>{p?.name}</span>
                  <span style={{ ...S.badgeSm, color: done ? "#4CAF7D" : "#8B93A3", borderColor: done ? "#4CAF7D" : "#333A47" }}>{g.scanned} / {g.required}</span>
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 4, paddingLeft: 100 }}>
                  {g.refs.map((r, j) => (
                    <span key={j} style={{ fontSize: 10, color: r.allocated >= r.qty_required ? "#4CAF7D" : "#5A6070", fontFamily: "'IBM Plex Mono', monospace" }}>
                      Bin#{r.toteBin || "?"}: {r.allocated}/{r.qty_required}
                    </span>
                  ))}
                </div>
              </div>
            );
          })}
          {consolidated.length === 0 && <EmptyNote text="Is tote mein koi item nahi hai." />}
          {allToteScanned && consolidated.length > 0 && (
            <button style={{ ...S.primaryBtnSm, marginTop: 16 }} onClick={completeTotePicking}>✓ Complete tote picking — send to packer</button>
          )}
        </div>
      </div>
    );
  }

  const myTotes = totes.filter(t => t.assigned_to === profile.id && t.status === "picking");

  return (
    <div>
      <SectionTitle title="My totes" />
      <div style={S.cardGrid}>
        {myTotes.map(tt => {
          const toteTasks = tasks.filter(t => t.tote_id === tt.id);
          const pickedCount = toteTasks.filter(t => t.status === "picked").length;
          return (
            <div key={tt.id} style={S.card} onClick={() => openToteDetail(tt)}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span>🧺</span>
                <span style={{ ...S.badgeSm, color: "#5B9EE8", borderColor: "#5B9EE8" }}>{tt.status}</span>
              </div>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 15, marginTop: 10 }}>{tt.tote_number}</div>
              <div style={{ color: "#8B93A3", fontSize: 12, marginTop: 4 }}>{pickedCount} / {toteTasks.length} orders picked</div>
            </div>
          );
        })}
        {myTotes.length === 0 && <EmptyNote text="Koi tote assign nahi hua." />}
      </div>

      {canBatch && (
        <>
          <SectionTitle title={`Create picking batch (Tote) — ${selectedCount}/15 selected`} />
          {pickers.length === 0 && (
            <div style={{ ...S.panel, borderColor: "#7A551A" }}>
              <div style={{ color: "#F5A623", fontSize: 12 }}>⚠ Is warehouse mein koi picker/packer profile nahi mila. Admin ko chahiye Users tab se account banana.</div>
            </div>
          )}
          <div style={S.panel}>
            {availableTotes.length === 0 && (
              <div style={{ color: "#E5484D", fontSize: 12, marginBottom: 10 }}>⚠ Koi available tote nahi hai — sab totes use mein hain, ya Admin ne abhi tote master seed nahi ki.</div>
            )}
            <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 12 }}>
              <select style={{ ...S.input, minWidth: 140, fontFamily: "'IBM Plex Mono', monospace" }} value={selectedToteId} onChange={e => setSelectedToteId(e.target.value)}>
                <option value="">🧺 Select tote…</option>
                {availableTotes.map(t => <option key={t.id} value={t.id}>{t.tote_number}</option>)}
              </select>
              <select style={{ ...S.input, minWidth: 180 }} value={toteAssignPicker} onChange={e => setToteAssignPicker(e.target.value)}>
                <option value="">Assign to…</option>
                {pickers.map(p => <option key={p.id} value={p.id}>{p.full_name} ({p.role})</option>)}
              </select>
              <button style={S.primaryBtnSm} onClick={createTote} disabled={selectedCount === 0 || selectedCount > 15}>Assign tote</button>
            </div>
            <table>
              <thead><tr><th style={S.th}></th><th style={S.th}>Order #</th><th style={S.th}>Courier</th><th style={S.th}>Items</th></tr></thead>
              <tbody>
                {queuedTasks.map(t => {
                  const o = orders[t.order_id];
                  return (
                    <tr key={t.id}>
                      <td style={S.td}><input type="checkbox" checked={!!selectedForTote[t.id]} onChange={e => setSelectedForTote({ ...selectedForTote, [t.id]: e.target.checked })} /></td>
                      <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{o?.external_order_id}</td>
                      <td style={{ ...S.td, color: "#8B93A3" }}>{o?.courier}</td>
                      <td style={{ ...S.td, color: "#8B93A3" }}>{(taskLines[t.id] || []).length}</td>
                    </tr>
                  );
                })}
                {queuedTasks.length === 0 && <tr><td colSpan={4}><EmptyNote text="Koi queued order nahi hai." /></td></tr>}
              </tbody>
            </table>
          </div>
        </>
      )}
    </div>
  );
}

/* ================= PACKING ================= */
function PackingView({ token, profile, showToast }) {
  const [tasks, setTasks] = useState([]);
  const [orders, setOrders] = useState({});
  const [products, setProducts] = useState({});
  const [totes, setTotes] = useState([]);
  const [openTote, setOpenTote] = useState(null);
  const [openTask, setOpenTask] = useState(null);
  const [requiredLines, setRequiredLines] = useState([]);
  const [scans, setScans] = useState({});
  const [barcodeInput, setBarcodeInput] = useState("");
  const [orderScanInput, setOrderScanInput] = useState("");
  const [toteScanInput, setToteScanInput] = useState("");
  const [binNumMap, setBinNumMap] = useState({});

  const load = useCallback(async () => {
    try {
      const [t, o, tt] = await Promise.all([
        sb(`/rest/v1/pack_tasks?status=eq.pending&select=*&order=id.asc`, { token }),
        sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/totes?warehouse_id=eq.${profile.warehouse_id}&status=eq.picked&select=*`, { token })
      ]);
      setTasks(t || []);
      setOrders(Object.fromEntries((o || []).map(x => [x.id, x])));
      setTotes(tt || []);
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const openPack = async (task) => {
    const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${task.order_id}&select=*`, { token });
    setRequiredLines(lines || []);
    const newProducts = await fetchProductsByIds(token, (lines || []).map(l => l.product_id));
    setProducts(prev => ({ ...prev, ...newProducts }));
    setScans({});
    setOpenTask(task);
  };

  const openByOrderNumber = (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : orderScanInput).trim();
    setOrderScanInput("");
    if (!code) return;
    const order = Object.values(orders).find(o => o.external_order_id === code);
    if (!order) { showToast("Order number nahi mila", "err"); return; }
    const task = tasks.find(t => t.order_id === order.id);
    if (!task) { showToast("Yeh order abhi packing ke liye ready nahi hai", "err"); return; }
    openPack(task);
  };

  const scanTote = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : toteScanInput).trim();
    setToteScanInput("");
    if (!code) return;
    const tote = totes.find(t => t.tote_number === code);
    if (!tote) { showToast("Tote nahi mila ya abhi picking complete nahi hui", "err"); return; }
    try {
      const fresh = await sb(`/rest/v1/totes?id=eq.${tote.id}&select=*`, { token });
      const row = fresh && fresh[0];
      if (!row) { showToast("Tote nahi mila", "err"); return; }
      if (row.locked_by && row.locked_by !== profile.id) {
        showToast("Yeh tote pehle se kisi aur packer ke paas process ho rahi hai", "err");
        return;
      }
      if (!row.locked_by) {
        await sb(`/rest/v1/totes?id=eq.${tote.id}`, { method: "PATCH", token, body: { locked_by: profile.id } });
      }
      const pickTasks = await sb(`/rest/v1/pick_tasks?tote_id=eq.${tote.id}&select=order_id,tote_bin_number`, { token });
      setBinNumMap(Object.fromEntries((pickTasks || []).map(pt => [pt.order_id, pt.tote_bin_number])));
      setOpenTote({ ...row, locked_by: profile.id });
    } catch (e) { showToast("Tote open nahi ho saki", "err"); }
  };

  const scanBarcode = (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : barcodeInput).trim();
    setBarcodeInput("");
    if (!code) return;
    const c = cleanCode(code);
    const p = Object.values(products).find(x => cleanCode(x.barcode) === c || cleanCode(x.sku) === c);
    if (!p) { showToast("Barcode/SKU match nahi hua — is order ka nahi hai", "err"); return; }
    const line = requiredLines.find(l => l.product_id === p.id);
    if (!line) { showToast("Yeh product is order mein nahi hai — WRONG ITEM", "err"); return; }
    const current = scans[p.id] || 0;
    if (current >= line.qty) { showToast("Is product ki required qty already scan ho chuki", "err"); return; }
    setScans({ ...scans, [p.id]: current + 1 });
    showToast(`Scanned: ${p.barcode}`);
  };

  const allScanned = requiredLines.length > 0 && requiredLines.every(l => (scans[l.product_id] || 0) >= l.qty);

  const completePacking = async () => {
    const order = orders[openTask.order_id];
    const labelNumber = `LBL-${order.external_order_id}-${Date.now().toString().slice(-5)}`;
    await sb(`/rest/v1/pack_tasks?id=eq.${openTask.id}`, {
      method: "PATCH", token,
      body: { status: "labeled", scans: JSON.stringify(scans), label_number: labelNumber, assigned_to: profile.id, completed_at: new Date().toISOString() }
    });
    await sb(`/rest/v1/sales_orders?id=eq.${openTask.order_id}`, { method: "PATCH", token, body: { status: "rtd" } });
    await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "pack_task", entity_id: openTask.id, user_id: profile.id, action: "labeled", metadata: { label_number: labelNumber } } });

    if (openTask.tote_id) {
      const remaining = await sb(`/rest/v1/pack_tasks?tote_id=eq.${openTask.tote_id}&status=eq.pending&select=id`, { token });
      if (!remaining || remaining.length === 0) {
        await sb(`/rest/v1/totes?id=eq.${openTask.tote_id}`, { method: "PATCH", token, body: { status: "open", assigned_to: null, locked_by: null, completed_at: new Date().toISOString() } });
        showToast("Tote fully packed — all orders RTD, trolley ab dobara available hai");
        setOpenTote(null);
      }
    }
    showToast(`Packed & labeled: ${labelNumber}`);
    setOpenTask(null); load();
  };

  if (openTask) {
    const order = orders[openTask.order_id];
    return (
      <div>
        <SectionTitle title={`Packing — ${order?.external_order_id}`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenTask(null)}>← Back</button>} />
        <div style={S.panel}>
          <div style={S.panelTitle}>Scan each item to verify</div>
          <div style={{ display: "flex", gap: 10 }}>
            <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type barcode / SKU, then Enter"
              value={barcodeInput} onChange={e => setBarcodeInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && scanBarcode()} />
            <CameraScanButton onScan={(text) => scanBarcode(text)} />
            <button style={S.primaryBtnSm} onClick={() => scanBarcode()}>Scan</button>
          </div>
        </div>
        <div style={S.panel}>
          <div style={S.panelTitle}>Progress</div>
          {requiredLines.map(l => {
            const p = products[l.product_id];
            const got = scans[l.product_id] || 0;
            const done = got >= l.qty;
            return (
              <div key={l.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid #262B35" }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", width: 110 }}>{p?.sku}</span>
                <span style={{ flex: 1, color: "#ECEAE3", fontSize: 13 }}>{p?.name}</span>
                <span style={{ ...S.badgeSm, color: done ? "#4CAF7D" : "#8B93A3", borderColor: done ? "#4CAF7D" : "#333A47" }}>{got} / {l.qty}</span>
              </div>
            );
          })}
          {allScanned && (
            <button style={{ ...S.primaryBtnSm, marginTop: 16 }} onClick={completePacking}>🏷 Complete packing & generate label</button>
          )}
        </div>
      </div>
    );
  }

  if (openTote) {
    const toteTasks = [...tasks.filter(t => t.tote_id === openTote.id)].sort((a, b) => (binNumMap[a.order_id] || 99) - (binNumMap[b.order_id] || 99));
    return (
      <div>
        <SectionTitle title={`${openTote.tote_number} — ${toteTasks.length} orders to pack`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenTote(null)}>← Back</button>} />
        <div style={S.cardGrid}>
          {toteTasks.map(t => {
            const o = orders[t.order_id];
            return (
              <div key={t.id} style={S.card} onClick={() => openPack(t)}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span style={{ ...S.badgeSm, color: "#F5A623", borderColor: "#F5A623" }}>Bin #{binNumMap[t.order_id] || "?"}</span>
                  <span style={{ ...S.badgeSm, color: "#F5A623", borderColor: "#F5A623" }}>Ready to pack</span>
                </div>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: "#8B93A3", marginTop: 8 }}>{o?.external_order_id}</div>
                <div style={{ color: "#ECEAE3", fontSize: 14, marginTop: 4 }}>{o?.courier}</div>
              </div>
            );
          })}
          {toteTasks.length === 0 && <EmptyNote text="Is tote ke sab orders pack ho chuke hain." />}
        </div>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle title="Packing" />
      <div style={S.panel}>
        <div style={S.panelTitle}>Scan tote to begin packing</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan/type tote number, then Enter"
            value={toteScanInput} onChange={e => setToteScanInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && scanTote()} />
          <CameraScanButton onScan={(text) => scanTote(text)} />
          <button style={S.primaryBtnSm} onClick={() => scanTote()}>Open tote</button>
        </div>
      </div>
      <div style={S.panel}>
        <div style={S.panelTitle}>Or open a single order directly</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Order number, then Enter"
            value={orderScanInput} onChange={e => setOrderScanInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && openByOrderNumber()} />
          <CameraScanButton onScan={(text) => openByOrderNumber(text)} />
          <button style={S.secondaryBtnSm} onClick={() => openByOrderNumber()}>Open</button>
        </div>
      </div>
      <SectionTitle title="Totes ready for packing" />
      <div style={S.cardGrid}>
        {totes.map(tt => {
          const count = tasks.filter(t => t.tote_id === tt.id).length;
          return (
            <div key={tt.id} style={S.card} onClick={() => scanTote(tt.tote_number)}>
              <span>🧺</span>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 15, marginTop: 10 }}>{tt.tote_number}</div>
              <div style={{ color: "#8B93A3", fontSize: 12, marginTop: 4 }}>{count} orders to pack</div>
            </div>
          );
        })}
        {totes.length === 0 && <EmptyNote text="Koi tote packing ke liye ready nahi hai." />}
      </div>
    </div>
  );
}

/* ================= DISPATCH / LOAD SHEET ================= */
function DispatchView({ token, profile, showToast }) {
  const [orders, setOrders] = useState([]);
  const [selected, setSelected] = useState({});
  const [loadSheets, setLoadSheets] = useState([]);
  const [profiles, setProfiles] = useState({});
  const [scanTrackingInput, setScanTrackingInput] = useState("");

  const load = useCallback(async () => {
    try {
      const [o, ls, pf] = await Promise.all([
        sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&status=eq.rtd&select=*`, { token }),
        sb(`/rest/v1/load_sheets?warehouse_id=eq.${profile.warehouse_id}&select=*&order=created_at.desc`, { token }),
        sb(`/rest/v1/profiles?select=*`, { token })
      ]);
      setOrders(o || []); setLoadSheets(ls || []);
      setProfiles(Object.fromEntries((pf || []).map(p => [p.id, p])));
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const toggle = (id) => setSelected({ ...selected, [id]: !selected[id] });

  const scanTracking = (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : scanTrackingInput).trim();
    setScanTrackingInput("");
    if (!code) return;
    const order = orders.find(o => o.external_order_id === code);
    if (!order) { showToast("Tracking number is packed-orders list mein nahi mila", "err"); return; }
    if (selected[order.id]) { showToast("Already selected"); return; }
    setSelected(prev => ({ ...prev, [order.id]: true }));
    showToast(`Added: ${order.external_order_id} (${order.courier})`);
  };

  const nextLoadSheetNumber = async (courierName) => {
    const prefix = courierName.trim().slice(0, 3).toUpperCase();
    const existing = await sb(`/rest/v1/load_sheets?warehouse_id=eq.${profile.warehouse_id}&courier=eq.${encodeURIComponent(courierName)}&select=load_sheet_number`, { token });
    let maxSerial = 0;
    for (const ls of existing || []) {
      const m = String(ls.load_sheet_number).match(/(\d+)$/);
      if (m) maxSerial = Math.max(maxSerial, parseInt(m[1], 10));
    }
    return `${prefix}${String(maxSerial + 1).padStart(5, "0")}`;
  };

  const createLoadSheet = async () => {
    const ids = Object.keys(selected).filter(k => selected[k]);
    if (ids.length === 0) { showToast("Kam se kam ek order select karein", "err"); return; }
    try {
      const byCourier = {};
      for (const id of ids) {
        const o = orders.find(x => x.id === id);
        const c = o?.courier || "Other";
        if (!byCourier[c]) byCourier[c] = [];
        byCourier[c].push(id);
      }
      const generated = [];
      for (const [courierName, orderIds] of Object.entries(byCourier)) {
        const lsNumber = await nextLoadSheetNumber(courierName);
        await sb(`/rest/v1/load_sheets`, { method: "POST", token, body: { warehouse_id: profile.warehouse_id, courier: courierName, load_sheet_number: lsNumber, order_ids: orderIds, created_by: profile.id } });
        for (const orderId of orderIds) {
          const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${orderId}&select=*`, { token });
          for (const l of lines) {
            await deductStock(token, profile.warehouse_id, l.product_id, l.qty);
            await adjustReserved(token, profile.warehouse_id, l.product_id, -l.qty);
          }
          await sb(`/rest/v1/sales_orders?id=eq.${orderId}`, { method: "PATCH", token, body: { status: "dispatched", dispatched_at: new Date().toISOString() } });
          await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: orderId, user_id: profile.id, action: "dispatched", metadata: { load_sheet: lsNumber } } });
        }
        generated.push(`${lsNumber} (${courierName}, ${orderIds.length})`);
      }
      showToast(`Load sheet(s) created: ${generated.join(" · ")}`);
      setSelected({}); load();
    } catch (e) { showToast("Load sheet creation failed", "err"); }
  };

  return (
    <div>
      <SectionTitle title="Dispatch / Load Sheet — RTD orders" />
      <div style={S.panel}>
        <div style={S.panelTitle}>Scan tracking numbers to verify</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan/type tracking number, then Enter"
            value={scanTrackingInput} onChange={e => setScanTrackingInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && scanTracking()} />
          <CameraScanButton onScan={(text) => scanTracking(text)} />
          <button style={S.primaryBtnSm} onClick={() => scanTracking()}>Verify</button>
        </div>
      </div>
      <div style={S.panel}>
        <div style={S.panelTitle}>RTD orders — red = pending, green = verified</div>
        {orders.length === 0 ? <EmptyNote text="No RTD orders waiting." /> : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))", gap: 8 }}>
            {orders.map(o => {
              const ok = !!selected[o.id];
              return (
                <div key={o.id} onClick={() => toggle(o.id)} style={{
                  cursor: "pointer", borderRadius: 8, padding: "10px 12px",
                  background: ok ? "rgba(76,175,125,0.12)" : "rgba(229,72,77,0.08)",
                  border: `1px solid ${ok ? "#4CAF7D" : "#E5484D"}`
                }}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: ok ? "#4CAF7D" : "#E5484D", fontSize: 13 }}>{o.external_order_id}</div>
                  <div style={{ color: "#8B93A3", fontSize: 11, marginTop: 2 }}>{o.courier} · {ok ? "Verified" : "Pending"}</div>
                </div>
              );
            })}
          </div>
        )}
        <div style={{ display: "flex", gap: 10, marginTop: 14, alignItems: "center" }}>
          <button style={S.primaryBtnSm} onClick={createLoadSheet}>🚚 Create load sheet(s) — auto courier-wise</button>
          <span style={{ color: "#5A6070", fontSize: 11 }}>Verified orders alag-alag courier ke hon to system khud alag load sheets bana dega</span>
        </div>
      </div>
      <div style={S.panel}>
        <div style={S.panelTitle}>Recent load sheets</div>
        {loadSheets.map(ls => (
          <div key={ls.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid #262B35" }}>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#ECEAE3" }}>{ls.load_sheet_number}</span>
            <span style={{ color: "#8B93A3", fontSize: 12 }}>{ls.courier} · {ls.order_ids?.length || 0} orders · {fmtTime(ls.created_at)}</span>
            <button style={S.secondaryBtnSm} onClick={async () => {
              const ids = ls.order_ids || [];
              if (ids.length === 0) return;
              const os = await sb(`/rest/v1/sales_orders?id=in.(${ids.join(",")})&select=*`, { token });
              const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
              const rows = [
                [esc("Load Sheet Number"), esc(ls.load_sheet_number)],
                [esc("Courier"), esc(ls.courier)],
                [esc("Created Date"), esc(fmtTime(ls.created_at))],
                [esc("Created By"), esc(profiles[ls.created_by]?.full_name || "—")],
                [],
                [esc("Customer"), esc("Tracking"), esc("Qty"), esc("Order Timestamp")]
              ];
              for (const o of os || []) {
                const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${o.id}&select=qty`, { token });
                const qty = (lines || []).reduce((s, l) => s + l.qty, 0);
                rows.push([esc(o.raw_data?.customer_order_number || o.raw_data?.customer || "—"), esc(o.external_order_id), esc(qty), esc(fmtTime(o.dispatched_at))]);
              }
              const csv = rows.map(r => r.join(",")).join("\n");
              const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url; a.download = `${ls.load_sheet_number}.csv`;
              document.body.appendChild(a); a.click(); document.body.removeChild(a);
              URL.revokeObjectURL(url);
            }}>⬇ Export</button>
          </div>
        ))}
        {loadSheets.length === 0 && <EmptyNote text="No load sheets yet." />}
        <div style={{ marginTop: 12, fontSize: 11, color: "#5A6070" }}>
          ⚠ Email auto-send abhi nahi hai (real backend chahiye) — load sheet yahan record ho jata hai, aap manually forward kar sakte hain jab tak hum email automation set up karein.
        </div>
      </div>
    </div>
  );
}

/* ================= USERS ================= */
function UsersView({ token, profile, showToast }) {
  const [users, setUsers] = useState([]);
  const [warehouses, setWarehouses] = useState([]);
  const [form, setForm] = useState({ full_name: "", email: "", password: "", role: "picker", warehouse_id: profile.warehouse_id || "" });
  const [busy, setBusy] = useState(false);
  const [editAccessId, setEditAccessId] = useState(null);
  const [editOverrides, setEditOverrides] = useState({});

  const NAV_LIST = [
    ["dashboard", "Dashboard"], ["products", "Products"], ["receiving", "Receiving"], ["putaway", "Putaway"],
    ["inventory", "Inventory"], ["orders", "Sales Orders"], ["picking", "Picking"], ["packing", "Packing"],
    ["dispatch", "Dispatch"], ["returns", "Returns"], ["reports", "Reports"], ["bins", "Bin Master"],
    ["totemaster", "Tote Master"], ["users", "Users"]
  ];
  const ROLE_DEFAULT_NAV = {
    admin: ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch", "returns", "reports", "bins", "totemaster", "users"],
    warehouse_lead: ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch", "returns", "reports"],
    supervisor: ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch", "returns", "reports"],
    returns_agent: ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch", "returns", "reports"]
  };

  const openEditAccess = (u) => {
    setEditAccessId(u.id);
    setEditOverrides(u.nav_overrides || {});
  };

  const isNavVisible = (u, navId) => {
    const roleDefault = (ROLE_DEFAULT_NAV[u.role] || ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch"]).includes(navId);
    const override = (u.nav_overrides || {})[navId];
    if (override === true) return true;
    if (override === false) return false;
    return roleDefault;
  };

  const saveAccess = async (u) => {
    try {
      await sb(`/rest/v1/profiles?id=eq.${u.id}`, { method: "PATCH", token, body: { nav_overrides: editOverrides } });
      showToast(`${u.full_name} ki access update ho gayi`);
      setEditAccessId(null);
      load();
    } catch (e) { showToast("Access save failed", "err"); }
  };

  const load = useCallback(async () => {
    try {
      const [u, w] = await Promise.all([
        sb(`/rest/v1/profiles?select=*&order=full_name.asc`, { token }),
        sb(`/rest/v1/warehouses?select=*`, { token })
      ]);
      setUsers(u || []); setWarehouses(w || []);
    } catch (e) { showToast("Load failed", "err"); }
  }, [token]);
  useEffect(() => { load(); }, [load]);

  const addUser = async () => {
    if (!form.full_name.trim() || !form.email.trim() || form.password.length < 6) {
      showToast("Name, email, aur kam se kam 6-character password chahiye", "err");
      return;
    }
    setBusy(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
        method: "POST",
        headers: { apikey: ANON_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email: form.email.trim(), password: form.password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.msg || data.error_description || data.error || "Signup failed");
      const newUserId = data.user?.id || data.id;
      if (!newUserId) throw new Error("User ID nahi mila — response check karein");

      await sb(`/rest/v1/profiles`, {
        method: "POST", token,

      });
      showToast(`${form.full_name} add ho gaye — email: ${form.email}`);

  return (
    <div>
      <SectionTitle title="Users & roles" />
      <div style={S.panel}>
        <div style={S.panelTitle}>Add staff member</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <input style={{ ...S.input, flex: 1, minWidth: 140 }} placeholder="Full name" value={form.full_name} onChange={e => setForm({ ...form, full_name: e.target.value })} />
          <input style={{ ...S.input, flex: 1, minWidth: 160 }} placeholder="Email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} />
          <input style={{ ...S.input, flex: 1, minWidth: 140 }} type="password" placeholder="Password (min 6 chars)" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} />
          <select style={{ ...S.input, minWidth: 140 }} value={form.role} onChange={e => setForm({ ...form, role: e.target.value })}>
            <option value="picker">Picker</option>
            <option value="packer">Packer</option>
            <option value="putaway_officer">Putaway Officer</option>
            <option value="dispatcher">Dispatcher</option>
            <option value="supervisor">Supervisor</option>
            <option value="warehouse_lead">Warehouse Lead</option>
            <option value="returns_agent">Returns Agent</option>
            <option value="admin">Admin</option>
          </select>
          {form.role !== "admin" && (
            <select style={{ ...S.input, minWidth: 160 }} value={form.warehouse_id} onChange={e => setForm({ ...form, warehouse_id: e.target.value })}>
              <option value="">Select warehouse</option>
              {warehouses.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
            </select>

          <button style={S.primaryBtnSm} onClick={addUser} disabled={busy}>{busy ? "Adding…" : "+ Add staff"}</button>
        </div>
        <div style={{ marginTop: 12, fontSize: 11, color: "#5A6070" }}>
          ⚠ Naya staff member is email/password se seedha login kar sakega. Real email inbox zaroori nahi (jab tak "Confirm email" Supabase mein off hai).
        </div>
      </div>
      <div style={S.cardGrid}>
        {users.map(u => (
          <div key={u.id} style={S.card}>
            <div style={{ color: "#ECEAE3", fontFamily: "'Space Grotesk', sans-serif", fontSize: 15 }}>{u.full_name}</div>
            <div style={{ marginTop: 6 }}>
              <span style={{ ...S.badgeSm, color: "#F5A623", borderColor: "#F5A623" }}>{ROLE_LABEL[u.role] || u.role}</span>
              {u.nav_overrides && Object.keys(u.nav_overrides).length > 0 && (
                <span style={{ ...S.badgeSm, color: "#5B9EE8", borderColor: "#5B9EE8", marginLeft: 6 }}>Custom access</span>
              )}
            </div>
            <div style={{ color: "#8B93A3", fontSize: 12, marginTop: 8 }}>
              {warehouses.find(w => w.id === u.warehouse_id)?.name || (u.role === "admin" ? "All warehouses" : "No warehouse set")}

            <button style={{ ...S.secondaryBtnSm, marginTop: 10, width: "100%", justifyContent: "center" }} onClick={() => editAccessId === u.id ? setEditAccessId(null) : openEditAccess(u)}>
