          odoo_free_to_use_qty: cleanNum(r["Free To Use Quantity"])
        }))
        .filter(r => r.internal_barcode);
      if (!mapped.length) { showToast("File mai koi valid row nahi mili — 'Internal Barcode' column check karein", "err"); setCatalogueUploading(false); return; }
      for (let i = 0; i < mapped.length; i += 500) {
        await sb(`/rest/v1/stk_products?on_conflict=internal_barcode`, { method: "POST", token, prefer: "resolution=merge-duplicates,return=minimal", body: mapped.slice(i, i + 500) });
      }
      setCatalogueCount(c => (c || 0) + mapped.length);
      showToast(`✓ Catalogue update ho gaya — ${mapped.length} products upsert hue`);
    } catch (e) { showToast("Catalogue upload fail: " + e.message, "err"); }
    setCatalogueUploading(false);
  };

  return (
    <div>
      <SectionTitle title="Stocking Warehouse — Catalogue" />
      <div style={S.panel}>
        <div style={S.panelTitle}>Product Catalogue — Bulk Upload</div>
        <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 14 }}>
          Odoo se product master export upload karein (columns: Department, Division, Group, Product Category, Product/Sale Barcode, Internal Barcode, Internal Reference, Display Name, Sales Price, Quantity On Hand, Free To Use Quantity). Match "Internal Barcode" pe hota hai — dobara upload karne se existing entries update ho jati hain, duplicate nahi banti.
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 18 }}>
          <label style={{ ...S.primaryBtnSm, cursor: "pointer" }}>
            {catalogueUploading ? "Uploading…" : "📤 Upload Catalogue Excel"}
            <input type="file" accept=".xlsx,.xls" style={{ display: "none" }} disabled={catalogueUploading} onChange={e => { const f = e.target.files[0]; if (f) uploadCatalogueFile(f); e.target.value = ""; }} />
          </label>
          <div style={{ color: "#6B6355", fontSize: 12 }}>Abhi catalogue mein <strong>{catalogueCount ?? "…"}</strong> products hain.</div>
        </div>
        <div style={{ fontSize: 11, color: "#8A8272", fontFamily: "'IBM Plex Mono', monospace" }}>
          NOTE: DC ki Odoo Import se bhi naye barcode/naam khud-ba-khud catalogue mein seed ho jate hain (agar wahan pehle se nahi hain) — lekin woh kabhi is bulk-upload ki rich detail (category, price waghera) ko overwrite nahi karte.
        </div>
      </div>
    </div>
  );
}

/* ================= STOCKING WAREHOUSE — OUTBOUND ALLOCATION ================= */
function StockingOutboundView({ token, profile, showToast }) {
  const whId = useStkWarehouseId(token, profile);
  const canAssign = ["admin", "warehouse_lead", "outbound_executive"].includes(profile.role);
  const canWork = ["admin", "warehouse_lead", "putaway_officer"].includes(profile.role);
  const [tab, setTab] = useState(canAssign ? "assignment" : "allocation");
  const [queue, setQueue] = useState([]);
  const [allocations, setAllocations] = useState([]);
  const [bins, setBins] = useState([]);
  const [dcs, setDcs] = useState([]);
  const [pos, setPos] = useState([]);
  const [officers, setOfficers] = useState([]);
  const [loading, setLoading] = useState(false);
  const [allocForm, setAllocForm] = useState({}); // { [queueId]: { qty, destination, strRef } }
  const [binChoice, setBinChoice] = useState({}); // { [queueId]: binId }
  const [assignChoice, setAssignChoice] = useState({}); // { [dcId]: userId }
  const [destinations, setDestinations] = useState([]);

  const load = async () => {
    if (!whId) return;
    setLoading(true);
    try {
      const [q, a, b, d, p, o, dest] = await Promise.all([
        sb(`/rest/v1/stk_putaway_queue?warehouse_id=eq.${whId}&select=*&order=created_at.desc`, { token }),
        sb(`/rest/v1/stk_grn_allocations?warehouse_id=eq.${whId}&select=*&order=created_at.desc`, { token }),
        sb(`/rest/v1/bins?warehouse_id=eq.${whId}&select=*&order=code.asc`, { token }),
        sb(`/rest/v1/stk_dc_arrivals?warehouse_id=eq.${whId}&select=*`, { token }),
        sb(`/rest/v1/stk_purchase_orders?warehouse_id=eq.${whId}&select=*`, { token }),
        sb(`/rest/v1/profiles?warehouse_id=eq.${whId}&role=eq.putaway_officer&select=id,full_name`, { token }),
        sb(`/rest/v1/stk_destinations?warehouse_id=eq.${whId}&select=*&order=name.asc`, { token })
      ]);
      setQueue(q || []); setAllocations(a || []); setBins(b || []); setDcs(d || []); setPos(p || []); setOfficers(o || []); setDestinations(dest || []);
    } catch (e) { showToast("Load fail: " + e.message, "err"); }
    setLoading(false);
  };
  useEffect(() => { load(); }, [whId]);

  const pendingQueue = queue.filter(q => q.status === "pending" && Number(q.qty) > 0);
  const unassignedByDc = {};
  pendingQueue.filter(q => !q.assigned_to).forEach(q => { (unassignedByDc[q.dc_id] = unassignedByDc[q.dc_id] || []).push(q); });
  // Putaway Officer sees only their own assigned batch; Admin/Lead get oversight of everyone's.
  const myWorkQueue = profile.role === "putaway_officer" ? pendingQueue.filter(q => q.assigned_to === profile.id) : pendingQueue.filter(q => q.assigned_to);

  const officerName = (id) => officers.find(o => o.id === id)?.full_name || "—";
  const dcLabel = (dcId) => { const dc = dcs.find(x => x.id === dcId); const po = dc ? pos.find(p => p.id === dc.po_id) : null; return dc ? `${po?.po_number || "?"} — DC ${dc.dc_number}` : dcId; };

  const assignDc = async (dcId) => {
    const userId = assignChoice[dcId];
    if (!userId) { showToast("Putaway Officer select karein", "err"); return; }
    setLoading(true);
    try {
      await sb(`/rest/v1/stk_putaway_queue?dc_id=eq.${dcId}&status=eq.pending&assigned_to=is.null`, { method: "PATCH", token, body: { assigned_to: userId } });
      showToast(`${dcLabel(dcId)} — ${officerName(userId)} ko assign ho gaya`);
      load();
    } catch (e) { showToast("Assign fail: " + e.message, "err"); }
    setLoading(false);
  };

  const allocateToStr = async (q) => {
    const f = allocForm[q.id] || {};
    const qty = Number(f.qty || 0);
    if (!qty || qty <= 0 || qty > Number(q.qty)) { showToast("Valid qty enter karein (max " + q.qty + ")", "err"); return; }
    if (!f.destination?.trim()) { showToast("Destination shop zaroori hai", "err"); return; }
    setLoading(true);
    try {
      const alloc = await sb(`/rest/v1/stk_grn_allocations`, { method: "POST", token, prefer: "return=representation", body: { dc_line_id: q.dc_line_id, dc_id: q.dc_id, po_id: q.po_id, warehouse_id: whId, product_name: q.product_name, product_barcode: q.product_barcode, qty, destination: f.destination.trim(), status: "pending_str", created_by: profile.id } });
      // System reference now, so this is traceable the instant inventory is set aside —
      // Outbound Executive's Odoo STR# later REPLACES this same field, never leaving it blank.
      const sysRef = await nextSysStrRef(token);
      await sb(`/rest/v1/stk_str`, { method: "POST", token, body: { warehouse_id: whId, source: "grn_distribution", grn_allocation_id: alloc[0].id, destination: f.destination.trim(), product_barcode: q.product_barcode, product_name: q.product_name, qty, status: "draft", str_number: sysRef, created_by: profile.id } });
      const remaining = Number(q.qty) - qty;
      await sb(`/rest/v1/stk_putaway_queue?id=eq.${q.id}`, { method: "PATCH", token, body: { qty: remaining } });
      showToast(`${qty} units — ${f.destination} k liye STR ${sysRef} ban gaya (Outbound Executive isay Odoo STR# se replace karega)`);
      setAllocForm(af => ({ ...af, [q.id]: {} }));
      load();
    } catch (e) { showToast("Allocate fail: " + e.message, "err"); }
    setLoading(false);
  };

  const completePutaway = async (q) => {
    const code = (binChoice[q.id] || "").trim();
    const bin = bins.find(b => (b.code || "").toLowerCase() === code.toLowerCase());
    if (!bin) { showToast("Sahi bin code likhein (jo list mein maujood ho)", "err"); return; }
    setLoading(true);
    try {
      await sb(`/rest/v1/stk_putaway_queue?id=eq.${q.id}`, { method: "PATCH", token, body: { status: "completed", bin_id: bin.id, completed_by: profile.id, completed_at: new Date().toISOString() } });
      showToast(`${q.product_name} — putaway complete, bin assign ho gaya`);
      load();
    } catch (e) { showToast("Putaway fail: " + e.message, "err"); }
    setLoading(false);
  };

  const TABS = [
    ...(canAssign ? [{ key: "assignment", label: `Assignment (${Object.keys(unassignedByDc).length})` }] : []),
    ...(canWork ? [{ key: "allocation", label: `My Work — STR Allocation (${myWorkQueue.length})` }, { key: "putaway", label: "Putaway" }] : []),
    { key: "rtd", label: `Distribution Trail (${allocations.length})` }
  ];

  return (
    <div>
      <SectionTitle title="Stocking Warehouse — Outbound Allocation" />
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        {TABS.map(t => <button key={t.key} onClick={() => setTab(t.key)} style={stkPill(tab === t.key)}>{t.label}</button>)}
      </div>

      {tab === "assignment" && canAssign && (
        <div style={S.panel}>
          <div style={S.panelTitle}>GRN Complete — Assign to Putaway Officer</div>
          <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 14 }}>Inbound Officer se forward hui har GRN yahan by-DC dikhti hai. Ek Putaway Officer select kar k pura DC unhe assign karein — wahi item select kar k STR banayenge aur baki putaway karenge.</div>
          {Object.keys(unassignedByDc).length === 0 && <EmptyNote text="Koi GRN assignment k liye pending nahi" />}
          {Object.entries(unassignedByDc).map(([dcId, lines]) => (
            <div key={dcId} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "10px 0", borderBottom: "1px solid #EFE8D8" }}>
              <div>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13 }}>{dcLabel(dcId)}</div>
                <div style={{ fontSize: 12, color: "#8A8272" }}>{lines.length} product line(s) · total qty {lines.reduce((s, l) => s + Number(l.qty), 0)}</div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <select style={{ ...S.input, width: 180 }} value={assignChoice[dcId] || ""} onChange={e => setAssignChoice(ac => ({ ...ac, [dcId]: e.target.value }))}>
                  <option value="">Select Putaway Officer</option>
                  {officers.map(o => <option key={o.id} value={o.id}>{o.full_name}</option>)}
                </select>
                <button style={S.primaryBtnSm} onClick={() => assignDc(dcId)} disabled={loading}>Assign</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === "allocation" && canWork && (
        <div style={S.panel}>
          <div style={S.panelTitle}>{profile.role === "putaway_officer" ? "My Assigned Items — Select & Create Distribution" : "All Assigned Items (oversight)"}</div>
          <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 14 }}>Item select karein, kitni qty kis shop ko bhejni hai woh daalein — yeh (STR) tab mein draft ban jayega, jahan Outbound Executive Odoo STR# add kar ke confirm karega. Baki remaining qty Putaway tab mai bin assign k liye chali jayegi.</div>
          {!destinations.length && <div style={{ fontSize: 12, color: "#E5484D", marginBottom: 14 }}>⚠ Abhi koi destination master mein nahi hai — Admin ko Logistics tab se destinations (Ecom, Shaheen, BC, DHA LHR, waghera) add karni hongi.</div>}
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr>{profile.role !== "putaway_officer" && <th style={S.th}>Assigned To</th>}<th style={S.th}>Product</th><th style={S.th}>Unallocated Qty</th><th style={S.th}>Destination Shop</th><th style={S.th}>Qty to Distribute</th><th style={S.th}></th></tr></thead>
            <tbody>
              {myWorkQueue.map(q => (
                <tr key={q.id}>
                  {profile.role !== "putaway_officer" && <td style={S.td}>{officerName(q.assigned_to)}</td>}
                  <td style={S.td}>{q.product_name}</td>
                  <td style={S.td}>{q.qty}</td>
                  <td style={S.td}>
                    <select style={{ ...S.input, width: 140 }} value={allocForm[q.id]?.destination || ""} onChange={e => setAllocForm(af => ({ ...af, [q.id]: { ...af[q.id], destination: e.target.value } }))}>
                      <option value="">Select destination…</option>
                      {destinations.map(d => <option key={d.id} value={d.name}>{d.name}</option>)}
                    </select>
                  </td>
                  <td style={S.td}><input type="number" style={{ ...S.input, width: 90 }} placeholder="qty" value={allocForm[q.id]?.qty || ""} onChange={e => setAllocForm(af => ({ ...af, [q.id]: { ...af[q.id], qty: e.target.value } }))} /></td>
                  <td style={S.td}><button style={S.secondaryBtnSm} onClick={() => allocateToStr(q)} disabled={loading}>→ Send to STR tab</button></td>
                </tr>
              ))}
              {!myWorkQueue.length && <tr><td style={S.td} colSpan={profile.role !== "putaway_officer" ? 6 : 5}><EmptyNote text="Koi item assigned nahi" /></td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {tab === "putaway" && canWork && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Remaining Stock — Bin Assign</div>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr>{profile.role !== "putaway_officer" && <th style={S.th}>Assigned To</th>}<th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Bin</th><th style={S.th}></th></tr></thead>
            <tbody>
              {myWorkQueue.map(q => (
                <tr key={q.id}>
                  {profile.role !== "putaway_officer" && <td style={S.td}>{officerName(q.assigned_to)}</td>}
                  <td style={S.td}>{q.product_name}</td>
                  <td style={S.td}>{q.qty}</td>
                  <td style={S.td}>
                    <input list="stkOutboundBinDatalist" style={{ ...S.input, width: 140, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Bin code" value={binChoice[q.id] || ""} onChange={e => setBinChoice(bc => ({ ...bc, [q.id]: e.target.value }))} />
                    <datalist id="stkOutboundBinDatalist">
                      {bins.map(b => <option key={b.id} value={b.code} />)}
                    </datalist>
                    <CameraScanButton onScan={(text) => setBinChoice(bc => ({ ...bc, [q.id]: text }))} />
                  </td>
                  <td style={S.td}><button style={S.primaryBtnSm} onClick={() => completePutaway(q)} disabled={loading}>✓ Putaway Complete</button></td>
                </tr>
              ))}
              {!myWorkQueue.length && <tr><td style={S.td} colSpan={profile.role !== "putaway_officer" ? 5 : 4}><EmptyNote text="Koi qty putaway k liye pending nahi" /></td></tr>}
            </tbody>
          </table>
          <div style={{ marginTop: 18 }}>
            <div style={{ fontSize: 11, color: "#8A8272", marginBottom: 8, fontFamily: "'IBM Plex Mono', monospace" }}>PUTAWAY COMPLETE — AVAILABLE FOR PICKING</div>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead><tr><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Bin</th><th style={S.th}>Put Away By</th><th style={S.th}>Completed</th></tr></thead>
              <tbody>
                {queue.filter(q => q.status === "completed").slice(0, 15).map(q => (
                  <tr key={q.id}><td style={S.td}>{q.product_name}</td><td style={S.td}>{q.qty}</td><td style={S.td}>{bins.find(b => b.id === q.bin_id)?.code || "—"}</td><td style={S.td}>{officerName(q.completed_by)}</td><td style={S.td}>{fmtTime(q.completed_at)}</td></tr>
                ))}
                {!queue.filter(q => q.status === "completed").length && <tr><td style={S.td} colSpan={5}><EmptyNote text="Abhi koi putaway complete nahi hua" /></td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab === "rtd" && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Distribution Trail</div>
          <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 14 }}>Odoo STR# entry, verification, aur Gatepass generation ab (STR) tab se hote hain — yeh sirf trail dikhata hai.</div>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Destination</th><th style={S.th}>Status</th><th style={S.th}>Since</th></tr></thead>
            <tbody>
              {allocations.map(a => (
                <tr key={a.id}><td style={S.td}>{a.product_name}</td><td style={S.td}>{a.qty}</td><td style={S.td}>{a.destination}</td><td style={S.td}>{a.status === "pending_str" ? "Pending STR#" : a.status === "rtd" ? "RTD" : "Dispatched"}</td><td style={S.td}>{fmtTime(a.created_at)}</td></tr>
              ))}
              {!allocations.length && <tr><td style={S.td} colSpan={5}><EmptyNote text="Abhi kuch nahi" /></td></tr>}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ================= STOCKING WAREHOUSE — STR (Stock Transfer Requests) ================= */
// The Stocking equivalent of "Sales Orders": every outbound commitment lands here regardless
// of where it came from — a Putaway Officer's GRN-distribution (grn_allocation_id set), or a
// bulk-uploaded Customer Order / Weekly Demand list. Outbound Executive enters the Odoo STR#
// and confirms qty (draft → reserved) before anything can ship; Generate Gatepass (reserved →
// dispatched) is the only point stock is actually deducted for non-GRN-distribution STRs, since
// GRN-distribution stock never entered putaway/on-hand in the first place.
function StockingStrView({ token, profile, showToast }) {
  const whId = useStkWarehouseId(token, profile);
  const [tab, setTab] = useState("draft");
  const [strs, setStrs] = useState([]);
  const [staff, setStaff] = useState([]);
  const [warehouseName, setWarehouseName] = useState("Stocking Warehouse");
  const [loading, setLoading] = useState(true);
  const [editForm, setEditForm] = useState({}); // { [strId]: { strNumber, qty } }
  const [uploading, setUploading] = useState(false);

  const load = async () => {
    if (!whId) return;
    setLoading(true);
    try {
      const [s, staffRows, whRows] = await Promise.all([
        sb(`/rest/v1/stk_str?warehouse_id=eq.${whId}&select=*&order=created_at.desc`, { token }),
        sb(`/rest/v1/profiles?warehouse_id=eq.${whId}&select=id,full_name`, { token }),
        sb(`/rest/v1/warehouses?id=eq.${whId}&select=name`, { token })
      ]);
      setStrs(s || []); setStaff(staffRows || []);
      if (whRows?.[0]?.name) setWarehouseName(whRows[0].name);
    } catch (e) { showToast("Load fail: " + e.message, "err"); }
    setLoading(false);
  };
  useEffect(() => { load(); }, [whId]);

  const staffName = (id) => staff.find(s => s.id === id)?.full_name || "—";

  const draftStrs = strs.filter(s => s.status === "draft");
  const reservedStrs = strs.filter(s => s.status === "reserved");
  const dispatchedStrs = strs.filter(s => s.status === "dispatched" || s.status === "received");

  const sourceLabel = (s) => s === "grn_distribution" ? "GRN Distribution" : s === "customer_order" ? "Customer Order" : "Weekly Demand";

  // Same real Odoo STR# often covers several products — group by str_number so printing gives
  // ONE document with every line item, matching the actual company STR format (not one product
  // per printout).
  const printStrDoc = (strNumber) => {
    const group = strs.filter(s => s.str_number === strNumber);
    if (!group.length) return;
    const first = group[0];
    let rowsHtml = "";
    let totalQty = 0;
    group.forEach((r, i) => {
      totalQty += Number(r.qty || 0);
      rowsHtml += `<tr><td>${i + 1}</td><td>${r.product_barcode || "—"}</td><td>${r.product_name}</td><td style="text-align:right">${r.qty}</td></tr>`;
    });
    const statusLabel = { draft: "Draft — Pending Odoo STR#", reserved: "Reserved — Awaiting Vehicle", dispatched: "Shipped" }[first.status] || first.status;
    const w = window.open("", "_blank");
    w.document.write(`<html><head><title>STR ${strNumber}</title><style>
      body{font-family:Arial;padding:24px;color:#111;font-size:13px}
      h2{margin:0 0 2px;font-size:18px} .subtitle{text-align:center;font-weight:700;letter-spacing:1px;margin-bottom:14px}
      .top{display:flex;justify-content:space-between;border-bottom:2px solid #1A1206;padding-bottom:10px;margin-bottom:10px}
      .meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 24px;font-size:12.5px;margin-bottom:16px;border-bottom:1px solid #ccc;padding-bottom:12px}
      .meta-grid b{color:#555;font-weight:600}
      table{width:100%;border-collapse:collapse;margin-bottom:16px} th,td{border:1px solid #999;padding:6px 9px;font-size:12px;text-align:left}
      th{background:#F5A623;color:#1A1206} td:nth-child(1),th:nth-child(1){text-align:center;width:36px}
      tfoot td{font-weight:700;background:#FAFAFA}
      .sign{margin-top:70px;display:flex;justify-content:space-between}
      .sign div{border-top:1px solid #333;width:150px;text-align:center;padding-top:6px;font-size:11px}
    </style></head><body>
      <div class="top"><div><b>From:</b> HABITT H/W</div><div class="subtitle">STOCK TRANSFER REPORT (STR)</div><div><b>To:</b> ${first.destination}</div></div>
      <div class="meta-grid">
        <div><b>STR#:</b> ${strNumber}</div>
        <div><b>Source:</b> ${sourceLabel(first.source)}${first.customer_order_ref ? " — " + first.customer_order_ref : ""}</div>
        <div><b>Created By:</b> ${staffName(first.created_by)}</div>
        <div><b>STR Date:</b> ${first.created_at ? new Date(first.created_at).toLocaleDateString() : "—"}</div>
        <div><b>Picker:</b> ${first.picked_by ? staffName(first.picked_by) : "—"}</div>
        <div><b>Picked Date:</b> ${first.picked_at ? new Date(first.picked_at).toLocaleString() : "—"}</div>
        <div><b>STR Status:</b> ${statusLabel}</div>
        <div><b>Packer:</b> ${first.packed_by ? staffName(first.packed_by) : "—"}</div>
        <div><b>Packed Date:</b> ${first.packed_at ? new Date(first.packed_at).toLocaleString() : "—"}</div>
        <div></div>
        <div><b>Shipped By:</b> ${first.dispatched_by ? staffName(first.dispatched_by) : "—"}</div>
        <div><b>Shipped Date:</b> ${first.dispatched_at ? new Date(first.dispatched_at).toLocaleString() : "—"}</div>
      </div>
      <table>
        <thead><tr><th>Sr</th><th>Barcode</th><th>Product</th><th>STR / Dispatch Qty</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
        <tfoot><tr><td colspan="3" style="text-align:right">Total</td><td style="text-align:right">${totalQty}</td></tr></tfoot>
      </table>
      <div class="sign">
        <div>Prepared By</div><div>Checked By</div><div>Approved By</div><div>Dispatched By</div><div>Received By</div>
      </div>
    </body></html>`);
    w.document.close(); w.print();
  };

  const confirmStr = async (row) => {
    const f = editForm[row.id] || {};
    const strNumber = (f.strNumber ?? row.str_number ?? "").trim();
    const qty = f.qty !== undefined ? Number(f.qty) : row.qty;
    if (!strNumber) { showToast("Odoo STR# enter karein", "err"); return; }
    if (!qty || qty <= 0) { showToast("Valid qty enter karein", "err"); return; }
    setLoading(true);
    try {
      await sb(`/rest/v1/stk_str?id=eq.${row.id}`, { method: "PATCH", token, body: { str_number: strNumber, qty, status: "reserved", confirmed_by: profile.id, confirmed_at: new Date().toISOString() } });
      if (row.grn_allocation_id) {
        await sb(`/rest/v1/stk_grn_allocations?id=eq.${row.grn_allocation_id}`, { method: "PATCH", token, body: { status: "rtd" } });
      }
      showToast(row.source === "grn_distribution" ? `✓ STR ${strNumber} confirm ho gaya — Logistics tab mein vehicle load k liye ready hai` : `✓ STR ${strNumber} confirm ho gaya — Stocking Picking tab se picker assign karein`);
      setEditForm(f2 => ({ ...f2, [row.id]: {} }));
      load();
    } catch (e) { showToast("Confirm fail: " + e.message, "err"); }
    setLoading(false);
  };

  // Confirms a WHOLE consolidated group (every draft row sharing one str_number) at once —
  // one Odoo STR# entry covers every product line in it, matching the real-world document
  // where a single STR# always carries multiple products to the same destination.
  const confirmGroup = async (groupRows, strNumber) => {
    const trimmed = strNumber.trim();
    if (!trimmed) { showToast("Odoo STR# enter karein", "err"); return; }
    setLoading(true);
    try {
      for (const row of groupRows) {
        await sb(`/rest/v1/stk_str?id=eq.${row.id}`, { method: "PATCH", token, body: { str_number: trimmed, status: "reserved", confirmed_by: profile.id, confirmed_at: new Date().toISOString() } });
        if (row.grn_allocation_id) {
          await sb(`/rest/v1/stk_grn_allocations?id=eq.${row.grn_allocation_id}`, { method: "PATCH", token, body: { status: "rtd" } });
        }
      }
      showToast(`✓ STR ${trimmed} confirm ho gaya — ${groupRows.length} product line(s) is STR mein`);
      setEditForm(f2 => ({ ...f2, [groupRows[0].str_number]: {} }));
      load();
    } catch (e) { showToast("Confirm fail: " + e.message, "err"); }
    setLoading(false);
  };

  const [mergeSelected, setMergeSelected] = useState({}); // { [rowId]: true }
  // Merges several separately-created drafts (each got its own system reference) into ONE
  // STR — required whenever one destination is actually getting multiple products on the same
  // real-world STR document, instead of the Odoo STR# having to be typed in one row at a time.
  const mergeIntoOne = async () => {
    const ids = Object.keys(mergeSelected).filter(k => mergeSelected[k]);
    if (ids.length < 2) { showToast("Kam se kam 2 lines select karein jo consolidate karni hain", "err"); return; }
    const rows = draftStrs.filter(s => ids.includes(s.id));
    const destinations = new Set(rows.map(r => r.destination));
    if (destinations.size > 1) { showToast("Sirf ek hi destination ki lines consolidate ho sakti hain", "err"); return; }
    setLoading(true);
    try {
      const targetRef = rows[0].str_number;
      for (const row of rows.slice(1)) {
        await sb(`/rest/v1/stk_str?id=eq.${row.id}`, { method: "PATCH", token, body: { str_number: targetRef } });
      }
      showToast(`✓ ${rows.length} lines ek STR (${targetRef}) mein consolidate ho gayin`);
      setMergeSelected({});
      load();
    } catch (e) { showToast("Merge fail: " + e.message, "err"); }
    setLoading(false);
  };

  const uploadStrFile = async (file) => {
    setUploading(true);
    try {
      const rows = await parseSheet(file);
      const mapped = rows.map(r => ({
        warehouse_id: whId,
        source: String(r["Customer Order Ref"] ?? "").trim() ? "customer_order" : "weekly_demand",
        customer_order_ref: String(r["Customer Order Ref"] ?? "").trim() || null,
        destination: String(r["Destination"] ?? "").trim(),
        product_barcode: String(r["Barcode"] ?? r["Internal Barcode"] ?? "").trim() || null,
        product_name: String(r["Product Name"] ?? r["Display Name"] ?? "").trim(),
        qty: Number(r["Qty"] ?? r["Quantity"] ?? 0) || 0,
        status: "draft",
        created_by: profile.id
      })).filter(r => r.destination && r.product_name && r.qty > 0);
      if (!mapped.length) { showToast("File mein koi valid row nahi mili (Destination, Product Name, Qty columns check karein)", "err"); setUploading(false); return; }
      // Each row gets its own system reference immediately (traceable from the moment it's
      // created) — Outbound Executive's Odoo STR# later replaces it row by row.
      const firstRef = await nextSysStrRef(token);
      const startN = parseInt(firstRef.match(/(\d+)$/)[1], 10);
      mapped.forEach((r, i) => { r.str_number = `SYS-STR-${String(startN + i).padStart(6, "0")}`; });
      for (let i = 0; i < mapped.length; i += 200) {
        await sb(`/rest/v1/stk_str`, { method: "POST", token, body: mapped.slice(i, i + 200) });
      }
      showToast(`✓ ${mapped.length} STR draft(s) upload ho gaye (system refs SYS-STR-... assign ho gaye). NOTE: "Destination" column exact naam se match karega jaisa Logistics tab k destination master mein hai.`);
      load();
    } catch (e) { showToast("Upload fail: " + e.message, "err"); }
    setUploading(false);
  };

  if (loading) return <EmptyNote text="Loading..." />;

  const TABS = [
    { key: "draft", label: `Draft (${draftStrs.length})` },
    { key: "reserved", label: `Reserved (${reservedStrs.length})` },
    { key: "dispatched", label: `Dispatched (${dispatchedStrs.length})` }
  ];

  return (
    <div>
      <SectionTitle title="Stocking Warehouse — STR (Stock Transfer Requests)" />
      <div style={S.statGrid}>
        {STK_STR_STAGES.map(stage => {
          const count = strs.filter(s => stkStrStage(s) === stage).length;
          return (
            <div key={stage} style={S.statCard}>
              <div style={{ fontSize: 10, color: "#8A8272", letterSpacing: 0.5, fontFamily: "'IBM Plex Mono', monospace" }}>{stage.toUpperCase()}</div>
              <div style={{ fontSize: 24, fontWeight: 700, color: stkStrStageColor(stage), marginTop: 4 }}>{count}</div>
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        {TABS.map(t => <button key={t.key} onClick={() => setTab(t.key)} style={stkPill(tab === t.key)}>{t.label}</button>)}
        <label style={{ ...S.secondaryBtnSm, cursor: "pointer", marginLeft: "auto" }}>
          {uploading ? "Uploading…" : "📤 Bulk Upload STR (Customer Order / Weekly Demand)"}
          <input type="file" accept=".xlsx,.xls" style={{ display: "none" }} disabled={uploading} onChange={e => { const f = e.target.files[0]; if (f) uploadStrFile(f); e.target.value = ""; }} />
        </label>
      </div>

      {tab === "draft" && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Odoo STR# Add Karein & Confirm Karein</div>
          <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 14 }}>Yahan GRN-distribution se aayi drafts aur bulk-uploaded Customer Order/Weekly Demand dono milte hain. Ek destination ki multiple products wali lines ko neeche checkbox se select kar k <strong>"Consolidate"</strong> karein — phir ek hi Odoo STR# se poora group confirm ho jayega (bilkul real-world STR document ki tarah, jahan ek STR# k neeche kaafi products hote hain).</div>
          {(() => {
            const selectedIds = Object.keys(mergeSelected).filter(k => mergeSelected[k]);
            return selectedIds.length > 0 && (
              <div style={{ marginBottom: 14, display: "flex", gap: 10, alignItems: "center" }}>
                <span style={{ fontSize: 12, color: "#6B6355" }}>{selectedIds.length} line(s) selected</span>
                <button style={S.primaryBtnSm} onClick={mergeIntoOne} disabled={loading || selectedIds.length < 2}>🔗 Consolidate Selected Into One STR</button>
                <button style={S.secondaryBtnSm} onClick={() => setMergeSelected({})}>Clear Selection</button>
              </div>
            );
          })()}
          {(() => {
            const groups = {};
            for (const s of draftStrs) { if (!groups[s.str_number]) groups[s.str_number] = []; groups[s.str_number].push(s); }
            const groupEntries = Object.entries(groups);
            if (!groupEntries.length) return <EmptyNote text="Koi draft STR pending nahi" />;
            return groupEntries.map(([strNum, rows]) => {
              const isSysRef = strNum.startsWith("SYS-STR-");
              const groupTotalQty = rows.reduce((s, r) => s + Number(r.qty || 0), 0);
              return (
                <div key={strNum} style={{ background: "#FAF7EF", border: "1px solid #EFE8D8", borderRadius: 8, padding: 14, marginBottom: 12 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, flexWrap: "wrap", gap: 8 }}>
                    <div>
                      <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: isSysRef ? "#8A8272" : "#F5A623", fontWeight: 600 }}>{strNum}</span>
                      {rows.length > 1 && <span style={{ ...S.badgeSm, marginLeft: 8, color: "#4CAF7D", borderColor: "#4CAF7D" }}>{rows.length} products consolidated</span>}
                      <div style={{ fontSize: 12, color: "#6B6355", marginTop: 2 }}>Destination: <strong>{rows[0].destination}</strong> · Total Qty: {groupTotalQty}</div>
                    </div>
                  </div>
                  <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 10 }}>
                    <thead><tr><th style={S.th}></th><th style={S.th}>Source</th><th style={S.th}>Product</th><th style={S.th}>Qty</th></tr></thead>
                    <tbody>
                      {rows.map(s => (
                        <tr key={s.id}>
                          <td style={S.td}><input type="checkbox" checked={!!mergeSelected[s.id]} onChange={e => setMergeSelected(ms => ({ ...ms, [s.id]: e.target.checked }))} /></td>
                          <td style={S.td}><span style={{ ...S.badgeSm, color: s.source === "grn_distribution" ? "#F5A623" : "#5B9EE8", borderColor: s.source === "grn_distribution" ? "#F5A623" : "#5B9EE8" }}>{sourceLabel(s.source)}</span>{s.customer_order_ref && <div style={{ fontSize: 10, color: "#8A8272", marginTop: 2 }}>{s.customer_order_ref}</div>}</td>
                          <td style={S.td}>{s.product_name}</td>
                          <td style={S.td}>{s.qty}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                    <input style={{ ...S.input, width: 180, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Odoo STR#" defaultValue={isSysRef ? "" : strNum} onChange={e => setEditForm(f => ({ ...f, [strNum]: { strNumber: e.target.value } }))} />
                    <button style={S.primaryBtnSm} onClick={() => confirmGroup(rows, editForm[strNum]?.strNumber ?? (isSysRef ? "" : strNum))} disabled={loading}>✓ Create STR ({rows.length} line{rows.length > 1 ? "s" : ""})</button>
                    <button style={S.secondaryBtnSm} onClick={() => printStrDoc(strNum)}>🖨</button>
                  </div>
                </div>
              );
            });
          })()}
        </div>
      )}

      {tab === "reserved" && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Reserved — Vehicle Load & Gatepass ab Logistics Tab Se</div>
          <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 14 }}>Yeh sirf trail hai. Vehicle assign, load confirm, ship, aur Gatepass generate karne k liye <strong>Stocking Logistics</strong> tab par jayein.</div>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr><th style={S.th}>STR#</th><th style={S.th}>Source</th><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Destination</th><th style={S.th}></th></tr></thead>
            <tbody>
              {reservedStrs.map(s => (
                <tr key={s.id}>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{s.str_number}</td>
                  <td style={S.td}>{sourceLabel(s.source)}</td>
                  <td style={S.td}>{s.product_name}</td>
                  <td style={S.td}>{s.qty}</td>
                  <td style={S.td}>{s.destination}</td>
                  <td style={S.td}><button style={S.secondaryBtnSm} onClick={() => printStrDoc(s.str_number)}>🖨 Print STR</button></td>
                </tr>
              ))}
              {!reservedStrs.length && <tr><td style={S.td} colSpan={6}><EmptyNote text="Koi reserved STR nahi mila" /></td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {tab === "dispatched" && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Dispatched — Gatepass History</div>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr><th style={S.th}>Gatepass#</th><th style={S.th}>STR#</th><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Destination</th><th style={S.th}>Status</th><th style={S.th}>Dispatched At</th><th style={S.th}></th></tr></thead>
            <tbody>
              {dispatchedStrs.map(s => (
                <tr key={s.id}>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace" }}>{s.gatepass_number}</td>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{s.str_number}</td>
                  <td style={S.td}>{s.product_name}</td>
                  <td style={S.td}>{s.qty}</td>
                  <td style={S.td}>{s.destination}</td>
                  <td style={S.td}><span style={{ ...S.badgeSm, color: stkStrStageColor(stkStrStage(s)), borderColor: stkStrStageColor(stkStrStage(s)) }}>{stkStrStage(s)}</span></td>
                  <td style={S.td}>{fmtTime(s.dispatched_at)}</td>
                  <td style={S.td}><button style={S.secondaryBtnSm} onClick={() => printStrDoc(s.str_number)}>🖨 Print STR</button></td>
                </tr>
              ))}
              {!dispatchedStrs.length && <tr><td style={S.td} colSpan={8}><EmptyNote text="Abhi tak koi dispatch nahi hua" /></td></tr>}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ================= STOCKING WAREHOUSE — PACKING ================= */
// Runs after Picking (or immediately after STR confirm for GRN-distribution, which skips
// Picking entirely). Packer splits the STR's qty across cartons/sacks, each one getting its
// own QR token — printed on the Gatepass as a cut-out label for that physical carton. Only
// once packed_at is set does the STR become visible in Logistics for vehicle loading.
function StockingPackingView({ token, profile, showToast }) {
  const whId = useStkWarehouseId(token, profile);
  const canAssign = ["admin", "warehouse_lead", "outbound_executive"].includes(profile.role);
  const canWork = ["admin", "warehouse_lead", "packer"].includes(profile.role);
  const [tab, setTab] = useState(canAssign ? "assignment" : "mytasks");
  const [strs, setStrs] = useState([]);
  const [packers, setPackers] = useState([]);
  const [cartons, setCartons] = useState([]);
  const [loading, setLoading] = useState(true);
  const [assignChoice, setAssignChoice] = useState({});
  const [activeStrId, setActiveStrId] = useState(null);
  const [cartonNumber, setCartonNumber] = useState("");
  const [cartonQty, setCartonQty] = useState("");

  const load = async () => {
    if (!whId) return;
    setLoading(true);
    try {
      const [s, p, c] = await Promise.all([
        sb(`/rest/v1/stk_str?warehouse_id=eq.${whId}&status=eq.reserved&select=*`, { token }),
        sb(`/rest/v1/profiles?warehouse_id=eq.${whId}&role=eq.packer&select=id,full_name`, { token }),
        sb(`/rest/v1/stk_str_cartons?warehouse_id=eq.${whId}&select=*`, { token })
      ]);
      setStrs(s || []); setPackers(p || []); setCartons(c || []);
    } catch (e) { showToast("Load fail: " + e.message, "err"); }
    setLoading(false);
  };
  useEffect(() => { load(); }, [whId]);

  const packerName = (id) => packers.find(p => p.id === id)?.full_name || "—";
  const cartonsForStr = (strId) => cartons.filter(c => c.str_id === strId);
  const packedQty = (strId) => cartonsForStr(strId).reduce((s, c) => s + Number(c.qty || 0), 0);

  // Ready for packing once past whatever Picking requires it to clear (GRN-distribution skips
  // Picking entirely and is ready as soon as its STR# is confirmed).
  const readyForPacking = strs.filter(s => (s.source === "grn_distribution" || s.picked_at) && !s.packed_at);
  const unassigned = readyForPacking.filter(s => !s.assigned_packer);
  const myTasks = profile.role === "packer" ? readyForPacking.filter(s => s.assigned_packer === profile.id) : readyForPacking.filter(s => s.assigned_packer);
  const activeStr = activeStrId ? strs.find(s => s.id === activeStrId) : null;

  const assignPacker = async (str) => {
    const packerId = assignChoice[str.id];
    if (!packerId) { showToast("Packer select karein", "err"); return; }
    try {
      await sb(`/rest/v1/stk_str?id=eq.${str.id}`, { method: "PATCH", token, body: { assigned_packer: packerId } });
      showToast(`✓ ${str.product_name} — ${packerName(packerId)} ko assign ho gaya`);
      load();
    } catch (e) { showToast("Assign fail: " + e.message, "err"); }
  };

  const addCarton = async () => {
    if (!activeStr) return;
    const qty = Number(cartonQty);
    const remaining = activeStr.qty - packedQty(activeStr.id);
    if (!cartonNumber.trim()) { showToast("Carton/Sack number likhein", "err"); return; }
    if (!qty || qty <= 0 || qty > remaining) { showToast(`Valid qty enter karein (max ${remaining} baaki hai)`, "err"); return; }
    try {
      await sb(`/rest/v1/stk_str_cartons`, { method: "POST", token, body: { warehouse_id: whId, str_id: activeStr.id, carton_number: cartonNumber.trim(), product_barcode: activeStr.product_barcode, product_name: activeStr.product_name, qty, qr_token: uid(), created_by: profile.id } });
      setCartonNumber(""); setCartonQty("");
      showToast(`✓ Carton ${cartonNumber} — ${qty} pcs add ho gaya`);
      load();
    } catch (e) { showToast("Add fail: " + e.message, "err"); }
  };

  const removeCarton = async (carton) => {
    try {
      await sb(`/rest/v1/stk_str_cartons?id=eq.${carton.id}`, { method: "DELETE", token });
      load();
    } catch (e) { showToast("Remove fail: " + e.message, "err"); }
  };

  const markPackingDone = async (str) => {
    const myCartons = cartonsForStr(str.id);
    if (!myCartons.length) { showToast("Kam se kam ek carton/sack add karein", "err"); return; }
    try {
      await sb(`/rest/v1/stk_str?id=eq.${str.id}`, { method: "PATCH", token, body: { packed_by: profile.id, packed_at: new Date().toISOString() } });

      // Print carton labels right now — this is the moment the physical cartons exist and
      // need QR labels pasted on them, well before any vehicle/Logistics involvement.
      const qrImages = await Promise.all(myCartons.map(async c => {
        try { return { carton: c, dataUrl: await QRCode.toDataURL(c.qr_token, { width: 160, margin: 1 }) }; }
        catch (e) { return { carton: c, dataUrl: null }; }
      }));
      let labelsHtml = "";
      for (const { carton, dataUrl } of qrImages) {
        labelsHtml += `<div class="label">${dataUrl ? `<img src="${dataUrl}" />` : ""}<div class="lbl-text"><div class="cn">${carton.carton_number}</div>${str.product_name}<br/>Qty: ${carton.qty}<br/>STR: ${str.str_number || "—"}<br/>Dest: ${str.destination}</div></div>`;
      }
      const w = window.open("", "_blank");
      w.document.write(`<html><head><title>Carton Labels — ${str.str_number || str.product_name}</title><style>
        body{font-family:Arial;padding:20px;color:#111}
        h2{margin-bottom:2px} .meta{color:#555;font-size:13px;margin-bottom:18px}
        .labels{display:flex;flex-wrap:wrap;gap:14px}
        .label{border:2px dashed #999;border-radius:6px;padding:10px;display:flex;gap:10px;align-items:center;width:280px;page-break-inside:avoid}
        .label img{width:100px;height:100px}
        .lbl-text{font-size:12px;line-height:1.5}
        .cn{font-size:16px;font-weight:800;color:#F5A623}
      </style></head><body>
        <h2>Carton/Sack Labels</h2>
        <div class="meta">STR ${str.str_number || "—"} · ${str.product_name} · ${myCartons.length} carton(s) · Print kar ke har label us carton pe paste karein.</div>
        <div class="labels">${labelsHtml}</div>
      </body></html>`);
      w.document.close(); w.print();

      showToast(`✓ ${str.product_name} packing complete — ${myCartons.length} carton label(s) print ho rahe hain, Logistics tab mein ready hai`);
      setActiveStrId(null);
      load();
    } catch (e) { showToast("Done fail: " + e.message, "err"); }
  };

  if (loading) return <EmptyNote text="Loading..." />;

  const TABS = [
    ...(canAssign ? [{ key: "assignment", label: `Assignment (${unassigned.length})` }] : []),
    ...(canWork ? [{ key: "mytasks", label: `${profile.role === "packer" ? "My Tasks" : "All Assigned"} (${myTasks.length})` }] : [])
  ];

  return (
    <div>
      <SectionTitle title="Stocking Warehouse — Packing" />
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        {TABS.map(t => <button key={t.key} onClick={() => { setTab(t.key); setActiveStrId(null); }} style={stkPill(tab === t.key)}>{t.label}</button>)}
      </div>

      {tab === "assignment" && canAssign && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Ready for Packing — Packer Assign Karein</div>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr><th style={S.th}>STR#</th><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Destination</th><th style={S.th}>Assign To</th><th style={S.th}></th></tr></thead>
            <tbody>
              {unassigned.map(s => (
                <tr key={s.id}>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{s.str_number}</td>
                  <td style={S.td}>{s.product_name}</td>
                  <td style={S.td}>{s.qty}</td>
                  <td style={S.td}>{s.destination}</td>
                  <td style={S.td}>
                    <select style={{ ...S.input, width: 160 }} value={assignChoice[s.id] || ""} onChange={e => setAssignChoice(a => ({ ...a, [s.id]: e.target.value }))}>
                      <option value="">Select packer…</option>
                      {packers.map(p => <option key={p.id} value={p.id}>{p.full_name}</option>)}
                    </select>
                  </td>
                  <td style={S.td}><button style={S.secondaryBtnSm} onClick={() => assignPacker(s)}>Assign</button></td>
                </tr>
              ))}
              {!unassigned.length && <tr><td style={S.td} colSpan={6}><EmptyNote text="Koi STR packing assignment k liye pending nahi" /></td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {tab === "mytasks" && canWork && !activeStr && (
        <div style={S.panel}>
          <div style={S.panelTitle}>{profile.role === "packer" ? "My Packing Tasks" : "All Assigned (oversight)"}</div>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr>{profile.role !== "packer" && <th style={S.th}>Packer</th>}<th style={S.th}>STR#</th><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Packed / Cartons</th><th style={S.th}></th></tr></thead>
            <tbody>
              {myTasks.map(s => (
                <tr key={s.id}>
                  {profile.role !== "packer" && <td style={S.td}>{packerName(s.assigned_packer)}</td>}
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{s.str_number}</td>
                  <td style={S.td}>{s.product_name}</td>
                  <td style={S.td}>{s.qty}</td>
                  <td style={S.td}>{packedQty(s.id)} / {s.qty} — {cartonsForStr(s.id).length} carton(s)</td>
                  <td style={S.td}><button style={S.primaryBtnSm} onClick={() => setActiveStrId(s.id)}>Open</button></td>
                </tr>
              ))}
              {!myTasks.length && <tr><td style={S.td} colSpan={profile.role !== "packer" ? 6 : 5}><EmptyNote text="Koi packing task pending nahi" /></td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {tab === "mytasks" && activeStr && (
        <div style={S.panel}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={S.panelTitle}>Packing — {activeStr.product_name} ({activeStr.str_number})</div>
            <button style={S.secondaryBtnSm} onClick={() => setActiveStrId(null)}>← Back</button>
          </div>
          <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 14 }}>Total qty: {activeStr.qty} · Packed so far: {packedQty(activeStr.id)} · Remaining: {activeStr.qty - packedQty(activeStr.id)}</div>
          <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
            <input style={{ ...S.input, minWidth: 140, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Carton/Sack #" value={cartonNumber} onChange={e => setCartonNumber(e.target.value)} />
            <input type="number" style={{ ...S.input, width: 100 }} placeholder="Qty" value={cartonQty} onChange={e => setCartonQty(e.target.value)} />
            <button style={S.secondaryBtnSm} onClick={addCarton}>+ Add Carton</button>
          </div>
          <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 16 }}>
            <thead><tr><th style={S.th}>Carton/Sack #</th><th style={S.th}>Qty</th><th style={S.th}></th></tr></thead>
            <tbody>
              {cartonsForStr(activeStr.id).map(c => (
                <tr key={c.id}><td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace" }}>{c.carton_number}</td><td style={S.td}>{c.qty}</td><td style={S.td}><button style={{ ...S.secondaryBtnSm, color: "#E5484D", borderColor: "#E5484D" }} onClick={() => removeCarton(c)}>Remove</button></td></tr>
              ))}
              {!cartonsForStr(activeStr.id).length && <tr><td style={S.td} colSpan={3}><EmptyNote text="Abhi koi carton add nahi hua" /></td></tr>}
            </tbody>
          </table>
          <button style={S.primaryBtnSm} onClick={() => markPackingDone(activeStr)}>✓ Packing Done</button>
        </div>
      )}
    </div>
  );
}

/* ================= STOCKING WAREHOUSE — LOGISTICS ================= */
// Vehicle loading + shipping + Gatepass now live here, separate from the STR tab. A Logistics
// Officer picks a destination + vehicle, confirms exactly which reserved STRs are physically
// loaded (creates a stk_vehicle_trips row), then Ship & Generate Gatepass is the single action
// that marks those STRs dispatched, deducts real bin stock for non-GRN-distribution STRs
// (GRN-distribution stock never touched a bin, so nothing to deduct there), and prints the PDF.
function StockingLogisticsView({ token, profile, showToast }) {
  const whId = useStkWarehouseId(token, profile);
  const isAdmin = profile.role === "admin";
  const [strs, setStrs] = useState([]);
  const [trips, setTrips] = useState([]);
  const [cartons, setCartons] = useState([]);
  const [destinations, setDestinations] = useState([]);
  const [loading, setLoading] = useState(true);
  const [activeTripId, setActiveTripId] = useState(null);
  const [scanInput, setScanInput] = useState("");
  const [scanError, setScanError] = useState("");
  const [vehicleNumber, setVehicleNumber] = useState("");
  const [driverName, setDriverName] = useState("");
  const [starting, setStarting] = useState(false);
  const [shippingTripId, setShippingTripId] = useState(null);
  const [newDestName, setNewDestName] = useState("");
  const [cartonLookupInput, setCartonLookupInput] = useState("");
  const [cartonLookupResult, setCartonLookupResult] = useState(null);
  const [warehouseName, setWarehouseName] = useState("Stocking Warehouse");
  const [cartonLookupError, setCartonLookupError] = useState("");

  const load = async () => {
    if (!whId) return;
    setLoading(true);
    try {
      const [s, t, c, d] = await Promise.all([
        sb(`/rest/v1/stk_str?warehouse_id=eq.${whId}&select=*&order=created_at.desc`, { token }),
        sb(`/rest/v1/stk_vehicle_trips?warehouse_id=eq.${whId}&select=*&order=created_at.desc`, { token }),
        sb(`/rest/v1/stk_str_cartons?warehouse_id=eq.${whId}&select=*`, { token }),
        sb(`/rest/v1/stk_destinations?warehouse_id=eq.${whId}&select=*&order=name.asc`, { token })
      ]);
      setStrs(s || []); setTrips(t || []); setCartons(c || []); setDestinations(d || []);
      try { const whRows = await sb(`/rest/v1/warehouses?id=eq.${whId}&select=name`, { token }); if (whRows?.[0]?.name) setWarehouseName(whRows[0].name); } catch (e) { /* non-critical */ }
    } catch (e) { showToast("Load fail: " + e.message, "err"); }
    setLoading(false);
  };
  useEffect(() => { load(); }, [whId]);

  const strById = (id) => strs.find(s => s.id === id);
  const cartonsForStr = (strId) => cartons.filter(c => c.str_id === strId);
  const sourceLabel = (s) => s === "grn_distribution" ? "GRN Distribution" : s === "customer_order" ? "Customer Order" : "Weekly Demand";
  const awaitingPick = strs.filter(s => s.status === "reserved" && s.source !== "grn_distribution" && !s.picked_at);
  const awaitingPack = strs.filter(s => s.status === "reserved" && (s.source === "grn_distribution" || s.picked_at) && !s.packed_at);
  const loadingTrips = trips.filter(t => t.status === "loading");
  const shippedTrips = trips.filter(t => t.status === "shipped");
  const cartonsInTrip = (tripId) => cartons.filter(c => c.vehicle_trip_id === tripId && c.status === "loaded");
  const activeTrip = activeTripId ? trips.find(t => t.id === activeTripId) : null;

  const addDestination = async () => {
    if (!newDestName.trim()) return;
    try {
      await sb(`/rest/v1/stk_destinations`, { method: "POST", token, body: { warehouse_id: whId, name: newDestName.trim() } });
      setNewDestName(""); load();
    } catch (e) { showToast("Add fail: " + e.message, "err"); }
  };

  // Only ONE destination should represent the E-commerce Warehouse (H/W) link at a time —
  // clicking a destination toggles it on and clears the flag from every other one.
  const toggleEcommerceDestination = async (dest) => {
    try {
      const turningOn = !dest.is_ecommerce_destination;
      if (turningOn) {
        const others = destinations.filter(d => d.is_ecommerce_destination && d.id !== dest.id);
        for (const o of others) await sb(`/rest/v1/stk_destinations?id=eq.${o.id}`, { method: "PATCH", token, body: { is_ecommerce_destination: false } });
      }
      await sb(`/rest/v1/stk_destinations?id=eq.${dest.id}`, { method: "PATCH", token, body: { is_ecommerce_destination: turningOn } });
      showToast(turningOn ? `⭐ ${dest.name} ab E-commerce Warehouse (H/W) se link ho gaya` : `${dest.name} unlink ho gaya`);
      load();
    } catch (e) { showToast("Update fail: " + e.message, "err"); }
  };

  // Scan/type a carton's QR token to see exactly what's inside it — the same lookup a shop
  // could do once they scan the physical label pasted on the carton.
  const lookupCarton = async () => {
    const t = cartonLookupInput.trim();
    setCartonLookupResult(null); setCartonLookupError("");
    if (!t) return;
    try {
      const rows = await sb(`/rest/v1/stk_str_cartons?warehouse_id=eq.${whId}&qr_token=eq.${encodeURIComponent(t)}&select=*`, { token });
      if (!rows || !rows.length) { setCartonLookupError("Yeh carton code kisi record se match nahi hua"); return; }
      setCartonLookupResult(rows[0]);
    } catch (e) { setCartonLookupError("Lookup fail: " + e.message); }
  };

  const startNewLoad = async () => {
    setStarting(true);
    try {
      const trip = await sb(`/rest/v1/stk_vehicle_trips`, { method: "POST", token, prefer: "return=representation", body: { warehouse_id: whId, status: "loading" } });
      await load();
      setActiveTripId(trip[0].id);
      setVehicleNumber(""); setDriverName("");
    } catch (e) { showToast("Start fail: " + e.message, "err"); }
    setStarting(false);
  };

  // Logistics Officer scans each carton's pasted QR/barcode as it physically goes onto the
  // vehicle — the single point of truth for "what's actually loaded", independent of whether
  // an STR's other cartons made it on or are left for a later vehicle.
  const scanCartonToLoad = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : scanInput).trim();
    setScanInput(""); setScanError("");
    if (!code || !activeTripId) return;
    const carton = cartons.find(c => c.qr_token === code);
    if (!carton) { setScanError(`"${code}" kisi carton se match nahi hua`); return; }
    if (carton.status !== "packed") { setScanError(`Carton ${carton.carton_number} already ${carton.status === "shipped" ? "shipped" : "kisi aur vehicle pe loaded"} hai`); return; }
    const str = strById(carton.str_id);
    const existingDest = cartonsInTrip(activeTripId).map(c => strById(c.str_id)?.destination).find(Boolean);
    if (existingDest && str && str.destination !== existingDest && !window.confirm(`Is vehicle mein ab tak "${existingDest}" ki cartons hain — yeh "${str.destination}" ki hai. Phir bhi load karein?`)) return;
    try {
      await sb(`/rest/v1/stk_str_cartons?id=eq.${carton.id}`, { method: "PATCH", token, body: { status: "loaded", vehicle_trip_id: activeTripId, loaded_by: profile.id, loaded_at: new Date().toISOString() } });
      showToast(`✓ Carton ${carton.carton_number} loaded — ${str?.product_name || ""}`);
      load();
    } catch (e) { setScanError("Scan fail: " + e.message); }
  };

  const unscanCarton = async (carton) => {
    try {
      await sb(`/rest/v1/stk_str_cartons?id=eq.${carton.id}`, { method: "PATCH", token, body: { status: "packed", vehicle_trip_id: null, loaded_by: null, loaded_at: null } });
      load();
    } catch (e) { showToast("Remove fail: " + e.message, "err"); }
  };

  const nextGatepassNumber = async () => {
    const rows = await sb(`/rest/v1/stk_str?gatepass_number=not.is.null&select=gatepass_number&order=gatepass_number.desc&limit=1`, { token });
    let n = 0;
    if (rows && rows[0]?.gatepass_number) { const m = String(rows[0].gatepass_number).match(/(\d+)$/); if (m) n = parseInt(m[1], 10); }
    return `GP-${String(n + 1).padStart(5, "0")}`;
  };

  // Ships only the cartons actually scanned onto this vehicle — an STR is only marked fully
  // "dispatched" once every one of its cartons has shipped; if space ran out mid-STR, its
  // remaining (still 'packed') cartons simply wait for the next vehicle.
  const shipTrip = async (trip) => {
    const loadedCartons = cartonsInTrip(trip.id);
    if (!loadedCartons.length) { showToast("Is vehicle mein koi carton scan nahi hui", "err"); return; }
    if (!vehicleNumber.trim() || !driverName.trim()) { showToast("Vehicle # aur Driver Name enter karein", "err"); return; }
    setShippingTripId(trip.id);
    try {
      const gatepassNumber = await nextGatepassNumber();
      const now = new Date().toISOString();
      await sb(`/rest/v1/stk_vehicle_trips?id=eq.${trip.id}`, { method: "PATCH", token, body: { status: "shipped", vehicle_number: vehicleNumber.trim(), driver_name: driverName.trim(), shipped_by: profile.id, shipped_at: now, gatepass_number: gatepassNumber } });
      for (const c of loadedCartons) {
        await sb(`/rest/v1/stk_str_cartons?id=eq.${c.id}`, { method: "PATCH", token, body: { status: "shipped" } });
      }
      const touchedStrIds = [...new Set(loadedCartons.map(c => c.str_id))];
      let ecomForwardedCount = 0;
      for (const strId of touchedStrIds) {
        const str = strById(strId);
        const allCartons = cartonsForStr(strId);
        const allShipped = allCartons.every(c => c.id in Object.fromEntries(loadedCartons.map(lc => [lc.id, true])) || c.status === "shipped");
        if (allShipped) {
          await sb(`/rest/v1/stk_str?id=eq.${strId}`, { method: "PATCH", token, body: { status: "dispatched", gatepass_number: gatepassNumber, dispatched_by: profile.id, dispatched_at: now } });
          if (str?.grn_allocation_id) {
            await sb(`/rest/v1/stk_grn_allocations?id=eq.${str.grn_allocation_id}`, { method: "PATCH", token, body: { status: "dispatched" } });
          }
          // If this STR's destination IS the E-commerce Warehouse (flagged in Destination
          // Master), forward it directly into E-commerce's own Putaway queue — no manual
          // GRN/upload needed there. Only "other" (real shop) destinations still need that.
          const destFlag = destinations.find(d => d.name === str?.destination);
          if (destFlag?.is_ecommerce_destination && str) {
            try {
              const whs = await sb(`/rest/v1/warehouses?select=id,name`, { token });
              const ecomWh = (whs || []).find(w => w.id !== whId);
              let matched = await lookupProductByCode(token, str.product_barcode || "");
              if (!matched && str.product_barcode) {
                // Not in E-commerce's catalogue yet — auto-create it from what Stocking
                // already knows (barcode + name), same "seed, never overwrite" pattern used
                // for stk_products, so this STR's forwarding is never blocked on a missing
                // catalogue entry.
                try {
                  const created = await sb(`/rest/v1/products?on_conflict=barcode`, { method: "POST", token, prefer: "resolution=ignore-duplicates,return=representation", body: { barcode: str.product_barcode, sku: str.product_barcode, name: str.product_name } });
                  matched = created?.[0] || await lookupProductByCode(token, str.product_barcode);
                } catch (e) { /* auto-create failed — fall through to the warning below */ }
              }
              if (ecomWh && matched) {
                await sb(`/rest/v1/putaway_tasks`, { method: "POST", token, body: { product_id: matched.id, qty: str.qty, status: "pending", source_str_id: str.id } });
                ecomForwardedCount++;
              } else if (!matched) {
                showToast(`⚠ STR ${str.str_number} — "${str.product_name}" E-commerce catalogue mein auto-add bhi nahi ho saka, Putaway task nahi bana. Manually add karein.`, "err");
              }
            } catch (e) { /* forwarding is best-effort — STR itself is still marked dispatched */ }
          }
        }
      }

      // Group by STR for the printed summary — carton numbers only (labels were already
      // printed with QR codes at packing time), plus how many of each STR's total made it.
      let rowsHtml = ""; let sr = 0; let destinationForDoc = "";
      for (const strId of touchedStrIds) {
        const str = strById(strId);
        if (!destinationForDoc && str?.destination) destinationForDoc = str.destination;
        sr++;
        const shippedHere = loadedCartons.filter(c => c.str_id === strId);
        const totalCartons = cartonsForStr(strId).length;
        rowsHtml += `<tr><td>${sr}</td><td>${str?.str_number || "—"}</td><td>${str ? fmtTime(str.created_at) : "—"}</td><td>${str?.product_name || "—"}</td><td style="text-align:right">${str?.qty ?? "—"}</td><td style="text-align:right">${shippedHere.length} / ${totalCartons}</td><td>${shippedHere.map(c => c.carton_number).join(", ")}</td></tr>`;
      }

      const w = window.open("", "_blank");
      w.document.write(`<html><head><title>Gatepass ${gatepassNumber}</title><style>
        body{font-family:Arial;padding:24px;color:#111;font-size:13px}
        .top{display:flex;justify-content:space-between;border-bottom:2px solid #1A1206;padding-bottom:10px;margin-bottom:10px}
        .subtitle{text-align:center;font-weight:700;letter-spacing:1px;font-size:16px}
        .gp-number{font-size:18px;font-weight:800}
        .meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 24px;font-size:12.5px;margin-bottom:16px;border-bottom:1px solid #ccc;padding-bottom:12px}
        .meta-grid b{color:#555;font-weight:600}
        table{width:100%;border-collapse:collapse;margin-top:6px} th,td{border:1px solid #999;padding:7px 9px;font-size:12px;text-align:left}
        th{background:#F5A623;color:#1A1206} td:nth-child(1),th:nth-child(1){text-align:center;width:32px}
        .sign{margin-top:60px;display:flex;justify-content:space-between}
        .sign div{border-top:1px solid #333;width:150px;text-align:center;padding-top:6px;font-size:11px}
      </style></head><body>
        <div class="top"><div><b>From:</b> HABITT H/W</div><div class="subtitle">GATEPASS</div><div><b>To:</b> ${destinationForDoc || "—"}</div></div>
        <div class="meta-grid">
          <div><b>Gatepass#:</b> ${gatepassNumber}</div>
          <div><b>Vehicle #:</b> ${vehicleNumber}</div>
          <div><b>Driver:</b> ${driverName}</div>
          <div><b>Shipped By:</b> ${profile.full_name || "—"}</div>
          <div><b>Shipped Date:</b> ${new Date().toLocaleString()}</div>
          <div><b>Total STRs:</b> ${touchedStrIds.length}</div>
        </div>
        <table><thead><tr><th>Sr</th><th>STR#</th><th>Created Date</th><th>Product</th><th>STR Qty</th><th>Cartons Shipped</th><th>Carton #s</th></tr></thead><tbody>${rowsHtml}</tbody></table>
        <div class="sign"><div>Logistics Officer</div><div>Security / Gate</div><div>Driver</div></div>
      </body></html>`);
      w.document.close(); w.print();
      showToast(`✅ Gatepass ${gatepassNumber} generate ho gaya — ${loadedCartons.length} carton(s) shipped${ecomForwardedCount ? ` — ${ecomForwardedCount} STR(s) E-commerce Putaway mein forward ho gayi` : ""}`);
      setActiveTripId(null); setVehicleNumber(""); setDriverName("");
      load();
    } catch (e) { showToast("Ship fail: " + e.message, "err"); }
    setShippingTripId(null);
  };

  if (loading) return <EmptyNote text="Loading..." />;

  return (
    <div>
      <SectionTitle title="Stocking Warehouse — Logistics" />

      <div style={S.panel}>
        <div style={S.panelTitle}>📦 Carton Lookup</div>
        <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 10 }}>Carton/Sack pe paste QR code scan ya code type karein — uske andar ki poori detail yahan dikh jayegi.</div>
        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          <input style={{ ...S.input, minWidth: 220, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Carton QR code scan/type karein" value={cartonLookupInput} onChange={e => setCartonLookupInput(e.target.value)} onKeyDown={e => e.key === "Enter" && lookupCarton()} />
          <CameraScanButton onScan={(text) => { setCartonLookupInput(text); setTimeout(lookupCarton, 0); }} />
          <button style={S.secondaryBtnSm} onClick={lookupCarton}>🔍 Lookup</button>
        </div>
        {cartonLookupError && <div style={{ color: "#E5484D", fontSize: 12, marginBottom: 8 }}>{cartonLookupError}</div>}
        {cartonLookupResult && (
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr><th style={S.th}>Carton/Sack #</th><th style={S.th}>Barcode</th><th style={S.th}>Product Name</th><th style={S.th}>Qty</th></tr></thead>
            <tbody>
              <tr>
                <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace" }}>{cartonLookupResult.carton_number}</td>
                <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{cartonLookupResult.product_barcode || "—"}</td>
                <td style={S.td}>{cartonLookupResult.product_name}</td>
                <td style={S.td}>{cartonLookupResult.qty}</td>
              </tr>
            </tbody>
          </table>
        )}
      </div>

      {isAdmin && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Destination Master</div>
          <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 10 }}>Odoo-based exact location names yahan add karein (jaise Ecom, Shaheen, BC, DHA LHR) — STR creation isi list se lock hoti hai. Jo destination E-commerce Warehouse (H/W) ko represent karti hai usay ⭐ mark karein — us destination ki STRs dispatch hote hi E-commerce k Putaway tab mein automatically forward ho jayengi, koi manual GRN/upload nahi lagega.</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
            <input style={{ ...S.input, maxWidth: 220 }} placeholder="Naya destination naam" value={newDestName} onChange={e => setNewDestName(e.target.value)} />
            <button style={S.secondaryBtnSm} onClick={addDestination}>+ Add</button>
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {destinations.map(d => (
              <span key={d.id} style={{ ...S.badgeSm, cursor: "pointer", ...(d.is_ecommerce_destination ? { color: "#F5A623", borderColor: "#F5A623", fontWeight: 600 } : {}) }} onClick={() => toggleEcommerceDestination(d)} title="Click kar k E-commerce Warehouse link toggle karein">
                {d.is_ecommerce_destination && "⭐ "}{d.name}
              </span>
            ))}
            {!destinations.length && <EmptyNote text="Koi destination abhi tak add nahi hui" />}
          </div>
        </div>
      )}

      {(awaitingPick.length > 0 || awaitingPack.length > 0) && (
        <div style={S.panel}>
          {awaitingPick.length > 0 && <div style={{ fontSize: 12, color: "#F5A623" }}>⚠ {awaitingPick.length} STR(s) Stocking Picking tab se pick hone ka intezar kar rahi hain.</div>}
          {awaitingPack.length > 0 && <div style={{ fontSize: 12, color: "#F5A623", marginTop: 6 }}>⚠ {awaitingPack.length} STR(s) Stocking Packing tab se packing ka intezar kar rahi hain.</div>}
        </div>
      )}

      {!activeTripId && (
        <div style={S.panel}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={S.panelTitle}>Vehicle Loading</div>
            <button style={S.primaryBtnSm} onClick={startNewLoad} disabled={starting}>{starting ? "Shuru ho raha…" : "+ Start New Vehicle Load"}</button>
          </div>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr><th style={S.th}>Started</th><th style={S.th}>Cartons Scanned</th><th style={S.th}></th></tr></thead>
            <tbody>
              {loadingTrips.map(trip => (
                <tr key={trip.id}>
                  <td style={S.td}>{fmtTime(trip.created_at)}</td>
                  <td style={S.td}>{cartonsInTrip(trip.id).length}</td>
                  <td style={S.td}><button style={S.secondaryBtnSm} onClick={() => setActiveTripId(trip.id)}>Resume</button></td>
                </tr>
              ))}
              {!loadingTrips.length && <tr><td style={S.td} colSpan={3}><EmptyNote text="Koi vehicle load abhi shuru nahi hui" /></td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {activeTripId && activeTrip && (
        <div style={S.panel}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={S.panelTitle}>Scan Cartons — Vehicle Loading</div>
            <button style={S.secondaryBtnSm} onClick={() => setActiveTripId(null)}>← Back (load save rahega)</button>
          </div>
          <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
            <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan carton QR/barcode, then Enter" value={scanInput} onChange={e => setScanInput(e.target.value)} onKeyDown={e => e.key === "Enter" && scanCartonToLoad()} />
            <CameraScanButton onScan={(text) => scanCartonToLoad(text)} />
            <button style={S.primaryBtnSm} onClick={() => scanCartonToLoad()}>Scan</button>
          </div>
          {scanError && <div style={{ color: "#E5484D", fontSize: 12, marginBottom: 10 }}>{scanError}</div>}

          <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 16 }}>
            <thead><tr><th style={S.th}>Carton #</th><th style={S.th}>STR#</th><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Destination</th><th style={S.th}>STR Progress</th><th style={S.th}></th></tr></thead>
            <tbody>
              {cartonsInTrip(activeTripId).map(c => {
                const str = strById(c.str_id);
                const total = cartonsForStr(c.str_id).length;
                const shippedOrLoaded = cartonsForStr(c.str_id).filter(x => x.status !== "packed").length;
                return (
                  <tr key={c.id}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{c.carton_number}</td>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace" }}>{str?.str_number}</td>
                    <td style={S.td}>{c.product_name}</td>
                    <td style={S.td}>{c.qty}</td>
                    <td style={S.td}>{str?.destination}</td>
                    <td style={{ ...S.td, color: shippedOrLoaded === total ? "#4CAF7D" : "#8A8272" }}>{shippedOrLoaded} / {total} cartons</td>
                    <td style={S.td}><button style={{ ...S.secondaryBtnSm, color: "#E5484D", borderColor: "#E5484D" }} onClick={() => unscanCarton(c)}>Remove</button></td>
                  </tr>
                );
              })}
              {!cartonsInTrip(activeTripId).length && <tr><td style={S.td} colSpan={7}><EmptyNote text="Abhi koi carton scan nahi hui" /></td></tr>}
            </tbody>
          </table>

          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
            <input style={{ ...S.input, minWidth: 140 }} placeholder="Vehicle #" value={vehicleNumber} onChange={e => setVehicleNumber(e.target.value)} />
            <input style={{ ...S.input, minWidth: 160 }} placeholder="Driver Name" value={driverName} onChange={e => setDriverName(e.target.value)} />
            <button style={S.primaryBtnSm} onClick={() => shipTrip(activeTrip)} disabled={shippingTripId === activeTripId}>{shippingTripId === activeTripId ? "Ship ho raha…" : "🚚 Ship & Generate Gatepass"}</button>
          </div>
          <div style={{ fontSize: 11, color: "#8A8272", marginTop: 8 }}>Jab jagah complete ho jaye to baki cartons chhor k ship kar sakte hain — unki STR agli vehicle k liye pending reh jayegi.</div>
        </div>
      )}

      <div style={S.panel}>
        <div style={S.panelTitle}>Shipped — Gatepass History</div>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead><tr><th style={S.th}>Gatepass#</th><th style={S.th}>Vehicle</th><th style={S.th}>Driver</th><th style={S.th}>Cartons</th><th style={S.th}>Shipped At</th></tr></thead>
          <tbody>
            {shippedTrips.map(trip => (
              <tr key={trip.id}>
                <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace" }}>{trip.gatepass_number}</td>
                <td style={S.td}>{trip.vehicle_number || "—"}</td>
                <td style={S.td}>{trip.driver_name || "—"}</td>
                <td style={S.td}>{cartons.filter(c => c.vehicle_trip_id === trip.id).length}</td>
                <td style={S.td}>{fmtTime(trip.shipped_at)}</td>
              </tr>
            ))}
            {!shippedTrips.length && <tr><td style={S.td} colSpan={5}><EmptyNote text="Abhi tak koi shipment nahi hui" /></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ================= STOCKING WAREHOUSE — PICKING ================= */
// Only Customer Order / Weekly Demand STRs land here — GRN-distribution stock never touched a
// bin, so it skips picking entirely and goes straight to Logistics once its STR# is confirmed.
// Outbound Executive/Admin/Lead assigns a reserved-but-unpicked STR to a Picker; the Picker
// picks it from a bin that actually holds the product (qty capped to what's really there),
// which is the single point real stock leaves that bin (an stk_inventory_adjustments row).
function StockingPickingView({ token, profile, showToast }) {
  const whId = useStkWarehouseId(token, profile);
  const canAssign = ["admin", "warehouse_lead", "outbound_executive"].includes(profile.role);
  const canWork = ["admin", "warehouse_lead", "picker"].includes(profile.role);
  const [tab, setTab] = useState(canAssign ? "assignment" : "mytasks");
  const [strs, setStrs] = useState([]);
  const [queue, setQueue] = useState([]);
  const [adjustments, setAdjustments] = useState([]);
  const [bins, setBins] = useState([]);
  const [pickers, setPickers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [assignChoice, setAssignChoice] = useState({});
  const [pickForm, setPickForm] = useState({}); // { [strId]: { binId, qty } }

  const load = async () => {
    if (!whId) return;
    setLoading(true);
    try {
      const [s, q, adj, b, p] = await Promise.all([
        sb(`/rest/v1/stk_str?warehouse_id=eq.${whId}&status=eq.reserved&select=*`, { token }),
        sb(`/rest/v1/stk_putaway_queue?warehouse_id=eq.${whId}&status=eq.completed&select=*`, { token }),
        sb(`/rest/v1/stk_inventory_adjustments?warehouse_id=eq.${whId}&select=*`, { token }),
        sb(`/rest/v1/bins?warehouse_id=eq.${whId}&select=*&order=code.asc`, { token }),
        sb(`/rest/v1/profiles?warehouse_id=eq.${whId}&role=eq.picker&select=id,full_name`, { token })
      ]);
      setStrs((s || []).filter(x => x.source !== "grn_distribution"));
      setQueue(q || []); setAdjustments(adj || []); setBins(b || []); setPickers(p || []);
    } catch (e) { showToast("Load fail: " + e.message, "err"); }
    setLoading(false);
  };
  useEffect(() => { load(); }, [whId]);

  const pickerName = (id) => pickers.find(p => p.id === id)?.full_name || "—";
  const binCode = (id) => bins.find(b => b.id === id)?.code || "—";

  // Per-bin on-hand for a given product, so a Picker can only pick what's really there.
  const binsForProduct = (barcode, name) => {
    const key = barcode || name;
    const perBin = {};
    for (const q of queue) if ((q.product_barcode || q.product_name) === key) perBin[q.bin_id] = (perBin[q.bin_id] || 0) + Number(q.qty || 0);
    for (const a of adjustments) if ((a.product_barcode || a.product_name) === key) perBin[a.bin_id] = (perBin[a.bin_id] || 0) + Number(a.qty_delta || 0);
    return Object.entries(perBin).filter(([, v]) => v > 0).map(([binId, avail]) => ({ binId, avail }));
  };

  const unassigned = strs.filter(s => !s.assigned_picker && !s.picked_at);
  const myTasks = profile.role === "picker" ? strs.filter(s => s.assigned_picker === profile.id && !s.picked_at) : strs.filter(s => s.assigned_picker && !s.picked_at);

  const assignPicker = async (str) => {
    const pickerId = assignChoice[str.id];
    if (!pickerId) { showToast("Picker select karein", "err"); return; }
    try {
      await sb(`/rest/v1/stk_str?id=eq.${str.id}`, { method: "PATCH", token, body: { assigned_picker: pickerId } });
      showToast(`✓ ${str.product_name} — ${pickerName(pickerId)} ko assign ho gaya`);
      load();
    } catch (e) { showToast("Assign fail: " + e.message, "err"); }
  };

  const confirmPick = async (str) => {
    const f = pickForm[str.id] || {};
    const availableBins = binsForProduct(str.product_barcode, str.product_name);
    const typedCode = (f.binCode || "").trim();
    const match = availableBins.find(b => (binCode(b.binId) || "").toLowerCase() === typedCode.toLowerCase());
    if (!match) { showToast("Sahi bin code likhein (jismein yeh product available ho)", "err"); return; }
    const binId = match.binId;
    const qty = f.qty !== undefined ? Number(f.qty) : str.qty;
    if (!qty || qty <= 0 || qty > match.avail) { showToast(`Valid qty enter karein (max ${match.avail} is bin mein)`, "err"); return; }
    try {
