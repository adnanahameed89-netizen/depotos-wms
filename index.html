      await sb(`/rest/v1/stk_inventory_adjustments`, { method: "POST", token, body: { warehouse_id: whId, product_barcode: str.product_barcode, product_name: str.product_name, bin_id: binId, qty_delta: -qty, reason: `Picked for STR ${str.str_number || ""}`, source: "manual", created_by: profile.id } });
      await sb(`/rest/v1/stk_str?id=eq.${str.id}`, { method: "PATCH", token, body: { picked_by: profile.id, picked_at: new Date().toISOString(), picked_bin_id: binId, qty } });
      showToast(`✓ ${str.product_name} — ${qty} pick ho gayi ${binCode(binId)} se, Logistics tab mein ready hai`);
      setPickForm(pf => ({ ...pf, [str.id]: {} }));
      load();
    } catch (e) { showToast("Pick fail: " + e.message, "err"); }
  };

  if (loading) return <EmptyNote text="Loading..." />;

  const TABS = [
    ...(canAssign ? [{ key: "assignment", label: `Assignment (${unassigned.length})` }] : []),
    ...(canWork ? [{ key: "mytasks", label: `${profile.role === "picker" ? "My Tasks" : "All Assigned"} (${myTasks.length})` }] : [])
  ];

  return (
    <div>
      <SectionTitle title="Stocking Warehouse — Picking" />
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        {TABS.map(t => <button key={t.key} onClick={() => setTab(t.key)} style={stkPill(tab === t.key)}>{t.label}</button>)}
      </div>

      {tab === "assignment" && canAssign && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Customer Order / Weekly Demand STRs — Picker Assign Karein</div>
          <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 14 }}>GRN-distribution STRs yahan nahi aatin — woh direct Logistics tab mein ready hoti hain.</div>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr><th style={S.th}>STR#</th><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Destination</th><th style={S.th}>Assign To</th><th style={S.th}></th></tr></thead>
            <tbody>
              {unassigned.map(s => (
                <tr key={s.id}>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{s.str_number}</td>
                  <td style={S.td}>{s.product_name}</td>
                  <td style={S.td}>{s.qty}</td>
                  <td style={S.td}>{s.destination}</td>
                  <td style={S.td}>
                    <select style={{ ...S.input, width: 160 }} value={assignChoice[s.id] || ""} onChange={e => setAssignChoice(a => ({ ...a, [s.id]: e.target.value }))}>
                      <option value="">Select picker…</option>
                      {pickers.map(p => <option key={p.id} value={p.id}>{p.full_name}</option>)}
                    </select>
                  </td>
                  <td style={S.td}><button style={S.secondaryBtnSm} onClick={() => assignPicker(s)}>Assign</button></td>
                </tr>
              ))}
              {!unassigned.length && <tr><td style={S.td} colSpan={6}><EmptyNote text="Koi STR assignment k liye pending nahi" /></td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {tab === "mytasks" && canWork && (
        <div style={S.panel}>
          <div style={S.panelTitle}>{profile.role === "picker" ? "My Picking Tasks" : "All Assigned (oversight)"}</div>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr>{profile.role !== "picker" && <th style={S.th}>Picker</th>}<th style={S.th}>STR#</th><th style={S.th}>Product</th><th style={S.th}>Qty Needed</th><th style={S.th}>Pick From Bin</th><th style={S.th}>Qty to Pick</th><th style={S.th}></th></tr></thead>
            <tbody>
              {myTasks.map(s => {
                const availableBins = binsForProduct(s.product_barcode, s.product_name);
                return (
                  <tr key={s.id}>
                    {profile.role !== "picker" && <td style={S.td}>{pickerName(s.assigned_picker)}</td>}
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{s.str_number}</td>
                    <td style={S.td}>{s.product_name}</td>
                    <td style={S.td}>{s.qty}</td>
                    <td style={S.td}>
                      <input list={`stkPickBinDatalist-${s.id}`} style={{ ...S.input, width: 140, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Bin code" value={pickForm[s.id]?.binCode || ""} onChange={e => setPickForm(pf => ({ ...pf, [s.id]: { ...pf[s.id], binCode: e.target.value } }))} />
                      <datalist id={`stkPickBinDatalist-${s.id}`}>
                        {availableBins.map(b => <option key={b.binId} value={binCode(b.binId)} label={`${b.avail} avail`} />)}
                      </datalist>
                    </td>
                    <td style={S.td}><input type="number" style={{ ...S.input, width: 80 }} placeholder={s.qty} value={pickForm[s.id]?.qty ?? ""} onChange={e => setPickForm(pf => ({ ...pf, [s.id]: { ...pf[s.id], qty: e.target.value } }))} /></td>
                    <td style={S.td}><button style={S.primaryBtnSm} onClick={() => confirmPick(s)}>✓ Confirm Pick</button></td>
                  </tr>
                );
              })}
              {!myTasks.length && <tr><td style={S.td} colSpan={profile.role !== "picker" ? 7 : 6}><EmptyNote text="Koi picking task pending nahi" /></td></tr>}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ================= STOCKING WAREHOUSE — REPAIR/TOUCH-UP ================= */
// A physically dedicated, non-saleable bin ("REPAIR-HOLD") is used the same way E-commerce
// uses "PNA-HOLD" — auto-created if missing. Reporting an item debits its source bin and
// credits REPAIR-HOLD (a clean bin-to-bin trail); completing the repair-putaway debits
// REPAIR-HOLD and credits wherever the Putaway Officer actually puts it away.
const STK_REPAIR_BIN_CODE = "REPAIR-HOLD";
function StockingRepairView({ token, profile, showToast }) {
  const whId = useStkWarehouseId(token, profile);
  const canReport = ["admin", "warehouse_lead", "picker", "outbound_executive"].includes(profile.role);
  const canFix = ["admin", "warehouse_lead", "outbound_executive"].includes(profile.role);
  const canDoPutaway = ["admin", "warehouse_lead", "putaway_officer"].includes(profile.role);
  const [bins, setBins] = useState([]);
  const [queue, setQueue] = useState([]);
  const [adjustments, setAdjustments] = useState([]);
  const [putawayOfficers, setPutawayOfficers] = useState([]);
  const [repairItems, setRepairItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [repairForm, setRepairForm] = useState({ barcode: "", name: "", binId: "", qty: "" });
  const [repairAssignChoice, setRepairAssignChoice] = useState({});
  const [repairBinChoice, setRepairBinChoice] = useState({});

  const load = async () => {
    if (!whId) return;
    setLoading(true);
    try {
      const [b, q, adj, po, rep] = await Promise.all([
        sb(`/rest/v1/bins?warehouse_id=eq.${whId}&select=*&order=code.asc`, { token }),
        sb(`/rest/v1/stk_putaway_queue?warehouse_id=eq.${whId}&status=eq.completed&select=*`, { token }),
        sb(`/rest/v1/stk_inventory_adjustments?warehouse_id=eq.${whId}&select=*`, { token }),
        sb(`/rest/v1/profiles?warehouse_id=eq.${whId}&role=eq.putaway_officer&select=id,full_name`, { token }),
        sb(`/rest/v1/stk_repair_queue?warehouse_id=eq.${whId}&select=*&order=reported_at.desc`, { token })
      ]);
      setBins(b || []); setQueue(q || []); setAdjustments(adj || []); setPutawayOfficers(po || []); setRepairItems(rep || []);
    } catch (e) { showToast("Load fail: " + e.message, "err"); }
    setLoading(false);
  };
  useEffect(() => { load(); }, [whId]);

  const binCode = (id) => bins.find(b => b.id === id)?.code || "—";
  const putawayOfficerName = (id) => putawayOfficers.find(p => p.id === id)?.full_name || "—";
  const allStockedBins = useMemo(() => {
    const set = new Set();
    for (const q of queue) if (Number(q.qty) > 0) set.add(q.bin_id);
    for (const a of adjustments) if (Number(a.qty_delta) > 0) set.add(a.bin_id);
    return [...set];
  }, [queue, adjustments]);

  const pendingRepair = repairItems.filter(r => r.status === "pending");
  const assignedRepair = repairItems.filter(r => r.status === "assigned_putaway");
  const myRepairPutaway = profile.role === "putaway_officer" ? assignedRepair.filter(r => r.assigned_putaway_officer === profile.id) : assignedRepair;
  const completedRepair = repairItems.filter(r => r.status === "completed");

  // Finds the dedicated Repair/Touch-up bin for this warehouse, auto-creating it (non-saleable
  // by naming convention, same as PNA-HOLD) the first time it's needed.
  const ensureRepairBin = async () => {
    const existing = bins.find(b => b.code === STK_REPAIR_BIN_CODE);
    if (existing) return existing.id;
    const created = await sb(`/rest/v1/bins`, { method: "POST", token, prefer: "return=representation", body: { warehouse_id: whId, code: STK_REPAIR_BIN_CODE } });
    setBins(bs => [...bs, created[0]]);
    return created[0].id;
  };

  const reportToRepair = async () => {
    const { barcode, name, binId, qty } = repairForm;
    const q = Number(qty);
    if (!binId || !name.trim() || !q || q <= 0) { showToast("Bin, product naam aur valid qty enter karein", "err"); return; }
    try {
      const repairBinId = await ensureRepairBin();
      await sb(`/rest/v1/stk_inventory_adjustments`, { method: "POST", token, body: { warehouse_id: whId, product_barcode: barcode.trim() || null, product_name: name.trim(), bin_id: binId, qty_delta: -q, reason: "Sent to Repair/Touch-up", source: "manual", created_by: profile.id } });
      await sb(`/rest/v1/stk_inventory_adjustments`, { method: "POST", token, body: { warehouse_id: whId, product_barcode: barcode.trim() || null, product_name: name.trim(), bin_id: repairBinId, qty_delta: q, reason: "Received into Repair/Touch-up", source: "manual", created_by: profile.id } });
      await sb(`/rest/v1/stk_repair_queue`, { method: "POST", token, body: { warehouse_id: whId, product_barcode: barcode.trim() || null, product_name: name.trim(), qty: q, source_bin_id: binId, reported_by: profile.id, reported_at: new Date().toISOString(), status: "pending" } });
      showToast(`✓ ${q} × ${name} — ${binCode(binId)} se ${STK_REPAIR_BIN_CODE} mein transfer ho gaya`);
      setRepairForm({ barcode: "", name: "", binId: "", qty: "" });
      load();
    } catch (e) { showToast("Transfer fail: " + e.message, "err"); }
  };

  const fixAndAssignRepair = async (item) => {
    const putawayId = repairAssignChoice[item.id];
    if (!putawayId) { showToast("Putaway Officer select karein", "err"); return; }
    try {
      await sb(`/rest/v1/stk_repair_queue?id=eq.${item.id}`, { method: "PATCH", token, body: { status: "assigned_putaway", fixed_by: profile.id, fixed_at: new Date().toISOString(), assigned_putaway_officer: putawayId } });
      showToast(`✓ Fixed mark ho gaya — ${putawayOfficerName(putawayId)} ko putaway k liye assign ho gaya`);
      load();
    } catch (e) { showToast("Assign fail: " + e.message, "err"); }
  };

  const completeRepairPutaway = async (item) => {
    const binId = repairBinChoice[item.id];
    if (!binId) { showToast("Bin select karein", "err"); return; }
    try {
      const repairBinId = await ensureRepairBin();
      await sb(`/rest/v1/stk_inventory_adjustments`, { method: "POST", token, body: { warehouse_id: whId, product_barcode: item.product_barcode, product_name: item.product_name, bin_id: repairBinId, qty_delta: -item.qty, reason: "Repair/Touch-up completed — left holding bin", source: "manual", created_by: profile.id } });
      await sb(`/rest/v1/stk_inventory_adjustments`, { method: "POST", token, body: { warehouse_id: whId, product_barcode: item.product_barcode, product_name: item.product_name, bin_id: binId, qty_delta: item.qty, reason: "Repair/Touch-up completed — putaway", source: "manual", created_by: profile.id } });
      await sb(`/rest/v1/stk_repair_queue?id=eq.${item.id}`, { method: "PATCH", token, body: { status: "completed", putaway_bin_id: binId, completed_by: profile.id, completed_at: new Date().toISOString() } });
      showToast(`✓ ${item.product_name} wapas ${binCode(binId)} mein putaway ho gaya`);
      load();
    } catch (e) { showToast("Putaway fail: " + e.message, "err"); }
  };

  if (loading) return <EmptyNote text="Loading..." />;

  return (
    <div>
      <SectionTitle title="Stocking Warehouse — Repair/Touch-up" />
      <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 16 }}>Yeh sab ek dedicated "{STK_REPAIR_BIN_CODE}" bin (non-saleable) k zariye track hota hai — jab item report hoti hai to source bin se debit ho k is bin mein credit hoti hai, aur putaway complete hone pe is bin se debit ho k asal bin mein credit hoti hai.</div>

      {canReport && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Item Repair/Touch-up Mein Bhejein</div>
          <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 14 }}>Picking ya kisi aur waqt agar koi item damaged/touch-up wala mile, use yahan report karein.</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <input style={{ ...S.input, minWidth: 130, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Barcode (optional)" value={repairForm.barcode} onChange={e => setRepairForm(f => ({ ...f, barcode: e.target.value }))} />
            <input style={{ ...S.input, minWidth: 160 }} placeholder="Product naam" value={repairForm.name} onChange={e => setRepairForm(f => ({ ...f, name: e.target.value }))} />
            <select style={{ ...S.input, minWidth: 140 }} value={repairForm.binId} onChange={e => setRepairForm(f => ({ ...f, binId: e.target.value }))}>
              <option value="">Kis bin se mila…</option>
              {allStockedBins.map(id => <option key={id} value={id}>{binCode(id)}</option>)}
            </select>
            <input type="number" style={{ ...S.input, width: 90 }} placeholder="Qty" value={repairForm.qty} onChange={e => setRepairForm(f => ({ ...f, qty: e.target.value }))} />
            <button style={S.primaryBtnSm} onClick={reportToRepair}>🔧 Transfer to Repair</button>
          </div>
        </div>
      )}

      <div style={S.panel}>
        <div style={S.panelTitle}>Pending — Fix Karke Putaway Officer Assign Karein</div>
        <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 14 }}>"Fixed" yahan iska matlab: external repair team se kaam ho chuka hai (physical repair app se bahar hota hai) — ab sirf record aur putaway assignment karna hai.</div>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead><tr><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>From Bin</th><th style={S.th}>Reported</th><th style={S.th}>Assign Putaway Officer</th><th style={S.th}></th></tr></thead>
          <tbody>
            {pendingRepair.map(r => (
              <tr key={r.id}>
                <td style={S.td}>{r.product_name}</td>
                <td style={S.td}>{r.qty}</td>
                <td style={{ ...S.td, color: "#6B6355" }}>{binCode(r.source_bin_id)}</td>
                <td style={S.td}>{fmtTime(r.reported_at)}</td>
                <td style={S.td}>
                  <select style={{ ...S.input, width: 160 }} value={repairAssignChoice[r.id] || ""} onChange={e => setRepairAssignChoice(a => ({ ...a, [r.id]: e.target.value }))}>
                    <option value="">Select…</option>
                    {putawayOfficers.map(p => <option key={p.id} value={p.id}>{p.full_name}</option>)}
                  </select>
                </td>
                <td style={S.td}><button style={S.secondaryBtnSm} onClick={() => fixAndAssignRepair(r)}>✓ Fixed & Assign</button></td>
              </tr>
            ))}
            {!pendingRepair.length && <tr><td style={S.td} colSpan={6}><EmptyNote text="Koi item repair mein pending nahi" /></td></tr>}
          </tbody>
        </table>
      </div>

      {canDoPutaway && (
        <div style={S.panel}>
          <div style={S.panelTitle}>{profile.role === "putaway_officer" ? "My Repair Putaway Tasks" : "All Repair Putaway (oversight)"}</div>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr>{profile.role !== "putaway_officer" && <th style={S.th}>Assigned To</th>}<th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Bin</th><th style={S.th}></th></tr></thead>
            <tbody>
              {myRepairPutaway.map(r => (
                <tr key={r.id}>
                  {profile.role !== "putaway_officer" && <td style={S.td}>{putawayOfficerName(r.assigned_putaway_officer)}</td>}
                  <td style={S.td}>{r.product_name}</td>
                  <td style={S.td}>{r.qty}</td>
                  <td style={S.td}>
                    <select style={{ ...S.input, width: 140 }} value={repairBinChoice[r.id] || ""} onChange={e => setRepairBinChoice(b => ({ ...b, [r.id]: e.target.value }))}>
                      <option value="">Select bin…</option>
                      {bins.filter(b => b.code !== STK_REPAIR_BIN_CODE).map(b => <option key={b.id} value={b.id}>{b.code}</option>)}
                    </select>
                  </td>
                  <td style={S.td}><button style={S.primaryBtnSm} onClick={() => completeRepairPutaway(r)}>✓ Putaway Complete</button></td>
                </tr>
              ))}
              {!myRepairPutaway.length && <tr><td style={S.td} colSpan={profile.role !== "putaway_officer" ? 5 : 4}><EmptyNote text="Koi repair-putaway task pending nahi" /></td></tr>}
            </tbody>
          </table>
        </div>
      )}

      <div style={S.panel}>
        <div style={S.panelTitle}>Completed</div>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead><tr><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Putaway Bin</th><th style={S.th}>Completed At</th></tr></thead>
          <tbody>
            {completedRepair.slice(0, 20).map(r => <tr key={r.id}><td style={S.td}>{r.product_name}</td><td style={S.td}>{r.qty}</td><td style={S.td}>{binCode(r.putaway_bin_id)}</td><td style={S.td}>{fmtTime(r.completed_at)}</td></tr>)}
            {!completedRepair.length && <tr><td style={S.td} colSpan={4}><EmptyNote text="Abhi tak koi complete nahi hua" /></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ================= STOCKING WAREHOUSE — INVENTORY ================= */
// Mirrors the E-commerce Inventory tab (Ledger / Bin-wise / Cycle Count) but stays on
// Stocking's own text-based product identity (barcode/name from the Odoo import + the
// stk_products catalogue for department/name lookups) rather than the shared master
// `products` table — consistent with the earlier decision to keep Stocking self-contained.
// "System qty" for a count is a snapshot of stk_putaway_queue+adjustments at assignment time;
// approved variances post as rows to stk_inventory_adjustments (never edited/deleted, so the
// ledger is always a full replayable history).
function StockingInventoryView({ token, profile, showToast }) {
  const whId = useStkWarehouseId(token, profile);
  const isAdmin = profile.role === "admin";
  const isWarehouseLead = profile.role === "warehouse_lead";
  const canAssignCounts = isAdmin || isWarehouseLead;

  const [tab, setTab] = useState("ledger");
  const [queue, setQueue] = useState([]);
  const [adjustments, setAdjustments] = useState([]);
  const [bins, setBins] = useState([]);
  const [staff, setStaff] = useState([]);
  const [catalogue, setCatalogue] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState("");
  const [binFilter, setBinFilter] = useState("");

  const load = async () => {
    if (!whId) return;
    setLoading(true);
    try {
      const [q, adj, b, s, cat] = await Promise.all([
        sb(`/rest/v1/stk_putaway_queue?warehouse_id=eq.${whId}&status=eq.completed&select=*`, { token }),
        sb(`/rest/v1/stk_inventory_adjustments?warehouse_id=eq.${whId}&select=*`, { token }),
        sb(`/rest/v1/bins?warehouse_id=eq.${whId}&select=*&order=code.asc`, { token }),
        sb(`/rest/v1/profiles?warehouse_id=eq.${whId}&select=id,full_name,role`, { token }),
        sb(`/rest/v1/stk_products?select=internal_barcode,display_name,department`, { token })
      ]);
      setQueue(q || []); setAdjustments(adj || []); setBins(b || []); setStaff(s || []); setCatalogue(cat || []);
    } catch (e) { showToast("Load fail: " + e.message, "err"); }
    setLoading(false);
  };
  useEffect(() => { load(); }, [whId]);

  const staffName = (id) => staff.find(s => s.id === id)?.full_name || "—";
  const binCode = (id) => bins.find(b => b.id === id)?.code || "—";
  const catalogueFor = (barcode) => catalogue.find(c => c.internal_barcode === barcode);
  const deptFor = (barcode) => catalogueFor(barcode)?.department || "—";
  const nameFor = (barcode, fallbackName) => catalogueFor(barcode)?.display_name || fallbackName;

  // Per product+bin on-hand = every completed putaway + every approved adjustment at that spot.
  const binRows = useMemo(() => {
    const grouped = {};
    for (const q of queue) {
      const key = `${q.product_barcode || q.product_name}|${q.bin_id}`;
      if (!grouped[key]) grouped[key] = { product_barcode: q.product_barcode, product_name: q.product_name, bin_id: q.bin_id, on_hand: 0, last_by: null, last_at: null };
      grouped[key].on_hand += Number(q.qty || 0);
      if (!grouped[key].last_at || new Date(q.completed_at) > new Date(grouped[key].last_at)) { grouped[key].last_at = q.completed_at; grouped[key].last_by = q.completed_by; }
    }
    for (const a of adjustments) {
      const key = `${a.product_barcode || a.product_name}|${a.bin_id}`;
      if (!grouped[key]) grouped[key] = { product_barcode: a.product_barcode, product_name: a.product_name, bin_id: a.bin_id, on_hand: 0, last_by: null, last_at: null };
      grouped[key].on_hand += Number(a.qty_delta || 0);
      if (!grouped[key].last_at || new Date(a.created_at) > new Date(grouped[key].last_at)) { grouped[key].last_at = a.created_at; grouped[key].last_by = a.created_by; }
    }
    return Object.values(grouped).filter(r => r.on_hand > 0);
  }, [queue, adjustments]);

  // Product-level rollup across all bins, for the Ledger tab.
  const ledgerRows = useMemo(() => {
    const grouped = {};
    for (const r of binRows) {
      const key = r.product_barcode || r.product_name;
      if (!grouped[key]) grouped[key] = { product_barcode: r.product_barcode, product_name: r.product_name, on_hand: 0, bin_count: 0, last_at: null };
      grouped[key].on_hand += r.on_hand;
      grouped[key].bin_count += 1;
      if (!grouped[key].last_at || new Date(r.last_at) > new Date(grouped[key].last_at)) grouped[key].last_at = r.last_at;
    }
    return Object.values(grouped);
  }, [binRows]);

  const matchesSearch = (barcode, name, dept) => !search.trim() ||
    (barcode || "").toLowerCase().includes(search.toLowerCase()) ||
    (name || "").toLowerCase().includes(search.toLowerCase()) ||
    (dept || "").toLowerCase().includes(search.toLowerCase());

  const filteredLedger = ledgerRows.filter(r => matchesSearch(r.product_barcode, nameFor(r.product_barcode, r.product_name), deptFor(r.product_barcode)));
  const filteredBinRows = binRows
    .filter(r => matchesSearch(r.product_barcode, nameFor(r.product_barcode, r.product_name), deptFor(r.product_barcode)))
    .filter(r => !binFilter || r.bin_id === binFilter)
    .sort((a, b) => binCode(a.bin_id).localeCompare(binCode(b.bin_id)));

  const distinctSkus = new Set(binRows.map(r => r.product_barcode || r.product_name)).size;
  const distinctBins = new Set(binRows.map(r => r.bin_id)).size;
  const totalQty = binRows.reduce((s, r) => s + r.on_hand, 0);

  /* ---------- Cycle Count (mirrors the E-commerce workflow, bin-scoped only) ---------- */
  const [cycleCounts, setCycleCounts] = useState([]);
  const [activeCount, setActiveCount] = useState(null);
  const [countLines, setCountLines] = useState([]);
  const [childCounts, setChildCounts] = useState([]); // for a "complete warehouse" parent audit
  const [newScopeType, setNewScopeType] = useState("bin");
  const [newBinCode, setNewBinCode] = useState("");
  const [newAssignee, setNewAssignee] = useState("");
  const [binAssignments, setBinAssignments] = useState({}); // bin_id -> staff id, for complete-warehouse
  const [startingCount, setStartingCount] = useState(false);
  const [verifyingCount, setVerifyingCount] = useState(false);
  const [approvingCount, setApprovingCount] = useState(false);
  const [rejectingCount, setRejectingCount] = useState(false);
  const [rejectReason, setRejectReason] = useState("");

  const binsWithStock = useMemo(() => [...new Set(binRows.map(r => r.bin_id))].sort((a, b) => binCode(a).localeCompare(binCode(b))), [binRows]);

  const loadCycleCounts = async () => {
    if (!whId) return;
    const cc = await sb(`/rest/v1/stk_cycle_counts?warehouse_id=eq.${whId}&select=*&order=created_at.desc`, { token });
    setCycleCounts(cc || []);
  };
  useEffect(() => { if (tab === "cyclecount") loadCycleCounts(); }, [tab, whId]);

  const openCycleCount = async (cc) => {
    setActiveCount(cc);
    if (cc.scope_type === "all" && !cc.parent_audit_id) {
      const kids = await sb(`/rest/v1/stk_cycle_counts?parent_audit_id=eq.${cc.id}&select=*`, { token });
      setChildCounts(kids || []); setCountLines([]);
    } else {
      const lines = await sb(`/rest/v1/stk_cycle_count_lines?cycle_count_id=eq.${cc.id}&select=*`, { token });
      setCountLines(lines || []); setChildCounts([]);
    }
  };

  const createBinCountWithLines = async (binId, assignedTo, parentId) => {
    const scoped = binRows.filter(r => r.bin_id === binId);
    if (!scoped.length) return null;
    const cc = await sb(`/rest/v1/stk_cycle_counts`, { method: "POST", token, prefer: "return=representation", body: { warehouse_id: whId, scope_type: "bin", bin_id: binId, status: "counting", created_by: profile.id, assigned_to: assignedTo || null, parent_audit_id: parentId || null } });
    const lineBodies = scoped.map(r => ({ cycle_count_id: cc[0].id, product_barcode: r.product_barcode, product_name: r.product_name, system_qty: r.on_hand }));
    for (let i = 0; i < lineBodies.length; i += 100) {
      await sb(`/rest/v1/stk_cycle_count_lines`, { method: "POST", token, body: lineBodies.slice(i, i + 100) });
    }
    return cc[0];
  };

  const startCycleCount = async () => {
    setStartingCount(true);
    try {
      if (newScopeType === "all") {
        const assignedBins = binsWithStock.filter(id => binAssignments[id]);
        if (!assignedBins.length) { showToast("Kam se kam ek bin k liye staff assign karein", "err"); setStartingCount(false); return; }
        if (!window.confirm(`Poori warehouse audit shuru karein? ${assignedBins.length} bin(s) assign ho rahe hain.`)) { setStartingCount(false); return; }
        const parent = await sb(`/rest/v1/stk_cycle_counts`, { method: "POST", token, prefer: "return=representation", body: { warehouse_id: whId, scope_type: "all", bin_id: null, status: "counting", created_by: profile.id } });
        let created = 0;
        for (const binId of assignedBins) {
          const kid = await createBinCountWithLines(binId, binAssignments[binId], parent[0].id);
          if (kid) created++;
        }
        showToast(`✅ Complete Warehouse Audit shuru — ${created} bin(s) assign ho gaye`);
        setBinAssignments({});
        await loadCycleCounts();
        openCycleCount(parent[0]);
      } else {
        if (!newBinCode.trim() || !newAssignee) { showToast("Bin code aur staff select karein", "err"); setStartingCount(false); return; }
        const bin = bins.find(b => (b.code || "").toLowerCase() === newBinCode.trim().toLowerCase());
        if (!bin) { showToast(`Bin "${newBinCode}" nahi mila — list se select karein`, "err"); setStartingCount(false); return; }
        const cc = await createBinCountWithLines(bin.id, newAssignee, null);
        if (!cc) { showToast("Is bin mein koi stock nahi hai", "err"); setStartingCount(false); return; }
        showToast(`✅ Cycle count assign ho gayi ${staff.find(s => s.id === newAssignee)?.full_name || ""} ko`);
        setNewBinCode(""); setNewAssignee("");
        await loadCycleCounts();
        openCycleCount(cc);
      }
    } catch (e) { showToast("Start failed — dobara try karein", "err"); }
    setStartingCount(false);
  };

  const saveCountedQty = async (lineId, qty) => {
    const q = qty === "" ? null : Number(qty);
    setCountLines(prev => prev.map(l => l.id === lineId ? { ...l, counted_qty: q } : l));
    await sb(`/rest/v1/stk_cycle_count_lines?id=eq.${lineId}`, { method: "PATCH", token, body: { counted_qty: q, counted_by: profile.id, counted_at: new Date().toISOString() } });
  };
  const saveVarianceNote = async (lineId, note) => {
    setCountLines(prev => prev.map(l => l.id === lineId ? { ...l, variance_note: note } : l));
    await sb(`/rest/v1/stk_cycle_count_lines?id=eq.${lineId}`, { method: "PATCH", token, body: { variance_note: note || null } });
  };

  const myCountMode = (profile.putaway_mode || "bulk") === "piece" ? "piece" : "bulk";
  const isMyBlindCount = !!(activeCount && activeCount.status === "counting" && profile.id === activeCount.assigned_to && !canAssignCounts);
  const [ccScanInput, setCcScanInput] = useState("");
  const [ccMatchedLine, setCcMatchedLine] = useState(null);
  const [ccBulkQty, setCcBulkQty] = useState("");
  const [ccUnknownBarcode, setCcUnknownBarcode] = useState(null); // { barcode, name }

  const ccScanProduct = (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : ccScanInput).trim();
    setCcScanInput("");
    if (!code) return;
    const c = cleanCode(code);
    const line = countLines.find(l => cleanCode(l.product_barcode || "") === c);
    if (!line) {
      const cat = catalogue.find(x => cleanCode(x.internal_barcode || "") === c);
      setCcUnknownBarcode({ barcode: code, name: cat?.display_name || code });
      showToast(`⚠ ${code} is bin ki expected list mein nahi — Excess Item add karein`, "err");
      return;
    }
    if (myCountMode === "piece") {
      const newQty = (line.counted_qty || 0) + 1;
      saveCountedQty(line.id, newQty);
      showToast(`✓ 1 pc counted — ${line.product_barcode} (total ${newQty})`);
    } else {
      setCcMatchedLine(line);
      setCcBulkQty(String(line.counted_qty ?? ""));
      showToast(`✓ Matched: ${line.product_barcode} — qty likh kar confirm karein`);
    }
  };

  const ccConfirmBulk = () => {
    if (!ccMatchedLine) return;
    const q = ccBulkQty === "" ? NaN : Number(ccBulkQty);
    if (isNaN(q) || q < 0) { showToast("Valid qty enter karein", "err"); return; }
    saveCountedQty(ccMatchedLine.id, q);
    setCcMatchedLine(null); setCcBulkQty("");
  };

  const ccAddExcessItem = async () => {
    if (!ccUnknownBarcode) return;
    try {
      const isPiece = myCountMode === "piece";
      const created = await sb(`/rest/v1/stk_cycle_count_lines`, {
        method: "POST", token, prefer: "return=representation",
        body: { cycle_count_id: activeCount.id, product_barcode: ccUnknownBarcode.barcode, product_name: ccUnknownBarcode.name, system_qty: 0, is_excess: true, counted_qty: isPiece ? 1 : null, counted_by: profile.id, counted_at: new Date().toISOString() }
      });
      setCountLines(cl => [...cl, created[0]]);
      setCcUnknownBarcode(null);
      if (isPiece) { showToast(`✓ Excess item add ho gaya — ${ccUnknownBarcode.barcode} (1 pc counted)`); }
      else { setCcMatchedLine(created[0]); setCcBulkQty(""); showToast(`✓ Excess item add ho gaya — ab total qty likhein`); }
    } catch (e) { showToast("Add fail: " + e.message, "err"); }
  };

  const submitForReview = async () => {
    const uncounted = countLines.filter(l => l.counted_qty === null || l.counted_qty === undefined);
    if (uncounted.length > 0 && !window.confirm(`${uncounted.length} line(s) abhi count nahi hui — sirf jo count ho chuki hain unhi ka review submit karein?`)) return;
    await sb(`/rest/v1/stk_cycle_counts?id=eq.${activeCount.id}`, { method: "PATCH", token, body: { status: "pending_verification" } });
    showToast("✅ Warehouse Lead ki verification ke liye submit ho gaya");
    await loadCycleCounts();
    openCycleCount({ ...activeCount, status: "pending_verification" });
  };

  const verifyAndForward = async () => {
    setVerifyingCount(true);
    try {
      await sb(`/rest/v1/stk_cycle_counts?id=eq.${activeCount.id}`, { method: "PATCH", token, body: { status: "pending_admin_approval", verified_by: profile.id, verified_at: new Date().toISOString() } });
      showToast("✅ Verify ho gaya — Admin ko forward kar diya");
      await loadCycleCounts();
      openCycleCount({ ...activeCount, status: "pending_admin_approval" });
    } catch (e) { showToast("Verify failed", "err"); }
    setVerifyingCount(false);
  };

  const rejectToLead = async () => {
    if (!isAdmin) return;
    setRejectingCount(true);
    try {
      await sb(`/rest/v1/stk_cycle_counts?id=eq.${activeCount.id}`, { method: "PATCH", token, body: { status: "pending_verification", admin_reject_reason: rejectReason.trim() || null, rejected_by: profile.id, rejected_at: new Date().toISOString(), verified_by: null, verified_at: null } });
      showToast("↩ Warehouse Lead ko wapas bhej diya");
      setRejectReason("");
      await loadCycleCounts();
      openCycleCount({ ...activeCount, status: "pending_verification" });
    } catch (e) { showToast("Reject failed", "err"); }
    setRejectingCount(false);
  };

  const approveAndAdjust = async () => {
    if (!isAdmin) { showToast("Sirf Admin hi final adjustment approve kar sakta hai", "err"); return; }
    setApprovingCount(true);
    try {
      const toAdjust = countLines.filter(l => l.counted_qty !== null && l.counted_qty !== undefined && l.counted_qty !== l.system_qty);
      for (const l of toAdjust) {
        const delta = l.counted_qty - l.system_qty;
        await sb(`/rest/v1/stk_inventory_adjustments`, { method: "POST", token, body: { warehouse_id: whId, product_barcode: l.product_barcode, product_name: l.product_name, bin_id: activeCount.bin_id, qty_delta: delta, reason: l.variance_note || null, source: "cycle_count", created_by: profile.id } });
        await sb(`/rest/v1/stk_cycle_count_lines?id=eq.${l.id}`, { method: "PATCH", token, body: { adjusted: true } });
      }
      await sb(`/rest/v1/stk_cycle_counts?id=eq.${activeCount.id}`, { method: "PATCH", token, body: { status: "approved", approved_by: profile.id, approved_at: new Date().toISOString() } });
      showToast(`✅ ${toAdjust.length} adjustment(s) apply ho gayi`);
      setActiveCount(null); setCountLines([]);
      await loadCycleCounts(); await load();
    } catch (e) { showToast("Approve failed — dobara try karein", "err"); }
    setApprovingCount(false);
  };

  if (loading) return <EmptyNote text="Loading..." />;

  return (
    <div>
      <SectionTitle title="Stocking Warehouse — Inventory" />
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        <button onClick={() => { setTab("ledger"); setActiveCount(null); }} style={stkPill(tab === "ledger")}>📒 Inventory Ledger</button>

/* ================= STOCKING WAREHOUSE — REPORTS ================= */
function StockingReportsView({ token, profile, showToast }) {
  const whId = useStkWarehouseId(token, profile);
  const [busy, setBusy] = useState("");
  const sourceLabel = (s) => s === "grn_distribution" ? "GRN Distribution" : s === "customer_order" ? "Customer Order" : "Weekly Demand";

  const run = async (key, fn) => {
    setBusy(key);
    try { await fn(); } catch (e) { showToast("Export fail: " + e.message, "err"); }
    setBusy("");
  };

  const exportBinWiseInventory = () => run("bins", async () => {
    const [queue, adjustments, bins, staff, catalogue] = await Promise.all([
      sb(`/rest/v1/stk_putaway_queue?warehouse_id=eq.${whId}&status=eq.completed&select=*`, { token }),
      sb(`/rest/v1/stk_inventory_adjustments?warehouse_id=eq.${whId}&select=*`, { token }),
      sb(`/rest/v1/bins?warehouse_id=eq.${whId}&select=*`, { token }),
      sb(`/rest/v1/profiles?warehouse_id=eq.${whId}&select=id,full_name`, { token }),
      sb(`/rest/v1/stk_products?select=internal_barcode,display_name,department`, { token })
    ]);
    const grouped = {};
    for (const q of queue || []) {
      const key = `${q.product_barcode || q.product_name}|${q.bin_id}`;
      if (!grouped[key]) grouped[key] = { barcode: q.product_barcode, name: q.product_name, bin_id: q.bin_id, on_hand: 0, last_by: null, last_at: null };
      grouped[key].on_hand += Number(q.qty || 0);
      if (!grouped[key].last_at || new Date(q.completed_at) > new Date(grouped[key].last_at)) { grouped[key].last_at = q.completed_at; grouped[key].last_by = q.completed_by; }
    }
    for (const a of adjustments || []) {
      const key = `${a.product_barcode || a.product_name}|${a.bin_id}`;
      if (!grouped[key]) grouped[key] = { barcode: a.product_barcode, name: a.product_name, bin_id: a.bin_id, on_hand: 0, last_by: null, last_at: null };
      grouped[key].on_hand += Number(a.qty_delta || 0);
      if (!grouped[key].last_at || new Date(a.created_at) > new Date(grouped[key].last_at)) { grouped[key].last_at = a.created_at; grouped[key].last_by = a.created_by; }
    }
    const rows = Object.values(grouped).filter(r => r.on_hand > 0);
    const binCode = (id) => (bins || []).find(b => b.id === id)?.code || "";
    const staffName = (id) => (staff || []).find(s => s.id === id)?.full_name || "";
    const dept = (barcode) => (catalogue || []).find(c => c.internal_barcode === barcode)?.department || "";
    const nameFor = (barcode, fallback) => (catalogue || []).find(c => c.internal_barcode === barcode)?.display_name || fallback;
    exportCSV(`stocking-bin-wise-inventory-${new Date().toISOString().slice(0, 10)}.csv`,
      ["Barcode", "Product", "Department", "Bin", "On Hand", "Last Activity By", "Last Activity At"],
      rows.map(r => [r.barcode, nameFor(r.barcode, r.name), dept(r.barcode), binCode(r.bin_id), r.on_hand, staffName(r.last_by), r.last_at ? new Date(r.last_at).toLocaleString() : ""]));
    showToast(`✓ ${rows.length} rows export ho gayi`);
  });

  const exportInventoryLedger = () => run("ledger", async () => {
    const [queue, adjustments, catalogue] = await Promise.all([
      sb(`/rest/v1/stk_putaway_queue?warehouse_id=eq.${whId}&status=eq.completed&select=*`, { token }),
      sb(`/rest/v1/stk_inventory_adjustments?warehouse_id=eq.${whId}&select=*`, { token }),
      sb(`/rest/v1/stk_products?select=internal_barcode,display_name,department`, { token })
    ]);
    const grouped = {};
    for (const q of queue || []) {
      const key = q.product_barcode || q.product_name;
      if (!grouped[key]) grouped[key] = { barcode: q.product_barcode, name: q.product_name, on_hand: 0, bins: new Set() };
      grouped[key].on_hand += Number(q.qty || 0); grouped[key].bins.add(q.bin_id);
    }
    for (const a of adjustments || []) {
      const key = a.product_barcode || a.product_name;
      if (!grouped[key]) grouped[key] = { barcode: a.product_barcode, name: a.product_name, on_hand: 0, bins: new Set() };
      grouped[key].on_hand += Number(a.qty_delta || 0); grouped[key].bins.add(a.bin_id);
    }
    const dept = (barcode) => (catalogue || []).find(c => c.internal_barcode === barcode)?.department || "";
    const nameFor = (barcode, fallback) => (catalogue || []).find(c => c.internal_barcode === barcode)?.display_name || fallback;
    const rows = Object.values(grouped);
    exportCSV(`stocking-inventory-ledger-${new Date().toISOString().slice(0, 10)}.csv`,
      ["Barcode", "Product", "Department", "Total On Hand", "Bins"],
      rows.map(r => [r.barcode, nameFor(r.barcode, r.name), dept(r.barcode), r.on_hand, r.bins.size]));
    showToast(`✓ ${rows.length} rows export ho gayi`);
  });

  const exportStrOverall = () => run("str", async () => {
    const rows = await sb(`/rest/v1/stk_str?warehouse_id=eq.${whId}&select=*&order=created_at.desc`, { token });
    exportCSV(`stocking-str-overall-${new Date().toISOString().slice(0, 10)}.csv`,
      ["STR#", "Status", "Source", "Customer Order Ref", "Product", "Barcode", "Qty", "Destination", "Created At", "Confirmed At", "Picked At", "Packed At", "Dispatched At", "Gatepass#"],
      (rows || []).map(r => [r.str_number, stkStrStage(r), sourceLabel(r.source), r.customer_order_ref, r.product_name, r.product_barcode, r.qty, r.destination,
        r.created_at ? new Date(r.created_at).toLocaleString() : "", r.confirmed_at ? new Date(r.confirmed_at).toLocaleString() : "", r.picked_at ? new Date(r.picked_at).toLocaleString() : "",
        r.packed_at ? new Date(r.packed_at).toLocaleString() : "", r.dispatched_at ? new Date(r.dispatched_at).toLocaleString() : "", r.gatepass_number]));
    showToast(`✓ ${(rows || []).length} STR(s) export ho gayi — Status column se filter/pivot kar sakte hain`);
  });

  const exportReceiving = () => run("receiving", async () => {
    const [pos, dcs, lines] = await Promise.all([
      sb(`/rest/v1/stk_purchase_orders?warehouse_id=eq.${whId}&select=*`, { token }),
      sb(`/rest/v1/stk_dc_arrivals?warehouse_id=eq.${whId}&select=*`, { token }),
      sb(`/rest/v1/stk_dc_lines?select=*`, { token })
    ]);
    const poById = (id) => (pos || []).find(p => p.id === id);
    const dcById = (id) => (dcs || []).find(d => d.id === id);
    const relevantLines = (lines || []).filter(l => dcById(l.dc_id));
    exportCSV(`stocking-receiving-${new Date().toISOString().slice(0, 10)}.csv`,
      ["PO#", "Supplier", "Source", "DC#", "Odoo Reference", "Product", "Barcode", "Demand Qty", "OK Qty", "DMG", "MNF", "Wrong", "Excess", "Short", "GRN#", "DC Status"],
      relevantLines.map(l => {
        const dc = dcById(l.dc_id); const po = dc ? poById(dc.po_id) : null;
        return [po?.po_number, po?.supplier, po?.source, dc?.dc_number, dc?.odoo_reference, l.product_name, l.product_barcode, l.demand_qty, l.ok_qty, l.dmg_qty, l.mnf_qty, l.wrong_qty, l.excess_qty, l.short_qty, dc?.grn_number, dc?.status];
      }));
    showToast(`✓ ${relevantLines.length} rows export ho gayi`);
  });

  return (
    <div>
      <SectionTitle title="Stocking Warehouse — Reports" />
      <div style={S.panel}>
        <div style={S.panelTitle}>Export Reports (CSV)</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {[
            { key: "bins", label: "Bin-wise Inventory", desc: "Har product, har bin mein, kitni qty — kisne/kab last touch kiya.", fn: exportBinWiseInventory },
            { key: "ledger", label: "Inventory Ledger", desc: "Product-level rollup — poori warehouse mein total on-hand.", fn: exportInventoryLedger },
            { key: "str", label: "STR Report (Overall)", desc: "Har STR — status (Total Creation/In Process/Packing Process/RTD/Shipped) k sath, sab dates aur Gatepass#. Filter/pivot khud laga len.", fn: exportStrOverall },
            { key: "receiving", label: "Receiving Report", desc: "PO/DC/GRN level detail — demand vs OK/DMG/MNF/Wrong/Excess/Short.", fn: exportReceiving }
          ].map(r => (
            <div key={r.key} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 0", borderBottom: "1px solid #EFE8D8" }}>
              <div>
                <div style={{ fontWeight: 600, fontSize: 14 }}>{r.label}</div>
                <div style={{ fontSize: 12, color: "#8A8272" }}>{r.desc}</div>
              </div>
              <button style={S.primaryBtnSm} onClick={r.fn} disabled={busy === r.key}>{busy === r.key ? "Exporting…" : "⬇ Export CSV"}</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ================= STOCKING WAREHOUSE — DASHBOARD ================= */
function StockingDashboardView({ token, profile }) {
  const whId = useStkWarehouseId(token, profile);
  const [pos, setPos] = useState([]);
  const [dcs, setDcs] = useState([]);
  const [lines, setLines] = useState([]);
  const [rtvRows, setRtvRows] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    (async () => {
      setLoading(true);
      try {
        const whFilter = whId ? `warehouse_id=eq.${whId}&` : "";
        const [poRows, dcRows, rtv] = await Promise.all([
          sb(`/rest/v1/stk_purchase_orders?${whFilter}select=*`, { token }),
          sb(`/rest/v1/stk_dc_arrivals?${whFilter}select=*`, { token }),
          sb(`/rest/v1/stk_rtv_queue?${whFilter}select=*`, { token })
        ]);
        const dcIds = (dcRows || []).map(d => d.id);
        const lineRows = dcIds.length ? await sb(`/rest/v1/stk_dc_lines?dc_id=in.(${dcIds.join(",")})&select=*`, { token }) : [];
        setPos(poRows || []); setDcs(dcRows || []); setLines(lineRows || []); setRtvRows(rtv || []);
      } catch (e) { /* silent */ }
      setLoading(false);
    })();
  }, [whId]);

  const totalPos = pos.length;
  const completedPos = pos.filter(p => p.status === "completed").length;
  const partialPos = pos.filter(p => p.status === "partial" || p.status === "open").length;
  const pendingImportDcs = dcs.filter(d => d.status === "pending_import").length;
  const pendingInspectionDcs = dcs.filter(d => d.status === "ready_for_inspection" || d.status === "in_progress" || d.status === "completed").length;
  const rtvPendingQty = rtvRows.filter(r => r.status === "pending").reduce((s, r) => s + Number(r.dmg_qty || 0) + Number(r.mnf_qty || 0) + Number(r.wrong_qty || 0) + Number(r.excess_qty || 0) + Number(r.short_qty || 0), 0);

  const vendorStats = {};
  for (const l of lines) {
    const dc = dcs.find(d => d.id === l.dc_id); if (!dc) continue;
    const po = pos.find(p => p.id === dc.po_id); if (!po) continue;
    const v = vendorStats[po.supplier] || (vendorStats[po.supplier] = { supplier: po.supplier, received: 0, dmg: 0, mnf: 0, wrong: 0, excess: 0, short: 0 });
    // "Received Qty" = what was actually SUPPOSED to arrive for this line (the DC's demand
    // qty from the Odoo import) — NOT ok+dmg+mnf+wrong+excess. Those, plus short, should sum
    // back up to demand_qty at the item level; excess sits outside that (it's extra, not part
    // of what was ordered), which is why it isn't counted in the RTV ratio's numerator either.
    v.received += Number(l.demand_qty || 0);
    v.dmg += Number(l.dmg_qty || 0); v.mnf += Number(l.mnf_qty || 0); v.wrong += Number(l.wrong_qty || 0); v.excess += Number(l.excess_qty || 0); v.short += Number(l.short_qty || 0);
  }
  const vendorRows = Object.values(vendorStats).map(v => ({ ...v, exception: v.dmg + v.mnf + v.wrong + v.short, ratio: v.received > 0 ? ((v.dmg + v.mnf + v.wrong + v.short) / v.received) * 100 : 0 })).sort((a, b) => b.ratio - a.ratio);

  const supplierBench = {};
  for (const dc of dcs.filter(d => d.status === "grn_posted")) {
    const po = pos.find(p => p.id === dc.po_id); if (!po) continue;
    const days = stkBizDaysExclSunday(dc.received_at, dc.grn_posted_at);
    const bm = STK_BENCHMARK_DAYS[po.source] ?? 3;
    const s = supplierBench[po.supplier] || (supplierBench[po.supplier] = { supplier: po.supplier, total: 0, within: 0, delayed: 0, delayDays: 0 });
    s.total++;
    if (days <= bm) s.within++; else { s.delayed++; s.delayDays += (days - bm); }
  }
  const supplierRows = Object.values(supplierBench).sort((a, b) => b.delayed - a.delayed);

  const today = new Date().toISOString();
  const pendingAlerts = dcs.filter(d => d.status !== "grn_posted").map(d => {
    const po = pos.find(p => p.id === d.po_id); if (!po) return null;
    const days = stkBizDaysExclSunday(d.received_at, today);
    const bm = STK_BENCHMARK_DAYS[po.source] ?? 3;
    return { supplier: po.supplier, po_number: po.po_number, dc_number: d.dc_number, source: po.source, days, bm, breach: days > bm };
  }).filter(Boolean).sort((a, b) => b.days - a.days);

  if (loading) return <EmptyNote text="Loading..." />;

  return (
    <div>
      <SectionTitle title="Stocking Warehouse — Inbound Dashboard" />
      <div style={S.statGrid}>
        {[["Total POs", totalPos], ["Completed POs", completedPos], ["Open/Partial POs", partialPos], ["Pending Odoo Import", pendingImportDcs], ["In Inspection Pipeline", pendingInspectionDcs], ["RTV Pending Qty", rtvPendingQty]].map(([label, val]) => (
          <div key={label} style={S.statCard}>
            <div style={{ fontSize: 10, color: "#8A8272", letterSpacing: 0.5, fontFamily: "'IBM Plex Mono', monospace" }}>{label.toUpperCase()}</div>
            <div style={{ fontSize: 24, fontWeight: 700, color: "#2B2620", marginTop: 4 }}>{val}</div>
          </div>
        ))}
      </div>

      <div style={S.panel}>
        <div style={S.panelTitle}>Vendor-wise RTV Ratio</div>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead><tr><th style={S.th}>Supplier</th><th style={S.th}>Total Qty (DC Demand)</th><th style={S.th}>DMG</th><th style={S.th}>MNF</th><th style={S.th}>Wrong</th><th style={S.th}>Short</th><th style={S.th}>RTV Ratio %</th></tr></thead>
          <tbody>
            {vendorRows.map(v => (
              <tr key={v.supplier}>
                <td style={S.td}>{v.supplier}</td><td style={S.td}>{v.received}</td><td style={S.td}>{v.dmg}</td><td style={S.td}>{v.mnf}</td><td style={S.td}>{v.wrong}</td><td style={S.td}>{v.short}</td>
                <td style={{ ...S.td, color: v.ratio > 10 ? "#E5484D" : "#2B2620", fontWeight: 600 }}>{v.ratio.toFixed(1)}%</td>
              </tr>
            ))}
            {!vendorRows.length && <tr><td style={S.td} colSpan={7}><EmptyNote text="Abhi data nahi" /></td></tr>}
          </tbody>
        </table>
      </div>

      <div style={S.panel}>
        <div style={S.panelTitle}>Supplier Benchmark Performance (GRN-posted DCs)</div>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead><tr><th style={S.th}>Supplier</th><th style={S.th}>Total</th><th style={S.th}>Within Benchmark</th><th style={S.th}>Delayed</th><th style={S.th}>Total Delay Days</th></tr></thead>
          <tbody>
            {supplierRows.map(s => <tr key={s.supplier}><td style={S.td}>{s.supplier}</td><td style={S.td}>{s.total}</td><td style={S.td}>{s.within}</td><td style={{ ...S.td, color: s.delayed ? "#E5484D" : "#2B2620" }}>{s.delayed}</td><td style={S.td}>{s.delayDays}</td></tr>)}
            {!supplierRows.length && <tr><td style={S.td} colSpan={5}><EmptyNote text="Abhi GRN-posted DC nahi" /></td></tr>}
          </tbody>
        </table>
      </div>

      <div style={S.panel}>
        <div style={S.panelTitle}>Pending POs — Ageing &amp; SOP Breach Alert</div>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead><tr><th style={S.th}>Supplier</th><th style={S.th}>PO#</th><th style={S.th}>DC#</th><th style={S.th}>Source</th><th style={S.th}>Days Pending</th><th style={S.th}>Benchmark</th><th style={S.th}>SOP</th></tr></thead>
          <tbody>
            {pendingAlerts.map((a, i) => (
              <tr key={i}>
                <td style={S.td}>{a.supplier}</td><td style={S.td}>{a.po_number}</td><td style={S.td}>{a.dc_number}</td><td style={S.td}>{a.source}</td><td style={S.td}>{a.days}</td><td style={S.td}>{a.bm}</td>
                <td style={{ ...S.td, color: a.breach ? "#E5484D" : "#4CAF7D", fontWeight: 600 }}>{a.breach ? "⚠ SOP BREACH" : "OK"}</td>
              </tr>
            ))}
            {!pendingAlerts.length && <tr><td style={S.td} colSpan={7}><EmptyNote text="Koi PO pending nahi" /></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const S = {
  scanOverlay: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 },
  scanModal: { background: "#FFFFFF", border: "1px solid #E0D8C5", borderRadius: 12, padding: 16, width: "100%", maxWidth: 420 },

  pickerDropdown: { position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, background: "#FFFFFF", border: "1px solid #E0D8C5", borderRadius: 6, maxHeight: 220, overflowY: "auto", zIndex: 50, boxShadow: "0 8px 20px rgba(0,0,0,0.4)" },
  pickerItem: { padding: "8px 12px", cursor: "pointer", borderBottom: "1px solid #EFE8D8" },
  app: { display: "flex", height: "100vh", background: "#F4EFE6", fontFamily: "'Space Grotesk', sans-serif", overflow: "hidden" },
  sidebar: { width: 210, background: "#1A1E27", borderRight: "1px solid #2C323F", display: "flex", flexDirection: "column", flexShrink: 0 },
  main: { flex: 1, display: "flex", flexDirection: "column", minWidth: 0 },
  topbar: { height: 56, borderBottom: "1px solid #E0D8C5", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 24px", flexShrink: 0 },
  content: { flex: 1, overflowY: "auto", padding: "22px 24px 60px" },
  navItem: { display: "flex", alignItems: "center", gap: 10, padding: "10px 20px", background: "none", border: "none", cursor: "pointer", fontSize: 13, width: "100%", textAlign: "left", fontFamily: "'Space Grotesk', sans-serif" },
  navItemActive: { background: "#242A35", borderLeft: "2px solid #F5A623" },
  statGrid: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12, marginBottom: 20 },

  panel: { background: "#FFFFFF", border: "1px solid #E0D8C5", borderRadius: 8, padding: 18, marginBottom: 14, overflowX: "auto" },

  label: { color: "#8A8272", fontSize: 10, letterSpacing: 1, marginBottom: 6, marginTop: 12, fontFamily: "'IBM Plex Mono', monospace" },
  primaryBtn: { width: "100%", background: "#F5A623", color: "#1A1206", border: "none", borderRadius: 6, padding: "11px", fontWeight: 600, fontSize: 14, cursor: "pointer", marginTop: 18, fontFamily: "'Space Grotesk', sans-serif" },
  primaryBtnSm: { display: "flex", alignItems: "center", gap: 5, background: "#F5A623", color: "#1A1206", border: "none", borderRadius: 6, padding: "9px 14px", fontWeight: 600, fontSize: 12.5, cursor: "pointer", fontFamily: "'Space Grotesk', sans-serif" },
  secondaryBtnSm: { display: "flex", alignItems: "center", gap: 5, background: "transparent", color: "#2B2620", border: "1px solid #E0D8C5", borderRadius: 6, padding: "7px 12px", fontSize: 12, cursor: "pointer", fontFamily: "'Space Grotesk', sans-serif" },
  badge: { fontSize: 11, color: "#6B6355", border: "1px solid #E0D8C5", borderRadius: 20, padding: "3px 10px", fontFamily: "'IBM Plex Mono', monospace" },
  badgeSm: { fontSize: 10, border: "1px solid", borderRadius: 20, padding: "2px 8px", fontFamily: "'IBM Plex Mono', monospace" },
  hazardBar: { height: 4, width: "100%", background: "repeating-linear-gradient(45deg, #F5A623 0 10px, #1F2430 10px 20px)", position: "absolute", top: 0, left: 0, borderRadius: "10px 10px 0 0" },
  disclaimer: { marginTop: 22, fontSize: 11, color: "#8A8272", lineHeight: 1.4 },
  loginWrap: { height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#171A21", backgroundImage: "radial-gradient(circle at 20% 20%, #1F2430 0%, #171A21 60%)" },
  loginCard: { position: "relative", width: 380, background: "#1F2430", border: "1px solid #2C323F", borderRadius: 12, padding: "28px 26px", overflow: "hidden" },
  th: { textAlign: "left", color: "#8A8272", fontSize: 10.5, letterSpacing: 0.5, padding: "6px 8px", borderBottom: "1px solid #E0D8C5", fontFamily: "'IBM Plex Mono', monospace" },
  td: { padding: "9px 8px", fontSize: 13, color: "#2B2620", borderBottom: "1px solid #EFE8D8" },
  toast: { position: "fixed", bottom: 24, right: 24, background: "#FFFFFF", border: "1px solid", borderRadius: 8, padding: "12px 16px", color: "#2B2620", fontSize: 13, boxShadow: "0 8px 24px rgba(0,0,0,0.4)" }
};
