                  <table><thead><tr><th>Customer</th><th>Tracking</th><th>Qty</th></tr></thead><tbody>${rowsHtml}</tbody></table>
                </body></html>`);
                w.document.close();
                w.print();
              }}>🖨 Print</button>
              <button style={S.secondaryBtnSm} onClick={async () => {
                const ids = ls.order_ids || [];
                const os = ids.length ? await sb(`/rest/v1/sales_orders?id=in.(${ids.join(",")})&select=*`, { token }) : [];
                let text = `📦 Load Sheet: ${ls.load_sheet_number}\nCourier: ${ls.courier}\nDate: ${fmtTime(ls.created_at)}\nOrders: ${ids.length}\n\n`;
                for (const o of os || []) {
                  const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${o.id}&select=qty`, { token });
                  const qty = (lines || []).reduce((s, l) => s + l.qty, 0);
                  text += `${o.external_order_id} — ${o.raw_data?.customer_order_number || o.raw_data?.customer || "—"} (${qty} pcs)\n`;
                }
                if (navigator.share) {
                  try { await navigator.share({ title: `Load Sheet ${ls.load_sheet_number}`, text }); return; } catch (e) { /* user cancelled or unsupported — fall through */ }
                }
                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
              }}>📱 Share</button>
              {!handedOver && ["admin", "warehouse_lead"].includes(profile.role) && (
                <button style={{ ...S.secondaryBtnSm, color: "#4CAF7D", borderColor: "#4CAF7D" }} onClick={() => setHandoverModal(ls)}>✓ Confirm Handover</button>
              )}
              {!handedOver && ["admin", "warehouse_lead"].includes(profile.role) && (
                <button style={{ ...S.secondaryBtnSm, color: "#E5484D", borderColor: "#E5484D" }} disabled={cancellingId === ls.id}
                  onClick={() => { if (window.confirm(`${ls.load_sheet_number} cancel karein? Iske ${ls.order_ids?.length || 0} orders wapas 'RTD' mein chale jayenge aur stock restore ho jayega — nayi complete load sheet dobara scan kar ke banani hogi.`)) cancelLoadSheet(ls); }}>
                  {cancellingId === ls.id ? "Cancelling…" : "✕ Cancel Load Sheet"}
                </button>
              )}
              {handedOver && (
                <span style={{ color: "#6B6355", fontSize: 11, alignSelf: "center" }}>By {profiles[ls.handed_over_by]?.full_name || "—"} · {fmtTime(ls.handed_over_at)} {ls.courier_rep_name ? `· Rep: ${ls.courier_rep_name}` : ""}</span>
              )}
            </div>
            )}
          </div>
          );
        })}
        {loadSheets.length === 0 && <EmptyNote text="No load sheets yet." />}
        <div style={{ marginTop: 12, fontSize: 11, color: "#8A8272" }}>
          ⚠ Email auto-send abhi nahi hai (real backend chahiye) — load sheet yahan record ho jata hai, aap manually forward kar sakte hain jab tak hum email automation set up karein.
        </div>
      </div>

      {handoverModal && (
        <div style={S.scanOverlay}>
          <div style={S.scanModal}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
              <span style={{ color: "#2B2620", fontFamily: "'Space Grotesk', sans-serif", fontSize: 15 }}>Confirm Handover — {handoverModal.load_sheet_number}</span>
              <button style={S.iconBtnCircle} onClick={() => setHandoverModal(null)}>✕</button>
            </div>
            <div style={S.label}>COURIER REPRESENTATIVE NAME (optional)</div>
            <input style={S.input} value={courierRepName} onChange={e => setCourierRepName(e.target.value)} placeholder="e.g. Waqas" />
            <div style={S.label}>REMARKS (optional)</div>
            <input style={S.input} value={handoverRemarks} onChange={e => setHandoverRemarks(e.target.value)} placeholder="Koi note" />
            <button style={{ ...S.primaryBtnSm, marginTop: 16, width: "100%", justifyContent: "center" }} onClick={confirmHandover}>✓ Confirm — mark HANDED OVER</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= USERS ================= */
function UsersView({ token, profile, showToast }) {
  const [users, setUsers] = useState([]);
  const [warehouses, setWarehouses] = useState([]);
  const [form, setForm] = useState({ full_name: "", email: "", password: "", role: "picker", warehouse_id: profile.warehouse_id || "" });
  const [busy, setBusy] = useState(false);
  const [editAccessId, setEditAccessId] = useState(null);
  const [editOverrides, setEditOverrides] = useState({});

  const NAV_LIST = [
    ["dashboard", "Dashboard"], ["products", "Products"], ["receiving", "Receiving"], ["putaway", "Putaway"],
    ["inventory", "Inventory"], ["orders", "Sales Orders"], ["picking", "Picking"], ["packing", "Packing"],
    ["dispatch", "Dispatch"], ["returns", "Returns"], ["reports", "Reports"], ["bins", "Bin Master"],
    ["totemaster", "Tote Master"], ["users", "Users"]
  ];
  const ROLE_DEFAULT_NAV = {
    admin: ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch", "returns", "reports", "bins", "totemaster", "users"],
    warehouse_lead: ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch", "returns", "reports"],
    supervisor: ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch", "returns", "reports"],
    returns_agent: ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch", "returns", "reports"],
    putaway_officer: ["dashboard", "receiving", "putaway", "returns", "inventory"]
  };

  const openEditAccess = (u) => {
    setEditAccessId(u.id);
    setEditOverrides(u.nav_overrides || {});
  };

  const isNavVisible = (u, navId) => {
    const roleDefault = (ROLE_DEFAULT_NAV[u.role] || ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch"]).includes(navId);
    const override = (u.nav_overrides || {})[navId];
    if (override === true) return true;
    if (override === false) return false;
    return roleDefault;
  };

  const saveAccess = async (u) => {
    try {
      await sb(`/rest/v1/profiles?id=eq.${u.id}`, { method: "PATCH", token, body: { nav_overrides: editOverrides } });
      showToast(`${u.full_name} ki access update ho gayi`);
      setEditAccessId(null);
      load();
    } catch (e) { showToast("Access save failed", "err"); }
  };

  const setPutawayMode = async (u, mode) => {
    try {
      await sb(`/rest/v1/profiles?id=eq.${u.id}`, { method: "PATCH", token, body: { putaway_mode: mode } });
      showToast(`${u.full_name} → ${mode === "bulk" ? "Bulk" : "Piece-to-Piece"} mode`);
      load();
    } catch (e) { showToast("Mode change failed", "err"); }
  };

  const changeRole = async (u, newRole) => {
    if (newRole === u.role) return;
    try {
      await sb(`/rest/v1/profiles?id=eq.${u.id}`, { method: "PATCH", token, body: { role: newRole } });
      showToast(`${u.full_name} → ${ROLE_LABEL[newRole] || newRole}`);
      load();
    } catch (e) { showToast("Role change failed", "err"); }
  };

  const load = useCallback(async () => {
    try {
      const whFilter = profile.warehouse_id ? `&warehouse_id=eq.${profile.warehouse_id}` : "";
      const [u, w] = await Promise.all([
        sb(`/rest/v1/profiles?select=*${whFilter}&order=full_name.asc`, { token }),
        sb(`/rest/v1/warehouses?select=*`, { token })
      ]);
      setUsers(u || []); setWarehouses(w || []);
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const addUser = async () => {
    if (!form.full_name.trim() || !form.email.trim() || form.password.length < 6) {
      showToast("Name, email, aur kam se kam 6-character password chahiye", "err");
      return;
    }
    if (form.role !== "admin" && !profile.warehouse_id) {
      showToast("Warehouse context load nahi hui — dobara warehouse select kar ke try karein", "err");
      return;
    }
    setBusy(true);
    try {
      let newUserId = null;
      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
          method: "POST",
          headers: { apikey: ANON_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ email: form.email.trim(), password: form.password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.msg || data.error_description || data.error || "Signup failed");
        newUserId = data.user?.id || data.id;
        if (!newUserId) throw new Error("User ID nahi mila — response check karein");
      } catch (signupErr) {
        // This email's auth account may already exist because an earlier attempt created it
        // but then failed to save the profile row (e.g. a "null" constraint error) — leaving
        // an "orphaned" auth user with no profile. Recover it by logging in with the SAME
        // credentials just given, instead of failing outright on retry.
        const msg = (signupErr.message || "").toLowerCase();
        if (msg.includes("already registered") || msg.includes("already exists")) {
          try {
            const loginData = await login(form.email.trim(), form.password);
            newUserId = loginData.user?.id;
            if (!newUserId) throw signupErr;
          } catch (loginErr) {
            const lm = (loginErr.message || "").toLowerCase();
            if (lm.includes("email not confirmed") || lm.includes("confirm")) {
              throw new Error(`Auth account ban chuka hai lekin email confirmation pending hai (Supabase project mein "Confirm email" setting on hai). Supabase Dashboard → Authentication → Users mein is email ko dhoond kar manually "Confirm" karein, phir yahan dobara try karein. (${loginErr.message})`);
            }
            throw new Error(`Yeh email pehle se registered hai lekin diya gaya password se login nahi ho raha — asal wajah: "${loginErr.message}". Alag email try karein ya sahi password confirm karein.`);
          }
        } else {
          throw signupErr;
        }
      }

      const existing = await sb(`/rest/v1/profiles?id=eq.${newUserId}&select=id`, { token });
      if (existing && existing.length) {
        showToast(`${form.full_name} ka account pehle se maujood hai — dobara add karne ki zaroorat nahi`, "err");
        setBusy(false);
        return;
      }

      await sb(`/rest/v1/profiles`, {
        method: "POST", token,
        body: { id: newUserId, full_name: form.full_name.trim(), role: form.role, warehouse_id: form.role === "admin" ? null : profile.warehouse_id || null }
      });
      showToast(`${form.full_name} add ho gaye — email: ${form.email}`);
      setForm({ full_name: "", email: "", password: "", role: "picker", warehouse_id: profile.warehouse_id || "" });
      load();
    } catch (e) {
      showToast(`Failed: ${(e.message || "").slice(0, 150)}`, "err");
    }
    setBusy(false);
  };

  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  const deleteUser = async (u) => {
    if (u.id === profile.id) { showToast("Aap khud ko delete nahi kar sakte", "err"); return; }
    try {
      await sb(`/rest/v1/profiles?id=eq.${u.id}`, { method: "DELETE", token });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "user", entity_id: u.id, user_id: profile.id, action: "removed_from_wms", metadata: { removed_name: u.full_name } } });
      showToast(`${u.full_name} WMS se remove ho gaye`);
      setConfirmDeleteId(null);
      load();
    } catch (e) { showToast("Delete failed", "err"); }
  };

  const ROLE_LABEL = { admin: "Admin", warehouse_lead: "Warehouse Lead", supervisor: "Supervisor", picker: "Picker", packer: "Packer", putaway_officer: "Putaway Officer", inbound_executive: "Inbound Executive", inspection_officer: "Inspection Officer", outbound_executive: "Outbound Executive", physical_receiver: "Physical Receiver", logistics_officer: "Logistics Officer", rtv_officer: "RTV Officer", dispatcher: "Dispatcher", returns_agent: "Returns Agent", compliance_officer: "Compliance Officer" };


  return (
    <div>
      <SectionTitle title="Users & roles" />
      <div style={S.panel}>
        <div style={S.panelTitle}>Add staff member</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <input style={{ ...S.input, flex: 1, minWidth: 140 }} placeholder="Full name" value={form.full_name} onChange={e => setForm({ ...form, full_name: e.target.value })} />
          <input style={{ ...S.input, flex: 1, minWidth: 160 }} placeholder="Email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} />
          <input style={{ ...S.input, flex: 1, minWidth: 140 }} type="password" placeholder="Password (min 6 chars)" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} />
          <select style={{ ...S.input, minWidth: 140 }} value={form.role} onChange={e => setForm({ ...form, role: e.target.value })}>
            <option value="picker">Picker</option>
            <option value="packer">Packer</option>
            <option value="putaway_officer">Putaway Officer (Putaway Only)</option>
            <option value="inbound_executive">Inbound Executive (Receiving/RTV — Full Access)</option>
            <option value="inspection_officer">Inspection Officer (Article Inspection)</option>
            <option value="outbound_executive">Outbound Executive (Allocation/RTD — Full Access)</option>
            <option value="physical_receiver">Physical Receiver (Arrival Only)</option>
            <option value="logistics_officer">Logistics Officer (Vehicle/Gatepass)</option>
            <option value="rtv_officer">RTV Officer (Prepare/Handover)</option>
            <option value="dispatcher">Dispatcher</option>
            <option value="compliance_officer">Compliance Officer (Complaints)</option>
            <option value="supervisor">Supervisor</option>
            <option value="warehouse_lead">Warehouse Lead</option>
            <option value="admin">Admin</option>
          </select>
          {form.role !== "admin" && (
            <div style={{ ...S.input, minWidth: 160, display: "flex", alignItems: "center", color: "#8A8272", background: "#F4EFE6" }}>
              📍 {warehouses.find(w => w.id === profile.warehouse_id)?.name || "Current warehouse"}
            </div>
          )}
          <button style={S.primaryBtnSm} onClick={addUser} disabled={busy}>{busy ? "Adding…" : "+ Add staff"}</button>
        </div>
        <div style={{ marginTop: 12, fontSize: 11, color: "#8A8272" }}>
          ⚠ Naya staff member is email/password se seedha login kar sakega. Real email inbox zaroori nahi (jab tak "Confirm email" Supabase mein off hai). Naya staff automatically isi warehouse ({warehouses.find(w => w.id === profile.warehouse_id)?.name || "current"}) mai add hoga.
        </div>
      </div>
      <div style={S.cardGrid}>
        {users.map(u => (
          <div key={u.id} style={S.card}>
            <div style={{ color: "#2B2620", fontFamily: "'Space Grotesk', sans-serif", fontSize: 15 }}>{u.full_name}</div>
            <div style={{ marginTop: 6 }}>
              <span style={{ ...S.badgeSm, color: "#F5A623", borderColor: "#F5A623" }}>{ROLE_LABEL[u.role] || u.role}</span>
              {u.nav_overrides && Object.keys(u.nav_overrides).length > 0 && (
                <span style={{ ...S.badgeSm, color: "#5B9EE8", borderColor: "#5B9EE8", marginLeft: 6 }}>Custom access</span>
              )}
            </div>
            <div style={{ color: "#6B6355", fontSize: 12, marginTop: 8 }}>
              {warehouses.find(w => w.id === u.warehouse_id)?.name || (u.role === "admin" ? "All warehouses" : "No warehouse set")}
            </div>
            <div style={{ marginTop: 10 }}>
              <div style={S.label}>ROLE</div>
              <select style={{ ...S.input, fontSize: 12 }} value={u.role} onChange={e => changeRole(u, e.target.value)}>
                <option value="picker">Picker</option>
                <option value="packer">Packer</option>
                <option value="putaway_officer">Putaway Officer (Putaway Only)</option>
                <option value="inbound_executive">Inbound Executive (Receiving/RTV — Full Access)</option>
                <option value="inspection_officer">Inspection Officer (Article Inspection)</option>
                <option value="outbound_executive">Outbound Executive (Allocation/RTD — Full Access)</option>
                <option value="physical_receiver">Physical Receiver (Arrival Only)</option>
                <option value="logistics_officer">Logistics Officer (Vehicle/Gatepass)</option>
                <option value="rtv_officer">RTV Officer (Prepare/Handover)</option>
                <option value="dispatcher">Dispatcher</option>
                <option value="compliance_officer">Compliance Officer (Complaints)</option>
                <option value="supervisor">Supervisor</option>
                <option value="warehouse_lead">Warehouse Lead</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div style={{ marginTop: 10 }}>
              <div style={S.label}>PUTAWAY SCAN MODE</div>
              <select style={{ ...S.input, fontSize: 12 }} value={u.putaway_mode || "bulk"} onChange={e => setPutawayMode(u, e.target.value)}>
                <option value="bulk">📦 Bulk — scan once, type qty manually</option>
                <option value="piece">🔢 Piece-to-Piece — scan every physical unit</option>
              </select>
            </div>
            <button style={{ ...S.secondaryBtnSm, marginTop: 10, width: "100%", justifyContent: "center" }} onClick={() => editAccessId === u.id ? setEditAccessId(null) : openEditAccess(u)}>
              {editAccessId === u.id ? "✕ Close" : "🔐 Edit Access"}
            </button>
            {editAccessId === u.id && (
              <div style={{ marginTop: 10, borderTop: "1px solid #E0D8C5", paddingTop: 10 }}>
                {NAV_LIST.map(([navId, label]) => {
                  const checked = isNavVisible({ ...u, nav_overrides: editOverrides }, navId);
                  return (
                    <label key={navId} style={{ display: "flex", alignItems: "center", gap: 8, padding: "4px 0", fontSize: 12, color: "#2B2620", cursor: "pointer" }}>
                      <input type="checkbox" checked={checked} onChange={e => setEditOverrides({ ...editOverrides, [navId]: e.target.checked })} />
                      {label}
                    </label>
                  );
                })}
                <button style={{ ...S.primaryBtnSm, marginTop: 10, width: "100%", justifyContent: "center" }} onClick={() => saveAccess(u)}>💾 Save access</button>
              </div>
            )}
            {u.id !== profile.id && (
              confirmDeleteId === u.id ? (
                <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                  <button style={{ ...S.secondaryBtnSm, flex: 1, justifyContent: "center", color: "#E5484D", borderColor: "#E5484D" }} onClick={() => deleteUser(u)}>Confirm delete</button>
                  <button style={{ ...S.secondaryBtnSm, flex: 1, justifyContent: "center" }} onClick={() => setConfirmDeleteId(null)}>Cancel</button>
                </div>
              ) : (
                <button style={{ ...S.secondaryBtnSm, marginTop: 8, width: "100%", justifyContent: "center", color: "#E5484D", borderColor: "#E5484D" }} onClick={() => setConfirmDeleteId(u.id)}>🗑 Delete user</button>
              )
            )}
          </div>
        ))}
        {users.length === 0 && <EmptyNote text="No staff yet." />}
      </div>
      <div style={{ fontSize: 11, color: "#8A8272", marginTop: 4 }}>
        ⚠ "Delete user" sirf WMS profile hataata hai (access khatam ho jayega). Unka Supabase Auth account agar poori tarah delete karna ho to Supabase dashboard → Authentication → Users se manually karna hoga.
      </div>
    </div>
  );
}

/* ================= RETURNS ================= */
function ReturnsView({ token, profile, showToast }) {
  const [returns, setReturns] = useState([]);
  const [staffList, setStaffList] = useState([]);
  const [returnLineAgg, setReturnLineAgg] = useState({});
  const [products, setProducts] = useState({});
  const [orders, setOrders] = useState([]);
  const [orderScanInput, setOrderScanInput] = useState("");
  const [openReturn, setOpenReturn] = useState(null);
  const [openLines, setOpenLines] = useState([]);
  const [matchedOrder, setMatchedOrder] = useState(null);
  const [originalOrderLines, setOriginalOrderLines] = useState([]);

  const loadOriginalOrderLines = async (orderId) => {
    if (!orderId) { setOriginalOrderLines([]); return; }
    try {
      const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${orderId}&select=*`, { token });
      const newProducts = await fetchProductsByIds(token, (lines || []).map(l => l.product_id));
      setProducts(prev => ({ ...prev, ...newProducts }));
      setOriginalOrderLines(lines || []);
    } catch (e) { setOriginalOrderLines([]); }
  };
  const [scanInput, setScanInput] = useState("");
  const [lineQty, setLineQty] = useState(1);
  const [lineCondition, setLineCondition] = useState("good");
  const [bins, setBins] = useState([]);
  const [lineBin, setLineBin] = useState("");
  const [importing, setImporting] = useState(false);
  const [importReport, setImportReport] = useState(null);
  const canImport = ["admin", "warehouse_lead"].includes(profile.role);
  const [exportFrom, setExportFrom] = useState(new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10));
  const [exportTo, setExportTo] = useState(new Date().toISOString().slice(0, 10));
  const [exporting, setExporting] = useState(false);
  const [reopenAdd, setReopenAdd] = useState(false);
  const [searchTracking, setSearchTracking] = useState("");

  const exportReturnsCSV = async () => {
    setExporting(true);
    try {
      const fromISO = new Date(exportFrom + "T00:00:00").toISOString();
      const toISO = new Date(new Date(exportTo + "T00:00:00").getTime() + 86400000).toISOString();
      const rangeReturns = await sb(`/rest/v1/returns?received_at=gte.${fromISO}&received_at=lt.${toISO}&select=*`, { token });
      if (!rangeReturns || rangeReturns.length === 0) { showToast("Is date range mein koi return nahi mili", "err"); setExporting(false); return; }
      const returnIds = rangeReturns.map(r => r.id);
      const orderIds = [...new Set(rangeReturns.map(r => r.order_id).filter(Boolean))];
      const [lines, profs, ordersData] = await Promise.all([
        sb(`/rest/v1/return_lines?return_id=in.(${returnIds.join(",")})&select=*`, { token }),
        sb(`/rest/v1/profiles?select=*`, { token }),
        orderIds.length ? sb(`/rest/v1/sales_orders?id=in.(${orderIds.join(",")})&select=*`, { token }) : Promise.resolve([])
      ]);
      const productIds = [...new Set((lines || []).map(l => l.product_id))];
      const prodMap = productIds.length ? await fetchProductsByIds(token, productIds) : {};
      const profMap = Object.fromEntries((profs || []).map(p => [p.id, p]));
      const orderMap = Object.fromEntries((ordersData || []).map(o => [o.id, o]));
      const returnMap = Object.fromEntries(rangeReturns.map(r => [r.id, r]));

      const rows = (lines || []).map(l => {
        const ret = returnMap[l.return_id];
        const order = ret ? orderMap[ret.order_id] : null;
        const p = prodMap[l.product_id];
        return [
          order?.raw_data?.customer_order_number || order?.raw_data?.customer || "—",
          ret?.tracking_number || order?.external_order_id || "—",
          p?.barcode || "—",
          p?.name || "—",
          l.qty,
          l.condition || "—",
          ret?.origin_city || order?.delivery_city || "—",
          profMap[ret?.received_by]?.full_name || profMap[ret?.processed_by]?.full_name || "—",
          ret?.received_at ? fmtTime(ret.received_at) : "—"
        ];
      });
      exportCSV(`returns-export-${exportFrom}-to-${exportTo}.csv`,
        ["Customer #", "Tracking #", "Barcode", "Product Name", "Qty", "Condition", "Location", "User Name", "Date/Time"], rows);
      showToast(`${rows.length} rows exported`);
    } catch (e) { showToast("Export failed", "err"); }
    setExporting(false);
  };

  const load = useCallback(async () => {
    try {
      const [r, o, allLines, staff] = await Promise.all([
        sb(`/rest/v1/returns?select=*&order=received_at.desc`, { token }),
        sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/return_lines?select=return_id,qty,bin_id`, { token }),
        sb(`/rest/v1/profiles?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token })
      ]);
      setReturns(r || []); setOrders(o || []);
      setStaffList(staff || []);
      const agg = {};
      for (const l of allLines || []) {
        if (!agg[l.return_id]) agg[l.return_id] = { qty: 0, binIds: new Set() };
        agg[l.return_id].qty += l.qty;
        if (l.bin_id) agg[l.return_id].binIds.add(l.bin_id);
      }
      setReturnLineAgg(agg);
      setBins(await sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }) || []);
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const scanOrderTracking = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : orderScanInput).trim();
    setOrderScanInput("");
    if (!code) return;

    // Lock: one tracking number can only ever have one return record
    const existingReturn = returns.find(r => r.tracking_number === code);
    if (existingReturn) {
      showToast(`⚠ Yeh tracking "${code}" ke liye return already ban chuka hai — wahi khol rahe hain`, "err");
      openReturnDetail(existingReturn);
      return;
    }

    const order = orders.find(o => o.external_order_id === code);
    let courierGuess = order?.courier || "Other";
    let courierInfo = null;

    if (order && !order.delivery_city) {
      // Order exists but hasn't been synced with courier yet — try a fresh single lookup
      try {
        if (isPostex(order.courier)) {
          const p = await postexProxy("track", { trackingNumbers: [code] }, token);
          const r = p.results?.[0];
          if (r && !r.error) courierInfo = r;
        } else if (isMnp(order.courier)) {
          const m = await mnpProxy("track", { trackingNumbers: [code] }, token);
          const r = m.results?.[0];
          if (r) courierInfo = r;
        }
      } catch (e) {}
    } else if (!order) {
      // Not in our system (likely an old order dispatched before this app was used) —
      // try both courier APIs to see if either recognizes this tracking number.
      try {
        const p = await postexProxy("track", { trackingNumbers: [code] }, token);
        const r = p.results?.[0];
        if (r && !r.error && r.transactionStatus) { courierInfo = r; courierGuess = "PostEx"; }
      } catch (e) {}
      if (!courierInfo) {
        try {
          const m = await mnpProxy("track", { trackingNumbers: [code] }, token);
          const r = m.results?.[0];
          if (r && r.transactionStatus) { courierInfo = r; courierGuess = "M&P"; }
        } catch (e) {}
      }
    }

    try {
      const created = await sb(`/rest/v1/returns`, {
        method: "POST", token, prefer: "return=representation",
        body: { order_id: order ? order.id : null, courier: courierGuess, status: "pending", tracking_number: code, received_by: profile.id, origin_city: order?.delivery_city || courierInfo?.cityName || null }
      });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "return", entity_id: created[0].id, user_id: profile.id, action: "created", metadata: { tracking: code, courier_info: courierInfo } } });
      if (order) {
        showToast(`Order mila — ${order.courier}`);
      } else if (courierInfo) {
        showToast(`⚠ Order database mein nahi mila (purana order) — lekin ${courierGuess} se detail mil gayi: ${courierInfo.transactionStatus}${courierInfo.cityName ? `, ${courierInfo.cityName}` : ""}. Return record ban gaya, items scan karein.`);
      } else {
        showToast("Order database mein nahi mila, courier se bhi detail nahi mili — phir bhi return record ban gaya, items scan karein");
      }
      load();
      setMatchedOrder(order || null);
      loadOriginalOrderLines(order?.id);
      setOpenLines([]);
      setOpenReturn(created[0]);
    } catch (e) { showToast(`Failed: ${(e.message || "").slice(0, 100)}`, "err"); }
  };

  const openReturnDetail = async (ret) => {
    const lines = await sb(`/rest/v1/return_lines?return_id=eq.${ret.id}&select=*`, { token });
    setOpenLines(lines || []);
    const newProducts = await fetchProductsByIds(token, (lines || []).map(l => l.product_id));
    setProducts(prev => ({ ...prev, ...newProducts }));
    const matched = orders.find(o => o.id === ret.order_id) || null;
    setMatchedOrder(matched);
    loadOriginalOrderLines(matched?.id);
    setOpenReturn(ret);
  };

  const scanReturnItem = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : scanInput).trim();
    setScanInput("");
    if (!code) return;
    const lineBinObj = lineCondition === "damaged" ? bins.find(b => (b.code || "").toLowerCase() === lineBin.trim().toLowerCase()) : null;
    if (lineCondition === "damaged" && !lineBinObj) { showToast("Sahi damage bin code likhein (jo list mein maujood ho)", "err"); return; }
    const product = await lookupProductByCode(token, code);
    if (!product) { showToast("Barcode/SKU match nahi hua", "err"); return; }
    try {
      await sb(`/rest/v1/return_lines`, { method: "POST", token, body: { return_id: openReturn.id, product_id: product.id, qty: Number(lineQty) || 1, condition: lineCondition, bin_id: lineCondition === "damaged" ? lineBinObj.id : null } });
      setProducts(prev => ({ ...prev, [product.id]: product }));
      showToast(`✓ ${product.barcode} added (${lineCondition})`);
      setLineQty(1);
      openReturnDetail(openReturn);
    } catch (e) { showToast("Add failed", "err"); }
  };

  const isAdminOrLead = ["admin", "warehouse_lead"].includes(profile.role);

  // Admin/Lead only — a return that's already been submitted turns out to be missing a piece
  // (e.g. the tracking's parcel count was higher than what got scanned). This adds ONE more
  // line to the already-processed return and immediately routes it onward (Putaway for good,
  // damage_inventory for damaged) — the return's own status/submitted lines are untouched.
  const addLineAfterSubmit = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : scanInput).trim();
    setScanInput("");
    if (!code) return;
    const lineBinObj = lineCondition === "damaged" ? bins.find(b => (b.code || "").toLowerCase() === lineBin.trim().toLowerCase()) : null;
    if (lineCondition === "damaged" && !lineBinObj) { showToast("Sahi damage bin code likhein (jo list mein maujood ho)", "err"); return; }
    const product = await lookupProductByCode(token, code);
    if (!product) { showToast("Barcode/SKU match nahi hua", "err"); return; }
    try {
      const qty = Number(lineQty) || 1;
      const created = await sb(`/rest/v1/return_lines`, { method: "POST", token, prefer: "return=representation", body: { return_id: openReturn.id, product_id: product.id, qty, condition: lineCondition, bin_id: lineCondition === "damaged" ? lineBinObj.id : null } });
      const newLine = created[0];
      if (lineCondition === "good") {
        await sb(`/rest/v1/putaway_tasks`, { method: "POST", token, body: { product_id: product.id, qty, return_line_id: newLine.id, status: "pending" } });
        await sb(`/rest/v1/return_lines?id=eq.${newLine.id}`, { method: "PATCH", token, body: { processed_via_putaway: true } });
      } else {
        const existing = await sb(`/rest/v1/damage_inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${product.id}&bin_id=eq.${lineBinObj.id}&select=*`, { token });
        if (existing && existing.length > 0) {
          await sb(`/rest/v1/damage_inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${product.id}&bin_id=eq.${lineBinObj.id}`, { method: "PATCH", token, body: { qty: existing[0].qty + qty } });
        } else {
          await sb(`/rest/v1/damage_inventory`, { method: "POST", token, body: { warehouse_id: profile.warehouse_id, product_id: product.id, bin_id: lineBinObj.id, qty } });
        }
      }
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "return", entity_id: openReturn.id, user_id: profile.id, action: "line_added_after_submit", metadata: { product_id: product.id, qty, condition: lineCondition } } });
      setProducts(prev => ({ ...prev, [product.id]: product }));
      showToast(lineCondition === "good" ? `✓ ${product.barcode} add ho gaya — Putaway queue mein bhej diya` : `✓ ${product.barcode} add ho gaya — damage inventory mein record ho gaya`);
      setLineQty(1);
      openReturnDetail(openReturn);
    } catch (e) { showToast("Add failed: " + e.message, "err"); }
  };

  const requestDeleteReturn = async () => {
    const reason = window.prompt("Yeh return galti se kyun bana? (optional, Admin/Lead ko dikhega)");
    try {
      await sb(`/rest/v1/returns?id=eq.${openReturn.id}`, { method: "PATCH", token, body: { delete_requested: true, delete_requested_by: profile.id, delete_requested_at: new Date().toISOString(), delete_reason: reason || null } });
      showToast("✅ Delete request bhej di gayi — Admin/Lead approve karenge");
      setOpenReturn({ ...openReturn, delete_requested: true, delete_requested_by: profile.id, delete_requested_at: new Date().toISOString(), delete_reason: reason || null });
      load();
    } catch (e) { showToast("Request failed", "err"); }
  };

  const approveDeleteReturn = async (ret) => {
    if (!window.confirm("Confirm karein — yeh return record permanently delete ho jayega.")) return;
    try {
      await sb(`/rest/v1/returns?id=eq.${ret.id}`, { method: "DELETE", token });
      showToast("✅ Return delete ho gaya");
      setOpenReturn(null);
      load();
    } catch (e) { showToast("Delete failed", "err"); }
  };

  const rejectDeleteReturn = async (ret) => {
    try {
      await sb(`/rest/v1/returns?id=eq.${ret.id}`, { method: "PATCH", token, body: { delete_requested: false, delete_requested_by: null, delete_requested_at: null, delete_reason: null } });
      showToast("Request reject ho gayi — return normal reh gaya");
      setOpenReturn({ ...ret, delete_requested: false });
      load();
    } catch (e) { showToast("Failed", "err"); }
  };

  const submitReturn = async () => {
    try {
      let anyGood = false, anyDamaged = false;
      let strNumber = null;
      for (const l of openLines) {
        if (l.condition === "good") {
          anyGood = true;
          // Route to Putaway queue instead of direct restock — same accountable flow as GRN receiving
          await sb(`/rest/v1/putaway_tasks`, { method: "POST", token, body: { product_id: l.product_id, qty: l.qty, return_line_id: l.id, status: "pending" } });
          await sb(`/rest/v1/return_lines?id=eq.${l.id}`, { method: "PATCH", token, body: { processed_via_putaway: true } });
        } else if (l.condition === "damaged") {
          anyDamaged = true;
          const existing = await sb(`/rest/v1/damage_inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${l.product_id}&bin_id=eq.${l.bin_id}&select=*`, { token });
          if (existing && existing.length > 0) {
            await sb(`/rest/v1/damage_inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${l.product_id}&bin_id=eq.${l.bin_id}`, { method: "PATCH", token, body: { qty: existing[0].qty + l.qty } });
          } else {
            await sb(`/rest/v1/damage_inventory`, { method: "POST", token, body: { warehouse_id: profile.warehouse_id, product_id: l.product_id, bin_id: l.bin_id, qty: l.qty } });
          }
        }
      }
      if (anyDamaged) {
        strNumber = `STR-${(openReturn.courier || "GEN").replace(/\s/g, "")}-${new Date().toISOString().slice(0, 10).replace(/-/g, "")}-${Date.now().toString().slice(-4)}`;
      }
      await sb(`/rest/v1/returns?id=eq.${openReturn.id}`, { method: "PATCH", token, body: { status: "restocked", processed_by: profile.id, processed_at: new Date().toISOString(), ...(strNumber ? { str_number: strNumber } : {}) } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "return", entity_id: openReturn.id, user_id: profile.id, action: "submitted", metadata: { str_number: strNumber, good: anyGood, damaged: anyDamaged } } });
      showToast(anyGood ? "Return submitted — good items Putaway queue mein bhej diye" : strNumber ? `Processed — STR: ${strNumber}` : "Return submitted");
      setOpenReturn(null); load();
    } catch (e) { showToast(`Submit failed: ${(e.message || "").slice(0, 150)}`, "err"); }
  };

  const handleReturnsImportFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImporting(true); setImportReport(null);
    try {
      const rows = await parseSheet(file);
      if (rows.length === 0) { showToast("File khali hai", "err"); setImporting(false); return; }
      const map = buildColumnMap(Object.keys(rows[0]));
      const condHeader = Object.keys(rows[0]).find(h => normHeader(h) === "condition");
      const reasonHeader = Object.keys(rows[0]).find(h => normHeader(h) === "reason");
      if (!map.barcode || !map.orderRef) { showToast("Barcode ya Tracking column nahi mila", "err"); setImporting(false); return; }
      const fileBarcodes = rows.map(r => getVal(r, map, "barcode"));
      const productMap = await fetchProductsByBarcodes(token, fileBarcodes);
      const valid = [], invalid = [];
      rows.forEach((row, i) => {
        const tracking = cleanCode(getVal(row, map, "orderRef"));
        const barcode = cleanCode(getVal(row, map, "barcode"));
        const qty = Number(getVal(row, map, "qty")) || 1;
        const product = barcode ? productMap[barcode] : null;
        const condition = (condHeader ? String(row[condHeader] || "good") : "good").trim().toLowerCase() === "damaged" ? "damaged" : "good";
        if (!tracking || !product) { invalid.push({ rowNum: i + 2, tracking, barcode }); return; }
        valid.push({ tracking, product, qty, condition, courier: String(getVal(row, map, "courier") || "Other").trim(), reason: reasonHeader ? String(row[reasonHeader] || "") : "" });
      });
      setImportReport({ valid, invalid, fileName: file.name });
      showToast(`Validated: ${valid.length} valid, ${invalid.length} invalid`);
    } catch (err) { showToast(`Validation failed: ${(err.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  const confirmReturnsImport = async () => {
    if (!importReport) return;
    setImporting(true);
    try {
      const byTracking = {};
      for (const r of importReport.valid) { (byTracking[r.tracking] = byTracking[r.tracking] || []).push(r); }
      let created = 0;
      for (const [tracking, rows] of Object.entries(byTracking)) {
        const order = orders.find(o => o.external_order_id === tracking);
        const first = rows[0];
        const ret = await sb(`/rest/v1/returns`, {
          method: "POST", token, prefer: "return=representation",
          body: { order_id: order ? order.id : null, courier: first.courier, reason: first.reason, status: "restocked", processed_by: profile.id, processed_at: new Date().toISOString() }
        });
        for (const r of rows) {
          await sb(`/rest/v1/return_lines`, { method: "POST", token, body: { return_id: ret[0].id, product_id: r.product.id, qty: r.qty, condition: r.condition } });
        }
        created++;
      }
      showToast(`${created} historical return record(s) imported`);
      setImportReport(null); load();
    } catch (e) { showToast("Import failed", "err"); }
    setImporting(false);
  };

  if (openReturn) {
    return (
      <div>
        <SectionTitle title={`Return — ${matchedOrder?.external_order_id || "Unlinked"} (${openReturn.courier || "—"})`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenReturn(null)}>← Back</button>} />
        {matchedOrder && (
          <div style={S.panel}>
            <div style={S.panelTitle}>ℹ️ Original Order Items — Reference ({matchedOrder.external_order_id})</div>
            <table>
              <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Ordered Qty</th></tr></thead>
              <tbody>
                {originalOrderLines.map(l => {
                  const p = products[l.product_id];
                  return (
                    <tr key={l.id}>
                      <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                      <td style={S.td}>{p?.name || "—"}</td>
                      <td style={S.td}>{l.qty}</td>
                    </tr>
                  );
                })}
                {!originalOrderLines.length && <tr><td colSpan={3}><EmptyNote text="Is order ki lines nahi mili" /></td></tr>}
              </tbody>
            </table>
          </div>
        )}
        {openReturn.status === "pending" && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Scan each returned product</div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
            <input autoFocus style={{ ...S.input, flex: 1, minWidth: 180, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type barcode/SKU, then Enter"
              value={scanInput} onChange={e => setScanInput(e.target.value)} onKeyDown={e => e.key === "Enter" && scanReturnItem()} />
            <CameraScanButton onScan={(text) => scanReturnItem(text)} />
            <input style={{ ...S.input, width: 80 }} type="number" min={1} value={lineQty} onChange={e => setLineQty(e.target.value)} />
            <div style={{ display: "flex", gap: 8 }}>
              {["good", "damaged"].map(c => (
                <button key={c} onClick={() => setLineCondition(c)} style={{ ...S.secondaryBtnSm, ...(lineCondition === c ? { background: c === "good" ? "#4CAF7D" : "#E5484D", color: "#1A1206", borderColor: c === "good" ? "#4CAF7D" : "#E5484D" } : {}) }}>
                  {c === "good" ? "✓ Good" : "✕ Damaged"}
                </button>
              ))}
            </div>
            {lineCondition === "damaged" && (
              <>
                <input list="returnDamageBinDatalist" style={{ ...S.input, minWidth: 160, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Damage bin code" value={lineBin} onChange={e => setLineBin(e.target.value)} />
                <datalist id="returnDamageBinDatalist">
                  {bins.map(b => <option key={b.id} value={b.code} />)}
                </datalist>
              </>
            )}
            <button style={S.primaryBtnSm} onClick={() => scanReturnItem()}>Scan</button>
          </div>
        </div>
        )}
        <div style={S.panel}>
          <div style={S.panelTitle}>Items scanned</div>
          <table>
            <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Qty</th><th style={S.th}>Condition</th><th style={S.th}>Bin</th></tr></thead>
            <tbody>
              {openLines.map(l => {
                const p = products[l.product_id];
                const bin = bins.find(b => b.id === l.bin_id);
                return (
                  <tr key={l.id}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode}</td>
                    <td style={S.td}>{p?.name}</td>
                    <td style={S.td}>{l.qty}</td>
                    <td style={S.td}><span style={{ ...S.badgeSm, color: l.condition === "good" ? "#4CAF7D" : "#E5484D", borderColor: l.condition === "good" ? "#4CAF7D" : "#E5484D" }}>{l.condition}</span></td>
                    <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace" }}>{bin?.code || "—"}</td>
                  </tr>
                );
              })}
              {openLines.length === 0 && <tr><td colSpan={5}><EmptyNote text="No items scanned yet." /></td></tr>}
            </tbody>
          </table>
          {openLines.length > 0 && openReturn.status === "pending" && (
            <button style={{ ...S.primaryBtnSm, marginTop: 14 }} onClick={submitReturn}>✓ Submit return — Good items Put Away queue mein jayenge</button>
          )}
          {openReturn.status !== "pending" && (
            <div style={{ color: "#4CAF7D", fontSize: 12, marginTop: 14 }}>✅ Yeh return already submit ho chuka hai ({openReturn.status}) — dobara submit karne ki zaroorat nahi.</div>
          )}
          {openReturn.status !== "pending" && isAdminOrLead && (
            <div style={{ marginTop: 14 }}>
              <button style={S.secondaryBtnSm} onClick={() => setReopenAdd(r => !r)}>{reopenAdd ? "✕ Band karein" : "+ Ek aur item add karein (missed piece)"}</button>
              {reopenAdd && (
                <div style={{ marginTop: 12, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                  <input autoFocus style={{ ...S.input, flex: 1, minWidth: 180, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type barcode/SKU, then Enter"
                    value={scanInput} onChange={e => setScanInput(e.target.value)} onKeyDown={e => e.key === "Enter" && addLineAfterSubmit()} />
                  <CameraScanButton onScan={(text) => addLineAfterSubmit(text)} />
                  <input style={{ ...S.input, width: 80 }} type="number" min={1} value={lineQty} onChange={e => setLineQty(e.target.value)} />
                  <div style={{ display: "flex", gap: 8 }}>
                    {["good", "damaged"].map(c => (
                      <button key={c} onClick={() => setLineCondition(c)} style={{ ...S.secondaryBtnSm, ...(lineCondition === c ? { background: c === "good" ? "#4CAF7D" : "#E5484D", color: "#1A1206", borderColor: c === "good" ? "#4CAF7D" : "#E5484D" } : {}) }}>
                        {c === "good" ? "✓ Good" : "✕ Damaged"}
                      </button>
                    ))}
                  </div>
                  {lineCondition === "damaged" && (
                    <>
                      <input list="returnDamageBinDatalist2" style={{ ...S.input, minWidth: 160, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Damage bin code" value={lineBin} onChange={e => setLineBin(e.target.value)} />
                      <datalist id="returnDamageBinDatalist2">
                        {bins.map(b => <option key={b.id} value={b.code} />)}
                      </datalist>
                    </>
                  )}
                  <button style={S.primaryBtnSm} onClick={() => addLineAfterSubmit()}>Scan & Add</button>
                </div>
              )}
            </div>
          )}
          {openReturn.status === "pending" && !openReturn.delete_requested && (
            <button style={{ ...S.secondaryBtnSm, marginTop: 14, color: "#E5484D", borderColor: "#E5484D" }} onClick={requestDeleteReturn}>🗑 Galti se ban gaya — Delete Request bhejein</button>
          )}
          {openReturn.delete_requested && !isAdminOrLead && (
            <div style={{ color: "#F5A623", fontSize: 12, marginTop: 14 }}>⏳ Delete request bhej di gayi hai — Admin/Warehouse Lead ki approval ka intezar hai.</div>
          )}
          {openReturn.delete_requested && isAdminOrLead && (
            <div style={{ background: "#FDF0EE", border: "1px solid #E5484D", borderRadius: 8, padding: 12, marginTop: 14 }}>
              <div style={{ color: "#E5484D", fontWeight: 700, fontSize: 13, marginBottom: 4 }}>🗑 Delete Request Pending</div>
              <div style={{ color: "#6B6355", fontSize: 12, marginBottom: 10 }}>
                By {staffList.find(s => s.id === openReturn.delete_requested_by)?.full_name || "—"} · {fmtTime(openReturn.delete_requested_at)}
                {openReturn.delete_reason ? ` — "${openReturn.delete_reason}"` : ""}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button style={{ ...S.primaryBtnSm, background: "#E5484D", borderColor: "#E5484D" }} onClick={() => approveDeleteReturn(openReturn)}>✓ Approve &amp; Delete</button>
                <button style={S.secondaryBtnSm} onClick={() => rejectDeleteReturn(openReturn)}>✕ Reject Request</button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle title="Returns" action={
        canImport ? (
          <label style={{ ...S.secondaryBtnSm, cursor: "pointer" }}>
            {importing ? "Importing…" : "📤 Import historical returns"}
            <input type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={handleReturnsImportFile} disabled={importing} />
          </label>
        ) : null
      } />

      <div style={S.panel}>
        <div style={S.panelTitle}>Export processed returns — item-wise (CSV only)</div>
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <input type="date" style={{ ...S.input, maxWidth: 160 }} value={exportFrom} onChange={e => setExportFrom(e.target.value)} />
          <span style={{ color: "#8A8272" }}>to</span>
          <input type="date" style={{ ...S.input, maxWidth: 160 }} value={exportTo} onChange={e => setExportTo(e.target.value)} />
          <button style={S.primaryBtnSm} onClick={exportReturnsCSV} disabled={exporting}>{exporting ? "Exporting…" : "⬇ Export CSV"}</button>
        </div>
        <div style={{ color: "#8A8272", fontSize: 10, marginTop: 8 }}>Columns: Customer #, Tracking #, Barcode, Product Name, Qty, Condition, Location, User Name, Date/Time — ek row har return line ke liye.</div>
      </div>

      {importReport && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Historical returns — validation report ({importReport.fileName})</div>
          <div style={{ display: "flex", gap: 20, marginBottom: 12 }}>
            <div><span style={{ color: "#4CAF7D", fontWeight: 700, fontSize: 18 }}>{importReport.valid.length}</span> <span style={{ color: "#6B6355", fontSize: 12 }}>valid</span></div>
            <div><span style={{ color: "#E5484D", fontWeight: 700, fontSize: 18 }}>{importReport.invalid.length}</span> <span style={{ color: "#6B6355", fontSize: 12 }}>invalid</span></div>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <button style={S.primaryBtnSm} onClick={confirmReturnsImport} disabled={importing || importReport.valid.length === 0}>✓ Confirm import</button>
            <button style={S.secondaryBtnSm} onClick={() => setImportReport(null)}>Cancel</button>
          </div>
        </div>
      )}
      <div style={S.panel}>
        <div style={S.panelTitle}>Scan order tracking number — return received from courier</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type tracking number, then Enter"
            value={orderScanInput} onChange={e => setOrderScanInput(e.target.value)} onKeyDown={e => e.key === "Enter" && scanOrderTracking()} />
          <CameraScanButton onScan={(text) => scanOrderTracking(text)} />
          <button style={S.primaryBtnSm} onClick={() => scanOrderTracking()}>Start Return</button>
        </div>
      </div>
      {isAdminOrLead && returns.filter(r => r.delete_requested).length > 0 && (
        <div style={{ ...S.panel, borderColor: "#E5484D" }}>
          <div style={{ color: "#E5484D", fontWeight: 700, fontSize: 14, marginBottom: 10 }}>🗑 Pending Delete Requests — {returns.filter(r => r.delete_requested).length}</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {returns.filter(r => r.delete_requested).map(r => (
              <div key={r.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#FDF0EE", borderRadius: 8, padding: "10px 14px", flexWrap: "wrap", gap: 8 }}>
                <div>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontWeight: 600 }}>{r.tracking_number || "—"}</div>
                  <div style={{ color: "#6B6355", fontSize: 11, marginTop: 2 }}>
                    By {staffList.find(s => s.id === r.delete_requested_by)?.full_name || "—"} · {fmtTime(r.delete_requested_at)}
                    {r.delete_reason ? ` — "${r.delete_reason}"` : ""}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button style={{ ...S.primaryBtnSm, background: "#E5484D", borderColor: "#E5484D" }} onClick={() => approveDeleteReturn(r)}>✓ Approve &amp; Delete</button>
                  <button style={S.secondaryBtnSm} onClick={() => rejectDeleteReturn(r)}>✕ Reject</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
      <div style={S.panel}>
        <input style={{ ...S.input, maxWidth: 260, marginBottom: 14 }} placeholder="🔍 Search tracking # (full ya last 5 digits)" value={searchTracking} onChange={e => setSearchTracking(e.target.value)} />
        <table>
          <thead><tr><th style={S.th}>Tracking</th><th style={S.th}>Courier</th><th style={S.th}>Order #</th><th style={S.th}>Qty</th><th style={S.th}>Location</th><th style={S.th}>Status</th><th style={S.th}>Receiving Timestamp</th><th style={S.th}>User Name</th></tr></thead>
          <tbody>
            {returns.filter(r => !searchTracking.trim() || (r.tracking_number || "").toLowerCase().includes(searchTracking.trim().toLowerCase())).map(r => {
              const order = orders.find(o => o.id === r.order_id);
              const agg = returnLineAgg[r.id];
              return (
                <tr key={r.id} style={{ cursor: "pointer" }} onClick={() => openReturnDetail(r)}>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{r.tracking_number || order?.external_order_id || "—"}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{r.courier || order?.courier || "—"}</td>
                  <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace" }}>{order?.external_order_id || "—"}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{agg?.qty || 0}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{r.origin_city || order?.delivery_city || "—"}</td>
                  <td style={S.td}><span style={{ ...S.badgeSm, color: r.status === "pending" ? "#6B6355" : r.status === "restocked" ? "#4CAF7D" : "#E5484D", borderColor: r.status === "pending" ? "#E0D8C5" : r.status === "restocked" ? "#4CAF7D" : "#E5484D" }}>{r.status}</span></td>
                  <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{fmtTime(r.received_at)}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{staffList.find(s => s.id === r.received_by)?.full_name || "—"}</td>
                </tr>
              );
            })}
            {returns.length === 0 && <tr><td colSpan={8}><EmptyNote text="No returns logged yet." /></td></tr>}
            {returns.length > 0 && searchTracking.trim() && !returns.filter(r => (r.tracking_number || "").toLowerCase().includes(searchTracking.trim().toLowerCase())).length && <tr><td colSpan={8}><EmptyNote text="Is search se koi return nahi mila." /></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ================= REPORTS ================= */
function categorizeEvent(ev) {
  if (ev.entity_type === "putaway_task") return "Put Away";
  if (ev.entity_type === "pick_task") return "Pick";
  if (ev.entity_type === "pack_task") return "Pack";
  if (ev.entity_type === "sales_order" && ev.action === "dispatched") return "Dispatch";
  if (ev.entity_type === "return" || ev.entity_type === "return_line") return "Returns";
  if (ev.entity_type === "grn" || ev.entity_type === "grn_line") return "GRN";
  return "Other";
}
const CATEGORIES = ["GRN", "Put Away", "Pick", "Pack", "Dispatch", "Returns"];

function ReportsView({ token, profile, showToast }) {
  const isAdmin = profile.role === "admin";
  const [debugTracking, setDebugTracking] = useState("");
  const [debugResult, setDebugResult] = useState(null);
  const [debugLoading, setDebugLoading] = useState(false);

  const runMnpDebug = async () => {
    if (!debugTracking.trim()) { showToast("Tracking number enter karein", "err"); return; }
    setDebugLoading(true); setDebugResult(null);
    try {
      const result = await mnpProxy("debug", { trackingNumber: debugTracking.trim() }, token);
      setDebugResult(result);
    } catch (e) { setDebugResult({ error: e.message }); }
    setDebugLoading(false);
  };

  const REPORTS = [
    { key: "inventory_bin_ledger", label: "Inventory Bin Ledger" },
    { key: "inventory_ledger", label: "Inventory Ledger" },
    { key: "order_dump", label: "Order Dump Report" },
    { key: "grn_report", label: "GRN Report" },
    { key: "user_productivity", label: "User-wise Productivity Report" },
    { key: "courier_performance", label: "Courier Performance (City-wise)" }
  ];
  const [reportType, setReportType] = useState("inventory_ledger");
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(false);

  const loadReport = useCallback(async (key) => {
    setLoading(true);
    try {
      if (key === "inventory_ledger") {
        const [inv, products, reserved, putaway, grnLinesAll, grnAll] = await Promise.all([
          sb(`/rest/v1/inventory?warehouse_id=eq.${profile.warehouse_id}&select=*&limit=50000`, { token }),
          sb(`/rest/v1/products?select=*&limit=20000`, { token }),
          sb(`/rest/v1/inventory_reserved?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
          sb(`/rest/v1/putaway_tasks?status=eq.completed&select=product_id,qty_completed,completed_at,grn_line_id&order=completed_at.asc`, { token }),
          sb(`/rest/v1/grn_lines?select=id,grn_id`, { token }),
          sb(`/rest/v1/grn?select=id,grn_number,created_at`, { token })
        ]);
        const prodMap = Object.fromEntries((products || []).map(p => [p.id, p]));
        const resMap = Object.fromEntries((reserved || []).map(r => [r.product_id, r.reserved]));
        const glMap = Object.fromEntries((grnLinesAll || []).map(l => [l.id, l]));
        const grnMap = Object.fromEntries((grnAll || []).map(g => [g.id, g]));
        const putawayByProduct = {};
        for (const p of putaway || []) {
          if (!p.qty_completed || !p.completed_at) continue;
          const gl = p.grn_line_id ? glMap[p.grn_line_id] : null;
          const grn = gl ? grnMap[gl.grn_id] : null;
          const row = { qty_completed: p.qty_completed, grnDate: grn ? grn.created_at : p.completed_at, grnNumber: grn ? grn.grn_number : "Return" };
          if (!putawayByProduct[p.product_id]) putawayByProduct[p.product_id] = [];
          putawayByProduct[p.product_id].push(row);
        }
        for (const k in putawayByProduct) putawayByProduct[k].sort((a, b) => new Date(a.grnDate) - new Date(b.grnDate));
        const byProduct = {};
        for (const row of inv || []) byProduct[row.product_id] = (byProduct[row.product_id] || 0) + row.on_hand;
        setRows(Object.entries(byProduct).filter(([, onHand]) => onHand > 0).map(([pid, onHand]) => {
          const p = prodMap[pid]; const res = resMap[pid] || 0;
          const aging = computeAgingDays(onHand, putawayByProduct[pid]);
          return { "Barcode": p?.barcode || "—", "Product": p?.name || "—", "On Hand": onHand, "Reserved": res, "Available": onHand - res, "Aging (days)": aging != null ? aging.days : "—", "Oldest Batch (GRN)": aging?.grnNumber || "—" };
        }));
      } else if (key === "inventory_bin_ledger") {
        const [inv, products, bins, putaway, grnLinesAll, grnAll] = await Promise.all([
          sb(`/rest/v1/inventory?warehouse_id=eq.${profile.warehouse_id}&select=*&limit=50000`, { token }),
          sb(`/rest/v1/products?select=*&limit=20000`, { token }),
          sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
          sb(`/rest/v1/putaway_tasks?status=eq.completed&select=product_id,bin_id,qty_completed,completed_at,grn_line_id&order=completed_at.asc`, { token }),
          sb(`/rest/v1/grn_lines?select=id,grn_id`, { token }),
          sb(`/rest/v1/grn?select=id,grn_number,created_at`, { token })
        ]);
        const prodMap = Object.fromEntries((products || []).map(p => [p.id, p]));
        const binMap = Object.fromEntries((bins || []).map(b => [b.id, b]));
        const glMap2 = Object.fromEntries((grnLinesAll || []).map(l => [l.id, l]));
        const grnMap2 = Object.fromEntries((grnAll || []).map(g => [g.id, g]));
        const putawayByBin = {};
        for (const p of putaway || []) {
          if (!p.qty_completed || !p.completed_at) continue;
          const gl = p.grn_line_id ? glMap2[p.grn_line_id] : null;
          const grn = gl ? grnMap2[gl.grn_id] : null;
          const row = { qty_completed: p.qty_completed, grnDate: grn ? grn.created_at : p.completed_at, grnNumber: grn ? grn.grn_number : "Return" };
          const key2 = `${p.product_id}|${p.bin_id}`;
          if (!putawayByBin[key2]) putawayByBin[key2] = [];
          putawayByBin[key2].push(row);
        }
        for (const k in putawayByBin) putawayByBin[k].sort((a, b) => new Date(a.grnDate) - new Date(b.grnDate));
        setRows((inv || []).filter(r => r.on_hand > 0).map(r => {
          const aging = computeAgingDays(r.on_hand, putawayByBin[`${r.product_id}|${r.bin_id}`]);
          return {
            "Bin": binMap[r.bin_id]?.code || "Unassigned", "Barcode": prodMap[r.product_id]?.barcode || "—",
            "Product": prodMap[r.product_id]?.name || "—", "On Hand": r.on_hand, "Aging (days)": aging != null ? aging.days : "—",
            "Oldest Batch (GRN)": aging?.grnNumber || "—"
          };
        }));
      } else if (key === "order_dump") {
        const [orders, pickTasksAll, packTasksAll, profs] = await Promise.all([
          sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=*&order=received_at.desc`, { token }),
          sb(`/rest/v1/pick_tasks?select=order_id,assigned_to`, { token }),
          sb(`/rest/v1/pack_tasks?select=order_id,assigned_to`, { token }),
          sb(`/rest/v1/profiles?select=*`, { token })
        ]);
        const profMap = Object.fromEntries((profs || []).map(p => [p.id, p]));
        const pickerByOrder = Object.fromEntries((pickTasksAll || []).map(t => [t.order_id, profMap[t.assigned_to]?.full_name || "—"]));
        const packerByOrder = Object.fromEntries((packTasksAll || []).map(t => [t.order_id, profMap[t.assigned_to]?.full_name || "—"]));
        setRows((orders || []).map(o => ({
          "Order #": o.external_order_id, "Courier": o.courier, "Status": o.status,
          "Picker": pickerByOrder[o.id] || "—", "Packer": packerByOrder[o.id] || "—",
          "Received At": fmtTime(o.received_at), "Dispatched At": o.dispatched_at ? fmtTime(o.dispatched_at) : "—",
          "Last-Mile Status": o.courier_status || "—", "City": o.delivery_city || "—"
        })));
      } else if (key === "grn_report") {
        const [grns, lines, putawayAllForGrn, profsForGrn] = await Promise.all([
          sb(`/rest/v1/grn?select=*&order=created_at.desc`, { token }),
          sb(`/rest/v1/grn_lines?select=*`, { token }),
          sb(`/rest/v1/putaway_tasks?select=*`, { token }),
          sb(`/rest/v1/profiles?select=*`, { token })
        ]);
        const grnProfMap = Object.fromEntries((profsForGrn || []).map(p => [p.id, p]));
        setRows((grns || []).map(g => {
          const gl = (lines || []).filter(l => l.grn_id === g.id);
          const totalQty = gl.reduce((s, l) => s + l.qty_expected, 0);
          const glIds = new Set(gl.map(l => l.id));
          const pwTasks = (putawayAllForGrn || []).filter(t => glIds.has(t.grn_line_id));
          const officerNames = [...new Set(pwTasks.filter(t => t.assigned_to).map(t => grnProfMap[t.assigned_to]?.full_name || "—"))];
          const allDone = pwTasks.length > 0 && pwTasks.every(t => t.status === "completed");
          let duration = "—";
          if (allDone) {
            const starts = pwTasks.filter(t => t.assigned_at).map(t => new Date(t.assigned_at));
            const ends = pwTasks.filter(t => t.completed_at).map(t => new Date(t.completed_at));
            if (starts.length && ends.length) {
              const hrs = (Math.max(...ends) - Math.min(...starts)) / 3600000;
              duration = `${hrs.toFixed(1)}h`;
            }
          } else if (pwTasks.length > 0) {
            duration = "In Progress";
          }
          return {
            "GRN #": g.grn_number, "PO #": g.po_number || "—", "Source": g.source || "—", "Status": g.status,
            "Lines": gl.length, "Total Qty": totalQty, "Put Away By": officerNames.join(", ") || "—",
            "Put Away Duration": duration, "Created": fmtTime(g.created_at)
          };
        }));
      } else if (key === "user_productivity") {
        const [profs, pickTasksAll, packTasksAll, putawayAll] = await Promise.all([
          sb(`/rest/v1/profiles?select=*`, { token }),
          sb(`/rest/v1/pick_tasks?status=eq.picked&select=*`, { token }),
          sb(`/rest/v1/pack_tasks?status=eq.labeled&select=*`, { token }),
          sb(`/rest/v1/putaway_tasks?status=eq.completed&select=*`, { token })
        ]);
        const profMap = Object.fromEntries((profs || []).map(p => [p.id, p]));
        const pickTaskIds = (pickTasksAll || []).map(t => t.id);
        let pickLines = [];
        if (pickTaskIds.length) {
          const CHUNK = 60;
          const chunks = [];
          for (let i = 0; i < pickTaskIds.length; i += CHUNK) chunks.push(pickTaskIds.slice(i, i + CHUNK));
          const results = await Promise.all(chunks.map(ch => sb(`/rest/v1/pick_task_lines?pick_task_id=in.(${ch.join(",")})&select=*`, { token })));
          pickLines = results.flat().filter(Boolean);
        }
        const agg = {};
        const ensure = (uid) => { if (!agg[uid]) agg[uid] = { pcsPicked: 0, pcsPacked: 0, pcsPutAway: 0, hrs: 0, firstAt: null, lastAt: null }; return agg[uid]; };
        const track = (u, startVal, endVal) => {
          if (startVal && (!u.firstAt || new Date(startVal) < u.firstAt)) u.firstAt = new Date(startVal);
          if (endVal && (!u.lastAt || new Date(endVal) > u.lastAt)) u.lastAt = new Date(endVal);
        };
        for (const t of pickTasksAll || []) {
          if (!t.assigned_to) continue;
          const qty = (pickLines || []).filter(l => l.pick_task_id === t.id).reduce((s, l) => s + (l.qty_picked || 0), 0);
          const hrs = (t.assigned_at && t.completed_at) ? (new Date(t.completed_at) - new Date(t.assigned_at)) / 3600000 : 0;
          const u = ensure(t.assigned_to); u.pcsPicked += qty; u.hrs += hrs;
          track(u, t.assigned_at, t.completed_at);
        }
        for (const t of packTasksAll || []) {
          if (!t.assigned_to) continue;
          let qty = 0;
          try { const scans = JSON.parse(t.scans || "{}"); qty = Object.values(scans).reduce((s, v) => s + v, 0); } catch (e) {}
          const u = ensure(t.assigned_to); u.pcsPacked += qty;
          const hrs = (t.started_at && t.completed_at) ? (new Date(t.completed_at) - new Date(t.started_at)) / 3600000 : 0;
          u.hrs += hrs;
          track(u, t.started_at, t.completed_at);
        }
        for (const t of putawayAll || []) {
          if (!t.assigned_to) continue;
          const u = ensure(t.assigned_to); u.pcsPutAway += (t.qty_completed || 0);
          const hrs = (t.started_at && t.completed_at) ? (new Date(t.completed_at) - new Date(t.started_at)) / 3600000 : 0;
          u.hrs += hrs;
          track(u, t.started_at, t.completed_at);
        }
        setRows(Object.entries(agg).map(([uid, d]) => {
          const total = d.pcsPicked + d.pcsPacked + d.pcsPutAway;
          return {
            "Staff": profMap[uid]?.full_name || "Unknown", "Role": profMap[uid]?.role || "—",
            "First Activity": d.firstAt ? fmtTime(d.firstAt.toISOString()) : "—",
            "Last Activity": d.lastAt ? fmtTime(d.lastAt.toISOString()) : "—",
            "Hours Worked": d.hrs.toFixed(1), "PCS Picked": d.pcsPicked, "PCS Packed": d.pcsPacked,
            "PCS Put Away": d.pcsPutAway, "Total PCS": total, "PCS/Hour": d.hrs > 0.05 ? Math.round(total / d.hrs) : 0
          };
        }).sort((a, b) => b["Total PCS"] - a["Total PCS"]));
      } else if (key === "courier_performance") {
        const dispatchedOrders = await sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&status=in.(dispatched,handed_over)&delivery_city=not.is.null&select=courier,delivery_city,courier_status_code,dispatched_at,courier_delivered_at`, { token });
        const byCity = {};
        for (const o of dispatchedOrders || []) {
          const key2 = `${o.courier || "Unknown"}|${o.delivery_city}`;
          if (!byCity[key2]) byCity[key2] = { courier: o.courier || "Unknown", city: o.delivery_city, total: 0, delivered: 0, returned: 0, deliveryHours: [] };
          const b = byCity[key2];
          b.total += 1;
          if (o.courier_status_code === "0005") {
            b.delivered += 1;
            if (o.dispatched_at && o.courier_delivered_at) b.deliveryHours.push((new Date(o.courier_delivered_at) - new Date(o.dispatched_at)) / 3600000);
          }
          if (["0002", "0006", "0007"].includes(o.courier_status_code)) b.returned += 1;
        }
        setRows(Object.values(byCity).map(b => ({
          "Courier": b.courier, "City": b.city, "Total Dispatched": b.total,
          "Delivered": b.delivered, "Returned": b.returned,
          "Success Rate %": b.total > 0 ? ((b.delivered / b.total) * 100).toFixed(1) : "0",
          "Avg Delivery Time (hrs)": b.deliveryHours.length > 0 ? (b.deliveryHours.reduce((s, h) => s + h, 0) / b.deliveryHours.length).toFixed(1) : "—"
        })).sort((a, b) => b["Total Dispatched"] - a["Total Dispatched"]));
      }
    } catch (e) { showToast("Load failed", "err"); }
    setLoading(false);
  }, [token, profile.warehouse_id]);

  useEffect(() => { loadReport(reportType); }, [reportType, loadReport]);

  const exportCurrent = () => {
    if (rows.length === 0) return;
    const headers = Object.keys(rows[0]);
    exportCSV(`${reportType}.csv`, headers, rows.map(r => headers.map(h => r[h])));
  };

  return (
    <div>
      <SectionTitle title="Reports" />

      {isAdmin && (
        <div style={S.panel}>
          <div style={S.panelTitle}>🔧 M&P Courier Debug (Temporary Tool)</div>
          <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 10 }}>Ek asal M&P consignment number daal k dekhein API se raw response kya aata hai — is se pata chalega tracking/city sync kyun fail ho rahi hai.</div>
          <div style={{ display: "flex", gap: 10 }}>
            <input style={{ ...S.input, minWidth: 200, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="M&P consignment number" value={debugTracking} onChange={e => setDebugTracking(e.target.value)} />
            <button style={S.primaryBtnSm} onClick={runMnpDebug} disabled={debugLoading}>{debugLoading ? "Calling…" : "▶ Run Debug"}</button>
          </div>
          {debugResult && (
            <pre style={{ marginTop: 12, background: "#2B2620", color: "#E8E6E1", padding: 12, borderRadius: 8, fontSize: 11, overflowX: "auto", whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
              {JSON.stringify(debugResult, null, 2)}
            </pre>
          )}
        </div>
      )}

      <div style={S.panel}>
        <div style={S.panelTitle}>Select report</div>
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <select style={{ ...S.input, minWidth: 260 }} value={reportType} onChange={e => setReportType(e.target.value)}>
            {REPORTS.map(r => <option key={r.key} value={r.key}>{r.label}</option>)}
          </select>
          <button style={S.primaryBtnSm} onClick={exportCurrent} disabled={rows.length === 0}>⬇ Export CSV</button>
          {rows.length > 0 && <span style={{ color: "#6B6355", fontSize: 12 }}>{rows.length} rows</span>}
        </div>
      </div>
      <div style={S.panel}>
        {loading ? <EmptyNote text="Loading…" /> : rows.length === 0 ? <EmptyNote text="No data found for this report." /> : (
          <table>
            <thead><tr>{Object.keys(rows[0]).map(h => <th key={h} style={S.th}>{h}</th>)}</tr></thead>
            <tbody>
              {rows.slice(0, 200).map((r, i) => (
                <tr key={i}>{Object.keys(rows[0]).map(h => <td key={h} style={S.td}>{String(r[h])}</td>)}</tr>
              ))}
            </tbody>
          </table>
        )}
        {rows.length > 200 && <div style={{ color: "#8A8272", fontSize: 11, marginTop: 8 }}>Sirf pehli 200 rows dikhai gayi hain — poora data Export CSV mein milega ({rows.length} total).</div>}
      </div>
    </div>
  );
}


/* ================= BULK IMPORT UTILITIES ================= */
async function parseSheet(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array", cellDates: true, raw: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { defval: "", raw: true });
}
function normHeader(h) { return String(h).toLowerCase().replace(/[^a-z0-9]/g, ""); }
// Cleans a code-like value (barcode / SKU / reference / order no). Numbers are
// converted to exact integer strings so large barcodes never turn into
// scientific notation (e.g. 7.35E+12) — a common Excel/SheetJS pitfall.
function cleanCode(v) {
  if (v === null || v === undefined || v === "") return "";
  if (typeof v === "number") return String(Math.trunc(v));
  return String(v).trim().replace(/\.0$/, "");
}
const FIELD_ALIASES = {
  barcode: ["stockmoveproductinternalbarcode", "internalbarcode", "barcode"],
  category: ["productcategory", "category"],
  department: ["department"],
  salesPrice: ["salesprice", "price"],
  sku: ["productsku", "internalreference", "sku"],
  imageUrl: ["imageurl", "image", "imagesrc", "photourl"],
  productName: ["productname", "stockmoveproduct", "product", "description"],
  qty: ["stockmovequantity", "requiredquantity", "qtyordered", "quantity", "qty"],
  reference: ["reference"],
  sourceDocument: ["sourcedocument"],
  contact: ["contact", "supplier", "vendor"],
  customerOrderNumber: ["customerno", "customerorderno", "customerordernumber"],
  orderRef: ["trackingno", "tracking", "orderno", "ordernumber", "orderid", "invoicenumber", "awb", "awbno", "consignmentno", "consignmentnumber", "waybill", "waybillno"],
  courier: ["courier"],
  customer: ["customer", "customername"],
  invoiceDate: ["invoicedate"],
  grossAmount: ["grossamount"],
  unit: ["unit", "uom"],
  reorderLevel: ["reorderlevel", "reorder"]
};
function buildColumnMap(headers) {
  const used = new Set();
  const map = {};
  const fields = Object.keys(FIELD_ALIASES);
  for (const field of fields) {
    const aliases = FIELD_ALIASES[field];
    let found = null;
    for (const h of headers) { if (used.has(h)) continue; if (aliases.includes(normHeader(h))) { found = h; break; } }
    if (!found) for (const h of headers) {
      if (used.has(h)) continue;
      const nh = normHeader(h);
      // Never let a status/date column masquerade as an identifier field via loose substring matching
      // (e.g. "Order Status" or "Order Date" incorrectly matching an orderRef/tracking-number alias).
      if ((nh.includes("status") || (nh.includes("date") && field !== "invoiceDate"))) continue;
      if (aliases.some(a => nh.includes(a))) { found = h; break; }
    }
    if (found) { map[field] = found; used.add(found); }
  }
  return map;
}
function getVal(row, map, field) { return map[field] ? row[map[field]] : undefined; }

/* ---- Scalable product lookups (never load the full 50k+ catalogue) ---- */
// Live search for typeahead pickers — server-side, limited results.
async function searchProducts(token, query, limit = 25) {
  const q = query.trim();
  if (!q) return [];
  const enc = encodeURIComponent(q);
  return (await sb(`/rest/v1/products?or=(barcode.ilike.*${enc}*,name.ilike.*${enc}*)&select=*&limit=${limit}`, { token })) || [];
}
// Exact lookup for a single scanned barcode/SKU.
// Every STR gets a system-generated reference the MOMENT inventory is set aside for it
// (before any human number exists) — so inventory traceability starts immediately. Outbound
// Executive's later "Create STR" step then REPLACES this with the real Odoo-generated STR#
// (the actual company document number), never leaving the record without a reference and
// preserving the full trail either way.
async function nextSysStrRef(token) {
  const rows = await sb(`/rest/v1/stk_str?str_number=like.SYS-STR-*&select=str_number&order=str_number.desc&limit=1`, { token });
  let n = 0;
  if (rows && rows[0]?.str_number) { const m = String(rows[0].str_number).match(/(\d+)$/); if (m) n = parseInt(m[1], 10); }
  return `SYS-STR-${String(n + 1).padStart(6, "0")}`;
}
async function lookupProductByCode(token, code) {
  const c = cleanCode(code);
  if (!c) return null;
  const enc = encodeURIComponent(c);
  const rows = await sb(`/rest/v1/products?or=(barcode.eq.${enc},sku.eq.${enc})&select=*&limit=1`, { token });
  return rows && rows[0] ? rows[0] : null;
}
// Fetch only the specific products referenced by a set of ids (for displaying
// task/line cards) — never the whole catalogue.
async function fetchProductsByIds(token, ids) {
  const unique = [...new Set(ids)].filter(Boolean);
  if (unique.length === 0) return {};
  const map = {};
  const CHUNK = 150;
  for (let i = 0; i < unique.length; i += CHUNK) {
    const chunk = unique.slice(i, i + CHUNK);
    const rows = await sb(`/rest/v1/products?id=in.(${chunk.map(encodeURIComponent).join(",")})&select=*`, { token });
    for (const p of rows || []) map[p.id] = p;
  }
  return map;
}
// Fetch only products matching a set of barcodes (for bulk CSV import matching)
// — only the barcodes present in the uploaded file, not the whole catalogue.
async function fetchProductsByBarcodes(token, codes) {
  const unique = [...new Set(codes.map(cleanCode))].filter(Boolean);
  if (unique.length === 0) return {};
  const byCode = {};
  const CHUNK = 150;
  for (let i = 0; i < unique.length; i += CHUNK) {
    const chunk = unique.slice(i, i + CHUNK);
    const rows = await sb(`/rest/v1/products?or=(barcode.in.(${chunk.map(encodeURIComponent).join(",")}),sku.in.(${chunk.map(encodeURIComponent).join(",")}))&select=*`, { token });
    for (const p of rows || []) {
      if (p.barcode) byCode[cleanCode(p.barcode)] = p;
      if (p.sku) byCode[cleanCode(p.sku)] = p;
    }
  }
  return byCode;
}

// Validates every row of an uploaded file WITHOUT writing anything to the
// database. Returns a report the user must review/confirm before import.
function validateImportRows(rows, map, productLookup, groupField, existingGroupLines) {
  const results = [];
