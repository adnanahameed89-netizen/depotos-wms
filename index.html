<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DepotOS — Receiving & Putaway</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #14161B; font-family: 'Space Grotesk', sans-serif; }
  input, select, button { font-family: inherit; }
  table { width: 100%; border-collapse: collapse; }

  .depotos-menu-btn { display: none; }
  .depotos-overlay { display: none; }

  @media (max-width: 820px) {
    .depotos-sidebar {
      position: fixed !important;
      top: 0; left: 0; height: 100vh;
      z-index: 300;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,0.5);
    }
    .depotos-sidebar.open { transform: translateX(0); }
    .depotos-menu-btn { display: inline-flex !important; }
    .depotos-overlay.open {
      display: block; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 250;
    }
    .depotos-content { padding: 14px 12px 60px !important; }
    .depotos-topbar { padding: 0 12px !important; }
    .depotos-statgrid { grid-template-columns: repeat(2, 1fr) !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

/* ---------- Supabase connection ---------- */
const SUPABASE_URL = "https://bjqpisuhvawzixgrzpqd.supabase.co";
const ANON_KEY = "sb_publishable_rQYyp9JdDBhnSUdTcpKw-g_RJ2O5FQf";

async function sb(path, { method = "GET", token, body, prefer } = {}) {
  const headers = { apikey: ANON_KEY, "Content-Type": "application/json" };
  if (token) headers.Authorization = `Bearer ${token}`;
  if (prefer) headers.Prefer = prefer;
  const res = await fetch(`${SUPABASE_URL}${path}`, {
    method, headers, body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(text || `Request failed (${res.status})`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function login(email, password) {
  return sb(`/auth/v1/token?grant_type=password`, { method: "POST", body: { email, password } });
}

const uid = (p = "") => p + Math.random().toString(36).slice(2, 9);
const STATUS_COLORS = { received: "#8B93A3", queued: "#5B9EE8", picking: "#5B9EE8", picked: "#5B9EE8", packing: "#F5A623", packed: "#F5A623", rtd: "#B084F5", dispatched: "#4CAF7D", open: "#8B93A3", completed: "#4CAF7D", incomplete: "#E5484D" };
const fmtTime = (iso) => iso ? new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";

/* ================= APP ================= */
function App() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loadErr, setLoadErr] = useState("");
  const [view, setView] = useState("dashboard");
  const [toast, setToast] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const changeView = (v) => { setView(v); setSidebarOpen(false); };

  const showToast = (msg, kind = "ok") => {
    setToast({ msg, kind, id: uid() });
    setTimeout(() => setToast(null), 2800);
  };

  const handleLogin = async (email, password) => {
    setLoadErr("");
    try {
      const data = await login(email, password);
      const token = data.access_token;
      const userId = data.user.id;
      const profiles = await sb(`/rest/v1/profiles?id=eq.${userId}&select=*`, { token });
      if (!profiles || profiles.length === 0) {
        setLoadErr("Login ho gaya, lekin profile record nahi mila. Admin se profile setup karwayein.");
        return;
      }
      setSession({ token, userId });
      setProfile(profiles[0]);
    } catch (e) {
      let detail = e.message || "";
      try { const p = JSON.parse(detail); detail = p.error_description || p.msg || p.error || detail; } catch {}
      setLoadErr(`Login fail: ${detail || "email/password check karein."}`);
    }
  };

  if (!session || !profile) return <LoginScreen onLogin={handleLogin} error={loadErr} />;

  return (
    <div style={S.app}>
      <div className={`depotos-overlay${sidebarOpen ? " open" : ""}`} onClick={() => setSidebarOpen(false)} />
      <Sidebar view={view} setView={changeView} profile={profile} sidebarOpen={sidebarOpen}
        onLogout={() => { setSession(null); setProfile(null); }} />
      <div style={S.main}>
        <TopBar profile={profile} onMenuClick={() => setSidebarOpen(true)} />
        <div style={S.content} className="depotos-content">
          {view === "dashboard" && <DashboardView token={session.token} profile={profile} setView={setView} />}
          {view === "products" && <ProductsView token={session.token} profile={profile} showToast={showToast} />}
          {view === "receiving" && <ReceivingView token={session.token} profile={profile} showToast={showToast} />}
          {view === "putaway" && <PutawayView token={session.token} profile={profile} showToast={showToast} />}
          {view === "inventory" && <InventoryView token={session.token} profile={profile} />}
          {view === "orders" && <OrdersView token={session.token} profile={profile} showToast={showToast} />}
          {view === "picking" && <PickingView token={session.token} profile={profile} showToast={showToast} />}
          {view === "packing" && <PackingView token={session.token} profile={profile} showToast={showToast} />}
          {view === "dispatch" && <DispatchView token={session.token} profile={profile} showToast={showToast} />}
          {view === "users" && profile.role === "admin" && <UsersView token={session.token} profile={profile} showToast={showToast} />}
          {view === "returns" && <ReturnsView token={session.token} profile={profile} showToast={showToast} />}
          {view === "reports" && <ReportsView token={session.token} profile={profile} showToast={showToast} />}
          {view === "bins" && profile.role === "admin" && <BinsView token={session.token} profile={profile} showToast={showToast} />}
          {view === "totemaster" && profile.role === "admin" && <ToteMasterView token={session.token} profile={profile} showToast={showToast} />}
        </div>
      </div>
      {toast && <Toast toast={toast} />}
    </div>
  );
}

/* ================= LOGIN ================= */
function LoginScreen({ onLogin, error }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async () => { if (!email || !password) return; setBusy(true); await onLogin(email, password); setBusy(false); };
  return (
    <div style={S.loginWrap}>
      <div style={S.loginCard}>
        <div style={S.hazardBar} />
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <span style={{ fontSize: 22 }}>📦</span>
          <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 22, color: "#ECEAE3" }}>
            DEPOT<span style={{ color: "#F5A623" }}>OS</span>
          </span>
        </div>
        <div style={{ color: "#8B93A3", fontSize: 13, marginBottom: 22 }}>Receiving & Putaway console</div>
        <div style={S.label}>EMAIL</div>
        <input style={S.input} value={email} onChange={e => setEmail(e.target.value)} placeholder="you@company.com" />
        <div style={S.label}>PASSWORD</div>
        <input style={S.input} type="password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()} placeholder="••••••••" />
        <button style={S.primaryBtn} onClick={submit} disabled={busy}>{busy ? "Signing in…" : "Sign in"}</button>
        {error && <div style={{ color: "#E5484D", fontSize: 12, marginTop: 12 }}>{error}</div>}
        <div style={S.disclaimer}>⚠ Live production database — real accounts only.</div>
      </div>
    </div>
  );
}

/* ================= SIDEBAR / TOPBAR ================= */
function Sidebar({ view, setView, profile, onLogout, sidebarOpen }) {
  const items = [
    { id: "dashboard", label: "Dashboard", icon: "🗂" },
    { id: "products", label: "Products", icon: "📦" },
    { id: "receiving", label: "Receiving", icon: "⬇" },
    { id: "putaway", label: "Putaway", icon: "📍" },
    { id: "inventory", label: "Inventory", icon: "🧰" },
    { id: "orders", label: "Sales Orders", icon: "🧾" },
    { id: "picking", label: "Picking", icon: "🛒" },
    { id: "packing", label: "Packing", icon: "🏷" },
    { id: "dispatch", label: "Dispatch", icon: "🚚" }
  ];
  const baseItems = profile.role === "admin" ? [...items, { id: "returns", label: "Returns", icon: "↩" }, { id: "reports", label: "Reports", icon: "📊" }, { id: "bins", label: "Bin Master", icon: "🗺" }, { id: "totemaster", label: "Tote Master", icon: "🧺" }, { id: "users", label: "Users", icon: "👥" }]
    : ["warehouse_lead", "supervisor", "returns_agent"].includes(profile.role) ? [...items, { id: "returns", label: "Returns", icon: "↩" }, { id: "reports", label: "Reports", icon: "📊" }]
    : items;
  const ALL_NAV_IDS = ["dashboard", "products", "receiving", "putaway", "inventory", "orders", "picking", "packing", "dispatch", "returns", "reports", "bins", "totemaster", "users"];
  const ALL_NAV_META = { dashboard: { label: "Dashboard", icon: "🗂" }, products: { label: "Products", icon: "📦" }, receiving: { label: "Receiving", icon: "⬇" }, putaway: { label: "Putaway", icon: "📍" }, inventory: { label: "Inventory", icon: "🧰" }, orders: { label: "Sales Orders", icon: "🧾" }, picking: { label: "Picking", icon: "🛒" }, packing: { label: "Packing", icon: "🏷" }, dispatch: { label: "Dispatch", icon: "🚚" }, returns: { label: "Returns", icon: "↩" }, reports: { label: "Reports", icon: "📊" }, bins: { label: "Bin Master", icon: "🗺" }, totemaster: { label: "Tote Master", icon: "🧺" }, users: { label: "Users", icon: "👥" } };
  let visibleItems = baseItems;
  if (profile.nav_overrides) {
    const baseIds = new Set(baseItems.map(i => i.id));
    for (const id of ALL_NAV_IDS) {
      const override = profile.nav_overrides[id];
      if (override === false) baseIds.delete(id);
      if (override === true) baseIds.add(id);
    }
    visibleItems = ALL_NAV_IDS.filter(id => baseIds.has(id)).map(id => ({ id, ...ALL_NAV_META[id] }));
  }
  return (
    <div style={S.sidebar} className={`depotos-sidebar${sidebarOpen ? " open" : ""}`}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "22px 20px 26px" }}>
        <span style={{ fontSize: 18 }}>📦</span>
        <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, color: "#ECEAE3", fontSize: 16 }}>DEPOT<span style={{ color: "#F5A623" }}>OS</span></span>
      </div>
      <div style={{ flex: 1, overflowY: "auto" }}>
        {visibleItems.map(it => {
          const active = view === it.id;
          return (
            <button key={it.id} onClick={() => setView(it.id)} style={{ ...S.navItem, ...(active ? S.navItemActive : {}) }}>
              <span>{it.icon}</span><span style={{ color: active ? "#ECEAE3" : "#8B93A3" }}>{it.label}</span>
            </button>
          );
        })}
      </div>
      <button onClick={onLogout} style={{ ...S.navItem, borderTop: "1px solid #333A47", marginBottom: 12 }}>
        <span>⏻</span><span style={{ color: "#8B93A3" }}>Sign out</span>
      </button>
    </div>
  );
}
function TopBar({ profile, onMenuClick }) {
  return (
    <div style={S.topbar} className="depotos-topbar">
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <button className="depotos-menu-btn" onClick={onMenuClick} style={{ background: "none", border: "1px solid #333A47", borderRadius: 6, color: "#ECEAE3", width: 32, height: 32, alignItems: "center", justifyContent: "center", cursor: "pointer", fontSize: 16 }}>☰</button>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: "#8B93A3" }}>
          {new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <span style={{ color: "#ECEAE3", fontFamily: "'Space Grotesk', sans-serif", fontSize: 13 }}>{profile.full_name}</span>
        <span style={S.badge}>{profile.role}</span>
      </div>
    </div>
  );
}
function Toast({ toast }) {
  return <div style={{ ...S.toast, borderColor: toast.kind === "err" ? "#E5484D" : "#4CAF7D" }}>✓ {toast.msg}</div>;
}

/* ================= DASHBOARD ================= */
function DashboardView({ token, profile, setView }) {
  const [stats, setStats] = useState({ openGrns: 0, pendingPutaway: 0, products: 0 });
  const [orderStats, setOrderStats] = useState(null);
  useEffect(() => {
    (async () => {
      try {
        const [grns, putaway, products, orders] = await Promise.all([
          sb(`/rest/v1/grn?status=neq.completed&select=id`, { token }),
          sb(`/rest/v1/putaway_tasks?status=eq.pending&select=id`, { token }),
          sb(`/rest/v1/products?select=id`, { token }),
          sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=status`, { token })
        ]);
        setStats({ openGrns: grns?.length || 0, pendingPutaway: putaway?.length || 0, products: products?.length || 0 });
        const STAGES = ["received", "queued", "picking", "packed", "dispatched"];
        const counts = Object.fromEntries(STAGES.map(s => [s, (orders || []).filter(o => o.status === s).length]));
        setOrderStats({ total: (orders || []).length, counts });
      } catch (e) {}
    })();
  }, [token, profile.warehouse_id]);
  const STAGE_META = [
    { key: "received", label: "New", color: "#8B93A3", icon: "🧾" },
    { key: "queued", label: "Queued", color: "#5B9EE8", icon: "🛒" },
    { key: "picking", label: "Picking", color: "#5B9EE8", icon: "🚶" },
    { key: "packed", label: "Packed", color: "#F5A623", icon: "🏷" },
    { key: "rtd", label: "RTD", color: "#B084F5", icon: "📦" },
    { key: "dispatched", label: "Dispatched", color: "#4CAF7D", icon: "🚚" },
    { key: "incomplete", label: "Incomplete", color: "#E5484D", icon: "⚠" }
  ];
  return (
    <div>
      <SectionTitle title={`Welcome, ${profile.full_name}`} />
      <div style={S.statGrid} className="depotos-statgrid">
        <StatCard icon="⬇" label="Open GRNs" value={stats.openGrns} color="#F5A623" onClick={() => setView("receiving")} />
        <StatCard icon="📍" label="Pending putaway" value={stats.pendingPutaway} color="#5B9EE8" onClick={() => setView("putaway")} />
        <StatCard icon="📦" label="Products catalogued" value={stats.products} color="#4CAF7D" onClick={() => setView("products")} />
      </div>
      {orderStats && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Order fulfillment snapshot ({orderStats.total} total)</div>
          <div style={{ display: "grid", gridTemplateColumns: `repeat(${STAGE_META.length}, 1fr)`, gap: 10 }}>
            {STAGE_META.map(s => (
              <div key={s.key} onClick={() => setView("orders")} style={{ ...S.statCard, cursor: "pointer" }}>
                <span style={{ fontSize: 15 }}>{s.icon}</span>
                <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 22, fontWeight: 700, color: s.color, marginTop: 8 }}>{orderStats.counts[s.key] || 0}</div>
                <div style={{ color: "#8B93A3", fontSize: 11, marginTop: 2 }}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>
      )}
      <div style={S.panel}>
        <div style={S.panelTitle}>Standard flow (locked)</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          <FlowStep label="1. Receiving" /> <span style={{color:"#5A6070"}}>→</span>
          <FlowStep label="2. Putaway (bin-wise)" /> <span style={{color:"#5A6070"}}>→</span>
          <FlowStep label="3. Available for orders" />
        </div>
        <div style={{ marginTop: 12, fontSize: 12, color: "#8B93A3" }}>⚡ Exception: urgent stock can skip putaway → direct to packing-ready.</div>
      </div>
    </div>
  );
}
function FlowStep({ label }) { return <div style={{ background: "#14161B", border: "1px solid #333A47", borderRadius: 20, padding: "6px 14px", fontSize: 12, color: "#ECEAE3" }}>{label}</div>; }
function StatCard({ icon, label, value, color, onClick }) {
  return (
    <div style={{ ...S.statCard, cursor: onClick ? "pointer" : "default" }} onClick={onClick}>
      <span style={{ fontSize: 16 }}>{icon}</span>
      <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, color: "#ECEAE3", marginTop: 10 }}>{value}</div>
      <div style={{ color: "#8B93A3", fontSize: 12, marginTop: 2 }}>{label}</div>
    </div>
  );
}

/* ================= PRODUCTS ================= */
function ProductsView({ token, profile, showToast }) {
  const [products, setProducts] = useState([]);
  const [totalCount, setTotalCount] = useState(null);
  const [form, setForm] = useState({ barcode: "", name: "", category: "", department: "Default", sales_price: "" });
  const [loading, setLoading] = useState(false);
  const [importing, setImporting] = useState(false);
  const [importSummary, setImportSummary] = useState(null);
  const [query, setQuery] = useState("");
  const searchTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=id`, { headers: { apikey: ANON_KEY, Authorization: `Bearer ${token}`, Prefer: "count=exact", Range: "0-0" } });
        const range = res.headers.get("content-range"); // e.g. "0-0/54392"
        if (range) setTotalCount(Number(range.split("/")[1]));
      } catch (e) {}
    })();
  }, [token]);

  const runSearch = useCallback((q) => {
    if (searchTimer.current) clearTimeout(searchTimer.current);
    if (!q.trim()) { setProducts([]); return; }
    setLoading(true);
    searchTimer.current = setTimeout(async () => {
      try {
        setProducts(await searchProducts(token, q, 100));
      } catch (e) { showToast("Search failed", "err"); }
      setLoading(false);
    }, 300);
  }, [token]);

  const onQueryChange = (v) => { setQuery(v); runSearch(v); };

  const load = async () => { if (query.trim()) runSearch(query); };

  const add = async () => {
    if (!form.barcode.trim() || !form.name.trim()) { showToast("Barcode aur Product name zaroori hain", "err"); return; }
    try {
      const barcode = cleanCode(form.barcode);
      await sb(`/rest/v1/products`, {
        method: "POST", token, prefer: "return=representation",
        body: { sku: barcode, barcode, name: form.name.trim(), category: form.category.trim() || null, department: form.department.trim() || "Default", sales_price: form.sales_price ? Number(form.sales_price) : null }
      });
      setForm({ barcode: "", name: "", category: "", department: "Default", sales_price: "" });
      showToast("Product added"); load();
    } catch (e) { showToast("Could not add — barcode may already exist", "err"); }
  };

  const handleCatalogueFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImporting(true); setImportSummary(null);
    try {
      const rows = await parseSheet(file);
      if (rows.length === 0) { showToast("File khali hai", "err"); setImporting(false); return; }
      const map = buildColumnMap(Object.keys(rows[0]));
      if (!map.barcode) { showToast("Barcode column nahi mila file mein", "err"); setImporting(false); return; }
      const items = [];
      let skipped = 0;
      for (const row of rows) {
        const barcode = cleanCode(getVal(row, map, "barcode"));
        const name = String(getVal(row, map, "productName") || "").trim();
        if (!barcode) { skipped++; continue; }
        items.push({
          sku: barcode, barcode, name: name || barcode,
          category: String(getVal(row, map, "category") || "").trim() || null,
          department: String(getVal(row, map, "department") || "Default").trim(),
          sales_price: (() => { const v = Number(getVal(row, map, "salesPrice")); return isNaN(v) ? null : v; })()
        });
      }
      const CHUNK = 200;
      let inserted = 0;
      for (let i = 0; i < items.length; i += CHUNK) {
        const chunk = items.slice(i, i + CHUNK);
        await sb(`/rest/v1/products?on_conflict=sku`, { method: "POST", token, prefer: "resolution=merge-duplicates,return=minimal", body: chunk });
        inserted += chunk.length;
      }
      setImportSummary(`${inserted} products imported/updated. ${skipped} rows skipped (no barcode).`);
      showToast(`${inserted} products imported`);
      load();
    } catch (e) { showToast(`Import failed: ${(e.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  return (
    <div>
      <SectionTitle title="Product Master" action={
        <label style={{ ...S.primaryBtnSm, cursor: "pointer" }}>
          {importing ? "Importing…" : "📤 Upload catalogue (CSV/Excel)"}
          <input type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={handleCatalogueFile} disabled={importing} />
        </label>
      } />
      {importSummary && (
        <div style={{ ...S.panel, borderColor: "#4CAF7D", color: "#4CAF7D", fontSize: 12 }}>{importSummary}</div>
      )}
      <div style={{ marginBottom: 10, fontSize: 11, color: "#5A6070" }}>
        CSV columns expected: <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#8B93A3" }}>department, product_category, barcode, product_name, sales_price</span>
        {totalCount !== null && <span> · Catalogue mein {totalCount.toLocaleString()} products hain</span>}
      </div>
      <div style={S.panel}>
        <div style={S.panelTitle}>Add product</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <input style={{ ...S.input, flex: 1, minWidth: 140, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Barcode" value={form.barcode} onChange={e => setForm({ ...form, barcode: e.target.value })} />
          <CameraScanButton onScan={(text) => setForm(f => ({ ...f, barcode: text }))} label="Scan" />
          <input style={{ ...S.input, flex: 2, minWidth: 160 }} placeholder="Product name" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
          <input style={{ ...S.input, flex: 1, minWidth: 130 }} placeholder="Product category" value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} />
          <input style={{ ...S.input, flex: 1, minWidth: 110 }} placeholder="Department" value={form.department} onChange={e => setForm({ ...form, department: e.target.value })} />
          <input style={{ ...S.input, width: 110 }} type="number" placeholder="Sales price" value={form.sales_price} onChange={e => setForm({ ...form, sales_price: e.target.value })} />
          <button style={S.primaryBtnSm} onClick={add}>+ Add</button>
        </div>
      </div>

      <div style={{ position: "relative", margin: "0 0 12px" }}>
        <input style={{ ...S.input, paddingLeft: 34 }} placeholder="🔍 Search by barcode or product name…" value={query} onChange={e => onQueryChange(e.target.value)} />
      </div>

      <div style={S.panel}>
        {!query.trim() ? (
          <EmptyNote text="Search karein — catalogue bohot bada hai isliye poori list yahan load nahi hoti." />
        ) : (
          <table>
            <thead>
              <tr>
                <th style={S.th}>Barcode</th><th style={S.th}>Product Name</th><th style={S.th}>Department</th>
                <th style={S.th}>Category</th><th style={S.th}>Sales Price</th>
              </tr>
            </thead>
            <tbody>
              {products.map(p => (
                <tr key={p.id}>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p.barcode || "—"}</td>
                  <td style={S.td}>{p.name}</td>
                  <td style={{ ...S.td, color: "#8B93A3" }}>{p.department || "Default"}</td>
                  <td style={{ ...S.td, color: "#8B93A3" }}>{p.category || "—"}</td>
                  <td style={{ ...S.td, color: "#8B93A3" }}>{p.sales_price != null ? p.sales_price : "—"}</td>
                </tr>
              ))}
              {!loading && products.length === 0 && <tr><td colSpan={5}><EmptyNote text="No products found." /></td></tr>}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ================= RECEIVING ================= */
function ReceivingView({ token, profile, showToast }) {
  const [grns, setGrns] = useState([]);
  const [productCache, setProductCache] = useState({});
  const [openGrn, setOpenGrn] = useState(null);
  const [lines, setLines] = useState([]);
  const [source, setSource] = useState("");
  const [grnNumber, setGrnNumber] = useState("");
  const [lineQty, setLineQty] = useState(1);
  const [pendingProduct, setPendingProduct] = useState(null);
  const [importing, setImporting] = useState(false);
  const [importSummary, setImportSummary] = useState(null);
  const [grnReport, setGrnReport] = useState(null);
  const [grnLineStats, setGrnLineStats] = useState({});
  const [grnStatus, setGrnStatus] = useState({}); // grn_id -> {status, totalQty, putawayQty}
  const [statusTab, setStatusTab] = useState("all");
  const [selectedGrns, setSelectedGrns] = useState({});
  const [staff, setStaff] = useState([]);
  const [bulkOfficerId, setBulkOfficerId] = useState("");
  const [bulkBusy, setBulkBusy] = useState(false);
  const canManageGrn = ["admin", "warehouse_lead"].includes(profile.role);

  const load = useCallback(async () => {
    try {
      const g = await sb(`/rest/v1/grn?select=*&order=created_at.desc`, { token });
      setGrns(g || []);
      setStaff(await sb(`/rest/v1/profiles?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }) || []);
      const ids = (g || []).map(x => x.id);
      if (ids.length) {
        const allLines = await sb(`/rest/v1/grn_lines?grn_id=in.(${ids.join(",")})&select=id,grn_id,qty_expected`, { token });
        const stats = {};
        const lineToGrn = {};
        for (const l of allLines || []) {
          if (!stats[l.grn_id]) stats[l.grn_id] = { count: 0, qty: 0 };
          stats[l.grn_id].count += 1; stats[l.grn_id].qty += l.qty_expected;
          lineToGrn[l.id] = l.grn_id;
        }
        setGrnLineStats(stats);

        const lineIds = (allLines || []).map(l => l.id);
        const statusMap = {};
        for (const id of ids) statusMap[id] = { status: "open", totalQty: stats[id]?.qty || 0, putawayQty: 0, anyAssigned: false };
        if (lineIds.length) {
          const pw = await sb(`/rest/v1/putaway_tasks?grn_line_id=in.(${lineIds.join(",")})&select=*`, { token });
          for (const t of pw || []) {
            const grnId = lineToGrn[t.grn_line_id];
            if (!grnId || !statusMap[grnId]) continue;
            if (t.status === "completed") statusMap[grnId].putawayQty += t.qty;
            if (t.assigned_to) statusMap[grnId].anyAssigned = true;
          }
        }
        for (const id of ids) {
          const s = statusMap[id];
          if (s.totalQty === 0) s.status = "open";
          else if (s.putawayQty >= s.totalQty && s.totalQty > 0) s.status = "completed";
          else if (s.putawayQty > 0) s.status = "partial";
          else if (s.anyAssigned) s.status = "assigned";
          else s.status = "open";
        }
        setGrnStatus(statusMap);

        // auto-complete GRN status in DB when fully put away
        for (const id of ids) {
          const s = statusMap[id];
          const grnRow = (g || []).find(x => x.id === id);
          if (s.status === "completed" && grnRow && grnRow.status !== "completed") {
            sb(`/rest/v1/grn?id=eq.${id}`, { method: "PATCH", token, body: { status: "completed", completed_at: new Date().toISOString() } }).catch(() => {});
          }
        }
      }
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const bulkAssignPutaway = async () => {
    const ids = Object.keys(selectedGrns).filter(k => selectedGrns[k]);
    if (ids.length === 0) { showToast("GRN select karein", "err"); return; }
    if (!bulkOfficerId) { showToast("Put Away Officer select karein", "err"); return; }
    setBulkBusy(true);
    try {
      let tasksCreated = 0;
      for (const grnId of ids) {
        const grnLines = await sb(`/rest/v1/grn_lines?grn_id=eq.${grnId}&select=*`, { token });
        for (const l of grnLines || []) {
          const remaining = l.qty_expected - (l.qty_received || 0);
          if (remaining <= 0) continue;
          await sb(`/rest/v1/grn_lines?id=eq.${l.id}`, { method: "PATCH", token, body: { qty_received: l.qty_expected } });
          await sb(`/rest/v1/putaway_tasks`, { method: "POST", token, body: { grn_line_id: l.id, product_id: l.product_id, qty: remaining, status: "pending", assigned_to: bulkOfficerId } });
          tasksCreated++;
        }
        await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "grn", entity_id: grnId, user_id: profile.id, action: "bulk_assigned_putaway", metadata: { assigned_to: bulkOfficerId } } });
      }
      showToast(`${ids.length} GRN(s) assigned — ${tasksCreated} lines queued`);
      setSelectedGrns({}); setBulkOfficerId("");
      load();
    } catch (e) { showToast(`Assign failed: ${(e.message || "").slice(0, 100)}`, "err"); }
    setBulkBusy(false);
  };
  const loadLines = async (grnId) => {
    const ls = await sb(`/rest/v1/grn_lines?grn_id=eq.${grnId}&select=*`, { token }) || [];
    setLines(ls);
    const cache = await fetchProductsByIds(token, ls.map(l => l.product_id));
    setProductCache(prev => ({ ...prev, ...cache }));
  };

  const handleGrnFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImporting(true); setImportSummary(null); setGrnReport(null);
    try {
      const rows = await parseSheet(file);
      if (rows.length === 0) { showToast("File khali hai", "err"); setImporting(false); return; }
      const map = buildColumnMap(Object.keys(rows[0]));
      if (!map.barcode || !map.reference) { showToast("Barcode ya Reference column nahi mila", "err"); setImporting(false); return; }

      const fileBarcodes = rows.map(r => getVal(r, map, "barcode"));
      const productMap = await fetchProductsByBarcodes(token, fileBarcodes);

      // check for lines already imported against the same GRN reference (avoid duplicate processing)
      const fileRefs = [...new Set(rows.map(r => cleanCode(getVal(r, map, "reference"))).filter(Boolean))];
      const existingGrns = fileRefs.length ? await sb(`/rest/v1/grn?grn_number=in.(${fileRefs.map(encodeURIComponent).join(",")})&select=id,grn_number`, { token }) : [];
      const existingGroupLines = {};
      if (existingGrns && existingGrns.length) {
        const grnIds = existingGrns.map(g => g.id);
        const existLines = await sb(`/rest/v1/grn_lines?grn_id=in.(${grnIds.join(",")})&select=grn_id,product_id`, { token });
        const idToRef = Object.fromEntries(existingGrns.map(g => [g.id, g.grn_number]));
        const prodBarcode = {}; // product_id -> barcode, from productMap values
        for (const p of Object.values(productMap)) prodBarcode[p.id] = cleanCode(p.barcode || p.sku);
        for (const l of existLines || []) {
          const ref = idToRef[l.grn_id];
          const bc = prodBarcode[l.product_id];
          if (ref && bc) existingGroupLines[`${ref}|${bc}`] = true;
        }
      }

      const report = validateImportRows(rows, map, productMap, "reference", existingGroupLines);
      setGrnReport({ report, map });
      showToast(`Validated: ${report.validRows.length} valid, ${report.invalidRows.length} invalid`);
    } catch (err) { showToast(`Validation failed: ${(err.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  const confirmGrnImport = async () => {
    if (!grnReport) return;
    setImporting(true);
    try {
      const groups = {};
      for (const r of grnReport.report.validRows) {
        if (!groups[r.groupVal]) groups[r.groupVal] = [];
        groups[r.groupVal].push(r);
      }
      const existingGrns = await sb(`/rest/v1/grn?select=id,grn_number`, { token });
      const grnMap = Object.fromEntries((existingGrns || []).map(g => [g.grn_number, g.id]));

      let grnsCreated = 0, linesAdded = 0;
      for (const [ref, groupRows] of Object.entries(groups)) {
        let grnId = grnMap[ref];
        if (!grnId) {
          const created = await sb(`/rest/v1/grn`, {
            method: "POST", token, prefer: "return=representation",
            body: { grn_number: ref, warehouse_id: profile.warehouse_id, source: "", status: "open" }
          });
          grnId = created[0].id;
          grnMap[ref] = grnId;
          grnsCreated++;
        }
        for (const r of groupRows) {
          await sb(`/rest/v1/grn_lines`, { method: "POST", token, body: { grn_id: grnId, product_id: r.product.id, qty_expected: r.qty } });
          linesAdded++;
        }
      }
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "grn", entity_id: profile.id, user_id: profile.id, action: `bulk_import_${grnsCreated}_grns` } });
      setImportSummary(`${grnsCreated} GRN(s) created, ${linesAdded} lines added.`);
      showToast(`Import done — ${grnsCreated} GRNs, ${linesAdded} lines`);
      setGrnReport(null);
      load();
    } catch (err) { showToast(`Import failed: ${(err.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  const createGrn = async () => {
    if (!grnNumber.trim()) return;
    try {
      const created = await sb(`/rest/v1/grn`, { method: "POST", token, prefer: "return=representation", body: { grn_number: grnNumber.trim(), warehouse_id: profile.warehouse_id, source: source.trim(), status: "open" } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "grn", entity_id: created[0].id, user_id: profile.id, action: "created" } });
      setGrnNumber(""); setSource(""); showToast("GRN created"); load();
      setOpenGrn(created[0]); loadLines(created[0].id);
    } catch (e) { showToast("GRN number may already exist", "err"); }
  };
  const addLine = async (product) => {
    if (!product || lineQty <= 0 || !openGrn) return;
    await sb(`/rest/v1/grn_lines`, { method: "POST", token, body: { grn_id: openGrn.id, product_id: product.id, qty_expected: Number(lineQty) } });
    setProductCache(prev => ({ ...prev, [product.id]: product }));
    setLineQty(1); loadLines(openGrn.id);
  };
  const receiveLine = async (line, mode) => {
    const qty = line.qty_expected - (line.qty_received || 0);
    if (qty <= 0) return;
    await sb(`/rest/v1/grn_lines?id=eq.${line.id}`, { method: "PATCH", token, body: { qty_received: line.qty_expected } });
    if (mode === "putaway") {
      await sb(`/rest/v1/putaway_tasks`, { method: "POST", token, body: { grn_line_id: line.id, product_id: line.product_id, qty, status: "pending" } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "grn_line", entity_id: line.id, user_id: profile.id, action: "received_to_putaway_queue", metadata: { qty } } });
      showToast("Received — sent to putaway queue");
    } else {
      await addOnHand(token, profile.warehouse_id, line.product_id, null, qty);
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "grn_line", entity_id: line.id, user_id: profile.id, action: "direct_to_packing", metadata: { qty } } });
      showToast("Received — sent direct to packing (urgent)");
    }
    loadLines(openGrn.id);
  };
  const completeGrn = async () => {
    await sb(`/rest/v1/grn?id=eq.${openGrn.id}`, { method: "PATCH", token, body: { status: "completed", completed_at: new Date().toISOString() } });
    showToast("GRN marked completed"); setOpenGrn(null); load();
  };
  if (openGrn) {
    const allReceived = lines.length > 0 && lines.every(l => l.qty_received >= l.qty_expected);
    return (
      <div>
        <SectionTitle title={`GRN ${openGrn.grn_number}`} action={<button style={S.secondaryBtnSm} onClick={() => setOpenGrn(null)}>← Back to GRN list</button>} />
        <div style={S.panel}>
          <div style={S.panelTitle}>Add line item</div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
            <ProductPicker token={token} onSelect={(p) => setPendingProduct(p)} />
            {pendingProduct && (
              <span style={{ ...S.badgeSm, color: "#F5A623", borderColor: "#F5A623" }}>{pendingProduct.barcode} — {pendingProduct.name} <span style={{ cursor: "pointer", marginLeft: 6 }} onClick={() => setPendingProduct(null)}>✕</span></span>
            )}
            <input style={{ ...S.input, width: 90 }} type="number" min={1} value={lineQty} onChange={e => setLineQty(e.target.value)} />
            <button style={S.primaryBtnSm} onClick={() => { addLine(pendingProduct); setPendingProduct(null); }}>+ Add line</button>
          </div>
        </div>
        <div style={S.panel}>
          <div style={S.panelTitle}>Lines</div>
          <table>
            <thead><tr><th style={S.th}>SKU</th><th style={S.th}>Expected</th><th style={S.th}>Received</th><th style={S.th}></th></tr></thead>
            <tbody>
              {lines.map(l => {
                const p = productCache[l.product_id];
                const done = l.qty_received >= l.qty_expected;
                return (
                  <tr key={l.id}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                    <td style={S.td}>{l.qty_expected}</td>
                    <td style={S.td}>{l.qty_received || 0}</td>
                    <td style={S.td}>
                      {!done ? (
                        <div style={{ display: "flex", gap: 6 }}>
                          <button style={S.secondaryBtnSm} onClick={() => receiveLine(l, "putaway")}>📍 Receive → Putaway</button>
                          <button style={{ ...S.secondaryBtnSm, borderColor: "#F5A623", color: "#F5A623" }} onClick={() => receiveLine(l, "direct")}>⚡ Direct (urgent)</button>
                        </div>
                      ) : <span style={{ ...S.badgeSm, color: "#4CAF7D", borderColor: "#4CAF7D" }}>Received</span>}
                    </td>
                  </tr>
                );
              })}
              {lines.length === 0 && <tr><td colSpan={4}><EmptyNote text="No lines yet — add one above." /></td></tr>}
            </tbody>
          </table>
          {allReceived && <button style={{ ...S.primaryBtnSm, marginTop: 14 }} onClick={completeGrn}>✓ Mark GRN completed</button>}
        </div>
      </div>
    );
  }
  return (
    <div>
      <SectionTitle title="Receiving (GRN)" action={
        canManageGrn ? (
          <label style={{ ...S.primaryBtnSm, cursor: "pointer" }}>
            {importing ? "Importing…" : "📤 Upload GRN file"}
            <input type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={handleGrnFile} disabled={importing} />
          </label>
        ) : null
      } />
      {!canManageGrn && (
        <div style={{ ...S.panel, fontSize: 12, color: "#8B93A3" }}>ℹ️ GRN upload/assignment sirf Admin ya Warehouse Lead kar sakte hain.</div>
      )}
      {importSummary && (
        <div style={{ ...S.panel, borderColor: "#4CAF7D", color: "#4CAF7D", fontSize: 12 }}>{importSummary}</div>
      )}
      {grnReport && (
        <ImportReportPanel report={grnReport.report} importing={importing}
          onConfirm={confirmGrnImport} onCancel={() => setGrnReport(null)} confirmLabel="Confirm & import GRNs" />
      )}
      {!grnReport && canManageGrn && (
      <div style={S.panel}>
        <div style={S.panelTitle}>New GRN (manual)</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <input style={{ ...S.input, flex: 1, minWidth: 140, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="GRN number" value={grnNumber} onChange={e => setGrnNumber(e.target.value)} />
          <input style={{ ...S.input, flex: 1, minWidth: 140 }} placeholder="Source (supplier etc.)" value={source} onChange={e => setSource(e.target.value)} />
          <button style={S.primaryBtnSm} onClick={createGrn}>+ Create GRN</button>
        </div>
      </div>
      )}

      {(() => {
        const TABS = [
          { key: "all", label: "All" },
          { key: "open", label: "Open" },
          { key: "assigned", label: "Assigned" },
          { key: "partial", label: "Partial" },
          { key: "completed", label: "Completed" }
        ];
        const counts = Object.fromEntries(TABS.map(t => [t.key, t.key === "all" ? grns.length : grns.filter(g => (grnStatus[g.id]?.status || "open") === t.key).length]));
        return (
          <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
            {TABS.map(t => (
              <button key={t.key} onClick={() => setStatusTab(t.key)} style={{ ...S.pill, ...(statusTab === t.key ? { background: "#F5A623", color: "#14161B", borderColor: "#F5A623" } : {}) }}>
                {t.label} ({counts[t.key]})
              </button>
            ))}
          </div>
        );
      })()}

      {canManageGrn && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Selected GRNs ({Object.values(selectedGrns).filter(Boolean).length}) — assign Put Away Officer</div>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <select style={{ ...S.input, minWidth: 200 }} value={bulkOfficerId} onChange={e => setBulkOfficerId(e.target.value)}>
              <option value="">Put Away Officer select karein…</option>
              {staff.filter(s => s.id !== profile.id).map(s => <option key={s.id} value={s.id}>{s.full_name} ({s.role})</option>)}
            </select>
            <button style={S.primaryBtnSm} onClick={bulkAssignPutaway} disabled={bulkBusy}>{bulkBusy ? "Assigning…" : "✓ Assign selected"}</button>
          </div>
        </div>
      )}

      <div style={S.panel}>
        <table>
          <thead>
            <tr>
              {canManageGrn && <th style={S.th}></th>}
              <th style={S.th}>GRN #</th><th style={S.th}>Source</th><th style={S.th}>Status</th><th style={S.th}>Lines</th>
              <th style={S.th}>Put Away Qty</th><th style={S.th}>Total Qty</th><th style={S.th}>Created</th>
            </tr>
          </thead>
          <tbody>
            {grns.filter(g => statusTab === "all" || (grnStatus[g.id]?.status || "open") === statusTab).map(g => {
              const stat = grnLineStats[g.id] || { count: 0, qty: 0 };
              const st = grnStatus[g.id] || { status: "open", putawayQty: 0, totalQty: stat.qty };
              const STATUS_LABELS = { open: "Open", assigned: "Assigned", partial: "Partial", completed: "Completed" };
              const STATUS_COL = { open: "#8B93A3", assigned: "#5B9EE8", partial: "#F5A623", completed: "#4CAF7D" };
              return (
                <tr key={g.id}>
                  {canManageGrn && (
                    <td style={S.td} onClick={e => e.stopPropagation()}>
                      <input type="checkbox" checked={!!selectedGrns[g.id]} onChange={e => setSelectedGrns({ ...selectedGrns, [g.id]: e.target.checked })} />
                    </td>
                  )}
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", cursor: "pointer" }} onClick={() => { setOpenGrn(g); loadLines(g.id); }}>{g.grn_number}</td>
                  <td style={{ ...S.td, color: "#8B93A3" }}>{g.source || "No source"}</td>
                  <td style={S.td}><span style={{ ...S.badgeSm, color: STATUS_COL[st.status], borderColor: STATUS_COL[st.status] }}>{STATUS_LABELS[st.status]}</span></td>
                  <td style={{ ...S.td, color: "#8B93A3" }}>{stat.count}</td>
                  <td style={{ ...S.td, color: st.status === "completed" ? "#4CAF7D" : "#F5A623" }}>{st.putawayQty} / {st.totalQty}</td>
                  <td style={{ ...S.td, color: "#8B93A3" }}>{stat.qty}</td>
                  <td style={{ ...S.td, color: "#8B93A3", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{fmtTime(g.created_at)}</td>
                </tr>
              );
            })}
            {grns.filter(g => statusTab === "all" || (grnStatus[g.id]?.status || "open") === statusTab).length === 0 && (
              <tr><td colSpan={canManageGrn ? 8 : 7}><EmptyNote text="Is status mein koi GRN nahi hai." /></td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ================= PUTAWAY ================= */
function PutawayView({ token, profile, showToast }) {
  const [unassignedTasks, setUnassignedTasks] = useState([]);
  const [myAllTasks, setMyAllTasks] = useState([]);
  const [products, setProducts] = useState({});
  const [bins, setBins] = useState([]);
  const [staff, setStaff] = useState([]);
  const [grnLines, setGrnLines] = useState({});
  const [grns, setGrns] = useState({});
  const [binChoice, setBinChoice] = useState({});
  const canAssign = ["admin", "warehouse_lead", "supervisor"].includes(profile.role);

  const load = useCallback(async () => {
    try {
      const [u, mine, b, s] = await Promise.all([
        sb(`/rest/v1/putaway_tasks?status=eq.pending&assigned_to=is.null&select=*&order=id.asc`, { token }),
        sb(`/rest/v1/putaway_tasks?assigned_to=eq.${profile.id}&select=*&order=id.asc`, { token }),
        sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/profiles?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token })
      ]);
      setUnassignedTasks(u || []); setMyAllTasks(mine || []); setBins(b || []); setStaff(s || []);
      const allTasks = [...(u || []), ...(mine || [])];
      setProducts(await fetchProductsByIds(token, allTasks.map(x => x.product_id)));
      const glIds = [...new Set(allTasks.map(x => x.grn_line_id).filter(Boolean))];
      if (glIds.length) {
        const gls = await sb(`/rest/v1/grn_lines?id=in.(${glIds.join(",")})&select=*`, { token });
        setGrnLines(Object.fromEntries((gls || []).map(x => [x.id, x])));
        const grnIds = [...new Set((gls || []).map(x => x.grn_id))];
        if (grnIds.length) {
          const gs = await sb(`/rest/v1/grn?id=in.(${grnIds.join(",")})&select=*`, { token });
          setGrns(Object.fromEntries((gs || []).map(x => [x.id, x])));
        }
      }
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id, profile.id]);
  useEffect(() => { load(); }, [load]);

  const grnNumberFor = (task) => {
    const gl = grnLines[task.grn_line_id];
    if (!gl) return "—";
    const g = grns[gl.grn_id];
    return g?.grn_number || "—";
  };

  const assignTask = async (task, userId) => {
    await sb(`/rest/v1/putaway_tasks?id=eq.${task.id}`, { method: "PATCH", token, body: { assigned_to: userId } });
    await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "putaway_task", entity_id: task.id, user_id: profile.id, action: "assigned", metadata: { assigned_to: userId } } });
    showToast("Assigned"); load();
  };

  /* ---- scan-driven flow ---- */
  const [scanBarcodeInput, setScanBarcodeInput] = useState("");
  const [scanLocationInput, setScanLocationInput] = useState("");
  const [scanQty, setScanQty] = useState("");
  const [matchedTaskId, setMatchedTaskId] = useState(null);
  const [matchedBinId, setMatchedBinId] = useState("");
  const [shortageOpen, setShortageOpen] = useState(false);
  const [shortageQty, setShortageQty] = useState("");

  const pendingMine = myAllTasks.filter(t => t.qty - (t.qty_completed || 0) > 0);
  const matchedTask = pendingMine.find(t => t.id === matchedTaskId);
  const matchedProduct = matchedTask ? products[matchedTask.product_id] : null;
  const matchedRemaining = matchedTask ? matchedTask.qty - (matchedTask.qty_completed || 0) : 0;

  const scanProduct = (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : scanBarcodeInput).trim();
    setScanBarcodeInput("");
    if (!code) return;
    const c = cleanCode(code);
    const product = Object.values(products).find(p => cleanCode(p.barcode) === c || cleanCode(p.sku) === c);
    if (!product) { showToast("Barcode/SKU match nahi hua", "err"); return; }
    const candidates = pendingMine.filter(t => t.product_id === product.id).sort((a, b) => a.id.localeCompare(b.id));
    if (candidates.length === 0) { showToast("Yeh product aapke pending jobs mein nahi hai — WRONG ITEM ya already complete", "err"); return; }
    setMatchedTaskId(candidates[0].id);
    setMatchedBinId("");
    setScanQty(String(candidates[0].qty - (candidates[0].qty_completed || 0)));
    setShortageOpen(false);
    showToast(`✓ Matched: ${product.barcode} — GRN ${grnNumberFor(candidates[0])}`);
  };

  const scanLocation = (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : scanLocationInput).trim();
    setScanLocationInput("");
    if (!code) return;
    const bin = bins.find(b => b.code.toLowerCase() === code.trim().toLowerCase());
    if (!bin) { showToast("Location nahi mili — Bin Master check karein", "err"); return; }
    setMatchedBinId(bin.id);
    showToast(`📍 Location set: ${bin.code}`);
  };

  const confirmPutaway = async () => {
    if (!matchedTask) { showToast("Pehle product scan karein", "err"); return; }
    if (!matchedBinId) { showToast("Location scan/select karein", "err"); return; }
    const qty = Number(scanQty);
    if (!qty || qty <= 0) { showToast("Valid qty enter karein", "err"); return; }
    if (qty > matchedRemaining) { showToast(`EXCESS QTY NOT ALLOWED — max ${matchedRemaining}`, "err"); return; }
    try {
      await addOnHand(token, profile.warehouse_id, matchedTask.product_id, matchedBinId, qty);
      const newCompleted = (matchedTask.qty_completed || 0) + qty;
      const done = newCompleted >= matchedTask.qty;
      await sb(`/rest/v1/putaway_tasks?id=eq.${matchedTask.id}`, {
        method: "PATCH", token,
        body: done
          ? { qty_completed: newCompleted, status: "completed", bin_id: matchedBinId, completed_at: new Date().toISOString() }
          : { qty_completed: newCompleted, bin_id: matchedBinId }
      });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "putaway_task", entity_id: matchedTask.id, user_id: profile.id, action: done ? "completed" : "partial_putaway", metadata: { bin_id: matchedBinId, qty } } });
      showToast(done ? "✓ Putaway complete" : `✓ ${qty} pcs put away — ${matchedTask.qty - newCompleted} remaining`);
      setMatchedTaskId(null); setMatchedBinId(""); setScanQty("");
      load();
    } catch (e) { showToast("Putaway failed", "err"); }
  };

  const reportShortage = async () => {
    const qty = Number(shortageQty);
    if (!matchedTask) return;
    if (!qty || qty <= 0 || qty > matchedRemaining) { showToast(`Valid short qty (1 se ${matchedRemaining} tak) enter karein`, "err"); return; }
    try {
      await sb(`/rest/v1/rtv_returns`, { method: "POST", token, body: { grn_line_id: matchedTask.grn_line_id, product_id: matchedTask.product_id, expected_qty: matchedTask.qty, short_qty: qty, reason: "Physically not received", created_by: profile.id } });
      const newRequired = matchedTask.qty - qty;
      const done = (matchedTask.qty_completed || 0) >= newRequired;
      await sb(`/rest/v1/putaway_tasks?id=eq.${matchedTask.id}`, {
        method: "PATCH", token,
        body: done ? { qty: newRequired, status: "completed", completed_at: new Date().toISOString() } : { qty: newRequired }
      });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "putaway_task", entity_id: matchedTask.id, user_id: profile.id, action: "rtv_reported", metadata: { short_qty: qty } } });
      showToast(`${qty} pcs RTV record ho gaya`);
      setMatchedTaskId(null); setShortageOpen(false); setShortageQty("");
      load();
    } catch (e) { showToast("RTV report failed", "err"); }
  };

  const UnassignedCard = ({ t }) => {
    const p = products[t.product_id];
    return (
      <div style={S.card}>
        <div style={{ display: "flex", justifyContent: "space-between" }}>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#8B93A3" }}>{grnNumberFor(t)}</span>
          <span style={{ ...S.badgeSm, color: "#8B93A3", borderColor: "#333A47" }}>Pending</span>
        </div>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 14, marginTop: 10 }}>{p?.barcode || "—"}</div>
        <div style={{ color: "#ECEAE3", fontSize: 13 }}>{p?.name}</div>
        <div style={{ color: "#8B93A3", fontSize: 12, marginTop: 4 }}>Qty: {t.qty}</div>
        <select style={{ ...S.input, marginTop: 10, fontSize: 12 }} onChange={e => e.target.value && assignTask(t, e.target.value)} defaultValue="">
          <option value="">Assign to staff…</option>
          {staff.map(s => <option key={s.id} value={s.id}>{s.full_name} ({s.role})</option>)}
        </select>
      </div>
    );
  };

  return (
    <div>
      <SectionTitle title="Put Away — scan-driven" />
      <div style={S.panel}>
        <div style={S.panelTitle}>1. Scan product (koi bhi sequence mein)</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type barcode / SKU, then Enter"
            value={scanBarcodeInput} onChange={e => setScanBarcodeInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && scanProduct()} />
          <CameraScanButton onScan={(text) => scanProduct(text)} />
          <button style={S.primaryBtnSm} onClick={() => scanProduct()}>Scan</button>
        </div>
      </div>

      {matchedTask && matchedProduct && (
        <div style={{ ...S.panel, borderColor: "#F5A623" }}>
          <div style={S.panelTitle}>Matched item</div>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 16 }}>{matchedProduct.barcode}</div>
          <div style={{ color: "#ECEAE3", fontSize: 14 }}>{matchedProduct.name}</div>
          <div style={{ color: "#8B93A3", fontSize: 12, marginTop: 4 }}>
            GRN: {grnNumberFor(matchedTask)} · Required: {matchedTask.qty} · Put away so far: {matchedTask.qty_completed || 0} · Remaining: {matchedRemaining}
          </div>

          <div style={S.label}>2. SCAN LOCATION</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <input style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace", minWidth: 160 }} placeholder="Scan or type bin code"
              value={scanLocationInput} onChange={e => setScanLocationInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && scanLocation()} />
            <CameraScanButton onScan={(text) => scanLocation(text)} />
            <select style={{ ...S.input, minWidth: 140 }} value={matchedBinId} onChange={e => setMatchedBinId(e.target.value)}>
              <option value="">or select…</option>
              {bins.map(b => <option key={b.id} value={b.id}>{b.code}</option>)}
            </select>
          </div>
          {matchedBinId && <div style={{ color: "#4CAF7D", fontSize: 12, marginTop: 6 }}>📍 {bins.find(b => b.id === matchedBinId)?.code}</div>}

          <div style={S.label}>3. QUANTITY</div>
          <input type="number" min={1} max={matchedRemaining} style={{ ...S.input, maxWidth: 140 }} value={scanQty} onChange={e => setScanQty(e.target.value)} />

          <div style={{ display: "flex", gap: 10, marginTop: 14, flexWrap: "wrap" }}>
            <button style={S.primaryBtnSm} onClick={confirmPutaway}>✓ Confirm put away</button>
            <button style={{ ...S.secondaryBtnSm, color: "#E5484D", borderColor: "#E5484D" }} onClick={() => setShortageOpen(!shortageOpen)}>⚠ Physical item nahi mila (RTV)</button>
            <button style={S.secondaryBtnSm} onClick={() => { setMatchedTaskId(null); setMatchedBinId(""); setShortageOpen(false); }}>Cancel</button>
          </div>
          {shortageOpen && (
            <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
              <input type="number" min={1} max={matchedRemaining} style={{ ...S.input, width: 140 }} placeholder={`Short qty (max ${matchedRemaining})`} value={shortageQty} onChange={e => setShortageQty(e.target.value)} />
              <button style={{ ...S.secondaryBtnSm, color: "#E5484D", borderColor: "#E5484D" }} onClick={reportShortage}>Report RTV</button>
            </div>
          )}
        </div>
      )}

      <div style={S.panel}>
        <div style={S.panelTitle}>My putaway jobs — tracking</div>
        <table>
          <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>GRN</th><th style={S.th}>Required</th><th style={S.th}>Put Away</th><th style={S.th}>Remaining</th><th style={S.th}>Location</th><th style={S.th}>Status</th></tr></thead>
          <tbody>
            {myAllTasks.map(t => {
              const p = products[t.product_id];
              const completed = t.qty_completed || 0;
              const remaining = t.qty - completed;
              const status = remaining <= 0 ? "Completed" : completed > 0 ? "Partial" : "Pending";
              const statusColor = status === "Completed" ? "#4CAF7D" : status === "Partial" ? "#F5A623" : "#8B93A3";
              const bin = bins.find(b => b.id === t.bin_id);
              return (
                <tr key={t.id}>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                  <td style={S.td}>{p?.name || "—"}</td>
                  <td style={{ ...S.td, color: "#8B93A3" }}>{grnNumberFor(t)}</td>
                  <td style={{ ...S.td, color: "#8B93A3" }}>{t.qty}</td>
                  <td style={{ ...S.td, color: "#8B93A3" }}>{completed}</td>
                  <td style={{ ...S.td, color: remaining > 0 ? "#E5484D" : "#8B93A3" }}>{remaining}</td>
                  <td style={{ ...S.td, color: "#8B93A3" }}>{bin?.code || "—"}</td>
                  <td style={S.td}><span style={{ ...S.badgeSm, color: statusColor, borderColor: statusColor }}>{status}</span></td>
                </tr>
              );
            })}
            {myAllTasks.length === 0 && <tr><td colSpan={8}><EmptyNote text="Koi job aapko assign nahi hui." /></td></tr>}
          </tbody>
        </table>
      </div>

      {canAssign && (
        <>
          <SectionTitle title="Unassigned putaway queue (assign to staff)" />
          <div style={S.cardGrid}>
            {unassignedTasks.map(t => <UnassignedCard key={t.id} t={t} />)}
            {unassignedTasks.length === 0 && <EmptyNote text="Sab tasks assign ho chuke hain." />}
          </div>
        </>
      )}
    </div>
  );
}

/* ================= INVENTORY ================= */
function InventoryView({ token, profile }) {
  const [tab, setTab] = useState("ledger");
  const [rows, setRows] = useState([]);
  const [reserved, setReserved] = useState({});
  const [products, setProducts] = useState({});
  const [bins, setBins] = useState({});
  const [query, setQuery] = useState("");

  useEffect(() => {
    (async () => {
      const [inv, res, prods, binList] = await Promise.all([
        sb(`/rest/v1/inventory?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/inventory_reserved?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/products?select=*`, { token }),
        sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token })
      ]);
      setRows(inv || []);
      setReserved(Object.fromEntries((res || []).map(r => [r.product_id, r.reserved])));
      setProducts(Object.fromEntries((prods || []).map(p => [p.id, p])));
      setBins(Object.fromEntries((binList || []).map(b => [b.id, b])));
    })();
  }, [token, profile.warehouse_id]);

  const q = query.trim().toLowerCase();

  // Ledger: aggregate on_hand per product across all bins, minus reserved = net available
  const ledger = (() => {
    const byProduct = {};
    for (const r of rows) {
      if (!byProduct[r.product_id]) byProduct[r.product_id] = 0;
      byProduct[r.product_id] += r.on_hand;
    }
    return Object.entries(byProduct).map(([productId, onHand]) => {
      const res = reserved[productId] || 0;
      return { productId, onHand, reserved: res, available: onHand - res };
    }).filter(r => {
      const p = products[r.productId];
      if (!q) return true;
      return (p?.barcode || "").toLowerCase().includes(q) || (p?.name || "").toLowerCase().includes(q);
    }).sort((a, b) => (products[b.productId]?.name || "").localeCompare(products[a.productId]?.name || ""));
  })();

  const binRows = rows.filter(r => {
    const p = products[r.product_id];
    if (!q) return true;
    return (p?.barcode || "").toLowerCase().includes(q) || (p?.name || "").toLowerCase().includes(q);
  });

  return (
    <div>
      <SectionTitle title="Inventory" />
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <button onClick={() => setTab("ledger")} style={{ ...S.pill, ...(tab === "ledger" ? { background: "#F5A623", color: "#14161B", borderColor: "#F5A623" } : {}) }}>📒 Inventory Ledger</button>
        <button onClick={() => setTab("bins")} style={{ ...S.pill, ...(tab === "bins" ? { background: "#F5A623", color: "#14161B", borderColor: "#F5A623" } : {}) }}>🗺 Bin-wise Inventory</button>
      </div>
      <input style={{ ...S.input, maxWidth: 340, marginBottom: 14 }} placeholder="🔍 Search by barcode or product name…" value={query} onChange={e => setQuery(e.target.value)} />

      {tab === "ledger" && (
        <div style={S.panel}>
          <table>
            <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>On Hand</th><th style={S.th}>Reserved</th><th style={S.th}>Net Available</th></tr></thead>
            <tbody>
              {ledger.map(r => {
                const p = products[r.productId];
                return (
                  <tr key={r.productId}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                    <td style={S.td}>{p?.name || "—"}</td>
                    <td style={{ ...S.td, color: "#8B93A3" }}>{r.onHand}</td>
                    <td style={{ ...S.td, color: r.reserved > 0 ? "#E5484D" : "#8B93A3" }}>{r.reserved}</td>
                    <td style={{ ...S.td, color: "#4CAF7D", fontWeight: 600 }}>{r.available}</td>
                  </tr>
                );
              })}
              {ledger.length === 0 && <tr><td colSpan={5}><EmptyNote text="No inventory recorded yet." /></td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {tab === "bins" && (
        <div style={S.panel}>
          <table>
            <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Bin</th><th style={S.th}>On Hand (this bin)</th><th style={S.th}>Reserved against order?</th></tr></thead>
            <tbody>
              {binRows.map((r, i) => {
                const p = products[r.product_id];
                const bin = bins[r.bin_id];
                const productReserved = reserved[r.product_id] || 0;
                return (
                  <tr key={i}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                    <td style={S.td}>{p?.name || "—"}</td>
                    <td style={{ ...S.td, color: "#8B93A3" }}>{bin?.code || "Unassigned (awaiting putaway)"}</td>
                    <td style={S.td}>{r.on_hand}</td>
                    <td style={S.td}>
                      {productReserved > 0
                        ? <span style={{ ...S.badgeSm, color: "#E5484D", borderColor: "#E5484D" }}>Yes · {productReserved} reserved (product-wide)</span>
                        : <span style={{ ...S.badgeSm, color: "#4CAF7D", borderColor: "#4CAF7D" }}>No</span>}
                    </td>
                  </tr>
                );
              })}
              {binRows.length === 0 && <tr><td colSpan={5}><EmptyNote text="No inventory recorded yet." /></td></tr>}
            </tbody>
          </table>
          <div style={{ marginTop: 10, fontSize: 11, color: "#5A6070" }}>
            ⚠ Reservation abhi product-level track hoti hai (jis bin se picking suggest hui hai wahi highlight ho sakti hai, exact bin-split system abhi nahi hai).
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= SALES ORDERS ================= */
function OrdersView({ token, profile, showToast }) {
  const [orders, setOrders] = useState([]);
  const [productCache, setProductCache] = useState({});
  const [showForm, setShowForm] = useState(false);
  const [extId, setExtId] = useState("");
  const [courier, setCourier] = useState("Postex");
  const [items, setItems] = useState([]);
  const [pendingProduct, setPendingProduct] = useState(null);
  const [lineQty, setLineQty] = useState(1);
  const [openOrder, setOpenOrder] = useState(null);
  const [openLines, setOpenLines] = useState([]);
  const [openEvents, setOpenEvents] = useState([]);
  const [openShortages, setOpenShortages] = useState([]);
  const [editTracking, setEditTracking] = useState("");
  const [editCourier, setEditCourier] = useState("");
  const [editQty, setEditQty] = useState({});
  const [statusFilter, setStatusFilter] = useState(null);
  const [lineStats, setLineStats] = useState({});
  const [profiles, setProfiles] = useState({});
  const [importing, setImporting] = useState(false);
  const [importSummary, setImportSummary] = useState(null);
  const [ordersReport, setOrdersReport] = useState(null);
  const [selectedOrders, setSelectedOrders] = useState({});
  const [totes, setTotes] = useState([]);
  const [pickers, setPickers] = useState([]);
  const [bulkToteId, setBulkToteId] = useState("");
  const [bulkPickerId, setBulkPickerId] = useState("");
  const [bulkBusy, setBulkBusy] = useState(false);

  const load = useCallback(async () => {
    try {
      const o = await sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=*&order=received_at.desc`, { token });
      setOrders(o || []);
      const profs = await sb(`/rest/v1/profiles?select=*`, { token }) || [];
      setProfiles(Object.fromEntries(profs.map(u => [u.id, u])));
      setPickers(profs.filter(u => ["picker", "packer"].includes(u.role) && u.warehouse_id === profile.warehouse_id));
      setTotes(await sb(`/rest/v1/totes?warehouse_id=eq.${profile.warehouse_id}&status=eq.open&select=*`, { token }) || []);
      const ids = (o || []).map(x => x.id);
      if (ids.length) {
        const allLines = await sb(`/rest/v1/sales_order_lines?order_id=in.(${ids.join(",")})&select=order_id,qty`, { token });
        const stats = {};
        for (const l of allLines || []) {
          if (!stats[l.order_id]) stats[l.order_id] = { count: 0, qty: 0 };
          stats[l.order_id].count += 1; stats[l.order_id].qty += l.qty;
        }
        setLineStats(stats);
      }
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id]);
  useEffect(() => { load(); }, [load]);

  const receivedOrders = orders.filter(o => o.status === "received");
  const [skuFilter, setSkuFilter] = useState("all");
  const orderSkuType = (orderId) => {
    const c = lineStats[orderId]?.count || 0;
    return c === 1 ? "single" : "multi";
  };
  const filteredReceived = receivedOrders.filter(o => skuFilter === "all" || orderSkuType(o.id) === skuFilter);
  const singleCount = receivedOrders.filter(o => orderSkuType(o.id) === "single").length;
  const multiCount = receivedOrders.filter(o => orderSkuType(o.id) === "multi").length;
  const selectedCount = Object.values(selectedOrders).filter(Boolean).length;
  const toggleAll = (checked) => setSelectedOrders(Object.fromEntries(filteredReceived.map(o => [o.id, checked])));

  const bulkReserveAndAssign = async () => {
    const ids = Object.keys(selectedOrders).filter(k => selectedOrders[k]);
    if (ids.length === 0 || ids.length > 15) { showToast("1 se 15 orders select karein", "err"); return; }
    if (!bulkToteId || !bulkPickerId) { showToast("Tote aur Picker select karein", "err"); return; }
    setBulkBusy(true);
    try {
      const okOrders = [];
      const shortOrders = [];
      for (const orderId of ids) {
        const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${orderId}&select=*`, { token });
        const summaries = [];
        let anyShort = false;
        for (const l of lines) {
          const summary = await getStockSummary(token, profile.warehouse_id, l.product_id);
          summaries.push({ line: l, summary });
          if (summary.available < l.qty) anyShort = true;
        }
        if (anyShort) shortOrders.push({ orderId, summaries });
        else okOrders.push({ orderId, summaries });
      }

      for (const { orderId, summaries } of shortOrders) {
        await sb(`/rest/v1/order_shortage_lines?order_id=eq.${orderId}`, { method: "DELETE", token });
        for (const { line, summary } of summaries) {
          const notAvail = Math.max(0, line.qty - summary.available);
          if (notAvail > 0) {
            await sb(`/rest/v1/order_shortage_lines`, { method: "POST", token, body: { order_id: orderId, product_id: line.product_id, qty_required: line.qty, qty_available: summary.available, not_available_qty: notAvail } });
          }
        }
        await sb(`/rest/v1/sales_orders?id=eq.${orderId}`, { method: "PATCH", token, body: { status: "incomplete" } });
        await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: orderId, user_id: profile.id, action: "marked_incomplete" } });
      }

      if (okOrders.length === 0) {
        showToast(`Sab select kiye orders 'Incomplete' hain (stock short) — koi tote assign nahi hui`, "err");
        setSelectedOrders({}); load(); setBulkBusy(false); return;
      }

      await sb(`/rest/v1/totes?id=eq.${bulkToteId}`, { method: "PATCH", token, body: { status: "picking", assigned_to: bulkPickerId } });
      let binNum = 1;
      for (const { orderId, summaries } of okOrders) {
        const lineBins = {};
        for (const { line, summary } of summaries) {
          const bestBin = [...summary.rows].sort((a, b) => b.on_hand - a.on_hand)[0];
          lineBins[line.product_id] = bestBin ? bestBin.bin_id : null;
          await adjustReserved(token, profile.warehouse_id, line.product_id, line.qty);
        }
        const pt = await sb(`/rest/v1/pick_tasks`, { method: "POST", token, prefer: "return=representation", body: { order_id: orderId, status: "assigned", tote_id: bulkToteId, assigned_to: bulkPickerId, assigned_at: new Date().toISOString(), tote_bin_number: binNum } });
        binNum++;
        for (const { line } of summaries) {
          await sb(`/rest/v1/pick_task_lines`, { method: "POST", token, body: { pick_task_id: pt[0].id, product_id: line.product_id, qty_required: line.qty, bin_id: lineBins[line.product_id] || null } });
        }
        await sb(`/rest/v1/sales_orders?id=eq.${orderId}`, { method: "PATCH", token, body: { status: "queued" } });
        await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: orderId, user_id: profile.id, action: "reserved_and_assigned_to_tote" } });
      }
      showToast(`${okOrders.length} orders assigned${shortOrders.length ? `, ${shortOrders.length} 'Incomplete' tab mein chale gaye (stock short)` : ""}`);
      setSelectedOrders({}); setBulkToteId(""); setBulkPickerId("");
      load();
    } catch (e) { showToast(`Assign failed: ${(e.message || "").slice(0, 100)}`, "err"); }
    setBulkBusy(false);
  };

  const addLine = () => {
    if (!pendingProduct) { showToast("Product select karein", "err"); return; }
    if (lineQty <= 0) return;
    setItems([...items, { product_id: pendingProduct.id, barcode: pendingProduct.barcode, name: pendingProduct.name, qty: Number(lineQty) }]);
    setPendingProduct(null); setLineQty(1);
  };

  const createOrder = async () => {
    if (!extId.trim()) { showToast("Order ID likhein", "err"); return; }
    if (items.length === 0) { showToast("Pehle '+ Add line' se product add karein", "err"); return; }
    try {
      const created = await sb(`/rest/v1/sales_orders`, {
        method: "POST", token, prefer: "return=representation",
        body: { external_order_id: extId.trim(), courier, warehouse_id: profile.warehouse_id, status: "received" }
      });
      const order = created[0];
      for (const it of items) {
        await sb(`/rest/v1/sales_order_lines`, { method: "POST", token, body: { order_id: order.id, product_id: it.product_id, qty: it.qty } });
      }
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: order.id, user_id: profile.id, action: "created" } });
      setExtId(""); setItems([]); setShowForm(false);
      showToast("Order created"); load();
    } catch (e) {
      let detail = e.message || "";
      try { const parsed = JSON.parse(detail); detail = parsed.message || parsed.hint || detail; } catch {}
      showToast(`Order create failed: ${detail.slice(0, 120)}`, "err");
    }
  };

  const handleOrdersFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImporting(true); setImportSummary(null); setOrdersReport(null);
    try {
      const rows = await parseSheet(file);
      if (rows.length === 0) { showToast("File khali hai", "err"); setImporting(false); return; }
      const map = buildColumnMap(Object.keys(rows[0]));
      if (!map.barcode || !map.orderRef) { showToast("Barcode ya Order/Tracking column nahi mila", "err"); setImporting(false); return; }

      const fileBarcodes = rows.map(r => getVal(r, map, "barcode"));
      const productMap = await fetchProductsByBarcodes(token, fileBarcodes);

      // orders already imported (whole order, not per-line) count as duplicates
      const fileRefs = [...new Set(rows.map(r => cleanCode(getVal(r, map, "orderRef"))).filter(Boolean))];
      const existing = fileRefs.length ? await sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&external_order_id=in.(${fileRefs.map(encodeURIComponent).join(",")})&select=external_order_id`, { token }) : [];
      const existingOrderSet = new Set((existing || []).map(o => o.external_order_id));
      const existingGroupLines = {};
      for (const row of rows) {
        const ref = cleanCode(getVal(row, map, "orderRef"));
        const bc = cleanCode(getVal(row, map, "barcode"));
        if (ref && existingOrderSet.has(ref)) existingGroupLines[`${ref}|${bc}`] = true;
      }

      const report = validateImportRows(rows, map, productMap, "orderRef", existingGroupLines);
      const extra = {}; // per-order courier/customer captured from first valid row of each group
      for (const r of report.validRows) {
        if (!extra[r.groupVal]) {
          const srcRow = rows.find(row => cleanCode(getVal(row, map, "orderRef")) === r.groupVal);
          extra[r.groupVal] = {
            courier: String(getVal(srcRow, map, "courier") || "Other").trim(),
            customer: getVal(srcRow, map, "customer") || null,
            customerOrderNumber: getVal(srcRow, map, "customerOrderNumber") || null,
            invoiceDate: getVal(srcRow, map, "invoiceDate") || null,
            grossAmount: getVal(srcRow, map, "grossAmount") || null
          };
        }
      }
      setOrdersReport({ report, extra });
      showToast(`Validated: ${report.validRows.length} valid, ${report.invalidRows.length} invalid`);
    } catch (err) { showToast(`Validation failed: ${(err.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  const confirmOrdersImport = async () => {
    if (!ordersReport) return;
    setImporting(true);
    try {
      const groups = {};
      for (const r of ordersReport.report.validRows) {
        if (!groups[r.groupVal]) groups[r.groupVal] = [];
        groups[r.groupVal].push(r);
      }
      let ordersCreated = 0, linesAdded = 0;
      for (const [ref, groupRows] of Object.entries(groups)) {
        const meta = ordersReport.extra[ref] || {};
        const created = await sb(`/rest/v1/sales_orders`, {
          method: "POST", token, prefer: "return=representation",
          body: { external_order_id: ref, courier: meta.courier || "Other", warehouse_id: profile.warehouse_id, status: "received", raw_data: { customer: meta.customer || null, customer_order_number: meta.customerOrderNumber || null, invoice_date: meta.invoiceDate || null, gross_amount: meta.grossAmount || null } }
        });
        const orderId = created[0].id;
        ordersCreated++;
        for (const r of groupRows) {
          await sb(`/rest/v1/sales_order_lines`, { method: "POST", token, body: { order_id: orderId, product_id: r.product.id, qty: r.qty } });
          linesAdded++;
        }
        await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "sales_order", entity_id: orderId, user_id: profile.id, action: "created_bulk_import" } });
      }
      setImportSummary(`${ordersCreated} order(s) created, ${linesAdded} lines added.`);
      showToast(`Import done — ${ordersCreated} orders, ${linesAdded} lines`);
      setOrdersReport(null);
      load();
    } catch (err) { showToast(`Import failed: ${(err.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  const reserveAndQueue = async (order) => {
    try {
      const lines = await sb(`/rest/v1/sales_order_lines?order_id=eq.${order.id}&select=*`, { token });
      const summaries = [];
      let anyShort = false;
      for (const l of lines) {
        const summary = await getStockSummary(token, profile.warehouse_id, l.product_id);
        summaries.push({ line: l, summary });
        if (summary.available < l.qty) anyShort = true;
      }

      if (anyShort) {
        await sb(`/rest/v1/order_shortage_lines?order_id=eq.${order.id}`, { method: "DELETE", token });
        for (const { line, summary } of summaries) {
          const notAvail = Math.max(0, line.qty - summary.available);
          if (notAvail > 0) {
            await sb(`/rest/v1/order_shortage_lines`, { method: "POST", token, body: { order_id: order.id, product_id: line.product_id, qty_required: line.qty, qty_available: summary.available, not_available_qty: notAvail } });
          }
        }
        await sb(`/rest/v1/sales_orders?id=eq.${order.id}`, { method: "PATCH", token, body: { status: "incomplete" } });
