<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4EFE6; font-family: 'Space Grotesk', sans-serif; }
  input, select, button { font-family: inherit; }
  table { width: 100%; border-collapse: collapse; }

  .depotos-menu-btn { display: none; }
  .depotos-overlay { display: none; }

  @media (max-width: 820px) {
    .depotos-sidebar {
      position: fixed !important;
      top: 0; left: 0; height: 100vh;
      z-index: 300;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,0.5);
    }
    .depotos-sidebar.open { transform: translateX(0); }
    .depotos-menu-btn { display: inline-flex !important; }
    .depotos-overlay.open {
      display: block; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 250;
    }
    .depotos-content { padding: 14px 12px 60px !important; }
    .depotos-topbar { padding: 0 12px !important; }
    .depotos-statgrid { grid-template-columns: repeat(2, 1fr) !important; }
    .depotos-gauge-row { grid-template-columns: 1fr !important; }
    .login-left-panel { display: none !important; }
  }

  @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @keyframes cordSwing { 0% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } 100% { transform: rotate(-3deg); } }
  @keyframes cordPull { 0% { transform: translateY(0); } 40% { transform: translateY(18px); } 100% { transform: translateY(0); } }
  @keyframes loginFadeIn { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes glowPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.85; } }
  @keyframes flameFlicker { 0% { transform: scaleY(1) scaleX(1); opacity: 0.9; } 100% { transform: scaleY(1.25) scaleX(0.85); opacity: 1; } }
  @keyframes rocketIdle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .rocket-flame { animation: flameFlicker 0.12s ease-in-out infinite alternate; transform-origin: top center; }
  .rocket-idle { animation: rocketIdle 3s ease-in-out infinite; }
  .galaxy-star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }
  .lamp-cord-group { animation: cordSwing 4s ease-in-out infinite; transform-origin: top center; cursor: pointer; }
  .lamp-cord-group.pulling { animation: cordPull 0.35s ease; }
  .login-card-appear { animation: loginFadeIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .lamp-glow { animation: glowPulse 2.5s ease-in-out infinite; }
</style>
