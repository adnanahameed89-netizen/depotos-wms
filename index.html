                        <button style={S.secondaryBtnSm} onClick={() => receiveLine(l)} disabled={!bulkOfficerId} title={!bulkOfficerId ? "Pehle officer select karein" : ""}>📍 Receive → Putaway</button>
                      ) : <span style={{ color: "#8A8272", fontSize: 11 }}>Dock-received ✓</span>}
                    </td>
                  </tr>
                );
              })}
              {lines.length === 0 && <tr><td colSpan={5}><EmptyNote text="No lines yet — add one above." /></td></tr>}
            </tbody>
          </table>
          {allReceived && <button style={{ ...S.primaryBtnSm, marginTop: 14 }} onClick={completeGrn}>✓ Mark GRN completed</button>}
        </div>
      </div>
    );
  }
  return (
    <div>
      <SectionTitle title="Receiving (GRN)" action={
        canManageGrn ? (
          <label style={{ ...S.primaryBtnSm, cursor: "pointer" }}>
            {importing ? "Importing…" : "📤 Upload GRN file"}
            <input type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={handleGrnFile} disabled={importing} />
          </label>
        ) : null
      } />
      {!canManageGrn && (
        <div style={{ ...S.panel, fontSize: 12, color: "#6B6355" }}>ℹ️ Only Admin or Warehouse Lead can upload/assign a GRN.</div>
      )}
      {importSummary && (
        <div style={{ ...S.panel, borderColor: "#4CAF7D", color: "#4CAF7D", fontSize: 12 }}>{importSummary}</div>
      )}
      {grnReport && (
        <ImportReportPanel report={grnReport.report} importing={importing}
          onConfirm={confirmGrnImport} onCancel={() => setGrnReport(null)} confirmLabel="Confirm & import GRNs" />
      )}
      {!grnReport && canManageGrn && (
      <div style={S.panel}>
        <div style={S.panelTitle}>New GRN (manual)</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <input style={{ ...S.input, flex: 1, minWidth: 140, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="GRN number" value={grnNumber} onChange={e => setGrnNumber(e.target.value)} />
          <input style={{ ...S.input, flex: 1, minWidth: 140 }} placeholder="Source (supplier etc.)" value={source} onChange={e => setSource(e.target.value)} />
          <input style={{ ...S.input, flex: 1, minWidth: 120, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="PO #" value={poNumber} onChange={e => setPoNumber(e.target.value)} />
          <button style={S.primaryBtnSm} onClick={createGrn}>+ Create GRN</button>
        </div>
      </div>
      )}

      {(() => {
        const TABS = [
          { key: "all", label: "All" },
          { key: "open", label: "Open" },
          { key: "assigned", label: "Assigned" },
          { key: "partial", label: "Partial" },
          { key: "completed", label: "Completed" },
          { key: "rpo", label: "RPO / Exception" }
        ];
        const counts = Object.fromEntries(TABS.map(t => [t.key, t.key === "all" ? grns.length : t.key === "rpo" ? rpoRecords.length : grns.filter(g => (grnStatus[g.id]?.status || "open") === t.key).length]));
        return (
          <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
            {TABS.map(t => (
              <button key={t.key} onClick={() => setStatusTab(t.key)} style={{ ...S.pill, ...(statusTab === t.key ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>
                {t.label} ({counts[t.key]})
              </button>
            ))}
          </div>
        );
      })()}

      {canManageGrn && statusTab !== "rpo" && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Selected GRNs ({Object.values(selectedGrns).filter(Boolean).length}) — assign Put Away Officer</div>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <select style={{ ...S.input, minWidth: 200 }} value={bulkOfficerId} onChange={e => setBulkOfficerId(e.target.value)}>
              <option value="">Put Away Officer select karein…</option>
              {staff.filter(s => s.id !== profile.id).map(s => <option key={s.id} value={s.id}>{s.full_name} ({s.role})</option>)}
            </select>
            <button style={S.primaryBtnSm} onClick={bulkAssignPutaway} disabled={bulkBusy}>{bulkBusy ? "Assigning…" : "✓ Assign selected"}</button>
          </div>
        </div>
      )}

      {statusTab === "rpo" ? (
        <div style={S.panel}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 10 }}>
            <div style={S.panelTitle}>RPO / Shortage transactions — physical vs GRN qty mismatch</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setRpoSubTab("pending")} style={{ ...S.pill, ...(rpoSubTab === "pending" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>Pending ({rpoRecords.filter(r => r.status !== "shipped").length})</button>
              <button onClick={() => setRpoSubTab("processed")} style={{ ...S.pill, ...(rpoSubTab === "processed" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>Processed ({rpoRecords.filter(r => r.status === "shipped").length})</button>
            </div>
          </div>

          {rpoSubTab === "pending" ? (
            <>
              {canManageGrn && (
                <div style={{ marginBottom: 10 }}>
                  <button style={S.primaryBtnSm} onClick={shipSelectedRpos} disabled={rpoBusy || Object.values(selectedRpos).filter(Boolean).length === 0}>
                    {rpoBusy ? "Processing…" : `✓ Mark as Shipped (${Object.values(selectedRpos).filter(Boolean).length})`}
                  </button>
                </div>
              )}
              <table>
                <thead><tr>
                  {canManageGrn && <th style={S.th}><input type="checkbox" onChange={e => setSelectedRpos(Object.fromEntries(rpoRecords.filter(r => r.status !== "shipped").map(r => [r.id, e.target.checked])))} /></th>}
                  <th style={S.th}>RPO #</th><th style={S.th}>GRN #</th><th style={S.th}>Product</th><th style={S.th}>Expected</th><th style={S.th}>Short</th><th style={S.th}>Reason</th><th style={S.th}>By</th><th style={S.th}>Date</th>
                </tr></thead>
                <tbody>
                  {rpoRecords.filter(r => r.status !== "shipped").map(r => (
                    <tr key={r.id}>
                      {canManageGrn && (
                        <td style={S.td}><input type="checkbox" checked={!!selectedRpos[r.id]} onChange={e => setSelectedRpos({ ...selectedRpos, [r.id]: e.target.checked })} /></td>
                      )}
                      <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{r.rpo_number || "—"}</td>
                      <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#6B6355" }}>{r.grnNumber}</td>
                      <td style={S.td}>{r.product?.name || "—"}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{r.expected_qty}</td>
                      <td style={{ ...S.td, color: "#E5484D", fontWeight: 600 }}>{r.short_qty}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{r.reason}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{r.createdByName}</td>
                      <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{fmtTime(r.created_at)}</td>
                    </tr>
                  ))}
                  {rpoRecords.filter(r => r.status !== "shipped").length === 0 && <tr><td colSpan={canManageGrn ? 9 : 8}><EmptyNote text="No pending RPO/shortage records." /></td></tr>}
                </tbody>
              </table>
            </>
          ) : (
            <table>
              <thead><tr><th style={S.th}>RPO #</th><th style={S.th}>GRN #</th><th style={S.th}>Product</th><th style={S.th}>Short</th><th style={S.th}>Reported By</th><th style={S.th}>Reported</th><th style={S.th}>Shipped By</th><th style={S.th}>Shipped At</th></tr></thead>
              <tbody>
                {rpoRecords.filter(r => r.status === "shipped").map(r => (
                  <tr key={r.id}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{r.rpo_number || "—"}</td>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#6B6355" }}>{r.grnNumber}</td>
                    <td style={S.td}>{r.product?.name || "—"}</td>
                    <td style={{ ...S.td, color: "#E5484D", fontWeight: 600 }}>{r.short_qty}</td>
                    <td style={{ ...S.td, color: "#6B6355" }}>{r.createdByName}</td>
                    <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{fmtTime(r.created_at)}</td>
                    <td style={{ ...S.td, color: "#4CAF7D" }}>{r.shippedByName}</td>
                    <td style={{ ...S.td, color: "#4CAF7D", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{r.shipped_at ? fmtTime(r.shipped_at) : "—"}</td>
                  </tr>
                ))}
                {rpoRecords.filter(r => r.status === "shipped").length === 0 && <tr><td colSpan={8}><EmptyNote text="No RPO has been shipped yet." /></td></tr>}
              </tbody>
            </table>
          )}
        </div>
      ) : (
      <div style={S.panel}>
        <table>
          <thead>
            <tr>
              {canManageGrn && <th style={S.th}></th>}
              <th style={S.th}>GRN #</th><th style={S.th}>PO #</th><th style={S.th}>Source</th><th style={S.th}>Status</th><th style={S.th}>Lines</th>
              <th style={S.th}>Put Away Qty</th><th style={S.th}>Total Qty</th><th style={S.th}>Created</th>
            </tr>
          </thead>
          <tbody>
            {grns.filter(g => statusTab === "all" || (grnStatus[g.id]?.status || "open") === statusTab).map(g => {
              const stat = grnLineStats[g.id] || { count: 0, qty: 0 };
              const st = grnStatus[g.id] || { status: "open", putawayQty: 0, totalQty: stat.qty };
              const STATUS_LABELS = { open: "Open", assigned: "Assigned", partial: "Partial", completed: "Completed" };
              const STATUS_COL = { open: "#6B6355", assigned: "#5B9EE8", partial: "#F5A623", completed: "#4CAF7D" };
              return (
                <tr key={g.id}>
                  {canManageGrn && (
                    <td style={S.td} onClick={e => e.stopPropagation()}>
                      <input type="checkbox" checked={!!selectedGrns[g.id]} onChange={e => setSelectedGrns({ ...selectedGrns, [g.id]: e.target.checked })} />
                    </td>
                  )}
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", cursor: "pointer" }} onClick={() => { setOpenGrn(g); loadLines(g.id); }}>{g.grn_number}</td>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#6B6355" }}>{g.po_number || "—"}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{g.source || "No source"}</td>
                  <td style={S.td}><span style={{ ...S.badgeSm, color: STATUS_COL[st.status], borderColor: STATUS_COL[st.status] }}>{STATUS_LABELS[st.status]}</span></td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{stat.count}</td>
                  <td style={{ ...S.td, color: st.status === "completed" ? "#4CAF7D" : "#F5A623" }}>{st.putawayQty} / {st.totalQty}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{stat.qty}</td>
                  <td style={{ ...S.td, color: "#6B6355", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}>{fmtTime(g.created_at)}</td>
                </tr>
              );
            })}
            {grns.filter(g => statusTab === "all" || (grnStatus[g.id]?.status || "open") === statusTab).length === 0 && (
              <tr><td colSpan={canManageGrn ? 9 : 8}><EmptyNote text="No GRNs in this status." /></td></tr>
            )}
          </tbody>
        </table>
      </div>
      )}
    </div>
  );
}

/* ================= PUTAWAY ================= */
function PutawayView({ token, profile, showToast }) {
  const [unassignedTasks, setUnassignedTasks] = useState([]);
  const [myAllTasks, setMyAllTasks] = useState([]);
  const [products, setProducts] = useState({});
  const [bins, setBins] = useState([]);
  const [staff, setStaff] = useState([]);
  const [grnLines, setGrnLines] = useState({});
  const [grns, setGrns] = useState({});
  const [returnLines, setReturnLines] = useState({});
  const [returnsMap, setReturnsMap] = useState({});
  const [sourceStrs, setSourceStrs] = useState({});
  const [teamTasks, setTeamTasks] = useState([]);
  const [binChoice, setBinChoice] = useState({});
  const canAssign = ["admin", "warehouse_lead", "supervisor", "putaway_officer", "returns_agent"].includes(profile.role);

  const load = useCallback(async () => {
    try {
      const [u, mine, b, s] = await Promise.all([
        sb(`/rest/v1/putaway_tasks?status=eq.pending&assigned_to=is.null&return_line_id=is.null&select=*&order=id.asc`, { token }),
        sb(`/rest/v1/putaway_tasks?status=eq.pending&or=(assigned_to.eq.${profile.id},and(assigned_to.is.null,return_line_id.not.is.null))&select=*&order=id.asc`, { token }),
        sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/profiles?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token })
      ]);
      setUnassignedTasks(u || []); setMyAllTasks(mine || []); setBins(b || []); setStaff(s || []);
      let team = [];
      if (["admin", "warehouse_lead", "supervisor"].includes(profile.role)) {
        team = await sb(`/rest/v1/putaway_tasks?status=eq.pending&assigned_to=not.is.null&select=*&order=id.asc`, { token }) || [];
        setTeamTasks(team);
      }
      const allTasks = [...(u || []), ...(mine || []), ...team];
      setProducts(await fetchProductsByIds(token, allTasks.map(x => x.product_id)));
      const glIds = [...new Set(allTasks.map(x => x.grn_line_id).filter(Boolean))];
      if (glIds.length) {
        const gls = await sb(`/rest/v1/grn_lines?id=in.(${glIds.join(",")})&select=*`, { token });
        setGrnLines(Object.fromEntries((gls || []).map(x => [x.id, x])));
        const grnIds = [...new Set((gls || []).map(x => x.grn_id))];
        if (grnIds.length) {
          const gs = await sb(`/rest/v1/grn?id=in.(${grnIds.join(",")})&select=*`, { token });
          setGrns(Object.fromEntries((gs || []).map(x => [x.id, x])));
        }
      }
      const rlIds = [...new Set(allTasks.map(x => x.return_line_id).filter(Boolean))];
      if (rlIds.length) {
        const rls = await sb(`/rest/v1/return_lines?id=in.(${rlIds.join(",")})&select=*`, { token });
        setReturnLines(Object.fromEntries((rls || []).map(x => [x.id, x])));
        const returnIds = [...new Set((rls || []).map(x => x.return_id))];
        if (returnIds.length) {
          const rs = await sb(`/rest/v1/returns?id=in.(${returnIds.join(",")})&select=*`, { token });
          const sOrderIds = [...new Set((rs || []).map(x => x.order_id).filter(Boolean))];
          const sOrders = sOrderIds.length ? await sb(`/rest/v1/sales_orders?id=in.(${sOrderIds.join(",")})&select=*`, { token }) : [];
          const sOrderMap = Object.fromEntries((sOrders || []).map(o => [o.id, o]));
          setReturnsMap(Object.fromEntries((rs || []).map(x => [x.id, { ...x, orderRef: sOrderMap[x.order_id]?.external_order_id }])));
        }
      }
      const strIds = [...new Set(allTasks.map(x => x.source_str_id).filter(Boolean))];
      if (strIds.length) {
        const strRows = await sb(`/rest/v1/stk_str?id=in.(${strIds.join(",")})&select=*`, { token });
        setSourceStrs(Object.fromEntries((strRows || []).map(x => [x.id, x])));
      }
    } catch (e) { showToast("Load failed", "err"); }
  }, [token, profile.warehouse_id, profile.id, profile.role]);
  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    window.addEventListener("app-reconnect", load);
    return () => window.removeEventListener("app-reconnect", load);
  }, [load]);

  const grnNumberFor = (task) => {
    if (task.source_str_id) {
      const str = sourceStrs[task.source_str_id];
      return str ? `STR-${str.str_number}` : "STR-?";
    }
    if (task.return_line_id) {
      const rl = returnLines[task.return_line_id];
      const ret = rl ? returnsMap[rl.return_id] : null;
      return ret ? `RTN-${ret.orderRef || ret.id.slice(0, 6)}` : "RTN-?";
    }
    const gl = grnLines[task.grn_line_id];
    if (!gl) return "—";
    const g = grns[gl.grn_id];
    return g?.grn_number || "—";
  };

  const assignTask = async (task, userId) => {
    await sb(`/rest/v1/putaway_tasks?id=eq.${task.id}`, { method: "PATCH", token, body: { assigned_to: userId } });
    await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "putaway_task", entity_id: task.id, user_id: profile.id, action: "assigned", metadata: { assigned_to: userId } } });
    showToast("Assigned"); load();
  };

  /* ---- scan-driven flow ---- */
  const [scanBarcodeInput, setScanBarcodeInput] = useState("");
  const [scanLocationInput, setScanLocationInput] = useState("");
  const [scanQty, setScanQty] = useState("");
  const [pieceCount, setPieceCount] = useState(0);
  const [matchedTaskId, setMatchedTaskId] = useState(null);
  const [matchedBinId, setMatchedBinId] = useState("");
  const [shortageOpen, setShortageOpen] = useState(false);
  const [shortageQty, setShortageQty] = useState("");
  const putawayMode = profile.putaway_mode || "bulk";
  const isPieceMode = putawayMode === "piece";

  const pendingMine = myAllTasks.filter(t => t.qty - (t.qty_completed || 0) > 0);
  const matchedTask = pendingMine.find(t => t.id === matchedTaskId);
  const matchedProduct = matchedTask ? products[matchedTask.product_id] : null;
  const matchedRemaining = matchedTask ? matchedTask.qty - (matchedTask.qty_completed || 0) : 0;

  const commitPutaway = async (task, binId, qty) => {
    try {
      await addOnHand(token, profile.warehouse_id, task.product_id, binId, qty, { type: "putaway", userId: profile.id });
      const newCompleted = (task.qty_completed || 0) + qty;
      const done = newCompleted >= task.qty;
      const isFirstCommit = !(task.qty_completed > 0) && !task.started_at;
      const body = done
        ? { qty_completed: newCompleted, status: "completed", bin_id: binId, completed_at: new Date().toISOString() }
        : { qty_completed: newCompleted, bin_id: binId };
      if (isFirstCommit) {
        body.started_at = new Date().toISOString();
        if (!task.assigned_to) body.assigned_to = profile.id; // claim unassigned (return-origin) tasks for accountability
      }
      await sb(`/rest/v1/putaway_tasks?id=eq.${task.id}`, { method: "PATCH", token, body });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "putaway_task", entity_id: task.id, user_id: profile.id, action: done ? "completed" : "partial_putaway", metadata: { bin_id: binId, qty, mode: putawayMode } } });
      // Closes the loop back to Stocking Warehouse: once THIS side's putaway for an
      // STR-forwarded task is fully done, that STR flips to "received" over there too — no
      // separate manual status update needed on the Stocking side.
      if (done && task.source_str_id) {
        try {
          await sb(`/rest/v1/stk_str?id=eq.${task.source_str_id}`, { method: "PATCH", token, body: { status: "received", received_by: profile.id, received_at: new Date().toISOString() } });
        } catch (e) { /* best-effort — local putaway already succeeded either way */ }
      }
      return { done, newCompleted };
    } catch (e) { showToast("Putaway failed", "err"); return null; }
  };

  const scanProduct = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : scanBarcodeInput).trim();
    setScanBarcodeInput("");
    if (!code) return;
    const c = cleanCode(code);
    const product = Object.values(products).find(p => cleanCode(p.barcode) === c || cleanCode(p.sku) === c);
    if (!product) { showToast("Barcode/SKU match nahi hua", "err"); return; }

    const candidates = pendingMine.filter(t => t.product_id === product.id).sort((a, b) => a.id.localeCompare(b.id));
    if (candidates.length === 0) { showToast("Yeh product aapke pending jobs mein nahi hai — WRONG ITEM ya already complete", "err"); return; }
    setMatchedTaskId(candidates[0].id);
    setMatchedBinId("");
    setPieceCount(0);
    setScanQty(String(candidates[0].qty - (candidates[0].qty_completed || 0)));
    setShortageOpen(false);
    showToast(`✓ Matched: ${product.barcode} — GRN ${grnNumberFor(candidates[0])} — ab location scan karein`);
  };

  const scanLocation = async (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : scanLocationInput).trim();
    setScanLocationInput("");
    if (!code) return;
    const bin = bins.find(b => b.code.toLowerCase() === code.trim().toLowerCase());
    if (!bin) { showToast("Location nahi mili — Bin Master check karein", "err"); return; }
    setMatchedBinId(bin.id);

    if (isPieceMode && matchedTask) {
      // Every single piece requires its own Product Scan + Location Scan pair — even if it's
      // the same SKU going to the same location again. This preserves an exact per-piece
      // Product→Location→Qty trail, since different pieces of the same SKU can legitimately
      // end up in different bins.
      const result = await commitPutaway(matchedTask, bin.id, 1);
      if (result) {
        if (result.done) {
          showToast("✓ Putaway complete");
          setMatchedTaskId(null); setMatchedBinId("");
          load();
        } else {
          matchedTask.qty_completed = result.newCompleted;
          setMyAllTasks([...myAllTasks]);
          showToast(`📍 ${bin.code} — ✓ 1 pc recorded — agle piece ke liye product barcode DOBARA scan karein`);
          setMatchedTaskId(null); setMatchedBinId(""); // force a fresh product scan before the next location scan
        }
      }
    } else {
      showToast(`📍 Location set: ${bin.code} — ab quantity likh kar Enter dabayein`);
    }
  };

  const confirmPutaway = async () => {
    if (!matchedTask) { showToast("Pehle product scan karein", "err"); return; }
    if (!matchedBinId) { showToast("Location scan/select karein", "err"); return; }
    const qty = isPieceMode ? pieceCount : Number(scanQty);
    if (!qty || qty <= 0) { showToast(isPieceMode ? "Kam se kam 1 piece scan karein" : "Valid qty enter karein", "err"); return; }
    if (qty > matchedRemaining) { showToast(`EXCESS QTY NOT ALLOWED — max ${matchedRemaining}`, "err"); return; }
    const result = await commitPutaway(matchedTask, matchedBinId, qty);
    if (result) {
      showToast(result.done ? "✓ Putaway complete" : `✓ ${qty} pcs put away — ${matchedTask.qty - result.newCompleted} remaining`);
      setMatchedTaskId(null); setMatchedBinId(""); setScanQty(""); setPieceCount(0);
      load();
    }
  };

  const reportShortage = async () => {
    const qty = Number(shortageQty);
    if (!matchedTask) return;
    if (!qty || qty <= 0 || qty > matchedRemaining) { showToast(`Valid short qty (1 se ${matchedRemaining} tak) enter karein`, "err"); return; }
    try {
      const existingRpos = await sb(`/rest/v1/rtv_returns?rpo_number=not.is.null&select=rpo_number`, { token });
      let maxSerial = 0;
      for (const r of existingRpos || []) {
        const m = String(r.rpo_number).match(/(\d+)$/);
        if (m) maxSerial = Math.max(maxSerial, parseInt(m[1], 10));
      }
      const rpoNumber = `RPO-${String(maxSerial + 1).padStart(5, "0")}`;
      await sb(`/rest/v1/rtv_returns`, { method: "POST", token, body: { grn_line_id: matchedTask.grn_line_id, product_id: matchedTask.product_id, expected_qty: matchedTask.qty, short_qty: qty, reason: "Physically not received", created_by: profile.id, rpo_number: rpoNumber, status: "pending", grn_adjusted: true } });
      const newRequired = matchedTask.qty - qty;
      const done = (matchedTask.qty_completed || 0) >= newRequired;
      await sb(`/rest/v1/putaway_tasks?id=eq.${matchedTask.id}`, {
        method: "PATCH", token,
        body: done ? { qty: newRequired, status: "completed", completed_at: new Date().toISOString() } : { qty: newRequired }
      });
      // Shrink the GRN line's own required qty too — otherwise the GRN summary (Total Qty) never
      // accounts for this accepted shortage and the GRN stays "Partial" forever.
      if (matchedTask.grn_line_id) {
        const glRows = await sb(`/rest/v1/grn_lines?id=eq.${matchedTask.grn_line_id}&select=*`, { token });
        const gl = glRows && glRows[0];
        if (gl) {
          const newExpected = Math.max(0, gl.qty_expected - qty);
          await sb(`/rest/v1/grn_lines?id=eq.${matchedTask.grn_line_id}`, { method: "PATCH", token, body: { qty_expected: newExpected, qty_received: Math.min(gl.qty_received, newExpected) } });
        }
      }
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "putaway_task", entity_id: matchedTask.id, user_id: profile.id, action: "rtv_reported", metadata: { short_qty: qty, rpo_number: rpoNumber } } });
      showToast(`${rpoNumber} created — ${qty} pcs recorded`);
      setMatchedTaskId(null); setShortageOpen(false); setShortageQty("");
      load();
    } catch (e) { showToast("RTV report failed", "err"); }
  };

  const UnassignedCard = ({ t }) => {
    const p = products[t.product_id];
    return (
      <div style={S.card}>
        <div style={{ display: "flex", justifyContent: "space-between" }}>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#6B6355" }}>{grnNumberFor(t)}</span>
          <span style={{ ...S.badgeSm, color: "#6B6355", borderColor: "#E0D8C5" }}>Pending</span>
        </div>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 14, marginTop: 10 }}>{p?.barcode || "—"}</div>
        <div style={{ color: "#2B2620", fontSize: 13 }}>{p?.name}</div>
        <div style={{ color: "#6B6355", fontSize: 12, marginTop: 4 }}>Qty: {t.qty}</div>
        <select style={{ ...S.input, marginTop: 10, fontSize: 12 }} onChange={e => e.target.value && assignTask(t, e.target.value)} defaultValue="">
          <option value="">Assign to staff…</option>
          {staff.map(s => <option key={s.id} value={s.id}>{s.full_name} ({s.role})</option>)}
        </select>
      </div>
    );
  };

  return (
    <div>
      <SectionTitle title="Put Away — scan-driven" />
      <div style={S.panel}>
        <div style={S.panelTitle}>1. Scan product (any sequence)</div>
        <div style={{ display: "flex", gap: 10 }}>
          <input autoFocus style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Scan or type barcode / SKU, then Enter"
            value={scanBarcodeInput} onChange={e => setScanBarcodeInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && scanProduct()} />
          <CameraScanButton onScan={(text) => scanProduct(text)} />
          <button style={S.primaryBtnSm} onClick={() => scanProduct()}>Scan</button>
        </div>
      </div>

      {matchedTask && matchedProduct && (
        <div style={{ ...S.panel, borderColor: "#F5A623" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={S.panelTitle}>Matched item</div>
            <span style={{ ...S.badgeSm, color: isPieceMode ? "#5B9EE8" : "#F5A623", borderColor: isPieceMode ? "#5B9EE8" : "#F5A623" }}>{isPieceMode ? "🔢 Piece-to-Piece" : "📦 Bulk"}</span>
          </div>
          <div style={{ display: "flex", gap: 14, alignItems: "center", marginTop: 6 }}>
            {matchedProduct.image_url ? (
              <ZoomableImage src={matchedProduct.image_url} alt="" style={{ width: 70, height: 70, objectFit: "cover", borderRadius: 8, border: "1px solid #E0D8C5", flexShrink: 0 }} />
            ) : (
              <div style={{ width: 70, height: 70, borderRadius: 8, border: "1px dashed #E0D8C5", display: "flex", alignItems: "center", justifyContent: "center", color: "#8A8272", fontSize: 20, flexShrink: 0 }}>📦</div>
            )}
            <div>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623", fontSize: 16 }}>{matchedProduct.barcode}</div>
              <div style={{ color: "#2B2620", fontSize: 14 }}>{matchedProduct.name}</div>
            </div>
          </div>
          <div style={{ color: "#6B6355", fontSize: 12, marginTop: 4 }}>
            GRN: {grnNumberFor(matchedTask)} · Required: {matchedTask.qty} · Put away so far: {matchedTask.qty_completed || 0} · Remaining: {matchedRemaining}
          </div>

          <div style={S.label}>2. SCAN LOCATION</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <input list="ecomBinCodesDatalist" style={{ ...S.input, fontFamily: "'IBM Plex Mono', monospace", minWidth: 200 }} placeholder="Scan, ya bin code type karein"
              value={scanLocationInput} onChange={e => setScanLocationInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && scanLocation()} />
            <datalist id="ecomBinCodesDatalist">
              {bins.map(b => <option key={b.id} value={b.code} />)}
            </datalist>
            <CameraScanButton onScan={(text) => scanLocation(text)} />
            <button style={S.secondaryBtnSm} onClick={() => scanLocation()}>Set</button>
          </div>
          {matchedBinId && <div style={{ color: "#4CAF7D", fontSize: 12, marginTop: 6 }}>📍 {bins.find(b => b.id === matchedBinId)?.code}</div>}

          {isPieceMode ? (
            <>
              <div style={S.label}>3. HAR PIECE KE LIYE: PEHLE BARCODE SCAN, PHIR LOCATION SCAN</div>
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 28, fontWeight: 700, color: matchedRemaining <= 0 ? "#4CAF7D" : "#F5A623" }}>{matchedTask.qty_completed || 0} / {matchedTask.qty}</div>
                <div style={{ color: "#8A8272", fontSize: 11 }}>Scanning a location records 1 piece — for the next piece, scan the barcode again (even if it is the same location)</div>
              </div>
            </>
          ) : (
            <>
              <div style={S.label}>3. QUANTITY (type kar ke Enter dabayein — auto-save)</div>
              <input type="number" min={1} max={matchedRemaining} style={{ ...S.input, maxWidth: 140 }} value={scanQty} onChange={e => setScanQty(e.target.value)}
                onKeyDown={e => e.key === "Enter" && confirmPutaway()} />
            </>
          )}

          <div style={{ display: "flex", gap: 10, marginTop: 14, flexWrap: "wrap" }}>
            {!isPieceMode && <button style={S.primaryBtnSm} onClick={confirmPutaway}>✓ Confirm put away</button>}
            <button style={{ ...S.secondaryBtnSm, color: "#E5484D", borderColor: "#E5484D" }} onClick={() => setShortageOpen(!shortageOpen)}>⚠ Physical item nahi mila (RTV)</button>
            <button style={S.secondaryBtnSm} onClick={() => { setMatchedTaskId(null); setMatchedBinId(""); setShortageOpen(false); }}>Cancel</button>
          </div>
          {shortageOpen && (
            <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
              <input type="number" min={1} max={matchedRemaining} style={{ ...S.input, width: 140 }} placeholder={`Short qty (max ${matchedRemaining})`} value={shortageQty} onChange={e => setShortageQty(e.target.value)} />
              <button style={{ ...S.secondaryBtnSm, color: "#E5484D", borderColor: "#E5484D" }} onClick={reportShortage}>Report RTV</button>
            </div>
          )}
        </div>
      )}

      {canAssign && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Team Put Away Overview — all officers' assigned jobs ({teamTasks.length} lines pending)</div>
          <table>
            <thead><tr><th style={S.th}>Officer</th><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>Reference</th><th style={S.th}>Required</th><th style={S.th}>Put Away</th><th style={S.th}>Remaining</th></tr></thead>
            <tbody>
              {teamTasks.map(t => {
                const p = products[t.product_id];
                const completed = t.qty_completed || 0;
                const remaining = t.qty - completed;
                const officer = staff.find(s => s.id === t.assigned_to);
                return (
                  <tr key={t.id}>
                    <td style={{ ...S.td, color: "#2B2620" }}>{officer?.full_name || "—"}</td>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                    <td style={S.td}>{p?.name || "—"}</td>
                    <td style={{ ...S.td, color: "#6B6355" }}>{grnNumberFor(t)}</td>
                    <td style={{ ...S.td, color: "#6B6355" }}>{t.qty}</td>
                    <td style={{ ...S.td, color: "#6B6355" }}>{completed}</td>
                    <td style={{ ...S.td, color: remaining > 0 ? "#E5484D" : "#4CAF7D" }}>{remaining}</td>
                  </tr>
                );
              })}
              {teamTasks.length === 0 && <tr><td colSpan={7}><EmptyNote text="No assigned putaway jobs pending." /></td></tr>}
            </tbody>
          </table>
        </div>
      )}

      <div style={S.panel}>
        <div style={S.panelTitle}>My putaway jobs — tracking</div>
        <table>
          <thead><tr><th style={S.th}>Barcode</th><th style={S.th}>Product</th><th style={S.th}>GRN</th><th style={S.th}>Required</th><th style={S.th}>Put Away</th><th style={S.th}>Remaining</th><th style={S.th}>Location</th><th style={S.th}>Status</th></tr></thead>
          <tbody>
            {myAllTasks.map(t => {
              const p = products[t.product_id];
              const completed = t.qty_completed || 0;
              const remaining = t.qty - completed;
              const status = remaining <= 0 ? "Completed" : completed > 0 ? "Partial" : "Pending";
              const statusColor = status === "Completed" ? "#4CAF7D" : status === "Partial" ? "#F5A623" : "#6B6355";
              const bin = bins.find(b => b.id === t.bin_id);
              return (
                <tr key={t.id}>
                  <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{p?.barcode || "—"}</td>
                  <td style={S.td}>{p?.name || "—"}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{grnNumberFor(t)}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{t.qty}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{completed}</td>
                  <td style={{ ...S.td, color: remaining > 0 ? "#E5484D" : "#6B6355" }}>{remaining}</td>
                  <td style={{ ...S.td, color: "#6B6355" }}>{bin?.code || "—"}</td>
                  <td style={S.td}><span style={{ ...S.badgeSm, color: statusColor, borderColor: statusColor }}>{status}</span></td>
                </tr>
              );
            })}
            {myAllTasks.length === 0 && <tr><td colSpan={8}><EmptyNote text="No jobs assigned to you yet." /></td></tr>}
          </tbody>
        </table>
      </div>

      {canAssign && (
        <>
          <SectionTitle title="Unassigned putaway queue (assign to staff)" />
          <div style={S.cardGrid}>
            {unassignedTasks.map(t => <UnassignedCard key={t.id} t={t} />)}
            {unassignedTasks.length === 0 && <EmptyNote text="All tasks have been assigned." />}
          </div>
        </>
      )}
    </div>
  );
}

/* ================= INVENTORY ================= */
function computeAgingDays(onHand, putawayRowsAsc) {
  // putawayRowsAsc: [{qty_completed, grnDate, grnNumber}] sorted oldest-first by GRN receipt date
  if (!putawayRowsAsc || putawayRowsAsc.length === 0) return null; // no putaway history (e.g. opening stock import) — age unknown
  let remaining = onHand;
  for (const row of putawayRowsAsc) {
    remaining -= row.qty_completed;
    if (remaining <= 0) return { days: Math.floor((Date.now() - new Date(row.grnDate)) / 86400000), grnNumber: row.grnNumber };
  }
  // on_hand exceeds tracked putaway history — fall back to oldest known batch
  return { days: Math.floor((Date.now() - new Date(putawayRowsAsc[0].grnDate)) / 86400000), grnNumber: putawayRowsAsc[0].grnNumber };
}

function InventoryView({ token, profile, showToast }) {
  const [tab, setTab] = useState("ledger");
  const [rows, setRows] = useState([]);
  const [reserved, setReserved] = useState({});
  const [products, setProducts] = useState({});
  const [bins, setBins] = useState({});
  const [query, setQuery] = useState("");
  const [openingReport, setOpeningReport] = useState(null);
  const [importing, setImporting] = useState(false);
  const [putawayHistory, setPutawayHistory] = useState({}); // product_id -> [{qty_completed, completed_at}] asc
  const [putawayHistoryByBin, setPutawayHistoryByBin] = useState({}); // "product_id|bin_id" -> [...] asc
  const canImport = ["admin", "warehouse_lead"].includes(profile.role);
  const isAdmin = profile.role === "admin";
  const isWarehouseLead = profile.role === "warehouse_lead";
  const canAssignCounts = isAdmin || isWarehouseLead;
  const [cycleCounts, setCycleCounts] = useState([]);
  const [activeCount, setActiveCount] = useState(null);
  const [countLines, setCountLines] = useState([]);
  const [childCounts, setChildCounts] = useState([]); // for a "complete warehouse" parent audit
  const [newScopeType, setNewScopeType] = useState("bin");
  const [newScopeValue, setNewScopeValue] = useState("");
  const [newAssignee, setNewAssignee] = useState("");
  const [aisleAssignments, setAisleAssignments] = useState({}); // aisle -> staff id, for complete-warehouse
  const [staffList, setStaffList] = useState([]);
  const [startingCount, setStartingCount] = useState(false);
  const [verifyingCount, setVerifyingCount] = useState(false);
  const [approvingCount, setApprovingCount] = useState(false);
  const [trailProductId, setTrailProductId] = useState(null);
  const [trailData, setTrailData] = useState([]);
  const [trailLoading, setTrailLoading] = useState(false);

  // Full transaction trail for a product — where its PNA-HOLD/cycle-count movements came from
  // and went to, who did it, and when. Pulled from audit_trail, same pattern used for the
  // Sales Order detail timeline.
  const openTrail = async (productId) => {
    setTrailProductId(productId); setTrailLoading(true); setTrailData([]);
    try {
      const rows = await sb(`/rest/v1/audit_trail?entity_type=eq.inventory&entity_id=eq.${productId}&select=*&order=changed_at.desc`, { token });
      setTrailData(rows || []);
    } catch (e) { showToast("Trail load fail: " + e.message, "err"); }
    setTrailLoading(false);
  };

  const loadCycleCounts = useCallback(async () => {
    const [cc, staff] = await Promise.all([
      sb(`/rest/v1/cycle_counts?warehouse_id=eq.${profile.warehouse_id}&select=*&order=created_at.desc`, { token }),
      sb(`/rest/v1/profiles?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token })
    ]);
    setCycleCounts(cc || []);
    setStaffList(staff || []);
  }, [token, profile.warehouse_id]);
  useEffect(() => { loadCycleCounts(); }, [loadCycleCounts]);

  const allAisles = [...new Set(Object.values(bins).map(b => (b.code || "").split("-")[0]).filter(Boolean))].sort();

  const openCycleCount = async (cc) => {
    const lines = await sb(`/rest/v1/cycle_count_lines?cycle_count_id=eq.${cc.id}&select=*`, { token });
    setActiveCount(cc);
    setCountLines(lines || []);
    if (cc.scope_type === "all" && !cc.parent_audit_id) {
      const kids = await sb(`/rest/v1/cycle_counts?parent_audit_id=eq.${cc.id}&select=*`, { token });
      setChildCounts(kids || []);
    } else {
      setChildCounts([]);
    }
  };

  const createCountWithLines = async (scopeType, scopeValue, assignedTo, parentId) => {
    let scopedRows = rows;
    if (scopeType === "bin") scopedRows = rows.filter(r => r.bin_id === scopeValue);
    else if (scopeType === "aisle") scopedRows = rows.filter(r => (bins[r.bin_id]?.code || "").split("-")[0] === scopeValue);
    else if (scopeType === "category") scopedRows = rows.filter(r => products[r.product_id]?.category === scopeValue);
    scopedRows = scopedRows.filter(r => r.on_hand > 0);
    if (scopedRows.length === 0) return null;

    const cc = await sb(`/rest/v1/cycle_counts`, {
      method: "POST", token, prefer: "return=representation",
      body: { warehouse_id: profile.warehouse_id, scope_type: scopeType, scope_value: scopeValue, status: "counting", created_by: profile.id, assigned_to: assignedTo || null, parent_audit_id: parentId || null }
    });
    const lineBodies = scopedRows.map(r => ({ cycle_count_id: cc[0].id, product_id: r.product_id, bin_id: r.bin_id, system_qty: r.on_hand }));
    for (let i = 0; i < lineBodies.length; i += 100) {
      await sb(`/rest/v1/cycle_count_lines`, { method: "POST", token, body: lineBodies.slice(i, i + 100) });
    }
    return cc[0];
  };

  const startCycleCount = async () => {
    if (!canAssignCounts) return;
    setStartingCount(true);
    try {
      if (newScopeType === "all") {
        const assignedAisles = allAisles.filter(a => aisleAssignments[a]);
        if (assignedAisles.length === 0) { showToast("Kam se kam ek aisle ke liye staff assign karein", "err"); setStartingCount(false); return; }
        if (!window.confirm(`Poori warehouse audit shuru karein? Yeh daily operations ko hold kar dega jab tak audit complete na ho. ${assignedAisles.length} aisle(s), ${assignedAisles.length} staff members assigned.`)) { setStartingCount(false); return; }
        const parent = await sb(`/rest/v1/cycle_counts`, {
          method: "POST", token, prefer: "return=representation",
          body: { warehouse_id: profile.warehouse_id, scope_type: "all", scope_value: null, status: "counting", created_by: profile.id, hold_operations: true }
        });
        let created = 0;
        for (const aisle of assignedAisles) {
          const kid = await createCountWithLines("aisle", aisle, aisleAssignments[aisle], parent[0].id);
          if (kid) created++;
        }
        showToast(`✅ Complete Warehouse Audit shuru — ${created} aisle(s) assign ho gaye`);
        setAisleAssignments({});
        await loadCycleCounts();
        openCycleCount(parent[0]);
      } else {
        if (!newScopeValue) { showToast("Bin, Aisle, ya Category select karein", "err"); setStartingCount(false); return; }
        if (!newAssignee) { showToast("Kisi staff member ko assign karein", "err"); setStartingCount(false); return; }
        let resolvedScopeValue = newScopeValue;
        if (newScopeType === "bin") {
          const match = Object.values(bins).find(b => (b.code || "").toLowerCase() === newScopeValue.trim().toLowerCase());
          if (!match) { showToast(`Bin "${newScopeValue}" nahi mila — sahi code type karein`, "err"); setStartingCount(false); return; }
          resolvedScopeValue = match.id;
        } else if (newScopeType === "aisle") {
          if (!allAisles.includes(newScopeValue.trim().toUpperCase())) { showToast(`Aisle "${newScopeValue}" nahi mila`, "err"); setStartingCount(false); return; }
          resolvedScopeValue = newScopeValue.trim().toUpperCase();
        }
        const cc = await createCountWithLines(newScopeType, resolvedScopeValue, newAssignee, null);
        if (!cc) { showToast("Is scope mein koi stock nahi mila", "err"); setStartingCount(false); return; }
        showToast(`✅ Cycle count assign ho gayi ${staffList.find(s => s.id === newAssignee)?.full_name || ""} ko`);
        setNewScopeValue(""); setNewAssignee("");
        await loadCycleCounts();
        openCycleCount(cc);
      }
    } catch (e) { showToast("Start failed — dobara try karein", "err"); }
    setStartingCount(false);
  };

  const saveCountedQty = async (lineId, qty) => {
    const q = qty === "" ? null : Number(qty);
    setCountLines(prev => prev.map(l => l.id === lineId ? { ...l, counted_qty: q } : l));
    await sb(`/rest/v1/cycle_count_lines?id=eq.${lineId}`, { method: "PATCH", token, body: { counted_qty: q, counted_by: profile.id, counted_at: new Date().toISOString() } });
  };

  // Blind counting: the assigned counter uses the SAME scan mode already set for them under
  // Putaway (Bulk = scan once + type qty, Piece-to-Piece = scan every physical unit), and never
  // sees the system's expected qty while counting — only their own running tally, so the count
  // stays an honest independent check rather than a copy of what the system already says.
  const myCountMode = (profile.putaway_mode || "bulk") === "piece" ? "piece" : "bulk";
  const isMyBlindCount = !!(activeCount && activeCount.status === "counting" && profile.id === activeCount.assigned_to && !canAssignCounts);
  const [ccScanInput, setCcScanInput] = useState("");
  const [ccMatchedLine, setCcMatchedLine] = useState(null);
  const [ccBulkQty, setCcBulkQty] = useState("");
  const [ccUnknownProduct, setCcUnknownProduct] = useState(null);
  const [ccUnknownBinCode, setCcUnknownBinCode] = useState("");

  const ccScanProduct = (codeArg) => {
    const code = (codeArg !== undefined ? codeArg : ccScanInput).trim();
    setCcScanInput("");
    if (!code) return;
    const c = cleanCode(code);
    const product = Object.values(products).find(p => cleanCode(p.barcode) === c || cleanCode(p.sku) === c);
    if (!product) { showToast("Barcode/SKU match nahi hua", "err"); return; }
    const line = countLines.find(l => l.product_id === product.id);
    if (!line) {
      // Genuinely unexpected item — system has no record of this product in this bin at all.
      // Offer to add it as an excess line (system_qty 0) rather than just rejecting the scan,
      // so real excess still gets captured and shows up for the Lead to review.
      setCcUnknownProduct(product);
      setCcUnknownBinCode(activeCount.scope_type === "bin" ? (bins[activeCount.scope_value]?.code || "") : "");
      showToast(`⚠ ${product.barcode} is bin ki expected list mein nahi — Excess Item add karein`, "err");
      return;
    }
    if (myCountMode === "piece") {
      const newQty = (line.counted_qty || 0) + 1;
      saveCountedQty(line.id, newQty);
      showToast(`✓ 1 pc counted — ${product.barcode} (total ${newQty})`);
    } else {
      setCcMatchedLine(line);
      setCcBulkQty(String(line.counted_qty ?? ""));
      showToast(`✓ Matched: ${product.barcode} — qty likh kar confirm karein`);
    }
  };

  const ccConfirmBulk = () => {
    if (!ccMatchedLine) return;
    const q = ccBulkQty === "" ? NaN : Number(ccBulkQty);
    if (isNaN(q) || q < 0) { showToast("Valid qty enter karein", "err"); return; }
    saveCountedQty(ccMatchedLine.id, q);
    setCcMatchedLine(null); setCcBulkQty("");
  };

  const ccAddExcessItem = async () => {
    if (!ccUnknownProduct) return;
    let binId = activeCount.scope_type === "bin" ? activeCount.scope_value : null;
    if (!binId) {
      const match = Object.values(bins).find(b => (b.code || "").toLowerCase() === ccUnknownBinCode.trim().toLowerCase());
      if (!match) { showToast("Sahi bin code likhein jahan yeh item mili", "err"); return; }
      binId = match.id;
    }
    try {
      const isPiece = myCountMode === "piece";
      const created = await sb(`/rest/v1/cycle_count_lines`, {
        method: "POST", token, prefer: "return=representation",
        body: { cycle_count_id: activeCount.id, product_id: ccUnknownProduct.id, bin_id: binId, system_qty: 0, is_excess: true, counted_qty: isPiece ? 1 : null, counted_by: profile.id, counted_at: new Date().toISOString() }
      });
      setCountLines(cl => [...cl, created[0]]);
      setCcUnknownProduct(null); setCcUnknownBinCode("");
      if (isPiece) {
        showToast(`✓ Excess item add ho gaya — ${ccUnknownProduct.barcode} (1 pc counted)`);
      } else {
        setCcMatchedLine(created[0]); setCcBulkQty("");
        showToast(`✓ Excess item add ho gaya — ab total qty likhein`);
      }
    } catch (e) { showToast("Add fail: " + e.message, "err"); }
  };

  const submitForReview = async () => {
    const uncounted = countLines.filter(l => l.counted_qty === null || l.counted_qty === undefined);
    if (uncounted.length > 0 && !window.confirm(`${uncounted.length} line(s) abhi count nahi hui — sirf jo count ho chuki hain unhi ka review submit karein?`)) return;
    await sb(`/rest/v1/cycle_counts?id=eq.${activeCount.id}`, { method: "PATCH", token, body: { status: "pending_verification" } });
    showToast("✅ Warehouse Lead ki verification ke liye submit ho gaya");
    await loadCycleCounts();
    openCycleCount({ ...activeCount, status: "pending_verification" });
  };

  const verifyAndForward = async () => {
    setVerifyingCount(true);
    try {
      await sb(`/rest/v1/cycle_counts?id=eq.${activeCount.id}`, { method: "PATCH", token, body: { status: "pending_admin_approval", verified_by: profile.id, verified_at: new Date().toISOString() } });
      showToast("✅ Verify ho gaya — Admin ko adjustment approval ke liye forward kar diya");
      await loadCycleCounts();
      openCycleCount({ ...activeCount, status: "pending_admin_approval" });
    } catch (e) { showToast("Verify failed", "err"); }
    setVerifyingCount(false);
  };

  const [rejectReason, setRejectReason] = useState("");
  const [rejectingCount, setRejectingCount] = useState(false);
  const rejectToLead = async () => {
    if (!isAdmin) return;
    setRejectingCount(true);
    try {
      await sb(`/rest/v1/cycle_counts?id=eq.${activeCount.id}`, {
        method: "PATCH", token,
        body: { status: "pending_verification", admin_reject_reason: rejectReason.trim() || null, rejected_by: profile.id, rejected_at: new Date().toISOString(), verified_by: null, verified_at: null }
      });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "cycle_count", entity_id: activeCount.id, user_id: profile.id, action: "rejected_to_lead", metadata: { reason: rejectReason.trim() || null } } });
      showToast("↩ Warehouse Lead ko wapas bhej diya — reason record ho gayi");
      setRejectReason("");
      await loadCycleCounts();
      openCycleCount({ ...activeCount, status: "pending_verification" });
    } catch (e) { showToast("Reject failed", "err"); }
    setRejectingCount(false);
  };

  const saveVarianceNote = async (lineId, note) => {
    setCountLines(prev => prev.map(l => l.id === lineId ? { ...l, variance_note: note } : l));
    await sb(`/rest/v1/cycle_count_lines?id=eq.${lineId}`, { method: "PATCH", token, body: { variance_note: note || null } });
  };

  const approveAndAdjust = async () => {
    if (!isAdmin) { showToast("Sirf Admin hi final adjustment approve kar sakta hai", "err"); return; }
    setApprovingCount(true);
    try {
      const pnaBinRows = await sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&code=eq.PNA-HOLD&select=*`, { token });
      const pnaBinId = pnaBinRows?.[0]?.id;
      const toAdjust = countLines.filter(l => l.counted_qty !== null && l.counted_qty !== undefined && l.counted_qty !== l.system_qty);
      let reconciledFromPna = 0;
      for (const l of toAdjust) {
        const delta = l.counted_qty - l.system_qty;
        const p = products[l.product_id];
        let handledViaReconcile = false;

        // Excess found (counted > system) — check if this product has stock sitting in
        // PNA-HOLD first. If so, this is a MISPLACED item, not new stock out of nowhere —
        // transfer it out of PNA instead of recording a raw increase.
        if (delta > 0 && pnaBinId && l.bin_id !== pnaBinId) {
          const pnaInvRows = await sb(`/rest/v1/inventory?warehouse_id=eq.${profile.warehouse_id}&product_id=eq.${l.product_id}&bin_id=eq.${pnaBinId}&select=*`, { token });
          const pnaQty = pnaInvRows?.[0]?.on_hand || 0;
          if (pnaQty > 0) {
            const reconcileQty = Math.min(pnaQty, delta);
            await addOnHand(token, profile.warehouse_id, l.product_id, pnaBinId, -reconcileQty, { type: "pna_reconcile", userId: profile.id });

            await addOnHand(token, profile.warehouse_id, l.product_id, l.bin_id, reconcileQty, { type: "pna_reconcile", userId: profile.id });

            await sb(`/rest/v1/audit_trail`, { method: "POST", token, body: { entity_type: "inventory", entity_id: l.product_id, field_changed: `Cycle Count — Reconciled from PNA-HOLD (${p?.barcode || l.product_id})`, old_value: `PNA-HOLD: ${pnaQty}`, new_value: `${bins[l.bin_id]?.code || "—"}: +${reconcileQty}`, changed_by: profile.id } });
            reconciledFromPna += reconcileQty;
            handledViaReconcile = true;
            const remainder = delta - reconcileQty;
            if (remainder > 0) {
              await addOnHand(token, profile.warehouse_id, l.product_id, l.bin_id, remainder, { type: "pna_reconcile", userId: profile.id });

              await sb(`/rest/v1/audit_trail`, { method: "POST", token, body: { entity_type: "inventory", entity_id: l.product_id, field_changed: `Cycle Count Qty — ${p?.barcode || l.product_id} @ ${bins[l.bin_id]?.code || "—"}`, old_value: String(l.system_qty + reconcileQty), new_value: String(l.counted_qty), changed_by: profile.id } });
            }
          }
        }

        if (!handledViaReconcile) {
          await addOnHand(token, profile.warehouse_id, l.product_id, l.bin_id, delta, { type: "pna_reconcile", userId: profile.id });

          await sb(`/rest/v1/audit_trail`, { method: "POST", token, body: { entity_type: "inventory", entity_id: l.product_id, field_changed: `Cycle Count Qty — ${p?.barcode || l.product_id} @ ${bins[l.bin_id]?.code || "—"}`, old_value: String(l.system_qty), new_value: String(l.counted_qty), changed_by: profile.id } });
        }
        await sb(`/rest/v1/cycle_count_lines?id=eq.${l.id}`, { method: "PATCH", token, body: { adjusted: true } });
      }
      await sb(`/rest/v1/cycle_counts?id=eq.${activeCount.id}`, { method: "PATCH", token, body: { status: "approved", approved_by: profile.id, approved_at: new Date().toISOString() } });
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "cycle_count", entity_id: activeCount.id, user_id: profile.id, action: "approved_and_adjusted" } });
      showToast(`✅ ${toAdjust.length} adjustment(s) apply ho gayi${reconciledFromPna > 0 ? ` — ${reconciledFromPna} pcs PNA-HOLD se reconcile hui` : ""}`);
      setActiveCount(null); setCountLines([]);
      await loadCycleCounts(); await loadAll();
    } catch (e) { showToast("Approve failed — dobara try karein", "err"); }
    setApprovingCount(false);
  };

  const loadAll = useCallback(async () => {
      const [inv, res, prods, binList, putaway, grnLinesAll, grnAll] = await Promise.all([
        sb(`/rest/v1/inventory?warehouse_id=eq.${profile.warehouse_id}&select=*&limit=50000`, { token }),
        sb(`/rest/v1/inventory_reserved?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/products?select=*&limit=20000`, { token }),
        sb(`/rest/v1/bins?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
        sb(`/rest/v1/putaway_tasks?status=eq.completed&select=product_id,bin_id,qty_completed,completed_at,grn_line_id&order=completed_at.asc`, { token }),
        sb(`/rest/v1/grn_lines?select=id,grn_id`, { token }),
        sb(`/rest/v1/grn?select=id,grn_number,created_at`, { token })
      ]);
      setRows(inv || []);
      setReserved(Object.fromEntries((res || []).map(r => [r.product_id, r.reserved])));
      setProducts(Object.fromEntries((prods || []).map(p => [p.id, p])));
      setBins(Object.fromEntries((binList || []).map(b => [b.id, b])));
      const glMap = Object.fromEntries((grnLinesAll || []).map(l => [l.id, l]));
      const grnMap = Object.fromEntries((grnAll || []).map(g => [g.id, g]));
      const byProduct = {}, byBin = {};
      for (const p of putaway || []) {
        if (!p.qty_completed || !p.completed_at) continue;
        // Age must reflect the GRN's actual receipt date (when it was inbound), not when it was
        // physically shelved — different GRNs of the same SKU must never share an ageing clock.
        const gl = p.grn_line_id ? glMap[p.grn_line_id] : null;
        const grn = gl ? grnMap[gl.grn_id] : null;
        const grnDate = grn ? grn.created_at : p.completed_at; // return-sourced putaway has no GRN — fall back
        const grnNumber = grn ? grn.grn_number : "Return";
        const row = { qty_completed: p.qty_completed, completed_at: p.completed_at, grnDate, grnNumber };
        if (!byProduct[p.product_id]) byProduct[p.product_id] = [];
        byProduct[p.product_id].push(row);
        const binKey = `${p.product_id}|${p.bin_id}`;
        if (!byBin[binKey]) byBin[binKey] = [];
        byBin[binKey].push(row);
      }
      // Sort each batch list by GRN receipt date (FIFO by inbound date, not putaway date)
      for (const k in byProduct) byProduct[k].sort((a, b) => new Date(a.grnDate) - new Date(b.grnDate));
      for (const k in byBin) byBin[k].sort((a, b) => new Date(a.grnDate) - new Date(b.grnDate));
      setPutawayHistory(byProduct);
      setPutawayHistoryByBin(byBin);
  }, [token, profile.warehouse_id]);

  const handleOpeningStockFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImporting(true); setOpeningReport(null);
    try {
      const rows2 = await parseSheet(file);
      if (rows2.length === 0) { showToast("File khali hai", "err"); setImporting(false); return; }
      const map = buildColumnMap(Object.keys(rows2[0]));
      if (!map.barcode) { showToast("Barcode column nahi mila", "err"); setImporting(false); return; }
      const fileBarcodes = rows2.map(r => getVal(r, map, "barcode"));
      const productMap = await fetchProductsByBarcodes(token, fileBarcodes);
      const binCodeHeader = Object.keys(rows2[0]).find(h => normHeader(h) === "bin" || normHeader(h) === "location") || null;
      const valid = [], invalid = [];
      for (const [i, row] of rows2.entries()) {
        const barcode = cleanCode(getVal(row, map, "barcode"));
        const qty = Number(getVal(row, map, "qty"));
        const product = barcode ? productMap[barcode] : null;
        const binCode = binCodeHeader ? String(row[binCodeHeader] || "").trim() : "";
        if (!barcode || !product || !qty || qty <= 0) { invalid.push({ rowNum: i + 2, barcode, qty }); continue; }
        valid.push({ product, qty, binCode });
      }
      setOpeningReport({ valid, invalid, fileName: file.name });
      showToast(`Validated: ${valid.length} valid, ${invalid.length} invalid`);
    } catch (err) { showToast(`Validation failed: ${(err.message || "").slice(0, 100)}`, "err"); }
    setImporting(false);
  };

  const [importProgress, setImportProgress] = useState(null); // { done, total }

  const confirmOpeningStock = async () => {
    if (!openingReport) return;
    setImporting(true);
    setImportProgress({ done: 0, total: openingReport.valid.length });
    const binCache = {};
    const failedRows = [];
    let count = 0;
    const BATCH = 15;
    try {
      for (let i = 0; i < openingReport.valid.length; i += BATCH) {
        const chunk = openingReport.valid.slice(i, i + BATCH);
        await Promise.all(chunk.map(async (r) => {
          try {
            let binId = null;
            if (r.binCode) {
              if (!binCache[r.binCode]) {
                let existing = Object.values(bins).find(b => b.code.toLowerCase() === r.binCode.toLowerCase());
                if (!existing) {
                  const created = await sb(`/rest/v1/bins`, { method: "POST", token, prefer: "return=representation", body: { warehouse_id: profile.warehouse_id, code: r.binCode } });
                  existing = created[0];
                }
                binCache[r.binCode] = existing;
              }
              binId = binCache[r.binCode].id;
            }
            await addOnHand(token, profile.warehouse_id, r.product.id, binId, r.qty, { type: "return", userId: profile.id });

            count++;
          } catch (e) {
            failedRows.push({ barcode: r.product?.barcode || r.barcode, reason: (e.message || "").slice(0, 80) });
          }
        }));
        setImportProgress({ done: Math.min(i + BATCH, openingReport.valid.length), total: openingReport.valid.length });
      }
      await sb(`/rest/v1/event_log`, { method: "POST", token, body: { entity_type: "inventory", entity_id: profile.warehouse_id, user_id: profile.id, action: "opening_stock_import", metadata: { imported: count, failed: failedRows.length, file: openingReport.fileName } } });
      if (failedRows.length > 0) {
        showToast(`⚠ ${count} imported, ${failedRows.length} fail ho gaye (network/data issue) — inhe dobara try karein: ${failedRows.slice(0, 5).map(f => f.barcode).join(", ")}${failedRows.length > 5 ? "…" : ""}`, "err");
      } else {
        showToast(`✅ ${count} opening stock lines imported`);
      }
      setOpeningReport(null);
      loadAll();
    } catch (e) { showToast(`Import failed after ${count} lines — dobara try karein`, "err"); }
    setImporting(false);
    setImportProgress(null);
  };

  useEffect(() => { loadAll(); }, [loadAll]);

  const q = query.trim().toLowerCase();

  // Ledger: aggregate on_hand per product across all bins, minus reserved = net available
  const ledger = (() => {
    const byProduct = {};
    for (const r of rows) {
      if (!byProduct[r.product_id]) byProduct[r.product_id] = 0;
      byProduct[r.product_id] += r.on_hand;
    }
    return Object.entries(byProduct).map(([productId, onHand]) => {
      const res = reserved[productId] || 0;
      return { productId, onHand, reserved: res, available: onHand - res };
    }).filter(r => r.onHand > 0).filter(r => {
      const p = products[r.productId];
      if (!q) return true;
      return (p?.barcode || "").toLowerCase().includes(q) || (p?.name || "").toLowerCase().includes(q);
    }).sort((a, b) => (products[b.productId]?.name || "").localeCompare(products[a.productId]?.name || ""));
  })();

  const binRows = rows.filter(r => r.on_hand > 0).filter(r => {
    if (!q) return true;
    const p = products[r.product_id];
    const bin = Array.isArray(bins) ? bins.find(b => b.id === r.bin_id) : bins[r.bin_id];
    return (p?.barcode || "").toLowerCase().includes(q) || (p?.name || "").toLowerCase().includes(q) || (bin?.code || "").toLowerCase().includes(q);
  });

  const [transferRow, setTransferRow] = useState(null); // { product_id, pnaBinId, maxQty }
  const [transferDestBin, setTransferDestBin] = useState("");
  const [transferQty, setTransferQty] = useState("");
  const [transferring, setTransferring] = useState(false);

  const confirmTransferFromPna = async () => {
    const destBin = Object.values(bins).find(b => (b.code || "").toLowerCase() === transferDestBin.trim().toLowerCase());
    if (!destBin) { showToast("Sahi destination bin code likhein (jo list mein maujood ho)", "err"); return; }
    const qty = Number(transferQty);
    if (!qty || qty <= 0 || qty > transferRow.maxQty) { showToast(`Qty 1 se ${transferRow.maxQty} ke beech honi chahiye`, "err"); return; }
    setTransferring(true);
    try {
      await addOnHand(token, profile.warehouse_id, transferRow.product_id, transferRow.pnaBinId, -qty, { type: "pna_transfer", userId: profile.id });

      await addOnHand(token, profile.warehouse_id, transferRow.product_id, destBin.id, qty, { type: "pna_transfer", userId: profile.id });

      const p = products[transferRow.product_id];
      await sb(`/rest/v1/audit_trail`, { method: "POST", token, body: { entity_type: "inventory", entity_id: transferRow.product_id, field_changed: `PNA-HOLD se mila (${p?.barcode || transferRow.product_id})`, old_value: `PNA-HOLD: ${qty}`, new_value: `${destBin.code}: +${qty}`, changed_by: profile.id } });
      showToast(`✅ ${qty} pcs PNA-HOLD se ${destBin.code} mein transfer ho gayi`);
      setTransferRow(null); setTransferDestBin(""); setTransferQty("");
      await loadAll();
    } catch (e) { showToast("Transfer failed — dobara try karein", "err"); }
    setTransferring(false);
  };

  return (
    <div>
      <SectionTitle title="Inventory" action={
        canImport ? (
          <label style={{ ...S.secondaryBtnSm, cursor: "pointer" }}>
            {importing ? "Importing…" : "📤 Import Opening Stock"}
            <input type="file" accept=".csv,.xlsx,.xls" style={{ display: "none" }} onChange={handleOpeningStockFile} disabled={importing} />
          </label>
        ) : null
      } />
      {openingReport && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Opening Stock — validation report ({openingReport.fileName})</div>
          <div style={{ display: "flex", gap: 20, marginBottom: 12 }}>
            <div><span style={{ color: "#4CAF7D", fontWeight: 700, fontSize: 18 }}>{openingReport.valid.length}</span> <span style={{ color: "#6B6355", fontSize: 12 }}>valid</span></div>
            <div><span style={{ color: "#E5484D", fontWeight: 700, fontSize: 18 }}>{openingReport.invalid.length}</span> <span style={{ color: "#6B6355", fontSize: 12 }}>invalid (skipped)</span></div>
          </div>
          {openingReport.invalid.length > 0 && (
            <div style={{ fontSize: 11, color: "#E5484D", marginBottom: 10 }}>
              Row(s): {openingReport.invalid.slice(0, 15).map(r => `#${r.rowNum} (${r.barcode || "no barcode"})`).join(", ")}{openingReport.invalid.length > 15 ? "…" : ""}
            </div>
          )}
          <div style={{ display: "flex", gap: 10 }}>
            <button style={S.primaryBtnSm} onClick={confirmOpeningStock} disabled={importing || openingReport.valid.length === 0}>✓ Confirm & add stock ({openingReport.valid.length})</button>
            <button style={S.secondaryBtnSm} onClick={() => setOpeningReport(null)} disabled={importing}>Cancel</button>
          </div>
          {importProgress && (
            <div style={{ marginTop: 12 }}>
              <div style={{ background: "#EFE8D8", borderRadius: 6, height: 10, overflow: "hidden" }}>
                <div style={{ background: "#F5A623", height: "100%", width: `${Math.round((importProgress.done / importProgress.total) * 100)}%`, transition: "width 0.2s" }} />
              </div>
              <div style={{ color: "#6B6355", fontSize: 12, marginTop: 6 }}>Importing… {importProgress.done} / {importProgress.total}</div>
            </div>
          )}
        </div>
      )}
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <button onClick={() => setTab("ledger")} style={{ ...S.pill, ...(tab === "ledger" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>📒 Inventory Ledger</button>
        <button onClick={() => setTab("bins")} style={{ ...S.pill, ...(tab === "bins" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>🗺 Bin-wise Inventory</button>
        <button onClick={() => setTab("cyclecount")} style={{ ...S.pill, ...(tab === "cyclecount" ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>🔢 Cycle Count</button>
      </div>
      <input style={{ ...S.input, maxWidth: 340, marginBottom: 14 }} placeholder={tab === "bins" ? "🔍 Search barcode, product name, or bin location…" : "🔍 Search by barcode or product name…"} value={query} onChange={e => setQuery(e.target.value)} />

      {tab === "ledger" && (
        <div style={S.panel}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 12, marginBottom: 16 }}>

              <div style={{ color: "#4CAF7D", fontSize: 10, letterSpacing: 1, fontWeight: 700 }}>TOTAL AVAILABLE QTY</div>
              <div style={{ color: "#2B2620", fontSize: 26, fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif", marginTop: 4 }}>{ledger.reduce((s, r) => s + r.available, 0)}</div>
