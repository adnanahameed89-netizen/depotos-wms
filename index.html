          sb(`/rest/v1/pick_tasks?status=eq.picked&select=*`, { token }),
          sb(`/rest/v1/pick_task_lines?select=*`, { token }),
          sb(`/rest/v1/pack_tasks?status=eq.labeled&select=*`, { token }),
          sb(`/rest/v1/putaway_tasks?status=eq.completed&select=*`, { token }),
          sb(`/rest/v1/pna_records?select=*`, { token }),
          sb(`/rest/v1/order_shortage_lines?select=*`, { token }),
          sb(`/rest/v1/returns?select=*`, { token }),
          sb(`/rest/v1/return_lines?select=*`, { token }),
          sb(`/rest/v1/load_sheets?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
          sb(`/rest/v1/sales_orders?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
          sb(`/rest/v1/holidays?select=*`, { token }),
          sb(`/rest/v1/grn?warehouse_id=eq.${profile.warehouse_id}&select=*`, { token }),
          sb(`/rest/v1/grn_lines?select=*`, { token }),
          sb(`/rest/v1/rtv_returns?select=*`, { token }),
          sb(`/rest/v1/kpi_manual_entries?review_period=eq.${reviewPeriod}&select=*`, { token })
        ]);
        const manualMap = Object.fromEntries((manualAll || []).map(m => [`${m.user_id}|${m.metric_key}`, m]));
        setManualEntries(manualMap);
        const profMap = Object.fromEntries((profs || []).map(p => [p.id, p]));
        setProfiles(profMap);
        setTargets(tg || []);
        const targetsByRole = {};
        for (const t of tg || []) { if (!targetsByRole[t.role]) targetsByRole[t.role] = []; targetsByRole[t.role].push(t); }
        const holidayDates = new Set((holidayRows || []).map(h => new Date(h.holiday_date).toDateString()));
        const effDays = (start, end) => {
          let days = Math.floor((new Date(end.toDateString()) - new Date(start.toDateString())) / 86400000);
          const cur = new Date(start);
          for (let i = 0; i < days; i++) { cur.setDate(cur.getDate() + 1); if (holidayDates.has(cur.toDateString())) days--; }
          return days;
        };

        // ---- Receiving (warehouse-wide card, not per-individual — no dedicated role in this system) ----
        const totalGrnLines = (grnLinesAll || []).length;
        const glIdsWithRtv = new Set((rtvAll || []).map(r => r.grn_line_id));
        const mismatchedLines = (grnLinesAll || []).filter(l => glIdsWithRtv.has(l.id)).length;
        setReceivingCard(totalGrnLines > 0 ? {
          receiving_accuracy: ((totalGrnLines - mismatchedLines) / totalGrnLines) * 100,
          discrepancy_rate: (mismatchedLines / totalGrnLines) * 100
        } : null);

        // ---- Per-staff metric accumulators ----
        const staff = {};
        const ensure = (uid) => {
          if (!staff[uid]) staff[uid] = { metrics: {}, ordersPackedByDay: {} };
          return staff[uid];
        };

        // Putaway Officer (Inbound Officer: Receiving + Put Away + Returns)
        const pwByOfficer = {};
        for (const t of putawayAll || []) {
          if (!t.assigned_to) continue;
          if (!pwByOfficer[t.assigned_to]) pwByOfficer[t.assigned_to] = [];
          pwByOfficer[t.assigned_to].push(t);
        }
        for (const [uid, tasks] of Object.entries(pwByOfficer)) {
          const withTimes = tasks.filter(t => t.started_at && t.completed_at);
          const totalHrs = withTimes.reduce((s, t) => s + (new Date(t.completed_at) - new Date(t.started_at)) / 3600000, 0);
          const totalPcs = withTimes.reduce((s, t) => s + (t.qty_completed || 0), 0);
          const u = ensure(uid);
          u.metrics.putaway_productivity_pcs = totalHrs > 0.02 ? totalPcs / totalHrs : null;
          u.metrics.putaway_cycle_time = withTimes.length ? withTimes.reduce((s, t) => s + (new Date(t.completed_at) - new Date(t.started_at)) / 3600000, 0) / withTimes.length : null;
        }
        // Returns Processing Volume (pcs/day) — attributed to whoever processed the return
        const returnsPcsByDay = {};
        for (const r of returnsAll || []) {
          if (!r.processed_by || !r.processed_at) continue;
          const qty = (returnLinesAll || []).filter(l => l.return_id === r.id).reduce((s, l) => s + (l.qty || 0), 0);
          const day = new Date(r.processed_at).toDateString();
          if (!returnsPcsByDay[r.processed_by]) returnsPcsByDay[r.processed_by] = {};
          returnsPcsByDay[r.processed_by][day] = (returnsPcsByDay[r.processed_by][day] || 0) + qty;
        }
        for (const [uid, days] of Object.entries(returnsPcsByDay)) {
          const dayVals = Object.values(days);
          if (dayVals.length) ensure(uid).metrics.returns_processing_volume = dayVals.reduce((a, b) => a + b, 0) / dayVals.length;
        }

        // Picker
        const pkByPicker = {};
        for (const t of pickTasksAll || []) {
          if (!t.assigned_to) continue;
          if (!pkByPicker[t.assigned_to]) pkByPicker[t.assigned_to] = [];
          pkByPicker[t.assigned_to].push(t);
        }
        const pickerOrderTotal = {}, pickerShortOrders = {};
        for (const r of [...(pnaAll || []).map(x => ({ order_id: x.order_id, by: x.reported_by }))]) {
          if (r.by && r.order_id) { if (!pickerShortOrders[r.by]) pickerShortOrders[r.by] = new Set(); pickerShortOrders[r.by].add(r.order_id); }
        }
        for (const [uid, tasks] of Object.entries(pkByPicker)) {
          const withTimes = tasks.filter(t => t.assigned_at && t.completed_at);
          const totalHrs = withTimes.reduce((s, t) => s + (new Date(t.completed_at) - new Date(t.assigned_at)) / 3600000, 0);
          const lineCount = (pickLinesAll || []).filter(l => tasks.some(t => t.id === l.pick_task_id)).length;
          const avgAssignMin = withTimes.length ? withTimes.reduce((s, t) => s + (new Date(t.completed_at) - new Date(t.assigned_at)) / 60000, 0) / withTimes.length : null;
          const u = ensure(uid);
          u.metrics.picking_productivity = totalHrs > 0.05 ? lineCount / totalHrs : null;
          u.metrics.pick_sla = avgAssignMin;
          const shortRate = tasks.length > 0 ? ((pickerShortOrders[uid]?.size || 0) / tasks.length) * 100 : null;
          u.metrics.picking_accuracy = shortRate != null ? 100 - shortRate : null;
        }

        // Packer
        for (const t of packTasksAll || []) {
          if (!t.assigned_to || !t.completed_at) continue;
          const u = ensure(t.assigned_to);
          const day = new Date(t.completed_at).toDateString();
          u.ordersPackedByDay[day] = (u.ordersPackedByDay[day] || 0) + 1;
        }
        for (const uid of Object.keys(staff)) {
          const days = Object.values(staff[uid].ordersPackedByDay || {});
          if (days.length > 0) staff[uid].metrics.packing_productivity = days.reduce((a, b) => a + b, 0) / days.length;
        }

        // Dispatcher
        const lsByDispatcher = {};
        for (const ls of loadSheetsAll || []) {
          if (!ls.created_by) continue;
          if (!lsByDispatcher[ls.created_by]) lsByDispatcher[ls.created_by] = [];
          lsByDispatcher[ls.created_by].push(ls);
        }
        for (const [uid, sheets] of Object.entries(lsByDispatcher)) {
          const orderIds = sheets.flatMap(s => s.order_ids || []);
          const relevantOrders = (ordersAll || []).filter(o => orderIds.includes(o.id) && o.received_at && o.dispatched_at);
          let onTime = 0;
          for (const o of relevantOrders) { if (effDays(new Date(o.received_at), new Date(o.dispatched_at)) <= 1) onTime++; }
          const u = ensure(uid);
          u.metrics.on_time_dispatch = relevantOrders.length ? (onTime / relevantOrders.length) * 100 : null;
        }

        // Returns Agent
        const returnsByAgent = {};
        for (const r of returnsAll || []) {
          if (!r.processed_by) continue;
          if (!returnsByAgent[r.processed_by]) returnsByAgent[r.processed_by] = [];
          returnsByAgent[r.processed_by].push(r);
        }
        for (const [uid, list] of Object.entries(returnsByAgent)) {
          const durations = list.filter(r => r.received_at && r.processed_at).map(r => (new Date(r.processed_at) - new Date(r.received_at)) / 3600000);
          const u = ensure(uid);
          u.metrics.returns_processing_time = durations.length ? durations.reduce((a, b) => a + b, 0) / durations.length : null;
          const damagedLines = (returnLinesAll || []).filter(l => list.some(r => r.id === l.return_id) && l.condition === "damaged");
          u.metrics.damage_documentation_rate = damagedLines.length ? 100 : null; // logged automatically by design
        }
        // Returns Backlog (warehouse-wide, not per-agent — backlog is a queue state, not individual)
        const pendingReturns = (returnsAll || []).filter(r => r.status === "pending");
        const oldPending = pendingReturns.filter(r => (Date.now() - new Date(r.received_at)) / 3600000 > 48);
        const backlogRate = pendingReturns.length ? (oldPending.length / pendingReturns.length) * 100 : 0;
        for (const uid of Object.keys(returnsByAgent)) ensure(uid).metrics.returns_backlog = backlogRate;

        // Warehouse Lead (Fulfillment Executive, approved framework) / Supervisor (old metric set, unchanged)
        const totalPwLines = (putawayAll || []).length;
        const invAccuracy = totalPwLines > 0 ? (1 - (pnaAll || []).length / totalPwLines) * 100 : null;
        const dispatchedAll = (ordersAll || []).filter(o => o.received_at && o.dispatched_at);
        let onTimeAll = 0;
        for (const o of dispatchedAll) { if (effDays(new Date(o.received_at), new Date(o.dispatched_at)) <= 1) onTimeAll++; }
        const fulfillment24 = dispatchedAll.length ? (onTimeAll / dispatchedAll.length) * 100 : null;
        const shortageOrderIdsWl = new Set((shortageAll || []).map(s => s.order_id));
        const allOrdersCount = (ordersAll || []).length;
        const noShortageAllOrders = allOrdersCount ? ((ordersAll || []).filter(o => !shortageOrderIdsWl.has(o.id)).length / allOrdersCount) * 100 : null;
        const dispatchedNoShortage = dispatchedAll.length ? (dispatchedAll.filter(o => !shortageOrderIdsWl.has(o.id)).length / dispatchedAll.length) * 100 : null;
        for (const p of profs || []) {
          if (p.role === "supervisor") {
            const u = ensure(p.id);
            u.metrics.inventory_accuracy = invAccuracy;
            u.metrics.fulfillment_24hr = fulfillment24;
          }
          if (p.role === "warehouse_lead") {
            const u = ensure(p.id);
            u.metrics.order_fill_rate = noShortageAllOrders;
            u.metrics.dispatch_sla_24hr = fulfillment24;
            u.metrics.fulfillment_accuracy = dispatchedNoShortage;
          }
        }

        // ---- Combine into weighted scores per staff — scored by ACTUAL capacity performed ----
        // (not just the single role stored on their profile, since one person can genuinely do
        // more than one job — e.g. the same user acting as both Returns Agent and Putaway Officer)
        const capacityPairs = []; // {uid, capacityRole}
        for (const uid of Object.keys(pwByOfficer)) capacityPairs.push({ uid, capacityRole: "putaway_officer" });
        for (const uid of Object.keys(pkByPicker)) capacityPairs.push({ uid, capacityRole: "picker" });
        for (const uid of Object.keys(staff)) { if (Object.keys(staff[uid].ordersPackedByDay || {}).length > 0) capacityPairs.push({ uid, capacityRole: "packer" }); }
        for (const uid of Object.keys(lsByDispatcher)) capacityPairs.push({ uid, capacityRole: "dispatcher" });
        for (const uid of Object.keys(returnsByAgent)) capacityPairs.push({ uid, capacityRole: "returns_agent" });
        for (const p of profs || []) { if (["warehouse_lead", "supervisor"].includes(p.role)) capacityPairs.push({ uid: p.id, capacityRole: p.role }); }
        // dedupe (a uid could appear more than once for the same capacity via different source maps — not expected, but safe)
        const seenPairs = new Set();
        const uniquePairs = capacityPairs.filter(cp => {
          const key = `${cp.uid}|${cp.capacityRole}`;
          if (seenPairs.has(key)) return false;
          seenPairs.add(key); return true;
        });

        const result = [];
        for (const { uid, capacityRole } of uniquePairs) {
          const p = profMap[uid];
          if (!p) continue; // task assigned to a user outside this warehouse's profile list
          const roleTargets = targetsByRole[capacityRole] || [];
          if (roleTargets.length === 0) continue;
          const u = staff[uid] || { metrics: {} };
          const metricRows = [];
          let weightedSum = 0, weightUsed = 0;
          for (const t of roleTargets) {
            const val = u.metrics[t.metric_key];
            let achievementPct = null;
            if (t.computable && val != null && !isNaN(val)) {
              if (t.target_direction === "gte") achievementPct = Math.min(100, (val / t.target_value) * 100);
              else achievementPct = val <= t.target_value ? 100 : Math.max(0, 100 - ((val - t.target_value) / t.target_value) * 100);
              weightedSum += achievementPct * t.weight;
              weightUsed += t.weight;
            }
            const manual = manualMap[`${uid}|${t.metric_key}`];
            if (!t.computable && manual) {
              achievementPct = manual.achievement_pct;
              weightedSum += achievementPct * t.weight;
              weightUsed += t.weight;
            }
            metricRows.push({ ...t, value: val, achievementPct, manualValue: manual ? manual.achievement_pct : null });
          }
          const score = weightUsed > 0 ? weightedSum / weightUsed : null;
          result.push({
            userId: uid, name: p.full_name, role: capacityRole,
            metrics: metricRows, score, rating: score != null ? ratingFor(score) : null,
            packerTier: capacityRole === "packer" && u.metrics.packing_productivity != null ? tierFor(u.metrics.packing_productivity) : null,
            packingVolume: u.metrics.packing_productivity
          });
        }
        setScores(result.sort((a, b) => (b.score || 0) - (a.score || 0)));
      } catch (e) { showToast("KPI load failed", "err"); }
      setLoading(false);
    })();
  }, [token, profile.warehouse_id, reviewPeriod]);

  const saveManualEntry = async (userId, metricKey, value) => {
    const num = Number(value);
    if (isNaN(num) || num < 0 || num > 100) { showToast("0-100 ke darmiyan number enter karein", "err"); return; }
    const key = `${userId}|${metricKey}`;
    setSavingManual(key);
    try {
      await sb(`/rest/v1/kpi_manual_entries`, {
        method: "POST", token, prefer: "resolution=merge-duplicates",
        body: { user_id: userId, metric_key: metricKey, review_period: reviewPeriod, achievement_pct: num, entered_by: profile.id }
      });
      showToast("Saved");
      setManualEntries(prev => ({ ...prev, [key]: { achievement_pct: num } }));
      setScores(prev => prev.map(s => s.userId !== userId ? s : (() => {
        const metrics = s.metrics.map(m => m.metric_key !== metricKey ? m : { ...m, achievementPct: num, manualValue: num });
        let weightedSum = 0, weightUsed = 0;
        for (const m of metrics) { if (m.achievementPct != null) { weightedSum += m.achievementPct * m.weight; weightUsed += m.weight; } }
        const score = weightUsed > 0 ? weightedSum / weightUsed : null;
        return { ...s, metrics, score, rating: score != null ? ratingFor(score) : null };
      })()));
    } catch (e) { showToast("Save failed — pehle SQL migration chalayein (kpi_manual_entries)", "err"); }
    setSavingManual("");
  };

  const visibleScores = isManager
    ? scores.filter(s => selectedRole === "all" || s.role === selectedRole)
    : scores.filter(s => s.userId === profile.id);

  const fmtVal = (v, unit) => v == null ? "—" : `${v.toFixed(1)}${unit === "%" ? "%" : " " + unit}`;

  return (
    <div>
      <SectionTitle title="Staff KPI Framework" action={
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ color: "#6B6355", fontSize: 12 }}>Review Period:</span>
          <input style={{ ...S.input, width: 100, padding: "6px 10px" }} value={reviewPeriod} onChange={e => setReviewPeriod(e.target.value)} placeholder="2026-Q3" />
        </div>
      } />
      {loading ? <EmptyNote text="Loading…" /> : (
        <>
          {receivingCard && isManager && (
            <div style={S.panel}>
              <div style={S.panelTitle}>Receiving / GRN — Warehouse-Wide</div>
              <div style={{ color: "#8A8272", fontSize: 10, marginBottom: 10 }}>GRN entry is an Admin/Warehouse Lead action in this system, not a dedicated staff role — shown warehouse-wide.</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 12 }}>
                <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
                  <div style={{ fontSize: 22, fontWeight: 700, color: receivingCard.receiving_accuracy >= 98 ? "#4CAF7D" : "#E5484D" }}>{receivingCard.receiving_accuracy.toFixed(1)}%</div>
                  <div style={{ color: "#6B6355", fontSize: 11 }}>Receiving Accuracy (target ≥98%)</div>
                </div>
                <div style={{ background: "#F4EFE6", borderRadius: 8, padding: 14, border: "1px solid #E0D8C5" }}>
                  <div style={{ fontSize: 22, fontWeight: 700, color: receivingCard.discrepancy_rate <= 2 ? "#4CAF7D" : "#E5484D" }}>{receivingCard.discrepancy_rate.toFixed(1)}%</div>
                  <div style={{ color: "#6B6355", fontSize: 11 }}>Discrepancy Rate (target ≤2%)</div>
                </div>
              </div>
            </div>
          )}

          {isManager && (
            <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
              {["all", "putaway_officer", "picker", "packer", "dispatcher", "returns_agent", "warehouse_lead", "supervisor"].map(r => (
                <button key={r} onClick={() => setSelectedRole(r)} style={{ ...S.pill, ...(selectedRole === r ? { background: "#F5A623", color: "#1A1206", borderColor: "#F5A623" } : {}) }}>{ROLE_LABEL_GLOBAL[r] || r}</button>
              ))}
            </div>
          )}

          {visibleScores.map(s => (
            <div key={s.userId} style={S.panel}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
                <div>
                  <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 16, color: "#2B2620" }}>{s.name}</div>
                  <div style={{ color: "#6B6355", fontSize: 11 }}>{ROLE_LABEL_GLOBAL[s.role] || s.role}</div>
                </div>
                {s.score != null ? (
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 24, fontWeight: 700, color: s.rating.color }}>{s.score.toFixed(0)}</div>
                    <div style={{ fontSize: 11, color: s.rating.color, fontWeight: 600 }}>{s.rating.label}</div>
                  </div>
                ) : <div style={{ color: "#8A8272", fontSize: 12 }}>Not enough data yet</div>}
              </div>

              {s.packerTier && (
                <div style={{ marginTop: 10, padding: "8px 12px", background: "#F4EFE6", borderRadius: 8, border: `1px solid ${s.packerTier.color}` }}>
                  <span style={{ color: s.packerTier.color, fontWeight: 700, fontSize: 12 }}>{s.packerTier.tag}</span>
                  <span style={{ color: "#6B6355", fontSize: 12, marginLeft: 8 }}>{s.packingVolume.toFixed(1)} orders/day avg — {s.packerTier.label}</span>
                </div>
              )}

              <table style={{ marginTop: 10 }}>
                <thead><tr><th style={S.th}>Metric</th><th style={S.th}>Target</th><th style={S.th}>Actual</th><th style={S.th}>Weight</th><th style={S.th}>Achievement</th></tr></thead>
                <tbody>
                  {s.metrics.map(m => (
                    <tr key={m.metric_key}>
                      <td style={S.td}>{m.metric_name}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{m.target_direction === "gte" ? "≥" : "≤"}{m.target_value}{m.unit}</td>
                      <td style={{ ...S.td, color: "#6B6355" }}>
                        {m.computable ? fmtVal(m.value, m.unit) : (
                          canEnterManual ? (
                            <input type="number" min={0} max={100} placeholder="Enter %"
                              defaultValue={m.manualValue != null ? m.manualValue : ""}
                              style={{ ...S.input, width: 80, padding: "4px 8px", fontSize: 12 }}
                              onBlur={e => { if (e.target.value !== "" && Number(e.target.value) !== m.manualValue) saveManualEntry(s.userId, m.metric_key, e.target.value); }} />
                          ) : (m.manualValue != null ? <span>{m.manualValue}%</span> : <span style={{ color: "#8A8272", fontStyle: "italic" }}>Awaiting entry</span>)
                        )}
                      </td>
                      <td style={{ ...S.td, color: "#6B6355" }}>{m.weight}%</td>
                      <td style={S.td}>
                        {m.achievementPct != null
                          ? <span style={{ color: m.achievementPct >= 100 ? "#4CAF7D" : m.achievementPct >= 75 ? "#F5A623" : "#E5484D", fontWeight: 600 }}>{m.achievementPct.toFixed(0)}%</span>
                          : <span style={{ color: "#8A8272" }}>—</span>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
              {s.metrics.some(m => !m.computable) && (
                <div style={{ color: "#8A8272", fontSize: 10, marginTop: 6 }}>⚠ Italic-marked metrics come from outside the WMS (CS complaints, Audit Report, etc.) — Admin/Warehouse Lead can type in the % for this quarter.</div>
              )}
            </div>
          ))}
          {visibleScores.length === 0 && <EmptyNote text="No KPI data available for this role yet." />}
        </>
      )}
    </div>
  );
}

function ChangePasswordView({ token, showToast }) {
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    if (newPassword.length < 6) { showToast("Password kam se kam 6 characters ka ho", "err"); return; }
    if (newPassword !== confirmPassword) { showToast("Dono password match nahi ho rahe", "err"); return; }
    setBusy(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        method: "PUT",
        headers: { apikey: ANON_KEY, Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ password: newPassword })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.msg || data.error_description || data.error || "Failed");
      showToast("Password change ho gaya ✓");
      setNewPassword(""); setConfirmPassword("");
    } catch (e) {
      showToast(`Failed: ${(e.message || "").slice(0, 100)}`, "err");
    }
    setBusy(false);
  };

  return (
    <div>
      <SectionTitle title="Change Password" />
      <div style={{ ...S.panel, maxWidth: 420 }}>
        <div style={S.label}>NEW PASSWORD</div>
        <input type="password" style={S.input} value={newPassword} onChange={e => setNewPassword(e.target.value)} placeholder="Kam se kam 6 characters" />
        <div style={S.label}>CONFIRM NEW PASSWORD</div>
        <input type="password" style={S.input} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)}
          onKeyDown={e => e.key === "Enter" && submit()} placeholder="Dobara likhein" />
        <button style={{ ...S.primaryBtnSm, marginTop: 16, width: "100%", justifyContent: "center" }} onClick={submit} disabled={busy}>
          {busy ? "Saving…" : "🔑 Update Password"}
        </button>
      </div>
    </div>
  );
}

/* ================= CAMERA BARCODE SCANNER ================= */
function CameraScanModal({ onScan, onClose }) {
  const regionId = useRef("scan-region-" + Math.random().toString(36).slice(2, 9)).current;
  useEffect(() => {
    let scanner = null;
    let stopped = false;
    let cancelled = false;
    const timer = setTimeout(() => {
      if (cancelled) return;
      scanner = new Html5Qrcode(regionId);
      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 260, height: 160 } },
        (decodedText) => {
          if (stopped) return;
          stopped = true;
          scanner.stop().then(() => scanner.clear()).catch(() => {}).finally(() => onScan(decodedText));
        },
        () => {}
      ).catch(() => { onClose(); });
    }, 50);
    return () => {
      cancelled = true;
      clearTimeout(timer);
      if (scanner && !stopped) { stopped = true; scanner.stop().then(() => scanner.clear()).catch(() => {}); }
    };
  }, []);
  return (
    <div style={S.scanOverlay}>
      <div style={S.scanModal}>

function exportCSV(filename, headers, rows) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [headers.map(esc).join(","), ...rows.map(r => r.map(esc).join(","))].join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ================= helpers ================= */
// Add/subtract on-hand qty at a SPECIFIC bin (or the "unassigned" row when binId is null).
// activity is optional { type, userId } — when passed, stamps last_activity_type/by/at on the
// row so the Inventory Ledger can show who last touched a bin and with what kind of movement.
async function addOnHand(token, warehouseId, productId, binId, qtyDelta, activity) {
  const filter = binId
    ? `warehouse_id=eq.${warehouseId}&product_id=eq.${productId}&bin_id=eq.${binId}`
    : `warehouse_id=eq.${warehouseId}&product_id=eq.${productId}&bin_id=is.null`;
  const existing = await sb(`/rest/v1/inventory?${filter}&select=*`, { token });
  const stamp = activity ? { last_activity_type: activity.type, last_activity_by: activity.userId || null, last_activity_at: new Date().toISOString() } : {};
  if (existing && existing.length > 0) {
    const row = existing[0];
    const newQty = row.on_hand + qtyDelta;
    if (newQty <= 0) {
      await sb(`/rest/v1/inventory?id=eq.${row.id}`, { method: "PATCH", token, body: { on_hand: 0, ...stamp } });
    } else {
      await sb(`/rest/v1/inventory?id=eq.${row.id}`, { method: "PATCH", token, body: { on_hand: newQty, ...stamp } });
    }
  } else if (qtyDelta > 0) {
    await sb(`/rest/v1/inventory`, { method: "POST", token, body: { warehouse_id: warehouseId, product_id: productId, bin_id: binId, on_hand: qtyDelta, ...stamp } });
  }
}
// Adjust the reservation counter for a product (independent of any specific bin).
async function adjustReserved(token, warehouseId, productId, delta) {
  const existing = await sb(`/rest/v1/inventory_reserved?warehouse_id=eq.${warehouseId}&product_id=eq.${productId}&select=*`, { token });
  if (existing && existing.length > 0) {
    const newQty = Math.max(0, existing[0].reserved + delta);
    await sb(`/rest/v1/inventory_reserved?warehouse_id=eq.${warehouseId}&product_id=eq.${productId}`, { method: "PATCH", token, body: { reserved: newQty } });
  } else if (delta > 0) {
    await sb(`/rest/v1/inventory_reserved`, { method: "POST", token, body: { warehouse_id: warehouseId, product_id: productId, reserved: delta } });
  }
}
// Total on-hand across all bins for a product, and current reservation.
async function getStockSummary(token, warehouseId, productId) {
  const [rows, res, nonPickableBins] = await Promise.all([
    sb(`/rest/v1/inventory?warehouse_id=eq.${warehouseId}&product_id=eq.${productId}&select=*`, { token }),
    sb(`/rest/v1/inventory_reserved?warehouse_id=eq.${warehouseId}&product_id=eq.${productId}&select=*`, { token }),
    sb(`/rest/v1/bins?warehouse_id=eq.${warehouseId}&pickable=eq.false&select=id`, { token })
  ]);
  const nonPickableIds = new Set((nonPickableBins || []).map(b => b.id));
  // Damage/Quarantine bins are excluded here — their stock never counts as available
  // for order fulfillment, and never gets chosen as a source location for picking.
  const pickableRows = (rows || []).filter(r => !nonPickableIds.has(r.bin_id));
  const onHand = pickableRows.reduce((s, r) => s + r.on_hand, 0);
  const reserved = (res && res[0]) ? res[0].reserved : 0;
  return { rows: pickableRows, onHand, reserved, available: onHand - reserved };
}
// Splits a required qty across as many bins as needed (largest bin first) instead of assuming
// a single bin can cover the whole line — this is what lets Picking correctly send a picker to
// EVERY location a product is fragmented across, rather than over-allocating to just one.
function allocateAcrossBins(summaryRows, qtyNeeded) {
  const allocations = [];
  let remaining = qtyNeeded;
  const sorted = [...(summaryRows || [])].filter(r => r.on_hand > 0).sort((a, b) => b.on_hand - a.on_hand);
  for (const row of sorted) {
    if (remaining <= 0) break;
    const take = Math.min(row.on_hand, remaining);
    if (take > 0) { allocations.push({ bin_id: row.bin_id, qty: take }); remaining -= take; }
  }
  if (remaining > 0) allocations.push({ bin_id: null, qty: remaining }); // shortfall — no bin has it
  return allocations;
}
// Deducts qty from bins (largest bin first) when goods actually leave the warehouse (dispatch).
async function deductStock(token, warehouseId, productId, qty, activity) {
  const rows = (await sb(`/rest/v1/inventory?warehouse_id=eq.${warehouseId}&product_id=eq.${productId}&select=*&order=on_hand.desc`, { token })) || [];
  const stamp = activity ? { last_activity_type: activity.type, last_activity_by: activity.userId || null, last_activity_at: new Date().toISOString() } : {};
  let remaining = qty;
  for (const row of rows) {
    if (remaining <= 0) break;
    const take = Math.min(row.on_hand, remaining);
    if (take > 0) {
      await sb(`/rest/v1/inventory?id=eq.${row.id}`, { method: "PATCH", token, body: { on_hand: row.on_hand - take, ...stamp } });
      remaining -= take;
    }
  }
}

// A single derived STR status label used everywhere (status cards, list views, exports) — kept

const STK_STR_STAGES = ["Total Creation", "In Process", "Packing Process", "RTD", "Shipped"];
function stkStrStage(str) {

function stkBizDaysExclSunday(startISO, endISO) {
  if (!startISO || !endISO) return null;
  let d = new Date(startISO); d.setHours(0, 0, 0, 0);
  const end = new Date(endISO); end.setHours(0, 0, 0, 0);
  let days = 0;
  while (d < end) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0) days++; }
  return days;
}
function stkLineShort(l) { return Math.max(0, Number(l.demand_qty || 0) - (Number(l.ok_qty || 0) + Number(l.dmg_qty || 0) + Number(l.mnf_qty || 0) + Number(l.wrong_qty || 0))); }
function stkLineExceptionQty(l) { return Number(l.dmg_qty || 0) + Number(l.mnf_qty || 0) + Number(l.wrong_qty || 0) + Number(l.excess_qty || 0) + Number(l.short_qty || 0); }
// Stocking-module data is scoped to the "Stocking Warehouse" record itself, not to the

      // warehouse with many DCs never builds an in.(...) filter long enough to fail outright.
      const dcIds = (dcRows || []).map(d => d.id);
      const totals = {};
      const CHUNK = 100;
      for (let i = 0; i < dcIds.length; i += CHUNK) {
        const chunk = dcIds.slice(i, i + CHUNK);
        const lineRows = await sb(`/rest/v1/stk_dc_lines?dc_id=in.(${chunk.join(",")})&select=dc_id,ok_qty,dmg_qty,mnf_qty,wrong_qty,excess_qty,short_qty`, { token });
        for (const l of lineRows || []) {
          if (!totals[l.dc_id]) totals[l.dc_id] = { grnQty: 0, rtvQty: 0, trueDcQty: 0, hasInspection: false };
          totals[l.dc_id].grnQty += Number(l.ok_qty || 0);

          // The paper DC is a manual document — the real, reconciled DC Qty is whatever

          // at item level. Short/Excess already balance any gap or overage vs. what the paper
          // (or Odoo's imported "Quantity") claimed, so this total is the trustworthy figure.
          totals[l.dc_id].trueDcQty += Number(l.ok_qty || 0) + Number(l.dmg_qty || 0) + Number(l.mnf_qty || 0) + Number(l.wrong_qty || 0) + Number(l.short_qty || 0) + Number(l.excess_qty || 0);
          if (l.ok_qty !== null && l.ok_qty !== undefined) totals[l.dc_id].hasInspection = true;

  };

  const importOdooFile = async (file, dc, sourceChoice) => {
    setLoading(true);
    try {
      const rows = await parseSheet(file);
      const grouped = {}; let odooRef = ""; let supplierFromFile = ""; let poTotalDemand = 0;
      for (const r of rows) {
        const productRaw = r["Stock move/Product"] || r["Product"] || "";
        if (!productRaw) continue;
        odooRef = odooRef || r["Reference"] || "";
        supplierFromFile = supplierFromFile || r["Contact"] || "";
        const barcode = String(r["Stock move/Product/Internal Barcode"] ?? "").trim();
        // Same Odoo file carries BOTH figures: "Demand" is the full PO's ordered qty for this
        // line (same across every DC/transfer for this PO), "Quantity" is what's actually in
        // THIS specific DC. Using Quantity for both (as before) was the bug — Demand is what
        // sets the true PO Qty, Quantity is what sets this DC's own line qty.
        const dcQty = Number(r["Stock move/Quantity"] ?? r["Quantity"] ?? 0) || 0;
        const demandQty = Number(r["Stock move/Demand"] ?? r["Demand"] ?? dcQty) || 0;
        poTotalDemand += demandQty;
        const key = barcode || String(productRaw);
        if (!grouped[key]) grouped[key] = { product_barcode: barcode || null, product_name: String(productRaw), demand_qty: 0 };
        grouped[key].demand_qty += dcQty;
      }
      const lines = Object.values(grouped);
      if (!lines.length) { showToast("File mai koi valid line nahi mili", "err"); setLoading(false); return; }
      for (const l of lines) {
        await sb(`/rest/v1/stk_dc_lines`, { method: "POST", token, body: { dc_id: dc.id, product_barcode: l.product_barcode, product_name: l.product_name, demand_qty: l.demand_qty } });
      }
      // Auto-seed the catalogue from whatever this transfer already tells us (barcode + name).
      // ignore-duplicates so this NEVER overwrites a richer row that came from a full Catalogue
      // upload — it only fills in products the catalogue doesn't know about yet.
      const catalogueSeed = lines.filter(l => l.product_barcode).map(l => ({ internal_barcode: l.product_barcode, display_name: l.product_name }));
      if (catalogueSeed.length) {
        try { await sb(`/rest/v1/stk_products?on_conflict=internal_barcode`, { method: "POST", token, prefer: "resolution=ignore-duplicates,return=minimal", body: catalogueSeed }); } catch (e) { /* catalogue seed is best-effort */ }
      }
      await sb(`/rest/v1/stk_dc_arrivals?id=eq.${dc.id}`, { method: "PATCH", token, body: { status: "ready_for_inspection", odoo_reference: odooRef || null } });
      // PO Qty = this file's "Demand" total — same Odoo file used for every DC on this PO
      // already carries the full PO's Demand, so this is set (overwritten) directly, not
      // accumulated across DC imports. No separate template upload needed.
      const poPatch = { po_qty: poTotalDemand, ...(supplierFromFile ? { supplier: supplierFromFile } : {}), ...(sourceChoice ? { source: sourceChoice } : {}) };
      await sb(`/rest/v1/stk_purchase_orders?id=eq.${dc.po_id}`, { method: "PATCH", token, body: poPatch });
      setPos(ps => ps.map(p => p.id === dc.po_id ? { ...p, ...poPatch } : p));
      showToast(`${lines.length} lines import ho gayin — DC ${dc.dc_number} ab inspection k liye ready hai (PO Qty: ${poTotalDemand})`);
      loadAll();
    } catch (e) { showToast("Import fail: " + e.message, "err"); }
    setLoading(false);
  };

  const openPoDetail = async (po) => {
    setActivePoDetail({ po, dcRows: dcs.filter(d => d.po_id === po.id) });
  };

  const openDcForInspection = async (dc) => {
    setLoading(true);
    try {
      const lines = await sb(`/rest/v1/stk_dc_lines?dc_id=eq.${dc.id}&select=*&order=product_name.asc`, { token });
      setActiveDc(dc); setActiveLines(lines || []);
      if (dc.status === "ready_for_inspection") {
        await sb(`/rest/v1/stk_dc_arrivals?id=eq.${dc.id}`, { method: "PATCH", token, body: { status: "in_progress" } });
        setDcs(ds => ds.map(d => d.id === dc.id ? { ...d, status: "in_progress" } : d));
      }
    } catch (e) { showToast("Load fail: " + e.message, "err"); }
    setLoading(false);
  };

  const updateLineField = (lineId, field, value) => setActiveLines(ls => ls.map(l => l.id === lineId ? { ...l, [field]: value } : l));

  // Photo is saved the instant it's captured (not batched with "Save Progress") so it's never
  // lost if the inspector navigates away before saving quantities.
  const capturePhoto = async (lineId, file) => {
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      updateLineField(lineId, "photo_data_url", dataUrl);
      await sb(`/rest/v1/stk_dc_lines?id=eq.${lineId}`, { method: "PATCH", token, body: { photo_data_url: dataUrl } });
      showToast("✓ Photo save ho gayi");
    } catch (e) { showToast("Photo save fail: " + e.message, "err"); }
  };

  const saveInspectionProgress = async () => {
    setLoading(true);
    try {
      for (const l of activeLines) {
        const short = stkLineShort(l);
        await sb(`/rest/v1/stk_dc_lines?id=eq.${l.id}`, { method: "PATCH", token, body: { ok_qty: Number(l.ok_qty || 0), dmg_qty: Number(l.dmg_qty || 0), mnf_qty: Number(l.mnf_qty || 0), wrong_qty: Number(l.wrong_qty || 0), excess_qty: Number(l.excess_qty || 0), short_qty: short, comment: l.comment || null, filled_by: profile.id, updated_at: new Date().toISOString() } });
      }
      showToast("Inspection progress save ho gayi");
    } catch (e) { showToast("Save fail: " + e.message, "err"); }
    setLoading(false);
  };

  const addNewItemLine = async () => {
    if (!newItemName.trim()) { showToast("Item ka naam zaroori hai", "err"); return; }
    try {
      const created = await sb(`/rest/v1/stk_dc_lines`, { method: "POST", token, prefer: "return=representation", body: { dc_id: activeDc.id, product_barcode: newItemBarcode.trim() || null, product_name: newItemName.trim(), demand_qty: 0, excess_qty: Number(newItemExcess || 0), is_new_item: true, filled_by: profile.id } });
      setActiveLines(a => [...a, created[0]]);
      setNewItemName(""); setNewItemBarcode(""); setNewItemExcess("");
    } catch (e) { showToast("Add fail: " + e.message, "err"); }
  };

  const submitInspection = async () => {
    await saveInspectionProgress();
    try {
      await sb(`/rest/v1/stk_dc_arrivals?id=eq.${activeDc.id}`, { method: "PATCH", token, body: { status: "completed" } });
      showToast(`DC ${activeDc.dc_number} inspection submit ho gayi — Inbound Executive ki window mai ab Completed dikhega`);
      setActiveDc(null); setActiveLines([]);
      loadAll();
    } catch (e) { showToast("Submit fail: " + e.message, "err"); }
  };

  const openGrnDc = async (dc) => {
    const lines = await sb(`/rest/v1/stk_dc_lines?dc_id=eq.${dc.id}&select=*`, { token });
    setGrnDc(dc); setGrnLines(lines || []); setGrnNumberInput("");
  };

  const postGrn = async () => {
    if (!grnNumberInput.trim()) { showToast("Odoo GRN# enter karein", "err"); return; }
    setLoading(true);
    try {
      await sb(`/rest/v1/stk_dc_arrivals?id=eq.${grnDc.id}`, { method: "PATCH", token, body: { status: "grn_posted", grn_number: grnNumberInput.trim(), grn_posted_by: profile.id, grn_posted_at: new Date().toISOString() } });
      const supplierName = (pos.find(p => p.id === grnDc.po_id) || {}).supplier || "";
      for (const l of grnLines) {
        if (Number(l.ok_qty || 0) > 0) {
          await sb(`/rest/v1/stk_putaway_queue`, { method: "POST", token, body: { dc_line_id: l.id, dc_id: grnDc.id, po_id: grnDc.po_id, warehouse_id: whId, product_name: l.product_name, product_barcode: l.product_barcode, qty: l.ok_qty } });
        }
        if (stkLineExceptionQty(l) > 0) {
          await sb(`/rest/v1/stk_rtv_queue`, { method: "POST", token, body: { dc_line_id: l.id, dc_id: grnDc.id, po_id: grnDc.po_id, warehouse_id: whId, supplier: supplierName, product_name: l.product_name, product_barcode: l.product_barcode, dmg_qty: l.dmg_qty, mnf_qty: l.mnf_qty, wrong_qty: l.wrong_qty, excess_qty: l.excess_qty, short_qty: l.short_qty, demand_qty: l.demand_qty, ok_qty: l.ok_qty, photo_data_url: l.photo_data_url || null, comment: l.comment || null } });
        }
      }
      const allDcs = await sb(`/rest/v1/stk_dc_arrivals?po_id=eq.${grnDc.po_id}&select=*`, { token });
      const dcIds = allDcs.map(d => d.id).join(",");
      const allLines = dcIds ? await sb(`/rest/v1/stk_dc_lines?dc_id=in.(${dcIds})&select=demand_qty,ok_qty`, { token }) : [];
      const ordered = allLines.reduce((s, l) => s + Number(l.demand_qty || 0), 0);
      const received = allLines.reduce((s, l) => s + Number(l.ok_qty || 0), 0);
      const allPosted = allDcs.every(d => d.status === "grn_posted" || d.id === grnDc.id);
      const poStatus = (allPosted && ordered > 0 && received >= ordered) ? "completed" : "partial";
      await sb(`/rest/v1/stk_purchase_orders?id=eq.${grnDc.po_id}`, { method: "PATCH", token, body: { status: poStatus } });
      showToast(`✅ GRN ${grnNumberInput} post ho gayi — DC ${grnDc.dc_number} automatically Stocking Outbound tab mein forward ho gayi hai (Assignment k liye ready)`);
      setGrnDc(null); setGrnLines([]); setGrnNumberInput("");
      loadAll();
    } catch (e) { showToast("GRN post fail: " + e.message, "err"); }
    setLoading(false);
  };

  const pendingImportDcs = dcs.filter(d => d.status === "pending_import");
  const inspectionDcs = dcs.filter(d => d.status === "ready_for_inspection" || d.status === "in_progress");
  const completedDcs = dcs.filter(d => d.status === "completed");

  const isPhysicalReceiver = profile.role === "physical_receiver";
  const TABS = isPhysicalReceiver ? [{ key: "arrival", label: "Arrival" }] : [
    { key: "arrival", label: "Arrival" },
    { key: "import", label: `Odoo Import (${pendingImportDcs.length})` },
    { key: "inspection", label: `Inspection (${inspectionDcs.length})` },
    { key: "grn", label: `GRN (${completedDcs.length})` }
  ];

  return (
    <div>
      <SectionTitle title="Stocking Warehouse — Receiving" />
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        {TABS.map(t => <button key={t.key} onClick={() => { setTab(t.key); setActiveDc(null); setGrnDc(null); setActivePoDetail(null); }} style={stkPill(tab === t.key)}>{t.label}</button>)}
      </div>

      {tab === "arrival" && !activePoDetail && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Physical Arrival — PO + DC Flag</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <input style={{ ...S.input, flex: 1, minWidth: 140, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="PO Number (Odoo)" value={poNumber} onChange={e => setPoNumber(e.target.value)} />
            <input type="date" style={{ ...S.input, flex: 1, minWidth: 140 }} value={scheduledDate} onChange={e => setScheduledDate(e.target.value)} disabled={!!poByPo(poNumber)} />
            <input style={{ ...S.input, flex: 1, minWidth: 140, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="DC Number" value={dcNumber} onChange={e => setDcNumber(e.target.value)} />
            <input type="number" style={{ ...S.input, flex: 1, minWidth: 120 }} placeholder="DC Total Qty" value={dcQty} onChange={e => setDcQty(e.target.value)} />
            <button style={S.primaryBtnSm} onClick={addPoAndDc} disabled={loading || !whId}>+ Flag Arrival</button>
          </div>
          {poByPo(poNumber) && <div style={{ marginTop: 8, fontSize: 12, color: "#8A8272" }}>PO {poNumber} pehle se maujood hai — DC add karne se attach ho jayegi. Supplier/Source Odoo import se automatically aa jayega.</div>}
          <div style={{ marginTop: 18 }}>
            <div style={{ fontSize: 11, color: "#8A8272", marginBottom: 8, fontFamily: "'IBM Plex Mono', monospace" }}>RECENT ARRIVALS — PO# pe click kar k poori DC/GRN trail dekhein</div>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead><tr><th style={S.th}>PO#</th><th style={S.th}>Supplier</th><th style={S.th}>DC#</th><th style={S.th}>PO Qty</th><th style={S.th}>DC Qty</th><th style={S.th}>GRN Qty</th><th style={S.th}>RTV Qty</th><th style={S.th}>Status</th></tr></thead>
              <tbody>
                {dcs.slice(0, 10).map(d => {
                  const po = pos.find(p => p.id === d.po_id);
                  const totals = dcLineTotals[d.id] || { grnQty: 0, rtvQty: 0, trueDcQty: 0, hasInspection: false };
                  // Once Inspection has actually counted this DC, that reconciled total (Perfect
                  // + DMG + MNF + Wrong + Short + Excess) IS the real DC Qty — the manually
                  // typed figure at Arrival was only ever a rough paper-based estimate.
                  const displayDcQty = totals.hasInspection ? totals.trueDcQty : d.dc_qty_total;
                  const shortVsPO = po && Number(displayDcQty) < Number(po.po_qty || 0);
                  return (
                    <tr key={d.id}>
                      <td style={S.td}>{po ? <button style={{ background: "none", border: "none", color: "#F5A623", textDecoration: "underline", cursor: "pointer", fontFamily: "'IBM Plex Mono', monospace", padding: 0 }} onClick={() => openPoDetail(po)}>{po.po_number}</button> : "—"}</td>
                      <td style={S.td}>{po?.supplier || "— pending import"}</td>
                      <td style={S.td}>{d.dc_number}</td>
                      <td style={S.td}>{po?.po_qty || 0}</td>
                      <td style={{ ...S.td, color: shortVsPO ? "#E5484D" : "#2B2620", fontWeight: shortVsPO ? 600 : 400 }}>
                        {displayDcQty}{shortVsPO && " ⚠"}
                        {!totals.hasInspection && <span style={{ color: "#8A8272", fontSize: 10, marginLeft: 4 }}>(paper est.)</span>}
                      </td>
                      <td style={S.td}>{totals.grnQty}</td>
                      <td style={{ ...S.td, color: totals.rtvQty > 0 ? "#E5484D" : "#2B2620" }}>{totals.rtvQty}</td>
                      <td style={S.td}>{STK_DC_STATUS_LABEL[d.status]}</td>
                    </tr>
                  );
                })}
                {!dcs.length && <tr><td style={S.td} colSpan={8}><EmptyNote text="Abhi koi arrival nahi" /></td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab === "arrival" && activePoDetail && (
        <div style={S.panel}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={S.panelTitle}>PO {activePoDetail.po.po_number} — Complete Trail</div>
            <button style={S.secondaryBtnSm} onClick={() => setActivePoDetail(null)}>← Back to Arrivals</button>
          </div>
          <div style={S.statGrid}>
            {[["PO Qty (Total)", activePoDetail.po.po_qty || 0],
              ["DCs Received", activePoDetail.dcRows.length],
              ["Total DC Qty", activePoDetail.dcRows.reduce((s, d) => { const t = dcLineTotals[d.id]; return s + Number(t?.hasInspection ? t.trueDcQty : d.dc_qty_total || 0); }, 0)],
              ["Status", activePoDetail.po.status === "completed" ? "Completed" : activePoDetail.po.status === "partial" ? "Partial" : "Open"]
            ].map(([label, val]) => (
              <div key={label} style={S.statCard}>
                <div style={{ fontSize: 10, color: "#8A8272", letterSpacing: 0.5, fontFamily: "'IBM Plex Mono', monospace" }}>{label.toUpperCase()}</div>
                <div style={{ fontSize: 22, fontWeight: 700, color: "#2B2620", marginTop: 4 }}>{val}</div>
              </div>
            ))}
          </div>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr><th style={S.th}>DC#</th><th style={S.th}>DC Qty</th><th style={S.th}>GRN#</th><th style={S.th}>GRN Qty</th><th style={S.th}>RTV Qty</th><th style={S.th}>Status</th><th style={S.th}>Received At</th></tr></thead>
            <tbody>
              {activePoDetail.dcRows.map(d => {
                const totals = dcLineTotals[d.id] || { grnQty: 0, rtvQty: 0, trueDcQty: 0, hasInspection: false };
                return (
                  <tr key={d.id}>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace" }}>{d.dc_number}</td>
                    <td style={S.td}>{totals.hasInspection ? totals.trueDcQty : d.dc_qty_total}</td>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace", color: "#F5A623" }}>{d.grn_number || "—"}</td>
                    <td style={S.td}>{totals.grnQty}</td>
                    <td style={{ ...S.td, color: totals.rtvQty > 0 ? "#E5484D" : "#2B2620" }}>{totals.rtvQty}</td>
                    <td style={S.td}>{STK_DC_STATUS_LABEL[d.status]}</td>
                    <td style={{ ...S.td, fontSize: 11 }}>{fmtTime(d.received_at)}</td>
                  </tr>
                );
              })}
              {!activePoDetail.dcRows.length && <tr><td colSpan={7}><EmptyNote text="Is PO ki koi DC nahi mili" /></td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {tab === "import" && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Odoo Transfer Export → Import (SKU-wise lines)</div>
          <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 14 }}>Excel k "Contact" column se Supplier automatically fill ho jayega. Source (benchmark k liye) yahan select kar dein.</div>
          {!pendingImportDcs.length && <EmptyNote text="Import k liye koi DC pending nahi" />}
          {pendingImportDcs.map(d => {
            const po = pos.find(p => p.id === d.po_id);
            return (
              <div key={d.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "10px 0", borderBottom: "1px solid #EFE8D8", flexWrap: "wrap" }}>
                <div>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13 }}>{po?.po_number} — DC {d.dc_number}</div>
                  <div style={{ fontSize: 12, color: "#8A8272" }}>{po?.supplier || "Supplier: pending"} · Total qty {d.dc_qty_total}</div>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <select style={{ ...S.input, width: 110 }} value={importSourceChoice[d.id] || po?.source || "LOCAL"} onChange={e => setImportSourceChoice(sc => ({ ...sc, [d.id]: e.target.value }))}>
                    {STK_SOURCES.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                  <label style={{ ...S.secondaryBtnSm, cursor: "pointer" }}>
                    📤 Upload Odoo Excel
                    <input type="file" accept=".xlsx,.xls" style={{ display: "none" }} onChange={e => { const f = e.target.files[0]; if (f) importOdooFile(f, d, importSourceChoice[d.id] || po?.source || "LOCAL"); e.target.value = ""; }} />
                  </label>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {tab === "inspection" && !activeDc && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Shared Inspection Pool</div>
          {!inspectionDcs.length && <EmptyNote text="Koi DC inspection k liye ready nahi" />}
          <div style={S.cardGrid}>
            {inspectionDcs.map(d => {
              const po = pos.find(p => p.id === d.po_id);
              return (
                <div key={d.id} style={S.card} onClick={() => openDcForInspection(d)}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, fontWeight: 600 }}>{po?.po_number} — DC {d.dc_number}</div>
                  <div style={{ fontSize: 12, color: "#8A8272", marginTop: 4 }}>{po?.supplier} · {STK_DC_STATUS_LABEL[d.status]}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {tab === "inspection" && activeDc && (
        <div style={S.panel}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={S.panelTitle}>Inspecting DC {activeDc.dc_number} — Article-wise</div>
            <button style={S.secondaryBtnSm} onClick={() => { setActiveDc(null); setActiveLines([]); }}>← Back to pool</button>
          </div>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr>
              <th style={S.th}>Product</th><th style={S.th}>Demand</th><th style={S.th}>Perfect (OK)</th><th style={S.th}>DMG</th><th style={S.th}>MNF</th><th style={S.th}>Wrong</th><th style={S.th}>Excess</th><th style={S.th}>Short (auto)</th><th style={S.th}>Photo</th><th style={S.th}>Comment</th>
            </tr></thead>
            <tbody>
              {activeLines.map(l => (
                <tr key={l.id}>
                  <td style={S.td}>{l.product_name}{l.is_new_item && <span style={{ ...S.badgeSm, borderColor: "#5B9EE8", color: "#5B9EE8", marginLeft: 6 }}>NEW</span>}</td>
                  <td style={S.td}>{l.demand_qty}</td>
                  <td style={S.td}><input type="number" style={{ ...S.input, width: 70 }} value={l.ok_qty ?? ""} onChange={e => updateLineField(l.id, "ok_qty", e.target.value)} /></td>
                  <td style={S.td}><input type="number" style={{ ...S.input, width: 70 }} value={l.dmg_qty ?? ""} onChange={e => updateLineField(l.id, "dmg_qty", e.target.value)} /></td>
                  <td style={S.td}><input type="number" style={{ ...S.input, width: 70 }} value={l.mnf_qty ?? ""} onChange={e => updateLineField(l.id, "mnf_qty", e.target.value)} /></td>
                  <td style={S.td}><input type="number" style={{ ...S.input, width: 70 }} value={l.wrong_qty ?? ""} onChange={e => updateLineField(l.id, "wrong_qty", e.target.value)} /></td>
                  <td style={S.td}><input type="number" style={{ ...S.input, width: 70 }} value={l.excess_qty ?? ""} onChange={e => updateLineField(l.id, "excess_qty", e.target.value)} /></td>
                  <td style={S.td}>{stkLineShort(l)}</td>
                  <td style={S.td}>
                    {l.photo_data_url ? (
                      <img src={l.photo_data_url} alt="" style={{ width: 36, height: 36, objectFit: "cover", borderRadius: 4, cursor: "pointer" }} onClick={() => window.open(l.photo_data_url, "_blank")} />
                    ) : (
                      <label style={{ ...S.secondaryBtnSm, cursor: "pointer", padding: "4px 8px", fontSize: 11 }}>
                        📷
                        <input type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={e => { const f = e.target.files[0]; if (f) capturePhoto(l.id, f); e.target.value = ""; }} />
                      </label>
                    )}
                  </td>
                  <td style={S.td}><input style={{ ...S.input, width: 120, padding: "4px 8px", fontSize: 11 }} placeholder="Comment…" value={l.comment || ""} onChange={e => updateLineField(l.id, "comment", e.target.value)} /></td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 16, padding: "12px 0", borderTop: "1px solid #EFE8D8" }}>
            <input style={{ ...S.input, flex: 1, minWidth: 140 }} placeholder="Naya item — naam" value={newItemName} onChange={e => setNewItemName(e.target.value)} />
            <input style={{ ...S.input, flex: 1, minWidth: 120, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Barcode (optional)" value={newItemBarcode} onChange={e => setNewItemBarcode(e.target.value)} />
            <input type="number" style={{ ...S.input, width: 100 }} placeholder="Excess qty" value={newItemExcess} onChange={e => setNewItemExcess(e.target.value)} />
            <button style={S.secondaryBtnSm} onClick={addNewItemLine}>+ Add unmapped item</button>
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
            <button style={S.secondaryBtnSm} onClick={saveInspectionProgress} disabled={loading}>💾 Save Progress</button>
            <button style={S.primaryBtnSm} onClick={submitInspection} disabled={loading}>✓ Submit Inspection</button>
          </div>
        </div>
      )}

      {tab === "grn" && !grnDc && (
        <div style={S.panel}>
          <div style={S.panelTitle}>Completed Inspections — Pending GRN Post</div>
          {!completedDcs.length && <EmptyNote text="Koi DC GRN k liye pending nahi" />}
          <div style={S.cardGrid}>
            {completedDcs.map(d => {
              const po = pos.find(p => p.id === d.po_id);
              return (
                <div key={d.id} style={S.card} onClick={() => openGrnDc(d)}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, fontWeight: 600 }}>{po?.po_number} — DC {d.dc_number}</div>
                  <div style={{ fontSize: 12, color: "#8A8272", marginTop: 4 }}>{po?.supplier} · inspection complete</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {tab === "grn" && grnDc && (
        <div style={S.panel}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={S.panelTitle}>GRN — DC {grnDc.dc_number}</div>
            <button style={S.secondaryBtnSm} onClick={() => { setGrnDc(null); setGrnLines([]); }}>← Back</button>
          </div>
          <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 14 }}>
            <thead><tr><th style={S.th}>Product</th><th style={S.th}>Demand</th><th style={S.th}>OK (posted)</th><th style={S.th}>DMG</th><th style={S.th}>MNF</th><th style={S.th}>Wrong</th><th style={S.th}>Excess</th><th style={S.th}>Short</th></tr></thead>
            <tbody>
              {grnLines.map(l => <tr key={l.id}><td style={S.td}>{l.product_name}</td><td style={S.td}>{l.demand_qty}</td><td style={S.td}>{l.ok_qty}</td><td style={S.td}>{l.dmg_qty}</td><td style={S.td}>{l.mnf_qty}</td><td style={S.td}>{l.wrong_qty}</td><td style={S.td}>{l.excess_qty}</td><td style={S.td}>{l.short_qty}</td></tr>)}
            </tbody>
          </table>
          <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 10 }}>GRN post karte hi yeh DC automatically <strong>Stocking Outbound</strong> tab k "Assignment" mein chali jayegi — Outbound Executive ko koi alag se forward nahi karna padta.</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <input style={{ ...S.input, flex: 1, minWidth: 180, fontFamily: "'IBM Plex Mono', monospace" }} placeholder="Odoo GRN reference (posted manually)" value={grnNumberInput} onChange={e => setGrnNumberInput(e.target.value)} />
            <button style={S.primaryBtnSm} onClick={postGrn} disabled={loading}>✓ Mark GRN Complete → Forward to Putaway</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= STOCKING WAREHOUSE — RTV ================= */
// Deliberately NOT part of the on-hand inventory system — the exception qty here (DMG/MNF/
// Wrong/Excess/Short) never entered stk_putaway_queue in the first place (only OK qty does),
// so this is purely a tracking record of what's owed back to which supplier against which
// PO/DC. Grouped by DC: RTV Officer verifies the whole DC's items against the physical
// product + inspector's photos/comments, prints a sign-off sheet, then marks it handed over —
// all tracked right here, which Inbound Executive can also see (same "stkrtv" screen).
function StockingRtvView({ token, profile, showToast }) {
  const whId = useStkWarehouseId(token, profile);
  const canHandle = ["admin", "warehouse_lead", "rtv_officer"].includes(profile.role);
  const [rtvRows, setRtvRows] = useState([]);
  const [pos, setPos] = useState([]);
  const [dcs, setDcs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [activeDcId, setActiveDcId] = useState(null);
  const [verifying, setVerifying] = useState(false);
  const [handingOver, setHandingOver] = useState(false);
  const [printing, setPrinting] = useState(false);
  const [rtvSearch, setRtvSearch] = useState("");
  const [exportingExcel, setExportingExcel] = useState(false);

  const load = async () => {
    if (!whId) return;
    setLoading(true);
    try {
      const [rtv, poRows, dcRows] = await Promise.all([
        sb(`/rest/v1/stk_rtv_queue?warehouse_id=eq.${whId}&select=*&order=created_at.desc`, { token }),
        sb(`/rest/v1/stk_purchase_orders?warehouse_id=eq.${whId}&select=*`, { token }),
        sb(`/rest/v1/stk_dc_arrivals?warehouse_id=eq.${whId}&select=*`, { token })
      ]);
      setRtvRows(rtv || []); setPos(poRows || []); setDcs(dcRows || []);
    } catch (e) { showToast("Load fail: " + e.message, "err"); }
    setLoading(false);
  };
  useEffect(() => { load(); }, [whId]);

  const dcById = (id) => dcs.find(d => d.id === id);
  const poById = (id) => pos.find(p => p.id === id);
  const rowsForDc = (dcId) => rtvRows.filter(r => r.dc_id === dcId);
  const dcStage = (dcId) => {
    const rows = rowsForDc(dcId);
    if (!rows.length) return "pending";
    if (rows.every(r => r.status === "handed_over")) return "handed_over";
    if (rows.every(r => r.status === "verified" || r.status === "handed_over")) return "verified";
    return "pending";
  };
  const dcGroups = [...new Set(rtvRows.map(r => r.dc_id))].filter(dcId => {
    if (!rtvSearch.trim()) return true;
    const q = rtvSearch.trim().toLowerCase();
    const dc = dcById(dcId); const po = poById(dc?.po_id);
    const rows = rowsForDc(dcId);
    return (rows[0]?.supplier || "").toLowerCase().includes(q) || (po?.po_number || "").toLowerCase().includes(q) || (dc?.dc_number || "").toLowerCase().includes(q);
  });
  const activeRows = activeDcId ? rowsForDc(activeDcId) : [];
  const activeDc = activeDcId ? dcById(activeDcId) : null;
  const activePo = activeDc ? poById(activeDc.po_id) : null;
  const activeStage = activeDcId ? dcStage(activeDcId) : null;

  const verifyDc = async () => {
    if (!window.confirm("Confirm karein — sab items physical product se verify ho chuke hain, koi error nahi mila?")) return;
    setVerifying(true);
    try {
      const now = new Date().toISOString();
      for (const r of activeRows) {
        await sb(`/rest/v1/stk_rtv_queue?id=eq.${r.id}`, { method: "PATCH", token, body: { status: "verified", verified_by: profile.id, verified_at: now } });
      }
      showToast("✓ Verify ho gaya — Inbound Executive ki screen pe bhi 'Verified' status dikhega");
      load();
    } catch (e) { showToast("Verify fail: " + e.message, "err"); }
    setVerifying(false);
  };

  const markHandedOver = async () => {
    setHandingOver(true);
    try {
      const now = new Date().toISOString();
      for (const r of activeRows) {
        await sb(`/rest/v1/stk_rtv_queue?id=eq.${r.id}`, { method: "PATCH", token, body: { status: "handed_over", handed_over_by: profile.id, handed_over_at: now } });
      }
      showToast("✓ Handed Over mark ho gaya");
      setActiveDcId(null);
      load();
    } catch (e) { showToast("Update fail: " + e.message, "err"); }
    setHandingOver(false);
  };

  const printHandoverDoc = async () => {
    setPrinting(true);
    try {
      // "PO Qty" = total demand across every DC under this PO for the same product
      // (vs "DC Qty" = just this DC's own line) — needs the sibling DCs' lines.
      const siblingDcs = await sb(`/rest/v1/stk_dc_arrivals?po_id=eq.${activeDc.po_id}&select=id`, { token });
      const dcIds = (siblingDcs || []).map(d => d.id);
      const allLines = dcIds.length ? await sb(`/rest/v1/stk_dc_lines?dc_id=in.(${dcIds.join(",")})&select=product_barcode,product_name,demand_qty`, { token }) : [];
      const poQtyByProduct = {};
      for (const l of allLines || []) {
        const key = l.product_barcode || l.product_name;
        poQtyByProduct[key] = (poQtyByProduct[key] || 0) + Number(l.demand_qty || 0);
      }
      let rowsHtml = "";
      let sumPoQty = 0, sumDcQty = 0, sumGrnQty = 0, sumMnf = 0, sumWrong = 0, sumDmg = 0, sumShort = 0, sumExcess = 0;
      for (const r of activeRows) {
        const key = r.product_barcode || r.product_name;
        const poQty = poQtyByProduct[key] ?? 0;
        sumPoQty += poQty; sumDcQty += Number(r.demand_qty || 0); sumGrnQty += Number(r.ok_qty || 0);
        sumMnf += Number(r.mnf_qty || 0); sumWrong += Number(r.wrong_qty || 0); sumDmg += Number(r.dmg_qty || 0); sumShort += Number(r.short_qty || 0); sumExcess += Number(r.excess_qty || 0);
        const photoCell = r.photo_data_url ? `<img src="${r.photo_data_url}" style="width:44px;height:44px;object-fit:cover;border-radius:4px" />` : "—";
        rowsHtml += `<tr><td>${r.product_name}</td><td style="text-align:right">${poQty}</td><td style="text-align:right">${r.demand_qty ?? "—"}</td><td style="text-align:right">${r.ok_qty ?? "—"}</td><td style="text-align:right">${r.mnf_qty}</td><td style="text-align:right">${r.wrong_qty}</td><td style="text-align:right">${r.dmg_qty}</td><td style="text-align:right">${r.short_qty}</td><td style="text-align:right">${r.excess_qty}</td><td>${photoCell}</td><td>${r.comment || "—"}</td></tr>`;
      }
      const sumRtvQty = sumMnf + sumWrong + sumDmg + sumShort + sumExcess;
      const w = window.open("", "_blank");
      w.document.write(`<html><head><title>RTV Handover — ${activePo?.po_number || ""} / ${activeDc?.dc_number || ""}</title><style>
        body{font-family:Arial;padding:24px;color:#111}
        .header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1A1206;padding-bottom:14px;margin-bottom:14px}
        .brand{font-size:20px;font-weight:800;letter-spacing:1px}
        .gp-title{font-size:14px;color:#555;margin-top:4px}
        .meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 24px;font-size:13px;margin-bottom:18px}
        .meta-grid span{color:#555}
        .summary{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
        .summary .card{flex:1;min-width:110px;border:1px solid #ddd;border-radius:8px;padding:10px 14px;background:#FAFAFA}
        .summary .card .label{font-size:10px;letter-spacing:.5px;color:#888;text-transform:uppercase}
        .summary .card .value{font-size:22px;font-weight:800;color:#1A1206}
        .summary .card.warn{background:#FFF3F3;border-color:#E5484D}
        .summary .card.warn .value{color:#E5484D}
        .breakdown{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;font-size:12px}
        .breakdown span{background:#F0EAD8;border-radius:14px;padding:5px 12px}
        table{width:100%;border-collapse:collapse;margin-top:6px} th,td{border:1px solid #999;padding:7px 9px;font-size:12px;text-align:left}
        th{background:#F5A623;color:#1A1206}
        .sign{margin-top:60px;display:flex;justify-content:space-between}
        .sign div{border-top:1px solid #333;width:200px;text-align:center;padding-top:6px;font-size:12px}
      </style></head><body>
        <div class="header">
          <div><div class="brand">MUGHAL FULFILLMENT WAREHOUSE</div><div class="gp-title">RTV Handover — Sign-off Sheet</div></div>
        </div>
        <div class="meta-grid">
          <div><span>Supplier:</span> ${activeRows[0]?.supplier || "—"}</div>
          <div><span>PO#:</span> ${activePo?.po_number || "—"}</div>
          <div><span>DC#:</span> ${activeDc?.dc_number || "—"}</div>
        </div>
        <div class="summary">
          <div class="card"><div class="label">PO Qty</div><div class="value">${sumPoQty}</div></div>
          <div class="card"><div class="label">DC Qty</div><div class="value">${sumDcQty}</div></div>
          <div class="card"><div class="label">GRN Qty</div><div class="value">${sumGrnQty}</div></div>
          <div class="card warn"><div class="label">RTV Qty</div><div class="value">${sumRtvQty}</div></div>
        </div>
        <div class="breakdown">
          <span>MNF: <strong>${sumMnf}</strong></span>
          <span>Wrong: <strong>${sumWrong}</strong></span>
          <span>Damage: <strong>${sumDmg}</strong></span>
          <span>Short: <strong>${sumShort}</strong></span>
          <span>Excess: <strong>${sumExcess}</strong></span>
        </div>
        <table><thead><tr><th>Product</th><th>PO Qty</th><th>DC Qty</th><th>Perfect (OK)</th><th>MNF</th><th>Wrong</th><th>Damage</th><th>Short</th><th>Excess</th><th>Photo</th><th>Comment</th></tr></thead><tbody>${rowsHtml}</tbody></table>
        <div class="sign"><div>RTV Officer</div><div>Supplier Representative</div><div>Warehouse Lead</div></div>
      </body></html>`);
      w.document.close(); w.print();
    } catch (e) { showToast("Print fail: " + e.message, "err"); }
    setPrinting(false);
  };

  const exportRtvExcel = async () => {
    setExportingExcel(true);
    try {
      const siblingDcs = await sb(`/rest/v1/stk_dc_arrivals?po_id=eq.${activeDc.po_id}&select=id`, { token });
      const dcIds = (siblingDcs || []).map(d => d.id);
      const allLines = dcIds.length ? await sb(`/rest/v1/stk_dc_lines?dc_id=in.(${dcIds.join(",")})&select=product_barcode,product_name,demand_qty`, { token }) : [];
      const poQtyByProduct = {};
      for (const l of allLines || []) {
        const key = l.product_barcode || l.product_name;
        poQtyByProduct[key] = (poQtyByProduct[key] || 0) + Number(l.demand_qty || 0);
      }
      let sumPoQty = 0, sumDcQty = 0, sumGrnQty = 0, sumMnf = 0, sumWrong = 0, sumDmg = 0, sumShort = 0, sumExcess = 0;
      const detailRows = activeRows.map(r => {
        const key = r.product_barcode || r.product_name;
        const poQty = poQtyByProduct[key] ?? 0;
        sumPoQty += poQty; sumDcQty += Number(r.demand_qty || 0); sumGrnQty += Number(r.ok_qty || 0);
        sumMnf += Number(r.mnf_qty || 0); sumWrong += Number(r.wrong_qty || 0); sumDmg += Number(r.dmg_qty || 0); sumShort += Number(r.short_qty || 0); sumExcess += Number(r.excess_qty || 0);
        return { "Product": r.product_name, "Barcode": r.product_barcode || "", "PO Qty": poQty, "DC Qty": r.demand_qty ?? 0, "GRN (OK) Qty": r.ok_qty ?? 0, "MNF": r.mnf_qty, "Wrong": r.wrong_qty, "Damage": r.dmg_qty, "Short": r.short_qty, "Excess": r.excess_qty, "Comment": r.comment || "", "Has Photo": r.photo_data_url ? "Yes" : "No" };
      });
      const summaryRows = [
        { "Metric": "Supplier", "Value": activeRows[0]?.supplier || "—" },
        { "Metric": "PO#", "Value": activePo?.po_number || "—" },
        { "Metric": "DC#", "Value": activeDc?.dc_number || "—" },
        { "Metric": "PO Qty", "Value": sumPoQty },
        { "Metric": "DC Qty", "Value": sumDcQty },
        { "Metric": "GRN Qty", "Value": sumGrnQty },
        { "Metric": "RTV Qty (total)", "Value": sumMnf + sumWrong + sumDmg + sumShort + sumExcess },
        { "Metric": "— MNF", "Value": sumMnf },
        { "Metric": "— Wrong", "Value": sumWrong },
        { "Metric": "— Damage", "Value": sumDmg },
        { "Metric": "— Short", "Value": sumShort },
        { "Metric": "— Excess", "Value": sumExcess }
      ];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows), "Summary");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detailRows), "Detail");
      XLSX.writeFile(wb, `RTV_${activePo?.po_number || "PO"}_${activeDc?.dc_number || "DC"}.xlsx`);
      showToast("✓ Excel export ho gaya (photos sirf PDF/Print export mein milti hain)");
    } catch (e) { showToast("Excel export fail: " + e.message, "err"); }
    setExportingExcel(false);
  };

  if (loading) return <EmptyNote text="Loading..." />;

  return (
    <div>
      <SectionTitle title="Stocking Warehouse — RTV" />
      <div style={{ fontSize: 12, color: "#8A8272", marginBottom: 16 }}>Yeh inventory system ka hissa nahi hai — sirf ek record hai ke kis supplier ko, kis PO/DC k against, kitna stock wapas jana hai (jab tak handover na ho, tab tak yahi track hoti hai).</div>

      {!activeDcId && (
        <div style={S.panel}>
          <div style={S.panelTitle}>RTV by DC</div>
          <input style={{ ...S.input, maxWidth: 320, marginBottom: 14 }} placeholder="🔍 Search supplier, PO#, DC#…" value={rtvSearch} onChange={e => setRtvSearch(e.target.value)} />
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr><th style={S.th}>Supplier</th><th style={S.th}>PO#</th><th style={S.th}>DC#</th><th style={S.th}>Items</th><th style={S.th}>Status</th><th style={S.th}></th></tr></thead>
            <tbody>
              {dcGroups.map(dcId => {
                const rows = rowsForDc(dcId);
                const dc = dcById(dcId); const po = poById(dc?.po_id);
                const stage = dcStage(dcId);
                return (
                  <tr key={dcId}>
                    <td style={S.td}>{rows[0]?.supplier}</td>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace" }}>{po?.po_number}</td>
                    <td style={{ ...S.td, fontFamily: "'IBM Plex Mono', monospace" }}>{dc?.dc_number}</td>
                    <td style={S.td}>{rows.length}</td>
                    <td style={S.td}>
                      <span style={{ ...S.badgeSm, color: stage === "handed_over" ? "#4CAF7D" : stage === "verified" ? "#5B9EE8" : "#E5484D", borderColor: stage === "handed_over" ? "#4CAF7D" : stage === "verified" ? "#5B9EE8" : "#E5484D" }}>
                        {stage === "handed_over" ? "Handed Over" : stage === "verified" ? "Verified — Ready for Handover" : "Pending Review"}
                      </span>
                    </td>
                    <td style={S.td}><button style={S.secondaryBtnSm} onClick={() => setActiveDcId(dcId)}>Open</button></td>
                  </tr>
                );
              })}
              {!dcGroups.length && <tr><td style={S.td} colSpan={6}><EmptyNote text="Koi RTV record nahi hai" /></td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {activeDcId && (
        <div style={S.panel}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={S.panelTitle}>{activePo?.po_number} — DC {activeDc?.dc_number} ({activeRows[0]?.supplier})</div>
            <button style={S.secondaryBtnSm} onClick={() => setActiveDcId(null)}>← Back to list</button>
          </div>
          <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 16 }}>
            <thead><tr><th style={S.th}>Product</th><th style={S.th}>DC Qty</th><th style={S.th}>Perfect (OK)</th><th style={S.th}>DMG</th><th style={S.th}>MNF</th><th style={S.th}>Wrong</th><th style={S.th}>Excess</th><th style={S.th}>Short</th><th style={S.th}>Photo</th><th style={S.th}>Comment</th></tr></thead>
            <tbody>
              {activeRows.map(r => (
                <tr key={r.id}>
                  <td style={S.td}>{r.product_name}</td>
                  <td style={S.td}>{r.demand_qty ?? "—"}</td>
                  <td style={S.td}>{r.ok_qty ?? "—"}</td>
                  <td style={S.td}>{r.dmg_qty}</td><td style={S.td}>{r.mnf_qty}</td><td style={S.td}>{r.wrong_qty}</td><td style={S.td}>{r.excess_qty}</td><td style={S.td}>{r.short_qty}</td>
                  <td style={S.td}>{r.photo_data_url ? <img src={r.photo_data_url} alt="" style={{ width: 36, height: 36, objectFit: "cover", borderRadius: 4, cursor: "pointer" }} onClick={() => window.open(r.photo_data_url, "_blank")} /> : "—"}</td>
                  <td style={{ ...S.td, fontSize: 11, color: "#6B6355" }}>{r.comment || "—"}</td>
                </tr>
              ))}
            </tbody>
          </table>

          {activeStage === "pending" && canHandle && (
            <button style={S.primaryBtnSm} onClick={verifyDc} disabled={verifying}>{verifying ? "Verify ho raha…" : "✓ Verify All (Physical Product Se Match Ho Gaya)"}</button>
          )}
          {activeStage === "pending" && !canHandle && (
            <div style={{ color: "#8A8272", fontSize: 12 }}>⏳ RTV Officer ki verification ka intezar hai.</div>
          )}
          {activeStage === "verified" && canHandle && (
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              <button style={S.secondaryBtnSm} onClick={printHandoverDoc} disabled={printing}>{printing ? "Printing…" : "🖨 Export PDF (with Photos)"}</button>
              <button style={S.secondaryBtnSm} onClick={exportRtvExcel} disabled={exportingExcel}>{exportingExcel ? "Exporting…" : "📊 Export Excel"}</button>
              <button style={S.primaryBtnSm} onClick={markHandedOver} disabled={handingOver}>{handingOver ? "Update ho raha…" : "✓ Mark Handed Over (Sign-off Ho Gaya)"}</button>
            </div>
          )}
          {activeStage === "verified" && !canHandle && (
            <div style={{ color: "#5B9EE8", fontSize: 12 }}>✓ Verified — RTV Officer handover prepare kar raha hai.</div>
          )}
          {activeStage === "handed_over" && (
            <div style={{ color: "#4CAF7D", fontSize: 12 }}>✅ Handed over ho chuka hai.</div>
          )}
        </div>
      )}
    </div>
  );
}

/* ================= STOCKING WAREHOUSE — CATALOGUE ================= */
function StockingCatalogueView({ token, profile, showToast }) {
  const [catalogueCount, setCatalogueCount] = useState(null);
  const [catalogueUploading, setCatalogueUploading] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/stk_products?select=id`, { headers: { apikey: ANON_KEY, Authorization: `Bearer ${token}`, Prefer: "count=exact", Range: "0-0" } });
        const range = res.headers.get("content-range");
        setCatalogueCount(range ? parseInt(range.split("/")[1], 10) || 0 : 0);
      } catch (e) { /* non-critical */ }
    })();
  }, []);

  const uploadCatalogueFile = async (file) => {
    setCatalogueUploading(true);
    try {
      const rows = await parseSheet(file);
      const cleanNum = (v) => { const n = Number(String(v ?? "").replace(/,/g, "").trim()); return isNaN(n) ? null : n; };
      const mapped = rows
        .map(r => ({
          department: String(r["Department"] ?? "").trim() || null,
          division: String(r["Division"] ?? "").trim() || null,
          group_name: String(r["Group"] ?? "").trim() || null,
          category: String(r["Product Category"] ?? "").trim() || null,
          sale_barcode: String(r["Product/Sale Barcode"] ?? "").trim() || null,
          internal_barcode: String(r["Internal Barcode"] ?? "").trim(),
          internal_reference: String(r["Internal Reference"] ?? "").trim() || null,
          display_name: String(r["Display Name"] ?? "").trim() || null,
          sales_price: cleanNum(r["Sales Price"]),
          odoo_qty_on_hand: cleanNum(r["Quantity On Hand"]),
